var canHist = false; /* 앱 안에서는 브라우저 기록을 쓰지 않고 자체 스택으로 이동 */

function valid(r){
  if (r === '' || r === 'rules' || r === 'mn') return true;
  var m = /^([sc])(\d{1,2})$/.exec(r);
  if (!m) return false;
  var n = +m[2];
  if (m[1] === 's') return SEC.has(n) && SEC.get(n).notes.length > 0;
  return CH.has(n) && n !== 77;
}
function hashRoute(){
  var r = (location.hash || '').replace(/^#/, '');
  if (r === 'home') r = '';
  return valid(r) ? r : '';
}
function setHist(method, r){
  if (!canHist) return;
  try { history[method]({hs:r}, '', '#' + (r || 'home')); } catch(e){ canHist = false; }
}
function nav(r){
  if (!valid(r) || r === route) return;
  st(route).y = window.scrollY;
  stack.push(r);
  setHist('pushState', r);
  try { if (parent !== window && parent.hsPushed) parent.hsPushed(); } catch(e){}
  render(r, 'fwd');
}
function back(){
  if (stack.length <= 1) return;
  try { if (parent !== window && parent.hsReqBack) { parent.hsReqBack(); return; } } catch(e){}
  backNow();
}
function backNow(){
  if (stack.length <= 1) return;
  if (canHist) { try { history.back(); return; } catch(e){ canHist = false; } }
  st(route).y = window.scrollY;
  stack.pop();
  render(stack[stack.length - 1], 'back');
}
window.addEventListener('popstate', function(e){
  var r = e.state && typeof e.state.hs === 'string' ? e.state.hs : hashRoute();
  if (!valid(r)) r = '';
  st(route).y = window.scrollY;
  var i = stack.lastIndexOf(r);
  if (i >= 0) stack = stack.slice(0, i + 1); else stack.push(r);
  render(r, i >= 0 ? 'back' : 'fwd');
});
/* 위 뒤로 버튼: 관세율표 첫 화면으로 바로 */
function depth(){ return (hdPop ? 1 : 0) + stack.length - 1; }
window.hsDepth = depth;
function goHome(){
  var n = depth(); if (!n) return;
  try { if (parent !== window && parent.hsReqBackN) { parent.hsReqBackN(n); return; } } catch(e){}
  closeHd(); while (stack.length > 1) stack.pop(); render('', 'back');
}
backBtn.addEventListener('click', goHome);
window.hsBack = function(){ if (hdPop) { closeHd(); return true; } if (stack.length > 1) { backNow(); return true; } return false; };
window.hsGo = function(r){ nav(r); };
window.hsStack = function(){ return stack.slice(1); };
document.addEventListener('click', function(){ try { if (parent !== window && parent.autoFs) parent.autoFs(); } catch(e){} }, true);

var FS = [14.5, 16, 17.5], FS_NAME = ['보통', '크게', '더 크게'];
var fsIdx = parseInt(store.get('hs-fs'), 10);
if (!(fsIdx >= 0 && fsIdx < FS.length)) fsIdx = 1;
function applyFs(){
  document.documentElement.style.setProperty('--root-fs', FS[fsIdx] + 'px');
  fsBtn.setAttribute('aria-label', '글자 크기: ' + FS_NAME[fsIdx] + ' (누르면 변경)');
}
fsBtn.addEventListener('click', function(){ fsIdx = (fsIdx + 1) % FS.length; store.set('hs-fs', String(fsIdx)); applyFs(); });
applyFs();

function syncBar(){
  bar.classList.toggle('lined', window.scrollY > 4);
  if (route === '') barTitle.textContent = window.scrollY > 70 ? '관세율표' : '';
}
window.addEventListener('scroll', syncBar, {passive:true});

function render(r, dir){
  route = r;
  view.textContent = '';
  var appEl = document.querySelector('.app'); if (appEl) appEl.classList.toggle('wide', r !== '');
  var node;
  if (r === '') node = renderHome();
  else if (r === 'rules') node = renderRules();
  else if (r === 'mn') node = renderMn();
  else if (r[0] === 's') node = renderSection(+r.slice(1));
  else node = renderChapter(+r.slice(1));
  view.append(node);
  backBtn.hidden = stack.length <= 1;
  view.classList.remove('fwd', 'back');
  if (dir) { void view.offsetWidth; view.classList.add(dir); }
  var y = dir === 'back' ? st(r).y : 0;
  window.scrollTo(0, y);
  requestAnimationFrame(function(){ window.scrollTo(0, y); syncBar(); });
  syncBar();
}

/* ---------- note list ---------- */
function noteList(ctx, notes, rkey){
  var state = st(rkey);
  var wrap = h('div');
  var items = [];
  function makeItem(n, idx){
    var id = rkey + '-' + idx;
    var lab = labelOf(ctx, n);
    var kcls = ctx.type === 'rules' ? 'r' : n[0];
    var title = ctx.type === 'rules' ? n[1] : n[2];
    var body = h('div', {class:'nb', id:'b-' + id, hidden:true});
    var btn = h('button', {class:'nh', type:'button', 'aria-expanded':'false', 'aria-controls':'b-' + id},
      h('span', {class:'lab ' + kcls}, lab),
      h('span', {class:'nt'}, title),
      svg(CHEV, 'chev'));
    var built = false;
    function setOpen(open){
      if (open && !built) {
        built = true;
        body.append(h('p', {class:'meta'}, metaOf(ctx, n)));
        var blocks = ctx.type === 'rules' ? n[2] : n[3];
        mnBlocks(blocks).forEach(function(b){ body.append(blockEl(b)); });
        var ex = ctx.type === 'rules' ? null : n[4];
        if (ex && ex.a) body.append(h('div', {class:'ann'}, h('b', null, '참고'), ex.a));
      }
      body.hidden = !open;
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      if (open) state.open[id] = 1; else delete state.open[id];
    }
    btn.addEventListener('click', function(){ setOpen(btn.getAttribute('aria-expanded') !== 'true'); syncAll(); });
    var item = h('div', {class:'note'}, btn, body);
    items.push({setOpen:setOpen, btn:btn});
    if (state.open[id]) setOpen(true);
    return item;
  }

  var counts = {n:0, s:0, d:0};
  if (ctx.type !== 'rules') notes.forEach(function(n){ counts[n[0]]++; });
  var sum = ctx.type === 'rules' ? '제1호 ~ 제' + notes.length + '호'
    : ['n','s','d'].filter(function(k){ return counts[k]; }).map(function(k){
        return (ctx.type === 'sec' && k === 'n' ? '부 주' : kindName(k)) + ' ' + counts[k]; }).join(' · ');
  var allBtn = h('button', {class:'lnk', type:'button'}, '모두 펼치기');
  function syncAll(){
    var anyClosed = items.some(function(it){ return it.btn.getAttribute('aria-expanded') !== 'true'; });
    allBtn.textContent = anyClosed ? '모두 펼치기' : '모두 접기';
  }
  allBtn.addEventListener('click', function(){
    var anyClosed = items.some(function(it){ return it.btn.getAttribute('aria-expanded') !== 'true'; });
    items.forEach(function(it){ it.setOpen(anyClosed); });
    syncAll();
  });
  wrap.append(h('div', {class:'list-top'}, h('span', {class:'sum'}, sum), allBtn));

  var list = h('div', {class:'notes'});
  if (ctx.type === 'rules') {
    notes.forEach(function(n, i){ list.append(makeItem(n, i)); });
    wrap.append(list);
  } else {
    var order = ['n', 's', 'd'];
    var groups = order.filter(function(k){ return counts[k]; });
    notes.forEach(function(n, i){ n._i = i; });
    groups.forEach(function(k){
      var name = ctx.type === 'sec' && k === 'n' ? '부 주' : kindName(k);
      if (groups.length > 1 || k !== 'n') list.append(h('div', {class:'grp'}, name));
      notes.filter(function(n){ return n[0] === k; }).forEach(function(n){ list.append(makeItem(n, n._i)); });
    });
    wrap.append(list);
  }
  syncAll();
  return wrap;
}

/* ---------- 주규정 암기식 모아보기 ---------- */
var MNLIST = (function(){
  var out = [];
  function scan(ctx, notes, rkey, secNo){
    notes.forEach(function(n, i){
      var rows = (n[3] || []).filter(function(b){ return b && b[0] === 'M'; });
      if (!rows.length) return;
      out.push({ctx:ctx, n:n, id:rkey + '-' + i, rkey:rkey, sec:secNo,
        rows: rows.map(function(b){ var t = mnToks(b[2]); return {cs: t.length ? t : [b[2]], note: b[3] || ''}; })});
    });
  }
  D.secs.forEach(function(sv){
    var sno = sv[0], s = SEC.get(sno);
    scan({type:'sec', no:sno}, s.notes, 's' + sno, sno);
    s.chs.forEach(function(cn){ var c = CH.get(cn); if (c && cn !== 77) scan({type:'ch', no:cn}, c.notes, 'c' + cn, sno); });
  });
  return out;
})();

/* 호의 용어: 콤마(괄호 밖) → 줄 바꿈 · '·'는 같은 줄 · 단서(다만) → 줄 바꿈 */
function termLines(t){
  var out = [], cur = '', dep = 0;
  for (var i = 0; i < t.length; i++) {
    var ch = t[i];
    if (ch === '(' || ch === '[') dep++;
    if (ch === ')' || ch === ']') dep = Math.max(0, dep - 1);
    if (t.substr(i, 3) === '다만,' && cur.trim()) { out.push(cur.trim()); cur = ''; }
    if (ch === ',' && dep === 0) { out.push((cur + ',').trim()); cur = ''; continue; }
    cur += ch;
  }
  if (cur.trim()) out.push(cur.trim());
  return out;
}
function termEl(t, mk){
  /* mk = [두문자, 시작 위치, 길이] → 원문의 그 글자를 빨간색으로 */
  if (mk && mk[1] >= 0 && mk[2] > 0) t = t.slice(0, mk[1]) + '\uE020' + t.slice(mk[1], mk[1] + mk[2]) + '\uE021' + t.slice(mk[1] + mk[2]);   /* E000~E00F는 기존 형광 표시가 씀 */
  var w = h('div', {class:'tl'});
  termLines(t).forEach(function(l){ var sp = h('span', /^다만/.test(l) ? {class:'pv'} : null); sp.innerHTML = fmt(l).replace(/\uE020/g, '<span class="mnr">').replace(/\uE021/g, '</span>'); w.append(sp); });
  return w;
}
var hdPop = null;
function closeHd(){ if (!hdPop) return; hdPop.bg.remove(); hdPop.el.remove(); hdPop = null; }
function openHd(n){
  var t = D.hd[n]; if (!t) return;

  if (hdPop) { hdPop.bg.remove(); hdPop.el.remove(); }

  el.append(h('header', null, h('b', null, '제' + n + '호'), h('small', null, cc ? '제' + ch + '류 ' + cc.title : ''), x));
  el.append(termEl(t));
  if (cc && route !== 'c' + ch) el.append(h('button', {class:'go', type:'button', onclick:function(){ closeHdReq(); setTimeout(function(){ nav('c' + ch); }, 60); }}, '제' + ch + '류로 이동 ›'));
  document.body.append(bg, el);
  hdPop = {bg:bg, el:el};
  bg.addEventListener('click', closeHdReq); x.addEventListener('click', closeHdReq);
  if (fresh) { hdPop.pushed = false; try { if (parent !== window && parent.hsPushed) { parent.hsPushed(); hdPop.pushed = true; } } catch(e){} }
  else hdPop.pushed = true;
}
function closeHdReq(){ if (!hdPop) return; if (hdPop.pushed) { try { parent.hsReqBack(); return; } catch(e){} } closeHd(); }
document.addEventListener('click', function(e){ var r = e.target.closest && e.target.closest('.ref.hd'); if (r) { e.preventDefault(); e.stopPropagation(); openHd(r.dataset.hd); } });
document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && hdPop) closeHdReq(); });
function renderChapter(no){
  var c = CH.get(no), s = SEC.get(c.sec), state = st('c' + no);
  barTitle.textContent = '제' + no + '류';
  var root = h('div', {style:hueVars(c.sec)});

    crumbKids.push(svg(GO, 'chev'));
    root.append(h('button', {class:'crumb', type:'button', 'aria-label':'제' + s.no + '부 부 주 보기', onclick:function(){ nav('s' + s.no); }}, crumbKids));
  } else {
    root.append(h('div', {class:'crumb'}, crumbKids));
  }
  root.append(h('div', {class:'head'},
    h('p', {class:'eyebrow'}, '제' + no + '류'),
    h('h2', {class:'h2'}, c.title)));

  var panel = h('div', {id:'notes-c' + no, hidden: !state.notes});
  var has = c.notes.length > 0;
  var notesBtn = h('button', {type:'button', 'aria-expanded': state.notes && has ? 'true' : 'false', 'aria-controls':'notes-c' + no, disabled: !has},
    '주', h('span', {class:'cnt'}, has ? String(c.notes.length) : '없음'));
  var pre = (no < 10 ? '0' : '') + no;
  var hks = Object.keys(D.hd).filter(function(k){ return k.slice(0,2) === pre; }).sort();
  var termBtn = h('button', {type:'button', 'aria-expanded': state.terms ? 'true' : 'false', 'aria-controls':'terms-c' + no, disabled: !hks.length},
    '호의 용어', h('span', {class:'cnt'}, hks.length ? String(hks.length) : '없음'));
  var tpanel = h('div', {id:'terms-c' + no, class:'terms', hidden: !state.terms});
  /* 호별 두문자: 호 번호와 용어 사이에 굵게, 원문 글자는 빨간색. 두문자 10개마다(비어 있는 호의 '無'는 세지 않음) 마지막 호 아래에 나열, 류 끝에 나머지 */
  var MN = D.mn || {}, gaps = (D.mngap || {})[pre] || [], seq = [], cnt = 0;
  var all = hks.concat(gaps).sort();
  function flush(){ if (!seq.length) return; var row = h('div', {class:'mnrow'}); seq.forEach(function(x){ row.append(h('b', x.gap ? {class:'gap'} : null, x.c)); }); tpanel.append(row); seq = []; cnt = 0; }
  all.forEach(function(k){
    if (!D.hd[k]) { seq.push({c:'無', gap:true}); return; }
    var mk = MN[k];
    tpanel.append(h('div', {class:'term'}, h('span', {class:'tno'}, k), mk ? h('b', {class:'mnc'}, mk[0]) : null, termEl(D.hd[k], mk)));
    if (mk) { seq.push({c:mk[0]}); cnt++; }
    if (cnt === 10) flush();
  });
  flush();
  termBtn.addEventListener('click', function(){
    state.terms = !state.terms;
    termBtn.setAttribute('aria-expanded', state.terms ? 'true' : 'false');
    tpanel.hidden = !state.terms;
  });
  notesBtn.addEventListener('click', function(){
    state.notes = !state.notes;
    notesBtn.setAttribute('aria-expanded', state.notes ? 'true' : 'false');
    panel.hidden = !state.notes;
  });
  root.append(h('div', {class:'seg'}, notesBtn, termBtn));
  if (has) panel.append(noteList({type:'ch', no:no}, c.notes, 'c' + no));
  if (!has) panel.hidden = true;
  root.append(panel);
  root.append(tpanel);

  var i = CH_ORDER.indexOf(no);
  var prev = CH_ORDER[i - 1], next = CH_ORDER[i + 1];
  function pnBtn(n, cls){
    if (n == null) return h('div', {class:'ph'});
    var cc = CH.get(n);
    return h('button', {class:cls, type:'button', onclick:function(){ nav('c' + n); }},
      h('span', null, cls === 'prev' ? '‹ 이전' : '다음 ›'), h('b', null, '제' + n + '류 ' + cc.short));
  }
  root.append(h('nav', {class:'pn', 'aria-label':'이전·다음 류'}, pnBtn(prev, 'prev'), pnBtn(next, 'next')));
  return root;
}

/* ---------- boot ---------- */
var start = hashRoute();
stack = [''];
setHist('replaceState', '');
if (start) { stack.push(start); setHist('pushState', start); }
render(start, null);
})();
