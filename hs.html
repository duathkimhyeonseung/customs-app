<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}.term:has(.mnc){grid-template-columns:auto auto 1fr;}

.mnrow b { font-weight: 800; color: #111; } .mnrow b.gap { color: #D0261E; }
.mnrow.nmr { padding: 2px 0 8px calc(var(--lv, 1) * 1.1em + 1.6em); }

</style></head><body>
<title>관세율표 한눈에</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: phone-first app shell — sticky bar + one column (max 760px).
   Home is the chapter map from the Word sheet: decade rows (5 cols on phones, 10 on wide),
   each cell tinted by its section's pastel; section tags sit on the first chapter of each section. */
:root{
  --font-display:"Gowun Dodum","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --root-fs:16px;
  --ind:1.5em;

  --bg:#FFFEFA;
  --surface:#FFFFFF;
  --surface-2:#FBF8F1;
  --line:#EFEADF;
  --fg:#2D2838;
  --muted:#6C6581;
  --accent:#6458C4;
  --accent-soft:#E9E6FB;
  --ref:#5A50B5;
  --shadow:0 1px 2px rgba(64,44,130,.06),0 3px 12px rgba(64,44,130,.06);

  /* section pastels: tint / solid / ink */
  --p1:#FFF3EC;--p1s:#FFCEB4;--p1i:#87401E;
  --p2:#FFF9E4;--p2s:#FADF86;--p2i:#715300;
  --p3:#EDF9F2;--p3s:#B4E3C6;--p3i:#205F42;
  --p4:#EEF4FD;--p4s:#BAD4F5;--p4i:#244E7C;
  --p5:#F5F2FD;--p5s:#D2C6F5;--p5i:#4B3B8C;
  --p6:#FDF1F5;--p6s:#F4C2D2;--p6i:#832E4C;
  --p7:#EBF8F7;--p7s:#ACDEDA;--p7i:#1D5C58;

  --kn-bg:#ECE8F6;--kn-fg:#3D3556;
  --ks-bg:#DAF1E5;--ks-fg:#1F5E3E;
  --kd-bg:#FCE2D8;--kd-fg:#8A381C;
  --ann-bg:#FFF6D8;--ann-line:#EFD681;--ann-fg:#5A4708;
}
html{font-size:var(--root-fs);-webkit-text-size-adjust:100%;}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);line-height:1.6;-webkit-tap-highlight-color:transparent;}
button{font:inherit;color:inherit;}
.app{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 48px;}.app.wide{max-width:none;}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;align-items:center;gap:4px;
  height:54px;margin-inline:-16px;padding-inline:6px;background:var(--bg);
  border-bottom:1px solid transparent;transition:border-color .2s;}
@supports (backdrop-filter:blur(8px)) or (-webkit-backdrop-filter:blur(8px)){
  .bar{background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(1.3) blur(10px);-webkit-backdrop-filter:saturate(1.3) blur(10px);}
}
.bar.lined{border-bottom-color:var(--line);}
.bar-btn{flex:none;display:grid;place-items:center;width:44px;height:44px;border:0;border-radius:12px;background:none;cursor:pointer;color:var(--fg);}
.bar-btn:hover{background:var(--surface-2);}
.bar-btn svg{width:24px;height:24px;}
.bar-btn[hidden]{display:grid!important;visibility:hidden;}
.bar-title{flex:1;min-width:0;font-family:var(--font-display);font-size:1.15rem;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fs-ico{font-family:var(--font-display);font-size:.8rem;line-height:1;letter-spacing:-.02em;}
.fs-ico b{font-size:1.15rem;font-weight:400;}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;}

.view{animation:none;}
.view.fwd{animation:inR .22s ease-out;}
.view.back{animation:inL .22s ease-out;}
@keyframes inR{from{opacity:.4;transform:translateX(14px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:.4;transform:translateX(-14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view.fwd,.view.back{animation:none}.chev{transition:none!important}}

/* home */
.hero{padding:.6rem 2px 1rem;}
.eyebrow{margin:0;font-size:.76rem;font-weight:700;letter-spacing:.06em;color:var(--muted);}
.h1{margin:.1rem 0 0;font-family:var(--font-display);font-weight:400;font-size:2.1rem;line-height:1.2;}
.h-sub{margin:.3rem 0 0;color:var(--muted);font-size:.9rem;}

.rules-card{display:flex;align-items:center;gap:.9rem;width:100%;padding:.95rem 1rem;border:0;border-radius:18px;
  background:var(--p5);color:var(--fg);cursor:pointer;text-align:left;box-shadow:var(--shadow);}
.rules-card{border:2px solid transparent;color:#1E1838;
  background:linear-gradient(115deg,rgba(255,255,255,.55),rgba(255,255,255,.15) 40%,rgba(255,255,255,.55)) padding-box,
    linear-gradient(100deg,#FFC6E8,#E7B8FF,#B9C8FF,#A8F0FF,#C4FFE0,#FFF1B0,#FFC6E8) padding-box,
    linear-gradient(100deg,#FF6FD0,#B566FF,#5C8CFF,#33D9FF,#4DFFB0,#FFD84D,#FF6FD0) border-box;
  background-size:100% 100%,200% 100%,200% 100%;animation:prism 3.2s linear infinite;box-shadow:0 2px 12px rgba(150,110,255,.28);}
.rules-card.spk .rc-k{background:rgba(255,255,255,.62);color:#4B3B8C;}
.rules-card .rc-s{color:#4A3F6B;}
.rules-card .go{color:#4B3B8C;}
.rules-card>*:not(.tw){position:relative;z-index:1;}
@keyframes prism{0%{background-position:0% 50%,0% 50%,0% 50%}100%{background-position:0% 50%,200% 50%,200% 50%}}
@keyframes shine{0%{background-position:160% 0}55%,100%{background-position:-60% 0}}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.4) rotate(0)}45%{opacity:1;transform:scale(1) rotate(45deg)}70%{opacity:.2;transform:scale(.6) rotate(80deg)}}
.spk{position:relative;overflow:visible!important;}
.spk::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;border-radius:inherit;
  background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.75) 47%,#fff 50%,rgba(255,255,255,.75) 53%,transparent 62%) no-repeat;
  background-size:260% 100%;animation:shine 2.6s ease-in-out infinite;mix-blend-mode:overlay;}
.spk .tw{position:absolute;z-index:3;width:26px;height:26px;margin:-13px 0 0 -13px;pointer-events:none;opacity:0;animation:twinkle 1.9s ease-in-out infinite;
  background:radial-gradient(circle,#fff 0 2.2px,transparent 3.2px),linear-gradient(#fff,#fff) center/2px 100% no-repeat,linear-gradient(#fff,#fff) center/100% 2px no-repeat;
  -webkit-mask:radial-gradient(circle,#000 30%,transparent 72%);mask:radial-gradient(circle,#000 30%,transparent 72%);filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 4px rgba(170,110,255,.95)) drop-shadow(0 0 7px rgba(255,200,90,.7));}
.spk .tw.t1{top:4%;left:7%;animation-delay:0s;}
.spk .tw.t2{top:86%;left:44%;animation-delay:.65s;width:18px;height:18px;margin:-9px 0 0 -9px;}
.spk .tw.t3{top:30%;left:72%;animation-delay:1.25s;}
.spk .tw.t4{top:96%;left:93%;animation-delay:.35s;width:22px;height:22px;margin:-11px 0 0 -11px;}
@media (prefers-reduced-motion:reduce){.spk::after,.spk .tw{animation-duration:6s;}}

.hrow{display:flex;gap:12px;align-items:stretch;}
.hrow .rules-card{flex:3 1 0;width:auto;min-width:0;}
.mn-card{flex:1 1 0;min-width:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:.2rem;padding:.8rem .6rem;
  border:2px solid #C9B6FF;border-radius:18px;background:#fff;color:#1E1838;cursor:pointer;text-align:center;box-shadow:0 2px 12px rgba(150,110,255,.28);}
.mn-card .mc-t{font-weight:800;font-size:1rem;line-height:1.3;word-break:keep-all;}
.mn-card .mc-s{font-size:.8rem;color:#4A3F6B;}
.mnl-sec{margin:1.2rem 2px .45rem;font-size:.82rem;font-weight:700;color:var(--muted);}
.mnl{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px;}
.mnl-it{display:flex;flex-direction:column;align-items:stretch;gap:2px;padding:.6rem .7rem .3rem;border:1px solid var(--line);border-radius:14px;background:var(--surface,#fff);color:var(--fg);text-align:left;cursor:pointer;font:inherit;}
.mnl-h{display:flex;align-items:baseline;gap:.45rem;flex-wrap:wrap;font-size:.82rem;}
.mnl-w{font-weight:700;}
.mnl-t{color:var(--muted);flex-basis:100%;font-size:.8rem;line-height:1.35;}
.mnl-it .mnrow{padding:4px 0 6px;}
.rules-card .rc-k{flex:none;display:grid;place-items:center;width:3.3rem;height:3.3rem;border-radius:14px;background:var(--p5s);color:var(--p5i);
  font-family:var(--font-display);font-size:1.15rem;}
.rules-card .rc-b{flex:1;min-width:0;}
.rules-card .rc-t{display:block;font-weight:700;font-size:1rem;line-height:1.35;word-break:keep-all;}
.rules-card .rc-s{display:block;margin-top:.15rem;font-size:.82rem;color:var(--muted);}
.rules-card .go{flex:none;width:20px;height:20px;color:var(--p5i);}

.legend{display:flex;flex-wrap:wrap;align-items:center;gap:.35rem .9rem;margin:1.1rem 2px .6rem;font-size:.76rem;color:var(--muted);}
.legend span{display:inline-flex;align-items:center;gap:.35rem;}
.legend .sb{position:static;}

.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;}
@media (min-width:760px){.grid{grid-template-columns:repeat(10,minmax(0,1fr));gap:7px;}}
@media (max-width:360px){.grid{gap:4px;}}
.cw{position:relative;min-width:0;}
.cell{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;min-height:4.3rem;
  box-sizing:border-box;padding:1.35rem .2rem .45rem;border:0;border-radius:12px;background:var(--t);cursor:pointer;text-align:center;}
.cell:hover{filter:brightness(.97);}
.cell:active{transform:scale(.97);}
.cell-empty{background:transparent;min-height:0;}
.cell-void{cursor:default;background:transparent;box-shadow:inset 0 0 0 1.5px var(--line);}
.cell-void:active{transform:none;}
.cn{position:absolute;top:.28rem;right:.42rem;font-size:.78rem;font-weight:700;color:var(--ti);font-variant-numeric:tabular-nums;line-height:1.2;}
.cell-void .cn{color:var(--muted);}
.nm{font-size:.72rem;line-height:1.28;word-break:keep-all;overflow-wrap:anywhere;color:var(--fg);}
.cell-void .nm{color:var(--muted);}
.sb{position:absolute;z-index:1;top:.22rem;left:.12rem;display:inline-block;padding:.1rem .5rem;border:0;border-radius:6px;
  background:var(--ts);color:var(--ti);font-size:.64rem;font-weight:700;line-height:1.35;white-space:nowrap;cursor:pointer;}
button.sb::before{content:"";position:absolute;inset:-7px -6px -6px -7px;}
.sb.off{background:transparent;box-shadow:inset 0 0 0 1.2px var(--ts);cursor:default;}

.foot{margin-top:1.6rem;padding:0 2px;font-size:.76rem;color:var(--muted);line-height:1.6;}
.foot p{margin:.2rem 0;}

/* detail headers */
.crumb{display:inline-flex;align-items:center;gap:.3rem;max-width:100%;margin:.5rem 0 .4rem;padding:.3rem .65rem;border:0;border-radius:999px;
  background:var(--surface);box-shadow:var(--shadow);font-size:.78rem;color:var(--muted);text-align:left;}
button.crumb{cursor:pointer;}
.crumb b{color:var(--ti);font-weight:700;white-space:nowrap;}
.crumb span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.head{margin-top:.4rem;padding:1.05rem 1.1rem 1.15rem;border-radius:20px;background:var(--t);}
.head .eyebrow{color:var(--ti);}
.h2{margin:.25rem 0 0;font-family:var(--font-display);font-weight:400;font-size:1.42rem;line-height:1.38;text-wrap:balance;word-break:keep-all;}
.head p.lead{margin:.45rem 0 0;font-size:.88rem;color:var(--fg);opacity:.85;}

.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:.9rem;}
.seg button{display:flex;align-items:center;justify-content:center;gap:.4rem;min-height:3.2rem;padding:.6rem;border:0;border-radius:16px;
  background:var(--surface);box-shadow:var(--shadow);font-size:1.05rem;font-weight:700;cursor:pointer;}
.seg button .cnt{font-size:.78rem;font-weight:500;color:var(--muted);}
.seg button[aria-expanded="true"]{background:var(--ts);color:var(--ti);}
.seg button[aria-expanded="true"] .cnt{color:var(--ti);opacity:.85;}
.seg button:disabled{cursor:default;opacity:.55;box-shadow:none;background:var(--surface-2);}

/* note list */
.list-top{display:flex;align-items:center;justify-content:space-between;gap:.6rem;margin:1.15rem 2px .55rem;}
.list-top .sum{font-size:.8rem;color:var(--muted);}
.lnk{border:0;background:none;padding:.35rem .2rem;font-size:.8rem;font-weight:700;color:var(--accent);cursor:pointer;}
.grp{display:flex;align-items:center;gap:.5rem;margin:1rem 2px .5rem;font-size:.78rem;font-weight:700;color:var(--muted);}
.grp:first-child{margin-top:.2rem;}
.grp::after{content:"";flex:1;height:1px;background:var(--line);}
.notes{display:flex;flex-direction:column;gap:8px;}
.note{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);}
.nh{display:flex;align-items:flex-start;gap:.7rem;width:100%;padding:.85rem .85rem .85rem .8rem;border:0;border-radius:16px;background:none;cursor:pointer;text-align:left;}
.lab{flex:none;min-width:3.2rem;box-sizing:border-box;margin-top:.05rem;padding:.16rem .4rem;border-radius:8px;
  background:var(--kn-bg);color:var(--kn-fg);font-size:.8rem;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.5;}
.lab.s{background:var(--ks-bg);color:var(--ks-fg);}
.lab.d{background:var(--kd-bg);color:var(--kd-fg);}
.lab.r{min-width:3.6rem;background:var(--p5s);color:var(--p5i);}
.nt{flex:1;min-width:0;font-size:.97rem;font-weight:500;line-height:1.5;word-break:keep-all;overflow-wrap:anywhere;}
.chev{flex:none;width:20px;height:20px;margin-top:.15rem;color:var(--muted);transition:transform .2s;}
.chev svg,.go svg{display:block;}
.nh[aria-expanded="true"] .chev{transform:rotate(180deg);}
.nb{padding:.15rem 1rem 1.05rem;font-size:.97rem;line-height:1.78;}
.nb .meta{margin:0 0 .55rem;padding-top:.7rem;border-top:1px dashed var(--line);font-size:.75rem;font-weight:700;color:var(--muted);letter-spacing:.02em;}
.b{margin:.32rem 0;padding-left:calc(var(--lv,0) * var(--ind));word-break:keep-all;overflow-wrap:anywhere;}
.b.mk{text-indent:calc(-1 * var(--ind));}
.b.mk .m{display:inline-block;min-width:var(--ind);text-indent:0;font-weight:700;color:var(--muted);}
.b.rm{font-size:.92em;color:var(--muted);}
.b .q{font-weight:700;color:var(--fg);}
/* mnemonic chip */
.b.mn{display:flex;flex-wrap:wrap;align-items:center;gap:.3rem .5rem;margin:.55rem 0 .7rem;line-height:1.4;}
.mn-k{flex:none;padding:.08rem .45rem;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-size:.7rem;font-weight:700;letter-spacing:.02em;}
.mn-r{flex:none;font-size:.78rem;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;}
.mn-s{display:inline-flex;flex-wrap:wrap;gap:.18rem;}
.mn-s i{font-style:normal;display:inline-grid;place-items:center;min-width:1.55em;height:1.55em;padding:0 .15em;box-sizing:border-box;border-radius:.45em;
  background:var(--surface);box-shadow:inset 0 0 0 1.2px var(--accent-soft);color:var(--fg);font-size:.88rem;font-weight:700;}
.mn-s i.sep{min-width:auto;background:none;box-shadow:none;color:var(--muted);font-weight:400;padding:0 .1em;}
/* repeated-phrase highlighter */
mark.hl{color:inherit;padding:0 .04em;border-radius:.15em;-webkit-box-decoration-break:clone;box-decoration-break:clone;
  background:linear-gradient(to bottom,transparent 48%,var(--hc) 48%,var(--hc) 94%,transparent 94%);}
mark.hc0{--hc:rgba(255,222,89,.62);} mark.hc1{--hc:rgba(132,226,150,.55);} mark.hc2{--hc:rgba(255,150,190,.5);}
mark.hc3{--hc:rgba(120,196,255,.52);} mark.hc4{--hc:rgba(255,178,102,.55);} mark.hc5{--hc:rgba(196,160,255,.52);}
mark.hc6{--hc:rgba(102,222,205,.5);} mark.hc7{--hc:rgba(214,236,90,.6);}

.b .ref{color:var(--ref);font-variant-numeric:tabular-nums;white-space:nowrap;}
.ref.hd{cursor:pointer;text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:3px;}
.terms{display:grid;gap:8px;margin-top:.8rem;}
.term{display:grid;grid-template-columns:auto 1fr;gap:.7rem;align-items:start;padding:.75rem .9rem;border-radius:14px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.term .tno{font-variant-numeric:tabular-nums;font-weight:700;font-size:.9rem;padding:.15rem .55rem;border-radius:8px;background:var(--ts);color:var(--ti);}
.term .tl{display:grid;gap:.15rem;line-height:1.6;}
.term .tl > span{display:block;}
.term .tl > span.pv{padding-left:1em;color:var(--muted);}
.hdbg{position:fixed;inset:0;background:rgba(10,14,22,.38);z-index:50;}
.hdpop{position:fixed;inset:0;margin:auto;height:fit-content;z-index:51;width:min(560px,calc(100% - 28px));box-sizing:border-box;max-height:80%;overflow:auto;background:#fff;border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.25);padding:16px 18px 18px;}
.hdpop header{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.hdpop header b{white-space:nowrap;font-size:1.15rem;font-variant-numeric:tabular-nums;}
.hdpop header small{color:var(--muted);flex:1 1 auto;}
.hdpop .x{width:38px;height:38px;border-radius:50%;border:1.5px solid #333;background:transparent;font-size:16px;cursor:pointer;}
.hdpop .tl{display:grid;gap:.2rem;line-height:1.65;font-size:1.02rem;}
.hdpop .tl > span{display:block;} .hdpop .tl > span.pv{padding-left:1em;color:var(--muted);}
.hdpop .go{margin-top:12px;border:1.5px solid var(--ref);color:var(--ref);background:transparent;border-radius:999px;padding:.45rem 1rem;font:inherit;cursor:pointer;}

.tw{margin:.5rem 0 .6rem calc(var(--lv,0) * var(--ind));overflow-x:auto;-webkit-overflow-scrolling:touch;}
.tw table{border-collapse:collapse;font-size:.86em;line-height:1.45;min-width:12rem;}
.tw th,.tw td{border:1px solid var(--line);padding:.32rem .55rem;text-align:center;vertical-align:middle;font-variant-numeric:tabular-nums;}
.tw th{background:var(--surface-2);font-weight:700;}
.tw td:first-child{text-align:left;}
.tw.kv td:last-child{white-space:nowrap;}
.ann{margin:.8rem 0 0;padding:.6rem .75rem;border-radius:12px;background:var(--ann-bg);box-shadow:inset 3px 0 0 var(--ann-line);color:var(--ann-fg);font-size:.86em;line-height:1.6;}
.ann b{margin-right:.35rem;}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:.5rem;}
.chip{display:inline-flex;align-items:baseline;gap:.35rem;padding:.4rem .7rem;border:0;border-radius:999px;background:var(--t);color:var(--fg);font-size:.84rem;cursor:pointer;}
.chip b{color:var(--ti);font-variant-numeric:tabular-nums;}
.sec-label{margin:1.5rem 2px .1rem;font-size:.78rem;font-weight:700;color:var(--muted);}
.empty{margin:1rem 2px;font-size:.88rem;color:var(--muted);}

.pn{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:1.6rem;}
.pn button{display:flex;flex-direction:column;gap:.05rem;min-width:0;padding:.65rem .85rem;border:0;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);cursor:pointer;text-align:left;}

<script type="application/json" id="hs-data">{"src":"관세법 [별표] 관세율표 <개정 2022. 12. 31.>","intro":"관세율표의 품목분류는 다음 원칙에 따른다.","dTotal":6,"rules":[[1,"호의 용어와 주에 따른 분류 (표제는 참조용)",[[0,0,"이 표의 부(部)·류(類)·절(節)의 표제는 참조하기 위하여 규정한 것이다. 법적인 목적상 품목분류는 각 호(號)의 용어와 관련 부나 류의 주(註)에 따라 결정하되, 각 호나 주에서 따로 규정하지 않은 경우에는 다음 각 호의 규정에 따른다."]]],[2,"미완성·미조립 물품(가)과 혼합물·복합물(나)",[[0,0,"이 통칙 제1호에 따라 품목분류를 결정할 수 없는 것은 다음 각 목에 따른다."],[1,1,"가. 각 호에 열거된 물품에는 불완전한 물품이나 미완성된 물품이 제시된 상태에서 완전한 물품이나 완성된 물품의 본질적인 특성을 지니고 있으면 그 불완전한 물품이나 미완성된 물품이 포함되는 것으로 본다. 또한 각 호에 열거된 물품에는 조립되지 않거나 분해된 상태로 제시된 완전한 물품이나 완성된 물품(이 통칙에 따라 완전한 물품이나 완성된 물품으로 분류되는 것을 포함한다)도 포함되는 것으로 본다."],[1,1,"나. 각 호에 열거된 재료·물질에는 해당 재료·물질과 다른 재료·물질과의 혼합물 또는 복합물이 포함되는 것으로 본다. 특정한 재료·물질로 구성된 물품에는 전부 또는 일부가 해당 재료·물질로 구성된 물품이 포함되는 것으로 본다. 두 가지 이상의 재료나 물질로 구성된 물품의 분류는 이 통칙 제3호에서 규정하는 바에 따른다."],["M",1,"미 혼",""]]],[3,"둘 이상의 호에 해당하는 물품의 분류 (구체성·본질적 특성·최종 호)",[[0,0,"이 통칙 제2호나목이나 그 밖의 다른 이유로 동일한 물품이 둘 이상의 호로 분류되는 것으로 볼 수 있는 경우의 품목분류는 다음 각 목에서 규정하는 바에 따른다."],[1,1,"가. 가장 구체적으로 표현된 호가 일반적으로 표현된 호에 우선한다. 다만, 둘 이상의 호가 혼합물이나 복합물에 포함된 재료나 물질의 일부에 대해서만 각각 규정하거나 소매용으로 하기 위하여 세트로 된 물품의 일부에 대해서만 각각 규정하는 경우에는 그 중 하나의 호가 다른 호보다 그 물품에 대하여 더 완전하거나 상세하게 표현하고 있다 할지라도 각각의 호를 그 물품에 대하여 동일하게 구체적으로 표현된 호로 본다."],[1,1,"나. 혼합물, 서로 다른 재료로 구성되거나 서로 다른 구성요소로 이루어진 복합물과 소매용으로 하기 위하여 세트로 된 물품으로서 가목에 따라 분류할 수 없는 것은 가능한 한 이들 물품에 본질적인 특성을 부여하는 재료나 구성요소로 이루어진 물품으로 보아 분류한다."],[1,1,"다. 가목이나 나목에 따라 분류할 수 없는 물품은 동일하게 분류가 가능한 호 중에서 그 순서상 가장 마지막 호로 분류한다."],["M",1,"구 본 최",""]]],[4,"가장 유사한 물품이 해당하는 호로 분류",[[0,0,"이 통칙 제1호부터 제3호까지에 따라 분류할 수 없는 물품은 그 물품과 가장 유사한 물품이 해당되는 호로 분류한다."]]],[5,"케이스·용기(가)와 포장재료·포장용기(나)",[[0,0,"다음 각 목의 물품에는 이 통칙 제1호부터 제4호까지를 적용하는 외에 다음 사항을 적용한다."],[1,1,"가. 사진기 케이스·악기 케이스·총 케이스·제도기 케이스·목걸이 케이스와 이와 유사한 용기는 특정한 물품이나 물품의 세트를 담을 수 있도록 특별한 모양으로 되어 있거나 알맞게 제조되어 있고, 장기간 사용하기에 적합하며, 그 내용물과 함께 제시되어 일반적으로 그 내용물과 함께 판매되는 종류의 물품인 때에는 그 내용물과 함께 분류한다. 다만, 용기가 전체 물품에 본질적인 특성을 부여하는 경우에는 그렇지 않다."],[1,1,"나. 가목에 해당하는 것은 그에 따르고, 내용물과 함께 제시되는 포장재료와 포장용기는 이들이 일반적으로 그러한 물품의 포장용으로 사용되는 것이라면 그 내용물과 함께 esh) 구경이 1밀리미터인 체를 통과한 중량이 전 중량의 100분의 90 이상인 물품을 말한다."],["M",1,"웨 가","가~나"]]],["n",9,"봉·프로파일·선·판·관의 정의 (제74~81류)",[[0,0,"제74류부터 제76류까지와 제78류부터 제81류까지에서 다음 각 목의 용어는 아래에서 정하는 바에 따른다."],[1,1,"가. 봉"],[1,0,"\"봉\"이란 압연·압출·인발(引拔)·단조(鍛造)제품으로서 코일 모양이 아니어야 하고, 그 횡단면이 전체 길이에 걸쳐 균일하고 중공(中空)이 없으며, 원형·타원형·직사각형(정사각형을 포함한다)·정삼각형·볼록정다각형[\"편평화한 원형\"과 \"변형된 직사각형\"을 포함하며, 이들은 마주보는 두 변이 볼록한 호(弧) 모양이고 다른 두 변은 직선이며 길이가 같고 평행한 것이다]인 것을 말한다. 이 경우 횡단면이 직사각형(정사각형을 포함한다)·삼각형·다각형인 물품은 전체 길이에 걸쳐 둥근 모양의 모서리를 가지는 경우도 있다. 횡단면이 직사각형(\"변형된 직사각형\"을 포함한다)인 물품은 그 두께가 폭의 10분의 1을 초과하는 것으로 한정한다. 또한 위와 동일한 모양과 치수를 가진 주조 제품이나 소결(燒結) 제품으로서 제조된 후 단순한 트리밍(trimming)이나 스케일 제거(de-scaling) 이외의 다른 연속가공을 거친 것도 포함한다. 다만, 다른 호에 해당하는 물품이나 제품의 특성이 있는 것은 제외한다.",[[43,89,2],[89,110,6],[110,117,2],[118,174,3],[213,351,0],[370,463,1],[464,503,4]]],[1,0,"그러나 제74류의 와이어바(wire-bar)와 빌릿(billet)으로서 선재[와이어로드(wire-rod)]나 관(管) 등으로 제조할 때 단순히 기계에 투입하는 것을 쉽게 하기 위한 목적으로 끝을 가늘게 하거나 그 밖의 다른 가공을 한 것은 제7403호의 구리의 괴(塊)로 본다."],[1,0,"이 규정은 제81류에 해당하는 물품에도 준용한다."],[1,1,"나. 프로파일(profile)"],[1,0,"\"프로파일(profile)\"이란 압연·압출·인발(引拔)·단조(鍛造)나 형조(形造) 제품으로서 코일 모양인지에 상관없으며, 그 횡단면이 전체 길이에 걸쳐 균일하고 봉·선·판·시트(sheet)·스트립·박(箔)·관(管)의 어느 정의에도 해당하지 않는 것을 말한다. 또한 위와 동일한 모양을 가진 주조 제품이나 소결(燒結) 제품으로서 제조된 후 단순한 트리밍(trimming)이나 스케일 제거(de-scaling) 이외의 다른 연속가공을 거친 것도 포함한다. 다만, 다른 호에 해당하는 물품이나 제품의 특성이 있는 것은 제외한다.",[[159,252,1],[253,292,4]]],[1,1,"다. 선(線)"],[1,0,"\"선(線)\"이란 압연·압출·인발(引拔) 제품으로서 코일 모양이어야 하고, 그 횡단면이 전체 길이에 걸쳐 균일하고 중공(中空)이 없으며, 원형·타원형·직사각형(정사각형을 포함한다)·정삼각형·볼록정다각형[\"편평화한 원형\"과 \"변형된 직사각형\"을 포함하며, 이들은 마주보는 두 변이 볼록한 호(弧) 모양이고, 다른 두 변은 직선이고, 길이가 같고 평행한 것이다]인 것을 말한다. 이 경우 횡단면이 직사각형(정사각형을 포함한다)·삼각형·다각형인 물품은 전체 길이에 걸쳐 둥근 모양의 모서리를 가지는 경우도 있다. 횡단면이 직사각형(\"변형된 직사각형\"을 포함한다)인 물품은 그 두께가 폭의 10분의 1을 초과하는 것으로 한정한다.",[[37,83,2],[83,104,6],[104,111,2],[112,168,3],[170,194,5],[209,347,0]]],[1,1,"라. 판·시트(sheet)·스트립·박(箔)"],[1,0,"\"판·시트(sheet)·스트립·박(箔)\"이란 평판 모양의 제품(가공하지 않은 물품은 제외한다)으로서 코일 모양인지에 상관없으며, 횡단면에 중공(中空)이 없는 직사각형(정사각형은 제외한다)인 것(마주보는 두 변이 볼록한 호(弧) 모양이고, 다른 두 변은 직선이고, 길이가 같고 평행한 \"변형된 직사각형\"을 포함한다)으로 둥근 모양의 모서리를 가지는 것인지에 상관없으며 두께가 균일한 것으로서 다음과 같은 것을 말한다.",[[133,157,5]]],[2,3,"- 직사각형(정사각형을 포함한다) 모양인 것은 두께가 폭의 10분의 1 이하인 것으로 한정한다."],[2,3,"- 직사각형이나 정사각형이 아닌 다른 모양의 것은 그 크기에 상관없다. 다만, 다른 호에 해당하는 물품이나 제품의 특성이 있는 것은 제외한다.",[[40,79,4]]],[1,0,"판·시트(sheet)·스트립·박(箔)이 분류되는 호는 특히 판·시트(sheet)·스트립·박(箔)으로서 무늬가 있는 것[예: 홈·리브(rib)·체크무늬·물방울무늬·단추무늬·마름모꼴무늬]과 이것에 구멍을 뚫은 것·물결 모양을 낸 것·연마한 것이나 도포한 것에 적용한다. 다만, 다른 호에 해당하는 물품이나 제품의 특성이 있는 것은 제외한다.",[[149,188,4]]],[1,1,"마. 관(管)"],[1,0,"\"관(管)\"이란 전체 길이에 걸쳐 하나의 중공(中空)을 가지는 제품으로서 코일 모양인지에 상관없고 그 횡단면이 균일하며, 원형·타원형·직사각형(정사각형을 포함한다)·정삼각형·볼록정다각형 모양으로서 그 벽의 두께가 균일한 것을 말한다. 횡단면이 직사각형(정사각형을 포함한다)·정삼각형·볼록정다각형인 물품은 전체 길이를 통하여 모서리가 둥근 모양일수도 있는데, 횡단면의 내측과 외측이 동심(同心)이고 동일한 모양과 방향성을 가지고 있는 경우에는 관(管)으로 본다. 위와 같은 횡단면을 가진 관(管)들은 연마한 것, 도포한 것, 구부린 것, 나선가공한 것, 구멍을 뚫은 것, 웨이스트한(waisted) 것, 익스팬디드한(expanded) 것, 원추형으로 한 것, 플랜지(flange)·고리·링을 붙인 것도 있다.",[[75,96,6],[136,157,6]]],["M",1,"봉 프 선 판 관",""]]]]],[16,"기계류·전기기기와 이들의 부분품, 녹음기·음성재생기·텔레비전의 영상과 음향의 기록기·재생기와 이들의 부분품·부속품",[84,85],[["n",1,"이 부에서 제외되는 물품",[[0,0,"이 부에서 다음 각 목의 것은 제외한다."],[1,1,"가. 전동(transmission)용·컨베이어용 벨트나 벨팅으로서 플라스틱으로 만든 것(제39류)이나 가황한 고무로 만든 것(제4010호), 기계류나 전기기기에 사용되거나 그 밖의 공업용으로 사용되는 경질고무 외의 가황한 고무의 그 밖의 제품(제4016호)"],[1,1,"나. 기계용이나 그 밖의 공업용 가죽제품·콤퍼지션 레더(composition leather)제품(제4205호)과 모피제품(제4303호)"],[1,1,"다. 보빈(bobbin)·스풀(spool)·콥(cop)·콘(cone)·코어(core)·릴(reel)이나 그 밖에 이와 유사한 지지구[재료가 무엇이든 상관없다(예: 제39류·제40류·제44류·제48류나 제15부에 해당하는 것)]"],[1,1,"라. 자카드기와 그 밖에 이와 유사한 기계용 천공카드(예: 제39류·제48류나 제15부에 해당하는 것)"],[1,1,"마. 방직용 섬유로 만든 전동(transmission)용이나 컨베이어용 벨트나 벨팅(제5910호)과 그 밖의 방직용 섬유로 만든 공업용 물품(제5911호)"],[1,1,"바. 제7102호부터 제7104호까지의 천연의 것이나 합성·재생한 귀석·반귀석이나 제7116호의 제품으로서 전부가 이들 귀석이나 반귀석으로 된 것. 다만, 축음기 바늘용으로 가공한 사파이어나 다이아몬드로서 장착되지 않은 것은 제외한다(제8522호)."],[1,1,"사. 제15부의 주 제2호의 비금속(卑金屬)으로 만든 범용성 부분품(제15부)이나 이와 유사한 플라스틱으로 만든 물품(제39류)"],[1,1,"아. 드릴파이프(drill pipe)(제7304호)"],[1,1,"자. 금속의 선이나 스트립으로 만든 엔드리스 벨트(제15부)"],[1,1,"차. 제82류나 제83류의 물품"],[1,1,"카. 제17부의 물품"],[1,1,"타. 제90류의 물품"],[1,1,"파. 제91류의 시계와 1호에서의 가공하지 않은 것으로 본다."]]],["n",3,"“아이보리”의 범위 (엄니·뿔·이)",[[0,0,"이 표에서 코끼리·하마·바다코끼리·일각고래·산돼지의 엄니, 코뿔소의 뿔과 모든 동물의 이는 아이보리(ivory)로 본다."]]],["n",4,"“말의 털”의 정의",[[0,0,"이 표에서 \"말의 털\"이란 마속동물이나 소의 갈기털과 꼬리털을 말한다. 제0511호는 특히 말의 털과 그 웨이스트(waste)를 포함하며, 층상으로 하였는지 또는 지지물을 사용했는지에 상관없다"]]]]],[6,"살아 있는 수목과 그 밖의 식물, 인경(鱗莖)·뿌리와 이와 유사한 물품, 절화(切花)와 장식용 잎","산수목·꽃",2,[["n",1,"이 류의 범위 (재배·장식용 식물, 제7류 물품 제외)",[[0,0,"이 류에서는 제0601호의 후단 외에는 통상 육묘·육종 업자나 판매업자가 재배용이나 장식용으로 공급하는 살아 있는 수목이나 상품(채소의 모종을 포함한다)으로 한정한다. 다만, 제7류의 감자·양파·샬롯(shallot)·마늘이나 그 밖의 물품은 제외한다."]]],["n",2,"꽃다발·화환 등 포함 (콜라주는 제외)",[[0,0,"제0603호나 제0604호에 열거한 물품에는 해당 물품의 전부나 일부로 제조한 꽃다발·꽃바구니·화환과 그 밖에 이와 유사한 물품을 포함한다(다른 재료로 된 부속품을 사용했는지에 상관없다). 다만, 이들 호에서는 제9701호의 콜라주와 이와 유사한 장식판은 제외한다."]]]]],[7,"식용의 채소·뿌리·괴경(塊莖)","채소",2,[["n",1,"제1214호의 사료용 식물 제외",[[0,0,"이 류에서 제1214호의 사료용 식물은 제외한다."]]],["n",2,"제0709~0712호 “채소”의 범위",[[0,0,"제0709호·제0710호·제0711호·제0712호의 \"채소\"에는 식용 버섯, 송로(松露), 올리브, 케이퍼(caper), 호박류, 가지, 스위트콘[자메이스 변종 사카라타(Zeamays var. saccharata)], 고추류[캡시컴(Capsicum)속]의 열매나 피멘타(Pimenta)속의 열매, 회향(茴香), 파슬리(parsley), 취어빌(chervil), 타라곤(tarragon), 크레스(cress), 스위트 마조람(sweet marjoram)[마요라나 호텐시스(Majorana hortensis)·오리가늄 마요라나(Origanum majorana)]이 포함된다."]]],["n",3,"제0712호 건조 채소의 범위와 제외 물품",[[0,0,"제0712호는 제0701호부터 제0711호까지에 해당하는 채소의 건조한 것을 모두 포함하며, 다음 각 목의 것은 제외한다."],[1,1,"가. 건조한 채두류(菜豆類)(꼬투리가 없는 것으로 한정한다)(제0713호)"],[1,1,"나. 제1102호부터 제1104호까지에 열거된 모양의 스위트콘"],[1,1,"다. 감자의 고운 가루·거친 가루·가루·플레이크(flake)·알갱이·펠릿(pellet)(제1105호)"],[1,1,"라. 제0713호의 건조한 채두류(菜豆類)의 고운 가루·거친 가루·가루(제1106호)"],["M",1,"채 스 감 채",""]]],["n",4,"건조·분쇄 고추류는 제외 (제0904호)",[[0,0,"이 류에서 건조하거나 부수거나 잘게 부순 고추류[캡시컴(Capsicum)속]의 열매나 피멘타(Pimenta)속의 열매는 제외한다(제0904호)."]]],["n",5,"제0711호 일시 보존처리 채소의 범위",[[0,0,"제0711호는 사용하기 전 운송이나 보관 중에 단지 일시적인 보존만을 위하여 처리(예: 아황산가스·염수·유황수나 그 밖의 저장용액으로 보존처리)한 채소에 적용한다. 다만, 그 상태로는 식용에 적합하지 않는 것으로 한정한다."]]]]],[8,"식용의 과실과 견과류, 감귤류·멜론의 껍질","과실·견과류",2,[["n",1,"식용에 적합하지 않은 견과류·과실 제외",[[0,0,"이 류에서 식용에 적합하지 않은 견과류와 과실은 제외한다."]]],["n",2,"냉장한 과실·견과류는 신선한 것으로 분류",[[0,0,"냉장한 과실과 견과류는 "결 퓨 잉 수 측",""]]],["n",4,"“생활폐기물”의 정의",[[0,0,"이 표에서 \"생활폐기물\"은 가정·호텔·식당·병원·가게·사무실 등에서 수집된 쓰레기, 도로와 포장도로에서 수거한 쓰레기는 물론 건설 쓰레기와 해체 쓰레기를 말하며, 생활폐기물은 일반적으로 플라스틱·고무·나무·종이·직물·유리·금속·음식물 등 다양한 재료와 부서진 가구나 그 밖의 손상되거나 버려진 제품을 포함한다. 다만, 다음 각 목의 것을 포함하지 않는다."],[1,1,"가. 폐기물[예: 플라스틱·고무·나무·종이·직물·유리나 금속의 폐기물, 전기·전자웨이스트(waste)와 스크랩(scrap)(폐전지를 포함한다)]로부터 분리수거된 개개의 재료나 제품으로 이 표의 적당한 호에 해당하는 것"],[1,1,"나. 산업 폐기물"],[1,1,"다. 제30류의 주 제4호차목의 폐(廢)의료용품"],[1,1,"라. 주 제6호가목의 감염성 폐기물"],["M",1,"폐 산 의 감",""]]],["n",5,"제3825호 “하수 찌꺼기”의 정의",[[0,0,"제3825호에서 \"하수 찌꺼기\"란 하수처리시설에서 발생한 찌꺼기를 말하며, 전(前)처리된 폐기물·오물·안정화 되지 않은 찌꺼기를 포함한다(제31류의 비료로 사용되는 안정화된 찌꺼기는 제외한다)."]]],["n",6,"제3825호 “그 밖의 폐기물”의 범위",[[0,0,"제3825호의 \"그 밖의 폐기물\"에는 다음 각 목의 것이 해당된다. 다만, 제2710호의 석유나 역청유(瀝靑油)를 주로 함유하는 폐기물은 그 밖의 폐기물에 포함되지 않는다."],[1,1,"가. 감염성 폐기물[의학연구, 검진, 치료, 그 밖의 내과·외과·치과·수의과 진료 과정에서 발생하는 오염된 폐기물을 말하며, 병원균과 의약물질을 함유하므로 특수 처리과정이 필요한 것(예: 오염된 의류, 사용한 장갑·주사기)을 말한다]"],[1,1,"나. 폐(廢)유기용제"],[1,1,"다. 금속세정액, 유압액, 브레이크액, 부동액 폐기물"],[1,1,"라. 화학공업이나 연관공업에서 발생한 그 밖의 폐기물"],["M",1,"감 용 금 화",""]]],["n",7,"제3826호 “바이오디젤”의 정의",[[0,0,"제3826호에서 \"바이오디젤\"이란 동물성·식물성·미생물성 지방과 기름(사용된 것인지에 상관없다)에서 얻은 것으로서 연료로 사용되는 지방산 모노알킬에스테르를 말한다."]]],["s",1,"제3808.52·3808.59호 해당 유해 농약 성분",[[0,0,"소호 제3808.52호와 제 3808.59호는 다음을 하나 이상 함유하는 제3808호의물 품만을 포함한다. 알라클로르(ISO), 알디카브(ISO), 앨드린(ISO),아진포스-메틸(ISO), 비나파크릴(ISO), 캄페클로(ISO)(톡사핀), 캡타폴(ISO), 카보퓨란(ISO), 클로단(ISO), 클로디메폼(ISO), 클로로벤질레이트(ISO), 디ㆍ디ㆍ티(ISO)[클로페노탄(INN), 1,1,1-트리클로로-2,2-비스(파라-클로로페닐)에탄], 디엘드린(ISO, INN),4,6-디니트로-오르토-크레졸[DNOC(ISO)]이나 그 염, 디노셉(ISO)과 그 염이나 에스테르, 엔도설판(ISO), 에틸렌디브로마이드(ISO)(1,2-디브로모에탄), 이염화에틸렌(ISO)(1,2-디클로로에탄), 플루오로아세트아미드(ISO), 헵타클로르(ISO), 헥사클로로벤젠(ISO),1,2,3,4,5,6-헥사클로로시클로헥산[HCH(ISO)][린데인(ISO, INN)을 포함하는 것], 수은화합물, 메타미도포스(ISO), 모노크로토포스(ISO), 옥시란(산화에틸렌), 파라티온(ISO), 파라티온-메틸(ISO)(메틸-파라티온), 펜타클로로페놀(ISO)과 그 염이나 에스테르, 과불화옥탄 술폰산과 그 염, 과불화옥탄 술폰아미드, 과불화옥탄 술포닐플루오라이드,포스파미돈(ISO),2,4,5-티(ISO)(2,4,5-트리클로로페녹시아세트산)와 그 염이나 에스테르, 트리부틸틴 화합물, 트리클로르폰(ISO)."]]],["s",2,"제3808.61~3808.69호 해당 살충 성분",[[0,0,"소호 제3808.61호부터 제3808.69호까지는 알파-사이퍼메트린(ISO), 벤디오카브(ISO), 비펜트린(ISO), 클로르페나피르(ISO), 사이플루트린(ISO), 델타메트린(INN,ISO), 에토펜프록스(INN), 페니트로티온(ISO), 람다-사이할로트린(ISO), 말라티온(ISO), 피리미포스-메틸(ISO) 또는 프로폭수르(ISO)를 함유하는 제3808호의 물품만을 포함한다."]]],["s",3,"제3824.81~3824.89호 해당 유해물질 혼합물",[[0,0,"소호 제3824.81호부터 제3824.89호까지는 다음의 물질을 하나 이상 함유하는 혼합물과 조제품만을 포함한다. 옥시란(산화에틸렌), 폴리브롬화비페닐(PBBs), 폴리 염소화비페닐(PCBs), 폴리염소화테르페닐(PCTs), 트리스(2,3-디브로모프로필)포스페이트, 앨드린(ISO), 캄페클로(ISO)(톡사핀), 클로단(ISO), 클로르데콘(ISO), 디·디·티(ISO)[클로페노탄(INN), 1,1,1-트리클로로-2,2-비스(파라-클로로페닐)에탄], 디엘드린(ISO, INN), 엔도설판(ISO), 엔드린(ISO), 헵타클로르(ISO), 미렉스(ISO), 1,2,3,4,5,6-헥사클로로시클로헥산[HCH(ISO)][린데인(ISO, INN)을 포함하는 것], 펜타클로로벤젠(ISO), 헥사클로로벤젠(ISO), 과불화옥탄술폰산, 그 염, 과불화옥탄술폰아미드, 과불화옥탄술포닐플루오라이드 또는 테트라-, 펜타-, 헥사-, 헵타- 또는  옥타 브로모디페닐에테르, 짧은사슬 염화파라핀"],[0,0,"짧은사슬 염화파라핀은 염화 정도가 전 중량의 48%를 초과하며 다음과 같은 분자식을 가진 혼합화합물이다. CxH(2x-y+2)Cly, (x=10~13, y=1.13)"]]],["s",4,"제3825.41·3825.49호 “폐유기용제”의 정의",[[0,0,"소호 제3825.41호와 제3825.49호에서 \"폐유기용제\"는 주로 유기성 용제를 함유하지만 더 이상 본래의 용도에 사용하기 부적합한 폐기물이다(용제(溶劑)의 회수를 목적으로 한 것인지에 상관없다)."]]]]],[39,"플라스틱과 그 제품","플라스틱",7,[["n",1,"“플라스틱”의 정의",[[0,0,"이 표에서 \"플라스틱\"이란 성형·주조·압출·압연이나 그 밖의 외부작용(보통 가열과 가압을 말하며, 필요한 때에는 용제나 가소제를 가할 수 있다)에 따라 중합할 때나 그 다음단계에서 변형하고, 외부작용을 배제하여도 그 형태를 유지하려는 성질을 지닌 제3901호부터 제3914호까지에 해당하는 물질을 말한다. 또한 이 표의 플라스틱에는 벌커나이즈드 파이버(vulcanised fibre)를 포함한다. 다만, 제11부의 방직용 섬유재료로 보는 것은 제외한다."]]],["n",2,"제외 물품",[[0,0,"이 류에서 다음 각 목의 것은 제외한다."],[1,1,"가. 제2710호나 제3403호의 조제 윤활유"],[1,1,"나. 제2712호나 제3404호의 왁스"],[1,1,"다. 화학적으로 단일한 유기화합물(제29류)"],[1,1,"라. 헤파린과 그 염(제3001호)"],[1,1,"마. 제3901호부터 제3913호까지의 물품으로 구성된 용액(콜로디온은 제외한다)으로서 휘발성 유기용제의 중량이 용액 전 중량의 100분의 50을 초과하는 것(제3208호)과 제3212호의 스탬프용 박(箔)"],[1,1,"바. 제3402호의 유기계면활성제나 이들의 제품"],[1,1,"사. 런검(run gum)이나 에스테르검(ester gum)(제3806호)"],[1,1,"아. 조제 첨가제[광물유(가솔린을 포함한다)나 광물유와 동일한 목적에 사용하는 그 밖의 액체용의 것(제3811호)]"],[1,1,"자. 폴리글리콜·실리콘이나 그 밖의 제39류 중합체를 기본 재료로 한 조제 유압액(제3819호)"],[1,1,"차. 플라스틱의 이면에 진단용·실험용 시약을 붙인 것(제3822호)"],[1,1,"카. 제40류의 합성고무나 이들의 제품"],[1,1,"타. 안장과 굴레(제4201호), 제4202호의 트렁크·슈트케이스·핸드백이나 그 밖의 용기"],[1,1,"파. 제46류의 조물·지조세공물(枝條細工物)이나 그 밖의 물품"],[1,1,"하. 제4814호의 벽 피복재"],[1,1,"거. 제11부의 물품(방직용 섬유와 그 제품)"],[1,1,"너. 제12부의 물품(예: 신발류·모자류·우산·양산·지팡이·채찍·승마용 채찍과 이들의 부분품)"],[1,1,"더. 제7117호의 모조 신변장식용품"],[1,1,"러. 제16부의 물품(예: 기계류나 전기기기류)"],[1,1,"머. 제17부의 항공기나 차량의 부분품"],[1,1,"버. 제90류의 물품(예: 광학소자·안경테·제도기)"],[1,1,"서. 제91류의 물품(예: 시계 케이스)"],[1,1,"어. 제92류의 물품(예: 악기류나 이들의 부분품)"],[1,1,"저. 제94류의 물품(예: 가구·조명기구·조명용사인·조립식 건축물)"],[1,1,"처. 제95류의 물품(예: 완구·게임용구·운동용구)"],[1,1,"커. 제96류의 물품[예: 브러시·단추·슬라이드파스너(slide fastener)·빗·흡연용 파이프의 마우스피스와 자루ㆍ시가렛홀더나 이와 유사한 것·진공플라스크나 이와 유사한 것의 부분품·펜·프로펠링펜슬(propelling pencil) 및 일각대·양각대·삼각대와 이와 유사한 물품]"],["M",1,"윤 왁 단 헤 용 계 런 첨 유 시 고 가 조 벽 섬 신 모 기 항 광 시 악 가 완 잡",""]]],["n",3,"제3901~3911호의 적용 범위",[[0,0,"제3901호부터 제3911호까지는 화학적인 합성으로 제조된 물품으로서 다음 각 목의 범주로 한정하여 적용된다."],[1,1,"가. 섭씨 300도(감압증류법으로 증류한 경우에는 1,013밀리바로 환산한 온도)에서 유출된 용량이 전 용량의 100분의 60 미만인 액체 상태의 합성폴리올레핀(제3901호·제3902호)"],[1,1,"나. 고중합체가 아닌 쿠마론-인덴계 수지(제3911호)"],[1,1,"다. 평균 5량체(量體) 이상의 그 밖의 합성중합체"],[1,1,"라. 실리콘수지(제3910호)"],[1,1,"마. 레졸(resol)(제3909호)과 그 밖의 프리폴리머"],["M",1,"액 쿠 합 실 레",""]]],["n",4,"“공중합체”의 정의와 분류",[[0,0,"\"공중합체(共重合體)\"란 단일 단량체(單量體) 단위가 구성 중합체 전 중량의 100분의 95 이상의 중량비를 가지지 않은 모든 중합체를 말한다. 이 류의 공중합체(共重合體)(공중합축합체·공중합부가체·블록공중합체·그라프트공중합체를 포함한다)와 혼합중합체는 문맥상 달리 해석되지 않는 한 최대 중량의 공단량체(共單量體) 단위가 해당하는 호로 분류한다. 이 경우 동일 호로 분류되는 중합체의 공단량체(共單量體) 단위를 단일 공중합체(共重合體)를 구성하는 것으로 본다. 만약, 최대 중량단위의 단일 공단량체(共單量體)가 없을 때에는 동일하게 분류가능한 해당 호 중에서 마지막 호로 분류한다."]]],["n",5,"화학적으로 변성한 중합체의 분류",[[0,0,"화학적으로 변성한 중합체(주중합체 사슬에 단지 부속되어 있는 부분이 화학반응으로 변화된 것으로 한정한다)는 변성되지 않은 중합체의 해당 호로 분류한다. 다만, 이 규정은 그라프트공중합체에는 적용하지 않는다."]]],["n",6,"“일차제품(primary form)”의 정의",[[0,0,"제3901호부터 제3914호까지에서 \"일차제품(primary form)\"은 다음 각 목의 형태인 것에만 적용한다."],[1,1,"가. 액체나 페이스트(paste)[분산물(에멀션·서스펜션)과 용액을 포함한다]"],[1,1,"나. 불규칙한 모양의 블록·럼프(lump)·가루(몰딩 가루를 포함한다)·알갱이·플레이크(flake)와 이와 유사한 벌크 모양"],["M",1,"액 블",""]]],["n",7,"제3915호에서 일차제품으로 변형된 웨이스트·스크랩 제외",[[0,0,"제3915호에서는 일차제품(primary form)으로 변형된 단일 열가소성 물질의 웨이스트(waste)·페어링(paring)·스크랩(scrap)은 제외한다(제3901호부터 제3914호까지)."]]],["n",8,"제3917호 “관·파이프·호스”의 정의",[[0,0,"제3917호의 \"관·파이프·호스\"란 보통 가스나 액체를 운반하는 데 사용되는 중공(中空)의 제품(반제품이나 완제품인지에 상관없다)을 말하며[예: 골이 진(ribbed) 정원용 호스·구멍이 뚫린 관], 소시지케이싱(sausage casing)과 그 밖의 레이플랫 튜빙(lay-flat tubing)도 포함한다. 다만, 내부 횡단면의 모양이 원형·타원형·직사각형(길이가 폭의 1.5배를 초과하지 않은 것으로 한정한다)이나 정다각형의 모양이 아닌 것은 관·파이프·호스로 볼 수 없고 형재(形材)로 본다[소시지케이싱(sausage casing)과 그 밖의 레이플랫 튜빙(lay-flat tubing)은 그렇지 않다]."]]],["n",9,"제3918호 “벽·천장 피복재”의 정의",[[0,0,"제3918호에서 \"플라스틱으로 만든 벽 피복재나 천장 피복재\"란 벽이나 천장 장식용에 적합한 폭 45센티미터 이상의 롤 모양의 제품으로서 종이 외의 재료에 영구적으로 부착시킨 플라스틱으로 구성되고, 정면 부분의 플라스틱층이 그레인(grain)장식·엠보싱(embossing)장식·착색·디자인인쇄나 그 밖의 장식으로 된 것을 말한다."]]],["n",10,"제3920·3921호 “판·시트·필름·박·스트립”의 정의",[[0,0,"제3920호와 제3921호에서 \"판·시트(sheet)·필름·박(箔)·스트립\"이란 판·시트(sheet)·필름·박(箔)·스트립(제54류의 것은 제외한다)과 규칙적인 기하학적 모양의 블록(프린트나 그 밖의 표면가공을 한 것인지에 상관없다)으로서 절단하지 않았거나 정사각형·직사각형으로 절단하되 그 이상의 가공을 하지 않은 것을 말한다(그대로 사용할 수 있는지에 상관없다)."]]],["n",11,"제3925호 (건축용 플라스틱 제품)의 적용 범위",[[0,0,"제3925호는 제2절에서 해당 호보다 선행하는 각 호에 해당하는 물품을 제외한 다음 각 목의 것에만 적용한다."],[1,1,"가. 저장기·탱크(오수정화조를 포함한다)·배트(vat)와 이와 유사한 용기로서 용량이 300리터를 초과하는 것"],[1,1,"나. 마루·벽·칸막이·천장·지붕 등의 구조물의 구성요소"],[1,1,"다. 홈통과 이들의 연결구류"],[1,1,"라. 문·창과 이들의 틀과 문지방"],[1,1,"마. 발코니·난간·울타리·대문과 이와 유사한 장벽"],[1,1,"바. 셔터·블라인드[베네치안 블라인드(venetian blind)를 포함한다]과 이와 유사한 물품, 이들의 부분품과 연결구류"],[1,1,"사. 조립용과 영구시설용 대형선반(예: 상점용·작업장용·창고용)"],[1,1,"아. 장식용 건축물[예: 플루팅(fluting)·둥근 지붕·비둘기장]"],[1,1,"자. 건물의 문·창·계단·벽이나 그 밖의 부분의 영구시설용 장착구와 부착구[예: 노브(knob)·손잡이·걸대·받침걸이·수건걸이·스위치플레이트(switch plate)와 그 밖의 보호용 널판]"],["M",1,"저 구 홈 문 발 셔 선 장 장",""]]],["s",1,"중합체·변성 중합체의 소호 분류",[[0,0,"이 류의 각 호에 해당하는 중합체[공중합체(共重合體)를 포함한다]와 화학적으로 변성한 중합체는 다음 각 목에 따라서 분류한다."],[1,1,"가. 동일 계열에서 \"기타\"로 표기된 소호가 있는 경우"],[2,1,"1) 중합체의 소호에서 접두사 \"폴리\"(예: 폴리에틸렌·폴리아미드-6,6)라는 명칭은 해당 표기된 중합체를 구성하는 단량체(單量體) 단위나 단량체(單量體) 단위들이 중합체 전 중량의 100분의 95 이상을 차지하고 있는 것을 의미한다.",[[87,114,3]]],[2,1,"2) 소호 제3901.30호·제3901.40호·제3903.20호·제3903.30호·제3904.30호의 공중합체(共重合體)는 해당 공중합체(共重合體)의 공단량체(共單量體) 단위들이 중합체 전 중량의 100분의 95 이상을 차지하는 경우로 한정하여 각 소호로 분류한다.",[[95,122,3]]],[2,1,"3) 화학적으로 변성한 중합체는 해당 물품이 다른 소호에 열거되어 있지 않은 경우로 한정하여 \"기타\"라고 표기된 소 ㆍ연필, 그리고 일각대ㆍ양각대ㆍ삼각대와 이와 유사한 물품)(제9603호의 제품용 목재로 된 몸체와 손잡이는 제외한다)"],[1,1,"더. 제97류의 물품(예: 예술품)"],["M",1,"향 대 염 활 가 조 신 산 석 신 기 시 화 가 완 잡 예",""]]],["n",2,"“고밀도화 목재”의 정의",[[0,0,"이 류에서 \"고밀도화 목재\"란 화학적·물리적인 처리(목재층을 함께 접합한 것은 접합에 필요한 처리 이상의 가공을 한 것으로 한정한다)에 따라 밀도나 경도를 증대함과 동시에 기계적 강도나 화학적·전기적 저항성을 개량한 목재를 말한다."]]],["n",3,"제4414~4421호에 파티클보드·섬유판 등의 제품 포함",[[0,0,"제4414호부터 제4421호까지는 파티클보드(particle board)나 이와 유사한 보드, 섬유판, 적층 목재, 고밀도화 목재의 제품에 적용한다."]]],["n",4,"제4410~4412호 물품의 가공 범위",[[0,0,"제4410호·제4411호·제4412호의 물품은 제4409호에서 규정한 모양으로 가공한 것, 굽은 것(curved), 물결모양으로 한 것(corrugated), 구멍을 뚫은 것(perforated), 정사각형이나 직사각형 외의 모양으로 절단하거나 성형한 것, 그 밖의 가공을 한 것으로서 다른 호에 해당하는 물품의 특성을 갖고 있지 않은 것으로 한정한다."]]],["n",5,"제4417호에서 제82류 재료의 작용부를 가진 공구 제외",[[0,0,"제4417호는 날·작용단·작용면이나 그 밖의 작용하는 부분을 제82류의 주 제1호의 재료로 만든 공구에는 적용하지 않는다."]]],["n",6,"목재에는 대나무·목질성 재료 포함",[[0,0,"위의 주 제1호에서 규정한 것을 제외하고 문맥상 달리 해석되지 않는 한 이 류 각 호에 열거된 목재에는 대나무와 목질성의 그 밖의 재료가 포함된다."]]],["s",1,"제4401.31호 “목재 펠릿”의 정의",[[0,0,"소호 제4401.31호에서 \"목재 펠릿(pellet)\"이란 기계식 목재가공업, 가구 제조나 그 밖의 목재 변형 작업 시 발생하는 대팻밥, 톱밥이나 칩과 같은 부산물을 직접 압축하거나 전 중량의 100분의 3 이하의 점결제를 첨가하여 응결시킨 것을 말한다. 이러한 펠릿(pellet)은 직경이 25밀리미터 이하이고 길이가 100밀리미터 이하인 원통형이다."]]],["s",2,"제4401.32호 “목재 브리켓”의 정의",[[0,0,"소호 제4401.32호에서 \"목재 브리켓(briquette)\"이란 기계식 목재가공업, 가구 제조나 그 밖의 목재 변형 작업 시 발생하는 대팻밥, 톱밥이나 칩과 같은 부산물을 직접 압축하거나 전 중량의 100분의 3 이하의 점결제를 첨가하여 응결시킨 것을 말한다. 이러한 브리켓(briquette)은 최소 횡단면 직경이 25밀리미터를 초과하는 입방체·다면체·원통형이다."]]],["s",3,"제4407.13호 “S-P-F”의 정의",[[0,0,"소호 제4407.13호에서 \"에스-피-에프(S-P-F)\"란 가문비나무, 소나무와 전나무의 혼합림에서 얻어진 목재로서, 각각의 종의 구성비가 불분명하고 다양한 것을 말한다."]]],["s",4,"제4407.14호 “헴퍼(Hem-fir)”의 정의",[[0,0,"소호 제4407.14호에서 \"헴퍼(Hem-fir)\"란 웨스턴 헴록(Western hemlock)과 전나무(fir)의 혼합림에서 얻어진 목재로서, 각각의 종의 구성비가 불분명하고 다양한 것을 말한다."]]],["d",1,"제4412.31호 “열대산 목재”의 범위",[[0,0,"소호제4412.31호에서 \"이 류의 국내주 제1호의 열대산 목재\"란 다음 목재 중의 하나를 말한다."],[0,0,"아부라(Abura)·아까주다푸리케(Acajoud'Afrique)·아프로모지아(Afrormosia)·아코(Ako)·아란(Alan)·안디로바(Andiroba)·아닌그레(Aningré)·아보디레(Avodiré)·아조베(Azobé)·발라우(Balau)·발사(Balsa)·보세크레어(Bosséclair)·보세폰세(B  것으로서 기계적으로 완성가공하였거나 기계적으로 광택가공한 롤 모양인 종이나 판지를 말한다."],[0,0,""],["T",[["평량(그램/제곱미터)","뮤렌파열강도의 최저치 킬로파스칼(kPa)"],["115","393"],["125","417"],["200","637"],["300","824"],["400","961"]],0,1]]],["s",2,"제4804.21·4804.29호 “자루용 크라프트지”의 정의",[[0,0,"소호 제4804.21호와 제4804.29호에서 \"자루(sack)용 크라프트지\"란 황산 공정이나 소다 공정에 따른 섬유의 함유량이 전 섬유중량의 100분의 80 이상, 1제곱미터의 중량이 60그램 이상 115그램 이하로서 다음 각 목의 조건 중 어느 하나를 충족시키는 롤 모양의 기계적 완성가공처리를 한 종이를 말한다."],[1,1,"가. 뮤렌(Mullen) 파열강도지수가 3.7킬로파스칼·제곱미터/그램 이상으로서 가로 방향의 신장율이 100분의 4.5를 초과하고, 세로 방향의 신장율이 100분의 2를 초과하는 것"],[1,1,"나. 인열(引裂)강도의 최저치와 인장(引張)강도의 최저치가 아래 표에 표시된 수치를 가지고 있거나 표에 표시되지 않은 평량(坪量)은 일직선상의 내삽(內揷)의 환산치를 가지는 것"],[1,0,""],["T",[[["평량\n(그램/제곱미터)",2,1],["인열강도의 최저치 엠엔(mN)",1,2],["인장강도의 최저치 케이엔/엠(kN/m)",1,2]],["세로방향","세로방향\n+\n가로방향","가로방향","세로방향\n+\n가로방향"],["60","700","1,510","1.9","6"],["70","830","1,790","2.3","7.2"],["80","965","2,070","2.8","8.3"],["100","1,230","2,635","3.7","10.6"],["115","1,425","3,060","4.4","12.3"]],1,2],["M",1,"뮤 인",""]]],["s",3,"제4805.11호 “반화학 플루팅지”의 정의",[[0,0,"소호 제4805.11호에서 \"반화학 플루팅지(fluting paper)\"란 기계펄프공정과 화학펄프공정의 결합으로 생산된 표백하지 않은 활엽수 섬유의 함유량이 전 섬유중량의 100분의 65 이상으로서 시엠티 30[시험조건설정 30분 후 코러게이트미디엄(corrugated medium)시험]의 압축강도가 상대습도 100분의 50, 섭씨 23도에서 1.8뉴턴/그램/제곱미터를 초과하는 롤 모양인 종이를 말한다."]]],["s",4,"제4805.12호 스트로펄프 종이의 범위",[[0,0,"소호 제4805.12호는 기계펄프공정과 화학펄프공정의 결합으로 생산된 스트로펄프(straw pulp)를 주로 하여 만들어진 롤 모양인 종이를 포함한다[1제곱미터당 중량이 130그램 이상이고 시엠티 30(시험조건설정 30분 후 코러게이트미디엄(corrugated medium)시험)의 압축강도가 상대습도 100분의50, 섭씨 23도에서 1.4뉴턴/그램/제곱미터를 초과하는 것으로 한정한다]."]]],["s",5,"제4805.24·4805.25호 테스트라이너의 범위",[[0,0,"소호 제4805.24호와 제4805.25호는 전부나 주로 회수한 종이나 판지[웨이스트(waste)와 스크랩(scrap)]의 펄프로 만들어진 종이와 판지를 포함한다. 테스트라이너(testliner)는 착색된 표층이나 표백·미표백인 비재생펄프로 만든 표층을 가질 수도 있다. 이들의 제품은 뮤렌(Mullen) 파열강도지수가 2킬로파스칼·제곱미터/그램 이상이다."]]],["s",6,"제4805.30호 “아황산 포장지”의 정의",[[0,0,"소호 제4805.30호에서 \"아황산 포장지\"란 아황산 공정에 따른 목재섬유의 함유량이 전 섬유중량의 100분의 40을 초과하고, 회분의 함유량이 100분의 8 이하로 뮤렌(Mullen) 파열강도지수가 1.47킬로파스칼·제곱미터/그램 이상으로 기계적으로 광택가공한 종이를 말한다."]]],["s",7,"제4810.22호 “경량의 도포한 종이”의 정의", SO) 또는 피리미포스-메틸(ISO)을 침투하거나 도포한 것을 분류한다."]]]]],[61,"의류와 그 부속품(메리야스 편물이나 뜨개질 편물로 한정한다)","편물제 의류",11,[["n",1,"메리야스·뜨개질 편물 제품으로 한정",[[0,0,"이 류는 메리야스 편물이나 뜨개질 편물의 제품으로 한정한다."]]],["n",2,"제외 물품",[[0,0,"이 류에서 다음 각 목의 것은 제외한다."],[1,1,"가. 제6212호의 물품"],[1,1,"나. 제6309호의 사용하던 의류나 그 밖의 사용하던 제품"],[1,1,"다. 정형외과용 기기, 외과용 벨트, 탈장대나 그 밖에 이와 유사한 물품(제9021호)"],["M",1,"브 사 정",""]]],["n",3,"제6103·6104호 “슈트”·“앙상블”의 정의",[[0,0,"제6103호와 제6104호에서는 다음 각 목에서 정하는 바에 따른다."],[1,1,"가. \"슈트\"란 겉감이 동일 직물로 제조된 두 부분이나 세 부분으로 구성된 세트의류로서 다음의 구성 부분으로 이루어진 것을 말한다."],[2,3,"- 상반신용 슈트코트나 재킷 한 점[소매 부분 이외의 겉감이 상반신용으로 재단된 4개 이상의 단으로 되어 있고, 봉제된 조끼(앞부분은 동 세트의류를 구성하는 다른 부분의 겉감과 동일 직물로 되어 있으며, 뒷부분은 슈트코트나 재킷의 안감과 동일 직물로 된 것)가 추가로 있을 수 있다]"],[2,3,"- 하반신용 의류 한 점[긴 바지·짧은 바지(breeches)와 반바지(shorts)(수영복은 제외한다)·스커트나 치마바지로서 멜빵과 가슴받이가 모두 없는 것으로 한정한다]",[[16,63,0]]],["M",2,"상 하",""],[1,0,"슈트의 구성 부분이 되는 의류는 직물의 조직·색채·조성이 모두 동일하여야 한다. 또한 스타일도 동일하고 치수가 서로 적합하거나 조화를 이루어야 한다. 다만, 다른 직물로 된 파이핑(piping)[솔기(seam) 모양으로 꿰매진 직물의 스트립(strip)]이 있을 수 있다.",[[58,83,1]]],[1,0,"두 가지 이상의 하반신용 의류가 함께 제시되는 경우[예: 긴 바지 두 벌, 긴 바지와 반바지(shorts), 스커트나 치마바지와 바지]에는 긴 바지 한 벌(여성용이나 소녀용은 스커트나 치마바지)을 슈트의 하반신용 구성 부분으로 보며, 그 밖의 의류는 슈트의 구성 부분으로 보지 않는다."],[1,0,"슈트에는 다음의 세트의류를 포함하며, 위의 모든 조건에 합치하는지에 상관없다."],[2,3,"- 모닝드레스[등으로부터 상당히 아래까지 둥근 밑단(tail)이 있는 플레인재킷(커터웨이)과 줄무늬가 있는 긴 바지로 구성된 것]"],[2,3,"- 이브닝드레스(테일코트)(일반적으로 검은 천으로 만들어졌으며 재킷의 정면 부분이 비교적 짧고 닫히지 않으며, 뒤에는 히프 부분 중간이 절단되고 늘어진 폭이 좁은 스커트 부분이 있는 것)"],[2,3,"- 디너재킷슈트(dinner jacket suit)(재킷의 형태는 앞섶이 많이 벌어진 것도 있으나 일반적으로 재킷과 유사하며, 광택이 있는 견이나 인조견 옷깃이 있는 것)"],["M",2,"모 이 디",""],[1,1,"나. \"앙상블(ensemble)\"이란 소매용으로 판매하는 동일 직물의 여러 단으로 만든 세트의류를 말하는 것으로서(제6107호·제6108호·제6109호의 슈트와 제품은 제외한다) 다음의 구성부분으로 이루어진 것을 말한다."],[2,3,"- 상반신용 의류 한 점[두 점이 한 세트가 되는 경우에는 두 번째의 상반신용 의류가 되는 풀오버(pullover)와 조끼는 제외한다]"],[2,3,"- 한 종류나 두 종류의 하반신용 의류[긴 바지·가슴받이와 멜빵이 있는 바지·짧은 바지(breeches)와 반바지(shorts)(수영복은 제외한다)·스커트나 치마바지]",[[40,87,0]]],["M",2,"상 하",""],[1,0,"앙상블(ensemble)의 구성 부분이 되는 의류는 직물의 조직·스타일·색채·조성이 모두 동일하여야 하고, 치수가 서로 적합하거나 조화를 이루어야 한다. 앙상블(ensemble)에는 제6112호에 해당하는 트랙슈트나 스키슈트를 포함하지 않는다.",[[60,85,1]]],["M",1,"슈 앙","가~나"]]],["n",4,"제6105·6106호에서 제외되는 의류",[[0,0,"제6105호와 제6106호에는 허리 아랫부분에 주머니가 있는 의류, 의류 밑 부분에 골이 진 허릿단이나 그 밖의 조이는 부분이 있는 의류, 적어도 10센티미터 × 10센티미터 범위에 가로, 세로 방향으로 각각 바늘코(stitch) 수가 1센티미터당 평균 10개 미만인 의류는 제외하며, 제6105호에는 소매가 없는 의류를 포함하지 않는다."],[0,0,"\"셔츠\"와 \"셔츠블라우스\"는 상반신용 의류로서 소매가 길거나 짧으며, 넥라인(neckline)을 기점으로 완전히 또는 부분적으로 트임(opening)이 있다. \"블라우스\"는 헐렁한 상반신용 의류로서 소매가 없는 것도 있으며, 넥라인을 기점으로 트임이 있거나 없을 수 있다. \"셔츠\"·\"셔츠블라우스\"·\"블라우스\"는 깃(collar)이 있을 수도 있다."]]],["n",5,"제6109호에서 밑단을 조이는 의류 제외",[[0,0,"제6109호에는 의류 밑 부분에 조임끈(drawstring)·골이 진 허릿단이나 그 밖의 조이는 부분이 있는 의류를 포함하지 않는다."]]],["n",6,"제6111호 “유아용 의류” (신장 86㎝ 이하)와 우선 분류",[[0,0,"제6111호는 다음 각 목에서 정하는 바에 따른다."],[1,1,"가. \"유아용 의류와 부속품\"이란 신장이 86센티미터 이하인 어린이용을 말한다."],[1,1,"나. 제6111호와 이 류의 그 밖의 다른 호로 동시에 분류될 수 있는 물품은 제6111호로 분류한다."],["M",1,"유 우",""]]],["n",7,"제6112호 “스키슈트”의 정의",[[0,0,"제6112호의 \"스키슈트\"란 일반적으로 외양과 천에 따라 원칙적으로 스키(크로스컨트리나 알파인)를 할 때 입는 의류나 세트의류로 인정되는 것을 말하며, 다음 각 목의 것 중 하나로 구성된다."],[1,1,"가. \"스키오버롤(ski overall)\"[상반신과 하반신을 덮도록 디자인한 전신용 의류를 말하며 소매와 깃(collar) 외에 주머니나 풋스트랩(footstrap)이 있을 수 있다]"],[1,1,"나. \"스키앙상블(ensemble)\"(소매용으로 포장된 두 매나 세 매로 된 세트의류를 말하며 다음을 포함한다)"],[2,3,"- 아노락(anorak)·윈드치터(wind-cheater)·윈드재킷(wind-jacket)이나 그 밖에 이와 유사한 한 점의 의류로서 슬라이드파스너(slide fastener)(지퍼)로 닫히며, 추가로 조끼도 있을 수 있다."],[2,3,"- 긴 바지(허리 위까지 올라오는지에 상관없다)·짧은 바지(breeches)·가슴받이와 멜빵이 있는 바지 한 점"],["M",2,"아 바",""],[1,0,"\"스키앙상블(ski ensemble)\"에는 가목의 물품과 유사한 오버롤(overall)과 오버롤(overall) 위에 입는 패드를 넣은 소매 없는 재킷을 포함한다.",[[1,20,0]]],[1,0,"\"스키앙상블(ski ensemble)\"의 구성요소가 되는 의류는 천·스타일·조성이 모두 동일하여야 하며(동일한 색깔인지에 상관없다), 치수가 서로 적합하거나 조화를 이루어야 한다.",[[1,20,0]]],["M",1,"오 앙","가~나"]]],["n",8,"제6113호와 다른 호에 함께 해당하면 제6113호",[[0,0,"제6113호와 이 류의 그 밖의 다른 호로 동시에 분류될 수 있는 의류는(제6111호는 제외한다) 제6113호로 분류한다."]]],["n",9,"남성용·여성용 의류의 구분 (여밈 방향)",[[0,0,"이 류의 의류로서 전면 부분이 왼편이 오른편 위로 잠기도록 디자인되어 있는 물품은 남성용이나 소년용 의류로 보며, 오른편이 왼편 위로 잠기도록 디자인되어 있는 물품은 여성용이나 소녀용 의류로 본다. 해당 의류의 재단법이 남성용이나 여성용으로 디자인되어 있음을 명백히 가리킬 경우에는 이 규정을 적용하지 않는다. 남성 재생한 것)을 사용하지 않은 것과 귀금속이나 귀금속을 입힌 금속을 사용하지 않은 것(귀금속을 도금하거나 미미한 구성물로 사용한 경우는 제외한다)을 말한다."]]],["s",1,"“가루”·“가루 모양”의 정의",[[0,0,"소호 제7106.10호·제7108.11호·제7110.11호·제7110.21호·제7110.31호·제7110.41호에서 \"가루\"와 \"가루 모양\"이란 메시(mesh) 구경이 0.5밀리미터인 체를 통과한 중량이 전 중량의 100분의 90 이상인 물품을 말한다."]]],["s",2,"제7110.11·7110.19호 “백금”의 범위",[[0,0,"이 류의 주 제4호나목에도 불구하고 소호 제7110.11호와 제7110.19호에서 \"백금\"이란 이리듐(iridium)·오스뮴(osmium)·팔라듐(palladium)·로듐(rhodium)·루테늄(ruthenium)은 포함하지 않는다."]]],["s",3,"제7110호 소호의 합금 분류",[[0,0,"제7110호의 소호에 합금을 분류하는 경우 각각의 합금은 플라티늄(platinum)·팔라듐(palladium)·로듐(rhodium)·이리듐(iridium)·오스뮴(osmium)·루테늄(ruthenium) 중 각각 다른 금속보다 중량이 가장 많은 금속으로 분류한다."]]]]],[72,"철강","철강",15,[["n",1,"철강 용어의 정의 (선철·합금철·강·평판압연제품 등)",[[0,0,"이 류에서 다음 각 목의 용어는 아래에서 정하는 바에 따른다(라목·마목·바목은 이 표의 전체에 적용한다)."],[1,1,"가. 선철(銑鐵)"],[1,0,"\"선철(銑鐵)\"이란 실용상 단조(鍛造)에 적합하지 않은 철－탄소의 합금으로서 탄소의 함유량이 전 중량의 100분의 2를 초과하고, 다음에 열거한 하나 이상의 그 밖의 원소의 함유량이 중량비로 다음 한도 이하인 것을 말한다.",[[43,63,1],[64,66,0]]],["K",[["크로뮴","100분의 10",0],["망간","100분의 6",0],["인","100분의 3",0],["규소","100분의 8",0]],1],[2,3,"- 그 밖의 원소의 함유량의 합계 100분의 10",[[2,27,7]]],[1,1,"나. 스피그라이즌(spiegeleisen)"],[1,0,"\"스피그라이즌(spiegeleisen)\"이란 망간의 함유량이 전 중량의 100분의 6 초과 100분의 30 이하인 철－탄소의 합금으로서 그 밖의 원소의 함유량은 가목에서 정하는 기준에 해당한 것을 말한다."],[1,1,"다. 합금철(ferro-alloy)"],[1,0,"\"합금철(ferro-alloy)\"이란 피그(pig)·블록(block)·럼프(lump)나 이와 유사한 일차제품(primary form) 형태인 합금, 연속주조법으로 제조한 모양인 합금, 알갱이 모양이나 가루 모양인 합금으로서(응결된 것인지에 상관없다), 통상 그 밖의 합금 제조시에 첨가제로 사용되거나 철을 야금(冶金)할 때에 탈산제·탈황제나 이와 유사한 용도로 사용되고, 보통 실용상 단조(鍛造)에는 적합하지 않고, 철의 함유량이 전 중량의 100분의 4 이상이며, 다음에 열거한 원소의 하나 이상의 함유량이 중량비로 다음 비율을 초과하는 것을 말한다.",[[261,292,4]]],["K",[["크로뮴","100분의 10",0],["망간","100분의 30",0],["인","100분의 3",0],["규소","100분의 8",0]],1],[2,3,"- 그 밖의 원소의 함유량의 합계 100분의 10(탄소를 제외하고, 구리는 최대의 함유량을 전 중량의 100분의 10으로 한다)",[[2,27,7]]],[1,1,"라. 강(鋼)"],[1,0,"\"강(鋼)\"이란 실용상 단조(鍛造)에 적합한 철재(주조 모양으로 제조된 것은 제외한다)로서, 탄소의 함유량이 전 중량의 100분의 2 이하인 것을 말하고, 제7203호의 철재는 제외한다. 다만, 크로뮴(chromium)강은 탄소의 함유량이 전 중량의 100분의 2를 초과하여 함유될 수 있다.",[[52,72,1],[125,145,1],[146,148,0]]],[1,1,"마. 스테인리스강"],[1,0,"\"스테인리스강\"이란 탄소의 함유량이 전 중량의 100분의 1.2 이하이고 크로뮴(chromium)의 함유량이 전 중량의 100분의 10.5 이상인 합금강을 말한다(그 밖의 원소가 함유되어 있는지에 상관없다).",[[11,31,1]]],[1,1,"바. 그 밖의 합금강"],[1,0,"\"그 밖의 합금강\"이란 스테인리스강의 정의에 해당하지 않고, 다음에 열거한 원소의 하나 이상의 함유량이 중량비로 다음 비율 이상인 강을 말한다.",[[34,65,4]]],["K",[["알루미늄","100분의 0.3",0],["붕소","100분의 0.0008",0],["크로뮴","100분의 0.3",0],["코발트","100분의 0.3",0],["구리","100분의 0.4",0],["납","100분의 0.4",0],["망간","100분의 1.65",0],["몰리브데늄","100분의 0.08",0],["니켈","100분의 0.3",0],["니오븀","100분의 0.06",0],["규소","100분의 0.6",0],["티타늄","100분의 0.05",0],["텅스텐(볼프람)","100분의 0.3",0],["바나듐","100분의 0.1",0],["지르코늄","100분의 0.05",0]],1],[2,3,"- 그 밖의 원소(황·인·탄소·질소는 제외한다) 각각 100분의 0.1"],[1,1,"사. 재용해용 철강의 스크랩 잉곳(scrap ingot)",[[3,31,5]]],[1,0,"\"재용해용 철강의 스크랩 잉곳(scrap ingot)\"이란 잉곳(ingot) 모양[피더헤드(feeder-head)나 핫톱(hot top)이 없는 것]이나 피그(pig) 모양으로 거칠게 주조한 제품으로서 표면에 흠이 뚜렷하게 나타나 있으며, 선철(銑鐵)·스피그라이즌(spiegeleisen)·합금철(ferro-alloy)의 화학적 조성에 해당하지 않는 것을 말한다.",[[1,29,5]]],[1,1,"아. 알갱이"],[1,0,"\"알갱이\"란 메시(mesh) 구경이 1밀리미터인 체를 통과한 중량이 전 중량의 100분의 90 미만이고, 메시(mesh) 구경이 5밀리미터인 체를 통과한 중량이 전 중량의 100분의 90 이상인 물품을 말한다.",[[27,52,5],[79,104,5]]],[1,1,"자. 반제품"],[1,0,"\"반제품\"이란 횡단면에 중공(中空)이 없는 연속주조제품[일차 열간(熱間)압연공정을 거친 것인지에 상관없다]과 일차 열간(熱間)압연공정이나 단조(鍛造)에 따른 거친 성형보다 더 가공하지 않은 중공(中空)이 없는 그 밖의 제품을 말한다[형강(形鋼)의 블랭크를 포함하며, 이들 제품들은 코일상태로는 되어 있지 않다]."],[1,1,"차. 평판압연제품"],[1,0,"\"평판압연제품\"이란 자목의 정의에 해당하지 않고 횡단면에 중공(中空)이 없는 직사각형(정사각형은 제외한다)의 압연제품으로서 그 모양이 다음과 같은 것을 말한다."],[2,3,"- 연속적 적층 모양인 코일이거나"],[2,3,"- 직선형인 경우에는 두께가 4.75밀리미터 미만이고, 폭이 두께의 열 배 이상인 것이나 두께가 4.75밀리미터 이상이며, 폭이 150밀리미터를 초과하고, 적어도 두께의 두 배 이상인 것으로 한정한다."],["M",2,"코 직",""],[1,0,"평판압연제품은 압연할 때에 직접 발생하는 부조무늬[예: 홈·리브(rib)·체크무늬·물방울무늬·단추무늬·마름모꼴무늬]가 있는 것, 구멍을 뚫은 것, 물결 모양으로 한 것, 연마한 것도 포함한다(다른 호에 해당하는 물품이나 제품의 특성이 있는 것은 제외한다). 직사각형이나 정사각형 외의 형태의 평판압연제품은 크기에 상관없이 폭이 600밀리미터 이상인 제품으로 분류한다(다른 호에 해당하는 물품이나 제품의 특성이 있는 것은 제외한다).",[[107,141,3],[205,239,3]]],[1,1,"카. 불규칙적으로 감은 코일 모양인 열간(熱間)압연한 봉",[[3,29,6]]],[1,0,"\"불규칙적으로 감은 코일 모양인 열간(熱間)압연한 봉\"이란 불규칙적으로 감은 코일 모양인 열간(熱間)압연한 제품 계[선반(터닝센터를 포함한다)은 제외한다]에만 적용한다."],[1,1,"가. 머시닝(machining) 프로그램에 따라 매거진이나 그 밖에 이와 유사한 장치로부터 공구를 자동적으로 교환하는 방법[머시닝 센터(machining centre)]"],[1,1,"나. 고정된 가공물에 대하여 서로 다른 유닛헤드(unit head)를 자동적으로 작용시켜 동시 또는 연속으로 가공하는 방법[싱글스테이션(single station)의 유닛컨스트럭션머신(unit construction machine)]"],[1,1,"다. 가공물을 서로 다른 유닛헤드(unit head)로 자동 이송하는 방법[멀티스테이션(multi-station)의 트랜스퍼머신(transfer machine)]"],["M",1,"교 고 이",""]]],["n",5,"제8462호 “슬리팅 설비”·“절단 설비”의 정의",[[0,0,"제8462호에서 평판제품용 \"슬리팅(slitting) 설비\"란 코일 풀기용 기계·코일 편평기·슬리터(slitter)·코일 감기용 기계로 구성된 가공설비를 말한다. 평판제품용 \"일정한 길이로 절단하는 설비(cut-to-length line)\"란 코일 풀기용 기계·코일 편평기·전단기(剪斷機)로 구성된 가공설비를 말한다."]]],["n",6,"제8471호 “자동자료처리기계”의 정의와 단위기기",[[1,1,"가. 제8471호에서 \"자동자료처리기계\"란 다음을 말한다."],[2,1,"1) 하나 이상의 처리용 프로그램과 적어도 프로그램 실행에 바로 소요되는 자료를 기억할 수 있으며"],[2,1,"2) 사용자의 필요에 따라 프로그램을 자유롭게 작성하고"],[2,1,"3) 사용자가 지정한 수리 계산을 실행할 수 있으며"],[2,1,"4) 처리 중의 논리 판단에 따라 변경을 요하는 처리프로그램을 사람의 개입 없이 스스로 변경할 수 있는 것"],["M",2,"기 작 계 변","1)~4)"],[1,1,"나. 자동자료처리기계는 여러 개의 독립된 기기로 구성된 시스템의 형태를 갖춘 경우도 있다."],[1,1,"다. 아래 라목이나 마목의 것은 제외하고 다음 요건을 모두 충족하는 단위기기는 자동자료처리시스템의 일부로 본다."],[2,1,"1) 자동자료처리시스템에 전용되거나 주로 사용되는 것"],[2,1,"2) 중앙처리장치에 직접적으로 접속되거나 한 개 이상의 다른 단위기기를 통하여 접속될 수 있는 것"],[2,1,"3) 해당 시스템에서 사용하는 부호나 신호의 형식으로 자료를 받아들이거나 전송할 수 있는 것"],[2,0,"자동자료처리기계의 단위기기들이 분리되어 제시되는 경우에는 제8471호로 분류한다."],[2,0,"그러나, 다목 2)와 3)의 조건을 충족하는 키보드, 엑스-와이코디네이트(X-Y co-ordinate) 입력장치, 디스크 기억장치는 어떠한 경우라도 제8471호로 분류한다."],["M",2,"전 접 부","1)~3)"],[1,1,"라. 다음 물품은 분리되어 제시되는 경우 위의 주 제6호다목의 모든 요건을 충족하더라도 제8471호로 분류되지 않는다."],[2,1,"1) 프린터, 복사기, 팩시밀리(결합되었는지에 상관없다)"],[2,1,"2) 음성, 영상이나 그 밖의 데이터를 송신하거나 수신하기 위한 기기[유선이나 무선 네트워크(예를 들어 근거리 통신망이나 원거리 통신망)에서 통신을 위한 기기를 포함한다]"],[2,1,"3) 확성기, 마이크로폰"],[2,1,"4) 텔레비전 카메라, 디지털 카메라, 비디오카메라레코더"],[2,1,"5) 텔레비전 수신기기를 갖추지 않은 모니터와 프로젝터"],["M",2,"프 송 확 카 모","1)~5)"],[1,1,"마. 자동자료처리기계와 결합되거나 연결되어 자료처리 외의 특정한 기능을 수행하는 기계는 각각의 고유한 기능에 따라 해당 호로 분류하며, 그 기능에 따라 분류되는 호가 없는 경우에는 잔여 호로 분류한다."]]],["n",7,"연마강구(제8482호)와 그 밖의 강구(제7326호)",[[0,0,"공칭(公稱) 지름에 대한 최대오차가 100분의 1 이하이거나 0.05밀리미터 이하(둘 중 작은 기준을 적용한다)인 연마강구(鋼球)는 특히 제8482호로 분류하며, 그 밖의 강구(鋼球)는 제7326호로 분류한다."]]],["n",8,"다용도 기계는 주 용도로, 불명확하면 제8479호",[[0,0,"두 가지 이상의 용도에 사용되는 기계류의 분류에서는 그 주 용도를 유일한 용도로 취급하여 이를 분류한다. 어느 호에도 주 용도가 규정되어 있지 않거나 주 용도가 불명확한 기계류는 이 류의 주 제2호나 제16부의 주 제3호에 따라 분류되는 경우를 제외하고 문맥상 달리 해석되지 않는 한 제8479호로 분류한다. 또한 제8479호에는 금속선·방직용 섬유사·그 밖의 재료나 이들 재료를 혼합하여 로프나 케이블을 제조하는 기계도 포함된다[예: 스트랜딩(stranding)기, 트위스팅(twisting)기, 케이블링(cabling)기]."]]],["n",9,"제8470호 “포켓 사이즈”의 기준",[[0,0,"제8470호에서 \"포켓 사이즈\"라는 용어는 크기가 170밀리미터 × 100밀리미터 × 45밀리미터 이하인 기계에만 적용한다."]]],["n",10,"제8485호 “적층제조(3D 프린팅)”의 정의와 우선 분류",[[0,0,"제8485호에서 \"적층제조\"(3D 프린팅이라고도 한다)란 디지털 모델을 바탕으로 재료(예: 금속·플라스틱이나 세라믹)를 연속적으로 부가·적층하고 경화·응고시켜 물리적인 대상을 형성하는 것을 말한다. 제16부 주 제1호와 제84류 주 제1호에 따라 적용될 호가 정하여지는 경우를 제외하고, 제8485호의 표현을 만족하는 기계는 이 표의 다른 호에 분류하지 않으며, 제8485호에 분류한다."]]],["n",11,"제8486호 (반도체·평판디스플레이 제조기계)의 범위",[[1,1,"가. 제85류의 주 제12호가목과 나목의 \"반도체 디바이스\"와 \"전자집적회로\"의 표현은 이 주와 제8486호에서도 적용된다. 다만, 이 주와 제8486호의 목적에 따라 \"반도체 디바이스\"는 감광성 반도체 디바이스와 발광다이오드(엘이디)를 포함한다."],[1,1,"나. 이 주와 제8486호의 목적상 \"평판디스플레이의 제조\"는 기판을 평판으로 제조하는 것을 포함한다. \"평판디스플레이의 제조\"는 유리 제조나 평판에 인쇄회로기판이나 그 밖의 전자부품을 조립하는 것은 포함하지 않는다. \"평판디스플레이\"는 음극선관 기술을 포함하지 않는다."],[1,1,"다. 제8486호에는 다음에 전용되거나 주로 사용되는 기계를 분류한다."],[2,1,"1) 마스크와 레티클(reticle)의 제조·수리"],[2,1,"2) 반도체디바이스나 전자집적회로의 조립"],[2,1,"3) 보울(boule), 웨이퍼(wafer), 반도체디바이스, 전자집적회로와 평판디스플레이의 권양(捲揚), 취급, 적하(積荷)나 양하(蘘荷)"],["M",2,"마 조 취",""],[1,1,"라. 제16부의 주 제1호와 제84류의 주 제1호의 규정에 따라 적용될 호가 정하여지는 경우를 제외하고, 제8486호의 표현을 만족하는 기계는 이 표의 다른 호로 분류하지 않으며, 제8486호로 분류한다."]]],["s",1,"제8465.20호 “머시닝센터”의 정의",[[0,0,"소호 제8465.20호의 목적상 \"머시닝센터(machining centre)\"란 목재, 코르크, 뼈, 경질 고무, 경질 플라스틱 또는 이와 유사한 경질 재료의 가공용 공작기계로서, 머시닝(machining) 프로그램에 따라 매거진이나 그 밖에 이와 유사한 장치로부터 공구를 자동적으로 교환하는 방법으로 여러 가지 종류의 기계가공을 행할 수 있는 것에만 적용한다."]]],["s",2,"제8471.49호 “시스템”의 정의",[[0,0,"소호 제8471.49호에서 \"시스템\"이란 제84류의 주 제6호다목의 조건들을 충족하는 기기들로 이루어진 자동자료처리기계를 말하며, 적어도 중앙처리장치와 한 개의 입력장치(예: 키보드나 스캐너)와 한 개의 출력장치(예: 영상디스플레이장치나 프린터)로 이루어진 것을 말한다."]]],["s",3,"제8481.20호 유압·공기압 전송용 밸브",[[0,0,"소호 제8481.20호에서 \"유압이나 공기압 전송용 밸브\"는 에너지 원천이 가압된 유체(액체 또는 가스)의 형태로 공급되는 액압 또는 공기압 시스템에서 특별히 \"유체 동력\"의 전송에 사용되는 밸브를 말한다. 이러한 밸브는 형태가 다양할 수 있다[예: 감압형, 체크(check)형]. 소호 제8481.20호는 제8481호의 모든 다른 소호에 우선한다."]]],["s",4,"제8482.40호 니들롤러 베어링의 범위",[[0,0,"소호 제8482.40호는 지름이 5밀리미터 이하이고 길이가 최소한 지름의 세 배 이상인 원통 롤러를 갖춘 베어링에만 적용한다. 롤러의 양끝은 둥근 것일 수도 있다."]]]]],[85,"전기기기와 그 부분품, 녹음기·음성 재생기·텔레비전의 영상과 음성의 기록기·재생기와 이들의 부분품·부속품","전기 제품",16,[["n",1,"제외 물품",[[0,0,"이 류에서 다음 각 목의 것은 제외한다."],[1,1,"가. 전기가열식 모포·베드패드(bed pad)·발싸개나 이와 유사한 물품, 전기가열식 의류·신발류·귀가리개와 그 밖의 착용품이나 신변용품"],[1,1,"나. 제7011호의 유리제품"],[1,1,"다. 제8486호의 기계와 기기"],[1,1,"라. 내과용·외과용·치과용·수의과용 진공기기(제9018호)"],[1,1,"마. 제94류의 전기가열식 가구"],["M",1,"가 유 반 진 가",""]]],["n",2,"제8501~8504호에서 제외되는 물품",[[0,0,"제8501호부터 제8504호까지에서는 제8511호·제8512호·제8540호·제8541호·제8542호에 규정한 물품을 제외한다. 다만, 금속조의 수은아크 정류기(metal tank mercury arc)는 제8504호로 분류한다."]]],["n",3,"제8507호 “축전지”의 범위",[[0,0,"제8507호에서 \"축전지\"는 에너지 저장 및 공급 기능을 제공하거나 접속자, 온도조절장치[예: 서미스터(thermistor)], 회로보호장치와 같이 손상으로부터 보호하는 부수적 구성요소와 함께 제시되는 것을 포함한다. 또한 축전지는 사용될 물품의 보호용 하우징의 일부를 포함할 수도 있다."]]],["n",4,"제8509호 가정용 전기기계식 기기의 범위",[[0,0,"제8509호에는 일반적으로 가정에서 사용하는 다음 각 목의 전기기계식 기기만을 분류한다."],[1,1,"가. 바닥광택기·식품용 그라인더·식품용 믹서·과실주스나 채소주스 추출기(중량에 상관없다)"],[1,1,"나. 가목에서 규정한 전기기기 외의 것으로서 그 중량이 20킬로그램 이하인 것"],[1,0,"다만, 팬과 팬을 결합한 환기용·순환용 후드[필터를 갖추었는지에 상관없다(제8414호)], 원심식 의류건조기(제8421호), 접시세척기(제8422호), 가정용 세탁기(제8450호), 로울기(roller machine)나 그 밖의 다림질기(제8420호나 제8451호), 재봉기(제8452호), 전기가위(제8467호), 전열기기(제8516호)는 제8509호로 분류하지 않는다."],["M",1,"광 이",""]]],["n",5,"제8517호 “스마트폰”의 정의",[[0,0,"제8517호에서 \"스마트폰\"이란 자동자료처리기계의 기능(예: 제3자 애플리케이션을 포함한 다수의 응용프로그램을 설치하여 동시에 실행)을 수행하도록 만든 휴대기기용 운영체제를 갖춘 셀룰러 통신망용 전화기를 말한다(디지털 카메라나 내비게이션 시스템 등 다른 기능을 장착했는지에 상관없다)."]]],["n",6,"제8523호 비휘발성 기억장치·“스마트카드”의 정의",[[0,0,"제8523호에서"],[1,1,"가. \"솔리드스테이트(solid-state)의 비휘발성 기억장치[예: \"플래시 메모리카드(flash memory card)\"나 \"플래시 전자 기억카드(flash electronic storage card)\"]\"란 인쇄회로기판 위에 하나 이상의 집적회로 형태의 플래시메모리(flash memory)[예: 플래시이이피롬(FLASH E²PROM)]를 동일 하우징 속에 구성하고, 연결용 소켓을 갖춘 기억장치를 말한다. 이러한 물품은 집적회로 형태의 제어기와 축전기·저항기와 같은 수동(受動) 개별 부품을 갖춘 것도 있다."],[1,1,"나. \"스마트카드\"란 하나 이상의 칩 형태 전자집적회로[하나의 마이크로프로세서, 램(RAM)이나 롬(ROM)]를 내장한 카드를 말한다. 이러한 카드는 접속부, 마그네틱스트라이프(magnetic stripe)나 내장형 안테나를 갖춘 것도 있으나, 다른 종류의 능동이나 수동 회로소자를 갖춘 것은 제외한다."],["M",1,"솔 스",""]]],["n",7,"제8524호 “평판디스플레이 모듈”의 정의",[[0,0,"제8524호에서 \"평판디스플레이 모듈\"이란 정보를 표시하기 위한 디스플레이 스크린을 최소한으로 갖춘 장치나 기기를 말하며, 사용하기 전에 다른 호에 분류되는 물품에 결합되도록 설계한 것이다. 평판디스플레이 모듈의 스크린은 평평한 것, 곡선형인 것, 구부러지는 것, 접거나 늘일 수 있는 형태를 포함하나 이들 형태로만 한정되는 것은 아니다. 평판디스플레이 모듈은 영상신호를 수신하고 이들 신호를 화면의 픽셀에 할당하기 위해 필요한 부가요소를 결합하고 있을 수 있다. 그러나 제8524호에는 영상신호를 변환하는 부품[예: 스케일러IC, 복조IC나 애플리케이션 프로세서(AP)]을 장착하였거나 다른 호에 해당하는 물품의 특성을 가진 디스플레이 모듈은 포함하지 않는다."],[0,0,"이 주에서 정의한 평판디스플레이 모듈의 분류에 있어서는 제8524호가 이 표의 다른 어느 호보다 우선한다."]]],["n",8,"제8534호 “인쇄회로”의 정의",[[0,0,"제8534호에서 \"인쇄회로\"란 인쇄제판기술[예: 양각·도금·식각(etching)]이나 막(膜) 회로기술로 도체소자·접속자나 그 밖의 인쇄된 구성 부분[예: 인덕턴스(inductance)·저항기·축전기]을 절연기판 위에 형성하여 만든 회로를 말한다. 다만, 해당 구성 부분이 미리 정하여진 패턴에 따라 상호 접속되어 있는지에 상관없으며 전기적인 신호를 발생·정류·변조·증폭할 수 있는 소자(예: 반도체소자)는 제외한다."],[0,0,"인쇄회로에는 인쇄공정 중에 얻어지는 소자 외의 소자가 결합된 회로와 개별·불연속 저항기, 축전기나 인덕턴스(inductance)는 포함하지 않는다. 다만, 인쇄회로에는 인쇄되지 않은 접속용 소자가 부착되어 있는 것도 있다."],[0,0,"동일한 기술공정에서 얻어지는 수동소자와 능동소자로 구성되는 박막회로(thin-film circuit)나 후막회로(thick-film circuit)는 제8542호로 분류한다."]]],["n",9,"제8536호 광섬유용 커넥터의 범위",[[0,0,"제8536호에서 광섬유용·광섬유다발용·케이블용 커넥터는 디지털 통신용 시스템에서 단순히 광섬유의 끝 상호간을 기계적으로 맞추기 위한 커넥터를 말한다. 이러한 것들은 신호의 증폭·재생·변조의 기능이 없는 것이다."]]],["n",10,"무선 적외선 원격제어기기는 제8543호",[[0,0,"제8537호에는 텔레비전 수신기기나 그 밖의 전기장치의 원격제어를 위한 무선 적외선기기는 포함하지 않는다(제8543호)."]]],["n",11,"제8539호 “LED 광원” (모듈·램프)의 정의",[[0,0,"제8539호에서 \"발광다이오드(엘이디) 광원\"이란 다음의 것을 말한다."],[1,1,"가. \"발광다이오드(엘이디) 모듈\"은 전기회로 내에 정렬된 발광다이오드를 기반으로 하며 전기·기계·열·광학 부품과 같은 추가적인 부품을 포함하는 광원을 말한다. 이들은 또한 전력의 공급이나 제어를 위해 개별능동소자, 개별수동소자 또는 제8536호나 제8542호의 물품을 포함한다. 발광다이오드 모듈에는 모듈을 조명기구에 쉽게 설치하거나 교체하고 기계적·전기적 접촉을 가능하게 해주는 캡이 부착되어 있지 않다.",[[49,75,1],[173,221,0]]],[1,1,"나. \"발광다이오드(엘이디) 램프\"는 전기·기계·열·광학 부품과 같은 추가적인 부품을 결합한 하나 이상의 발광다이오드 모듈을 포함하는 광원을 말한다. 발광다이오드 모듈과 발광다이오드 램프의 차이점은 램프에는 조명기구에 쉽게 설치하거나 교체하고 기계적·전기적 접촉을 가능하게 해주는 캡이 부착되어 있다는 점이다.",[[21,47,1],[116,164,0]]],["M",1,"모 램",""]]],["n",12,"제8541·8542호 “반도체 디바이스”·“전자집적회로”의 정의",[[0,0,"제8541호와 제8542호에서"],[1,1,"가. 1) \"반도체 디바이스\"란 전계(電界)의 작용에 따른 저항의 변화로 작동을 하는 반도체 디바이스나 반도체 기반의 트랜스듀서를 말한다."],[1,0,"반도체 디바이스는 보조적 기능을 하는 능동·수동소자를 장착하였는지 여부에 관계없이 다수 부품의 조립품을 포함할 수도 있다."],[1,0,"이 정의에서 \"반도체 기반의 트랜스듀서\"란 개별 반도체 기반 센서·반도체 기반 액츄에이터·반도체 기반 공진기·반도체 기반 오실레이터로서 반도체를 기반으로 한 디바이스로 별개의 형태를 갖추었으며, 고유의 기능을 수행하며, 어떠한 종류의 물리적·화학적 현상·활동을 전기적 신호로 바꾸거나 전기적 신호를 물리적인 현상·활동으로 바꾸는 기능을 하는 디바이스를 말한다."],[1,0,"반도체 기반의 트랜스듀서를 구성하거나 기능하게 하는 모든 부품들은 분리불가능하게 결합되어 있고, 분리불가능하게 부착된 필수 부품들을 포함할 수도 있다."],[1,0,"다음의 각 표현은 아래의 설명과 같다."],[2,1,"가) \"반도체 기반\"이란 반도체 기판 위에 형성·제조되었거나 반도체 재료로 만들어진 것으로서, 반도체 기술로 제조되고, 반도체 기판이나 재료가 트랜스듀서 기능과 성능에 핵심적이고 대체불가능한 역할을 수행하며, 그 작동이 물리적·전기적·화학적·광학적 특성을 포함한 반도체 특성에 기반하는 것을 말한다."],[2,1,"나) \"물리적·화학적 현상\"은 압력, 음파, 가속, 진동, 운동, 방위, 왜력, 자기장의 세기, 전기장의 세기, 빛, 방사능, 습도, 흐름, 화학물질의 농도 등의 현상과 관련된 것이다.",[[17,87,1]]],[2,1,"다) \"반도체 기반 센서\"는 반도체 디바이스의 한 형태로서, 반도체 덩어리 상태나 반도체 표면에 만들어져서 물리적·화학적 양을 감지해 이를 전기신호(전기적 속성의 변화나 기계구조 변위의 결과로 발생)로 변환하는 기능을 하는 마이크로전자나 기계 구조물로 구성된다.",[[16,59,3],[125,146,7]]],[2,1,"라) \"반도체 기반 엑추에이터(actuator)\"는 반도체 디바이스의 한 형태로서, 반도체 덩어리 상태나 반도체 표면에 만들어져서 전기적 신호를 물리적인 움직임으로 변환하는 기능을 가진 마이크로전자나 기계 구조물로 구성된다.",[[29,72,3],[73,103,4],[104,125,7]]],[2,1,"마) \"반도체 기반 공진기(resonator)\"란 반도체 디바이스의 한 형태로서, 반도체 덩어리 상태나 반도체 표면에 만들어져서 외부 신호에 반응하여 구조물의 물리적인 기하학적 성질에 따라 미리 규정된 주파수의 기계적·전기적 진동을 발생시키는 기능을 가진 마이크로전자나 기계 구조물로 구성된다.",[[28,71,3],[106,142,2],[143,164,7]]],[2,1,"바) \"반도체 기반 오실레이터(oscillator)\"란 반도체 디바이스의 한 형태로서, 반도체 덩어리 상태나 반도체 표면에 만들어져서 구조물의 물리적인 기하학적 성질에 의해 미리 규정된 주파수의 기계적·전기적 진동을 발생시키는 기능을 가진 마이크로전자나 기계 구조물로 구성된다.",[[8,28,5],[31,74,3],[97,133,2],[134,155,7]]],[2,1,"2) \"발광다이오드(엘이디)\"란 반도체 물질에 기반하여 전기에너지를 가시광선·적외선·자외선으로 변환시키는 반도체 디바이스이다(서로 전기적으로 연결되었는지와 보호용의 다이오드를 결합하였는지에 상관없다). 제8541호의 발광다이오드(엘이디)는 전력공급이나 전력제어를 위한 부품은 장착하고 있지 않다."],["M",2,"기 현 센 엑 공 오 발","가)~2)"],[1,1,"나. \"전자집적회로\"란 다음 물품을 말한다."],[2,1,"1) 모노리식(monolithic) 집적회로"],[2,0,"회로소자[다이오드·트랜지스터·저항기·축전기·인덕턴스(inductance) 등]가 하나의 반도체 재료나 화합물 반도체 재료[예: 도프된(doped) 실리콘, 비소화갈륨(gallium arsenide), 실리콘 게르마늄, 인화인듐(indium phosphide)]의 내부나 표면에 한 덩어리 상태로 집적되어 있으며, 분리가 불가능하도록 결합된 회로",[[16,42,5]]],[2,1,"2) 하이브리드 집적회로"],[2,0,"박막(薄膜)기술이나 후막(厚膜)기술로 만들어진 수동소자[저항기·축전기·인덕턴스(inductance) 등]와 반도체 기술로 만들어진 능동소자[다이오드·트랜지스터·모노리식(monolithic) 집적회로 등]를 절연재료(유리, 도자제 등)로 된 하나의 기판 위에 실용상 분리가 불가능하도록 상호접속자나 상호접속용 케이블로 결합한 회로를 말하며, 이 회로에는 개별 부품을 부착시킨 것도 포함된다.",[[31,57,5]]],[2,1,"3) 복합구조칩 집적회로"],[2,0,"각자의 의도와 목적에 따라 분리가 불가능하도록 결합된 두 개 이상의 모노리식(monolithic) 집적회로로 구성된 복합구조의 칩으로 이루어진 집적회로를 말한다. 한 개 이상의 절연기판과 리드프레임(lead frame)을 갖춘 것인지에 상관없으며 다른 능동 회로소자나 수동 회로소자를 갖춘 것은 제외한다."],[2,1,"4) 복합부품집적회로(MCOs)"],[2,0,"하나 이상의 모노리식, 하이브리드 또는 복합구조칩 집적회로에 다음 구성부품을 최소한 하나 이상 결합한 것이다:"],[2,0,"실리콘기반센서·엑추에이터(actuators)·오실레이터(oscillator)·공진기(resonator) 및 이들의 결합물, 또는 제8532호·제8533호·제8541호에 분류되는 물품의 기능을 수행하는 부품 또는 제8504호에 분류되는 유도자,"],[2,0,"이들은 집적회로와 같이 사실상 분리 불가능하게 단일체로 형성되었고, 핀, 리드, 볼, 랜드, 범프 또는 패드로 접속되어 인쇄회로기판(PCB) 또는 다른 매개체에 조립되기 위한 부품이다."],[2,0,"이 정의에서"],[3,1,"가) \"구성부품\"은 개별 부품일 수도 있고, 별도로 제조되어 복합부품 집적회로의 나머지 부분 위에 조립되거나 다른 구성부품에 집적될 수 있다."],[3,1,"나) \"실리콘 기반\"이란 실리콘 기판 위에 조립되었거나, 실리콘 재료로 제작되었거나, 또는 집적회로 다이(die) 위에 제조된 것을 말한다."],[3,1,"다) (1) \"실리콘 기반 센서\"는 마이크로전자 또는 기계 구조물로 구성된 것으로 덩어리 상태로 또는 반도체 표면에 만들어지고, 물리적·화학적 현상을 감지해 이를 전기신호(전기적 속성의 변화 또는 기계 구조 변위의 결과로 발생)로 변환하는 기능을 한다. \"물리적 또는 화학적 현상\"은 압력, 음파, 가속, 진동, 운동, 방위, 왜력, 자기장의 세기, 전기장의 세기, 빛, 방사능, 습도, 흐름, 화학물질의 농도 등 현상과 관련된 것이다.",[[159,229,1]]],[4,1,"(2) \"실리콘 기반 엑추에이터(actuator)\"는 덩어리 상태로 또는 반도체 표면에 생성되고 전기적 신호를 물리적인 움직임으로 변환하는 기능을 가진 마이크로전자와 기계 구조물로 구성된 부품이다.",[[54,84,4]]],[4,1,"(3) \"실리콘 기반 공진기(resonator)\"란 덩어리 상태로 또는 반도체 표면에 생성되고 외부 신호에 반응하여 구조물의 물리적인 기하학적 성질에 의해 미리 규정된 주파수의 기계적 또는 전기적 진동을 발생시키는 기능을 가진 마이크로전자와 기계 구조물로 구성된 부품을 말한다.",[[29,52,6],[65,146,0]]],[4,1,"(4) \"실리콘 기반 오실레이터(oscillator)\"란 덩어리 상태로 또는 반도체 표면에 생성되고 구조물의 물리적인 기하학적 성질에 의해 미리 규정된 주파수의 기계적 또는 전기적 진동을 발생시키는 기능을 가진 마이크로전자와 기계 구조물로 구성된 능동 부품을 말한다.",[[9,29,5],[32,55,6],[56,137,0]]],["M",4,"엑 공 오","(2)~(4)"],["M",3,"구 실 센","가)~다)"],["M",2,"모 하 복 부","1)~4)"],["M",1,"반 집","가~나"],[0,2,"※ 이 주에서 규정한 물품을 분류하는 경우 제8541호나 제8542호는, 제8523호의 경우를 제외하고, 특히 그 기능으로 보아 해당 물품을 포함하는 것으로 해석되는 이 표의 다른 어느 호보다 우선한다."]]],["s",1,"고속 카메라의 범위 (제8525.81호)",[[0,0,"소호 제8528.81호에는 고속 텔레비전 카메라, 디지털 카메라와 비디오카메라 레코더로서 다음의 특징 중 하나 이상을 가진 것만을 분류한다."],[1,3,"- 기록속도가 마이크로초당 0.5밀리미터를 초과하는 것"],[1,3,"- 시간 분해도가 50나노초 이하인 것"],[1,3,"- 초당 225,000 프레임을 초과하는 것"],["M",1,"기 시 프",""]],{"a":"원문의 “소호 제8528.81호”는 제8525.81호의 오기로 보입니다. 이 표의 소호 8525.81 품명이 “이 류의 소호주 제1호에 규정된 고속 카메라”입니다."}],["s",2,"방사선 경화·내방사선 카메라의 범위 (제8525.82호)",[[0,0,"소호 제8528.82호에서 방사선 경화나 내(耐)방사선 텔레비전 카메라, 디지털 카메라와 비디오카메라 레코더는 고방사선 환경에서 작동할 수 있도록 설계되거나 보강된 것을 말한다. 이들 카메라는 작동상의 품질저하 없이 최소한 방사선량 50×103 Gy(실리콘)(5×106 RAD(실리콘))을 견딜 수 있도록 설계된다."]],{"a":"원문의 “소호 제8528.82호”는 제8525.82호의 오기로 보입니다. 이 표의 소호 8525.82 품명이 “이 류의 소호주 제2호에 규정된 방사선 경화·내방사선 카메라”를 가리킵니다."}],["s",3,"야간투시 카메라의 범위 (제8525.83호)",[[0,0,"소호 제8528.83호에는 야간투시용 텔레비전 카메라·디지털 카메라·비디오카메라 레코더로서, 광전음극을 사용하여 해당하는 빛을 전자로 변환하고 이를 증폭하여 가시적 이미지로 변환하는 것을 분류한다. 이 소호에는 열화상 카메라는 제외한다(일반적으로 소호 제8525.89호)."]],{"a":"원문의 “소호 제8528.83호”는 제8525.83호의 오기로 보입니다. 이 표의 소호 8525.83 품명이 “이 류의 소호주 제3호에 규정된 야간투시 카메라”입니다."}],["s",4,"제8527.12호 포켓 사이즈 카세트 플레이어",[[0,0,"소호 제8527.12호에는 외부의 전원 없이 작동할 수 있는 것으로서 크기가 170밀리미터 × 100밀리미터 × 45밀리미터 이하인 카세트 플레이어(앰프는 내장되어 있으나 확성기는 내장되어 있지 않은 것)만을 분류한다."]]],["s",5,"제8549.11~8549.19호 “수명이 끝난 일차전지·축전지”",[[0,0,"소호 제8549.11호부터 제8549.19호까지에서 \"수명이 끝난 일차전지와 축전지\"란 파손·절단·소진이나 그 밖의 이유 등으로 사용할 수도 재충전할 수도 없는 것을 말한다."]]]]],[86,"철도용이나 궤도용 기관차·차량과 이들의 부분품, 철도용이나 궤도용 장비품과 그 부분품, 기계식(전기기계식을 포함한다) 각종 교통신호용 기기","철도 차량",17,[["n",1,"제외 물품",[[0,0,"이 류에서 다음 각 목의 것은 제외한다."],[1,1,"가. 목재나 콘크리트로 만든 철도용이나 궤도용 받침목이나 콘크리트로 만든 호버트레인(hovertrain)용 가이드트랙섹션(guide-track section)(제4406호나 제6810호)"],[1,1,"나. 제7302호의 철강으로 만든 철도용이나 궤도건설용 재료"],[1,1,"다. 제8530호의 전기식 신호기기·안전기기·교통관제용 기기"],["M",1,"받 철 신",""]]],["n",2,"제8607호 (철도차량 부분품)에 포함되는 물품",[[0,0,"제8607호에는 특히 다음 각 목의 물품이 포함된다."],[1,1,"가. 차축·차륜·차륜세트(주행장치)·금속  한 것은 포함하지 않는다."]]],["n",4,"제9703호에서 대량생산 복제품 등 제외",[[0,0,"제9703호에는 대량생산된 복제품이나 상업적 성격을 지닌 판에 박힌 기교의 작품은 분류하지 않는다(이들 작품을 예술가가 디자인하거나 만들었는지는 상관없다)."]]],["n",5,"이 류 우선 분류, 제9706호는 다른 호 물품에 미적용",[[1,1,"가. 이 류와 이 표의 다른 류로 동시에 분류될 수 있는 물품은 주 제1호부터 주 제4호까지에서 정한 경우를 제외하고는 전부 이 류로 분류한다."],[1,1,"나. 제9706호는 이 류의 다른 호로 분류되는 물품에는 적용하지 않는다."]]],["n",6,"그림 등의 틀은 작품과 함께 분류",[[0,0,"회화·데생·파스텔·콜라주(collage)나 이와 유사한 장식판·동판화·목판화·석판화 등의 틀은 이들 작품과 같이 분류한다(이들의 틀은 위의 물품에 비추어 가격이나 종류가 적정하여야 한다). 이 주에서 언급된 작품에 비하여 가격이나 종류가 적정하지 않은 틀은 별도로 분류한다."]],{"a":"원문(2022. 12. 31. 개정)에는 이 주가 “5.”로 표기되어 번호가 중복됩니다. HS 2022 협약상 제97류 주 제6호에 해당합니다."}]]]],"hd":{"0101":"살아 있는 말·당나귀·노새·버새","0102":"살아 있는 소","0103":"살아 있는 돼지","0104":"살아있는 면양과 염소","0105":"살아 있는 가금(家禽)류[닭(갈루스 도메스티쿠스(Gallus domesticus)종으로 한정한다)·오리·거위·칠면조·기니아새로 한정한다]","0106":"그 밖의 살아 있는 동물","0201":"쇠고기(신선한 것이나 냉장한 것으로 한정한다)","0202":"쇠고기(냉동한 것으로 한정한다)","0203":"돼지고기(신선한 것, 냉장하거나 냉동한 것으로 한정한다)","0204":"면양과 염소의 고기(신선한 것, 냉장하거나 냉동한 것으로 한정한다)","0205":"말·당나귀·노새·버새의 고기(신선한 것, 냉장하거나 냉동한 것으로 한정한다)","0206":"소·돼지·면양·염소·말·당나귀·노새·버새의 식용 설육(屑肉)(신선한 것, 냉장하거나 냉동한 것으로 한정한다)","0207":"제0105호의 가금(家禽)류의 육과 식용 설육(屑肉)(신선한 것, 냉장하거나 냉동한 것으로 한정한다)","0208":"그 밖의 육과 식용 설육(屑肉)(신선한 것, 냉장하거나 냉동한 것으로 한정한다)","0209":"살코기가 없는 돼지 비계와 가금(家禽)의 비계(기름을 빼지 않은 것이나 그 밖의 방법으로 추출하지 않은 것으로서 신선한 것·냉장하거나 냉동한 것·염장하거나 염수장한 것·건조하거나 훈제한 것으로 한정한다)","0210":"육과 식용 설육(屑肉)(염장하거나 염수장한 것·건조하거나 훈제한 것으로 한정한다), 육이나 설육(屑肉)의 식용 고운 가루·거친 가루","0301":"활어","0302":"신선하거나 냉장한 어류[제0304호의 어류의 필레(fillet)와 그 밖의 어육은 제외한다]","0303":"냉동어류[제0304호의 어류의 필레(fillet)와 기타 어육은 제외한다]","0304":"어류의 필레(fillet)와 그 밖의 어육(잘게 썰었는지에 상관없으며, 신선한 것·냉장한 것·냉동한 것으로 한정한다)","0305":"건조한 어류, 염장이나 염수장한 어류, 훈제한 어류(훈제과정 중이나 훈제 전에 조리한 것인지에 상관없다)","0306":"갑각류(껍데기가 붙어 있는 것인지에 상관없으며 살아 있는 것과 신선한 것·냉장한 것·냉동한 것·건조한 것·염장이나 염수장한 것), 훈제한 갑각류(껍데기가 붙어 있는 것인지 또는 훈제 전이나 훈제과정 중에 조리한 것인지에 상관없다), 껍데기가 붙어 있는 상태로 물에 찌거나 삶은 갑각류(냉장한 것·냉동한 것·건조한 것·염장이나 염수장한 것인지에 상관없다)","0307":"연체동물(껍데기가 붙어 있는 것인지에 상관없으며, 살아 있는 것과 신선한 것·냉장한 것·냉동한 것·건조한 것·염장이나 염수장한 것), 훈제한 연체동물(껍데기가 붙어 있는 것인지 또는 훈제 전이나 훈제과정 중에 조리한 것인지에 상관없다)","0308":"수생(水生) 무척추동물(갑각류와 연체동물은 제외하며, 살아 있는 것과 신선한 것·냉장한 것·냉동한 것·건조한 것, 염장이나 염수장한 것), 훈제한 수생(水生) 무척추동물(갑각류와 연체동물은 제외하며, 훈제 전이나 훈제과정 중에 조리한 것인지에 상관없다)","0309":"어류·갑각류·연체동물과 그 밖의 수생무척추동물의 고운 가루·거친 가루와 펠릿(pellet)(식용에 적합한 것으로 한정한다)","0401":"밀크와 크림(농축하지 않은 것으로서 설탕이나 그 밖의 감미료를 첨가하지 않은 것으로 한정한다)","0402":"밀크와 크림(농축하였거나 설탕이나 그 밖의 감미료를 첨가한 것으로 한정한다)","0403":"요구르트, 버터밀크·응고밀크와 응고크림·케피어(kephir)와 그 밖의 발효되거나 산성화된 밀크와 크림(농축한 것인지 또는 설탕이나 그 밖의 감미료를 첨가한 것인지 또는 향·과실·견과류·코코아를 첨가한 것인지에 상관없다)","0404":"유장(농축한 것인지 또는 설탕이나 그 밖의 감미료를 첨가한 것인지에 상관없다)과 따로 분류된 것 외의 천연밀크의 성분을 함유하는 물품(설탕이나 그 밖의 감미료를 첨가한 것인지에 상관없다)","0405":"버터와 그 밖의 지방과 기름(밀크에서 얻은 것으로 한정한다), 데어리 스프레드(dairy spread)","0406":"치즈와 커드(curd)","0407":"새의 알(껍질이 붙은 것으로서 신선한 것, 보존처리하거나 조리한 것으로 한정한다)","0408":"새의 알(껍질이 붙지 않은 것)과 알의 노른자위(신선한 것, 건조한 것, 물에 삶았거나 찐 것, 성형한 것, 냉동한 것이나 그 밖의 보존처리를 한 것으로 한정하며, 설탕이나 그 밖의 감미료를 첨가한 것인지에 상관없다)","0409":"천연꿀","0410":"곤충과 그 밖의 식용인 동물성 생산품(따로 분류되지 않은 것으로 한정한다)","0501":"사람 머리카락(가공하지 않은 것으로 한정하며, 세척이나 세정을 했는지에 상관없다)과 그 웨이스트(waste)","0502":"돼지털·멧돼지털·오소리털과 그 밖의 브러시 제조용 동물의 털과 이들의 웨이스트(waste)","0504":"동물(어류는 제외한다)의 장·방광·위의 전체나 부분(신선한 것·냉장이나 냉동한 것·염장이나 염수장한 것·건조한 것·훈제한 것으로 한정한다)","0505":"새의 깃털이나 솜털이 붙은 가죽과 그 밖의 부분, 깃털과 그 부분(가장자리를 정리했는지에 상관없다), 새의 솜털(청정·소독·보존을 위한 처리 이상의 가공을 하지 않은 것으로 한정한다), 새의 깃털이나 그 부분의 가루와 웨이스트(waste)","0506":"뼈와 혼코어(horn-core)[가공하지 않은 것, 탈지(脫脂)한 것, 단순히 정리한 것(특정한 형상으로 깎은 것은 제외한다), 산(酸)처리를 하거나 탈교한(degelatinised) 것], 이들의 가루와 웨이스트(waste)","0507":"아이보리(ivory)·귀갑(龜甲)·고래수염과 그 털·뿔(horn)·사슴뿔·발굽·발톱·부리(가공하지 않은 것과 단순히 정리한 것으로 한정하며, 특정한 모양으로 깎은 것은 제외한다), 이들의 가루와 웨이스트(waste)","0508":"산호와 이와 유사한 물품(가공하지 않은 것과 단순히 정리한 것으로 한정하며, 더 이상의 가공을 한 것은 제외한다), 연체동물·갑각류·극피동물의 껍데기와 오징어뼈(가공하지 않은 것과 단순히 정리한 것으로 한정하며, 특정한 모양으로 깎은 것은 제외한다)와 이들의 가루와 웨이스트(waste)","0510":"용연향(ambergris)·해리향(castoreum)·시빗(civet)과 사향, 캔대리디즈(cantharides), 쓸개즙(건조했는지에 상관없다), 의약품 제조용 선(腺)이나 그 밖의 동물성 생산품(신선한 것, 냉장·냉동이나 그 밖의 방법으로 일시적으로 보존하기 위하여 처리한 것으로 한정한다)","0511":"따로 분류되지 않은 동물성 생산품과 제1류나 제3류의 동물의 사체로서 식용에 적합하지 않은 것","0601":"인 수수(신선한 것·냉장이나 냉동한 것·건조한 것으로서 잘게 부수었는지에 상관없다), 주로 식용에 적합한 과실의 핵(核)과 그 밖의 식물성 생산품[볶지 않은 시코리엄티부스 새티범(Cichorium intybus sativum) 변종의 치커리(chicory) 뿌리를 포함한다]으로서 따로 분류되지 않은 것","1213":"곡물의 짚과 껍질[조제하지 않은 것으로 한정하며, 절단하거나 잘게 부수거나 압착한 것인지 또는 펠릿(pellet) 모양인지에 상관없다]","1214":"스위드(swede)·맹골드(mangold)·사료용 뿌리채소류(根菜類)·건초·루우산(lucerne)(알팔파)·클로버(clover)·샌포인(sainfoin)·사료용 케일(kale)·루핀(lupine)·베치(vetch)와 이와 유사한 사료용 식물[펠릿(pellet) 모양인지에 상관없다]","1301":"락(lac), 천연 검·수지·검 수지·올레오레진(oleoresin)[예: 발삼(balsam)]","1302":"식물성 수액과 추출물(extract), 펙틴질, 펙티닝산염(pectinate)과 펙틴산염(pectate), 식물성 원료에서 얻은 한천·그 밖의 점질물과 시커너(thickener)(변성 가공했는지에 상관없다)","1401":"편조물(編組物)에 주로 사용되는 식물성 재료[예: 대나무, 등나무, 갈대, 골풀, 버드나무 가지(osier), 라피아(raffia), 청정·표백·염색한 곡물의 짚과 라임나무(lime) 껍질]","1404":"따로 분류되지 않은 식물성 생산품","1501":"돼지의 지방[라드(lard)를 포함한다]과 가금(家禽)의 지방(제0209호나 제1503호의 것은 제외한다)","1502":"소·면양·염소의 지방(제1503호의 것은 제외한다)","1503":"라드스테아린(lard stearin), 라드유(lard oil), 올레오스테아린(oleostearin), 올레오유(oleo-oil), 탤로우유(tallow oil)로서 유화·혼합이나 그 밖의 조제를 하지 않은 것","1504":"어류나 바다에서 사는 포유동물의 지방과 기름 및 그 분획물(정제했는지에 상관없으며 화학적으로 변성 가공한 것은 제외한다)","1505":"울그리스(wool grease)와 이것에서 얻은 지방성 물질[라놀린(lanolin)을 포함한다]","1506":"그 밖의 동물성 지방과 기름 및 그 분획물(정제했는지에 상관없으며 화학적으로 변성 가공한 것은 제외한다)","1507":"대두유와 그 분획물(정제했는지에 상관없으며 화학적으로 변성 가공한 것은 제외한다)","1508":"땅콩기름과 그 분획물(정제했는지에 상관없으며 화학적으로 변성 가공한 것은 제외한다)","1509":"올리브유와 그 분획물(정제했는지에 상관없으며 화학적으로 변성 가공한 것은 제외한다)","1510":"그 밖의 올리브유와 그 분획물(올리브에서 얻은 것으로서 정제했는지에 상관없으며 화학적으로 변성 가공한 것은 제외하고, 이들의 기름이나 그 분획물이 제1509호의 기름이나 그 분획물과 혼합된 것을 포함한다)","1511":"팜유와 그 분획물(정제했는지에 상관없으며 화학적으로 변성 가공한 것은 제외한다)","1512":"해바라기씨유·잇꽃유·목화씨유와 그 분획물(정제했는지에 상관없으며 화학적으로 변성 가공한 것은 제외한다)","1513":"야자[코프라(copra)]유, 팜핵유(palm kernel oil), 바바수유(babassu oil)와 이들의 분획물(정제했는지에 상관없으며 화학적으로 변성 가공한 것은 제외한다)","1514":"유채유(rape oil, colza oil), 겨자유와 이들의 분획물(정제했는지에 상관없으며 화학적으로 변성 가공한 것은 제외한다)","1515":"그 밖의 비휘발성인 식물성·미생물성 지방과 기름[호호바유(jojoba oil)를 포함한다]과 그 분획물(정제했는지에 상관없으며 화학적으로 변성 가공한 것은 제외한다)","1516":"동물성·식물성·미생물성 지방과 기름 및 이들의 분획물[전체적으로나 부분적으로 수소를 첨가한 것, 인터에스텔화한(inter-esterified) 것, 리에스텔화한(re-esterified) 것, 엘라이딘화한(elaidinised) 것으로 한정하며, 정제했는지에 상관없으며 더 이상 가공한 것은 제외한다]","1517":"마가린, 동물성·식물성·미생물성 지방이나 기름 또는 이 류의 다른 지방이나 기름의 분획물로 만든 식용 혼합물이나 조제품(제1516호의 식용 지방이나 기름 또는 이들의 분획물은 제외한다)","1518":"동물성·식물성·미생물성 지방과 기름 및 이들의 분획물(끓이거나 산화·탈수·황화·취입하거나 진공상태나 불활성 가스에서 가열중합하거나 그 밖의 화학적 변성을 한 것으로 한정하며, 제1516호의 물품은 제외한다), 따로 분류되지 않은 것으로서 식용에 적합하지 않은 동물성·식물성·미생물성 지방이나 기름 또는 이 류의 다른 지방이나 기름의 분획물의 혼합물이나 조제품","1520":"글리세롤(glycerol)(가공하지 않은 것으로 한정한다), 글리세롤 수(水), 글리세롤 폐액(廢液)","1521":"식물성 왁스[트리글리세라이드(triglyceride)는 제외한다]·밀랍(蜜蠟)과 그 밖의 곤충 왁스·고래 왁스(정제했는지 또는 착색했는지에 상관없다)","1522":"데그라스(degras), 지방성 물질이나 동물성·식물성 왁스를 처리할 때 생기는 잔유물","1601":"소시지나 그 밖에 이와 유사한 물품[육·설육(屑肉)·피·곤충으로 조제한 것으로 한정한다]과 이들 물품을 기본 재료로 한 조제 식료품","1602":"그 밖의 조제하거나 보존처리한 육·설육(屑肉)·피·곤충","1603":"육·어류·갑각류·연체동물이나 그 밖의 수생(水生) 무척추동물의 추출물(extract)과 즙","1604":"조제하거나 보존처리한 어류, 캐비어, 어란(魚卵)으로 조제한 캐비어 대용물","1605":"조제하거나 보존처리한 갑각류·연체동물·그 밖의 수생(水生) 무척추동물","1701":"사탕수수당이나 사탕무당, 화학적으로 순수한 자당(蔗糖)(고체 상태인 것으로 한정한다)","1702":"그 밖의 당류(糖類)[화학적으로 순수한 유당(乳糖)·맥아당·포도당·과당을 포함하며, 고체상태인 것으로 한정한다], 당시럽[향미제(香味劑)나 착색제를 첨가하지 않은 것으로 한정한다], 인조꿀(천연꿀을 혼합했는지에 상관없다), 캐러멜당","1703":"당밀(糖蜜)[당류(糖類)를 추출하거나 정제할 때 생긴 것으로 한정한다]","1704":"설탕과자(백색 초콜릿을 포함하며, 코코아를 함유한 것은 제외한다)","1801":"코코아두(원래 모양이나 부순 것으로서 생 것이나 볶은 것으로 한정한다)","1802":"코코아의 껍데기와 껍질, 그 밖의 코코아 웨이스트(waste)","1803":"코코아 페이스트(paste)[탈지(脫脂)한 것인지에 상관없다]","1804":"코코아 버터(지방이나 기름)","1805":"코코아 가루(설탕이나 그 밖의 감미료를 첨가한 것은 제외한다)","1806":"초콜릿과 코코아를 함유한 그 밖의 조제 식료품","1901":"맥아 추출물(extract)과 고운 가루·부순 알곡·거친 가루·전분이나 맥아 추출물(extract)의 조제 식료품[코코아를 함유하지 않은 것이나 완전히 탈지(脫脂)한 상태에서 측정한 코코아의 함유량이 전 중량의 100분의 40 미만인 것으로 따로 분류되지 않은 것으로 한정한다], 제0401호부터 제0404호까지에 해당하는 물품의 조제 식료품[코코아를 함유하지 않은 것이나 완전히 탈지(脫脂)한 상태에서 측정한 코코아의 함유량이 전 중량의 100분의 5 미만인 것으로 따로 분류되지 않은 것으로 한정한다]","1902":"파스타[조리한 것인지 또는 육(肉)이나 그 밖의 물품으로 속을 채운 것인지에 상관없으며 스파게티·마카로니·누들·라자니아(lasagne)·뇨키(gnocchi)·라비올리(ravioli)·카넬로니(cannelloni) 등과 같이 그 밖의 방법으로 조제한 것을 포함한다]와 쿠스쿠스(couscous)(조제한 것인지에 상관없다)","1903":"타피오카와 전분으로 조제한 타피오카 대용물[플레이크(flake) 모양·낱알 모양·진주 모양·무거리 모양·그 밖에 이와 유사한 모양의 것으로 한정한다]","1904":"곡물이나 곡물 가공품을 팽창시키거나 볶아서 얻은 조제 식료품[예: 콘 플레이크(corn flake)]과 낱알 모양ㆍ플레이크(flake) 모양이나 그 밖의 가공한 곡물(옥수수는 제외하며 고운 가루ㆍ부순 알곡ㆍ거친 가루는 제외하고 사전조리나 그 밖의 방법으로 조제한 것으로서 따로 분류되지 않은 것으로 한정한다)","1905":"빵·파이·케이크·비스킷과 그 밖의 베이커리 제품(코코아를 함유하였는지에 상관없다), 성찬용 웨이퍼·제약용에 적합한 빈 캡슐·실링웨이퍼(sealing wafer)·라이스페이퍼(rice paper)와 그 밖에 이와 유사한 물품","2001":"식초나 초산으로 조제하거나 보존처리한 채소·과실·견과류와 그 밖의 식용에 적합한 식물의 부분","2002":"조제하거나 보존처리한 토마토(식초나 초산으로 처리한 것은 제외한다)","2003":"조제하거나 보존처리한 버섯과 송로(松露)(식초나 초산으로 처리한 것은 제외한다)","2004":"조제하거나 보존처리한 그 밖의 채소(식초나 초산으로 처리한 것은 제외하고, 냉동한 것으로 한정하며, 제2006호의 물품은 제외한다)","2005":"조제하거나 보존처리한 그 밖의 채소(식초나 초산으로 처리한 것은 제외하고, 냉동하지 않은 것으로 한정하며, 제2006호의 물품은 제외한다)","2006":"설탕으로 보존처리한 채소·과실·견과류·과피와 식물의 그 밖의 부분[드레인한(drained) 것, 설탕을 입히거나 설탕에 절인 것]","2007":"잼·과실젤리·마멀레이드(marmalade)·과실이나 견과류의 퓨레(purée)·과실이나 견과류의 페이스트(paste)(조리해서 얻은 것으로 한정하며, 설탕이나 그 밖의 감미료를 첨가했는지에 상관없다)","2008":"그 밖의 방법으로 조제하거나 보존처리한 과실·견과류와 그 밖의 식용에 적합한 식물의 부분(설탕이나 그 밖의 감미료나 주정을 첨가했는지에 상관없으며 따로 분류되지 않은 것으로 한정한다)","2009":"과실·견과류 주스(포도즙과 코코넛 워터를 포함한다)·채소 주스[발효하지 않고 주정을 함유하지 않은 것(설탕이나 그 밖의 감미료를 첨가했는지에 상관없다)]","2101":"커피·차·마테(maté)의 추출물(extract)·에센스(essence)·농축물과 이것들을 기본 재료로 한 조제품, 커피·차·마테(mate)를 기본 재료로 한 조제품, 볶은 치커리(chicory)·그 밖의 볶은 커피 대용물과 이들의 추출물(extract)·에센스(essence)·농축물","2102":"효모(활성이거나 불활성인 것), 그 밖의 단세포 미생물(죽은 것으로 한정하며, 제3002호의 백신은 제외한다)과 조제한 베이킹 파우더","2103":"소스와 소스용 조제품, 혼합조미료, 겨자의 고운 가루·거친 가루와 조제한 겨자","2104":"수프·브로드(broth)와 수프·브로드(broth)용 조제품, 균질화한 혼합 조제 식료품","2105":"아이스크림과 그 밖의 빙과류(코코아를 함유했는지에 상관없다)","2106":"따로 분류되지 않은 조제 식료품","2201":"물(천연이나 인조 광천수와 탄산수를 포함하며, 설탕이나 그 밖의 감미료 또는 맛이나 향을 첨가하지 않은 것으로 한정한다)과 얼음과 눈","2202":"설탕이나 그 밖의 감미료 또는 맛이나 향을 첨가한 물(광천수와 탄산수를 포함한다)과 그 밖의 알코올을 함유하지 않은 음료(제2009호의 과실·견과류·채소 주스는 제외한다)","2203":"맥주","2204":"포도주(생포도로 제조한 것으로 한정하며, 알코올로 강화한 포도주를 포함한다)와 포도즙(제2009호의 것은 제외한다)","2205":"베르무트(vermouth)와 그 밖에 이와 유사한 포도주[생포도로 제조한 것으로서 식물이나 방향성(芳香性) 물질로 맛이나 향을 첨가한 것으로 한정한다]","2206":"그 밖의 발효주[예: 사과술·배술·미드(mead)·청주(saké)], 따로 분류되지 않은 발효주의 혼합물, 발효주와 알코올을 함유하지 않은 음료와의 혼합물","2207":"변성하지 않은 에틸알코올(알코올의 용량이 전 용량의 100분의 80 이상인 것으로 한정한다), 변성 에틸알코올과 그 밖의 변성 주정(알코올의 용량은 상관없다)","2208":"변성하지 않은 에틸알코올(알코올의 용량이 전 용량의 100분의 80 미만인 것으로 한정한다), 증류주·리큐르(liqueur)와 그 밖의 주정음료","2209":"식초와 초산으로 만든 식초 대용물","2301":"육·설육(屑肉)·어류·갑각류·연체동물이나 그 밖의 수생(水生) 무척추동물의 고운 가루·거친 가루·펠릿(pellet)(식용에 적합하지 않은 것으로 한정한다)과 수지박","2302":"밀기울·쌀겨와 그 밖에 이와 유사한 박(residue)류[펠릿(pellet) 모양인지에 상관없으며 곡물·채두류(菜豆類)의 선별·제분이나 그 밖의 처리과정에서 생기는 것으로 한정한다]","2303":"전분박과 이와 유사한 박(residue)류, 비트펄프(beet-pulp), 버개스(bagasse)와 그 밖의 설탕을 제조할 때 생기는 웨이스트(waste), 양조하거나 증류할 때 생기는 박과 웨이스트[펠릿(pellet) 모양인지에 상관없다]","2304":"대두유를 추출할 때 얻는 오일 케이크와 고체 형태의 유박[잘게 부순 것인지 또는 펠릿(pellet) 모양인지에 상관없다]","2305":"땅콩기름을 추출할 때 얻는 오일 케이크와 고체 형태의 유박[잘게 부순 것인지 또는 펠릿(pellet) 모양인지에 상관없다]","2306":"오일 케이크와 그 밖의 고체 형태인 유박[잘게 부순 것인지 또는 펠릿(pellet) 모양인지에 상관없으며 제2304호나 제2305호의 것은 제외한 식물성·미생물성 지방이나 기름을 추출할 때 생기는 것으로 한정한다]","2307":"와인리스(wine lees)와 생주석(argol)","2308":"사료용 식물성 물질·식물성 웨이스트(waste)·식물성 박(residue)류와 부산물[펠릿(pellet) 모양인지에 상관없으며 따로 분류되지 않은 것으로 한정한다]","2309":"사료용 조제품","2401":"잎담배와 담배 부산물","2402":"시가(cigar)·셔루트(cheroot)·시가릴로(cigarillo)·궐련(담배나 담배 대용물인 것으로 한정한다)","2403":"그 밖의 제조 담배, 제조한 담배 대용물, 균질화하거나 재구성한 담배·담배 추출물(extract)과 에센스(essence)","2404":"담배·재구성한 담배·니코틴이나 담배 대용물·니코틴 대용물을 함유한 물품(연소시키지 않고 흡입하도록 만들어진 것으로 한정한다), 니코틴을 함유한 그 밖의 물품으로 인체 내에 니코틴을 흡수시키도록 만들어진 것","2501":"소금(식탁염과 변성염을 포함한다), 순염화나트륨[수용액(水溶液)인지 또는 고결(固結)방지제나 유동제를 첨가한 것인지에 상관없다]과 바닷물","2502":"황화철광[배소(焙燒)하지 않은 것으로 한정한다]","2503":"황[승화황(昇華黃)·침강황(沈降黃)·콜로이드황은 제외한다]","2504":"천연 흑연","2505":"천연 모래(착색된 것인지에 상관없으며 제26류의 금속을 함유하는 모래는 제외한다)","2506":"석영(천연 모래는 제외한다)과 규암[톱질이나 그 밖의 방법으로 거칠게 다듬거나 단순히 절단하여 직사각형(정사각형을 포함한다)의 블록 모양이나 슬래브 모양으로 한 것인지에 상관없다]","2507":"고령토와 그 밖의 고령토질의 점토[하소(煆燒)한 것인지에 상관없다]","2508":"그 밖의 점토(제6806호의 팽창된 점토는 제외한다)·홍주석(紅柱石)·남정석(藍晶石)·규선석(硅線石) [하소(煆燒)한 것인지에 상관없다], 멀라이트(mullite), 샤모트(chamotte)나 다이나스 어스(dinas earth)","2509":"초크","2510":"천연 인산칼슘·천연 인산알루미늄칼슘·인산염을 함유한 초크","2511":"천연 황산바륨[중정석(重晶石)], 천연 탄산바륨[독중석(毒重石)][하소(煆燒)한 것인지에 상관없으며 제2816호의 산화바륨은 제외한다]","2512":"규조토[예: 키절구어(kieselguhr)·트리폴리트(tripolite)·다이어토마이트(diat 크 안료와 이들을 기본 재료로 한 조제품(이 류의 주 제3호의 것으로 한정한다)","3206":"그 밖의 착색제와 조제품(제3203호·제3204호·제3205호에 해당하는 물품은 제외하며, 이 류의 주 제3호의 것으로 한정한다), 루미노퍼(luminophore)로 사용되는 무기물(화학적으로 단일한 것인지에 상관없다)","3207":"조제 안료·조제 유백제(乳白劑)·조제 그림물감·법랑·유약·유약용 슬립·액체 상태 러스터(lustre)와 이와 유사한 조제품(요업·에나멜공업·유리공업에 주로 사용되는 것으로 한정한다), 유리 프리트(frit)와 그 밖의 유리[가루·알갱이·플레이크(flake) 모양인 것으로 한정한다]","3208":"페인트와 바니시(varnish)[에나멜·래커(lacquer)를 포함하며, 합성 중합체나 화학적으로 변성한 천연 중합체를 기본 재료로 하여 비수성(非水性) 매질(媒質)에 분산하거나 용해한 것으로 한정한다], 이 류의 주 제4호의 용액","3209":"페인트와 바니시(varnish)[에나멜과 래커(lacquer)를 포함하며, 합성 중합체나 화학적으로 변성한 천연 중합체를 기본 재료로 하여 수성(水性) 매질(媒質)에 분산하거나 용해한 것으로 한정한다]","3210":"그밖의 페인트와 바니시(varnish)[에나멜·래커(lacquer)·디스템퍼(distemper)를 포함한다], 가죽의 완성가공용으로 사용하는 조제 수성안료","3211":"조제 드라이어","3212":"비수성(非水性) 매질(媒質)에 분산시킨 안료[금속 가루·금속플레이크(flake)를 포함하며, 페인트·에나멜 제조에 사용되는 액체나 페이스트(paste) 상태인 것으로 한정한다], 스탬프용 박(箔), 소매용 모양이나 포장을 한 염료와 그 밖의 착색제","3213":"화가용·학생용·간판도장공용·색조 수정용·오락용 물감과 이와 유사한 물감[태블릿(tablet) 모양인 것·튜브들이·병들이·접시들이나 이와 유사한 모양이나 포장의 것으로 한정한다]","3214":"유리 접합용 퍼티(putty)·접목용 퍼티(putty)·수지시멘트·코킹(caulking)화합물과 그 밖의 매스틱(mastic), 도장용 충전제, 건물의 외면·실내벽·마루·천장과 이와 유사한 장소에 사용되는 비내화성 표면처리제","3215":"인쇄용 잉크·필기용 잉크·제도용 잉크와 그 밖의 잉크(농축하거나 고체화한 것인지에 상관없다)","3301":"정유(essential oil)[콘크리트(concrete)와 앱설루트(absolute)를 포함하며, 테르펜을 제거한 것인지에 상관없다], 레지노이드(resinoid), 추출한 올레오레진(oleoresin), 정유(essential oil)의 농축물[냉침법(冷浸法)이나 온침법(溫浸法)에 따라 얻은 것으로서 유지·불휘발성유·왁스나 이와 유사한 물질을 매질(媒質)로 한 것으로 한정한다], 정유(essential oil)에서 테르펜을 제거할 때 생기는 테르펜계 부산물, 정유(essential oil)의 애큐어스 디스틸레이트(aqueous distillate)와 애큐어스 솔루션(aqueous solution)","3302":"방향성(芳香性) 물질의 혼합물과 방향성(芳香性) 물질의 하나 이상을 기본 재료로 한 혼합물(알코올의 용액을 포함하며, 공업용 원료로 사용하는 것으로 한정한다), 방향성(芳香性) 물질을 기본 재료로 한 그 밖의 조제품(음료제조용으로 한정한다)","3303":"향수와 화장수","3304":"미용이나 메이크업용 제품류와 기초화장용 제품류[의약품은 제외하며, 선스크린(sunscreen)과 선탠(sun tan) 제품류를 포함한다], 매니큐어용 제품류와 페디큐어(pedicure)용 제품류","3305":"두발용 제품류","3306":"구강·치과 위생용 제품류[치열 교정용 페이스트(paste)와 가루를 포함한다], 치간 청결용 실로서 개별 소매용으로 포장한 것[치실(dental floss)]","3307":"면도용 제품류·인체용 탈취제·목욕용 조제품·탈모제와 그 밖의 조제향료·따로 분류되지 않은 화장품이나 화장용품·실내용 조제 탈취제(향을 첨가한 function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmt(t){
  var s = esc(t);
  var o = (s.match(/“/g)||[]).length, c = (s.match(/”/g)||[]).length;
  if (o && o === c) s = s.replace(/“([^”\n]{1,90}?)”/g, '<b class="q">“$1”</b>');
  var dq = (s.match(/"/g)||[]).length;
  if (dq && dq % 2 === 0) s = s.replace(/"([^"\n]{1,90}?)"/g, '<b class="q">“$1”</b>');
  s = s.replace(/(제\s?(\d{4})(?:\.\d{2})?호)/g, function(all, a, n){ return D.hd[n] ? '<span class="ref hd" data-hd="' + n + '" role="button" tabindex="0">' + a + '</span>' : '<span class="ref">' + a + '</span>'; });

  s = s.replace(/[\uE000-\uE007]/g, function(c){ return '<mark class="hl hc'+(c.charCodeAt(0)-0xE000)+'">'; }).replace(/\uE00F/g, '</mark>');
  return s;
}
function hlx(t, rs, off){
  if (!rs) return t;
  var out = '', pos = 0;
  rs.forEach(function(r){
    var a = Math.max(r[0]-off, pos), b = r[1]-off;
    if (b <= a) return;
    out += t.slice(pos, a) + String.fromCharCode(0xE000 + r[2]) + t.slice(a, b) + '\uE00F';
    pos = b;
  });
  return out + t.slice(pos);
}
var MK = /^((?:[가-힣]\.|\d{1,2}\)|[가-힣]\)|\(\d{1,2}\)|\([가-힣]\)|-)\s*)/;

/* ---------- 제외규정 두문자 형식: 기존 두문자(M줄)를 각 목에 나눠 붙이고, 10개마다 나열 ---------- */
function mnToks(m){
  var t = m.split(' ').filter(function(x){ return x && x !== '/' && x !== '│'; }), out = [];
  t.forEach(function(x){
    if (/^[가-힣A-Za-z0-9]$/.test(x)) out.push(x);
    else if (/^[가-힣]{2,}$/.test(x)) { if (m.trim().indexOf(' ') < 0) out = out.concat(x.split('')); else out.push(x); }
  });
  return out;
}
function mnBlocks(blocks){
  var out = blocks.slice(), prevM = -1;
  for (var i = 0; i < out.length; i++) {
    var b = out[i]; if (!b || b[0] !== 'M') continue;
    var cs = mnToks(b[2]); if (!cs.length) { prevM = i; continue; }
    var items = [];
    function isItem(q) { return Array.isArray(q) && typeof q[0] === 'number' && (q[1] === 1 || q[1] === 3); }
    for (var j = i - 1; j > prevM && items.length < cs.length; j--) {
      if (isItem(out[j])) items.unshift(j); else break;
    }
    if (items.length !== cs.length) {
      /* 목 나열 뒤에 문단이 1~2개 더 붙은 경우: 그 문단을 건너뛰고 목과 짝지음 (각 목에 그 글자가 있을 때만) */
      var j2 = i - 1, sk = 0, it2 = [];
      while (j2 > prevM && !isItem(out[j2]) && sk < 2) { j2--; sk++; }
      for (; j2 > prevM && isItem(out[j2]) && it2.length < cs.length; j2--) it2.unshift(j2);
      if (sk && it2.length === cs.length && it2.every(function (k, n) { return String(out[k][2]).replace(MK, '').indexOf(cs[n]) >= 0; })) items = it2;
    }
    var lv = b[1], note = b[3], rows = [];
    if (items.length === cs.length) {
      items.forEach(function(j, k){ var c = out[j].slice(); c.mnc = cs[k]; out[j] = c; });
      for (var k = 0; k < cs.length; k += 10) rows.push({ at: items[Math.min(k + 9, cs.length - 1)], cs: cs.slice(k, k + 10) });
    } else {
      /* 목 줄과 짝이 안 맞는 경우(문장 속 나열·정의): 앞 문단들에서 차례로 빨간색만 표시 */
      var seq = { cs: cs, k: 0 };
      for (var j2 = prevM + 1; j2 < i; j2++) { var q2 = out[j2]; if (Array.isArray(q2) && typeof q2[0] === 'number') { var c2 = q2.slice(); c2.mnseq = seq; out[j2] = c2; } }
      for (var k2 = 0; k2 < cs.length; k2 += 10) rows.push({ at: i - 1, cs: cs.slice(k2, k2 + 10) });
    }
    out.splice(i, 1);
    var add = rows.map(function(r, ri){ return { at: r.at, blk: ['R', lv, r.cs, ri === rows.length - 1 ? note : ''] }; });
    for (var r = add.length - 1; r >= 0; r--) out.splice(add[r].at + 1, 0, add[r].blk);
    i = add[add.length - 1].at + add.length; prevM = i;
  }

}
function wrapSeq(el, seq){
  var w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null), n, list = [];
  while ((n = w.nextNode())) if (!(n.parentNode.classList && (n.parentNode.classList.contains('m') || n.parentNode.classList.contains('mnc')))) list.push(n);
  for (var a = 0; a < list.length && seq.k < seq.cs.length; a++) {
    var node = list[a], off = 0;
    while (seq.k < seq.cs.length) {
      var ch = seq.cs[seq.k], x = node.nodeValue.indexOf(ch, off); if (x < 0) break;
      var mid = node.splitText(x), rest = mid.splitText(ch.length);
      var sp = document.createElement('span'); sp.className = 'mnr'; mid.parentNode.replaceChild(sp, mid); sp.appendChild(mid);
      node = rest; off = 0; seq.k++;
    }
  }
}
function wrapFirst(el, ch){
  var w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null), n;
  while ((n = w.nextNode())) {
    if (n.parentNode.classList && (n.parentNode.classList.contains('m') || n.parentNode.classList.contains('mnc'))) continue;
    var x = n.nodeValue.indexOf(ch); if (x < 0) continue;
    var mid = n.splitText(x); mid.splitText(ch.length);
    var sp = document.createElement('span'); sp.className = 'mnr'; mid.parentNode.replaceChild(sp, mid); sp.appendChild(mid);
    return;
  }
}

    var m = text.match(MK), mark = m ? m[1].trim() : '', rest = m ? text.slice(m[1].length) : text;
    if (mark === '-') mark = '–';
    var p = h('p', {class:'b mk', style:'--lv:'+Math.max(lv,1)});

    if (b.mnseq) wrapSeq(p, b.mnseq);

function kindName(k){ return k === 's' ? '소호주' : (k === 'd' ? '국내주' : '주'); }
