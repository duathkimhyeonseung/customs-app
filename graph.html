. 31.>\n  ⑪ 납세자보호관은 납세자보호위원회의 의결사항에 대한 이행여부 등을 감독한다.<개정 2022. 12. 31.>\n  [본조신설 2019. 12. 31.]","L255-3":"제255조의3(수출입 안전관리 우수업체에 대한 혜택 등) ① 관세청장은 제255조의2에 따라 수출입 안전관리 우수업체로 공인된 업체(이하 “수출입안전관리우수업체”라 한다)에 통관절차 및 관세행정상의 혜택으로서 대통령령으로 정하는 사항을 제공할 수 있다.\n  ② 관세청장은 다른 국가의 수출입 안전관리 우수업체에 상호 조건에 따라 제1항에 따른 혜택을 제공할 수 있다.\n  ③ 관세청장은 수출입안전관리우수업체가 제255조의4제2항에 따른 자율 평가 결과를 보고하지 아니하는 등 대통령령으로 정하는 사유에 해당하는 경우 6개월의 범위에서 제1항에 따른 혜택의 전부 또는 일부를 정지할 수 있다.\n  ④ 관세청장은 제3항에 따른 사유에 해당하는 업체에 그 사유의 시정을 명할 수 있다.\n  [본조신설 2021. 12. 21.]","R48-2":"제48조의2(관세가 면제되는 이사물품) ① 법 제96조제1항제2호에 따라 관세가 면제되는 물품은 우리나라 국민(재외영주권자를 제외한다. 이하 이 항에서 같다)으로서 외국에 주거를 설정하여 1년(가족을 동반한 경우에는 6개월) 이상 거주했거나 외국인 또는 재외영주권자로서 우리나라에 주거를 설정하여 1년(가족을 동반한 경우에는 6개월) 이상 거주하려는 사람이 반입하는 다음 각 호의 어느 하나에 해당하는 것으로 한다. 다만, 자동차(제3호에 해당하는 것은 제외한다), 선박, 항공기와 개당 과세가격이 500만원 이상인 보석ㆍ진주ㆍ별갑(鼈甲)ㆍ산호ㆍ호박(琥珀)ㆍ상아 및 이를 사용한 제품은 제외한다. <개정 2022. 3. 18.>\n    1. 해당 물품의 성질ㆍ수량ㆍ용도 등으로 보아 통상적으로 가정용으로 인정되는 것으로서 우리나라에 입국하기 전에 3개월 이상 사용했고 입국한 후에도 계속하여 사용할 것으로 인정되는 것\n    2. 우리나라에 상주하여 취재하기 위하여 입국하는 외국국적의 기자가 최초로 입국할 때에 반입하는 취재용품으로서 문화체육관광부장관이 취재용임을 확인하는 물품일 것\n    3. 우리나라에서 수출된 물품(조립되지 않은 물품으로서 법 별표 관세율표상의 완성품에 해당하는 번호로 분류되어 수출된 것을 포함한다)이 반입된 경우로서 관세청장이 정하는 사용기준에 적합한 물품일 것\n    4. 외국에 거주하던 우리나라 국민이 다른 외국으로 주거를 이전하면서 우리나라로 반입(송부를 포함한다)하는 것으로서 통상 가정용으로 3개월 이상 사용하던 것으로 인정되는 물품일 것\n  ② 제1항 각 호 외의 부분 본문에도 불구하고 사망이나 질병 등 관세청장이 정하는 사유가 발생하여 반입하는 이사물품에 대해서는 거주기간과 관계없이 관세를 면제할 수 있다.\n  ③ 법 제96조제1항제2호에 따른 이사물품 중 별도로 수입하는 물품은 천재지변 등 부득이한 사유가 있는 경우를 제외하고는 입국자가 입국한 날부터 6월 이내에 도착한 것이어야 한다.\n  [본조신설 2021. 3. 16.]","D170-0":"제170조(국경출입차량의 출발보고) ①법 제150조제1항의 규정에 의한 출발보고서에는 다음 각호의 사항을 기재하여야 한다.\n    1. 차량의 회사명ㆍ종류ㆍ등록기호ㆍ번호ㆍ총화차수ㆍ총객차수\n    2. 차량의 출발지ㆍ경유지ㆍ최종목적지ㆍ출발일시 및 도착일시\n    3. 적재물품의 내용ㆍ개수 및 중량\n    4. 여객 및 승무원의 수와 통과여객의 수\n  ②법 제150조제2항의 규정에 의하여 제출하는 물품의 목록은 관세청장이 정하는 바에 따라 세관장에게 제출하여야 한다.\n  ③법 제150조제3항 본문에서 “대통령령으로 정하는 물품”이란 다음 각 호의 어느 하나에 해당하는 것을 말한다. <신설 2007. 4. 5., 2011. 4. 1.>\n    1. 모래ㆍ자갈 등 골재\n    2. 석탄ㆍ흑연 등 광물","D236-6":"제236조의6(원산지증명서확인자료 등) ① 법 제232조의2제2항 전단에서 “대통령령으로 정하는 자료”란 다음 각 호의 구분에 따른 자료로서 수출신고 수리일부터 3년 이내의 자료를 말한다.\n    1. 수출물품의 생산자가 제출하는 다음 각 목의 자료\n      가. 수출자에게 해당 물품의 원산지를 증명하기 위하여 제공한 서류\n      나. 수출자와의 물품공급계약서\n      다. 해당 물품의 생산에 사용된 원재료의 수입신고필증(생산자 명의로 수입신고한 경우만 해당한다)\n      라. 해당 물품 및 원재료의 생산 또는 구입 관련 증명 서류\n      마. 원가계산서ㆍ원재료내역서 및 공정명세서\n      바. 해당 물품 및 원재료의 출납ㆍ재고관리대장\n      사. 해당 물품의 생산에 사용된 재료를 공급하거나 생산한 자가 그 재료의 원산지를 증명하기 위하여 작성하여 생산자에게 제공한 서류\n      아. 원산지증명서 발급 신청서류(전자문서를 포함하며, 생산자가 원산지증명서를 발급받은 경우만 해당한다)\n    2. 수출자가 제출하는 다음 각 목의 자료\n      가. 원산지증명서가 발급된 물품을 수입하는 국가의 수입자에게 제공한 원산지증명서(전자문서를 포함한다)\n      나. 수출신고필증\n      다. 수출거래 관련 계약서\n      라. 원산지증명서 발급 신청서류(전자문서를 포함하며, 수출자가 원산지증명서를 발급받은 경우만 해당한다)\n      마. 제1호라목부터 바목까지의 서류(수출자가 원산지증명서를 발급받은 경우만 해당한다)\n    3. 원산지증명서를 발급한 자가 제출하는 다음 각 목의 자료\n      가. 발급한 원산지증명서(전자문서를 포함한다)\n      나. 원산지증명서 발급신청 서류(전자문서를 포함한다)\n      다. 그 밖에 발급기관이 보관 중인 자료로서 원산지 확인에 필요하다고 판단하는 자료\n  ② 법 제232조의2제2항제3호에서 “대통령령으로 정하는 자”란 해당 수출물품의 생산자 또는 수출자를 말한다.\n  [본조신설 2011. 4. 1.]","L227-0":"제227조(의무 이행의 요구 및 조사) ① 세관장은 다른 법령에 따라 수입 후 특정한 용도로 사용하여야 하는 등의 의무가 부가되어 있는 물품에 대하여는 문서로써 해당 의무를 이행할 것을 요구할 수 있다.\n  ② 제1항에 따라 의무의 이행을 요구받은 자는 대통령령으로 정하는 특별한 사유가 없으면 해당 물품에 대하여 부가된 의무를 이행하여야 한다.\n  ③ 세관장은 제1항에 따라 의무의 이행을 요구받은 자의 이행 여부를 확인하기 위하여 필요한 경우 세관공무원으로 하여금 조사하게 할 수 있다. 이 경우 제240조의3을 준용한다.<신설 2021. 12. 21.>\n  [전문개정 2010. 12. 30.]\n  [제목개정 2021. 12. 21.]","R7-6":"제7조의6(보세공장에서 내국물품과 외국물품을 혼용하여 제조한 물품의 과세가격의 결정) ①영 제29조제3항제5호에 따라 내국물품과 외국물품의 혼용에 관한 승인을 받아 제조된 물품의 과세가격은 다음의 산식에 따른다.\n  <img alt=\"@@LATEX@@mathrm{제품가격} times left[mathrm{외국물품가격}/ left(mathrm{외국물품가격} + mathrm{내국물품가격}right)right]@@/LATEX@@\" src=\"/LSW/flDownload.do?flSeq=78859957\" />\n  ② 제1항을 적용할 때 제품가격, 외국물품가격 및 내국물품 가격은 다음 각 호의 방법으로 결정한다.\n    1. 제품가격은 보세공장에서 외국물품과 내국물품을 혼용하여 제조된 물품의 가격으로 하며, 법 제30조부터 제35조까지에서 정하는 방법에 따른다.\n    2. 제조에 사용된 외국물품의 가격은 법 제30조부터 제35조까지에서 정하는 방법에 따른다.\n    3. 제조에 사용된 내국물품의 가격은 해당 보세공장에서 구매한 가격으로 한다.\n    4. 제3호에도 불구하고 다음 각 목의 어느 하나에 해당하는 경우에는 해당 물품과 동일하거나 유사한 물품의 국내판매가격을 구매가격으로 한다. 이 경우 거래 단계 등이 같아야 하며, 두 물품 간 거래 단계 등에 차이가 있는 경우에는 그에 따른 가격 차이를 조정해야 한다.\n      가. 구매자와 판매자가 영 제23조제1항 각 호에서 정하는 특수관계가 있는 경우\n      나. 영 제18조 각 호에서 정하는 물품 및 용역을 무료 또는 인하된 가격으로 직접 또는 간접으로 공급한 사실이 있는 경우\n    5. 제2호부터 제4호까지의 가격은 법 제186조제1항에 따라 사용신고를 하는 때에 이를 확인해야 하며, 각각 사용신고 하는 때의 원화가격으로 결정한다.\n  [본조신설 2020. 10. 7.]","D94-0":"제94조(농림축산물에 대한 양허세율의 적용신청) 법 제73조에 따라 국제기구와 관세에 관한 협상에서 국내외 가격차에 상당한 율로 양허하거나 국내시장 개방과 함께 기본세율보다 높은 세율로 양허한 농림축산물을 시장접근물량 이내로 수입하는 자로서 관련 기관의 추천을 받은 자는 해당 추천서를 수입신고 수리 전까지 세관장에게 제출해야 한다. 다만, 해당 농림축산물이 보세구역에서 반출되지 않은 경우에는 수입신고 수리일부터 15일이 되는 날까지 제출할 수 있다. <개정 2021. 2. 17.>","D265-2":"제265조의2(과태료의 부과기준) 법 제277조제1항부터 제7항까지 및 제277조의2제5항에 따른 과태료의 부과기준은 별표 5와 같다. <개정 2022. 2. 15., 2024. 2. 29.>\n  [본조신설 2019. 2. 12.]","L118-2":"제118조의2(관세청장의 납세자 권리보호) ① 관세청장은 직무를 수행할 때 납세자의 권리가 보호되고 실현될 수 있도록 성실하게 노력하여야 한다.\n  ② 납세자의 권리보호를 위하여 관세청에 납세자 권리보호업무를 총괄하는 납세자보호관을 두고, 대통령령으로 정하는 세관에 납세자 권리보호업무를 수행하는 담당관을 각각 1명을 둔다.\n  ③ 관세청장은 제2항에 따른 납세자보호관을 개방형직위로 운영하고 납세자보호관 및 담당관이 업무를 수행할 때 독립성이 보장될 수 있도록 하여야 한다. 이 경우 납세자보호관은 관세ㆍ법률ㆍ재정 분야의 전문지식과 경험을 갖춘 사람으로서 다음 각 호의 어느 하나에 해당하지 아니하는 사람을 대상으로 공개모집한다.\n    1. 세관공무원\n    2. 세관공무원으로 퇴직한 지 3년이 지나지 아니한 사람\n  ④ 관세청장은 납세자 권리보호업무의 추진실적 등의 자료를 일반 국민에게 정기적으로 공개하여야 한다.\n  ⑤ 납세자보호관 및 담당관은 세금 관련 고충민원의 처리 등 대통령령으로 정하는 직무 및 권한을 가지며, 납세자보호관 및 담당관의 자격 등 납세자보호관 제도의 운영에 필요한 사항은 대통령령으로 정한다.\n  [본조신설 2019. 12. 31.]","L83-0":"제83조(용도세율의 적용) ① 별표 관세율표나 제50조제4항, 제51조, 제57조, 제63조, 제65조, 제67조의2, 제68조, 제 70조부터 제74조까지 및 제76조에 따른 대통령령 또는 재정경제부령으로 용도에 따라 세율을 다르게 정하는 물품을 세율이 낮은 용도에 사용하여 해당 물품에 그 낮은 세율(이하 “용도세율”이라 한다)의 적용을 받으려는 자는 대통령령으로 정하는 바에 따라 세관장에게 신청하여야 한다. 다만, 대통령령으로 정하는 바에 따라 미리 세관장으로부터 해당 용도로만 사용할 것을 승인받은 경우에는 신청을 생략할 수 있다. <개정 2021. 12. 21., 2023. 12. 31., 2025. 10. 1.>\n  ② 용도세율이 적용된 물품은 그 수입신고의 수리일부터 3년의 범위에서 대통령령으로 정하는 기준에 따라 관세청장이 정하는 기간에는 해당 용도 외의 다른 용도에 사용하거나 양도할 수 없다. 다만, 대통령령으로 정하는 바에 따라 미리 세관장의 승인을 받은 경우에는 그러하지 아니하다.<개정 2021. 12. 21., 2023. 12. 31.>\n    1. 삭제<2023. 12. 31.>\n    2. 삭제<2023. 12. 31.>\n  ③ 제1항의 물품을 제2항에 따른 기간에 해당 용도 외의 다른 용도에 사용하거나 그 용도 외의 다른 용도에 사용하려는 자에게 양도한 경우에는 해당 물품을 특정용도 외에 사용한 자 또는 그 양도인으로부터 해당 물품을 특정용도에 사용할 것을 요건으로 하지 아니하는 세율에 따라 계산한 관세액과 해당 용도세율에 따라 계산한 관세액의 차액에 상당하는 관세를 즉시 징수하며, 양도인으로부터 해당 관세를 징수할 수 없을 때에는 그 양수인으로부터 즉시 징수한다. 다만, 재해나 그 밖의 부득이한 사유로 멸실되었거나 미리 세관장의 승인을 받아 폐기한 경우에는 그러하지 아니하다.\n  [전문개정 2010. 12. 30.]","D30-0":"제30조(가산율 또는 공제율의 적용) ①관세청장 또는 세관장은 장기간 반복하여 수입되는 물품에 대하여 법 제30조제1항이나 법 제33조제1항 또는 제3항을 적용하는 경우 납세의무자의 편의와 신속한 통관업무를 위하여 필요하다고 인정되는 때에는 재정경제부령으로 정하는 바에 따라 해당 물품에 대하여 통상적으로 인정되는 가산율 또는 공제율을 적용할 수 있다. <개정 2019. 2. 12., 2020. 10. 7., 2025. 12. 30.>\n  ②제1항의 규정에 의한 가산율 또는 공제율의 적용은 납세의무자의 요청이 있는 경우에 한한다.","L90-0":"제90조(학술연구용품의 감면) ① 다음 각 호의 어느 하나에 해당하는 물품이 수입될 때에는 그 관세를 감면할 수 있다.\n  <개정 2025. 10. 1.>\n    1. 국가기관, 지방자치단체 및 재정경제부령으로 정하는 기관에서 사용할 학술연구용품ㆍ교육용품 및 실험실습용품으로서 재정경제부령으로 정하는 물품\n    2. 학교, 공공의료기관, 공공직업훈련원, 박물관, 그 밖에 이에 준하는 재정경제부령으로 정하는 기관에서 학술연구용ㆍ교육용ㆍ훈련용ㆍ실험실습용 및 과학기술연구용으로 사용할 물품 중 재정경제부령으로 정하는 물품\n    3. 제2호의 기관에서 사용할 학술연구용품ㆍ교육용품ㆍ훈련용품ㆍ실험실습용품 및 과학기술연구용품으로서 외국으로부터 기증되는 물품. 다만, 재정경제부령으로 정하는 물품은 제외한다.\n    4. 재정경제부령으로 정하는 자가 산업기술의 연구개발에 사용하기 위하여 수입하는 물품으로서 재정경제부령으로 정하는 물품\n  ② 제1항에 따라 관세를 감면하는 경우 그 감면율은 재정경제부령으로 정한다.<개정 2025. 10. 1.>\n  [전문개정 2010. 12. 30.]\n  [제목개정 2020. 12. 22.]","D203-0":"제203조(보세공장 외 작업허가 신청 등) ①법 제187조제1항에 따른 보세공장 외 작업허가를 받으려는 자는 다음 각 호의 사항을 기재한 신청서를 세관장에게 제출해야 한다. <개정 2004. 3. 29., 2022. 2. 15.>\n    1. 보세작업의 종류ㆍ기간 및 장소\n    2. 신청사유\n    3. 해당 작업에 투입되는 원재료의 품명ㆍ규격 및 수량\n    4. 해당 작업으로 생산되는 물품의 품명ㆍ규격 및 수량\n  ② 제1항에 따라 보세공장 외 작업허가를 신청하려는 자는 허가절차의 신속한 진행을 위하여 그 신청 전에 작업장소를 세관장에게 알릴 수 있다. <개정 2022. 2. 15.>\n  ③ 제1항에 따른 신청을 받은 세관장은 6개월의 범위에서 보세공장 외 작업을 허가할 수 있다. 다만, 다음 각 호의 경우에는 해당 호에서 정한 기간의 범위에서 보세공장 외 작업을 허가할 수 있다. <신설 2022. 2. 15.>\n    1. 임가공계약서 등으로 전체 작업 내용(작업장소, 작업종류, 예상 작업기간 등)을 미리 알 수 있어 여러 작업을 일괄적으로 허가하는 경우: 1년\n    2. 물품 1단위 생산에 장기간이 소요된다고 세관장이 인정하는 경우: 2년\n  ④ 제3항에 따라 보세공장 외 작업허가를 받은 자는 재해나 그 밖의 부득이한 사유로 허가받은 작업기간의 연장이나 작업장소의 변경이 필요한 경우에는 세관장에게 1년의 범위에서 작업기간의 연장이나 작업장소의 변경허가를 신청할 수 있다. <신설 2022. 2. 15.>\n  ⑤ 보세공장 외 작업허가를 받은 자는 제3항 또는 제4항에 따라 허가받은 기간이 끝나는 날부터 10일 이내에 세관장에게 보세공장 외 작업완료 결과를 통보해야 한다. <신설 2022. 2. 15., 2025. 11. 28.>\n  [제목개정 2022. 2. 15.]","L245-0":"제245조(신고 시의 제출서류) ① 제241조 또는 제244조에 따른 수출ㆍ수입 또는 반송의 신고를 하는 자는 과세가격결정자료 외에 대통령령으로 정하는 서류를 제출하여야 한다. <개정 2013. 8. 13.>\n  ② 제1항에 따라 서류를 제출하여야 하는 자가 해당 서류를 관세사등에게 제출하고, 관세사등이 해당 서류를 확인한 후 제241조 또는 제244조에 따른 수출ㆍ수입 또는 반송에 관한 신고를 할 때에는 해당 서류의 제출을 생략하게 하거나 해당 서류를 수입신고 수리 후에 제출하게 할 수 있다.\n  ③ 제2항에 따라 서류의 제출을 생략하게 하거나 수입신고 수리 후에 서류를 제출하게 하는 경우 세관장이 필요하다고 인정하여 신고인에게 관세청장이 정하는 장부나 그 밖의 관계 자료의 제시 또는 제출을 요청하면 신고인은 이에 따라야 한다.\n  [전문개정 2010. 12. 30.]","L196-0":"제196조(보세판매장) ① 보세판매장에서는 다음 각 호의 어느 하나에 해당하는 조건으로 물품을 판매할 수 있다. <개정 2019. 12. 31.>\n    1. 해당 물품을 외국으로 반출할 것. 다만, 외국으로 반출하지 아니하더라도 대통령령으로 정하는 바에 따라 외국에서 국내로 입국하는 자에게 물품을 인도하는 경우에는 해당 물품을 판매할 수 있다.\n    2. 제88조제1항제1호부터 제4호까지의 규정에 따라 관세의 면제를 받을 수 있는 자가 해당 물품을 사용할 것\n  ② 제1항에도 불구하고 공항 및 항만 등의 입국경로에 설치된 보세판매장에서는 외국에서 국내로 입국하는 자에게 물품을 판매할 수 있다.<개정 2018. 12. 31.>\n  ③ 보세판매장에서 판매하는 물품의 반입, 반출, 인도, 관리에 필요한 사항은 대통령령으로 정한다.\n  ④ 세관장은 보세판매장에서 판매할 수 있는 물품의 수량, 장치장소 등을 제한할 수 있다. 다만, 보세판매장에서 판매할 수 있는 물품의 종류, 판매한도는 재정경제부령으로 정한다.<신설 2018. 12. 31., 2025. 10. 1.>\n  [전문개정 2010. 12. 30.]","D271-0":"제271조(벌금 또는 추징금의 예납신청 등) ①법 제311조제2항의 규정에 의하여 벌금 또는 추징금에 상당한 금액을 예납하고자 하는 자는 다음 각호의 사항을 기재한 신청서를 관세청장 또는 세관장에게 제출하여야 한다.\n    1. 주소 및 성명\n    2. 예납금액\n    3. 신청사유\n  ②제1항의 규정에 의하여 예납금을 받은 관세청장 또는 세관장은 그 보관증을 예납자에게 교부하여야 한다.\n  ③관세청장 또는 세관장은 제2항의 규정에 의하여 보관한 예납금으로써 예납자가 납부하여야 하는 벌금 또는 추징금에 상당하는 금액에 충당하고 잔금이 있는 때에는 지체없이 예납자에게 환급하여야 한다.","L224-0":"제224조(보세운송업자등의 행정제재) ①세관장은 관세청장이 정하는 바에 따라 보세운송업자등이 다음 각 호의 어느 하나에 해당하는 경우에는 등록의 취소, 6개월의 범위에서의 업무정지 또는 그 밖에 필요한 조치를 할 수 있다. 다만, 제1호 및 제2호에 해당하는 경우에는 등록을 취소하여야 한다. <개정 2011. 12. 31., 2013. 1. 1., 2014. 1. 1., 2014. 12. 23., 2018. 12. 31., 2023. 12. 31.>\n    1. 거짓이나 그 밖의 부정한 방법으로 등록을 한 경우\n    2. 제175조 각 호의 어느 하나에 해당하는 경우. 다만, 제175조제8호에 해당하는 경우로서 같은 조 제2호 또는 제3호에 해당하는 사람을 임원으로 하는 법인이 3개월 이내에 해당 임원을 변경한 경우에는 그러하지 아니하다.\n    3. 「항만운송사업법」 등 관련 법령에 따라 면허ㆍ허가ㆍ지정ㆍ등록 등이 취소되거나 사업정지처분을 받은 경우\n    4. 보세운송업자등(그 임직원 및 사용인을 포함한다)이 보세운송업자등의 업무와 관련하여 이 법이나 이 법에 따른 명령을 위반한 경우\n    4의2. 제223조의2를 위반한 경우\n    5. 보세운송업자등(그 임직원 및 사용인을 포함한다)이 보세운송업자등의 업무와 관련하여 「개별소비세법」 제29조제1항 또는 「교통ㆍ에너지ㆍ환경세법」 제25조제1항에 따른 과태료를 부과받은 경우\n  ② 세관장은 제1항에 따른 업무정지가 그 이용자에게 심한 불편을 주거나 공익을 해칠 우려가 있을 경우에는 보세운송업자등에게 업무정지처분을 갈음하여 해당 업무 유지에 따른 매출액의 100분의 3 이하의 과징금을 부과할 수 있다. 이 경우 매출액 산정, 과징금의 금액 및 과징금의 납부기한 등에 관하여 필요한 사항은 대통령령으로 정한다.\n  <신설 2014. 12. 23.>\n  ③ 제2항에 따른 과징금을 납부하여야 할 자가 납부기한까지 납부하지 아니한 경우 과징금의 징수에 관하여는 제26조를 준용한다.<신설 2014. 12. 23.>\n  [전문개정 2010. 12. 30.]","D20-2":"제20조의2(간접지급금액 등) ① 법 제30조제2항 각 호 외의 부분 본문의 “그 밖의 간접적인 지급액”에는 다음 각 호의 금액이 포함되는 것으로 한다.\n    1. 수입물품의 대가 중 전부 또는 일부를 판매자의 요청으로 제3자에게 지급하는 경우 그 금액\n    2. 수입물품의 거래조건으로 판매자 또는 제3자가 수행해야 하는 하자보증을 구매자가 대신하고 그에 해당하는 금액을 할인받았거나 하자보증비 중 전부 또는 일부를 별도로 지급하는 경우 그 금액\n    3. 수입물품의 거래조건으로 구매자가 외국훈련비, 외국교육비 또는 연구개발비 등을 지급하는 경우 그 금액\n    4. 그 밖에 일반적으로 판매자가 부담하는 금융비용 등을 구매자가 지급하는 경우 그 금액\n  ② 법 제30조제1항 각 호의 가산금액 외에 구매자가 자기의 계산으로 행한 활동의 비용은 같은 조 제2항 각 호 외의 부분 본문의 “그 밖의 간접적인 지급액”으로 보지 않는다.\n  ③ 법 제30조제2항제4호에 따라 구매자가 지급하였거나 지급하여야 할 총금액에서 수입물품에 대한 연불이자를 빼는 경우는 해당 연불이자가 다음 각 호의 요건을 모두 갖춘 경우로 한다.\n    1. 연불이자가 수입물품의 대가로 실제로 지급하였거나 지급하여야 할 금액과 구분될 것\n    2. 금융계약이 서면으로 체결되었을 것\n    3. 해당 물품이 수입신고된 가격으로 판매되고, 그 이자율은 금융이 제공된 국가에서 당시 금융거래에 통용되는 수준의 이자율을 초과하지 않을 것\n  [본조신설 2020. 10. 7.]","D205-0":"제205조(원료과세 적용신청 방법 등) ①법 제189조에 따른 신청을 하려는 자는 다음 각 호의 사항을 적은 신청서를 세관장에게 제출하여야 한다. <개정 2008. 2. 22.>\n    1. 제175조 각 호의 사항\n    2. 원료인 외국물품의 규격과 생산지 또는 제조지\n    3. 신청사유\n    4. 원료과세 적용을 원하는 기간\n  ②제1항의 규정에 의한 신청서에는 다음 각호의 서류를 첨부하여야 한다. 다만, 세관장이 부득이한 사유가 있다고 인정하는 때에는 그러하지 아니하다.\n    1. 법 제186조제2항의 증명서류\n    2. 당해 물품의 송품장 또는 이에 갈음할 수 있는 서류\n  ③ 법 제189조제2항에서 “대통령령으로 정하는 기준”이란 다음 각 호의 기준을 말한다. <신설 2008. 2. 22., 2022. 2. 15.>\n    1. 최근 2년간 생산되어 판매된 물품 중 수출된 물품의 가격 비율이 100분의 50 이상일 것\n    2. 법 제255조의2제1항에 따라 수출입 안전관리 우수업체로 공인된 업체가 운영할 것","L196-2":"제196조의2(시내보세판매장의 현장 인도 특례) ① 보세판매장 중 공항 및 항만 등의 출입국경로의 보세구역 외의 장소에 설치되는 보세판매장(이하 이 조에서 “시내보세판매장”이라 한다)에서 제196조제1항제1호 본문의 조건으로 외국인에게 내국물품을 판매하고 이를 판매 현장에서 인도하는 경우에는 대통령령으로 정하는 바에 따라 해당 물품을 인도할 수 있다.\n  ② 세관장은 제1항에 따라 판매 현장에서 인도된 물품의 외국 반출 여부를 확인하기 위하여 물품 구매자의 출입국관리기록 등 대통령령으로 정하는 정보 또는 자료를 관계 중앙행정기관의 장에게 요청할 수 있다. 이 경우 요청을 받은 관계 중앙행정기관의 장은 정당한 사유가 없으면 이에 따라야 한다.\n  ③ 세관장은 제2항에 따른 물품 구매자의 출입국관리기록 등을 확인하여 대통령령으로 정하는 사람에 대해서는 제1항에 따른 인도를 제한할 수 있다.\n  ④ 세관장은 제3항에 따라 인도가 제한되는 사람의 명단을 시내보세판매장의 운영인에게 통보하여야 한다.\n  ⑤ 시내보세판매장의 운영인은 제4항에 따라 통보 받은 명단의 사람에게 물품을 판매할 때에는 해당 물품을 판매 현장에서 인도하여서는 아니되고, 관세청장이 정하는 바에 따라 인도하여야 한다.\n  [본조신설 2019. 12. 31.]","D245-4":"제245조의4(간이한 통관절차 적용대상 국가) ① 법 제240조의5에 따른 간이한 통관절차(이하 “통관절차의 특례”라 한다)를 적용받을 수 있는 국가는 다음 각 호의 국가로 한다.\n    1. 우리나라와 통관절차의 편익에 관한 협정을 체결한 국가\n    2. 우리나라와 무역협정 등을 체결한 국가\n  ② 통관절차의 특례 부여의 절차 및 특례 부여 중지, 그 밖에 필요한 사항은 관세청장이 정하여 고시한다.\n  [본조신설 2015. 2. 6.]","L95-0":"제95조(환경오염방지물품 등에 대한 감면) ① 다음 각 호의 어느 하나에 해당하는 물품으로서 국내에서 제작하기 곤란한 물품이 수입될 때에는 그 관세를 감면할 수 있다. <개정 2025. 10. 1.>\n    1. 오염물질(소음 및 진동을 포함한다)의 배출 방지 또는 처리를 위하여 사용하는 기계ㆍ기구ㆍ시설ㆍ장비로서 재정경제부령으로 정하는 것\n    2. 폐기물 처리(재활용을 포함한다)를 위하여 사용하는 기계ㆍ기구로서 재정경제부령으로 정하는 것\n    3. 기계ㆍ전자기술 또는 정보처리기술을 응용한 공장 자동화 기계ㆍ기구ㆍ설비(그 구성기기를 포함한다) 및 그 핵심부분품으로서 재정경제부령으로 정하는 것\n  ② 제1항에 따라 관세를 감면하는 경우 그 감면기간과 감면율은 재정경제부령으로 정한다.<개정 2025. 10. 1.>\n  [전문개정 2010. 12. 30.]\n  [제목개정 2020. 12. 22.]","D259-4":"제259조의4(수출입안전관리우수업체에 대한 혜택 등) ① 법 제255조의3제1항에서 “대통령령으로 정하는 사항”이란 수출입물품에 대한 검사 완화나 수출입신고 및 관세납부 절차 간소화 등의 사항을 말한다.\n  ② 제1항에 따른 통관절차 및 관세행정상의 혜택의 세부내용은 관세청장이 정하여 고시한다.\n  ③ 법 제255조의3제3항에서 “법 제255조의4제2항에 따른 자율 평가 결과를 보고하지 아니하는 등 대통령령으로 정하는 사유”란 다음 각 호의 어느 하나에 해당하는 경우를 말한다.\n    1. 수출입안전관리우수업체가 법 제255조의4제2항에 따라 자율평가 결과를 보고하지 않은 경우\n    2. 수출입안전관리우수업체가 법 제255조의4제3항에 따라 변동사항 보고를 하지 않은 경우\n    3. 수출입안전관리우수업체(대표자 및 제259조의5제1항에 따라 지정된 관리책임자를 포함한다)가 법 또는 「자유무역협정의 이행을 위한 관세법의 특례에 관한 법률」, 「대외무역법」, 「외국환거래법」, 「수출용 원재료에 대한 관세 등 환급에 관한 특례법」 등 수출입과 관련된 법령을 위반한 경우\n    4. 수출입안전관리우수업체가 소속 직원에게 안전관리기준에 관한 교육을 실시하지 않는 등 관세청장이 수출입안전관리우수업체에 제공하는 혜택을 정지할 필요가 있다고 인정하여 고시하는 경우\n  [본조신설 2022. 2. 15.]\n  [종전 제259조의4는 제259조의6으로 이동 <2022. 2. 15.>]","R7-7":"제7조의7(범칙물품의 과세가격의 결정) 영 제29조제3항제6호에 따른 범칙물품의 과세가격은 제7조의2부터 제7조의6까지 및 제7조의8에 따라 결정한다.\n  [본조신설 2020. 10. 7.]","D111-0":"제111조(관세경감률산정의 기준) ①법 제89조ㆍ법 제90조ㆍ법 제95조 및 법 제98조에 의한 관세의 경감에 있어서 경감률의 산정은 실제로 적용되는 관세율(법 제50조제2항제1호의 세율을 제외한다)을 기준으로 한다.\n  ②이 법 기타 법률 또는 조약에 의하여 관세를 면제하는 경우 면제되는 관세의 범위에 대하여 특별한 규정이 없는 때에는 법 제50조제2항제1호의 세율은 면제되는 관세의 범위에 포함되지 아니한다.","D249-0":"제249조(입항전 수입신고) ①법 제244조제1항의 규정에 의한 수입신고는 당해 물품을 적재한 선박 또는 항공기가 그 물품을 적재한 항구 또는 공항에서 출항하여 우리나라에 입항하기 5일전(항공기의 경우 1일전)부터 할 수 있다.\n  ②출항부터 입항까지의 기간이 단기간인 경우 등 당해 선박 등이 출항한 후에 신고하는 것이 곤란하다고 인정되어 출항하기 전에 신고하게 할 필요가 있는 때에는 관세청장이 정하는 바에 따라 그 신고시기를 조정할 수 있다.\n  ③제1항에도 불구하고 다음 각 호의 어느 하나에 해당하는 물품은 해당 물품을 적재한 선박 등이 우리나라에 도착된 후에 수입신고하여야 한다. <개정 2008. 2. 22.>\n    1. 세율이 인상되거나 새로운 수입요건을 갖추도록 요구하는 법령이 적용되거나 적용될 예정인 물품\n    2. 수입신고하는 때와 우리나라에 도착하는 때의 물품의 성질과 수량이 달라지는 물품으로서 관세청장이 정하는 물품","D259-2":"제259조의2(수출입 안전관리 기준 등) ① 법 제255조의2제1항에 따른 안전관리 기준(이하 “안전관리기준”이라 한다)은 다음 각 호와 같다. <개정 2015. 2. 6.>\n    1. 「관세법」, 「자유무역협정의 이행을 위한 관세법의 특례에 관한 법률」, 「대외무역법」 등 수출입에 관련된 법령을 성실하게 준수하였을 것\n    2. 관세 등 영업활동과 관련한 세금을 체납하지 않는 등 재무 건전성을 갖출 것\n    3. 수출입물품의 안전한 관리를 확보할 수 있는 운영시스템, 거래업체, 운송수단 및 직원교육체계 등을 갖출 것\n    4. 그 밖에 세계관세기구에서 정한 수출입 안전관리에 관한 표준 등을 반영하여 관세청장이 정하는 기준을 갖출 것\n  ② 관세청장은 법 제255조의2제2항에 따른 심사를 할 때 「국제항해선박 및 항만시설의 보안에 관한 법률」 제12조에 따른 국제선박보안증서를 교부받은 국제항해선박소유자 또는 같은 법 제27조에 따른 항만시설적합확인서를 교부받은 항만시설소유자에 대하여는 제1항 각 호의 안전관리 기준 중 일부에 대하여 심사를 생략할 수 있다.\n  ③ 삭제 <2022. 2. 15.>\n  ④ 삭제 <2022. 2. 15.>\n  ⑤ 삭제 <2022. 2. 15.>\n  [본조신설 2009. 2. 4.]","D126-0":"제126조(관세의 분할납부 승인신청) 법 제107조제2항의 규정에 의하여 관세의 분할납부승인을 얻고자 하는 자는 당해 물품의 수입신고시부터 수입신고수리전까지 그 물품의 품명ㆍ규격ㆍ수량ㆍ가격ㆍ용도ㆍ사용장소와 사업의 종류를 기재한 신청서를 세관장에게 제출하여야 한다.","L108-0":"제108조(담보 제공 및 사후관리) ① 세관장은 필요하다고 인정될 때에는 대통령령으로 정하는 범위에서 관세청장이 정하는 바에 따라 이 법이나 그 밖의 법령ㆍ조약ㆍ협정 등에 따라 관세를 감면받거나 분할납부를 승인받은 물품에 대하여 그 물품을 수입할 때에 감면받거나 분할납부하는 관세액(제97조제4항 및 제98조제2항에 따른 가산세는 제외한다)에 상당하는 담보를 제공하게 할 수 있다.\n  ② 이 법이나 그 밖의 법률ㆍ조약ㆍ협정 등에 따라 용도세율을 적용(제83조제1항 단서에 해당하는 경우는 제외한다)받거나 관세의 감면 또는 분할납부를 승인받은 자는 대통령령으로 정하는 바에 따라 해당 조건의 이행 여부를 확인(이하 이 조에서 “사후관리”라 한다)하는 데에 필요한 서류를 세관장에게 제출하여야 한다.<개정 2023. 12. 31.>\n  ③ 관세청장은 사후관리를 위하여 필요한 경우에는 대통령령으로 정하는 바에 따라 해당 물품의 사후관리에 관한 업무를 주무부장관에게 위탁할 수 있으며, 주무부장관은 물품의 사후관리를 위하여 필요한 경우에는 미리 관세청장과 협의한 후 위탁받은 사후관리에 관한 업무를 관계 기관이나 법인ㆍ단체 등에 재위임하거나 재위탁할 수 있다.\n  <개정 2019. 12. 31., 2023. 12. 31.>\n  ④ 용도세율을 적용받거나 관세를 감면받은 물품을 세관장의 승인을 받아 수출한 경우에는 이 법을 적용할 때 용도 외의 사용으로 보지 아니하고 사후관리를 종결한다. 다만, 용도세율을 적용받거나 관세를 감면받은 물품을 가공하거나 수리할 목적으로 수출한 후 다시 수입하거나 해외시험 및 연구를 목적으로 수출한 후 다시 수입하여 제99조제3호 또는 제101조제1항제2호에 따른 감면을 받은 경우에는 사후관리를 계속한다.\n  [전문개정 2010. 12. 30.]","D156-0":"제156조(국제항이 아닌 지역에 대한 출입허가) ①법 제134조제1항 단서에 따라 국제항이 아닌 지역에 대한 출입의 허가를 받으려는 자는 다음 각 호의 사항을 기재한 신청서를 해당 지역을 관할하는 세관장에게 제출해야 한다. 다만, 국제무역선 또는 국제무역기 항행의 편의도모나 그 밖의 특별한 사정이 있는 경우에는 다른 세관장에게 제출할 수 있다. <개정 2021. 2. 17.>\n    1. 선박 또는 항공기의 종류ㆍ명칭ㆍ등록기호ㆍ국적과 총톤수 및 순톤수 또는 자체무게\n    2. 지명\n    3. 당해 지역에 머무는 기간\n    4. 당해 지역에서 하역하고자 하는 물품의 내외국물품별 구분, 포장의 종류ㆍ기호ㆍ번호 및 개수와 품명ㆍ수량 및 가격\n    5. 당해 지역에 출입하고자 하는 사유\n  ②제1항 단서의 규정에 의하여 출입허가를 한 세관장은 지체없이 이를 당해 지역을 관할하는 세관장에게 통보하여야 한다.\n  [제목개정 2021. 2. 17.]","R64-0":"제64조(사증수수료) 법 제152조제3항에 따라 납부하여야 하는 사증수수료는 400원으로 한다. <개정 2007. 5. 29.>","D215-0":"제215조(종합보세사업장의 설치ㆍ운영신고 등) ①법 제198조제1항의 규정에 의한 종합보세사업장의 설치ㆍ운영에 관한 신고의 절차에 관하여는 제188조의 규정을 준용한다. 다만, 관세청장은 종합보세구역의 규모ㆍ기능 등을 고려하여 첨부서류의 일부를 생략하는 등 설치ㆍ운영의 신고절차를 간이하게 할 수 있다.\n  ②법 제198조제3항의 규정에 의하여 종합보세기능의 변경신고를 하고자 하는 자는 그 변경내용을 기재한 신고서를 세관장에게 제출하여야 한다.","D259-8":"제259조의8(우편물의 사전전자정보 제출) ① 법 제256조의2제1항에서 “대통령령으로 정하는 전자정보”란 다음 각 호의 정보를 말한다.\n    1. 사전 통관정보: 우편물에 관한 전자적 통관정보로서 다음 각 목의 정보\n      가. 우편물번호, 발송인 및 수취인의 성명과 주소, 총수량 및 총중량\n      나. 개별 우편물의 품명ㆍ수량ㆍ중량 및 가격\n      다. 그 밖에 수입하려는 우편물에 관한 통관정보로서 관세청장이 정하여 고시하는 정보\n    2. 사전 발송정보: 개별 우편물이 들어있는 우편 용기에 관한 전자적 발송정보로서 다음 각 목의 정보\n      가. 우편물 자루번호 및 우편물번호\n      나. 발송ㆍ도착 예정 일시, 발송국ㆍ도착국 공항 또는 항만의 명칭, 운송수단\n      다. 그 밖에 수입하려는 우편물에 관한 발송정보로서 관세청장이 정하여 고시하는 정보\n  ② 통관우체국의 장은 법 제256조의2제1항에 따라 제1항 각 호의 전자정보(이하 “사전전자정보”라 한다)를 정보통신망을 이용하여 세관장에게 제출해야 한다.\n  ③ 세관장은 법 제256조의2제2항에 따라 사전전자정보가 제출되지 않은 우편물을 통관우체국의 장으로 하여금 반송하도록 하기로 결정한 경우에는 그 결정사항을 통관우체국의 장에게 통지해야 한다.\n  ④ 제3항에 따른 통지를 받은 통관우체국의 장은 우편물의 수취인이나 발송인에게 그 결정사항을 통지하고 반송해야 한다.\n  ⑤ 법 제256조의2제3항 단서에서 “대통령령으로 정하는 사유”란 다음 각 호의 사유를 말한다.\n    1. 세관장이 법 제39조에 따라 관세를 부과ㆍ징수하려는 경우\n    2. 세관장이 법 제235조 또는 제237조에 따라 우편물의 통관을 보류하거나 유치할 필요가 있는 경우\n    3. 법 제256조의2제1항에 따라 제출된 사전전자정보가 불충분하거나 불분명한 경우\n    4. 법 제258조제2항에 따라 법 제241조제1항에 따른 수입신고를 해야 하는 경우\n    5. 세관장이 관세 관계 법령 위반 혐의가 있는 우편물을 조사하려는 경우\n  [본조신설 2022. 2. 15.]","R7-4":"제7조의4(임차수입물품의 과세가격의 결정) ① 영 제29조제3항제3호에 따른 임차수입물품의 과세가격은 다음 각 호를 순차적으로 적용한 가격을 기초로 하여 결정할 수 있다.\n    1. 임차료의 산출 기초가 되는 해당 임차수입물품의 가격\n    2. 해당 임차수입물품, 동종ㆍ동질물품 또는 유사물품을 우리나라에 수출할 때 공개된 가격자료에 기재된 가격(중고물품의 경우에는 제7조의5에 따라 결정된 가격을 말한다)\n    3. 해당 임차수입물품의 경제적 내구연한 동안 지급될 총 예상임차료를 기초로 하여 계산한 가격. 다만, 세관장이 일률적인 내구연한의 적용이 불합리하다고 판단하는 경우는 제외한다.\n    4. 임차하여 수입하는 물품에 대해 수입자가 구매선택권을 가지는 경우에는 임차계약상 구매선택권을 행사할 수 있을 때까지 지급할 총 예상임차료와 구매선택권을 행사하는 때에 지급해야 할 금액의 현재가격(제2항제2호 및 제3호를 적용하여 산정한 가격을 말한다)의 합계액을 기초로 하여 결정한 가격\n    5. 그 밖에 세관장이 타당하다고 인정하는 합리적인 가격\n  ② 제1항제3호에 따라 과세가격을 결정할 때에는 다음 각 호에 따른다.\n    1. 해당 수입물품의 경제적 내구연한 동안에 지급될 총 예상임차료(해당 물품을 수입한 후 이를 정상으로 유지 사용하기 위해 소요되는 비용이 임차료에 포함되어 있을 때에는 그에 상당하는 실비를 공제한 총 예상임차료)를 현재가격으로 환산한 가격을 기초로 한다.\n    2. 수입자가 임차료 외의 명목으로 정기적 또는 비정기적으로 지급하는 특허권 등의 사용료 또는 해당 물품의 거래조건으로 별도로 지급하는 비용이 있는 경우에는 이를 임차료에 포함한다.\n    3. 현재가격을 계산하는 때에 적용할 이자율은 임차계약서에 따르되, 해당 계약서에 이자율이 정해져 있지 않거나 규정된 이자율이 제9조의3에서 정한 이자율 이상인 때에는 제9조의3에서 정한 이자율을 적용한다.\n  [본조신설 2020. 10. 7.]","R20-2":"제20조의2(경미한 변경행위 등의 판단) ① 영 제71조의2제2항에 따라 같은 조 제1항제1호에 따른 행위 여부를 판단할 때에는 다음 각 호의 사항을 고려해야 한다. <개정 2025. 12. 31.>\n    1. 법 제51조에 따라 덤핑방지관세가 부과되는 물품(이하 “덤핑방지관세물품”이라 한다)과 법 제56조의2제1항에 따른 우회덤핑(이하 “우회덤핑”이라 한다) 조사대상물품의 물리적 특성 및 화학성분 차이\n    2. 덤핑방지관세물품과 우회덤핑 조사대상물품의 법 제84조제3호에 따른 관세ㆍ통계통합품목분류표상 품목번호 차이\n    3. 덤핑방지관세물품을 우회덤핑 조사대상물품으로 대체할 수 있는 범위 및 우회덤핑 조사대상물품의 용도\n    4. 덤핑방지관세물품과 우회덤핑 조사대상물품의 생산설비 차이\n    5. 영 제71조의2제1항에 따른 경미한 변경행위에 소요되는 비용\n    6. 그 밖에 무역위원회가 필요하다고 인정하는 사항\n  ② 영 제71조의2제2항에 따라 같은 조 제1항제2호에 따른 행위 여부를 판단할 때에는 다음 각 호의 사항을 고려해야 한다. <신설 2025. 12. 31.>\n    1. 제3국에서 이루어지는 조립 또는 가공 공정의 성격\n    2. 제3국에서 덤핑방지관세물품과 동종물품으로 단순 조립 또는 가공된 제품(이하 이 조에서 “단순조립가공물품”이라 한다)의 가격 중 조립 또는 가공 공정의 비용이 차지하는 비율\n    3. 단순조립가공물품의 가격 중 덤핑방지관세물품의 공급국에서 생산된 원재료 또는 부분품의 가격이 차지하는 비율\n    4. 제3국 내 단순조립가공물품 생산설비 등 투자금액 및 기간\n    5. 법 제51조에 따른 덤핑방지관세의 부과 요청 이후 덤핑방지관세물품의 공급국에서 생산된 원재료 또는 부분품의 제3국 수출량\n    6. 그 밖에 무역위원회가 필요하다고 인정하는 사항\n  [본조신설 2024. 3. 22.]\n  [제목개정 2025. 12. 31.]","L323-0":"제323조(세관설비의 사용) 물품장치나 통관을 위한 세관설비를 사용하려는 자는 재정경제부령으로 정하는 사용료를 납부하여야 한다. <개정 2025. 10. 1.>\n  [전문개정 2010. 12. 30.]","R69-0":"제69조(보세공장업종의 제한) 법 제185조제5항에 따른 수입물품을 제조ㆍ가공하는 것을 목적으로 하는 보세공장의 업종은 다음 각호에 규정된 업종을 제외한 업종으로 한다. <개정 2005. 2. 11., 2020. 3. 13.>\n    1. 법 제73조의 규정에 의하여 국내외 가격차에 상당하는 율로 양허한 농ㆍ임ㆍ축산물을 원재료로 하는 물품을 제조ㆍ가공하는 업종\n    2. 국민보건 또는 환경보전에 지장을 초래하거나 풍속을 해하는 물품을 제조ㆍ가공하는 업종으로 세관장이 인정하는 업종","D6-0":"제6조(관세부과 제척기간의 기산일) 법 제21조제1항에 따른 관세부과의 제척기간을 산정할 때 수입신고한 날의 다음날을 관세를 부과할 수 있는 날로 한다. 다만, 다음 각 호의 경우에는 해당 호에 규정된 날을 관세를 부과할 수 있는 날로 한다. <개정 2001. 12. 31., 2012. 2. 2.>\n    1. 법 제16조제1호 내지 제11호에 해당되는 경우에는 그 사실이 발생한 날의 다음날\n    2. 의무불이행 등의 사유로 감면된 관세를 징수하는 경우에는 그 사유가 발생한 날의 다음날\n    3. 보세건설장에 반입된 외국물품의 경우에는 다음 각목의 날중 먼저 도래한 날의 다음날\n      가. 제211조의 규정에 의하여 건설공사완료보고를 한 날\n      나. 법 제176조의 규정에 의한 특허기간(특허기간을 연장한 경우에는 연장기간을 말한다)이 만료되는 날\n    4. 과다환급 또는 부정환급 등의 사유로 관세를 징수하는 경우에는 환급한 날의 다음날\n    5. 법 제28조에 따라 잠정가격을 신고한 후 확정된 가격을 신고한 경우에는 확정된 가격을 신고한 날의 다음 날(다만, 법 제28조제2항에 따른 기간 내에 확정된 가격을 신고하지 아니하는 경우에는 해당 기간의 만료일의 다음날)","L21-0":"제21조(관세부과의 제척기간) ① 관세는 해당 관세를 부과할 수 있는 날부터 5년이 지나면 부과할 수 없다. 다만, 다음 각 호의 경우에는 관세를 부과할 수 있는 날부터 해당 호에서 정하는 기간이 지나면 부과할 수 없다. <개정 2011. 12. 31., 2013. 8. 13., 2024. 12. 31.>\n    1. 수입신고를 하지 아니하고 수입한 경우(제16조제1호부터 제10호까지에 따른 물품은 제외한다): 7년\n    2. 부정한 방법으로 관세를 포탈하였거나 환급 또는 감면받은 경우: 10년\n  ② 다음 각 호의 어느 하나에 해당하는 경우에는 제1항에도 불구하고 해당 호에 규정된 기간까지는 해당 결정ㆍ판결ㆍ회신결과 또는 경정청구에 따라 경정이나 그 밖에 필요한 처분을 할 수 있다.<개정 2020. 12. 22.>\n    1. 다음 각 목의 어느 하나에 해당하는 경우: 그 결정ㆍ판결이 확정된 날부터 1년\n      가. 제5장제2절(제119조부터 제132조까지)에 따른 이의신청, 심사청구 또는 심판청구에 대한 결정이 있은 경우\n      나. 「감사원법」에 따른 심사청구에 대한 결정이 있은 경우\n      다. 「행정소송법」에 따른 소송에 대한 판결이 있은 경우\n      라. 제313조에 따른 압수물품의 반환결정이 있은 경우\n    2. 이 법과 「자유무역협정의 이행을 위한 관세법의 특례에 관한 법률」 및 조약ㆍ협정 등에서 정하는 바에 따라 양허세율의 적용여부 및 세액 등을 확정하기 위하여 원산지증명서를 발급한 국가의 세관이나 그 밖에 발급권한이 있는 기관에게 원산지증명서 및 원산지증명서확인자료의 진위 여부, 정확성 등의 확인을 요청한 경우: 다음 각 목의 날 중 먼저 도래하는 날부터 1년\n      가. 해당 요청에 따라 회신을 받은 날\n      나. 이 법과 「자유무역협정의 이행을 위한 관세법의 특례에 관한 법률」 및 조약ㆍ협정 등에서 정한 회신기간이 종료된 날\n    3. 다음 각 목의 어느 하나에 해당하는 경우: 경정청구일 또는 결정통지일부터 2개월\n      가. 제38조의3제2항ㆍ제3항 또는 제38조의4제1항에 따른 경정청구가 있는 경우\n      나. 제38조의4제4항에 따른 조정 신청에 대한 결정통지가 있는 경우\n  ③ 제1항에도 불구하고 제2항제1호가목부터 다목까지의 결정 또는 판결에 따라 명의대여 사실이 확인된 경우에는 당초의 부과처분을 취소하고 그 결정 또는 판결이 확정된 날부터 1년 이내에 실제로 사업을 경영한 자에게 경정이나 그 밖에 필요한 처분을 할 수 있다.<신설 2023. 12. 31.>\n  ④ 제1항에 따른 관세를 부과할 수 있는 날은 대통령령으로 정한다.<개정 2023. 12. 31.>\n  [전문개정 2010. 12. 30.]","D3-0":"제3조(장부 등의 보관) ①법 제12조제1항 전단에서 “대통령령으로 정하는 기간”이란 다음 각 호의 구분에 따른 기간을 말한다. <개정 2001. 12. 31., 2007. 4. 5., 2011. 4. 1., 2021. 2. 17., 2024. 2. 29., 2025. 2. 28.>\n    1. 다음 각 목의 어느 하나에 해당하는 서류: 해당 신고에 대한 수리일부터 5년\n      가. 수입신고필증\n      나. 수입거래관련 계약서 또는 이에 갈음하는 서류\n      다. 법 제235조제1항 각 호의 어느 하나에 해당하는 지식재산권 등(이하 “지식재산권등”이라 한다)의 거래에 관련된 계약서 또는 이에 갈음하는 서류\n      라. 수입물품 가격결정에 관한 자료\n    2. 다음 각 목의 어느 하나에 해당하는 서류: 해당 신고에 대한 수리일부터 3년\n      가. 수출신고필증\n      나. 반송신고필증\n      다. 수출물품ㆍ반송물품 가격결정에 관한 자료\n      라. 수출거래ㆍ반송거래 관련 계약서 또는 이에 갈음하는 서류\n    3. 다음 각 목의 어느 하나에 해당하는 서류: 해당 신고에 대한 수리일부터 2년\n      가. 보세화물반출입에 관한 자료\n      나. 적재화물목록에 관한 자료\n      다. 보세운송에 관한 자료\n  ② 법 제12조제2항 후단에서 “대통령령으로 정하는 기준”이란 다음 각 호의 요건을 말한다. <개정 2024. 2. 29.>\n    1. 자료를 저장하거나 저장된 자료를 수정ㆍ추가 또는 삭제하는 절차ㆍ방법 등 정보보존 장치의 생산과 이용에 관련된 전산시스템의 개발과 운영에 관한 기록을 보관할 것\n    2. 정보보존 장치에 저장된 자료의 내용을 쉽게 확인할 수 있도록 하거나 이를 문서화할 수 있는 장치와 절차가 마련되어 있어야 하며, 필요시 다른 정보보존 장치에 복제가 가능하도록 되어 있을 것\n    3. 정보보존 장치가 거래 내용 및 변동사항을 포괄하고 있어야 하며, 과세표준과 세액을 결정할 수 있도록 검색과 이용이 가능한 형태로 보존되어 있을 것\n  ③ 법 제12조제3항 단서에서 “대통령령으로 정하는 것”이란 다음 각 호의 어느 하나에 해당하는 문서를 말한다. <신설 2024. 2. 29.>\n    1. 「상법 시행령」 등 다른 법령에 따라 원본을 보존해야 하는 문서\n    2. 등기ㆍ등록 또는 명의개서가 필요한 자산의 취득 및 양도와 관련하여 기명날인 또는 서명한 계약서\n    3. 소송과 관련하여 제출ㆍ접수한 서류 및 판결문 사본. 다만, 재발급이 가능한 서류는 제외한다.\n    4. 인가ㆍ허가와 관련하여 제출ㆍ접수한 서류 및 인가증ㆍ허가증. 다만, 재발급이 가능한 서류는 제외한다.\n  [제목개정 2024. 2. 29.]\n  제4조 삭제 <2009. 2. 4.>","L87-0":"제87조(특정물품에 적용되는 품목분류의 변경 및 적용) ① 관세청장은 제86조에 따라 사전심사 또는 재심사한 품목분류를 변경하여야 할 필요가 있거나 그 밖에 관세청장이 직권으로 한 품목분류를 변경하여야 할 부득이한 사유가 생겼을 경우 등 대통령령으로 정하는 경우에는 해당 물품에 적용할 품목분류를 변경할 수 있다. <개정 2014. 12. 23., 2015. 12. 15., 2019. 12. 31.>\n  ② 관세청장은 제1항에 따라 품목분류를 변경하였을 때에는 그 내용을 고시 또는 공표하고, 제86조제2항 및 제3항에 따라 통지한 신청인에게는 그 내용을 통지하여야 한다. 다만, 신청인의 영업 비밀을 포함하는 등 해당 물품에 적용될 품목분류를 고시 또는 공표하는 것이 적당하지 아니하다고 인정되는 물품에 대해서는 고시 또는 공표하지 아니할 수 있다.<개정 2014. 12. 23., 2015. 12. 15., 2023. 12. 31.>\n  ③ 제2항에 따라 통지를 받은 자는 통지받은 날부터 30일 이내에 대통령령으로 정하는 서류를 갖추어 관세청장에게 재심사를 신청할 수 있다. 이 경우 재심사의 기간, 재심사 결과의 통지 및 고시ㆍ공표, 수수료 및 재심사의 절차ㆍ방법 등에 관하여는 제86조제3항, 제4항, 제6항 및 제8항을 준용한다.<신설 2014. 12. 23., 2015. 12. 15.>\n  ④ 제1항 및 제3항에 따라 품목분류가 변경된 경우에는 제86조에 따른 신청인이 변경 내용을 통지받은 날과 변경 내용의 고시 또는 공표일 중 빠른 날(이하 “변경일”이라 한다)부터 변경된 품목분류를 적용한다. 다만, 다음 각 호의 구분에 따라 변경 내용을 달리 적용할 수 있다.<개정 2023. 12. 31.>\n    1. 변경일부터 30일이 지나기 전에 우리나라에 수출하기 위하여 선적된 물품에 대하여 변경 전의 품목분류를 적용하는 것이 수입신고인에게 유리한 경우: 변경 전의 품목분류 적용\n    2. 다음 각 목의 어느 하나에 해당하는 경우: 제86조에 따라 품목분류가 결정된 이후 변경일 전까지 수출입신고가 수리된 물품에 대해서도 소급하여 변경된 품목분류 적용\n      가. 제86조에 따른 사전심사 또는 재심사 과정에서 거짓자료 제출 등 신청인에게 책임 있는 사유로 해당 물품의 품목분류가 결정되었으나 이를 이유로 품목분류가 변경된 경우\n      나. 다음의 어느 하나에 해당하는 경우로서 수출입신고인에게 유리한 경우 1) 제86조에 따른 사전심사 또는 재심사 과정에서 신청인에게 자료제출 미비 등의 책임 있는 사유 없이 해당 물품의 품목분류가 결정되었으나 다른 이유로 품목분류가 변경된 경우 2) 제86조에 따른 신청인이 아닌 자가 관세청장이 결정하여 고시하거나 공표한 품목분류에 따라 수출입신고를 하였으나 품목분류가 변경된 경우\n  ⑤ 제86조에 따라 사전심사 또는 재심사한 품목분류가 제1항 또는 제3항에 따라 변경된 경우 그 변경된 품목분류는 제1항 또는 제3항에 따라 다시 변경되기 전까지 유효하다.<개정 2020. 12. 22.>\n  [전문개정 2010. 12. 30.]","D72-0":"제72조(보조금등) ①법 제57조의 규정에 의한 보조금등(이하 “보조금등”이라 한다)은 정부ㆍ공공기관 등의 재정지원 등에 의한 혜택중 특정성이 있는 것을 말한다. 다만, 재정경제부령이 정하는 보조금 또는 장려금은 제외한다. <개정 2008. 2. 29., 2025. 12. 30.>\n  ②제1항에서 “특정성”이라 함은 보조금등이 특정기업이나 산업 또는 특정기업군이나 산업군에 지급되는 경우를 말하며, 구체적인 판별기준은 재정경제부령으로 정한다. <개정 2008. 2. 29., 2025. 12. 30.>\n  ③보조금등의 금액은 수혜자가 실제로 받는 혜택을 기준으로 하여 재정경제부령이 정하는 바에 따라 계산한다. <개정 2008. 2. 29., 2025. 12. 30.>","R11-0":"제11조(덤핑방지관세의 부과요청) ①영 제59조제4항에서 “동종물품”이라 함은 당해 수입물품과 물리적 특성, 품질 및 소비자의 평가 등 모든 면에서 동일한 물품(겉모양에 경미한 차이가 있는 물품을 포함한다)을 말하며, 그러한 물품이 없는 때에는 당해 수입물품과 매우 유사한 기능ㆍ특성 및 구성요소를 가지고 있는 물품을 말한다. <개정 2020. 3. 13.>\n  ② 영 제59조제4항에서 “당해 수입물품의 수입자인 생산자로서 재정경제부령이 정하는 자”란 해당 수입물품을 수입한 생산자 중 다음 각 호의 자를 제외한 자를 말한다. <개정 2008. 12. 31., 2009. 3. 26., 2020. 3. 13., 2026. 1. 2.>\n    1. 영 제59조제6항에 따른 신청서 접수일부터 6개월 이전에 덤핑물품을 수입한 생산자\n    2. 덤핑물품의 수입량이 근소한 생산자\n  ③영 제59조제4항에 따라 특수관계에 있는 생산자의 범위를 판정함에 있어서 당해 수입물품과 동종물품의 생산자가 영 제23조제1항에 따른 특수관계에 속하지 아니하는 자와 동일 또는 유사한 가격 및 조건 등으로 이를 판매하는 때에는 당해 생산자를 특수관계에 있는 생산자의 범위에서 제외할 수 있다. <개정 2020. 3. 13.>\n  ④영 제59조제5항에서 “재정경제부령이 정하는 자”란 국내생산자로 구성된 협회ㆍ조합 등을 말한다. <개정 2008. 12. 31., 2020. 3. 13., 2026. 1. 2.>","R50-0":"제50조(재수출면세대상물품 및 가산세징수대상물품) ①법 제97조제1항제1호에 따라 관세가 면제되는 물품과 같은 조 제4항에 따라 가산세가 징수되는 물품은 다음 각 호와 같다. <개정 2002. 5. 10., 2003. 2. 14., 2004. 3. 30., 2005. 2. 11., 2007. 5. 29., 2007. 12. 31., 2009. 3. 26., 2012. 2. 28., 2013. 2. 23., 2016. 3. 9., 2016. 12. 30., 2021. 3. 16., 2021. 10. 28., 2023. 12. 29., 2025. 3. 21.>\n    1. 수입물품의 포장용품. 다만, 관세청장이 지정하는 물품을 제외한다.\n    2. 수출물품의 포장용품. 다만, 관세청장이 지정하는 물품을 제외한다.\n    3. 우리나라에 일시입국하는 자가 본인이 사용하고 재수출할 목적으로 몸에 직접 착용 또는 휴대하여 반입하거나 별도로 반입하는 물품. 다만, 관세청장이 지정하는 물품을 제외한다.\n    4. 우리나라에 일시입국하는 자가 본인이 사용하고  재수출할 목적으로 직접 휴대하여 반입하거나 별도로 반입하는 직업용품 및 「신문 등의 진흥에 관한 법률」 제28조에 따라 지사 또는 지국의 설치등록을 한 자가 취재용으로 반입하는 방송용의 녹화되지 아니한 비디오테이프\n    5. 관세청장이 정하는 시설에서 국제해운에 종사하는 외국선박의 승무원의 후생을 위하여 반입하는 물품과 그 승무원이 숙박기간중 당해 시설에서 사용하기 위하여 선박에서 하역된 물품\n    6. 박람회ㆍ전시회ㆍ공진회ㆍ품평회나 그 밖에 이에 준하는 행사에 출품 또는 사용하기 위하여 그 주최자 또는 행사에 참가하는 자가 수입하는 물품 중 해당 행사의 성격ㆍ규모 등을 고려하여 세관장이 타당하다고 인정하는 물품\n    7. 국제적인 회의ㆍ회합 등에서 사용하기 위한 물품\n    8. 법 제90조제1항제2호에 따른 기관 및 「국방과학연구소법」에 따른 국방과학연구소에서 학술연구 및 교육훈련을 목적으로 사용하기 위한 학술연구용품\n    9. 법 제90조제1항제2호에 따른 기관 및 「국방과학연구소법」에 따른 국방과학연구소에서 과학기술연구 및 교육훈련을 위한 과학장비용품\n    10. 주문수집을 위한 물품, 시험용 물품 및 제작용 견본품\n    11. 수리를 위한 물품[수리를 위하여 수입되는 물품과 수리 후 수출하는 물품이 영 제98조제1항에 따른 관세ㆍ통계통합품목분류표(이하 “품목분류표”라 한다)상 10단위의 품목번호가 일치할 것으로 인정되는 물품만 해당한다]\n    12. 수출물품 및 수입물품의 검사 또는 시험을 위한 기계ㆍ기구\n    13. 일시입국자가 입국할 때에 수송하여 온 본인이 사용할 승용자동차ㆍ이륜자동차ㆍ캠핑카ㆍ캬라반ㆍ트레일러ㆍ선박 및 항공기와 관세청장이 정하는 그 부분품 및 예비품\n    14. 관세청장이 정하는 수출입물품ㆍ반송물품 및 환적물품을 운송하기 위한 차량\n    15. 이미 수입된 국제운송을 위한 컨테이너의 수리를 위한 부분품\n    16. 수출인쇄물 제작원고용 필름(빛에 노출되어 현상된 것에 한한다)\n    17. 광메모리매체 제조용으로 정보가 수록된 마스터테이프 및 니켈판(생산제품을 수출할 목적으로 수입되는 것임을 당해 업무를 관장하는 중앙행정기관의 장이 확인한 것에 한한다)\n    18. 항공기 및 그 부분품의 수리ㆍ검사 또는 시험을 위한 기계ㆍ기구\n    19. 항공 및 해상화물운송용 파렛트\n    20. 수출물품 규격확인용 물품\n    21. 항공기의 수리를 위하여 일시 사용되는 엔진 및 부분품\n    22. 산업기계의 수리용 또는 정비용의 것으로서 무상으로 수입되는 기계 또는 장비\n    23. 외국인투자기업이 자체상표제품을 생산하기 위하여 일시적으로 수입하는 금형 및 그 부분품\n    24. 반도체 제조설비 또는 디스플레이 제조설비와 함께 수입되는 물품으로서 다음 각 목의 어느 하나에 해당하는 물품\n      가. 반도체 제조설비 또는 디스플레이 제조설비 운반용구\n      나. 반도체 제조설비 또는 디스플레이 제조설비의 운송과정에서 해당 설비의 품질을 유지하거나 상태를 측정ㆍ기록하기 위해 해당 설비에 부착하는 기기\n  ②법 제97조제1항제2호에 따라 관세가 면제되는 물품과 같은 조 제4항에 따라 가산세가 징수되는 물품은 다음 각 호와 같다. <개정 2009. 3. 26.>\n    1. 수송기기의 하자를 보수하거나 이를 유지하기 위한 부분품\n    2. 외국인 여행자가 연 1회 이상 항해조건으로 반입한 후 지방자치단체에서 보관ㆍ관리하는 요트(모터보트를 포함한다)","R53-0":"제53조(재수출물품에 대한 관세의 감면신청) 법 제98조제1항의 규정에 의하여 관세를 감면받고자 하는 자는 영 제112조제1항 각호의 사항외에 당해 물품의 수출예정시기ㆍ수출지 및 수출예정세관명을 신청서에 기재하여야 한다.","D19-0":"제19조(권리사용료의 산출) ①법 제30조제1항제4호에서 “이와 유사한 권리”라 함은 다음 각호의 1에 해당하는 것을 말한다.\n    1. 저작권 등의 법적 권리\n    2. 법적 권리에는 속하지 아니하지만 경제적 가치를 가지는 것으로서 상당한 노력에 의하여 비밀로 유지된 생산방법ㆍ판매방법 기타 사업활동에 유용한 기술상 또는 경영상의 정보 등(이하 “영업비밀”이라 한다)\n  ②법 제30조제1항의 규정에 의하여 당해 물품에 대하여 구매자가 실제로 지급하였거나 지급하여야 할 가격에 가산하여야 하는 특허권ㆍ실용신안권ㆍ디자인권ㆍ상표권 및 이와 유사한 권리를 사용하는 대가(특정한 고안이나 창안이 구현되어 있는 수입물품을 이용하여 우리나라에서 그 고안이나 창안을 다른 물품에 재현하는 권리를 사용하는 대가를 제외하며, 이하 “권리사용료”라 한다)는 당해 물품에 관련되고 당해 물품의 거래조건으로 구매자가 직접 또는 간접으로 지급하는 금액으로 한다. <개정 2005. 6. 30.>\n  ③제2항의 규정을 적용함에 있어서 다음 각호의 1에 해당하는 경우에는 권리사용료가 당해 물품과 관련되는 것으로 본다. <개정 2005. 6. 30.>\n    1. 권리사용료가 특허권에 대하여 지급되는 때에는 수입물품이 다음 각목의 1에 해당하는 물품인 경우\n      가. 특허발명품\n      나. 방법에 관한 특허에 의하여 생산된 물품\n      다. 국내에서 당해 특허에 의하여 생산될 물품의 부분품ㆍ원재료 또는 구성요소로서 그 자체에 당해 특허의 내용의 전부 또는 일부가 구현되어 있는 물품\n      라. 방법에 관한 특허를 실시하기에 적합하게 고안된 설비ㆍ기계 및 장치(그 주요특성을 갖춘 부분품 등을 포함한다)\n    2. 권리사용료가 디자인권에 대하여 지급되는 때에는 수입물품이 당해 디자인을 표현하는 물품이거나 국내에서 당해 디자인권에 의하여 생산되는 물품의 부분품 또는 구성요소로서 그 자체에 당해 디자인의 전부 또는 일부가 표현되어 있는 경우\n    3. 권리사용료가 상표권에 대하여 지급되는 때에는 수입물품에 상표가 부착되거나 희석ㆍ혼합ㆍ분류ㆍ단순조립ㆍ재포장 등의 경미한 가공후에 상표가 부착되는 경우\n    4. 권리사용료가 저작권에 대하여 지급되는 때에는 수입물품에 가사ㆍ선율ㆍ영상ㆍ컴퓨터소프트웨어 등이 수록되어 있는 경우\n    5. 권리사용료가 실용신안권 또는 영업비밀에 대하여 지급되는 때에는 당해 실용신안권 또는 영업비밀이 수입물품과 제1호의 규정에 준하는 관련이 있는 경우\n    6. 권리사용료가 기타의 권리에 대하여 지급되는 때에는 당해 권리가 수입물품과 제1호 내지 제5호의 규정중 권리의 성격상 당해 권리와 가장 유사한 권리에 대한 규정에 준하는 관련이 있는 경우\n  ④제2항을 적용할 때 컴퓨터소프트웨어에 대하여 지급되는 권리사용료는 컴퓨터소프트웨어가 수록된 마그네틱테이프ㆍ마그네틱디스크ㆍ시디롬 및 이와 유사한 물품[법 별표 관세율표 번호(이하 “관세율표 번호”라 한다) 제8523호에 속하는 것으로 한정한다]과 관련되지 아니하는 것으로 본다. <개정 2007. 4. 5., 2011. 4. 1.>\n  ⑤제2항의 규정을 적용함에 있어서 다음 각호의 1에 해당하는 경우에는 권리사용료가 당해 물품의 거래조건으로 지급되는 것으로 본다.\n    1. 구매자가 수입물품을 구매하기 위하여 판매자에게 권리사용료를 지급하는 경우\n    2. 수입물품의 구매자와 판매자간의 약정에 따라 구매자가 수입물품을 구매하기 위하여 당해 판매자가 아닌 자에게 권리사용료를 지급하는 경우\n    3. 구매자가 수입물품을 구매하기 위하여 판매자가 아닌 자로부터 특허권 등의 사용에 대한 허락을 받아 판매자에게 그 특허권 등을 사용하게 하고 당해 판매자가 아닌 자에게 권리사용료를 지급하는 경우\n  ⑥ 제2항을 적용할 때 구매자가 지급하는 권리사용료에 수입물품과 관련이 없는 물품이나 국내 생산 및 그 밖의 사업 등에 대한 활동 대가가 포함되어 있는 경우에는 전체 권리사용료 중 수입물품과 관련된 권리사용료만큼 가산한다. 이 경우 관세청장은 필요한 계산식을 정할 수 있다. <개정 2020. 10. 7.>","L204-0":"제204조(종합보세구역 지정의 취소 등) ① 관세청장은 종합보세구역에 반입ㆍ반출되는 물량이 감소하거나 그 밖에 대통령령으로 정하는 사유로 종합보세구역을 존속시킬 필요가 없다고 인정될 때에는 종합보세구역의 지정을 취소할 수 있다.\n  ② 세관장은 종합보세사업장의 운영인이 다음 각 호의 어느 하나에 해당하는 경우에는 6개월의 범위에서 운영인의 종합보세기능의 수행을 중지시킬 수 있다.<개정 2018. 12. 31.>\n    1. 운영인이 제202조제1항에 따른 설비의 유지의무를 위반한 경우\n    2. 운영인이 수행하는 종합보세기능과 관련하여 반입ㆍ반출되는 물량이 감소하는 경우\n    3. 1년 동안 계속하여 외국물품의 반입ㆍ반출 실적이 없는 경우\n  ③ 세관장은 종합보세사업장의 운영인이 다음 각 호의 어느 하나에 해당하는 경우에는 그 종합보세사업장의 폐쇄를 명하여야 한다.<신설 2018. 12. 31.>\n    1. 거짓이나 그 밖의 부정한 방법으로 종합보세사업장의 설치ㆍ운영에 관한 신고를 한 경우\n    2. 제175조 각 호의 어느 하나에 해당하게 된 경우. 다만, 제175조제8호에 해당하는 경우로서 같은 조 제2호 또는 제3호에 해당하는 사람을 임원으로 하는 법인이 3개월 이내에 해당 임원을 변경한 경우에는 그러하지 아니하다.\n    3. 다른 사람에게 자신의 성명ㆍ상호를 사용하여 종합보세사업장을 운영하게 한 경우\n  [전문개정 2010. 12. 30.]","L89-0":"제89조(세율불균형물품의 면세) ① 세율불균형을 시정하기 위하여 「조세특례제한법」 제6조제1항에 따른 중소기업(이하 이 조에서 “중소기업”이라 한다)이 대통령령으로 정하는 바에 따라 세관장이 지정하는 공장에서 다음 각 호의 어느 하나에 해당하는 물품을 제조 또는 수리하기 위하여 사용하는 부분품과 원재료(수출한 후 외국에서 수리ㆍ가공되어 수입되는 부분품과 원재료의 가공수리분을 포함한다. 이하 이 조에서 같다) 중 재정경제부령으로 정하는 물품에 대해서는 그 관세를 면제할 수 있다. <개정 2013. 1. 1., 2018. 12. 31., 2020. 12. 22., 2025. 10. 1.>\n    1. 항공기(부분품을 포함한다)\n    2. 반도체 제조용 장비(부속기기를 포함한다)\n  ② 다음 각 호의 어느 하나에 해당하는 자는 제1항에 따른 지정을 받을 수 없다.<신설 2015. 12. 15.>\n    1. 제175조제1호부터 제5호까지 및 제7호의 어느 하나에 해당하는 자\n    2. 제4항에 따라 지정이 취소(제175조제1호부터 제3호까지의 어느 하나에 해당하여 취소된 경우는 제외한다)된 날부터 2년이 지나지 아니한 자\n    3. 제1호 또는 제2호에 해당하는 사람이 임원(해당 공장의 운영업무를 직접 담당하거나 이를 감독하는 자로 한정한다)으로 재직하는 법인\n  ③ 제1항에 따른 지정기간은 10년 이내로 하되, 지정받은 자의 신청에 의하여 연장할 수 있다.<개정 2025. 12. 23.>\n  ④ 세관장은 제1항에 따라 지정을 받은 자가 다음 각 호의 어느 하나에 해당하는 경우에는 그 지정을 취소할 수 있\n      다. 다만, 제1호 또는 제2호에 해당하는 경우에는 지정을 취소하여야 한다.<신설 2015. 12. 15., 2018. 12. 31.>\n    1. 제2항 각 호의 어느 하나에 해당하는 경우. 다만, 제2항제3호에 해당하는 경우로서 제175조제2호 또는 제3호에 해당하는 사람을 임원으로 하는 법인이 3개월 이내에 해당 임원을 변경하는 경우에는 그러하지 아니하다.\n    2. 거짓이나 그 밖의 부정한 방법으로 지정을 받은 경우\n    3. 1년 이상 휴업하여 세관장이 지정된 공장의 설치목적을 달성하기 곤란하다고 인정하는 경우\n  ⑤ 제1항에 따라 지정된 공장에 대하여는 제179조, 제180조제2항, 제182조 및 제187조를 준용한다.<개정 2013. 1. 1., 2015. 12. 15.>\n  ⑥ 중소기업이 아닌 자가 제1항의 대통령령으로 정하는 바에 따라 세관장이 지정하는 공장에서 제1항제1호의 물품을 제조 또는 수리하기 위하여 사용하는 부분품과 원재료에 대해서는 다음 각 호에 따라 그 관세를 감면한다.<신설 2018. 12. 31., 2020. 12. 22., 2021. 12. 21., 2025. 3. 14., 2025. 10. 1., 2025. 12. 23.>\n    1. 「세계무역기구 설립을 위한 마라케쉬 협정 부속서 4의 민간항공기 무역에 관한 협정」 대상 물품 중 재정경제부령으로 정하는 물품으로서 2028년 12월 31일까지 수입신고한 물품에 대하여는 그 관세를 면제한다.\n    2. 제1호 이외의 물품의 관세감면에 관하여는 다음 표의 기간 동안 수입신고하는 분에 대하여는 각각의 적용기간에 해당하는 감면율을 적용한다.\n  ⑦ 국가 및 지방자치단체가 제1항제1호의 물품을 제조 또는 수리하기 위하여 사용하는 부분품과 원재료에 관하여는 제6항에도 불구하고 제1항을 준용한다.<신설 2020. 12. 22.>\n  ⑧ 제1항에 따라 지정을 받은 자가 지정사항을 변경하려는 경우에는 관세청장이 정하는 바에 따라 세관장에게 변경신고하여야 한다.<신설 2020. 12. 22.>\n  [전문개정 2010. 12. 30.]\n  [제목개정 2013. 1. 1.]","L324-0":"제324조(포상) ① 관세청장은 다음 각 호의 어느 하나에 해당하는 사람에게는 대통령령으로 정하는 바에 따라 포상할 수 있다.\n    1. 제269조부터 제271조까지, 제274조, 제275조의2 및 제275조의3에 해당되는 관세범을 세관이나 그 밖의 수사기관에 통보하거나 체포한 자로서 공로가 있는 사람\n    2. 제269조부터 제274조까지의 규정에 해당되는 범죄물품을 압수한 사람으로서 공로가 있는 사람\n    3. 이 법이나 다른 법률에 따라 세관장이 관세 및 내국세 등을 추가 징수하는 데에 공로가 있는 사람\n    4. 관세행정의 개선이나 발전에 특별히 공로가 있는 사람\n  ② 관세청장은 체납자의 은닉재산을 신고한 사람에게 대통령령으로 정하는 바에 따라 10억원의 범위에서 포상금을 지급할 수 있다. 다만, 은닉재산의 신고를 통하여 징수된 금액이 대통령령으로 정하는 금액 미만인 경우 또는 공무원이 그 직무와 관련하여 은닉재산을 신고한 경우에는 포상금을 지급하지 아니한다.<개정 2013. 1. 1.>\n  ③ 제2항에서 “은닉재산”이란 체납자가 은닉한 현금ㆍ예금ㆍ주식이나 그 밖에 재산적 가치가 있는 유형ㆍ무형의 재산을 말한다. 다만, 다음 각 호의 어느 하나에 해당하는 재산은 제외한다.<개정 2020. 12. 22.>\n    1. 「국세징수법」 제25조에 따른 사해행위 취소소송의 대상이 되어 있는 재산\n    2. 세관공무원이 은닉 사실을 알고 조사를 시작하거나 강제징수 절차를 진행하기 시작한 재산\n    3. 그 밖에 체납자의 은닉재산을 신고받을 필요가 없다고 인정되는 재산으로서 대통령령으로 정하는 것\n  ④ 제2항에 따른 은닉재산의 신고는 신고자의 성명과 주소를 적고 서명하거나 날인한 문서로 하여야 한다.\n  [전문개정 2010. 12. 30.]","L240-5":"제240조의5(상호주의에 따른 통관절차 간소화) 국제무역 및 교류를 증진하고 국가 간의 협력을 촉진하기 위하여 우리나라에 대하여 통관절차의 편익을 제공하는 국가에서 수입되는 물품에 대하여는 상호 조건에 따라 대통령령으로 정하는 바에 따라 간이한 통관절차를 적용할 수 있다.\n  [본조신설 2014. 12. 23.]","R17-0":"제17조(덤핑방지관세의 부과 등) ①법 제51조의 규정에 의하여 덤핑방지관세를 부과하는 때에는 다음 각호의 방법에 의한다. <개정 2010. 3. 30.>\n    1. 덤핑방지관세를 정률세의 방법으로 부과하는 경우 : 다음의 산식에 의하여 산정된 덤핑률의 범위안에서 결정한 율을 과세가격에 곱하여 산출한 금액\n  <img alt=\"@@LATEX@@mathrm{덤핑률} = frac{left(조정된정상가격- 조정된덤핑가격right)}{mathrm{과세가격}} times 100@@/LATEX@@\" src=\"/LSW/flDownload.do?flSeq=22052179\" />\n    2. 덤핑방지관세를 기준수입가격의 방법으로 부과하는 경우 : 영 제65조제7항에 따른 기준수입가격에서 과세가격을 차감하여 산출한 금액\n  ②영 제65조제3항제1호에 따라 가중평균 덤핑방지관세율 또는 기준수입가격을 산정함에 있어서 공급자가 다수인 때에는 공급자별 수출량에 따라 가중치를 둘 수 있다. 이 경우 다음 각 호의 어느 하나에 해당하는 공급자는 산정대상에서 제외한다. <개정 2007. 12. 31., 2024. 3. 22.>\n    1. 덤핑차액이 없거나 덤핑가격대비 덤핑차액이 100분의 2 미만인 공급자\n    2. 영 제64조제5항에 따라 이용가능한 자료 등을 사용하여 덤핑차액 등을 산정한 공급자\n  ③재정경제부장관은 영 제65조제3항제2호에 따라 자료를 제출한 신규공급자에 대하여 영 제61조의 규정에 의한 조사를 조속히 행하여야 한다. 이 경우 실질적 피해등의 조사는 영 제65조제3항 각 호 외의 부분에 따른 공급국에 대한 실질적 피해등의 조사로 갈음할 수 있다. <개정 2008. 12. 31., 2024. 3. 22., 2026. 1. 2.>","L107-0":"제107조(관세의 분할납부) ① 세관장은 천재지변이나 그 밖에 대통령령으로 정하는 사유로 이 법에 따른 신고, 신청, 청구, 그 밖의 서류의 제출, 통지, 납부 또는 징수를 정하여진 기한까지 할 수 없다고 인정될 때에는 1년을 넘지 아니하는 기간을 정하여 대통령령으로 정하는 바에 따라 관세를 분할하여 납부하게 할 수 있다.\n  ② 다음 각 호의 어느 하나에 해당하는 물품이 수입될 때에는 세관장은 재정경제부령으로 정하는 바에 따라 5년을 넘지 아니하는 기간을 정하여 관세의 분할납부를 승인할 수 있다.<개정 2025. 10. 1.>\n    1. 시설기계류, 기초설비품, 건설용 재료 및 그 구조물과 공사용 장비로서 재정경제부장관이 고시하는 물품. 다만, 재정경제부령으로 정하는 업종에 소요되는 물품은 제외한다.\n    2. 정부나 지방자치단체가 수입하는 물품으로서 재정경제부령으로 정하는 물품\n    3. 학교나 직업훈련원에서 수입하는 물품과 비영리법인이 공익사업을 위하여 수입하는 물품으로서 재정경제부령으로 정하는 물품\n    4. 의료기관 등 재정경제부령으로 정하는 사회복지기관 및 사회복지시설에서 수입하는 물품으로서 재정경제부장관이 고시하는 물품\n    5. 재정경제부령으로 정하는 기업부설연구소, 산업기술연구조합 및 비영리법인인 연구기관, 그 밖에 이와 유사한 연구기관에서 수입하는 기술개발연구용품 및 실험실습용품으로서 재정경제부장관이 고시하는 물품\n    6. 재정경제부령으로 정하는 중소제조업체가 직접 사용하려고 수입하는 물품. 다만, 재정경제부령으로 정하는 기준에 적합한 물품이어야 한다.\n    7. 재정경제부령으로 정하는 기업부설 직업훈련원에서 직업훈련에 직접 사용하려고 수입하는 교육용품 및 실험실습용품 중 국내에서 제작하기가 곤란한 물품으로서 재정경제부장관이 고시하는 물품\n  ③ 제2항에 따라 관세의 분할납부를 승인받은 자가 해당 물품의 용도를 변경하거나 그 물품을 양도하려는 경우에는 미리 세관장의 승인을 받아야 한다.\n  ④ 관세의 분할납부를 승인받은 법인이 합병ㆍ분할ㆍ분할합병 또는 해산을 하거나 파산선고를 받은 경우 또는 관세의 분할납부를 승인받은 자가 파산선고를 받은 경우에는 제6항부터 제8항까지의 규정에 따라 그 관세를 납부하여야 하는 자는 지체 없이 그 사유를 세관장에게 신고하여야 한다.\n  ⑤ 관세의 분할납부를 승인받은 물품을 동일한 용도로 사용하려는 자에게 양도한 경우에는 그 양수인이 관세를 납부하여야 하며, 해당 용도 외의 다른 용도로 사용하려는 자에게 양도한 경우에는 그 양도인이 관세를 납부하여야 한\n      다. 이 경우 양도인으로부터 해당 관세를 징수할 수 없을 때에는 그 양수인으로부터 징수한다.\n  ⑥ 관세의 분할납부를 승인받은 법인이 합병ㆍ분할 또는 분할합병된 경우에는 합병ㆍ분할 또는 분할합병 후에 존속하거나 합병ㆍ분할 또는 분할합병으로 설립된 법인이 연대하여 관세를 납부하여야 한다.\n  ⑦ 관세의 분할납부를 승인받은 자가 파산선고를 받은 경우에는 그 파산관재인이 관세를 납부하여야 한다.\n  ⑧ 관세의 분할납부를 승인받은 법인이 해산한 경우에는 그 청산인이 관세를 납부하여야 한다.\n  ⑨ 다음 각 호의 어느 하나에 해당하는 경우에는 납부하지 아니한 관세의 전액을 즉시 징수한다.\n    1. 관세의 분할납부를 승인받은 물품을 제2항에서 정한 기간에 해당 용도 외의 다른 용도로 사용하거나 해당 용도 외의 다른 용도로 사용하려는 자에게 양도한 경우\n    2. 관세를 지정된 기한까지 납부하지 아니한 경우. 다만, 관세청장이 부득이한 사유가 있다고 인정하는 경우는 제외한다.\n    3. 파산선고를 받은 경우\n    4. 법인이 해산한 경우\n  [전문개정 2010. 12. 30.]","D19-2":"제19조의2(수입물품을 전매ㆍ처분 또는 사용하여 생긴 수익금액의 범위) 법 제30조제1항제5호에서 “해당 수입물품을 수입한 후 전매ㆍ처분 또는 사용하여 생긴 수익금액”이란 해당 수입물품의 전매ㆍ처분대금, 임대료 등을 말한다. 다만, 주식배당금 및 금융서비스의 대가 등 수입물품과 관련이 없는 금액은 제외한다.\n  [본조신설 2020. 10. 7.]","D258-0":"제258조(전자상거래물품의 특별통관 등) ① 법 제254조제1항에서 “대통령령으로 정하는 물품”이란 개인의 자가사용물품을 말한다. <신설 2025. 2. 28.>\n  ② 관세청장은 법 제254조제1항에 따라 다음 각 호의 사항을 관세청장이 정하여 고시하는 바에 따라 생략하거나 간소한 방법으로 적용할 수 있다. <개정 2025. 2. 28.>\n    1. 삭제 <2025. 2. 28.>\n    2. 수출입신고 방법 및 절차\n    3. 관세 등에 대한 납부방법\n    4. 물품검사방법\n    5. 그 밖에 관세청장이 필요하다고 인정하는 사항\n  ③ 법 제254조제2항에 따라 통관에 필요한 사항을 생략하거나 간소한 방법으로 적용받기 위해 등록하려는 자는 다음 각 호의 사항을 포함하여 관세청장이 정하는 등록신청서를 관세청장 또는 세관장에게 제출해야 한다. <신설 2025. 2. 28.>\n    1. 신청인의 성명ㆍ주소 및 상호\n    2. 영업의 종류, 영업장소 및 번호(해당 영업 관련 신고번호나 사업자등록번호 등 관련 법령에 따라 신고나 등록을 한 번호가 있는 경우로 한정한다)\n  ④ 관세청장 또는 세관장은 제3항에 따라 등록신청을 한 자가 다음 각 호의 요건을 모두 갖춘 경우에는 관세청장이 정하는 바에 따라 등록부에 필요한 사항을 적고 등록증을 발급한다. <신설 2025. 2. 28., 2026. 2. 27.>\n    1. 관세 및 국세의 체납이 없을 것\n    2. 법 제283조제1항에 따른 관세범으로 조사받고 있거나 기소되어 있지 않을 것\n    3. 법 제175조제4호, 제5호 및 제7호의 어느 하나에 해당하지 않을 것\n  ⑤ 법 제254조제3항에서 “대통령령으로 정하는 정보”란 다음 각 호의 정보를 말한다. <개정 2025. 2. 28.>\n    1. 주문번호 및 구매 일자\n    2. 물품수신인의 성명 및 통관고유부호\n    3. 물품의 품명 및 수량\n    4. 물품의 결제금액\n    5. 그 밖에 관세청장이 전자상거래물품의 통관을 위하여 수입신고 전에 제공받을 필요가 있다고 인정하여 고시하는 정보\n  ⑥ 법 제254조제3항에 따라 요청받은 정보의 제공은 관세청장이 정하는 전자적 매체를 통해 제공하는 방법으로 한다. <개정 2025. 2. 28.>\n  ⑦ 제6항에 따라 정보를 제공하는 경우 그 제공 기간은 주문 또는 배송의 결제가 완료되는 시점부터 수입 전까지로 한다. <개정 2025. 2. 28.>\n  ⑧ 법 제254조제5항에서 “대통령령으로 정하는 사항”이란 다음 각 호의 사항을 말한다. <개정 2025. 2. 28.>\n    1. 물품의 품명\n    2. 납부세액\n    3. 선하증권 또는 화물운송장 번호\n    4. 그 밖에 관세청장이 전자상거래물품의 화주에게 안내할 필요가 있다고 인정하여 고시하는 정보\n  ⑨ 법 제254조제7항에 따라 등록의 유효기간을 갱신하려는 자는 관세청장이 정하는 등록갱신신청서를 유효기간 만료일부터 역산하여 1개월 이내에 관세청장 또는 세관장에게 제출해야 한다. <신설 2025. 2. 28.>\n  [전문개정 2023. 2. 28.]","D192-5":"제192조의5(보세판매장의 특허절차) ① 관세청장은 기존 특허의 기간 만료, 취소 및 반납 등으로 인하여 법 제176조의2에 따른 보세판매장의 설치ㆍ운영에 관한 특허를 부여할 필요가 있는 경우에는 다음 각 호의 사항을 관세청의 인터넷 홈페이지 등에 공고하여야 한다. <개정 2017. 11. 28.>\n    1. 특허의 신청 기간과 장소 등 특허의 신청절차에 관한 사항\n    2. 특허의 신청자격\n    3. 특허장소와 특허기간\n    4. 제192조의3제2항에 따라 관세청장이 정하는 평가기준(세부평가항목과 배점을 포함한다)\n    5. 그 밖에 보세판매장의 설치ㆍ운영에 관한 특허의 신청에 필요한 사항\n  ② 법 제176조의2에 따른 보세판매장의 설치ㆍ운영에 관한 특허를 받으려는 자(이하 “보세판매장 특허 신청자”라 한다)는 제1항에 따라 공고된 신청 기간에 제188조제1항에 따라 신청서를 세관장에게 제출하여야 한다. <개정 2017. 11. 28.>\n  ③ 제2항에 따른 신청서를 제출받은 세관장은 다음 각 호의 서류 또는 자료를 관세청장을 거쳐 법 제176조의3에 따른 보세판매장 특허심사위원회(이하 “특허심사위원회”라 한다)에 제출하여야 한다. <개정 2017. 11. 28.>\n    1. 제2항에 따른 신청서\n    2. 보세판매장 특허 신청자가 제192조의3제1항에 따른 요건을 갖추었는지에 대한 세관장의 검토의견\n    3. 제192조의3제2항제1호 및 제2호에 관하여 관세청장이 정하는 자료\n  ④ 특허심사위원회는 제3항에 따라 제출받은 서류 또는 자료의 적정성을 검토한 후 제192조의3제2항에 따른 평가기준에 따라 보세판매장 특허 신청자를 평가하고 보세판매장 특허 여부를 심의하며, 그 결과를 관세청장 및 해당 세관장에게 통보하여야 한다. <신설 2017. 11. 28.>\n  ⑤ 제4항에 따라 결과를 통보받은 세관장은 선정된 보세판매장 특허 신청자에게 특허를 부여하고, 관세청장이 정하여 고시하는 바에 따라 모든 보세판매장 특허 신청자에게 해당 신청자의 평가 결과와 보세판매장 특허를 부여받을 자로 선정되었는지 여부 등을 통보하여야 한다. <신설 2017. 11. 28.>\n  ⑥ 관세청장은 제4항에 따른 특허심사위원회의 심의가 완료된 후 다음 각 호의 사항을 관세청장이 정하는 바에 따라 관세청의 인터넷 홈페이지 등을 통하여 공개하여야 한다. 다만, 보세판매장 특허를 부여받을 자로 선정되지 아니한 보세판매장 특허 신청자의 평가 결과는 해당 신청자가 동의한 경우에만 공개할 수 있다. <신설 2017. 11. 28.>\n    1. 보세판매장 특허 신청자에 대한 평가 결과\n    2. 심의에 참여한 특허심사위원회 위원의 명단\n  ⑦ 관세청장은 보세판매장 특허 관련 업무를 수행하는 과정의 투명성 및 공정성을 높이기 위하여 특허심사위원회의 회의 및 그 심의에 참여하는 위원 선정 등의 과정을 참관하여 관련 비위사실 등을 적발하고 그에 따른 시정 또는 감사 요구 등을 할 수 있는 청렴 옴부즈만 제도를 운영할 수 있다. 이 경우 관세청장은 특허심사위원회의 심의에 참여한 위원의 명단이 제6항에 따라 공개되기 전까지 유출되지 아니하도록 적절한 조치를 하여야 한다. <신설 2017. 11. 28.>\n  ⑧ 제1항부터 제7항까지에서 규정한 사항 외에 보세판매장의 설치ㆍ운영에 관한 특허의 구체적인 절차는 관세청장이 정하여 고시한다. <개정 2017. 11. 28.>\n  [본조신설 2013. 11. 5.]","D231-0":"제231조(보세운송업자 등의 등록) ① 삭제 <2025. 2. 28.>\n  ②법 제222조제1항에 따라 등록을 하고자 하는 자는 관세청장이 정하는 바에 따라 다음 각 호의 사항을 적은 신청서 및 첨부서류를 세관장에게 제출하여야 한다. <개정 2018. 2. 13., 2021. 2. 17., 2025. 2. 28.>\n    1. 신청인의 주소ㆍ성명 및 상호\n    2. 영업의 종류 및 영업장소\n    3. 운송수단의 종류ㆍ명칭 및 번호(관련 법령에 따라 등록 등을 한 번호를 말한다)\n  ③세관장은 제2항에 따라 등록신청을 한 자가 법 제223조에 따른 등록요건을 갖추고 다음 각 호에 해당하는 경우에는 해당 등록부에 필요한 사항을 기재하고 등록증을 교부한다. <개정 2021. 2. 17.>\n    1. 보세운송, 하역물품의 제공, 국제운송 등에 필요하다고 관세청장이 정하는 운송수단 또는 설비를 갖추고 있는 경우\n    2. 관세청장이 정하는 일정금액 이상의 자본금 또는 예금을 보유한 경우\n    3. 법 및 법에 의한 세관장의 명령에 위반하여 관세범으로 조사받고 있거나 기소중에 있지 아니한 경우\n  ④ 법 제222조제5항 본문에 따라 등록의 유효기간을 갱신하려는 자는 등록갱신신청서를 기간만료 1개월 전까지 관할지세관장에게 제출하여야 한다. <개정 2014. 3. 5., 2016. 2. 5., 2021. 2. 17.>\n  ⑤ 세관장은 제2항에 따라 등록을 한 자에게 등록의 유효기간을 갱신하려면 등록의 유효기간이 끝나는 날의 1개월 전까지 등록 갱신을 신청해야 한다는 사실과 갱신절차를 등록의 유효기간이 끝나는 날의 2개월 전까지 휴대폰에 의한 문자전송, 전자메일, 팩스, 전화, 문서 등으로 미리 알려야 한다. <신설 2012. 2. 2., 2021. 2. 17.>\n  ⑥제2항에 따라 등록을 한 자는 등록사항에 변동이 생긴 때에는 지체 없이 등록지를 관할하는 세관장에게 신고해야 한다. <개정 2012. 2. 2., 2021. 2. 17.>","D251-3":"제251조의3(수출입물품안전관리기관협의회의 구성 및 운영 등) ① 법 제246조의3제7항에서 “안전성 검사에 필요한 정보교류, 제264조의10에 따른 불법ㆍ불량ㆍ유해물품에 대한 정보 등의 제공 요청 등 대통령령으로 정하는 사항”이란 다음 각 호의 사항을 말한다. <개정 2018. 2. 13., 2021. 2. 17.>\n    1. 법 제246조의3제1항에 따른 안전성 검사(이하 “안전성 검사”라 한다)에 필요한 정보교류\n    2. 법 제264조의10에 따른 불법ㆍ불량ㆍ유해물품에 대한 정보 등의 제공에 관한 사항\n    3. 안전성 검사 대상 물품의 선정에 관한 사항\n    4. 그 밖에 관세청장이 안전성 검사, 불법ㆍ불량ㆍ유해물품에 대한 정보 등의 제공과 관련하여 협의가 필요하다고 인정하는 사항\n  ② 법 제246조의3제7항에 따른 수출입물품안전관리기관협의회(이하 이 조에서 “협의회”라 한다)는 위원장 1명을 포함하여 25명 이내의 위원으로 구성한다. <개정 2018. 2. 13.>\n  ③ 협의회의 위원장은 관세청 소속 고위공무원단에 속하는 공무원 중에서 관세청장이 지명하는 사람으로 하고, 위원은 다음 각 호의 사람으로 한다.\n    1. 관세청의 4급 이상 공무원 중에서 관세청장이 지명하는 사람 1명\n    2. 관계 중앙행정기관의 4급 이상 공무원 중에서 해당 기관의 장이 지명하는 사람 각 1명\n  ④ 제2항에 따라 협의회의 위원을 지명한 자는 해당 위원이 다음 각 호의 어느 하나에 해당하는 경우에는 그 지명을 철회할 수 있다.\n    1. 심신장애로 인하여 직무를 수행할 수 없게 된 경우\n    2. 직무와 관련된 비위사실이 있는 경우\n    3. 직무태만, 품위손상이나 그 밖의 사유로 인하여 위원으로 적합하지 아니하다고 인정되는 경우\n    4. 위원 스스로 직무를 수행하는 것이 곤란하다고 의사를 밝히는 경우\n  ⑤ 협의회의 회의는 위원의 과반수 출석으로 개의하고, 출석위원 3분의 2 이상의 찬성으로 의결한다.\n  ⑥ 제1항부터 제5항까지에서 규정한 사항 외에 협의회의 운영에 필요한 사항은 협의회의 의결을 거쳐 위원장이 정한다.\n  [본조신설 2016. 2. 5.]","L255-5":"제255조의5(수출입안전관리우수업체의 공인 취소 등) ① 관세청장은 수출입안전관리우수업체가 다음 각 호의 어느 하나에 해당하는 경우에는 공인을 취소할 수 있다. 다만, 제1호에 해당하는 경우에는 공인을 취소하여야 한다. <개정 2026. 8. 11.>\n    1. 거짓이나 그 밖의 부정한 방법으로 공인을 받거나 공인을 갱신받은 경우\n    2. 수출입안전관리우수업체가 양도, 양수, 분할 또는 합병 등으로 공인 당시의 업체와 동일하지 아니하다고 관세청장이 판단하는 경우\n    3. 제255조의2제1항에 따른 안전관리 기준을 충족하지 못하는 경우\n    4. 제255조의3제3항에 따른 정지 처분을 공인의 유효기간 동안 5회 이상 받은 경우\n    5. 제255조의3제4항에 따른 시정명령을 정당한 사유 없이 이행하지 아니한 경우\n    6. 그 밖에 수출입 관련 법령을 위반한 경우로서 대통령령으로 정하는 경우\n  ② 제1항제1호 및 제6호(수출입 관련 법령에 따라 벌금형 이상의 형을 선고받거나 통고처분을 받은 경우만 해당한다)에 따라 공인이 취소된 자는 공인이 취소된 날부터 2년 이내에는 다시 공인받을 수 없다.<신설 2026. 8. 11.>\n  [본조신설 2021. 12. 21.]\n  [제목개정 2026. 8. 11.]","D259-5":"제259조의5(수출입안전관리우수업체에 대한 사후관리 등) ① 수출입안전관리우수업체는 법 제255조의4제2항에 따라 안전관리기준의 충족 여부를 평가ㆍ보고하는 관리책임자를 지정해야 한다.\n  ② 수출입안전관리우수업체는 법 제255조의4제2항에 따라 안전관리기준의 충족 여부를 매년 자율적으로 평가하여 그 결과를 해당 업체가 수출입안전관리우수업체로 공인된 날이 속하는 달의 다음 달 15일까지 관세청장에게 보고해야 한다. 다만, 제259조의3제2항에 따라 공인의 갱신을 신청한 경우로서 공인의 유효기간이 끝나는 날이 속한 연도에 실시해야 하는 경우의 평가는 생략할 수 있다.\n  ③ 법 제255조의5제6호에서 “대통령령으로 정하는 경우”란 수출입안전관리우수업체(대표자 및 제1항에 따라 지정된 관리책임자를 포함한다)가 다음 각 호의 어느 하나에 해당하는 경우를 말한다. 다만, 법 제279조 또는 제3호ㆍ제4호에서 정한 법률의 양벌규정에 따라 처벌받은 경우는 제외한다. <개정 2023. 2. 28.>\n    1. 법 제268조의2, 제269조, 제270조, 제270조의2, 제271조, 제274조 및 제275조의2부터 제275조의4까지의 규정에 따라 벌금형 이상의 형을 선고받거나 통고처분을 받은 경우\n    2. 법 제276조에 따라 벌금형의 선고를 받은 경우\n    3. 「자유무역협정의 이행을 위한 관세법의 특례에 관한 법률」, 「대외무역법」, 「외국환거래법」, 「수출용 원재료에 대한 관세 등 환급에 관한 특례법」 등 수출입과 관련된 법령을 위반하여 벌금형 이상의 형을 선고받은 경우\n    4. 「관세사법」 제29조에 따라 벌금형 이상의 형을 선고받거나 통고처분[같은 조 제4항 및 같은 법 제32조(같은 법 제29조제4항과 관련된 부분으로 한정한다)에 따라 적용되는 이 법 제311조에 따른 통고처분은 제외한다]을 받은 경우\n  [본조신설 2022. 2. 15.]","D60-0":"제60조(덤핑 및 실질적 피해등의 조사개시) ①무역위원회는 제59조제1항에 따른 조사신청을 받은 경우 덤핑사실과 실질적인 피해 등의 사실에 관한 조사의 개시여부를 결정하여 조사신청을 받은 날부터 2개월 이내에 그 결과와 다음 각 호의 사항을 재정경제부장관에게 통보하여야 한다. <개정 2008. 2. 22., 2008. 2. 29., 2025. 12. 30.>\n    1. 조사대상물품(조사대상물품이 많은 경우에는 재정경제부령이 정하는 바에 따라 선정된 조사대상물품)\n    2. 조사대상기간\n    3. 조사대상 공급자(조사대상공급자가 많은 경우에는 재정경제부령이 정하는 바에 따라 선정된 조사대상 공급자)\n  ②무역위원회는 제1항에 따라 조사의 개시 여부를 결정할 때에 조사신청이 다음 각 호의 어느 하나에 해당하면 그 조사신청을 기각하여야 한다. <개정 2008. 2. 22., 2008. 2. 29., 2025. 12. 30.>\n    1. 신청서를 제출한 자가 제59조제1항의 규정에 의하여 부과요청을 할 수 있는 자가 아닌 경우\n    2. 덤핑사실과 실질적인 피해 등의 사실에 관한 충분한 증빙자료를 제출하지 아니한 경우\n    3. 덤핑차액 또는 덤핑물품의 수입량이 재정경제부령이 정하는 기준에 미달되거나 실질적 피해등이 경미하다고 인정되는 경우\n    4. 당해 조사신청에 찬성의사를 표시한 국내생산자들의 생산량합계가 재정경제부령이 정하는 기준에 미달된다고 인정되는 경우\n    5. 조사개시전에 국내산업에 미치는 나쁜 영향을 제거하기 위한 조치가 취하여지는 등 조사개시가 필요없게 된 경우\n  ③무역위원회는 제1항에 따른 조사개시결정을 한 때에는 그 결정일부터 10일 이내에 조사개시의 결정에 관한 사항을 조사신청자, 해당 물품의 공급국 정부 및 공급자, 그 밖의 이해관계인에게 통지하고, 관보에 게재해야 한다. 이 경우 해당 물품의 공급국 정부 및 공급자에게는 제59조제6항 각 호의 자료를 함께 제공해야 한다. <개정 2020. 12. 29.>\n  ④ 무역위원회는 제1항제1호에 따른 조사대상물품의 품목분류 등에 대해서는 관세청장과 협의하여 선정할 수 있다. <신설 2013. 2. 15.>","R46-0":"제46조(관세가 감면되는 환경오염방지물품 등) ① 삭제 <2019. 12. 23.>\n  ② 법 제95조제1항제3호에 따라 관세를 감면하는 물품은 별표 2의4와 같다. <개정 2009. 12. 31., 2011. 4. 1.>\n  ③ 삭제 <2011. 4. 1.>\n  ④ 법 제95조제2항에 따른 감면율은 다음 각 호의 구분과 같다. <개정 2005. 12. 30., 2007. 12. 31., 2008. 12. 31., 2009. 12. 31., 2010. 12. 31., 2011. 4. 1., 2011. 12. 30., 2013. 10. 11., 2013. 12. 31., 2014. 10. 1., 2014. 10. 31., 2015. 12. 1., 2016. 12. 30., 2017. 10. 30., 2018. 12. 31., 2019. 12. 23., 2020. 3. 13., 2021. 3. 16., 2021. 12. 31., 2022. 12. 31., 2023. 12. 29., 2024. 12. 31., 2025. 10. 31.>\n    1. 삭제 <2019. 12. 23.>\n    1의2. 삭제 <2010. 3. 30.>\n    2. 법 제95조제1항제3호에 따른 물품: 다음 각 목의 구분에 따른 감면율\n      가. 제59조제3항에 따른 중소제조업체가 수입신고하는 경우: 100분의 30(2026년 12월 31일까지 수입신고하는 경우에는 100분의 50)\n      나. 「조세특례제한법 시행령」 제6조의4제1항에 따른 중견기업으로서 「통계법」 제22조에 따라 국가데이터처장이 고시하는 산업에 관한 표준분류(이하 “한국표준산업분류표”라 한다)상 제조업을 경영하는 업체가 2026년 12월 31일까지 수입신고하는 경우: 100분의 30\n    3. 삭제 <2011. 4. 1.>\n    4. 삭제 <2011. 4. 1.>","L174-0":"제174조(특허보세구역의 설치ㆍ운영에 관한 특허) ① 특허보세구역을 설치ㆍ운영하려는 자는 세관장의 특허를 받아야 한다. 기존의 특허를 갱신하려는 경우에도 또한 같다.\n  ② 특허보세구역의 설치ㆍ운영에 관한 특허를 받으려는 자, 특허보세구역을 설치ㆍ운영하는 자, 이미 받은 특허를 갱신하려는 자는 재정경제부령으로 정하는 바에 따라 수수료를 납부하여야 한다.<개정 2025. 10. 1.>\n  ③ 제1항에 따른 특허를 받을 수 있는 요건은 보세구역의 종류별로 대통령령으로 정하는 기준에 따라 관세청장이 정한다.\n  [전문개정 2010. 12. 30.]","D132-0":"제132조(감면 등의 조건이행의 확인) ①세관장은 용도세율의 적용, 관세의 감면 또는 분할납부의 승인을 받은 물품에 대하여 관세청장이 정하는 바에 따라 당해 조건의 이행을 확인하기 위하여 필요한 조치를 할 수 있다. <개정 2003. 8. 21.>\n  ②법 제108조제2항에 규정하는 서류는 관세청장이 정하는 바에 따라 통관세관장 또는 관할지세관장에게 제출하여야 한다.","D185-0":"제185조(보세사의 직무 등) ①보세사의 직무는 다음 각 호와 같다. <개정 2012. 2. 2., 2016. 2. 5., 2018. 2. 13., 2020. 12. 29., 2021. 2. 17.>\n    1. 보세화물 및 내국물품의 반입 또는 반출에 대한 참관 및 확인\n    2. 보세구역안에 장치된 물품의 관리 및 취급에 대한 참관 및 확인\n    3. 보세구역출입문의 개폐 및 열쇠관리의 감독\n    4. 보세구역의 출입자관리에 대한 감독\n    5. 견본품의 반출 및 회수\n    6. 기타 보세화물의 관리를 위하여 필요한 업무로서 관세청장이 정하는 업무\n  ② 법 제165조제3항에 따라 보세사로 등록하려는 자는 등록신청서를 세관장에게 제출하여야 한다. <개정 2008. 2. 22., 2020. 2. 11.>\n  ③세관장은 제2항의 규정에 의한 신청을 한 자가 법 제165조제1항의 요건을 갖춘 경우에는 보세사등록증을 교부하여야 한다.\n  ④보세사는 관세청장이 정하는 바에 의하여 그 업무수행에 필요한 교육을 받아야 한다.\n  ⑤ 법 제165조제1항에 따른 보세화물의 관리업무에 관한 시험의 과목은 다음 각 호와 같고, 해당 시험의 합격자는 매과목 100점을 만점으로 하여 매과목 40점 이상, 전과목 평균 60점 이상을 득점한 사람으로 결정한다. <신설 2019. 2. 12., 2020. 2. 11.>\n    1. 수출입통관절차\n    2. 보세구역관리\n    3. 화물관리\n    4. 수출입안전관리\n    5. 자율관리 및 관세벌칙\n  ⑥ 법 제165조제2항 각 호 외의 부분 본문에서 “대통령령으로 정하는 과목”이란 다음 각 호의 과목을 말한다. <신설 2020. 2. 11.>\n    1. 수출입통관절차\n    2. 보세구역관리\n  ⑦ 법 제165조제2항을 적용할 때 그 경력산정의 기준일은 해당 시험의 응시원서 접수 마감일로 한다. <신설 2020. 2. 11.>\n  ⑧ 관세청장은 법 제165조제1항에 따른 보세화물의 관리업무에 관한 시험을 실시할 때에는 그 시험의 일시, 장소, 방법 및 그 밖에 필요한 사항을 시험 시행일 90일 전까지 공고하여야 한다. <신설 2012. 5. 1., 2019. 2. 12., 2020. 2. 11.>\n  ⑨ 삭제 <2025. 2. 28.>","D141-3":"제141조의3(과세정보 제공의 요구 방법) ① 법 제116조제3항에 따라 과세정보의 제공을 요구하는 자는 다음 각 호의 사항이 포함된 신청서를 관세청장에게 제출해야 한다.\n    1. 과세정보의 사용 목적\n    2. 요구하는 과세정보의 내용\n    3. 과세정보가 필요한 급부ㆍ지원 등 사업명\n    4. 당사자의 동의\n  ② 제1항에 따른 신청서의 서식, 당사자의 동의 여부 확인 방법 등 과세정보의 제공 요구 및 제공에 필요한 세부 사항은 관세청장이 정하여 고시한다.\n  [본조신설 2023. 2. 28.]\n  [종전 제141조의3은 제141조의6으로 이동 <2023. 2. 28.>]","L91-0":"제91조(종교용품, 자선용품, 장애인용품 등의 면세) 다음 각 호의 어느 하나에 해당하는 물품이 수입될 때에는 그 관세를 면제한다. <개정 2020. 12. 22., 2025. 10. 1., 2025. 12. 23.>\n    1. 교회, 사원 등 종교단체의 의식(儀式)에 사용되는 물품으로서 외국으로부터 기증되는 물품. 다만, 재정경제부령으로 정하는 물품은 제외한다.\n    2. 자선 또는 구호의 목적으로 기증되는 물품 및 재정경제부령으로 정하는 자선시설ㆍ구호시설 또는 사회복지시설에 기증되는 물품으로서 해당 용도로 직접 사용하는 물품. 다만, 재정경제부령으로 정하는 물품은 제외한다.\n    3. 국제적십자사ㆍ외국적십자사 및 재정경제부령으로 정하는 국제기구가 국제평화봉사활동 또는 국제친선활동을 위하여 기증하는 물품\n    4. 시각장애인, 청각장애인, 언어장애인, 지체장애인, 만성신부전증환자, 희귀난치성질환자 등을 위한 용도로 특수하게 제작되거나 제조된 물품 중 재정경제부령으로 정하는 물품\n    4의2. 「약사법」 제91조에 따른 한국희귀ㆍ필수의약품센터가 수입하는 희귀난치성질환 치료용 의약품 중 재정경제부령으로 정하는 의약품\n    5. 「장애인복지법」 제58조에 따른 장애인복지시설 및 장애인의 재활의료를 목적으로 국가ㆍ지방자치단체 또는 사회복지법인이 운영하는 재활 병원ㆍ의원에서 장애인을 진단하고 치료하기 위하여 사용하는 의료용구\n  [전문개정 2010. 12. 30.]","R33-2":"제33조의2(품목분류 사전심사 및 재심사의 반려사유) 영 제106조제3항제5호의 “재정경제부령으로 정하는 경우”는 다음 각 호와 같다. <개정 2026. 1. 2., 2026. 3. 20.>\n    1. 법 제86조제6항에 따른 물리적ㆍ화학적 분석이 필요한 경우로서 신청인이 해당 물품의 견본을 제출하지 않거나 물품의 특성상 그 구성재료의 물리적ㆍ화학적 분석을 하기 곤란한 경우\n    2. 법 제86조제6항에 따른 수수료를 납부하지 않은 경우\n    3. 농산물 혼합물로서 제조공정이 규격화되어 있지 않아 성분ㆍ조성의 일관성 확보가 곤란한 경우\n    4. 냉장ㆍ냉동 물품과 같이 운송수단 및 저장방법 등에 따라 상태가 달라질 수 있는 경우\n    5. 신청인이 동일한 물품에 대해 사전심사 또는 재심사를 반복하여 신청한 경우\n    6. 그 밖에 제1호부터 제5호까지에 준하는 사유로 사전심사 또는 재심사가 곤란하다고 관세청장이 정하여 고시하는 경우\n  [본조신설 2020. 3. 13.]","R62-2":"제62조의2(적재화물목록을 제출할 수 있는 화물운송주선업자) 영 제157조의2제3호에서 “재정경제부령으로 정하는 화물운송 주선 실적이 있는 자”란 화물운송 주선 실적(선하증권 또는 항공화물운송장을 기준으로 한다)이 직전 연도 총 60만 건 이상인 자를 말한다. <개정 2026. 1. 2.>\n  [본조신설 2016. 3. 9.]\n  [제목개정 2021. 3. 16.]\n  [종전 제62조의2는 제62조의3으로 이동 <2016. 3. 9.>]","L42-0":"제42조(가산세) ① 세관장은 납세의무자가 제9조에 따른 납부기한(이하 이 조에서 “법정납부기한”이라 한다)까지 납부하지 아니한 관세액(이하 이 조에서 “미납부세액”이라 한다)을 징수하거나 제38조의3제1항 또는 제6항에 따라 부족한 관세액(이하 이 조에서 “부족세액”이라 한다)을 징수할 때에는 다음 각 호의 금액을 합한 금액을 가산세로 징수한\n      다. <개정 2011. 12. 31., 2014. 12. 23., 2016. 12. 20., 2019. 12. 31., 2020. 12. 22., 2024. 12. 31., 2025. 3. 14.>\n    1. 부족세액의 100분의 10\n    2. 다음 각 목의 금액을 합한 금액\n      가. 미납부세액 또는 부족세액 × 법정납부기한의 다음 날부터 납부일까지의 기간(납부고지일부터 납부고지서에 따른 납부기한까지의 기간은 제외한다) × 금융회사 등이 연체대출금에 대하여 적용하는 이자율 등을 고려하여 대통령령으로 정하는 이자율\n      나. 법정납부기한까지 납부하여야 할 세액 중 납부고지서에 따른 납부기한까지 납부하지 아니한 세액 × 100분의 3(관세를 납부고지서에 따른 납부기한까지 완납하지 아니한 경우에 한정한다)\n  ② 제1항에도 불구하고 납세자가 부정한 행위(납세자가 관세의 과세표준 또는 세액계산의 기초가 되는 사실의 전부 또는 일부를 은폐하거나 가장하는 것에 기초하여 관세의 과세표준 또는 세액의 신고의무를 위반하는 것으로서 대통령령으로 정하는 행위를 말한다)로 과소신고한 경우에는 세관장은 부족세액의 100분의 60에 상당하는 금액과 제1항제2호의 금액을 합한 금액을 가산세로 징수한다.<개정 2019. 12. 31., 2022. 12. 31., 2024. 12. 31.>\n  ③ 세관장은 제16조제11호에 따른 물품에 대하여 관세를 부과ㆍ징수할 때에는 다음 각 호의 금액을 합한 금액을 가산세로 징수한다. 다만, 제241조제5항에 따라 가산세를 징수하는 경우와 천재지변 등 수입신고를 하지 아니하고 수입한 데에 정당한 사유가 있는 것으로 세관장이 인정하는 경우는 제외한다.<신설 2015. 12. 15., 2019. 12. 31., 2020. 12. 22., 2024. 12. 31.>\n    1. 해당 관세액의 100분의 20(제269조의 죄에 해당하여 처벌받거나 통고처분을 받은 경우에는 100분의 60)\n    2. 다음 각 목의 금액을 합한 금액\n      가. 해당 관세액 × 수입된 날부터 납부일까지의 기간(납부고지일부터 납부고지서에 따른 납부기한까지의 기간은 제외한다) × 금융회사 등이 연체대출금에 대하여 적용하는 이자율 등을 고려하여 대통령령으로 정하는 이자율\n      나. 해당 관세액 중 납부고지서에 따른 납부기한까지 납부하지 아니한 세액 × 100분의 3(관세를 납부고지서에 따른 납부기한까지 완납하지 아니한 경우에 한정한다)\n  ④ 제1항부터 제3항까지의 규정을 적용할 때 납부고지서에 따른 납부기한의 다음 날부터 납부일까지의 기간이 5년을 초과하는 경우에는 그 기간은 5년으로 한다.<신설 2019. 12. 31., 2020. 12. 22.>\n  ⑤ 체납된 관세(세관장이 징수하는 내국세가 있을 때에는 그 금액을 포함한다)가 150만원 미만인 경우에는 제1항제2호가목 및 제3항제2호가목의 가산세를 적용하지 아니한다.<신설 2019. 12. 31., 2021. 12. 21.>\n  ⑥ 제1항제2호 및 제3항제2호에 따른 가산세(이하 “납부지연가산세”라 한다) 중 납부고지서에 따른 납부기한 후의 납부지연가산세를 징수하는 경우에는 납부고지서를 발급하지 아니할 수 있다.<신설 2019. 12. 31., 2020. 12. 22.>\n  ⑦ 납부지연가산세(납부고지서에 따른 납부기한 후의 납부지연가산세에 한정한다)의 납세의무의 성립 및 확정에 관하여는 「국세기본법」 제21조제2항제11호나목ㆍ라목 및 제22조제4항제5호를 준용한다. 이 경우 「국세기본법」 제21조제2항제11호나목 중 “제47조의4제1항제1호ㆍ제2호에 따른 납부지연가산세 및 제47조의5제1항제2호에 따른 원천징수 등 납부지연가산세” 및 “법정납부기한”은 각각 “제1항제2호가목 및 제3항제2호가목에 따른 가산세” 및 “납부고지서에 따른 납부기한”으로 보고, 같은 호 라목의 “제47조의4제1항제3호ㆍ제4호에 따른 납부지연가산세 및 제47조의5제1항제4호에 따른 원천징수 등 납부지연가산세” 및 “지정납부기한”은 각각 “제1항제2호나목 및 제3항제2호나목에 따른 가산세” 및 “납부고지서에 따른 납부기한”으로 보며, 같은 법 제22조제4항제5호의 “제47조의4에 따른 납부지연가산세 및 제47조의5에 따른 원천징수 등 납부지연가산세” 및 “지정납부기한”은 각각 “제1항제2호 및 제3항제2호에 따른 가산세” 및 “납부고지서에 따른 납부기한”으로 본다.<신설 2019. 12. 31., 2020. 12. 22., 2025. 12. 23.>\n  [전문개정 2010. 12. 30.]","L188-0":"제188조(제품과세) 외국물품이나 외국물품과 내국물품을 원료로 하거나 재료로 하여 작업을 하는 경우 그로써 생긴 물품은 외국으로부터 우리나라에 도착한 물품으로 본다. 다만, 제241조제1항에 따른 수입신고를 하기 전에 대통령령으로 정하는 바에 따라 세관장으로부터 외국물품과 내국물품의 혼용 비율에 따른 과세 적용 승인을 받은 경우에는 외국물품과 내국물품의 혼용으로 생긴 제품 중 해당 외국물품의 수량 또는 가격에 상응하는 것은 외국으로부터 우리나라에 도착한 물품으로 본다. <개정 2025. 12. 23.>\n  [전문개정 2010. 12. 30.]","R7-0":"제7조(합리적인 기준에 의한 과세가격의 결정) ①영 제29조제1항제1호에서 “법 제31조제1항제1호의 요건을 신축적으로 해석ㆍ적용하는 방법”이라 함은 다음 각호의 방법을 말한다. <개정 2015. 3. 6.>\n    1. 당해 물품의 생산국에서 생산된 것이라는 장소적 요건을 다른 생산국에서 생산된 것으로 확대하여 해석ㆍ적용하는 방법\n    2. 당해 물품의 선적일 또는 선적일 전후라는 시간적 요건을 선적일 전후 90일로 확대하여 해석ㆍ적용하는 방법. 다만, 가격에 영향을 미치는 시장조건이나 상관행(商慣行)이 유사한 경우에는 90일을 초과하는 기간으로 확대하여 해석ㆍ적용할 수 있다.\n  ②영 제29조제1항제2호에서 “수입된 것과 동일한 상태로 판매하여야 한다는 요건을 신축적으로 해석ㆍ적용하는 방법”이라 함은 납세의무자의 요청이 없는 경우에도 법 제33조제3항에 따라 과세가격을 결정하는 방법을 말한다. <개정 2020. 3. 13.>\n  ③영 제29조제1항제4호에서 “제27조제3항 단서를 적용하지 않는 방법”이란 수입신고일부터 180일까지 판매되는 가격을 적용하는 방법을 말한다. <개정 2022. 3. 18.>","L53-0":"제53조(덤핑방지관세를 부과하기 전의 잠정조치) ① 재정경제부장관은 덤핑방지관세의 부과 여부를 결정하기 위하여 조사가 시작된 경우로서 다음 각 호의 어느 하나에 해당하는 경우에는 조사기간 중에 발생하는 피해를 방지하기 위하여 해당 조사가 종결되기 전이라도 대통령령으로 정하는 바에 따라 그 물품과 공급자 또는 공급국 및 기간을 정하여 잠정적으로 추계(推計)된 덤핑차액에 상당하는 금액 이하의 잠정덤핑방지관세를 추가하여 부과하도록 명하거나 담보를 제공하도록 명하는 조치(이하 이 관에서 “잠정조치”라 한다)를 할 수 있다. <개정 2020. 6. 9., 2025. 10. 1.>\n    1. 해당 물품에 대한 덤핑 사실 및 그로 인한 실질적 피해등의 사실이 있다고 추정되는 충분한 증거가 있는 경우\n    2. 제54조에 따른 약속을 위반하거나 약속의 이행에 관한 자료제출 요구 및 제출자료의 검증 허용 요구를 따르지 아니한 경우로서 이용할 수 있는 최선의 정보가 있는 경우\n  ② 다음 각 호의 어느 하나에 해당하는 경우에는 대통령령으로 정하는 바에 따라 납부된 잠정덤핑방지관세를 환급하거나 제공된 담보를 해제하여야 한다.\n    1. 잠정조치를 한 물품에 대한 덤핑방지관세의 부과요청이 철회되어 조사가 종결된 경우\n    2. 잠정조치를 한 물품에 대한 덤핑방지관세의 부과 여부가 결정된 경우\n    3. 제54조에 따른 약속이 수락된 경우\n  ③ 제2항에도 불구하고 다음 각 호의 어느 하나에 해당하는 경우 덤핑방지관세액이 잠정덤핑방지관세액 또는 제공된 담보금액을 초과할 때에는 그 차액을 징수하지 아니하며, 덤핑방지관세액이 잠정덤핑방지관세액 또는 제공된 담보금액에 미달될 때에는 그 차액을 환급하거나 차액에 해당하는 담보를 해제하여야 한다.<개정 2023. 12. 31.>\n    1. 덤핑과 그로 인한 산업피해를 조사한 결과 해당 물품에 대한 덤핑 사실 및 그로 인한 실질적 피해등의 사실이 있는 것으로 판정된 이후에 제54조에 따른 약속이 수락된 경우\n    2. 제55조 단서에 따라 덤핑방지관세를 소급하여 부과하는 경우\n  [전문개정 2010. 12. 30.]","R56-0":"제56조(관세가 감면되는 해외임가공물품) ①법 제101조제1항제1호의 규정에 의하여 관세가 감면되는 물품은 법 별표 관세율표 제85류 및 제90류중 제9006호에 해당하는 것으로 한다. <개정 2002. 5. 10.>\n  ②법 제101조제1항제2호에서 “재정경제부령으로 정하는 기준에 적합한 물품”이란 가공 또는 수리하기 위하여 수출된 물품과 가공 또는 수리 후 수입된 물품의 품목분류표상 10단위의 품목번호가 일치하는 물품을 말한다. 다만, 수율ㆍ성능 등이 저하되어 폐기된 물품을 수출하여 용융과정 등을 거쳐 재생한 후 다시 수입하는 경우와 제품의 제작일련번호 또는 제품의 특성으로 보아 수입물품이 우리나라에서 수출된 물품임을 세관장이 확인할 수 있는 물품인 경우에는 품목분류표상 10단위의 품목번호가 일치하지 아니하더라도 법 제101조제1항제2호에 따라 관세를 경감할 수 있다. <개정 2008. 12. 31., 2009. 3. 26., 2011. 4. 1., 2016. 3. 9., 2026. 1. 2.>","D144-3":"제144조의3(납세자보호위원회의 위원) ① 법 제118조의4제1항에 따른 납세자보호위원회(이하 이 조 및 제144조의4에서 “위원회”라 한다)는 같은 조 제5항에 따른 위원장(이하 이 조 및 제144조의4에서 “위원장”이라 한다) 1명을 포함하여 다음 각 호의 구분에 따른 위원으로 구성한다. <신설 2023. 2. 28.>\n    1. 본부세관에 두는 위원회: 160명 이내의 위원\n    2. 관세청에 두는 위원회: 45명 이내의 위원\n  ② 위원회의 위원은 다음 각 호의 구분에 따른 사람이 된다. <개정 2023. 2. 28., 2025. 12. 30.>\n    1. 본부세관에 두는 위원회: 다음 각 목의 사람\n      가. 납세자보호담당관 1명\n      나. 해당 본부세관의 5급 이상의 공무원 중 본부세관장이 임명하는 7명 이내의 사람\n      다. 관세청장이 정하는 일선세관(본부세관 외의 세관을 말한다. 이하 같다)의 5급 이상의 공무원 중 본부세관장이 임명하는 40명 이내의 사람(일선세관별 임명 위원은 5명 이내로 한다)\n      라. 관세ㆍ법률ㆍ재정 분야에 관한 전문적인 학식과 경험이 풍부한 사람으로서 본부세관장이 성별을 고려하여 위촉하는 32명 이내의 사람\n      마. 관세ㆍ법률ㆍ재정 분야에 관한 전문적인 학식과 경험이 풍부한 사람으로서 일선세관장이 성별을 고려하여 추천한 사람 중에서 본부세관장이 위촉하는 80명 이내의 사람(일선세관별 위촉 위원은 10명 이내로 한다)\n    2. 관세청에 두는 위원회: 다음 각 목의 사람\n      가. 납세자보호관 1명\n      나. 관세청의 3급 또는 고위공무원단에 속하는 공무원 중에서 관세청장이 임명하는 9명 이내의 사람\n      다. 관세ㆍ법률ㆍ재정 분야의 전문가 중에서 관세청장이 성별을 고려하여 위촉하는 22명 이내의 사람(재정경제부장관이 추천하여 위촉하는 7명 이내의 사람을 포함한다)\n      라. 「관세사법」 제21조에 따른 관세사회의 장이 추천하는 5년 이상 경력을 가진 관세사 중에서 관세청장이 위촉하는 사람 3명\n      마. 「세무사법」 제18조에 따른 한국세무사회의 장이 추천하는 5년 이상 경력을 가진 세무사 또는 「공인회계사법」 제41조에 따른 한국공인회계사회의 장이 추천하는 5년 이상의 경력을 가진 공인회계사 중에서 관세청장이 위촉하는 사람 3명\n      바. 「변호사법」에 따른 대한변호사협회의 장이 추천하는 5년 이상 경력을 가진 변호사 중에서 관세청장이 위촉하는 사람 3명\n      사. 「비영리민간단체 지원법」 제2조에 따른 비영리민간단체가 추천하는 5년 이상의 경력을 가진 관세ㆍ법률ㆍ재정 분야의 전문가 중에서 관세청장이 위촉하는 사람 4명\n  ③ 위원장은 위원회를 대표하고 위원회의 업무를 총괄한다. <개정 2023. 2. 28.>\n  ④ 위원장이 부득이한 사유로 직무를 수행할 수 없을 때에는 관세청장(본부세관에 두는 위원회의 경우에는 해당 세관장을 말한다)이 위촉하는 위원(이하 이 조 및 제144조의4에서 “민간위원”이라 한다) 중 위원장이 미리 지명한 위원이 그 직무를 대행한다. <개정 2023. 2. 28.>\n  ⑤ 위원장과 민간위원의 임기는 2년으로 하며, 한 차례만 연임할 수 있다. <개정 2023. 2. 28.>\n  ⑥ 다음 각 호의 어느 하나에 해당하는 사람은 민간위원이 될 수 없다. <개정 2020. 6. 2., 2023. 2. 28., 2025. 2. 28.>\n    1. 최근 3년 이내에 세관 또는 관세청에서 공무원으로 근무한 사람\n    2. 「공직자윤리법」 제17조에 따른 취업심사대상기관에 소속되어 있거나 취업심사대상기관에서 퇴직한 지 3년이 지나지 않은 사람\n    3. 「관세사법」 제27조, 「세무사법」 제17조, 「공인회계사법」 제48조 또는 「변호사법」 제90조에 따른 징계처분(견책은 제외한다)을 받은 날부터 5년이 지나지 않은 사람\n    4. 그 밖에 공정한 직무수행에 지장이 있다고 인정되는 사람으로서 관세청장이 정하는 사람\n  ⑦ 관세청장(본부세관에 두는 위원회의 경우에는 해당 세관장을 말한다)은 위원장과 위원(납세자보호담당관 및 납세자보호관인 위원은 제외한다)이 다음 각 호의 어느 하나에 해당하는 경우에는 해당 위원을 해임하거나 해촉할 수 있다. <개정 2023. 2. 28.>\n    1. 심신장애로 인하여 직무를 수행할 수 없게 된 경우\n    2. 직무와 관련된 비위사실이 있는 경우\n    3. 직무태만, 품위손상이나 그 밖의 사유로 인하여 위원으로 적합하지 않다고 인정되는 경우\n    4. 위원 스스로 직무를 수행하는 것이 곤란하다고 의사를 밝히는 경우\n    5. 제144조의4제7항 각 호의 어느 하나에 해당함에도 불구하고 회피하지 않은 경우\n  [본조신설 2020. 2. 11.]\n  [제목개정 2023. 2. 28.]","D114-0":"제114조(재수출기간의 연장신청) 법 제97조제1항제1호 단서의 규정에 의하여 수출기간을 연장받고자 하는 자는 당해 물품의 수입신고수리 연월일ㆍ신고번호ㆍ품명ㆍ규격 및 수량, 연장기간과 연장사유를 기재한 신청서를 당해 물품의 수입지세관장에게 제출하여야 한다. 다만, 관세청장이 정한 물품에 대하여는 수입지세관외의 세관에서도 재수출기간의 연장승인을 할 수 있다. <개정 2004. 3. 29.>","D265-3":"제265조의3(비밀유지 의무 위반에 대한 과태료의 부과기준) 법 제277조의3에 따른 과태료의 부과기준은 별표 6과 같다.\n  [본조신설 2023. 2. 28.]","D153-0":"제153조(의견진술) ①법 제130조의 규정에 의하여 의견을 진술하고자 하는 자는 그 주소 또는 거소 및 성명과 진술하고자 하는 요지를 기재한 신청서를 당해 재결청에 제출하여야 한다. <개정 2007. 4. 5.>\n  ②제1항의 규정에 의한 신청을 받은 재결청은 다음 각호의 1에 해당하는 경우로서 심사청구인의 의견진술이 필요없다고 인정되는 때를 제외하고는 출석일시 및 장소와 진술시간을 정하여 관세심사위원회 회의개최예정일 3일전까지 심사청구인에게 통지하여야 한다.\n    1. 심사청구의 대상이 된 사항이 경미한 때\n    2. 심사청구의 대상이 된 사항이 오로지 법령해석에 관한 것인 때\n  ③제1항의 규정에 의한 신청을 받은 재결청은 심사청구인의 의견진술이 필요없다고 인정되는 때에는 이유를 명시한 문서로 그 뜻을 당해 심사청구인에게 통지하여야 한다.\n  ④법 제130조의 규정에 의한 의견진술은 진술하고자 하는 내용을 기재한 문서의 제출로 갈음할 수 있다.\n  제153조의2 삭제 <2012. 2. 2.>","L48-0":"제48조(관세환급가산금) 세관장은 제46조에 따라 관세환급금을 환급하거나 충당할 때에는 대통령령으로 정하는 관세환급가산금 기산일부터 환급결정 또는 충당결정을 하는 날까지의 기간과 대통령령으로 정하는 이율에 따라 계산한 금액을 관세환급금에 더하여야 한다. 다만, 국가 또는 지방자치단체가 직접 수입하는 물품 등 대통령령으로 정하는 물품에 대하여는 그러하지 아니하다. <개정 2013. 1. 1., 2019. 12. 31.>\n  [전문개정 2010. 12. 30.]\n  [제목개정 2013. 1. 1.]","D214-0":"제214조(종합보세구역의 지정 등) ①법 제197조에 따른 종합보세구역(이하 “종합보세구역”이라 한다)은 다음 각 호의 어느 하나에 해당하는 지역으로서 관세청장이 종합보세구역으로 지정할 필요가 있다고 인정하는 지역을 그 지정대상으로 한다. <개정 2003. 6. 30., 2006. 5. 22., 2007. 4. 5., 2011. 4. 1.>\n    1. 「외국인투자촉진법」에 의한 외국인투자지역\n    2. 「산업입지 및 개발에 관한 법률」에 의한 산업단지\n    3. 삭제 <2007. 4. 5.>\n    4. 「유통산업발전법」에 의한 공동집배송센터\n    5. 「물류시설의 개발 및 운영에 관한 법률」에 따른 물류단지\n    6. 기타 종합보세구역으로 지정됨으로써 외국인투자촉진ㆍ수출증대 또는 물류촉진 등의 효과가 있을 것으로 예상되는 지역\n  ②법 제197조제1항의 규정에 의하여 종합보세구역의 지정을 요청하고자 하는 자(이하 “지정요청자”라고 한다)는 다음 각호의 사항을 기재한 지정요청서에 당해 지역의 도면을 첨부하여 관세청장에게 제출하여야 한다. <개정 2004. 3. 29.>\n    1. 당해 지역의 소재지 및 면적\n    2. 구역안의 시설물현황 또는 시설계획\n    3. 사업계획\n  ③관세청장은 직권으로 종합보세구역을 지정하고자 하는 때에는 관계중앙행정기관의 장 또는 지방자치단체의 장과 협의하여야 한다.","R33-0":"제33조(품목분류 사전심사 및 재심사 신청물품에 대한 분석수수료) 법 제86조제6항에 따른 분석수수료는 분석이 필요한 물품에 대한 품목분류 사전심사 및 재심사 신청품목당 3만원으로 한다. <개정 2015. 3. 6.>\n  [제목개정 2015. 3. 6.]","L212-0":"제212조(국고귀속) ① 세관장은 제210조에 따른 방법으로도 매각되지 아니한 물품(제208조제1항제6호의 물품은 제외한다)에 대하여는 그 물품의 화주등에게 장치 장소로부터 지체 없이 반출할 것을 통고하여야 한다. <개정 2022. 12. 31.>\n  ② 제1항의 통고일부터 1개월 내에 해당 물품이 반출되지 아니하는 경우에는 소유권을 포기한 것으로 보고 이를 국고에 귀속시킬 수 있다.\n  ③ 세관장은 제208조제1항제6호의 물품이 제210조에 따른 방법으로 매각되지 아니한 경우에는 납세의무자에게 1개월 이내에 대통령령으로 정하는 유찰물품의 가격에 상당한 금액을 관세 및 체납액(관세ㆍ국세ㆍ지방세의 체납액을 말한다. 이하 이 조에서 같다) 충당금으로 납부하도록 통지하여야 한다.<신설 2022. 12. 31.>\n  ④ 제3항에 따른 통지를 받은 납세의무자가 그 기한 내에 관세 및 체납액 충당금을 납부하지 아니한 경우에는 같은 항에 따른 유찰물품의 소유권을 포기한 것으로 보고 이를 국고에 귀속시킬 수 있다.<신설 2022. 12. 31.>\n  [전문개정 2010. 12. 30.]","D31-5":"제31조의5(특수관계자 수입물품 과세자료 제출범위 등) ①법 제37조의4제1항에 따라 세관장이 해당 특수관계자에게 요구할 수 있는 자료는 다음 각 호와 같다. 이 경우 세관장은 요구사유 및 자료제출에 필요한 기간을 적은 문서로 자료를 요구해야 한다. <개정 2015. 2. 6., 2018. 2. 13., 2019. 2. 12., 2021. 2. 17.>\n    1. 특수관계자 간 상호출자현황\n    2. 삭제 <2019. 2. 12.>\n    3. 수입물품 가격산출 내역 등 내부가격 결정자료와 국제거래가격 정책자료\n    4. 수입물품 구매계약서 및 원가분담계약서\n    5. 권리사용료, 기술도입료 및 수수료 등에 관한 계약서\n    6. 광고 및 판매촉진 등 영업ㆍ경영지원에 관한 계약서\n    7. 삭제 <2019. 2. 12.>\n    8. 해당 거래와 관련된 회계처리기준 및 방법\n    9. 해외 특수관계자의 감사보고서 및 연간보고서\n    10. 해외 대금 지급ㆍ영수 내역 및 증빙자료\n    11. 「국제조세조정에 관한 법률 시행령」 제33조에 따른 통합기업보고서 및 개별기업보고서\n    12. 그 밖에 수입물품에 대한 과세가격 심사를 위하여 필요한 자료\n  ② 제1항에 해당하는 자료는 한글로 작성하여 제출하여야 한다. 다만, 세관장이 허용하는 경우에는 영문으로 작성된 자료를 제출할 수 있다.\n  ③ 법 제37조의4제3항 단서에서 “대통령령으로 정하는 부득이한 사유”란 다음 각 호의 어느 하나에 해당하는 경우를 말한다. <개정 2015. 2. 6., 2017. 3. 27.>\n    1. 자료제출을 요구받은 자가 화재ㆍ도난 등의 사유로 자료를 제출할 수 없는 경우\n    2. 자료제출을 요구받은 자가 사업이 중대한 위기에 처하여 자료를 제출하기 매우 곤란한 경우\n    3. 관련 장부ㆍ서류가 권한 있는 기관에 압수되거나 영치된 경우\n    4. 자료의 수집ㆍ작성에 상당한 기간이 걸려 기한까지 자료를 제출할 수 없는 경우\n    5. 제1호부터 제4호까지에 준하는 사유가 있어 기한까지 자료를 제출할 수 없다고 판단되는 경우\n  ④ 법 제37조의4제3항 단서에 따라 제출기한의 연장을 신청하려는 자는 제출기한이 끝나기 15일 전까지 관세청장이 정하는 자료제출기한연장신청서를 세관장에게 제출하여야 한다. <개정 2015. 2. 6., 2017. 3. 27.>\n  ⑤ 세관장은 제4항의 자료제출기한 연장신청이 접수된 날부터 7일 이내에 연장 여부를 신청인에게 통지하여야 한다. 이 경우 7일 이내에 연장 여부를 신청인에게 통지를 하지 아니한 경우에는 연장신청한 기한까지 자료제출기한이 연장된 것으로 본다.\n  ⑥ 세관장은 법 제37조의4제4항 후단에 따라 특수관계에 있는 자와 다음 각 호의 사항에 대하여 협의해야 하며, 10일 이상의 기간 동안 의견을 제시할 기회를 주어야 한다. <신설 2019. 2. 12., 2025. 2. 28.>\n    1. 특수관계에 있는 자가 법 제37조의4제5항에 따라 법 제30조제3항제4호 단서에 해당하는 경우임을 증명하여 같은 조 제1항 및 제2항에 따라 과세가격을 결정해야 하는지 여부\n    2. 법 제30조제1항 및 제2항에 따라 과세가격을 결정할 수 있는지 여부를 판단하기 위해 같은 조 제1항 각 호에 해당하는 금액과 이에 해당하지 않는 금액을 구분하여 계산할 수 있는지 여부 및 구분하여 계산할 수 있는 경우에는 그 계산 방법\n    3. 법 제31조부터 제35조까지의 규정에 따른 방법 중 과세가격을 결정하는 방법\n  [본조신설 2013. 2. 15.]\n  [제31조의3에서 이동 <2015. 2. 6.>]","L118-5":"제118조의5(납세자보호위원회에 대한 납세자의 심의 요청 및 결과 통지 등) ① 납세자는 관세조사 기간이 끝나는 날까지 제118조의2제2항의 세관의 세관장(이하 이 조에서 “세관장”이라 한다)에게 제118조의4제2항제2호 또는 제3호에 해당하는 사항에 대한 심의를 요청할 수 있다.\n  ② 세관장은 제118조의4제2항제1호부터 제4호까지의 사항에 대하여 세관 납세자보호위원회의 심의를 거쳐 결정을 하고, 납세자에게 그 결과를 통지하여야 한다. 이 경우 제118조의4제2항제2호 또는 제3호에 대한 결과는 제1항에 따른 요청을 받은 날부터 20일 이내에 통지하여야 한다.\n  ③ 납세자는 제2항에 따라 통지를 받은 날부터 7일 이내에 제118조의4제2항제1호부터 제3호까지의 사항으로서 세관 납세자보호위원회의 심의를 거친 세관장의 결정에 대하여 관세청장에게 취소 또는 변경을 요청할 수 있다.\n  ④ 제3항에 따른 납세자의 요청을 받은 관세청장은 관세청 납세자보호위원회의 심의를 거쳐 세관장의 결정을 취소하거나 변경할 수 있다. 이 경우 관세청장은 요청받은 날부터 20일 이내에 그 결과를 납세자에게 통지하여야 한다.\n  ⑤ 제118조의2제2항에 따른 납세자보호관 또는 담당관은 납세자가 제1항 또는 제3항에 따른 요청을 하는 경우에는 납세자보호위원회의 심의 전까지 세관공무원에게 관세조사의 일시중지 등을 요구할 수 있다. 다만, 납세자가 관세조사를 기피하려는 것이 명백한 경우 등 대통령령으로 정하는 경우에는 그러하지 아니하다.\n  ⑥ 납세자보호위원회는 제118조의4제2항제2호 또는 제3호에 따른 요청이 있는 경우 그 의결로 관세조사의 일시중지 또는 중지를 세관공무원에게 요구할 수 있다. 이 경우 납세자보호위원회는 정당한 사유 없이 위원회의 요구에 따르지 아니하는 세관공무원에 대하여 관세청장에게 징계를 건의할 수 있다.\n  ⑦ 제1항 및 제3항에 따른 요청을 한 납세자는 대통령령으로 정하는 바에 따라 세관장 또는 관세청장에게 의견을 진술할 수 있다.\n  ⑧ 제1항부터 제7항까지에서 규정한 사항 외에 납세자보호위원회에 대한 납세자의 심의 요청 및 결과 통지 등에 관하여 필요한 사항은 대통령령으로 정한다.\n  [본조신설 2019. 12. 31.]","D39-0":"제39조(가산세) ①법 제42조제1항제2호가목 및 같은 조 제3항제2호가목의 계산식에서 “대통령령으로 정하는 이자율”이란 각각 1일 10만분의 22의 율을 말한다. <개정 2006. 5. 22., 2011. 4. 1., 2015. 2. 6., 2016. 2. 5., 2019. 2. 12., 2020. 2. 11., 2022. 2. 15.>\n  ② 법 제42조의2제1항제6호에서 “국가 또는 지방자치단체가 직접 수입하는 물품 등 대통령령으로 정하는 물품”이란 제32조의4제5항 각 호의 어느 하나에 해당하는 물품을 말한다. <개정 2020. 2. 11.>\n  ③ 법 제42조의2제1항제9호에서 “대통령령으로 정하는 정당한 사유가 있는 경우”란 제32조의4제6항 각 호의 어느 하나에 해당하는 경우를 말한다. <개정 2020. 2. 11., 2026. 2. 27.>\n  ④ 법 제42조제2항에서 “대통령령으로 정하는 행위”란 다음 각 호의 어느 하나에 해당하는 행위를 말한다. <신설 2009. 2. 4., 2012. 2. 2., 2013. 2. 15., 2023. 2. 28.>\n    1. 이중송품장ㆍ이중계약서 등 허위증명 또는 허위문서의 작성이나 수취\n    2. 세액심사에 필요한 자료의 파기\n    3. 관세부과의 근거가 되는 행위나 거래의 조작ㆍ은폐\n    4. 그 밖에 관세를 포탈하거나 환급 또는 감면을 받기 위한 부정한 행위\n  ⑤ 법 제42조의2제2항에 따른 가산세 감면 절차에 관하여는 제32조의4제7항 및 제8항을 준용한다. <개정 2020. 2. 11.>","R48-3":"제48조의3(관세가 면제되는 승무원 휴대 수입 물품) ① 법 제96조제1항제3호에 따라 승무원이 휴대하여 수입하는 물품에 대하여 관세를 면제하는 경우 그 면제 한도는 각 물품의 과세가격 합계 기준으로 다음 각 호의 구분에 따른 금액으로 한다. 이 경우 법 제196조제1항제1호 단서 및 같은 조 제2항에 따라 구매한 내국물품이 포함되어 있는 경우에는 다음 각 호의 금액에서 해당 내국물품의 구매가격을 공제한 금액으로 한다.\n    1. 국제무역기의 승무원이 휴대하여 수입하는 물품: 미화 150달러\n    2. 국제무역선의 승무원이 휴대하여 수입하는 물품: 다음 각 목의 구분에 따른 금액\n      가. 1회 항행기간이 1개월 미만인 경우: 미화 90달러\n      나. 1회 항행기간이 1개월 이상 3개월 미만인 경우: 미화 180달러\n      다. 1회 항행기간이 3개월 이상인 경우: 미화 270달러\n  ② 제1항에도 불구하고 국제무역선ㆍ국제무역기의 승무원이 휴대하여 수입하는 술 또는 담배에 대해서는 제1항 각 호의 구분에 따른 금액과 관계없이 제48조제3항 표에 따라 관세를 면제한다. 이 경우 법 제196조제1항제1호 단서 및 같은 조 제2항에 따라 구매한 내국물품인 술 또는 담배가 포함되어 있는 경우에는 제48조제3항 표에 따른 한도에서 해당 내국물품의 구매수량을 공제한다.\n  ③ 제2항에 따라 국제무역선ㆍ국제무역기의 승무원이 휴대하여 수입하는 술에 대해 관세를 면제하는 경우 다음 각 호의 어느 하나에 해당하는 자에 대해서는 해당 호에 규정된 범위에서 관세를 면제한다.\n    1. 국제무역기의 승무원: 3개월에 1회\n    2. 국제무역선의 승무원으로서 1회 항행기간이 1개월 미만인 경우: 1개월에 1회\n  ④ 제1항에도 불구하고 자동차(이륜자동차와 삼륜자동차를 포함한다)ㆍ선박ㆍ항공기 및 개당 과세가격 50만원 이상의 보석ㆍ진주ㆍ별갑ㆍ산호ㆍ호박 및 상아와 이를 사용한 제품에 대해서는 관세를 면세하지 않는다.\n  [본조신설 2021. 3. 16.]","R47-0":"제47조(환경오염방지물품 등에 대한 관세의 감면신청) ① 법 제95조제1항제1호부터 제3호까지의 규정에 따른 물품을 관세감면대상물품으로 지정받으려는 자는 다음 각 호의 사항을 적은 신청서에 해당 물품의 상품목록 등 참고자료를 첨부하여 주무부장관을 거쳐 재정경제부장관에게 제출하여야 한다. <개정 2008. 12. 31., 2011. 4. 1., 2026. 1. 2.>\n    1. 신청인의 주소ㆍ성명 및 상호\n    2. 사업의 종류\n    3. 관세율표 번호ㆍ품명ㆍ규격ㆍ수량ㆍ가격ㆍ용도 및 구조\n  ②제1항에 따른 신청서의 제출기한(재정경제부장관에게 신청서를 제출하는 기한을 말한다)은 다음 각 호의 구분에 따른다. <개정 2010. 3. 30., 2011. 4. 1., 2014. 10. 31., 2016. 12. 30., 2026. 1. 2.>\n    1. 법 제95조제1항제1호 및 제2호의 물품에 대한 것인 경우: 매년 4월말까지\n    2. 법 제95조제1항제3호의 물품에 대한 것인 경우: 매년 7월 31일까지\n  ③ 삭제 <2011. 4. 1.>\n  ④ 삭제 <2011. 4. 1.>","L92-0":"제92조(정부용품 등의 면세) 다음 각 호의 어느 하나에 해당하는 물품이 수입될 때에는 그 관세를 면제할 수 있다. <개정 2013. 3. 23., 2017. 7. 26., 2021. 12. 21., 2025. 10. 1.>\n    1. 국가기관이나 지방자치단체에 기증된 물품으로서 공용으로 사용하는 물품. 다만, 재정경제부령으로 정하는 물품은 제외한다.\n    2. 정부가 외국으로부터 수입하는 군수품(정부의 위탁을 받아 정부 외의 자가 수입하는 경우를 포함한다). 다만, 재정경제부령으로 정하는 물품은 제외한다.\n    2의2. 국가원수의 경호용으로 사용하기 위하여 수입하는 물품\n    3. 외국에 주둔하는 국군이나 재외공관으로부터 반환된 공용품\n    4. 과학기술정보통신부장관이 국가의 안전보장을 위하여 긴요하다고 인정하여 수입하는 비상통신용 물품 및 전파 관리용 물품\n    5. 정부가 직접 수입하는 간행물, 음반, 녹음된 테이프, 녹화된 슬라이드, 촬영된 필름, 그 밖에 이와 유사한 물품 및 자료\n    6. 국가나 지방자치단체(이들이 설립하였거나 출연 또는 출자한 법인을 포함한다)가 환경오염(소음 및 진동을 포함한다)을 측정하거나 분석하기 위하여 수입하는 기계ㆍ기구 중 재정경제부령으로 정하는 물품\n    7. 상수도 수질을 측정하거나 이를 보전ㆍ향상하기 위하여 국가나 지방자치단체(이들이 설립하였거나 출연 또는 출자한 법인을 포함한다)가 수입하는 물품으로서 재정경제부령으로 정하는 물품\n    8. 국가정보원장 또는 그 위임을 받은 자가 국가의 안전보장 목적의 수행상 긴요하다고 인정하여 수입하는 물품\n  [전문개정 2010. 12. 30.]","D97-0":"제97조(용도세율 적용신청) ① 법 제83조제1항 본문에 따라 용도세율을 적용받으려는 자는 해당 물품을 수입신고하는 때부터 수입신고가 수리되기 전까지 그 품명ㆍ규격ㆍ수량ㆍ가격ㆍ용도ㆍ사용방법 및 사용장소를 기재한 신청서를 세관장에게 제출해야 한다. 다만, 해당 물품을 보세구역에서 반출하지 않은 경우에는 수입신고 수리일부터 15일이 되는 날까지 신청서를 제출할 수 있다. <개정 2022. 2. 15., 2024. 2. 29.>\n  ② 법 제83조제1항 단서에 따라 세관장으로부터 해당 용도로만 사용할 것을 승인받으려는 자는 관세청장이 정하여 고시하는 신청서에 해당 물품의 품명, 규격 및 용도 등을 확인할 수 있는 서류를 첨부하여 세관장에게 신청해야 한다. <신설 2024. 2. 29.>\n  ③ 제2항에서 규정한 사항 외에 법 제83조제1항 단서에 따른 승인에 필요한 사항은 관세청장이 정하여 고시한다. <신설 2024. 2. 29.>","D32-5":"제32조의5(신용카드 등에 의한 관세 등의 납부) ① 법 제38조제7항에 따라 납세의무자가 신고하거나 세관장이 부과 또는 경정하여 고지한 세액(세관장이 관세와 함께 징수하는 내국세등의 세액을 포함한다)은 신용카드, 직불카드 등(이하 이 조에서 “신용카드등”이라 한다)으로 납부할 수 있다. <개정 2010. 3. 26., 2012. 2. 2., 2014. 3. 5., 2015. 2. 6., 2025. 2. 28.>\n  ② 법 제38조제7항에 따라 준용되는 「국세징수법」 제12조제1항제3호 각 목 외의 부분에 따른 국세납부대행기관이란 정보통신망을 이용하여 신용카드등에 의한 결제를 수행하는 기관으로서 재정경제부령으로 정하는 바에 따라 관세납부를 대행하는 기관(이하 이 조에서 “관세납부대행기관”이라 한다)을 말한다. <개정 2021. 2. 17., 2025. 2. 28., 2025. 12. 30.>\n  ③ 관세납부대행기관은 납세자로부터 신용카드등에 의한 관세납부대행용역의 대가로 재정경제부령으로 정하는 바에 따라 납부대행수수료를 받을 수 있다. <개정 2025. 12. 30.>\n  ④ 관세청장은 납부에 사용되는 신용카드등의 종류, 그 밖에 관세납부에 필요한 사항을 정할 수 있다.\n  [본조신설 2009. 2. 4.]\n  [제목개정 2015. 2. 6.]","L185-0":"제185조(보세공장) ① 보세공장에서는 외국물품을 원료 또는 재료로 하거나 외국물품과 내국물품을 원료 또는 재료로 하여 제조ㆍ가공하거나 그 밖에 이와 비슷한 작업을 할 수 있다.\n  ② 보세공장에서는 세관장의 허가를 받지 아니하고는 내국물품만을 원료로 하거나 재료로 하여 제조ㆍ가공하거나 그 밖에 이와 비슷한 작업을 할 수 없다.\n  ③ 세관장은 제2항에 따른 허가의 신청을 받은 날부터 10일 이내에 허가 여부를 신청인에게 통지하여야 한다.<신설 2018. 12. 31.>\n  ④ 세관장이 제3항에서 정한 기간 내에 허가 여부 또는 민원 처리 관련 법령에 따른 처리기간의 연장을 신청인에게 통지하지 아니하면 그 기간(민원 처리 관련 법령에 따라 처리기간이 연장 또는 재연장된 경우에는 해당 처리기간을 말한다)이 끝난 날의 다음 날에 허가를 한 것으로 본다.<신설 2018. 12. 31.>\n  ⑤ 보세공장 중 수입하는 물품을 제조ㆍ가공하는 것을 목적으로 하는 보세공장의 업종은 재정경제부령으로 정하는 바에 따라 제한할 수 있다.<개정 2018. 12. 31., 2025. 10. 1.>\n  ⑥ 세관장은 수입통관 후 보세공장에서 사용하게 될 물품에 대하여는 보세공장에 직접 반입하여 수입신고를 하게 할 수 있다. 이 경우 제241조제3항을 준용한다.<개정 2018. 12. 31.>\n  [전문개정 2010. 12. 30.]","D262-0":"제262조(세관장 등의 통지) ①법 제258조제2항에 해당하는 우편물에 있어서 법 제259조제1항의 규정에 의한 통지는 법 제248조의 규정에 의한 신고의 수리 또는 법 제252조의 규정에 의한 승인을 받은 서류를 당해 신고인이 통관우체국에 제출하는 것으로써 이에 갈음한다.\n  ②제1항의 경우에 법 제259조제2항에 따른 통지는 세관이 발행하는 납부고지서로 갈음한다. <개정 2021. 2. 17.>","R5-0":"제5조(특수관계의 영향을 받지 않은 물품가격) ①영 제23조제2항제3호 각 목 외의 부분에서 “재정경제부령이 정하는 가격”이란 수입가격과 영 제23조제2항제3호 각 목의 가격(이하 “비교가격”이라 한다)과의 차이가 비교가격을 기준으로 하여 비교할 때 100분의 10 이하인 경우를 말한다. 다만, 세관장은 해당 물품의 특성ㆍ거래내용ㆍ거래관행 등으로 보아 그 수입가격이 합리적이라고 인정되는 때에는 비교가격의 100분의 110을 초과하더라도 비교가격에 근접한 것으로 볼 수 있으며, 수입가격이 불합리한 가격이라고 인정되는 때에는 비교가격의 100분의 110 이하인 경우라도 비교가격에 근접한 것으로 보지 아니할 수 있다. <개정 2008. 12. 31., 2009. 3. 26., 2026. 1. 2.>\n  ②비교가격은 비교의 목적으로만 사용되어야 하며, 비교가격을 과세가격으로 결정하여서는 아니된다.\n  ③ 영 제23조제2항제3호 후단에 따른 비교가격 산출의 기준시점은 다음 각 호와 같다. <신설 2020. 10. 7.>\n    1. 특수관계가 없는 우리나라의 구매자에게 수출되는 동종ㆍ동질물품 또는 유사물품의 거래가격: 선적 시점\n    2. 법 제33조에 따라 결정되는 동종ㆍ동질물품 또는 유사물품의 과세가격: 국내판매 시점\n    3. 법 제34조에 따라 결정되는 동종ㆍ동질물품 또는 유사물품의 과세가격: 수입신고 시점\n  [제목개정 2020. 10. 7.]","R65-0":"제65조(보세구역외 장치허가수수료) ①법 제156조제3항의  규정에 의하여 납부하여야 하는 보세구역외 장치허가수수료는 1만8천원으로 한다. 이 경우 동일한 선박 또는 항공기로 수입된 동일한 화주의 화물을 동일한 장소에 반입하는 때에는 1건의 보세구역외 장치허가신청으로 보아 허가수수료를 징수한다.\n  ②국가 또는 지방자치단체가 수입하거나 협정에 의하여 관세가 면제되는 물품을 수입하는 때에는 제1항의 규정에 의한 보세구역외 장치허가수수료를 면제한다.\n  ③제1항의 규정에 의한 보세구역외 장치허가수수료를 납부하여야 하는 자가 관세청장이 정하는 바에 의하여 이를 따로 납부한 때에는 그 사실을 증명하는 증표를 허가신청서에 첨부하여야 한다.\n  ④세관장은 전산처리설비를 이용하여 법 제156조제1항의 규정에 의한 보세구역외 장치허가를 신청하는 때에는 제1항의 규정에 의한 보세구역외 장치허가수수료를 일괄고지하여 납부하게 할 수 있다.","D108-0":"제108조(대사관 등의 관원지정) 법 제88조제1항제4호에서 “대통령령으로 정하는 직원”이란 다음 각 호의 어느 하나에 해당하는 직위 또는 이와 동등 이상이라고 인정되는 직위에 있는 사람을 말한다. <개정 2011. 4. 1.>\n    1. 대사관 또는 공사관의 참사관ㆍ1등서기관ㆍ2등서기관ㆍ3등서기관 및 외교관보\n    2. 총영사관 또는 영사관의 총영사ㆍ영사ㆍ부영사 및 영사관보(명예총영사 및 명예영사를 제외한다)\n    3. 대사관ㆍ공사관ㆍ총영사관 또는 영사관의 외무공무원으로서 제1호 및 제2호에 해당하지 아니하는 사람","D236-2":"제236조의2(원산지 등에 대한 사전확인) ①법 제232조의 규정에 의하여 원산지확인이 필요한 물품을 수입하는 자는 관세청장에게 다음 각호의 1에 해당하는 사항에 대하여 당해 물품의 수입신고를 하기 전에 미리 확인 또는 심사(이하 “사전확인”이라 한다)하여 줄 것을 신청할 수 있다.\n    1. 법 제229조의 규정에 따른 원산지 확인기준의 충족여부\n    2. 조약 또는 협정 등의 체결로 인하여 관련법령에서 특정물품에 대한 원산지 확인기준을 달리 정하고 있는 경우에 당해 법령에 따른 원산지 확인기준의 충족여부\n    3. 제1호 및 제2호의 원산지 확인기준의 충족여부를 결정하기 위한 기초가 되는 사항으로서 관세청장이 정하는 사항\n    4. 그 밖에 관세청장이 원산지에 따른 관세의 적용과 관련하여 필요하다고 정하는 사항\n  ②사전확인의 신청을 받은 경우 관세청장은 60일 이내에 이를 확인하여 그 결과를 기재한 서류(이하 “사전확인서”라 한다)를 신청인에게 교부하여야 한다. 다만, 제출자료의 미비 등으로 인하여 사전확인이 곤란한 경우에는 그 사유를 신청인에게 통지하여야 한다.\n  ③세관장은 수입신고된 물품 및 원산지증명서의 내용이 사전확인서상의 내용과 동일하다고 인정되는 때에는 특별한 사유가 없는 한 사전확인서의 내용에 따라 관세의 경감 등을 적용하여야 한다.\n  ④ 제2항에 따른 사전확인의 결과를 통지받은 자(제236조의3제1항에 따른 사전확인서의 내용변경 통지를 받은 자를 포함한다)는 그 통지내용에 이의를 제기하려는 경우 그 결과를 통지받은 날부터 30일 이내에 다음 각 호의 사항이 기재된 신청서에 이의제기 내용을 확인할 수 있는 자료를 첨부하여 관세청장에게 제출하여야 한다. <신설 2012. 2. 2.>\n    1. 이의를 제기하는 자의 성명과 주소 또는 거소\n    2. 해당 물품의 품명ㆍ규격ㆍ용도ㆍ수출자ㆍ생산자 및 수입자\n    3. 이의제기의 요지와 내용\n  ⑤ 관세청장은 제4항에 따라 이의제기를 받은 때에는 이를 심사하여 30일 이내에 그 결정 내용을 신청인에게 알려야 한다. <신설 2012. 2. 2.>\n  ⑥ 관세청장은 이의제기의 내용이나 절차가 적합하지 아니하거나 보정할 수 있다고 인정되는 때에는 20일 이내의 기간을 정하여 다음 각 호의 사항을 적은 문서로써 보정하여 줄 것을 요구할 수 있다. 이 경우 보정기간은 제5항에 따른 심사결정기간에 산입하지 아니한다. <신설 2012. 2. 2.>\n    1. 보정할 사항\n    2. 보정을 요구하는 이유\n    3. 보정할 기간\n    4. 그 밖의 필요한 사항\n  [본조신설 2004. 3. 29.]","L44-0":"제44조(체납자료의 제공) ① 세관장은 관세징수 또는 공익목적을 위하여 필요한 경우로서 「신용정보의 이용 및 보호에 관한 법률」 제2조제6호에 따른 신용정보집중기관, 그 밖에 대통령령으로 정하는 자가 다음 각 호의 어느 하나에 해당하는 체납자의 인적사항 및 체납액에 관한 자료(이하 “체납자료”라 한다)를 요구한 경우에는 이를 제공할 수 있다. 다만, 체납된 관세 및 내국세등과 관련하여 이 법에 따른 이의신청ㆍ심사청구 또는 심판청구 및 행정소송이 계류 중인 경우나 그 밖에 대통령령으로 정하는 경우에는 체납자료를 제공하지 아니한다. <개정 2020. 2. 4.>\n    1. 체납 발생일부터 1년이 지나고 체납액이 대통령령으로 정하는 금액 이상인 자\n    2. 1년에 3회 이상 체납하고 체납액이 대통령령으로 정하는 금액 이상인 자\n  ② 제1항에 따른 체납자료의 제공 절차 등에 필요한 사항은 대통령령으로 정한다.\n  ③ 제1항에 따라 체납자료를 제공받은 자는 이를 업무 목적 외의 목적으로 누설하거나 이용하여서는 아니 된다.\n  [전문개정 2013. 1. 1.]","L9-0":"제9조(관세의 납부기한 등) ① 관세의 납부기한은 이 법에서 달리 규정하는 경우를 제외하고는 다음 각 호의 구분에 따른다. <개정 2020. 12. 22.>\n    1. 제38조제1항에 따른 납세신고를 한 경우: 납세신고 수리일부터 15일 이내\n    2. 제39조제3항에 따른 납부고지를 한 경우: 납부고지를 받은 날부터 15일 이내\n    3. 제253조제1항에 따른 수입신고전 즉시반출신고를 한 경우: 수입신고일부터 15일 이내\n  ② 납세의무자는 제1항에도 불구하고 수입신고가 수리되기 전에 해당 세액을 납부할 수 있다.\n  ③ 세관장은 납세실적 등을 고려하여 관세청장이 정하는 요건을 갖춘 성실납세자가 대통령령으로 정하는 바에 따라 신청을 할 때에는 제1항제1호 및 제3호에도 불구하고 납부기한이 동일한 달에 속하는 세액에 대하여는 그 기한이 속하는 달의 말일까지 한꺼번에 납부하게 할 수 있다. 이 경우 세관장은 필요하다고 인정하는 경우에는 납부할 관세에 상당하는 담보를 제공하게 할 수 있다.<개정 2016. 12. 20.>\n  ④ 삭제<2025. 3. 14.>\n  [전문개정 2010. 12. 30.]","D71-7":"제71조의7(우회덤핑의 조사 절차 등) ① 법 제56조의2에 따른 우회덤핑의 사실에 관한 조사는 무역위원회가 담당한다. 이 경우 무역위원회는 필요하다고 인정되면 관계 행정기관의 공무원 또는 관계 전문가를 조사활동에 참여하게 할 수 있다.\n  ② 무역위원회는 제71조의5제3항 전단 및 제71조의6제4항에 따른 관보게재일부터 6개월 이내에 우회덤핑 여부에 관한 조사를 하여 그 결과를 재정경제부장관에게 제출해야 한다. <개정 2025. 12. 30.>\n  ③ 무역위원회는 제2항에 따른 조사기간을 연장할 필요가 있거나 이해관계인이 정당한 사유를 제시하여 조사기간의 연장을 요청하는 경우에는 2개월의 범위에서 그 조사기간을 연장할 수 있다. <개정 2025. 11. 28.>\n  ④ 무역위원회는 제2항에 따라 조사결과를 제출할 때 필요하다고 인정되면 재정경제부장관에게 우회덤핑 사실이 확인된 물품에 대해 법 제56조의2에 따른 덤핑방지관세의 부과를 건의할 수 있다. <개정 2025. 12. 30.>\n  ⑤ 재정경제부장관은 제2항에 따라 조사결과를 받은 경우에는 제71조의5제3항 전단 및 제71조의6제4항에 따른 관보게재일부터 9개월 이내에 덤핑방지관세의 부과 여부 및 내용을 결정하여 법 제56조의2에 따른 덤핑방지관세를 부과해야 한다. 다만, 특별한 사유가 있다고 인정되는 경우에는 관보게재일부터 10개월 이내에 덤핑방지관세를 부과할 수 있다. <개정 2025. 11. 28., 2025. 12. 30.>\n  ⑥ 제1항부터 제5항까지에서 규정한 사항 외에 우회덤핑 조사 및 판정 절차와 우회덤핑 물품에 대한 덤핑방지관세의 부과에 필요한 사항은 무역위원회가 재정경제부장관과 협의하여 고시한다. <개정 2025. 12. 30.>\n  [본조신설 2024. 2. 29.]","L266-0":"제266조(장부 또는 자료의 제출 등) ① 세관공무원은 이 법에 따른 직무를 집행하기 위하여 필요하다고 인정될 때에는 수출입업자ㆍ판매업자 또는 그 밖의 관계자에 대하여 질문하거나 문서화ㆍ전산화된 장부, 서류 등 관계 자료 또는 물품을 조사하거나, 그 제시 또는 제출을 요구할 수 있다. <개정 2011. 12. 31.>\n  ② 상설영업장을 갖추고 외국에서 생산된 물품을 판매하는 자로서 재정경제부령으로 정하는 기준에 해당하는 자는 해당 물품에 관하여 「부가가치세법」 제32조 및 제35조에 따른 세금계산서나 수입 사실 등을 증명하는 자료를 영업장에 갖춰 두어야 한다.<개정 2013. 6. 7., 2025. 10. 1.>\n  ③ 관세청장이나 세관장은 이 법 또는 이 법에 따른 명령을 집행하기 위하여 필요하다고 인정될 때에는 제2항에 따른 상설영업장의 판매자나 그 밖의 관계인으로 하여금 대통령령으로 정하는 바에 따라 영업에 관한 보고를 하게 할 수 있다.\n  ④ 관세청장이나 세관장은 소비자 피해를 예방하기 위하여 필요한 경우 「전자상거래 등에서의 소비자보호에 관한 법률」 제2조제4호에 따른 통신판매중개(이하 이 조에서 “통신판매중개”라 한다)를 하는 자를 대상으로 통신판매중개를 하는 사이버몰에서 거래되는 물품 중 이 법 제226조, 제230조 및 제235조를 위반하여 수입된 물품의 유통실태조사를 서면으로 실시할 수 있다.<신설 2019. 12. 31., 2021. 12. 21.>\n  ⑤ 관세청장은 제4항에 따라 실시한 서면실태조사의 결과를 공정거래위원회에 제공할 수 있고, 공정거래위원회와 소비자 피해 예방을 위하여 필요하다고 합의한 경우에는 대통령령으로 정하는 바에 따라 그 조사 결과를 공개할 수 있다.<신설 2019. 12. 31.>\n  ⑥ 관세청장이나 세관장은 제4항에 따른 서면실태조사를 위하여 필요한 경우에는 해당 통신판매중개를 하는 자에게 필요한 자료의 제출을 요구할 수 있다.<신설 2019. 12. 31.>\n  ⑦ 제4항에 따른 서면실태조사의 시기, 범위, 방법 및 조사결과의 공표범위 등에 관하여 필요한 사항은 대통령령으로 정한다.<신설 2019. 12. 31.>\n  [전문개정 2010. 12. 30.]","D155-2":"제155조의2(국제항의 지정요건 등) ① 법 제133조제2항에 따른 국제항의 지정요건은 다음 각 호와 같다. <개정 2006. 5. 22., 2015. 2. 6., 2015. 8. 3., 2017. 3. 29., 2019. 2. 12., 2021. 2. 17.>\n    1. 「선박의 입항 및 출항 등에 관한 법률」 또는 「공항시설법」에 따라 국제무역선(기)이 항상 입출항할 수 있을 것\n    2. 국내선과 구분되는 국제선 전용통로 및 그 밖에 출입국업무를 처리하는 행정기관의 업무수행에 필요한 인력ㆍ시설ㆍ장비를 확보할 수 있을 것\n    3. 공항 및 항구의 여객수 또는 화물량 등에 관한 다음 각 목의 구분에 따른 기준을 갖출 것\n      가. 공항의 경우: 다음의 어느 하나의 요건을 갖출 것\n  1) 정기여객기가 주 6회 이상 입항하거나 입항할 것으로 예상될 것\n  2) 여객기로 입국하는 여객수가 연간 4만명 이상일 것\n      나. 항구의 경우: 국제무역선인 5천톤급 이상의 선박이 연간 50회 이상 입항하거나 입항할 것으로 예상될 것\n  ② 관세청장 또는 관계 행정기관의 장은 국제항이 제1항에 따른 지정요건을 갖추지 못하여 업무수행 등에 상당한 지장을 준다고 판단하는 경우에는 재정경제부장관에게 그 사실을 보고해야 한다. 이 경우 재정경제부장관은 관세청장 또는 국제항시설의 관리기관의 장과 국제항에 대한 현장점검을 할 수 있다. <신설 2019. 2. 12., 2021. 2. 17., 2025. 12. 30.>\n  ③ 재정경제부장관은 제2항에 따른 보고 또는 현장점검 결과를 검토한 결과 시설 등의 개선이 필요한 경우에는 해당 국제항의 운영자에게 개선대책 수립, 시설개선 등을 명할 수 있으며 그 이행결과를 보고하게 할 수 있다. <신설 2019. 2. 12., 2021. 2. 17., 2025. 12. 30.>\n  [본조신설 2004. 3. 29.]\n  [제목개정 2021. 2. 17.]","L19-0":"제19조(납세의무자) ① 다음 각 호의 어느 하나에 해당하는 자는 관세의 납세의무자가 된다. <개정 2013. 1. 1., 2017. 12. 19., 2018. 12. 31., 2020. 12. 22.>\n    1. 수입신고를 한 물품인 경우에는 그 물품을 수입신고하는 때의 화주(화주가 불분명할 때에는 다음 각 목의 어느 하나에 해당하는 자를 말한다. 이하 이 조에서 같다). 다만, 수입신고가 수리된 물품 또는 제252조에 따른 수입신고수리전 반출승인을 받아 반출된 물품에 대하여 납부하였거나 납부하여야 할 관세액이 부족한 경우 해당 물품을 수입신고하는 때의 화주의 주소 및 거소가 분명하지 아니하거나 수입신고인이 화주를 명백히 하지 못하는 경우에는 그 신고인이 해당 물품을 수입신고하는 때의 화주와 연대하여 해당 관세를 납부하여야 한다.\n      가. 수입을 위탁받아 수입업체가 대행수입한 물품인 경우: 그 물품의 수입을 위탁한 자\n      나. 수입을 위탁받아 수입업체가 대행수입한 물품이 아닌 경우: 대통령령으로 정하는 상업서류에 적힌 물품수신인\n      다. 수입물품을 수입신고 전에 양도한 경우: 그 양수인\n    2. 제143조제6항(제151조제2항에 따라 준용되는 경우를 포함한다)에 따라 관세를 징수하는 물품인 경우에는 하역허가를 받은 자\n    3. 제158조제7항에 따라 관세를 징수하는 물품인 경우에는 보세구역 밖에서 하는 보수작업을 승인받은 자\n    4. 제160조제2항에 따라 관세를 징수하는 물품인 경우에는 운영인 또는 보관인\n    5. 제187조제7항(제195조제2항 또는 제202조제3항에 따라 준용되는 경우를 포함한다)에 따라 관세를 징수하는 물품인 경우에는 보세공장 외 작업, 보세건설장 외 작업 또는 종합보세구역 외 작업을 허가받거나 신고한 자\n    6. 제217조에 따라 관세를 징수하는 물품인 경우에는 보세운송을 신고하였거나 승인을 받은 자\n    7. 수입신고가 수리되기 전에 소비하거나 사용하는 물품(제239조에 따라 소비 또는 사용을 수입으로 보지 아니하는 물품은 제외한다)인 경우에는 그 소비자 또는 사용자\n    8. 제253조제4항에 따라 관세를 징수하는 물품인 경우에는 해당 물품을 즉시 반출한 자\n    9. 우편으로 수입되는 물품인 경우에는 그 수취인\n    10. 도난물품이나 분실물품인 경우에는 다음 각 목에 규정된 자\n      가. 보세구역의 장치물품(藏置物品): 그 운영인 또는 제172조제2항에 따른 화물관리인(이하 “화물관리인”이라 한다)\n      나. 보세운송물품: 보세운송을 신고하거나 승인을 받은 자\n      다. 그 밖의 물품: 그 보관인 또는 취급인\n    11. 이 법 또는 다른 법률에 따라 따로 납세의무자로 규정된 자\n    12. 제1호부터 제11호까지 외의 물품인 경우에는 그 소유자 또는 점유자\n  ② 제1항제1호에 따른 화주 또는 신고인과 제1항제2호부터 제11호까지에 규정된 자가 경합되는 경우에는 제1항제2호부터 제11호까지에 규정된 자를 납세의무자로 한다.\n  ③ 이 법 또는 다른 법령, 조약, 협약 등에 따라 관세의 납부를 보증한 자는 보증액의 범위에서 납세의무를 진다.\n  ④ 법인이 합병하거나 상속이 개시된 경우에는 「국세기본법」 제23조 및 제24조를 준용하여 관세ㆍ가산세 및 강제징수비의 납세의무를 승계한다. 이 경우 같은 법 제24조제2항 및 제4항의 “세무서장”은 “세관장”으로 본다.<신설 2014. 1. 1., 2019. 12. 31., 2020. 12. 22.>\n  ⑤ 제1항 각 호에 따른 물품에 관계되는 관세ㆍ가산세 및 강제징수비에 대해서는 다음 각 호에 규정된 자가 연대하여 납부할 의무를 진다.<신설 2014. 1. 1., 2017. 12. 19., 2019. 12. 31., 2020. 6. 9., 2020. 12. 22., 2021. 12. 21., 2022. 12. 31., 2025. 12. 23.>\n    1. 제1항제1호에 따른 수입신고물품의 경우 다음 각 목에 규정된 자\n      가. 수입신고물품이 공유물이거나 공동사업에 속하는 물품인 경우: 그 공유자 또는 공동사업자인 납세의무자\n      나. 수입신고인이 수입신고를 하면서 수입신고하는 때의 화주가 아닌 자를 납세의무자로 신고한 경우: 수입신고인 또는 납세의무자로 신고된 자가 제270조제1항 또는 제4항에 따른 관세포탈 또는 부정감면의 범죄를 저지 르거나 제271조제1항(제270조제1항 또는 제4항에 따른 행위를 교사하거나 방조한 경우에 한정한다)에 따른 범죄를 저질러 유죄의 확정판결을 받은 경우 그 수입신고인 및 납세의무자로 신고된 자와 해당 물품을 수입신고하는 때의 화주. 다만, 관세포탈 또는 부정감면으로 얻은 이득이 없는 수입신고인 또는 납세의무자로 신고된 자는 제외한다.\n      다. 다음 중 어느 하나를 업으로 하는 자(이하 “구매대행업자”라 한다)가 화주로부터 수입물품에 대하여 납부할 관세 등에 상당하는 금액을 수령한 경우: 구매대행업자와 수입신고하는 때의 화주 1) 자가사용물품을 수입하려는 화주의 위임에 따라 해외 판매자로부터 해당 수입물품의 구매를 대행하는 것 2) 사이버몰 등을 통하여 해외로부터 구매 가능한 물품의 정보를 제공하고 해당 물품을 자가사용물품으로 수입하려는 화주의 요청에 따라 그 물품을 구매해서 판매하는 것\n    2. 제1항제2호부터 제12호까지의 규정에 따른 물품에 대한 납세의무자가 2인 이상인 경우 그 2인 이상의 납세의무자\n  ⑥ 다음 각 호의 어느 하나에 해당되는 경우 「국세기본법」 제25조제2항부터 제4항까지의 규정을 준용하여 분할되는 법인이나 분할 또는 분할합병으로 설립되는 법인, 존속하는 분할합병의 상대방 법인 및 신회사가 관세ㆍ가산세 및 강제징수비를 연대하여 납부할 의무를 진다.<신설 2014. 1. 1., 2019. 12. 31., 2020. 12. 22.>\n    1. 법인이 분할되거나 분할합병되는 경우\n    2. 법인이 분할 또는 분할합병으로 해산하는 경우\n    3. 법인이 「채무자 회생 및 파산에 관한 법률」 제215조에 따라 신회사를 설립하는 경우\n  ⑦ 이 법에 따라 관세ㆍ가산세 및 강제징수비를 연대하여 납부할 의무에 관하여는 「민법」 제413조부터 제416조까지, 제419조, 제421조, 제423조 및 제425조부터 제427조까지의 규정을 준용한다.<신설 2014. 1. 1., 2019. 12. 31., 2020. 12. 22.>\n  ⑧ 관세의 징수에 관하여는 「국세기본법」 제38조부터 제41조까지의 규정을 준용한다.<개정 2014. 1. 1.>\n  ⑨ 제8항에 따라 준용되는 「국세기본법」 제38조부터 제41조까지의 규정에 따른 제2차 납세의무자는 관세의 담보로 제공된 것이 없고 납세의무자와 관세의 납부를 보증한 자가 납세의무를 이행하지 아니하는 경우에 납세의무를 진다.<개정 2014. 1. 1.>\n  ⑩ 납세의무자(관세의 납부를 보증한 자와 제2차 납세의무자를 포함한다. 이하 이 조에서 같다)가 관세ㆍ가산세 및 강제징수비를 체납한 경우 그 납세의무자에게 「국세기본법」 제42조제3항에 따른 양도담보재산이 있을 때에는 그 납세의무자의 다른 재산에 대하여 강제징수를 하여도 징수하여야 하는 금액에 미치지 못한 경우에만 「국세징수법」 제7조를 준용하여 그 양도담보재산으로써 납세의무자의 관세ㆍ가산세 및 강제징수비를 징수할 수 있다. 다만, 그 관세의 납세신고일(제39조에 따라 부과고지하는 경우에는 그 납부고지서의 발송일을 말한다) 전에 담보의 목적이 된 양도담보재산에 대해서는 그러하지 아니하다.<개정 2014. 1. 1., 2019. 12. 31., 2020. 12. 22.>\n  [전문개정 2010. 12. 30.]","L116-3":"제116조의3(납세증명서의 제출 및 발급) ① 납세자(미과세된 자를 포함한다. 이하 이 조에서 같다)는 다음 각 호의 어느 하나에 해당하는 경우에는 대통령령으로 정하는 바에 따라 납세증명서를 제출하여야 한다. <개정 2018. 12. 31., 2023. 3. 4.>\n    1. 국가, 지방자치단체 또는 대통령령으로 정하는 정부관리기관으로부터 대금을 지급받을 경우\n    2. 「출입국관리법」 제31조에 따른 외국인등록 또는 「재외동포의 출입국과 법적 지위에 관한 법률」 제6조에 따른 국내거소신고를 한 외국인이 체류기간 연장허가 등 대통령령으로 정하는 체류허가를 법무부장관에게 신청하는 경우\n    3. 내국인이 해외이주 목적으로 「해외이주법」 제6조에 따라 재외동포청장에게 해외이주신고를 하는 경우\n  ② 세관장은 납세자로부터 납세증명서의 발급신청을 받았을 때에는 그 사실을 확인하고 즉시 납세증명서를 발급하
