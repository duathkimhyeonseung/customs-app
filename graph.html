<style>
/* Layout: one large circle split into three arcs (법, 시행령, 시행규칙), chapters in order inside each arc, titles pointing outward, delegation lines as straight chords. */
:root {

}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121618; --sheet: #1b2023; --ink: #e2e6e4; --muted: #96a1a8; --rule: #2f363a; --band: #181d20;
  --p: #b88af0; --o: #f39a4c; --k: #d6dbd8; --law-l: #8db8dc; --law-d: #93c4a4; --law-r: #d9b26a; --sel: #ff7b6e; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121618; --sheet: #1b2023; --ink: #e2e6e4; --muted: #96a1a8; --rule: #2f363a; --band: #181d20;
  --p: #b88af0; --o: #f39a4c; --k: #d6dbd8; --law-l: #8db8dc; --law-d: #93c4a4; --law-r: #d9b26a; --sel: #ff7b6e; color-scheme: dark }
html, body { height: 100%; }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--sheet); }
.bar { background: var(--sheet); border-bottom: 1px solid var(--rule); padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); padding-block: 8px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; flex: none; }

#view { flex: 1; overflow: auto; position: relative; -webkit-overflow-scrolling: touch; touch-action: pan-x pan-y; overscroll-behavior: contain; }
#view { display: flex; }
#map { transform-origin: 0 0; will-change: transform; margin: auto; flex: none; }
svg { display: block; }
.lawarc { fill: none; stroke-width: 7; stroke-linecap: butt; }
.lawarc.alt { opacity: .45; }
.lawarc.L { stroke: var(--law-l); } .lawarc.D { stroke: var(--law-d); } .lawarc.R { stroke: var(--law-r); }

.hide-p line.p, .hide-o line.o, .hide-k line.k { display: none; }
#panel { position: fixed; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); width: min(360px, calc(100vw - 24px)); max-height: 45vh; overflow: auto; background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; box-shadow: 0 6px 24px rgba(0,0,0,.18); padding: 12px 14px; font-size: 13px; line-height: 1.5; }

"R73-2","k"],["L31-0","R73-2","k"],["L32-0","R73-2","k"],["L33-0","R73-2","k"],["L34-0","R73-2","k"],["L35-0","R73-2","k"],["D222-0","R73-2","o"],["L220-2","R73-3","o"],["L2-0","R73-3","k"],["L229-0","R74-0","o"],["L229-0","R76-0","o"],["L232-2","R76-2","o"],["L232-2","R77-0","o"],["L233-0","R77-2","o"],["L73-0","R77-2","k"],["L76-0","R77-2","k"],["D236-8","R77-3","o"],["D245-2","R77-4","o"],["D246-0","R77-5","o"],["L226-0","R77-6","k"],["L327-0","R77-6","k"],["D246-0","R77-6","o"],["L251-0","R79-0","o"],["L254-2","R79-2","o"],["L30-0","R79-2","k"],["L31-0","R79-2","k"],["L32-0","R79-2","k"],["L33-0","R79-2","k"],["L34-0","R79-2","k"],["L35-0","R79-2","k"],["L222-0","R79-3","k"],["D259-6","R79-3","o"],["L264-2","R79-4","k"],["L19-0","R79-4","k"],["L222-0","R79-4","k"],["D263-2","R79-4","k"],["L266-0","R80-0","o"],["L268-0","R80-2","o"],["D270-2","R80-3","o"],["L321-0","R81-0","o"],["L322-0","R82-0","o"],["D233-0","R82-0","k"],["L323-0","R83-0","o"],["D285-4","R84-0","o"],["D285-4","R85-0","o"],["L327-3","R85-2","o"],["L327-3","R86-0","k"]],"texts":{"L284-2":"제284조의2(관세범칙조사심의위원회) ① 범칙사건에 관한 다음 각 호의 사항을 심의하기 위하여 관세청 또는 대통령령으로 정하는 세관에 관세범칙조사심의위원회를 둘 수 있다.\n    1. 제290조 및 「사법경찰관리의 직무를 수행할 자와 그 직무범위에 관한 법률」 제6조제14호에 해당하는 사건에 대한 조사의 시작 여부에 관한 사항\n    2. 제1호에 따라 조사한 사건의 고발, 송치, 통고처분(제311조제8항에 따른 통고처분의 면제를 포함한다) 및 종결 등에 관한 사항\n    3. 그 밖에 범칙사건과 관련하여 관세청장 또는 세관장이 관세범칙조사심의위원회의 심의가 필요하다고 인정하는 사항\n  ② 관세범칙조사심의위원회는 위원장 1명을 포함하여 20명 이내의 위원으로 성별을 고려하여 구성한다.\n  ③ 제2항에서 규정한 사항 외에 관세범칙조사심의위원회의 관할, 구성 및 운영 등에 필요한 사항은 대통령령으로 정한다.\n  [본조신설 2019. 12. 31.]","D192-6":"제192조의6(보세판매장 특허의 갱신) ① 세관장은 보세판매장의 특허를 받은 자에게 법 제176조의2제6항에 따라 특허를 갱신받으려면 특허기간이 끝나는 날의 6개월 전까지 특허 갱신을 신청해야 한다는 사실과 갱신절차를 특허기간이 끝나는 날의 7개월 전까지 휴대폰에 의한 문자전송, 전자메일, 팩스, 전화, 문서 등으로 미리 알려야 한다.\n  ② 법 제176조의2제6항에 따라 보세판매장의 특허를 갱신하려는 자는 다음 각 호의 사항을 적은 신청서에 재정경제부령으로 정하는 서류를 첨부하여 그 기간만료 6개월 전까지 세관장에게 제출해야 한다. <개정 2025. 12. 30.>\n    1. 갱신사유\n    2. 갱신기간\n  ③ 세관장은 제2항의 신청서를 제출받은 경우 다음 각 호의 서류 또는 자료를 관세청장을 거쳐 특허심사위원회에 제출해야 한다.\n    1. 제2항의 신청서 및 첨부서류\n    2. 제2항에 따라 갱신을 신청한 자(이하 이 조에서 “갱신신청자”라 한다)가 제189조에 따른 요건을 충족하는지 여부 및 관세 관계 법령에 따른 의무ㆍ명령 등의 위반여부에 대한 세관장의 검토 의견\n  ④ 특허심사위원회는 제3항에 따라 제출받은 서류 또는 자료의 적정성을 검토한 후 제192조의3제2항의 평가기준에 따라 갱신신청자를 평가하여 보세판매장 특허 갱신 여부를 심의하고, 심의결과를 관세청장 및 해당 세관장에게 통보해야 한다.\n  ⑤ 관세청장은 제4항에 따른 특허심사위원회의 심의가 완료된 후 다음 각 호의 사항을 관세청장이 정하는 바에 따라 관세청의 인터넷 홈페이지 등을 통하여 공개해야 한다. 다만, 보세판매장 특허 갱신을 받지 못한 경우 제1호의 사항은 갱신신청자가 동의한 경우에만 공개할 수 있다.\n    1. 갱신신청자에 대한 평가결과\n    2. 심의에 참여한 특허심사위원회의 위원 명단\n  ⑥ 세관장은 제4항에 따라 통보받은 심의결과에 따라 갱신 특허를 부여하고 갱신신청자에게 평가결과와 보세판매장의 특허 갱신 여부 등을 통보해야 한다.\n  ⑦ 제1항부터 제6항까지에서 규정한 사항 외에 보세판매장의 특허 갱신에 관한 세부사항은 관세청장이 정하여 고시한다.\n  [전문개정 2019. 2. 12.]","L260-0":"제260조(우편물의 납세절차) ① 제259조제2항에 따른 통지를 받은 자는 대통령령으로 정하는 바에 따라 해당 관세를 수입인지 또는 금전으로 납부하여야 한다.\n  ② 체신관서는 관세를 징수하여야 하는 우편물은 관세를 징수하기 전에 수취인에게 내줄 수 없다.\n  [전문개정 2010. 12. 30.]","R9-3":"제9조의3(관세 등 환급가산금의 이율) 영 제56조제2항에서 “재정경제부령으로 정하는 이자율”이란 연 1천분의 31을 말한다. <개정 2013. 2. 23., 2015. 3. 6., 2016. 3. 9., 2017. 3. 31., 2018. 3. 21., 2019. 3. 20., 2020. 3. 13., 2021. 3. 16., 2023. 3. 20., 2024. 3. 22., 2025. 3. 21., 2026. 1. 2.>\n  [본조신설 2012. 2. 28.]\n  [제9조의2에서 이동 <2015. 3. 6.>]","L146-0":"제146조(그 밖의 선박 또는 항공기) ① 다음 각 호의 어느 하나에 해당하는 선박이나 항공기는 국제무역선이나 국제무역기에 관한 규정을 준용한다. 다만, 대통령령으로 정하는 선박 및 항공기에 대해서는 그러하지 아니하다. <개정 2020. 12. 22.>\n    1. 국제무역선 또는 국제무역기 외의 선박이나 항공기로서 외국에 운항하는 선박 또는 항공기\n    2. 외국을 왕래하는 여행자와 제241조제2항제1호의 물품을 전용으로 운송하기 위하여 국내에서만 운항하는 항공기 (이하 “환승전용국내운항기”라 한다)\n  ② 제1항에도 불구하고 환승전용국내운항기에 대해서는 제143조제2항은 적용하지 아니하며 효율적인 통관 및 감시ㆍ단속을 위하여 필요한 사항은 대통령령으로 따로 정할 수 있다.<개정 2020. 12. 22.>\n  [전문개정 2011. 12. 31.]","L86-0":"제86조(특정물품에 적용될 품목분류의 사전심사) ① 다음 각 호의 어느 하나에 해당하는 자는 제241조제1항에 따른 수출입신고를 하기 전에 대통령령으로 정하는 서류를 갖추어 관세청장에게 해당 물품에 적용될 별표 관세율표 또는 품목분류표상의 품목분류를 미리 심사하여 줄 것을 신청할 수 있다. <개정 2023. 12. 31.>\n    1. 물품을 수출입하려는 자\n    2. 수출할 물품의 제조자\n    3. 「관세사법」에 따른 관세사ㆍ관세법인 또는 통관취급법인(이하 “관세사등”이라 한다)\n  ② 제1항에 따른 심사(이하 “사전심사”라 한다)의 신청을 받은 관세청장은 해당 물품에 적용될 품목분류를 심사하여 대통령령으로 정하는 기간 이내에 이를 신청인에게 통지하여야 한다. 다만, 제출자료의 미비 등으로 품목분류를 심사하기 곤란한 경우에는 그 뜻을 통지하여야 한다.<개정 2014. 12. 23., 2015. 12. 15.>\n  ③ 제2항에 따라 통지를 받은 자는 통지받은 날부터 30일 이내에 대통령령으로 정하는 서류를 갖추어 관세청장에게 재심사를 신청할 수 있다. 이 경우 관세청장은 해당 물품에 적용될 품목분류를 재심사하여 대통령령으로 정하는 기간 이내에 이를 신청인에게 통지하여야 하며, 제출자료의 미비 등으로 품목분류를 심사하기 곤란한 경우에는 그 뜻을 통지하여야 한다.<신설 2014. 12. 23., 2018. 12. 31.>\n  ④ 관세청장은 제2항 본문에 따라 품목분류를 심사한 물품 및 제3항에 따른 재심사 결과 적용할 품목분류가 변경된 물품에 대하여는 해당 물품에 적용될 품목분류와 품명, 용도, 규격, 그 밖에 필요한 사항을 고시 또는 공표하여야 한\n      다. 다만, 신청인의 영업 비밀을 포함하는 등 해당 물품에 적용될 품목분류를 고시 또는 공표하는 것이 적당하지 아니하다고 인정되는 물품에 대하여는 고시 또는 공표하지 아니할 수 있다.<개정 2013. 1. 1., 2014. 12. 23., 2015. 12. 15.>\n  ⑤ 세관장은 제241조제1항에 따른 수출입신고가 된 물품이 제2항 본문 및 제3항에 따라 통지한 물품과 같을 때에는 그 통지 내용에 따라 품목분류를 적용하여야 한다.<개정 2014. 12. 23., 2015. 12. 15., 2023. 12. 31.>\n    1. 삭제<2023. 12. 31.>\n    2. 삭제<2023. 12. 31.>\n  ⑥ 관세청장은 제2항 본문 및 제3항에 따라 품목분류를 심사 또는 재심사하기 위하여 해당 물품에 대한 구성재료의 물리적ㆍ화학적 분석이 필요한 경우에는 해당 품목분류를 심사 또는 재심사하여 줄 것을 신청한 자에게 재정경제부령으로 정하는 수수료를 납부하게 할 수 있다.<개정 2014. 12. 23., 2025. 10. 1.>\n  ⑦ 제2항 본문에 따라 통지받은 사전심사 결과 또는 제3항에 따라 통지받은 재심사 결과는 제87조제1항 또는 제3항에 따라 품목분류가 변경되기 전까지 유효하다.<개정 2020. 12. 22.>\n  ⑧ 품목분류 사전심사 및 재심사의 절차, 방법과 그 밖에 필요한 사항은 대통령령으로 정한다.<신설 2014. 12. 23.>\n  ⑨ 관세청장은 사전심사의 신청이 없는 경우에도 수출입신고된 물품에 적용될 품목분류를 결정할 수 있다. 이 경우 제85조제2항제4호에 따라 관세품목분류위원회의 심의를 거쳐 품목분류가 결정된 물품에 대해서는 제4항을 준용하여 해당 물품의 품목분류에 관한 사항을 고시 또는 공표하여야 한다.<신설 2023. 12. 31.>\n  [전문개정 2010. 12. 30.]","D135-2":"제135조의2(통합조사 원칙의 예외) 법 제110조의2에서 “특정한 분야만을 조사할 필요가 있는 등 대통령령으로 정하는 경우”란 다음 각 호의 어느 하나에 해당하는 경우를 말한다. <개정 2025. 12. 30.>\n    1. 세금탈루 혐의, 수출입 관련 의무위반 혐의, 수출입업자 등의 업종ㆍ규모 등을 고려하여 특정 사안만을 조사할 필요가 있는 경우\n    2. 조세채권의 확보 등을 위하여 긴급히 조사할 필요가 있는 경우\n    3. 그 밖에 조사의 효율성, 납세자의 편의 등을 고려하여 특정 분야만을 조사할 필요가 있는 경우로서 재정경제부령으로 정하는 경우\n  [본조신설 2012. 2. 2.]","D217-0":"제217조(설비유지의무 등) ①법 제202조제1항의 규정에 의하여 종합보세구역의 운영인이 유지하여야 하는 시설 및 장비 등의 설비는 다음 각호의 설비로 한다.\n    1. 제조ㆍ가공ㆍ전시ㆍ판매ㆍ건설 및 장치 기타 보세작업에 필요한 기계시설 및 기구\n    2. 반입ㆍ반출물품의 관리 및 세관의 업무검사에 필요한 전산설비\n    3. 소방ㆍ전기 및 위험물관리 등에 관한 법령에서 정하는 시설 및 장비\n    4. 보세화물의 분실과 도난방지를 위한 시설\n  ②제1항의 규정에 의한 설비가 천재ㆍ지변 기타 불가피한 사유로 인하여 일시적으로 기준에 미달하게 된 때에는 종합보세구역의 운영인은 관세청장이 정하는 기간내에 이를 갖추어야 한다.\n  ③법 제202조제2항의 규정에 의한 보수작업 또는 보세작업에 관한 신고에 관하여는 제177조 및 제203조의 규정을 준용한다.","D244-0":"제244조(통관의 보류) 법 제237조제1항제6호에서 “대통령령으로 정하는 경우”란 다음 각 호의 어느 하나에 해당하는 경우를 말한다.\n    1. 관세 관계 법령을 위반한 혐의로 고발되거나 조사를 받는 경우\n    2. 수출입 관계 법령에 따른 일시적 통관 제한ㆍ금지 또는 이에 따른 중앙행정기관의 장의 일시적 통관 제한ㆍ금지 요청이 있어 세관장이 그 해당 여부를 확인할 필요가 있는 경우\n  [전문개정 2024. 2. 29.]","L25-0":"제25조(담보의 관세충당) ① 세관장은 담보를 제공한 납세의무자가 그 납부기한까지 해당 관세를 납부하지 아니하면 재정경제부령으로 정하는 바에 따라 그 담보를 해당 관세에 충당할 수 있다. 이 경우 담보로 제공된 금전을 해당 관세에 충당할 때에는 납부기한이 지난 후에 충당하더라도 제42조를 적용하지 아니한다. <개정 2019. 12. 31., 2025. 10. 1.>\n  ② 세관장은 제1항에 따라 담보를 관세에 충당하고 남은 금액이 있을 때에는 담보를 제공한 자에게 이를 돌려주어야 하며, 돌려줄 수 없는 경우에는 이를 공탁할 수 있다.\n  ③ 세관장은 관세의 납세의무자가 아닌 자가 관세의 납부를 보증한 경우 그 담보로 관세에 충당하고 남은 금액이 있을 때에는 그 보증인에게 이를 직접 돌려주어야 한다.\n  [전문개정 2010. 12. 30.]","R69-5":"제69조의5(보세판매장 판매 대상 물품) 법 제196조에 따른 보세판매장에서 판매할 수 있는 물품은 다음 각 호와 같다. <개정 2020. 3. 13.>\n    1. 법 제196조제1항에 따라 외국으로 반출하는 것을 조건으로 보세판매장에서 판매할 수 있는 물품은 다음 각 목의 물품을 제외한 물품으로 한다.\n      가. 법 제234조에 따른 수출입 금지 물품\n      나. 「마약류 관리에 관한 법률」, 「총포ㆍ도검ㆍ화약류 등의 안전관리에 관한 법률」에 따른 규제대상 물품\n    2. 법 제196조제1항에 따라 법 제88조제1항제1호부터 제4호까지에 따라 관세의 면제를 받을 수 있는 자가 사용하는 것을 조건으로 보세판매장에서 판매할 수 있는 물품은 별표 6과 같다.\n    3. 법 제196조제2항에 따라 설치된 보세판매장에서 판매할 수 있는 물품은 다음 각 목의 물품을 제외한 물품으로 한다.\n      가. 법 제234조에 따른 수출입 금지 물품\n      나. 「마약류 관리에 관한 법률」, 「총포ㆍ도검ㆍ화약류 등의 안전관리에 관한 법률」에 따른 규제대상 물품\n      다. 「가축전염병 예방법」에 따른 지정검역물과 「식물방역법」에 따른 식물검역 대상물품\n      라. 「수산생물질병 관리법」에 따른 지정검역물\n    4. 법 제196조제1항제1호 단서에 따라 입국장 인도장에서 인도하는 것을 조건으로 보세판매장에서 판매할 수 있는 물품은 다음 각 목의 물품을 제외한 물품으로 한다.\n      가.  법 제234조에 따른 수출입 금지 물품\n      나. 「마약류 관리에 관한 법률」, 「총포ㆍ도검ㆍ화약류 등의 안전관리에 관한 법률」에 따른 규제대상 물품\n      다. 「가축전염병 예방법」에 따른 지정검역물과 「식물방역법」에 따른 식물검역 대상물품\n      라. 「수산생물질병 관리법」에 따른 지정검역물\n  [본조신설 2019. 3. 20.]","D266-2":"제266조의2(관세범칙조사심의위원회의 구성) ① 법 제284조의2의제1항에 따라 인천공항세관ㆍ서울세관ㆍ부산세관ㆍ인천세관ㆍ대구세관ㆍ광주세관 및 평택세관에 관세범칙조사심의위원회를 둔다. <개정 2023. 4. 11.>\n  ② 법 제284의2제1항에 따른 관세범칙조사심의위원회(이하 “관세범칙조사심의위원회”라 한다)는 위원장 1명을 포함한 10명 이상 20명 이하의 위원으로 구성한다.\n  ③ 관세범칙조사심의위원회의 위원장은 관세청의 3급부터 5급까지에 해당하는 공무원 중 관세청장이 지정하는 사람이 되고, 위원은 다음 각 호의 사람 중에서 세관장이 임명 또는 위촉하되, 제2호부터 제6호까지에 해당하는 위원이 2분의 1 이상 포함되어야 한다.\n    1. 관세청 소속 공무원\n    2. 변호사ㆍ관세사\n    3. 대학교수\n    4. 관세, 무역 및 형사 관련 전문연구기관 연구원\n    5. 시민단체(「비영리민간단체 지원법」 제2조에 따른 비영리민간단체를 말한다)에서 추천하는 자\n    6. 그 밖에 범칙조사에 관한 학식과 경험이 풍부한 자\n  ④ 제3항제2호부터 제6호까지에 해당하는 위원의 임기는 2년으로 하되, 한차례만 연임할 수 있다. 다만, 보궐위원의 임기는 전임위원 임기의 남은 기간으로 한다.\n  [본조신설 2020. 2. 11.]","D192-3":"제192조의3(보세판매장 특허의 신청자격과 심사 시 평가기준) ① 법 제176조의2제3항에서 “대통령령으로 정하는 일정한 자격을 갖춘 자”란 제189조에 따른 특허보세구역의 설치ㆍ운영에 관한 특허를 받을 수 있는 요건을 갖춘 자를 말한다.\n  ② 법 제176조의2제3항에서 “대통령령으로 정하는 평가기준”이란 다음 각 호의 평가요소를 고려하여 관세청장이 정하는 평가기준을 말한다. <개정 2014. 3. 5., 2021. 12. 28., 2025. 2. 28.>\n    1. 제189조에 따른 특허보세구역의 설치ㆍ운영에 관한 특허를 받을 수 있는 요건의 충족 여부\n    2. 관세 관계 법령에 따른 의무ㆍ명령 등의 위반 여부\n    3. 재무건전성 등 보세판매장 운영인의 경영 능력\n    4. 중소기업제품의 판매 실적 등 경제ㆍ사회 발전을 위한 공헌도\n    5. 관광 인프라 등 주변 환경요소\n    6. 기업이익의 사회 환원 정도\n    7. 「독점규제 및 공정거래에 관한 법률」 제31조제1항에 따른 상호출자제한기업집단에 속한 기업과 「중소기업기본법」 제2조에 따른 중소기업 및 「중견기업 성장촉진 및 경쟁력 강화에 관한 특별법」 제2조제1호에 따른 중견기업 간의 상생협력을 위한 노력 정도\n  [본조신설 2013. 11. 5.]\n  제192조의4\n  [종전 제192조의4는 제192조의7로 이동<2015. 2. 6.>]","R74-0":"제74조(일반물품의 원산지결정기준) ①법 제229조제1항제1호의 규정에 의하여 원산지를 인정하는 물품은 다음 각호와 같다.\n    1. 당해 국가의 영역에서 생산된 광산물과 식물성 생산물\n    2. 당해 국가의 영역에서 번식 또는 사육된 산 동물과 이들로부터 채취한 물품\n    3. 당해 국가의 영역에서의 수렵 또는 어로로 채집 또는 포획한 물품\n    4. 당해 국가의 선박에 의하여 채집 또는 포획한 어획물 기타의 물품\n    5. 당해 국가에서의 제조ㆍ가공의 공정 중에 발생한 부스러기\n    6. 당해 국가 또는 그 선박에서 제1호 내지 제5호의 물품을 원재료로 하여 제조ㆍ가공한 물품\n  ②법 제229조제1항제2호의 규정에 의하여 2개국 이상에 걸쳐 생산ㆍ가공 또는 제조(이하 이 조에서 “생산”이라 한다)된 물품의 원산지는 당해 물품의 생산과정에 사용되는 물품의 품목분류표상 6단위 품목번호와 다른 6단위 품목번호의 물품을 최종적으로 생산한 국가로 한다. <개정 2016. 3. 9.>\n  ③관세청장은 제2항의 규정에 의하여 6단위 품목번호의 변경만으로 법 제229조제1항제2호의 규정에 의한 본질적 특성을 부여하기에 충분한 정도의 실질적인 생산과정을 거친 것으로 인정하기 곤란한 품목에 대하여는 주요공정ㆍ부가가치 등을 고려하여 품목별로 원산지기준을 따로 정할 수 있다.\n  ④다음 각호의 1에 해당하는 작업이 수행된 국가는 제2항의 규정에 의한 원산지로 인정하지 아니한다.\n    1. 운송 또는 보세구역장치중에 있는 물품의 보존을 위하여 필요한 작업\n    2. 판매를 위한 물품의 포장개선 또는 상표표시 등 상품성 향상을 위한 개수작업\n    3. 단순한 선별ㆍ구분ㆍ절단 또는 세척작업\n    4. 재포장 또는 단순한 조립작업\n    5. 물품의 특성이 변하지 아니하는 범위안에서의 원산지가 다른 물품과의 혼합작업\n    6. 가축의 도축작업\n  ⑤관세청장은 제3항에 따른 품목별 원산지기준을 정하는 때에는 재정경제부장관 및 해당 물품의 관계부처의 장과 협의하여야 한다. <개정 2008. 12. 31., 2026. 1. 2.>\n  ⑥ 제1항부터 제5항까지의 규정에도 불구하고 수출물품에 대한 원산지 결정기준이 수입국의 원산지 결정기준과 다른 경우에는 수입국의 원산지 결정기준을 따를 수 있다. <신설 2019. 3. 20.>","R29-0":"제29조(보조금률의 산정 등) ①법 제57조의 규정에 의하여 상계관세를 부과하는 경우 상계관세는 다음의 산식에 의하여 산정된 보조금률의 범위안에서 결정한 율을 과세가격에 곱하여 산출한다.\n  <img alt=\"@@LATEX@@mathrm{보조금률} = frac{보조금등의금액}{mathrm{과세가격}} times 100@@/LATEX@@\" src=\"/LSW/flDownload.do?flSeq=22052191\" />\n  ②영 제79조제2항제1호에 따라 가중평균 상계관세율을 산정함에 있어서 보조금등을 받는 수출자가 다수인 때에는 수출자별 수출량에 따라 가중치를 둘 수 있다. 이 경우 보조금등의 금액이 과세가격의 100분의 1 미만인 수출자를 상계관세율 산정대상에서 제외할 수 있다. <개정 2024. 3. 22.>\n  ③ 재정경제부장관은 영 제79조제2항제2호에 따라 자료를 제출한 신규수출자에 대하여 영 제75조에 따른 조사를 조속히 행하여야 한다. 이 경우 실질적 피해등의 조사는 영 제79조제2항 각 호 외의 부분에 따른 수출국에 대한 실질적 피해등의 조사로 갈음할 수 있다. <개정 2008. 12. 31., 2024. 3. 22., 2026. 1. 2.>","R49-0":"제49조(휴대품 등에 대한 관세의 면제신청) 법 제96조제1항제1호에 따른 별송품 및 법 제96조제1항제2호에 따른 이사물품 중 별도로 수입하는 물품에 대하여 관세를 면제받으려는 자는 휴대반입한 주요 물품의 통관명세서를 입국지 관할 세관장으로부터 발급받아 세관장에게 제출하여야 한다. 다만, 세관장은 관세를 면제받고자 하는 자가 통관명세서를 제출하지 아니한 경우로서 그 주요 물품의 통관명세를 입국지 관할 세관장으로부터 확인할 수 있는 경우에는 통관명세서를 제출하지 아니하게 할 수 있다. <개정 2015. 2. 6.>","D67-0":"제67조(잠정덤핑방지관세액 등의 정산) ①제69조제1항의 규정에 해당되는 경우로서 법 제53조제3항의 규정에 의하여 잠정조치가 적용된 기간중에 수입된 물품에 대하여 부과하는 덤핑방지관세액이 잠정덤핑방지관세액과 같거나 많은 때에는 그 잠정덤핑방지관세액을 덤핑방지관세액으로 하여 그 차액을 징수하지 아니하며, 적은 때에는 그 차액에 상당하는 잠정덤핑방지관세액을 환급하여야 한다.\n  ②법 제53조제1항의 규정에 의하여 담보가 제공된 경우로서 제69조제1항의 규정에 해당되는 경우에는 당해 잠정조치가 적용된 기간중에 소급부과될 덤핑방지관세액이 제공된 담보금액과 같거나 많은 경우에는 그 담보금액을 덤핑방지관세액으로 하여 그 차액을 징수하지 않으며, 적은 경우에는 그 차액에 상당하는 담보를 해제해야 한다. <개정 2024. 2. 29.>\n  ③제68조제1항의 규정에 의한 약속이 제61조제5항의 규정에 의한 본조사의 결과에 따라 당해 물품에 대한 덤핑사실 및 그로 인한 실질적 피해등의 사실이 있는 것으로 판정된 후에 수락된 경우로서 조사된 최종덤핑률을 기초로 산정한 덤핑방지관세액이 잠정덤핑방지관세액 또는 제공된 담보금액과 같거나 많은 경우에는 그 차액을 징수하지 않으며, 적은 경우에는 그 차액을 환급하거나 차액에 상당하는 담보를 해제해야 한다. <개정 2024. 2. 29.>","D71-2":"제71조의2(우회덤핑의 행위 유형) ① 법 제56조의2제1항 각 호 외의 부분에서 “제51조에 따라 덤핑방지관세가 부과되는 물품의 물리적 특성이나 형태 등을 경미하게 변경하는 행위 등 대통령령으로 정하는 행위”란 다음 각 호의 어느 하나에 해당하는 행위를 말한다.\n    1. 법 제51조에 따라 덤핑방지관세가 부과되는 물품(이하 “덤핑방지관세물품”이라 한다)에 대해 해당 물품의 본질적 특성을 변경하지 않는 범위에서 물리적 특성이나 형태, 포장방법 또는 용도 등을 변경하는 행위(그 행위로 법 제84조제3호에 따른 관세ㆍ통계통합품목분류표상 품목번호가 변경되는 경우를 포함한다)\n    2. 덤핑방지관세물품의 공급국에서 생산된 원재료 또는 부분품을 제3국에서 덤핑방지관세물품과 동종물품으로 단순 조립 또는 가공하는 행위\n  ② 제1항 각 호의 어느 하나에 해당하는 행위(이하 “경미한 변경행위등”이라 한다) 여부를 판단할 때 고려해야 하는 사항은 재정경제부령으로 정한다. <개정 2025. 12. 30.>\n  [전문개정 2025. 11. 28.]","D216-2":"제216조의2(외국인관광객 등의 범위) 법 제199조의2제1항에서 “외국인 관광객 등 대통령령으로 정하는 자”란 「외국환거래법」 제3조에 따른 비거주자(이하 “외국인관광객등”이라 한다)를 말한다. 다만, 다음 각 호의 자를 제외한다. <개정 2006. 5. 22., 2011. 4. 1.>\n    1. 법인\n    2. 국내에 주재하는 외교관(이에 준하는 외국공관원을 포함한다)\n    3. 국내에 주재하는 국제연합군과 미국군의 장병 및 군무원\n  [본조신설 2004. 3. 29.]","D274-0":"제274조(업무시간과 물품취급시간) 법 제321조의 규정에 의한 세관의 업무시간과 보세구역 및 운수수단의 물품취급시간은 다음 각호의 구분에 의한다. <개정 2004. 8. 30., 2006. 5. 22., 2025. 2. 28.>\n    1. 세관의 업무시간 및 운송수단의 물품취급시간 : 「국가공무원 복무규정」에 의한 공무원의 근무시간. 다만, 항공기ㆍ선박 등이 상시 입ㆍ출항하는 등 세관의 업무특성상 필요한 경우에 세관장은 관세청장의 승인을 얻어 부서별로 근무시간을 달리 정할 수 있다.\n    2. 보세구역의 물품취급시간 : 24시간. 다만, 감시ㆍ단속을 위하여 필요한 경우 세관장은 그 시간을 제한할 수 있다.\n  [제목개정 2025. 2. 28.]","L254-2":"제254조의2(탁송품의 특별통관) ① 제241조제2항제1호의 탁송품으로서 재정경제부령으로 정하는 물품은 운송업자(제 222조제1항제6호에 따라 관세청장 또는 세관장에게 등록한 자를 말한다. 이하 “탁송품 운송업자”라 한다)가 다음 각 호에 해당하는 사항이 적힌 목록(이하 “통관목록”이라 한다)을 세관장에게 제출함으로써 제241조제1항에 따른 수입신고를 생략할 수 있다. <개정 2013. 1. 1., 2017. 12. 19., 2020. 12. 22., 2025. 10. 1.>\n    1. 물품의 발송인 및 수신인의 성명, 주소, 국가\n    2. 물품의 품명, 수량, 중량 및 가격\n    3. 탁송품의 통관목록에 관한 것으로 재정경제부령으로 정하는 사항\n  ② 탁송품 운송업자는 통관목록을 사실과 다르게 제출하여서는 아니 된다.\n  ③ 탁송품 운송업자는 제1항에 따라 제출한 통관목록에 적힌 물품수신인의 주소지(제241조제1항에 따른 수입신고를 한 탁송품의 경우에는 수입신고서에 적힌 납세의무자의 주소지)가 아닌 곳에 탁송품을 배송하거나 배송하게 한 경우에는 배송한 날이 속하는 달의 다음달 15일까지 실제 배송한 주소지를 세관장에게 제출하여야 한다. 다만, 탁송품 운송업자와 실제 배송한 자가 다른 경우 탁송품 운송업자는 실제 배송한 자로 하여금 세관장에게 실제 배송한 주소지를 제출하게 할 수 있다.<신설 2014. 1. 1., 2017. 12. 19., 2020. 12. 22., 2025. 12. 23.>\n  ④ 세관장은 탁송품 운송업자가 제2항 또는 제3항을 위반하거나 이 법에 따라 통관이 제한되는 물품을 국내에 반입하는 경우에는 제1항에 따른 통관절차의 적용을 배제할 수 있다.<개정 2014. 1. 1.>\n  ⑤ 관세청장 또는 세관장은 탁송품에 대하여 세관공무원으로 하여금 검사하게 하여야 하며, 탁송품의 통관목록의 제출시한, 실제 배송지의 제출, 물품의 검사 등에 필요한 사항은 관세청장이 정하여 고시한다.<개정 2011. 12. 31., 2014. 1. 1.>\n  ⑥ 세관장은 관세청장이 정하는 절차에 따라 별도로 정한 지정장치장에서 탁송품을 통관하여야 한다. 다만, 세관장은 탁송품에 대한 감시ㆍ단속에 지장이 없다고 인정하는 경우 탁송품을 해당 탁송품 운송업자가 운영하는 보세창고 또는 시설(「자유무역지역의 지정 및 운영에 관한 법률」 제11조에 따라 입주계약을 체결하여 입주한 업체가 해당 자유무역지역에서 운영하는 시설에 한정한다)에서 통관할 수 있다.<신설 2013. 1. 1., 2014. 1. 1., 2016. 1. 27.>\n  ⑦ 세관장은 제1항에 따른 통관절차가 적용되지 아니하는 탁송품으로서 제5항에 따른 검사를 마치고 탁송품에 대한 감시ㆍ단속에 지장이 없다고 인정하는 경우에는 제6항에도 불구하고 관세청장이 정하는 보세구역 등에서 탁송품을 통관하게 할 수 있다.<신설 2020. 12. 22.>\n  ⑧ 제6항 단서에 따라 탁송품 운송업자가 운영하는 보세창고 또는 시설에서 통관하는 경우 그에 필요한 탁송품 검사설비 기준, 설비이용 절차, 설비이용 유효기간 등에 관하여 필요한 사항은 대통령령으로 정한다.<신설 2013. 1. 1., 2014. 1. 1., 2020. 12. 22.>\n  ⑨ 관세청장은 탁송품의 신속한 통관과 탁송품에 대한 효율적인 감시ㆍ단속 등을 위하여 필요한 세관장과 탁송품 운송업자간 협력에 관한 사항 등 대통령령으로 정하는 사항에 대하여 고시할 수 있다.<신설 2020. 12. 22.>\n  [전문개정 2010. 12. 30.] 제255조 삭제 <2014. 12. 23.>","L93-0":"제93조(특정물품의 면세 등) 다음 각 호의 어느 하나에 해당하는 물품이 수입될 때에는 그 관세를 면제할 수 있다. <개정 2013. 3. 23., 2019. 12. 31., 2020. 6. 9., 2025. 10. 1., 2025. 12. 23.>\n    1. 동식물의 번식ㆍ양식 및 종자개량을 위한 물품 중 재정경제부령으로 정하는 물품\n    2. 박람회, 국제경기대회, 그 밖에 이에 준하는 행사 중 재정경제부령으로 정하는 행사에 사용하기 위하여 그 행사에 참가하는 자가 수입하는 물품 중 재정경제부령으로 정하는 물품\n    3. 핵사고 또는 방사능 긴급사태 시 그 복구지원과 구호를 목적으로 외국으로부터 기증되는 물품으로서 재정경제부령으로 정하는 물품\n    4. 우리나라 선박이 외국 정부의 허가를 받아 외국의 영해에서 채집하거나 포획한 수산물(이를 원료로 하여 우리나라 선박에서 제조하거나 가공한 것을 포함한다. 이하 이 조에서 같다)\n    5. 우리나라 선박이 외국의 선박과 협력하여 재정경제부령으로 정하는 방법으로 채집하거나 포획한 수산물로서 해양수산부장관이 추천하는 것\n    6. 해양수산부장관의 허가를 받은 자가 재정경제부령으로 정하는 요건에 적합하게 외국인과 합작하여 채집하거나 포획한 수산물 중 해양수산부장관이 재정경제부장관과 협의하여 추천하는 것\n    7. 우리나라 선박 등이 채집하거나 포획한 수산물과 제5호 및 제6호에 따른 수산물의 포장에 사용된 물품으로서 재사용이 불가능한 것 중 재정경제부령으로 정하는 물품\n    8. 「중소기업기본법」 제2조에 따른 중소기업이 해외구매자의 주문에 따라 제작한 기계ㆍ기구가 해당 구매자가 요구한 규격 및 성능에 일치하는지를 확인하기 위하여 하는 시험생산에 필요한 원재료로서 재정경제부령으로 정하는 요건에 적합한 물품\n    9. 우리나라를 방문하는 외국의 원수와 그 가족 및 수행원의 물품\n    10. 우리나라의 선박이나 그 밖의 운송수단이 조난으로 인하여 해체된 경우 그 해체재(解體材) 및 장비\n    11. 우리나라와 외국 간에 건설될 교량, 통신시설, 해저통로, 그 밖에 이에 준하는 시설의 건설 또는 수리에 필요한 물품\n    12. 우리나라 수출물품의 품질, 규격, 안전도 등이 수입국의 권한 있는 기관이 정하는 조건에 적합한 것임을 표시하는 수출물품에 붙이는 증표로서 재정경제부령으로 정하는 물품\n    13. 우리나라의 선박이나 항공기가 해외에서 사고로 발생한 피해를 복구하기 위하여 외국의 보험회사 또는 외국의 가해자의 부담으로 하는 수리 부분에 해당하는 물품\n    14. 우리나라의 선박이나 항공기가 매매계약상의 하자보수 보증기간 중에 외국에서 발생한 고장에 대하여 외국의 매도인의 부담으로 하는 수리 부분에 해당하는 물품\n    15. 국제올림픽ㆍ장애인올림픽ㆍ농아인올림픽 및 아시아운동경기ㆍ장애인아시아운동경기 종목에 해당하는 운동용구(부분품을 포함한다)로서 재정경제부령으로 정하는 물품\n    16. 국립묘지의 건설ㆍ유지 또는 장식을 위한 자재와 국립묘지에 안장되는 자의 관ㆍ유골함 및 장례용 물품\n    17. 피상속인이 사망하여 국내에 주소를 둔 자에게 상속되는 피상속인의 신변용품\n    18. 보석의 원석(原石) 및 나석(裸石)으로서 재정경제부령으로 정하는 것\n    19. 「해외자원개발 사업법」 제2조제5호에 따른 해외자원개발사업자가 같은 조 제4호에 따른 해외자원개발을 통하여 확보한 자원 중 「국가자원안보 특별법」 제2조제1호나목에 따른 핵심광물로서 재정경제부령으로 정하는 것\n  [전문개정 2010. 12. 30.]","R4-3":"제4조의3(운임 등의 결정) ① 영 제20조제2항에 따른 운임은 다음 각 호에 따른다.\n    1. 법 제241조제2항제3호의2가목에 따른 운송수단이 외국에서 우리나라로 운항하여 수입되는 경우: 해당 운송수단이 수출항으로부터 수입항에 도착할 때까지의 연료비, 승무원의 급식비, 급료, 수당, 선원 등의 송출비용 및 그 밖의 비용 등 운송에 실제로 소요되는 금액\n    2. 하나의 용선계약으로 여러가지 화물을 여러 차례에 걸쳐 왕복운송하거나 여러가지 화물을 하나의 운송계약에 따라 일괄운임으로 지급하는 경우: 수입되는 물품의 중량을 기준으로 계산하여 배분한 운임. 다만, 수입되는 물품의 중량을 알 수 없거나 중량을 기준으로 계산하는 것이 현저히 불합리한 경우에는 가격을 기준으로 계산하여 배분한 운임으로 한다.\n    3. 운송계약상 선적항 및 수입항의 구분 없이 총 허용정박 시간만 정하여 체선료(滯船料) 또는 조출료(早出料)의 발생장소를 명확히 구분할 수 없는 경우: 총 허용정박 시간을 선적항과 수입항에서의 허용 정박시간으로 반분(半分)하여 계산된 선적항에서의 체선료를 포함한 운임. 이 경우 실제 공제받은 조출료는 운임에 포함하지 않는다.\n    4. 법 제254조의2제6항에 따라 통관하는 탁송품으로서 그 운임을 알 수 없는 경우: 관세청장이 정하는 탁송품 과세운임표에 따른 운임\n  ② 영 제20조제3항에서 “재정경제부령으로 정하는 물품”이란 다음 각 호의 어느 하나에 해당하는 물품을 말한다. <개정 2021. 3. 16., 2026. 1. 2.>\n    1. 무상으로 반입하는 상품의 견본, 광고용품 및 그 제조용 원료로서 운임 및 보험료를 제외한 총 과세가격이 20만원 이하인 물품\n    2. 수출물품의 제조ㆍ가공에 사용할 외화획득용 원재료로서 세관장이 수출계약의 이행에 필요하다고 인정하여 무상으로 반입하는 물품\n    3. 계약조건과 다르거나 하자보증기간 안에 고장이 생긴 수입물품을 대체ㆍ수리 또는 보수하기 위해 무상으로 반입하는 물품\n    4. 계약조건과 다르거나 하자보증 기간 안에 고장이 생긴 수입물품을 외국으로 반출한 후 이를 수리하여 무상으로 반입하는 물품으로서 운임 및 보험료를 제외한 총 과세가격이 20만원 이하인 물품\n    5. 계약조건과 다르거나 하자보증 기간 안에 고장이 생긴 수출물품을 수리 또는 대체하기 위해 무상으로 반입하는 물품\n    6. 신문사, 방송국 또는 통신사에서 반입하는 뉴스를 취재한 사진필름, 녹음테이프 및 이와 유사한 취재물품\n    7. 우리나라의 거주자가 받는 물품으로서 자가 사용할 것으로 인정되는 것 중 운임 및 보험료를 제외한 총 과세가격이 20만원 이하인 물품\n    8. 제48조의2제1항에 따른 우리나라 국민, 외국인 또는 재외영주권자가 입국할 때 반입하는 이사화물로서 운임 및 보험료를 제외한 총 과세가격이 50만원 이하인 물품\n    9. 여행자가 휴대하여 반입하는 물품\n    10. 항공사가 자기 소유인 운송수단으로 운송하여 반입하는 항공기용품과 외국의 본사 또는 지사로부터 무상으로 송부받은 해당 운송사업에 사용할 소모품 및 사무용품\n    11. 항공기 외의 일반적인 운송방법으로 운송하기로 계약된 물품으로서 해당 물품의 제작지연, 그 밖에 수입자의 귀책사유가 아닌 사유로 수출자가 그 운송방법의 변경에 따른 비용을 부담하고 항공기로 운송한 물품\n    12. 항공기 외의 일반적인 운송방법으로 운송하기로 계약된 물품으로서 천재지변이나 영 제2조제1항 각 호에 해당하는 사유로 운송수단을 변경하거나 해외 거래처를 변경하여 항공기로 긴급하게 운송하는 물품\n  ③ 제2항 각 호의 물품은 다음 각 호의 구분에 따라 운임을 산출한다. 이 경우 다음 각 호의 적용 운임이 실제 발생한 항공운임을 초과하는 경우에는 해당 항공운임을 적용한다.\n    1. 제2항제1호부터 제9호까지의 물품: 우리나라에서 적용하고 있는 선편소포우편물요금표에 따른 요금. 이 경우 물품의 중량이 선편소포우편물요금표에 표시된 최대중량을 초과하는 경우에는 최대중량의 요금에 최대중량을 초과하는 중량에 해당하는 요금을 가산하여 계산한다.\n    2. 제2항제10호부터 제12호까지의 물품: 법 제225조제1항에 따른 선박회사(그 업무를 대행하는 자를 포함한다)가 해당 물품에 대해 통상적으로 적용하는 운임\n  ④ 영 제20조제3항에 따른 제2항 각 호의 물품에 대한 보험료는 보험사업자가 통상적으로 적용하는 항공기 외의 일반적인 운송방법에 대한 보험료로 계산할 수 있다.\n  [본조신설 2020. 10. 7.]","R73-3":"제73조의3(국제항 안에서 국제무역선을 이용한 보세운송) ① 법 제220조의2에서 “재정경제부령으로 정하는 선박회사”란 다음 각 호의 구분에 따른 선박회사를 말한다. <개정 2026. 1. 2.>\n    1. 제2항제1호에 따른 물품의 경우: 「해운법」 제24조제2항에 따라 외항 정기 화물운송사업의 등록을 한 선박회사\n    2. 제2항제2호에 따른 물품의 경우: 다음 각 목의 어느 하나에 해당하는 선박회사\n  가.「해운법」 제24조제2항에 따라 외항 부정기 화물운송사업의 등록을 한 선박회사\n      나. 「선박법」 제6조 단서에 따라 해양수산부장관이 허가한 외국국적 선박이 소속된 선박회사\n  ② 법 제220조의2에서 “환적물품 등 재정경제부령으로 정하는 물품”이란 다음 각 호의 물품을 말한다. <개정 2026. 1. 2.>\n    1. 환적컨테이너\n    2. 법 제2조제4호나목에 따른 외국물품으로서 관세청장이 정하여 고시하는 물품\n  [본조신설 2024. 3. 22.]","D212-0":"제212조(보세건설장외 보세작업의 허가신청) ①법 제195조제1항의 규정에 의하여 보세작업의 허가를 받고자 하는 자는 다음 각호의 사항을 기재한 신청서를 세관장에게 제출하여야 한다.\n    1. 제175조 각호의 사항\n    2. 보세작업의 종료기한 및 작업장소\n    3. 신청사유\n    4. 당해 작업에서 생산될 물품의 품명ㆍ규격 및 수량\n  ②세관장은 재해 기타 부득이한 사유로 인하여 필요하다고 인정되는 때에는 보세건설장 운영인의 신청에 의하여 보세건설장외에서의 보세작업의 기간 또는 장소를 변경할 수 있다. <개정 2001. 12. 31.>","D33-0":"제33조(수정신고) 법 제38조의3제1항의 규정에 의하여 수정신고를 하고자 하는 자는 다음 각호의 사항을 기재한 수정신고서를 세관장에게 제출하여야 한다. <개정 2004. 3. 29.>\n    1. 당해 물품의 수입신고번호와 품명ㆍ규격 및 수량\n    2. 수정신고전의 당해 물품의 품목분류ㆍ과세표준ㆍ세율 및 세액\n    3. 수정신고후의 당해 물품의 품목분류ㆍ과세표준ㆍ세율 및 세액\n    4. 가산세액\n    5. 기타 참고사항","L40-0":"제40조(징수금액의 최저한) 세관장은 납세의무자가 납부하여야 하는 세액이 대통령령으로 정하는 금액 미만인 경우에는 이를 징수하지 아니한다.\n  [전문개정 2010. 12. 30.] 제41조 삭제 <2019. 12. 31.>","R21-0":"제21조(보조금등의 범위) ①영 제72조제1항 단서에서 “재정경제부령이 정하는 보조금 또는 장려금”이란 영 제72조제2항의 규정에 의한 특정성은 있으나 연구ㆍ지역개발 및 환경관련 보조금 또는 장려금(이하 “보조금등”이라 한다)으로서 국제협약에서 인정하고 있는 것을 말한다. <개정 2008. 12. 31., 2026. 1. 2.>\n  ②다음 각호의 1에 해당되는 경우에는 영 제72조제2항의 규정에 의한 특정성이 있는 것으로 본다.\n    1. 보조금등이 일부 기업 등에 대하여 제한적으로 지급되는 경우\n    2. 보조금등이 제한된 수의 기업 등에 의하여 사용되어지는 경우\n    3. 보조금등이 특정한 지역에 한정되어 지급되는 경우\n    4. 기타 국제협약에서 인정하고 있는 특정성의 기준에 부합되는 경우\n  ③영 제72조제3항의 규정에 의하여 보조금등의 금액을 산정함에 있어서는 다음 각호의 기준에 의한다.\n    1. 지분참여의 경우 : 당해 지분참여와 통상적인 투자와의 차이에 의하여 발생하는 금액 상당액\n    2. 대출의 경우 : 당해 대출금리에 의하여 지불하는 금액과 시장금리에 의하여 지불하는 금액과의 차액 상당액\n    3. 대출보증의 경우 : 당해 대출에 대하여 지불하는 금액과 대출보증이 없을 경우 비교가능한 상업적 차입에 대하여 지불하여야 하는 금액과의 차액 상당액\n    4. 재화ㆍ용역의 공급 또는 구매의 경우 : 당해 가격과 시장가격과의 차이에 의하여 발생하는 금액 상당액\n    5. 기타 국제협약에서 인정하고 있는 기준에 의한 금액","D18-0":"제18조(무료 또는 인하된 가격으로 공급하는 물품 및 용역의 범위) 법 제30조제1항제3호에서 “대통령령으로 정하는 물품 및 용역”이란 구매자가 직접 또는 간접으로 공급하는 것으로서 다음 각 호의 어느 하나에 해당하는 것을 말한다. <개정 2005. 6. 30., 2008. 2. 29., 2011. 4. 1., 2025. 12. 30., 2026. 2. 27.>\n    1. 수입물품에 결합되는 재료ㆍ구성요소ㆍ부분품 및 그 밖에 이와 비슷한 물품\n    2. 수입물품의 생산에 사용되는 공구ㆍ금형ㆍ다이스 및 그 밖에 이와 비슷한 물품으로서 재정경제부령으로 정하는 것\n    3. 수입물품의 생산과정에 소비되는 물품\n    4. 수입물품의 생산에 필요한 기술ㆍ개발ㆍ설계ㆍ고안ㆍ공예 및 디자인. 다만, 우리나라에서 수행된 것은 제외한다.","L322-0":"제322조(통계 및 증명서의 작성 및 교부 등) ① 관세청장은 다음 각 호의 사항에 관한 통계를 작성하고 그 열람이나 교부를 신청하는 자가 있으면 이를 열람하게 하거나 교부하여야 한다. <개정 2020. 12. 22., 2021. 12. 21.>\n    1. 수출하거나 수입한 화물에 관한 사항\n    2. 입항하거나 출항한 국제무역선 및 국제무역기에 관한 사항\n    2의2. 수입물품에 대한 관세 및 내국세등에 관한 사항\n    3. 그 밖에 외국무역과 관련하여 관세청장이 필요하다고 인정하는 사항\n  ② 관세청장은 제1항에 따라 통계를 집계하고 대통령령으로 정하는 바에 따라 정기적으로 그 내용을 공표할 수 있다.\n  ③ 제1항에 따른 통계 외 통관 관련 세부 통계자료를 열람하거나 교부받으려는 자는 사용 용도 및 내용을 구체적으로 밝혀 관세청장에게 신청할 수 있다. 이 경우 관세청장은 대통령령으로 정하는 경우를 제외하고는 이를 열람하게 하거나 교부하여야 한다.\n  ④ 관세청장은 제1항에 따른 통계 및 제3항에 따른 통계자료를 전산처리가 가능한 전달매체에 기록하여 교부하거나 전산처리설비를 이용하여 교부할 수 있다. 이 경우 교부할 수 있는 통계의 범위와 그 절차는 관세청장이 정한다.\n  ⑤ 관세청장은 제1항에 따른 통계, 제3항에 따른 통계자료 및 제4항에 따른 통계의 작성 및 교부 업무를 대행할 자(이하 이 조에서 “대행기관”이라 한다)를 지정하여 그 업무를 대행하게 할 수 있다. 이 경우 관세청장은 통계작성을 위한 기초자료를 대행기관에 제공하여야 한다.<개정 2011. 12. 31.>\n  ⑥ 세관사무에 관한 증명서와 제1항에 따른 통계, 제3항에 따른 통계자료 및 제4항에 따른 통계를 교부받으려는 자는 재정경제부령으로 정하는 바에 따라 관세청장에게 수수료를 납부하여야 한다. 다만, 제5항에 따라 대행기관이 업무를 대행하는 경우에는 대행기관이 정하는 수수료를 해당 대행기관에 납부하여야 한다.<개정 2011. 12. 31., 2025. 10. 1.>\n  ⑦ 대행기관은 제6항 단서에 따라 수수료를 정할 때에는 재정경제부령으로 정하는 바에 따라 관세청장의 승인을 받아야 한다. 승인을 받은 사항을 변경하려는 경우에도 또한 같다.<신설 2011. 12. 31., 2025. 10. 1.>\n  ⑧ 제6항 단서에 따라 대행기관이 수수료를 징수한 경우 그 수입은 해당 대행기관의 수입으로 한다.<신설 2011. 12. 31.>\n  ⑨ 제6항에 따른 증명서 중 수출ㆍ수입 또는 반송에 관한 증명서는 해당 물품의 수출ㆍ수입 또는 반송 신고의 수리일부터 5년 내의 것에 관하여 발급한다.<개정 2011. 12. 31.>\n  ⑩ 관세청장은 다음 각 호의 어느 하나에 해당하는 자가 관세정책의 평가 및 연구 등에 활용하기 위하여 통계 작성에 사용된 기초자료와 관세청장이 생산ㆍ가공ㆍ분석한 데이터(이하 “관세무역데이터”라 한다)를 직접 분석하기를 원하는 경우 제116조제1항 각 호 외의 부분 본문에도 불구하고 관세청 내에 설치된 대통령령으로 정하는 시설 내에서 관세무역데이터를 그 사용목적에 맞는 범위에서 제공할 수 있다. 이 경우 관세무역데이터는 개별 납세자의 과세정보를 직접적 또는 간접적 방법으로 확인할 수 없는 상태로 제공하여야 한다.<신설 2022. 12. 31.>\n    1. 국회의원\n    2. 「국회법」에 따른 국회사무총장ㆍ국회도서관장ㆍ국회예산정책처장ㆍ국회입법조사처장 및 「국회미래연구원법」에 따른 국회미래연구원장\n    3. 「정부조직법」 제2조에 따른 중앙행정기관의 장\n    4. 「지방자치법」 제2조에 따른 지방자치단체의 장\n    5. 「정부출연연구기관 등의 설립ㆍ운영 및 육성에 관한 법률」 제2조에 따른 정부출연연구기관의 장 등 대통령령으로 정하는 자\n  ⑪ 제1항에 따라 열람ㆍ교부된 통계(제2항에 따라 공표된 것은 제외한다), 제3항에 따라 열람ㆍ교부된 통계자료, 제4항에 따라 교부된 통계 및 제10항에 따라 제공된 관세무역데이터를 알게 된 자는 그 통계, 통계자료 및 관세무역데이터를 목적 외의 용도로 사용하여서는 아니 된다.<신설 2022. 12. 31.>\n  ⑫ 세관사무에 관한 증명서, 제1항에 따른 통계, 제3항에 따른 통계자료, 제4항에 따른 통계의 열람 또는 교부 절차, 제5항에 따른 대행기관의 지정 및 지정 해제와 제10항에 따른 관세무역데이터의 제공 절차에 필요한 사항은 대통령령으로 정한다.<신설 2022. 12. 31., 2024. 12. 31.>\n  [전문개정 2010. 12. 30.]\n  [제목개정 2022. 12. 31.]","R8-0":"제8조(수입신고수리전 세액심사 대상물품) ①법 제38조제2항 단서의 규정에 의하여 수입신고수리전에 세액심사를 하는 물품은 다음 각호와 같다. <개정 2002. 5. 10.>\n    1. 법률 또는 조약에 의하여 관세 또는 내국세를 감면받고자 하는 물품\n    2. 법 제107조의 규정에 의하여 관세를 분할납부하고자 하는 물품\n    3. 관세를 체납하고 있는 자가 신고하는 물품(체납액이 10만원 미만이거나 체납기간 7일 이내에 수입신고하는 경우를 제외한다)\n    4. 납세자의 성실성 등을 참작하여 관세청장이 정하는 기준에 해당하는 불성실신고인이 신고하는 물품\n    5. 물품의 가격변동이 큰 물품 기타 수입신고수리후에 세액을 심사하는 것이 적합하지 아니하다고 인정하여 관세청장이 정하는 물품\n  ②제1항의 규정에 의하여 수입신고수리전에 세액심사를 하는 물품중 제1항제1호 및 제2호에 규정된 물품의 감면 또는 분할납부의 적정 여부에 대한 심사는 수입신고수리전에 하고, 과세가격 및 세율 등에 대한 심사는 수입신고수리후에 한다.","D1-4":"제1조의4(기한의 계산) ①법 제8조제3항에서 “대통령령으로 정하는 날”이란 금융기관(한국은행 국고대리점 및 국고수납대리점인 금융기관에 한한다. 이하 같다) 또는 체신관서의 휴무, 그 밖에 부득이한 사유로 인하여 정상적인 관세의 납부가 곤란하다고 관세청장이 정하는 날을 말한다. <개정 2007. 4. 5., 2011. 4. 1., 2012. 2. 2.>\n  ②정전, 프로그램의 오류, 한국은행(그 대리점을 포함한다) 또는 체신관서의 정보처리장치의 비정상적인 가동이나 그 밖에 관세청장이 정하는 사유로 법 제327조에 따른 국가관세종합정보시스템, 연계정보통신망 또는 전산처리설비의 가동이 정지되어 법에 따른 신고ㆍ신청ㆍ승인ㆍ허가ㆍ수리ㆍ교부ㆍ통지ㆍ통고ㆍ납부 등을 기한까지 할 수 없게 된 때에는 법 제8조제4항에 따라 해당 국가관세종합정보시스템, 연계정보통신망 또는 전산처리설비의 장애가 복구된 날의 다음 날을 기한으로 한다. <개정 2002. 12. 30., 2009. 2. 4., 2021. 2. 17., 2024. 2. 29.>\n  [제1조의2에서 이동 <2013. 2. 15.>]","D113-0":"제113조(제조ㆍ수리공장의 지정) ①법 제89조제1항의 규정에 의한 제조ㆍ수리공장의 지정을 받고자 하는 자는 다음 각호의 사항을 기재한 신청서에 사업계획서와 그 구역 및 부근의 도면을 첨부하여 세관장에게 제출하여야 한다. <개정 2002. 12. 30.>\n    1. 당해 제조ㆍ수리공장의 명칭ㆍ소재지ㆍ구조ㆍ동수 및 평수\n    2. 제조하는 제품의 품명과 그 원재료 및 부분품의 품명\n    3. 작업설비와 그 능력\n    4. 지정을 받고자 하는 기간\n  ②제1항에 따른 신청을 받은 세관장은 그 감시ㆍ단속에 지장이 없다고 인정되는 때에는 10년의 범위내에서 기간을 정하여 제조ㆍ수리공장을 지정해야 한다. 이 경우 지정기간은 관세청장이 정하는 바에 따라 경신할 수 있다. <개정 2002. 12. 30., 2026. 2. 27.>\n  ③세관장은 법 제89조제1항에 따라 항공기의 수리가 일시적으로 이루어지는 공항 내의 특정지역이 감시ㆍ단속에 지장이 없고, 세율불균형물품의 관세 감면 관리 업무의 효율화를 위하여 필요하다고 인정되는 경우에는 제1항 및 제2항에 따라 해당 특정지역을 제조ㆍ수리공장으로 지정할 수 있다. <신설 2002. 12. 30., 2021. 2. 17.>\n  ④ 삭제 <2017. 3. 27.>","D275-0":"제275조(임시업무 및 시간외 물품취급) ①법 제8조제3항제1호부터 제3호까지에 해당하는 날 또는 법 제321조제2항에 따라 업무시간외에 통관절차ㆍ보세운송절차 또는 입출항절차를 밟고자 하는 자는 사무의 종류 및 시간과 사유를 기재한 통보서를 세관장에게 제출해야 한다. 다만, 법 제241조에 따라 신고를 해야 하는 우편물외의 우편물에 대해서는 그렇지 않다. <개정 2023. 2. 28., 2025. 2. 28.>\n  ②법 제321조제2항에 따라 물품취급시간외에 물품의 취급을 하려는 자는 다음 각 호의 어느 하나에 해당하는 경우를 제외하고는 통보서를 세관장에게 제출하여야 한다. <개정 2008. 2. 22., 2016. 2. 5.>\n    1. 우편물(법 제241조의 규정에 의하여 신고를 하여야 하는 것은 제외한다)을 취급하는 경우\n    2. 제1항의 규정에 의하여 통보한 시간내에 당해 물품의 취급을 하는 경우\n    3. 보세공장에서 보세작업을 하는 경우. 다만, 감시ㆍ단속에 지장이 있다고 세관장이 인정할 때에는 예외로 한다.\n    4. 보세전시장 또는 보세건설장에서 전시ㆍ사용 또는 건설공사를 하는 경우\n    5. 수출신고수리시 세관의 검사가 생략되는 수출물품을 취급하는 경우\n    5의2. 제155조제1항에 따른 항구나 공항에서 하역작업을 하는 경우\n    6. 재해 기타 불가피한 사유로 인하여 당해 물품을 취급하는 경우. 이 경우에는 사후에 경위서를 세관장에게 제출하여 그 확인을 받아야 한다.\n  ③제1항의 규정에 의한 통보서에는 다음 각호의 사항을 기재하여야 한다.\n    1. 당해 물품의 내외국물품의 구분과 품명 및 수량\n    2. 포장의 종류ㆍ번호 및 개수\n    3. 취급물품의 종류\n    4. 물품취급의 시간 및 장소\n  ④법 제321조제2항의 규정에 의한 사전통보는 부득이한 경우를 제외하고는 「국가공무원 복무규정」에 의한 공무원의 근무시간내에 하여야 한다. <개정 2006. 5. 22.>\n  [제목개정 2025. 2. 28.]","L248-0":"제248조(신고의 수리) ① 세관장은 제241조 또는 제244조에 따른 신고가 이 법에 따라 적합하게 이루어졌을 때에는 이를 지체 없이 수리하고 신고인에게 신고필증을 발급하여야 한다. 다만, 제327조제2항에 따라 국가관세종합정보시스템의 전산처리설비를 이용하여 신고를 수리하는 경우에는 관세청장이 정하는 바에 따라 신고인(신고 명의인이 화주가 아닌 경우에는 화주를 포함한다)이 직접 전산처리설비를 이용하여 신고필증을 발급받을 수 있다. <개정 2023. 12. 31., 2024. 12. 31.>\n  ② 세관장은 관세를 납부하여야 하는 물품에 대하여는 제241조 또는 제244조에 따른 신고를 수리할 때에 다음 각 호의 어느 하나에 해당하는 자에게 관세에 상당하는 담보의 제공을 요구할 수 있다.\n    1. 이 법 또는 「수출용원재료에 대한 관세 등 환급에 관한 특례법」 제23조를 위반하여 징역형의 실형을 선고받고 그 집행이 끝나거나(집행이 끝난 것으로 보는 경우를 포함한다) 면제된 후 2년이 지나지 아니한 자\n    2. 이 법 또는 「수출용원재료에 대한 관세 등 환급에 관한 특례법」 제23조를 위반하여 징역형의 집행유예를 선고받고 그 유예기간 중에 있는 자\n    3. 제269조부터 제271조까지, 제274조, 제275조의2, 제275조의3 또는 「수출용원재료에 대한 관세 등 환급에 관한 특례법」 제23조에 따라 벌금형 또는 통고처분을 받은 자로서 그 벌금형을 선고받거나 통고처분을 이행한 후 2년 이 지나지 아니한 자\n    4. 제241조 또는 제244조에 따른 수입신고일을 기준으로 최근 2년간 관세 등 조세를 체납한 사실이 있는 자\n    5. 수입실적, 수입물품의 관세율 등을 고려하여 대통령령으로 정하는 관세채권의 확보가 곤란한 경우에 해당하는 자\n  ③ 제1항에 따른 신고수리 전에는 운송수단, 관세통로, 하역통로 또는 이 법에 따른 장치 장소로부터 신고된 물품을 반출하여서는 아니 된다.\n  [전문개정 2010. 12. 30.]","D135-0":"제135조(납세자권리헌장의 교부시기) 법 제110조제2항제3호에서 “대통령령으로 정하는 경우”란 다음 각 호의 어느 하나에 해당하는 경우를 말한다. <개정 2011. 4. 1.>\n    1. 징수권의 확보를 위하여 압류를 하는 경우\n    2. 보세판매장에 대한 조사를 하는 경우","L65-0":"제65조(긴급관세의 부과대상 등) ① 특정물품의 수입증가로 인하여 동종물품 또는 직접적인 경쟁관계에 있는 물품을 생산하는 국내산업(이하 이 조에서 “국내산업”이라 한다)이 심각한 피해를 받거나 받을 우려(이하 이 조에서 “심각한 피해등”이라 한다)가 있음이 조사를 통하여 확인되고 해당 국내산업을 보호할 필요가 있다고 인정되는 경우에는 해당 물품에 대하여 심각한 피해등을 방지하거나 치유하고 조정을 촉진(이하 “피해의 구제등”이라 한다)하기 위하여 필요한 범위에서 관세(이하 “긴급관세”라 한다)를 추가하여 부과할 수 있다.\n  ② 긴급관세는 해당 국내산업의 보호 필요성, 국제통상관계, 긴급관세 부과에 따른 보상 수준 및 국민경제 전반에 미치는 영향 등을 검토하여 부과 여부와 그 내용을 결정한다.\n  ③ 재정경제부장관은 긴급관세를 부과하는 경우에는 이해당사국과 긴급관세부과의 부정적 효과에 대한 적절한 무역보상방법에 관하여 협의를 할 수 있다.<개정 2025. 10. 1.>\n  ④ 긴급관세의 부과와 제66조제1항에 따른 잠정긴급관세의 부과는 각각의 부과조치 결정 시행일 이후 수입되는 물품에 한정하여 적용한다.\n  ⑤ 긴급관세의 부과기간은 4년을 초과할 수 없으며, 제66조제1항에 따른 잠정긴급관세는 200일을 초과하여 부과할 수 없다. 다만, 제67조에 따른 재심사의 결과에 따라 부과기간을 연장하는 경우에는 잠정긴급관세의 부과기간, 긴급관세의 부과기간, 「대외무역법」 제39조제1항에 따른 수입수량제한 등(이하 이 조와 제66조에서 “수입수량제한등”이라 한다)의 적용기간 및 그 연장기간을 포함한 총 적용기간은 8년을 초과할 수 없다.\n  ⑥ 긴급관세 또는 제66조제1항에 따른 잠정긴급관세를 부과하여야 하는 대상 물품, 세율, 적용기간, 수량, 수입관리방안, 그 밖에 필요한 사항은 재정경제부령으로 정한다.<개정 2025. 10. 1.>\n  ⑦ 재정경제부장관은 긴급관세 또는 제66조제1항에 따른 잠정긴급관세의 부과 여부를 결정하기 위하여 필요하다고 인정되는 경우에는 관계 행정기관의 장 및 이해관계인 등에게 관련 자료의 제출 등 필요한 협조를 요청할 수 있다.<개정 2025. 10. 1.>\n  [전문개정 2010. 12. 30.]","R7-3":"제7조의3(여행자 휴대품ㆍ우편물등의 과세가격의 결정) ① 영 제29조제3항제2호에 따른 여행자 또는 승무원의 휴대품ㆍ우편물ㆍ탁송품 및 별송품(이하 “여행자 휴대품ㆍ우편물등”이라 한다)의 과세가격을 결정하는 때에는 다음 각 호의 가격을 기초로 하여 결정할 수 있다.\n    1. 신고인의 제출 서류에 명시된 신고인의 결제금액(명칭 및 형식에 관계없이 모든 성격의 지급수단으로 결제한 금액을 말한다)\n    2. 외국에서 통상적으로 거래되는 가격으로서 객관적으로 조사된 가격\n    3. 해당 물품과 동종ㆍ동질물품 또는 유사물품의 국내도매가격에 관세청장이 정하는 시가역산율을 적용하여 산출한 가격\n    4. 관련 법령에 따른 감정기관의 감정가격\n    5. 중고 승용차(화물자동차를 포함한다) 및 이륜자동차에 대해 제1호 또는 제2호를 적용하는 경우 최초 등록일 또는 사용일부터 수입신고일까지의 사용으로 인한 가치감소에 대해 관세청장이 정하는 기준을 적용하여 산출한 가격\n    6. 그 밖에 신고인이 제시하는 가격으로서 세관장이 타당하다고 인정하는 가격\n  ② 제1항제3호의 국내도매가격을 산출하려는 경우에는 다음 각 호의 방법에 따른다.\n    1. 해당 물품과 동종ㆍ동질물품 또는 유사물품을 취급하는 2곳 이상의 수입물품 거래처(인터넷을 통한 전자상거래처를 포함한다)의 국내도매가격을 조사해야 한다. 다만, 다음 각 목의 경우에는 1곳의 수입물품 거래처만 조사하는 등 국내도매가격 조사방법을 신축적으로 적용할 수 있다.\n      가. 국내도매가격이 200만원 이하인 물품으로 신속한 통관이 필요한 경우\n      나. 물품 특성상 2곳 이상의 거래처를 조사할 수 없는 경우\n      다. 과세가격 결정에 지장이 없다고 세관장이 인정하는 경우\n    2. 제1호에 따라 조사된 가격이 둘 이상인 경우에는 다음 각 목에 따라 국내도매가격을 결정한다.\n      가. 조사된 가격 중 가장 낮은 가격을 기준으로 최고가격과 최저가격의 차이가 10%를 초과하는 경우에는 조사된 가격의 평균가격\n      나. 조사된 가격 중 가장 낮은 가격을 기준으로 최고가격과 최저가격의 차이가 10% 이하인 경우에는 조사된 가격 중 최저가격\n  ③ 제1항제3호의 시가역산율은 국내도매가격에서 법 제33조제1항제2호부터 제4호까지의 금액을 공제하여 과세가격을 산정하기 위한 비율을 말하며, 산출방법은 관세청장이 정하는 바에 따른다.\n  [본조신설 2020. 10. 7.]","L68-0":"제68조(농림축산물에 대한 특별긴급관세) ① 제73조에 따라 국내외 가격차에 상당한 율로 양허한 농림축산물의 수입물량이 급증하거나 수입가격이 하락하는 경우에는 대통령령으로 정하는 바에 따라 양허한 세율을 초과하여 관세(이하 “특별긴급관세”라 한다)를 부과할 수 있다.\n  ② 특별긴급관세를 부과하여야 하는 대상 물품, 세율, 적용시한, 수량 등은 재정경제부령으로 정한다.<개정 2025. 10. 1.>\n  [전문개정 2010. 12. 30.]","D106-0":"제106조(특정물품에 적용될 품목분류의 사전심사 등) ①법 제86조제1항ㆍ제3항 및 법 제87조제3항에 따라 특정물품에 적용될 품목분류의 사전심사 또는 재심사(이하 이 조에서 “사전심사 또는 재심사”라 한다)를 신청하려는 자는 관세청장에게 다음 각 호의 서류 및 물품을 제출하여야 한다. 다만, 관세청장은 물품의 성질상 견본을 제출하기 곤란한 물품으로서 견본이 없어도 품목분류 심사에 지장이 없고, 해당 물품의 통관 시에 세관장이 이를 확인할 수 있다고 인정되는 때에는 제2호에 따른 견본의 제출을 생략하게 할 수 있다. <개정 2015. 2. 6.>\n    1. 물품의 품명ㆍ규격ㆍ제조과정ㆍ원산지ㆍ용도ㆍ통관예정세관 및 신청사유 등을 기재한 신청서\n    2. 신청대상물품의 견본\n    3. 그 밖의 설명자료\n  ②관세청장은 제1항에 따라 제출된 신청서와 견본 및 그 밖의 설명자료가 미비하여 품목분류를 심사하기가 곤란한 때에는 20일 이내의 기간을 정하여 보정을 요구할 수 있다. <개정 2015. 2. 6.>\n  ③ 관세청장은 사전심사 또는 재심사의 신청이 다음 각 호의 어느 하나에 해당하는 경우에는 해당 신청을 반려할 수 있다. <개정 2015. 2. 6., 2020. 2. 11., 2025. 12. 30.>\n    1. 제2항에 따른 보정기간 내에 보정하지 아니한 경우\n    2. 신청인이 사전심사 또는 재심사를 신청한 물품과 동일한 물품을 이미 수출입신고한 경우\n    3. 신청인이 반려를 요청하는 경우\n    4. 이의신청 등 불복 또는 소송이 진행 중인 경우\n    5. 그 밖에 사전심사 또는 재심사가 곤란한 경우로서 재정경제부령으로 정하는 경우\n  ④ 법 제86조제2항 본문에서 “대통령령으로 정하는 기간”이란 사전심사의 신청을 받은 날부터 30일(다음 각 호의 기간은 제외한다)을 말한다. <개정 2019. 2. 12., 2023. 2. 28.>\n    1. 법 제85조제2항에 따라 관세품목분류위원회에서 사전심사를 심의하는 경우 해당 심의에 소요되는 기간\n    2. 제2항에 따른 보정기간\n    3. 해당 물품에 대한 구성재료의 물리적ㆍ화학적 분석이 필요한 경우로서 해당 분석에 소요되는 기간\n    4. 관세협력이사회에 질의하는 경우 해당 질의에 소요되는 기간\n    5. 전문기관에 기술 자문을 받는 경우 해당 자문에 걸리는 기간\n    6. 다른 기관의 의견을 들을 필요가 있는 경우 해당 의견을 듣는 데 걸리는 기간\n    7. 신청인의 의견 진술이 필요한 경우 관세청장이 정하는 절차를 거치는 데 걸리는 기간\n  ⑤ 관세청장은 법 제86조제2항에 따라 품목분류를 심사하여 신청인에게 통지하는 경우에는 통관예정세관장에게도 그 내용을 통지하여야 한다. 이 경우 설명자료를 함께 송부하여야 한다. <신설 2015. 2. 6.>\n  ⑥ 관세청장은 법 제86조제2항에 따라 품목분류를 심사할 때 신청인이 법 별표 관세율표에 따른 호 및 소호까지의 품목분류에 대한 심사를 요청하는 경우에는 해당 번호까지의 품목분류에 대해서만 심사하여 통지할 수 있다. <신설 2019. 9. 24.>\n  ⑦ 법 제86조제3항 후단에서 “대통령령으로 정하는 기간”이란 재심사의 신청을 받은 날부터 60일(법 제85조제2항에 따라 관세품목분류위원회에서 재심사를 심의하는 경우 해당 심의에 소요되는 기간과 제4항제2호부터 제7호까지에 해당하는 기간은 제외한다)을 말한다. <신설 2019. 2. 12., 2019. 9. 24., 2024. 2. 29.>\n  ⑧ 관세청장은 법 제86조제3항 또는 법 제87조제3항에 따라 재심사를 신청한 물품이 다음 각 호의 어느 하나에 해당하는 경우에는 관세품목분류위원회의 심의에 부쳐야 한다. <신설 2019. 2. 12., 2019. 9. 24., 2024. 2. 29.>\n    1. 해당 물품의 품목분류가 변경될 경우 등 납세자(수출자를 포함한다)의 권리 및 의무에 중대한 영향을 미칠 수 있다고 판단되는 경우\n    2. 법 별표 관세율표, 품목분류 적용기준 및 품목분류표에 대하여 사전(事前)적 해석이 필요하다고 판단되는 경우\n    3. 그 밖에 제1호 및 제2호와 유사한 경우로서 관세청장이 정하여 고시하는 경우\n  [제목개정 2015. 2. 6.]","L118-0":"제118조(과세전적부심사) ① 세관장은 제38조의3제6항 또는 제39조제2항에 따라 납부세액이나 납부하여야 하는 세액에 미치지 못한 금액을 징수하려는 경우에는 미리 납세의무자에게 그 내용을 서면으로 통지하여야 한다. 다만, 다음 각 호의 어느 하나에 해당하는 경우에는 통지를 생략할 수 있다. <개정 2011. 12. 31., 2016. 12. 20., 2021. 12. 21.>\n    1. 통지하려는 날부터 3개월 이내에 제21조에 따른 관세부과의 제척기간이 만료되는 경우\n    2. 제28조제2항에 따라 납세의무자가 확정가격을 신고한 경우\n    3. 제38조제2항 단서에 따라 수입신고 수리 전에 세액을 심사하는 경우로서 그 결과에 따라 부족세액을 징수하는 경우\n    4. 제97조제3항(제98조제2항에 따라 준용되는 경우를 포함한다)에 따라 면제된 관세를 징수하거나 제102조제2항에 따라 감면된 관세를 징수하는 경우\n    5. 제270조에 따른 관세포탈죄로 고발되어 포탈세액을 징수하는 경우\n    6. 그 밖에 관세의 징수가 곤란하게 되는 등 사전통지가 적당하지 아니한 경우로서 대통령령으로 정하는 경우\n  ② 납세의무자는 제1항에 따른 통지를 받았을 때에는 그 통지를 받은 날부터 30일 이내에 재정경제부령으로 정하는 세관장에게 통지 내용이 적법한지에 대한 심사(이하 이 조에서 “과세전적부심사”라 한다)를 청구할 수 있다. 다만, 법령에 대한 관세청장의 유권해석을 변경하여야 하거나 새로운 해석이 필요한 경우 등 대통령령으로 정하는 경우에는 관세청장에게 이를 청구할 수 있다.<개정 2025. 10. 1.>\n  ③ 과세전적부심사를 청구받은 세관장이나 관세청장은 그 청구를 받은 날부터 30일 이내에 제118조의4제9항 전단에 따른 관세심사위원회의 심사를 거쳐 결정을 하고, 그 결과를 청구인에게 통지하여야 한다. 다만, 과세전적부심사청구기간이 지난 후 과세전적부심사청구가 제기된 경우 등 대통령령으로 정하는 사유에 해당하는 경우에는 해당 위원회의 심사를 거치지 아니하고 결정할 수 있다.<개정 2011. 12. 31., 2015. 12. 15., 2022. 12. 31.>\n  ④ 과세전적부심사 청구에 대한 결정은 다음 각 호의 구분에 따른다.<개정 2017. 12. 19.>\n    1. 청구가 이유 없다고 인정되는 경우: 채택하지 아니한다는 결정\n    2. 청구가 이유 있다고 인정되는 경우: 청구의 전부 또는 일부를 채택하는 결정. 이 경우 구체적인 채택의 범위를 정하기 위하여 사실관계 확인 등 추가적으로 조사가 필요한 경우에는 제1항 본문에 따른 통지를 한 세관장으로 하여금 이를 재조사하여 그 결과에 따라 당초 통지 내용을 수정하여 통지하도록 하는 재조사 결정을 할 수 있다.\n    3. 청구기간이 지났거나 보정기간 내에 보정하지 아니하는 경우 또는 적법하지 아니한 청구를 하는 경우: 심사하지 아니한다는 결정\n  ⑤ 제1항 각 호 외의 부분 본문에 따른 통지를 받은 자는 과세전적부심사를 청구하지 아니하고 통지를 한 세관장에게 통지받은 내용의 전부 또는 일부에 대하여 조기에 경정해 줄 것을 신청할 수 있다. 이 경우 해당 세관장은 즉시 신청받은 대로 세액을 경정하여야 한다.<신설 2011. 12. 31.>\n  ⑥ 과세전적부심사에 관하여는 제121조제3항, 제122조제2항, 제123조, 제126조, 제127조제3항, 제128조제4항부터 제6항까지, 제129조의2 및 제130조를 준용한다.<개정 2011. 12. 31., 2017. 12. 19., 2019. 12. 31., 2020. 12. 22.>\n  ⑦ 과세전적부심사에 관하여는 「행정심판법」 제15조, 제16조, 제20조부터 제22조까지, 제29조, 제39조 및 제40조를 준용한다. 이 경우 “위원회”는 “관세심사위원회”로 본다.<신설 2011. 12. 31.>\n  ⑧ 과세전적부심사의 방법과 그 밖에 필요한 사항은 대통령령으로 정한다.<개정 2011. 12. 31.>\n  [전문개정 2010. 12. 30.]","L327-0":"제327조(국가관세종합정보시스템의 구축 및 운영) ① 관세청장은 전자통관의 편의를 증진하고, 외국세관과의 세관정보교환을 통하여 수출입의 원활화와 교역안전을 도모하기 위하여 전산처리설비와 데이터베이스에 관한 국가관세종합정보시스템(이하 “관세정보시스템”이라 한다)을 구축ㆍ운영할 수 있다. <개정 2023. 12. 31.>\n  ② 세관장은 관세청장이 정하는 바에 따라 관세정보시스템의 전산처리설비를 이용하여 이 법에 따른 신고ㆍ신청ㆍ 보고ㆍ납부 등과 법령에 따른 허가ㆍ승인 또는 그 밖의 조건을 갖출 필요가 있는 물품의 증명 및 확인신청 등(이하 “전자신고등”이라 한다)을 하게 할 수 있다.<개정 2023. 12. 31.>\n  ③ 세관장은 관세청장이 정하는 바에 따라 관세정보시스템 또는 「정보통신망 이용촉진 및 정보보호 등에 관한 법률」 제2조제1항제1호에 따른 정보통신망으로서 이 법에 따른 송달을 위하여 관세정보시스템과 연계된 정보통신망(이하 “연계정보통신망”이라 한다)을 이용하여 전자신고등의 승인ㆍ허가ㆍ수리 등에 대한 교부ㆍ통지ㆍ통고 등(이하 “전자송달”이라 한다)을 할 수 있다.<개정 2020. 12. 22., 2023. 12. 31.>\n  ④ 전자신고등을 할 때에는 관세청장이 정하는 바에 따라 관계 서류를 관세정보시스템의 전산처리설비를 이용하여 제출하게 하거나, 그 제출을 생략하게 하거나 간소한 방법으로 하게 할 수 있다.<개정 2023. 12. 31.>\n  ⑤ 제2항에 따라 이행된 전자신고등은 관세청장이 정하는 관세정보시스템의 전산처리설비에 저장된 때에 세관에 접수된 것으로 보고, 전자송달은 송달받을 자가 지정한 전자우편주소나 관세정보시스템의 전자사서함 또는 연계정보통신망의 전자고지함(연계정보통신망의 이용자가 접속하여 본인에게 송달된 고지내용을 확인할 수 있는 곳을 말한다)에 고지내용이 저장된 때에 그 송달을 받아야 할 자에게 도달된 것으로 본다.<개정 2020. 12. 22., 2023. 12. 31.>\n  ⑥ 전자송달은 대통령령으로 정하는 바에 따라 송달을 받아야 할 자가 신청하는 경우에만 한다.\n  ⑦ 제6항에도 불구하고 관세정보시스템 또는 연계정보통신망의 전산처리설비의 장애로 전자송달이 불가능한 경우, 그 밖에 대통령령으로 정하는 사유가 있는 경우에는 교부ㆍ인편 또는 우편의 방법으로 송달할 수 있다.<개정 2020. 12. 22., 2023. 12. 31.>\n  ⑧ 제6항에 따라 전자송달할 수 있는 대상의 구체적 범위ㆍ송달방법 등에 관하여 필요한 사항은 대통령령으로 정한다.\n  [전문개정 2010. 12. 30.]\n  [제목개정 2023. 12. 31.]","L111-0":"제111조(관세조사권 남용 금지) ① 세관공무원은 적정하고 공평한 과세를 실현하고 통관의 적법성을 보장하기 위하여 필요한 최소한의 범위에서 관세조사를 하여야 하며 다른 목적 등을 위하여 조사권을 남용하여서는 아니 된다.\n  ② 세관공무원은 다음 각 호의 어느 하나에 해당하는 경우를 제외하고는 이미 조사받은 조사 대상[제114조제1항 각 호 외의 부분 본문 또는 같은 조 제3항에 따라 통지 또는 교부된 조사 대상(같은 조 제4항에 따라 변경 통지된 경우에는 변경된 조사 대상)을 말한다]에 대하여 이미 조사받은 자를 다시 조사할 수 없다.<개정 2017. 12. 19., 2023. 12. 31., 2024. 12. 31., 2025. 12. 23.>\n    1. 관세탈루 등의 혐의를 인정할 만한 명백한 자료가 있는 경우\n    2. 이미 조사받은 자의 거래상대방을 조사할 필요가 있는 경우\n    3. 제118조제4항제2호 후단 또는 제128조제1항제3호 후단(제132조제4항 본문에서 준용하는 경우를 포함한다)에 따른 재조사 결정에 따라 재조사를 하는 경우(결정서 주문에 기재된 범위의 재조사에 한정한다)\n    4. 납세자가 세관공무원에게 직무와 관련하여 금품을 제공하거나 금품제공을 알선한 경우\n    5. 그 밖에 제1호부터 제4호까지와 유사한 경우로서 대통령령으로 정하는 경우\n  [전문개정 2011. 12. 31.]","D109-0":"제109조(감면물품의 용도외사용 등에 대한 승인신청) ①법 제83조제2항 단서ㆍ법 제88조제2항 단서ㆍ법 제97조제2항 단서(법 제98조제2항에서 준용하는 경우를 포함한다) 또는 법 제102조제1항 단서에 의하여 세관장의 승인을 얻고자 하는 자는 다음 각호의 사항을 기재한 신청서를 당해 물품의 소재지를 관할하는 세관장(이하 “관할지세관장”이라 한다)에게 제출하여야 한다. 다만, 법 제97조제2항 단서(법 제98조제2항에서 준용하는 경우를 포함한다)의 규정에 해당하는 경우에는 당해 물품을 최초에 수입신고한 세관에서도 할 수 있다.\n    1. 당해 물품의 품명ㆍ규격ㆍ수량ㆍ관세감면액 또는 적용된 용도세율ㆍ수입신고수리 연월일 및 수입신고번호\n    2. 당해 물품의 통관세관명\n    3. 승인신청이유\n    4. 당해 물품의 양수인의 사업의 종류, 주소ㆍ상호 및 성명(법인인 경우에는 대표자의 성명)\n  ②재해 기타 부득이한 사유로 인하여 멸실된 물품에 대하여 법 제83조제3항 단서ㆍ법 제97조제3항 단서(법 제98조제2항에서 준용하는 경우를 포함한다)ㆍ법 제102조제2항 단서 또는 법 제109조제2항 단서의 규정을 적용받고자 하는 자는 멸실 후 지체없이 다음의 사항을 기재한 신청서에 그 사실을 증빙할 수 있는 서류를 첨부하여 세관장에게 제출하여야 한다. <개정 2024. 2. 29.>\n    1. 멸실된 물품의 품명ㆍ규격ㆍ수량ㆍ수입신고수리 연월일 및 수입신고번호\n    2. 멸실연월일 및 멸실장소\n    3. 멸실된 물품의 통관세관명\n  ③법 제83조제3항 단서ㆍ법 제97조제3항 단서(법 제98조제2항에서 준용하는 경우를 포함한다)ㆍ법 제102조제2항 단서 또는 법 제109조제2항 단서의 규정에 의하여 물품폐기에 대한 세관장의 승인을 얻고자 하는 자는 다음의 사항을 기재한 신청서를 세관장에게 제출하여야 한다.\n    1. 당해 물품의 품명ㆍ규격ㆍ수량ㆍ수입신고수리 연월일 및 수입신고번호\n    2. 당해 물품의 통관세관명\n    3. 폐기의 사유ㆍ방법 및 장소와 폐기예정연월일","R40-0":"제40조(종교ㆍ자선ㆍ장애인용품에 대한 관세면제신청) ①법 제91조제1호 내지 제3호의 규정에 의하여 관세를 면제받고자 하는 자는 당해 기증사실을 증명하는 서류를 신청서에 첨부하여야 한다.\n  ② 법 제91조제1호에 따라 관세를 면제받으려는 자는 해당 기증목적에 관하여 문화체육관광부장관의 확인을 받아야 한다. <개정 2008. 12. 31.>\n  ③법 제91조제2호에 따라 관세를 면제받고자 하는 자가 국가 또는 지방자치단체외의 자인 때에는 해당 시설 및 사업에 관하여 보건복지부장관이나 시장 또는 군수가 발급한 증명서 또는 그 사본을 신청서에 첨부하여야 한다. <개정 2008. 12. 31., 2017. 3. 31.>\n  ④법 제91조제3호의 규정에 의하여 관세를 면제받고자 하는 자가 국가ㆍ지방자치단체 또는 대한적십자사외의 자인 때에는 당해 기증목적에 관하여 외교부장관의 확인을 받아야 한다. <개정 2013. 3. 23.>\n  ⑤ 법 제91조제4호의2에 따라 관세를 면제받으려는 자는 다음 각 호의 구분에 따른 서류를 신청서에 첨부해야 한다. <신설 2026. 3. 20.>\n    1. 제39조제5항제1호의 의약품: 수입하려는 의약품이 한국희귀ㆍ필수의약품센터에 해당 의약품의 구매를 신청한 사람의 희귀난치성질환을 치료하기 위한 것이라는 소견이 기재된 진단서(「의료법」 제17조에 따른 진단서를 말한다)\n    2. 제39조제5항제2호의 의약품: 수입하려는 의약품이 희귀난치성질환의 치료에 사용되는 의약품임을 식품의약품안전처장이 확인한 서류\n  ⑥세관장은 해당 물품의 수량 또는 가격을 참작하는 경우 제1항부터 제5항까지의 규정에 따른 확인 및 증명이 필요없다고 인정되는 때에는 이를 생략하게 할 수 있다. <개정 2026. 3. 20.>","R73-2":"제73조의2(매각물품의 과세가격 및 예정가격) ① 영 제222조제7항에 따른 매각된 물품의 과세가격은 다음 각 호의 구분에 따라 결정한다. <개정 2023. 3. 20.>\n    1. 여행자 휴대품ㆍ우편물등: 제7조의3에 따라 산출한 가격\n    2. 변질 또는 손상된 물품: 제7조의2에 따라 산출한 가격\n    3. 사용으로 인해 가치가 감소된 물품: 제7조의5제1항에 따라 산출한 가격\n    4. 제2호 및 제3호에 따라 산출한 가격이 불합리하다고 인정되는 물품: 합리적으로 산출한 국내도매가격에 시가역산율을 곱하여 산출한 가격\n    5. 제1호부터 제4호까지에 해당하지 않는 수입물품: 법 제30조부터 제35조까지의 방법에 따라 산출한 가격\n  ② 영 제222조제7항에 따른 매각할 물품의 예정가격은 다음 각 호의 구분에 따라 결정한다. <개정 2023. 3. 20.>\n    1. 제1항제1호부터 제5호까지의 물품: 제1항제1호부터 제5호까지에 따른 과세가격에 관세 등 제세를 합한 금액\n    2. 수출조건으로 매각하는 물품: 제1호에 따른 금액에서 관세 등 제세, 운임 및 보험료를 공제한 가격\n  ③ 세관장은 제1항 및 제2항에 따라 과세가격과 예정가격의 산출이 곤란하거나 산출된 금액이 불합리하다고 판단하는 경우에는 그 밖의 합리적인 방법으로 과세가격과 예정가격을 산출할 수 있다.\n  [본조신설 2020. 10. 7.]","L179-0":"제179조(특허의 효력상실 및 승계) ① 특허보세구역의 설치ㆍ운영에 관한 특허는 다음 각 호의 어느 하나에 해당하면 그 효력을 상실한다.\n    1. 운영인이 특허보세구역을 운영하지 아니하게 된 경우\n    2. 운영인이 해산하거나 사망한 경우\n    3. 특허기간이 만료한 경우\n    4. 특허가 취소된 경우\n  ② 제1항제1호 및 제2호의 경우에는 운영인, 그 상속인, 청산법인 또는 합병ㆍ분할ㆍ분할합병 후 존속하거나 합병ㆍ분할ㆍ분할합병으로 설립된 법인(이하 “승계법인”이라 한다)은 지체 없이 세관장에게 그 사실을 보고하여야 한다.\n  ③ 특허보세구역의 설치ㆍ운영에 관한 특허를 받은 자가 사망하거나 해산한 경우 상속인 또는 승계법인이 계속하여 그 특허보세구역을 운영하려면 피상속인 또는 피승계법인이 사망하거나 해산한 날부터 30일 이내에 제174조제3항에 따른 요건을 갖추어 대통령령으로 정하는 바에 따라 세관장에게 신고하여야 한다.\n  ④ 상속인 또는 승계법인이 제3항에 따른 신고를 하였을 때에는 피상속인 또는 피승계법인이 사망하거나 해산한 날부터 신고를 한 날까지의 기간 동안 피상속인 또는 피승계법인의 특허보세구역의 설치ㆍ운영에 관한 특허는 상속인 또는 승계법인에 대한 특허로 본다.<개정 2020. 6. 9.>\n  ⑤ 제175조 각 호의 어느 하나에 해당하는 자는 제3항에 따른 신고를 할 수 없다.\n  [전문개정 2010. 12. 30.]","L264-2":"제264조의2(과세자료제출기관의 범위) 제264조에 따른 과세자료를 제출하여야 하는 기관 등(이하 “과세자료제출기관”이라 한다)은 다음 각 호와 같다. <개정 2014. 1. 1., 2016. 12. 20., 2024. 12. 31., 2025. 3. 14.>\n    1. 「국가재정법」 제6조에 따른 중앙관서(중앙관서의 업무를 위임받거나 위탁받은 기관을 포함한다. 이하 같다)와 그하급행정기관 및 보조기관\n    2. 지방자치단체(지방자치단체의 업무를 위임받거나 위탁받은 기관과 지방자치단체조합을 포함한다. 이하 같다)\n    3. 공공기관, 정부의 출연ㆍ보조를 받는 기관이나 단체, 「지방공기업법」에 따른 지방공사ㆍ지방공단 및 지방자치단체의 출연ㆍ보조를 받는 기관이나 단체\n    4. 「민법」 외의 다른 법률에 따라 설립되거나 국가 또는 지방자치단체의 지원을 받는 기관이나 단체로서 그 업무에 관하여 제1호나 제2호에 따른 기관으로부터 감독 또는 감사ㆍ검사를 받는 기관이나 단체, 그 밖에 공익 목적으로 설립된 기관이나 단체 중 대통령령으로 정하는 기관이나 단체\n    5. 「여신전문금융업법」에 따른 신용카드업자와 여신전문금융업협회\n    6. 「금융실명거래 및 비밀보장에 관한 법률」 제2조제1호에 따른 금융회사등\n    7. 「가상자산 이용자 보호 등에 관한 법률」 제2조제2호의 가상자산사업자\n  [본조신설 2013. 8. 13.]","D65-0":"제65조(덤핑방지관세의 부과) ① 법 제51조에 따른 덤핑방지관세는 실질적 피해등을 구제하기 위해 필요한 범위에서 부과한다. <개정 2024. 2. 29.>\n  ② 제60조제1항제2호에 따른 조사대상기간(이하 이 조에서 “조사대상기간”이라 한다)에 수출을 한 공급자 중 다음 각 호의 자에 대해서는 공급자 또는 공급국별로 덤핑방지관세율 또는 기준수입가격을 정하여 부과한다. 다만, 정당한 사유 없이 제64조제1항에 따른 자료제출 요청에 응하지 않거나 같은 조 제4항에 따라 자료의 공개를 거부하는 경우 및 그 밖의 사유로 조사 또는 자료의 검증이 곤란한 공급자에 대해서는 단일 덤핑방지관세율 또는 단일 기준수입가격을 정하여 부과할 수 있다. <개정 2024. 2. 29.>\n    1. 제60조제1항제3호에 따른 조사대상 공급자(이하 이 조에서 “조사대상공급자”라 한다)\n    2. 조사대상공급자와 제23조제1항에 따른 특수관계가 있는 공급자\n  ③ 법 제51조에 따라 공급국을 지정하여 덤핑방지관세를 부과하는 경우로서 조사대상기간에 수출을 한 공급자 중 제2항을 적용받지 않는 자 및 조사대상기간 후에 수출하는 해당 공급국의 신규 공급자(이하 이 조에서 “신규공급자”라 한다)에 대해서는 다음 각 호에 따라 덤핑방지관세를 부과한다. <개정 2024. 2. 29., 2025. 12. 30.>\n    1. 조사대상공급자에게 적용되는 덤핑방지관세율 또는 기준수입가격을 재정경제부령으로 정하는 바에 따라 가중평균한 덤핑방지관세율 또는 기준수입가격을 적용하여 부과할 것\n    2. 제1호에도 불구하고 제64조에 따라 자료를 제출한 자에 대해서는 조사를 통해 공급자 또는 공급국별로 덤핑방지관세율 또는 기준수입가격을 정하여 부과할 것. 이 경우 해당 자료를 제출한 신규공급자에 대해서는 재정경제부령으로 정하는 바에 따라 조사대상공급자와 다른 조사방법 및 조사절차를 적용할 수 있다.\n    3. 제1호 및 제2호에도 불구하고 조사대상공급자와 제23조제1항에 따른 특수관계가 있는 신규공급자에 대해서는 조사대상공급자에 대한 덤핑방지관세율 또는 기준수입가격을 적용하여 부과할 것. 다만, 정당한 사유 없이 특수관계 관련 자료를 제출하지 않는 등의 사유로 특수관계 여부에 대한 검증이 곤란한 신규공급자에 대해서는 단일 덤핑방지관세율 또는 단일 기준수입가격을 정하여 부과할 수 있다.\n  ④ 제3항제2호 전단에 따라 신규공급자에 대한 조사가 개시된 경우 세관장은 그 신규공급자가 공급하는 물품에 대하여 이를 수입하는 자로부터 담보를 제공받고 조사 완료일까지 덤핑방지관세의 부과를 유예할 수 있다. <신설 2010. 3. 26., 2024. 2. 29.>\n  ⑤ 제3항제2호 전단에 따라 신규공급자에 대해 정한 덤핑방지관세율 또는 기준수입가격은 해당 조사의 개시일부터 적용한다. <신설 2010. 3. 26., 2024. 2. 29.>\n  ⑥ 제3항제2호 전단에 따라 조사가 개시된 신규공급자의 가격수정ㆍ수출중지 등의 약속에 관하여는 제68조제1항부터 제3항까지, 제5항 및 제6항을 준용한다. 이 경우 제68조제1항 전단 중 “제61조제5항의 규정에 의한 본조사의 결과에 따른 최종판정”은 “제65조제3항제2호 전단에 따른 조사의 종결”로 본다. <신설 2010. 3. 26., 2024. 2. 29.>\n  ⑦제2항 및 제3항에 규정된 기준수입가격은 제58조제5항의 규정에 의하여 조정된 공급국의 정상가격에 수입관련비용을 가산한 범위안에서 결정한다. <개정 2010. 3. 26., 2024. 2. 29.>","L232-2":"제232조의2(원산지증명서의 발급 등) ① 이 법, 조약, 협정 등에 따라 관세를 양허받을 수 있는 물품의 수출자가 원산지증명서의 발급을 요청하는 경우에는 세관장이나 그 밖에 원산지증명서를 발급할 권한이 있는 기관은 그 수출자에게 원산지증명서를 발급하여야 한다.\n  ② 세관장은 제1항에 따라 발급된 원산지증명서의 내용을 확인하기 위하여 필요하다고 인정되는 경우에는 다음 각 호의 자로 하여금 원산지증명서확인자료(대통령령으로 정하는 자료로 한정한다)를 제출하게 할 수 있다. 이 경우 자료의 제출기간은 20일 이상으로서 재정경제부령으로 정하는 기간 이내로 한다.<개정 2025. 10. 1.>\n    1. 원산지증명서를 발급받은 자\n    2. 원산지증명서를 발급한 자\n    3. 그 밖에 대통령령으로 정하는 자\n  ③ 원산지증명서의 발급 요청 기한 및 발급 기관 등 원산지증명서의 발급에 필요한 사항은 재정경제부령으로 정한다.<신설 2024. 12. 31., 2025. 10. 1.>\n  [본조신설 2010. 12. 30.] 제232조의3 삭제 <2021. 12. 21.>","D141-13":"제141조의13(납세자 본인의 과세정보 전송 요구 등) ① 법 제116조의6제1항제5호에서 “대통령령으로 정하는 자”란 다음 각 호의 자를 말한다.\n    1. 「전기통신사업법」에 따른 전기통신사업자로서 「신용정보의 이용 및 보호에 관한 법률」 제33조의2제1항제2호부터 제5호까지에 해당하는 자\n    2. 그 밖에 「전기통신사업법」에 따른 전기통신사업자로서 본인정보의 활용 수요, 본인정보를 전송ㆍ수신하는 정보시스템의 안전성ㆍ신뢰성 및 개인정보 보호 수준 등을 고려하여 관세청장이 정하여 고시하는 자\n  ② 법 제116조의6제2항에서 “대통령령으로 정하는 범위”란 별표 2의2 제1호 각 목에 따른 정보(납세자 본인에 관한 정보만 해당한다)를 말한다. 다만, 해당 정보의 유출로 국가의 안전보장 또는 국민경제의 발전에 지장을 줄 우려가 있는 정보는 제외한다.\n  ③ 납세자는 법 제116조의6제1항에 따라 과세정보의 전송을 요구하는 경우(납세자 본인에게 전송할 것을 요구하는 경우는 제외한다)에는 과세정보의 보관기간을 특정하여 요구해야 한다.\n  ④ 법 제116조의6제1항에 따라 전송 요구를 받은 관세청장은 전송 요구를 받은 과세정보를 컴퓨터 등 정보처리장치로 처리가 가능한 방식으로 즉시 전송해야 한다. 다만, 전산시스템의 문제 발생 등으로 전송이 지연되거나 불가한 경우에는 전송이 지연된 사실 및 그 사유를 납세자에게 통지하고, 그 사유가 해소되면 즉시 과세정보를 전송해야 한다.\n  ⑤ 관세청장은 납세자의 요구가 있는 경우에는 해당 과세정보의 정확성 및 최신성이 유지될 수 있도록 정기적으로 같은 내역의 과세정보를 전송할 수 있다.\n  ⑥ 납세자는 법 제116조의6제3항에 따라 전송 요구를 철회하는 경우에는 다음 각 호의 어느 하나에 해당하는 방법으로 해야 한다.\n    1. 서면\n    2. 「전자서명법」 제2조제2호에 따른 전자서명(서명자의 실지명의를 확인할 수 있는 것으로 한정한다)이 있는 전자문서(「전자문서 및 전자거래 기본법」 제2조제1호에 따른 전자문서를 말한다)\n    3. 그 밖에 안전성과 신뢰성이 확보된 방법으로서 관세청장이 정하여 고시하는 방법\n  ⑦ 법 제116조의6제4항에서 “납세자의 본인 여부가 확인되지 아니하는 경우 등 대통령령으로 정하는 경우”란 다음 각 호의 어느 하나에 해당하는 경우를 말한다.\n    1. 납세자 본인이 전송 요구를 한 사실이 확인되지 않은 경우\n    2. 납세자 본인이 전송 요구를 했으나 제3자의 기망이나 협박 때문에 전송 요구를 한 것으로 의심되는 경우\n    3. 법 제116조의6제1항 각 호의 자가 아닌 자에게 전송해 줄 것을 요구한 경우\n    4. 법 제116조의6제5항에 따른 전송 요구 방법을 따르지 않은 경우\n    5. 납세자의 인증정보 탈취 등 부당한 방법으로 인한 전송 요구임을 알게 된 경우\n    6. 전송 요구에 응하여 과세정보를 제공하면 타인의 권리나 정당한 이익을 부당하게 침해할 우려가 있는 경우\n  ⑧ 다음 각 호의 어느 하나에 해당하는 자(이하 “전송과세정보 공유자”라 한다)는 법 제116조의6제9항에 따라 과세정보의 안전성을 확보하기 위해 제141조의4제1항 각 호의 조치를 해야 한다.\n    1. 법 제116조의6제2항에 따라 전송된 과세정보를 알게 된 같은 조 제1항제2호부터 제5호까지에 해당하는 자\n    2. 법 제116조의6제8항에 따라 과세정보의 전송 업무를 대행하는 자\n  ⑨ 전송과세정보 공유자는 제8항에 따른 조치의 이행 여부를 주기적으로 점검해야 한다.\n  ⑩ 관세청장은 전송과세정보 공유자에게 제9항에 따른 점검결과의 제출을 요청할 수 있으며, 해당 요청을 받은 자는 그 점검결과를 관세청장에게 제출해야 한다.\n  ⑪ 제1항부터 제10항까지에서 규정한 사항 외에 과세정보의 전송 요구 절차 등에 관하여 필요한 사항은 관세청장이 정하여 고시한다.\n  [본조신설 2024. 2. 29.]","D95-0":"제95조(편익관세) ①법 제74조에 따라 관세에 관한 편익(이하 “편익관세”라 한다)을 적용받을 수 있는 국가는 다음 표와 같다. <개정 2013. 2. 15., 2015. 2. 6., 2017. 3. 27., 2024. 2. 29., 2026. 2. 27.>\n  <img alt=\"지역 국가&#10;1. 아시아 부탄&#10;2. 중동 이란ㆍ이라크ㆍ레바논ㆍ시리아&#10;3. 대양주 나우루&#10;4. 아프리카 에티오피아ㆍ소말리아&#10;5. 유럽 안도라ㆍ모나코ㆍ산마리노ㆍ바티칸ㆍ덴마크(그린란드 및 페로제도에 한정한다)\" src=\"/LSW/flDownload.do?flSeq=161839043\" />\n  ②편익관세를 적용받을 수 있는 물품은 제1항의 표에 따른 국가의 생산물 중 「세계무역기구협정 등에 의한 양허관세 규정」 별표 1(이하 이 조에서 “양허표”라 한다)의 가 및 나에 따른 물품으로 한다. 이 경우 해당 물품에 대한 관세율표상의 품목분류가 세분되거나 통합된 때에도 동일한 편익을 받는다. <개정 2006. 5. 22., 2015. 2. 6., 2017. 3. 27., 2024. 2. 29.>\n  ③제2항에 규정하는 물품에 대하여는 당해 양허표에 규정된 세율을 적용한다. 다만, 다음 각호의 경우에는 당해 양허표에 규정된 세율보다 다음 각호에 규정된 세율을 우선하여 적용한다. <개정 2008. 2. 29., 2025. 12. 30.>\n    1. 법에 의한 세율이 당해 양허표에 규정된 세율보다 낮은 경우에는 법에 의한 세율. 다만, 법 제50조제3항 단서의 규정에 의한 농림축산물의 경우에는 당해 양허표에 규정된 세율을 기본세율 및 잠정세율에 우선하여 적용한다.\n    2. 법 제51조ㆍ법 제57조ㆍ법 제63조ㆍ법 제65조 또는 법 제68조의 규정에 의하여 대통령령 또는 재정경제부령으로 세율을 정하는 경우에는 그 세율\n  ④ 삭제 <2024. 2. 29.>\n  ⑤재정경제부장관은 편익관세의 적용에 관하여 필요한 사항을 조사하기 위하여 필요하다고 인정되는 때에는 관계행정기관ㆍ수출자ㆍ수입자 기타 이해관계인에게 관계자료의 제출 기타 필요한 협조를 요청할 수 있다. <개정 2008. 2. 29., 2025. 12. 30.>","L187-0":"제187조(보세공장 외 작업 허가) ① 세관장은 가공무역이나 국내산업의 진흥을 위하여 필요한 경우에는 대통령령으로 정하는 바에 따라 기간, 장소, 물품 등을 정하여 해당 보세공장 외에서 제185조제1항에 따른 작업을 허가할 수 있다.\n  <개정 2010. 12. 30.>\n  ② 세관장은 제1항에 따른 허가의 신청을 받은 날부터 10일 이내에 허가 여부를 신청인에게 통지하여야 한다.<신설 2018. 12. 31.>\n  ③ 세관장이 제2항에서 정한 기간 내에 허가 여부 또는 민원 처리 관련 법령에 따른 처리기간의 연장을 신청인에게 통지하지 아니하면 그 기간(민원 처리 관련 법령에 따라 처리기간이 연장 또는 재연장된 경우에는 해당 처리기간을 말한다)이 끝난 날의 다음 날에 허가를 한 것으로 본다.<신설 2018. 12. 31.>\n  ④ 제1항에 따른 허가를 한 경우 세관공무원은 해당 물품이 보세공장에서 반출될 때에 이를 검사할 수 있다.<개정 2010. 12. 30., 2018. 12. 31.>\n  ⑤ 제1항에 따라 허가를 받아 지정된 장소(이하 “공장외작업장”이라 한다)에 반입된 외국물품은 지정된 기간이 만료될 때까지는 보세공장에 있는 것으로 본다.<개정 2010. 12. 30., 2018. 12. 31.>\n  ⑥ 세관장은 제1항에 따라 허가를 받은 보세작업에 사용될 물품을 관세청장이 정하는 바에 따라 공장외작업장에 직접 반입하게 할 수 있다.<개정 2010. 12. 30., 2018. 12. 31.>\n  ⑦ 제1항에 따라 지정된 기간이 지난 경우 해당 공장외작업장에 허가된 외국물품이나 그 제품이 있을 때에는 해당 물품의 허가를 받은 보세공장의 운영인으로부터 그 관세를 즉시 징수한다.<개정 2010. 12. 30., 2018. 12. 31.>\n  [제목개정 2010. 12. 30.]","L326-0":"제326조(몰수품 등의 처분) ① 세관장은 이 법에 따라 몰수되거나 국고에 귀속된 물품(이하 “몰수품등”이라 한다)을 공매 또는 그 밖의 방법으로 처분할 수 있다.\n  ② 몰수품등의 공매에 관하여는 제210조를 준용한다. 다만, 관세청장이 정하는 물품은 경쟁입찰에 의하지 아니하고 수의계약이나 위탁판매의 방법으로 매각할 수 있다.\n  ③ 세관장은 관세청장이 정하는 기준에 해당하는 몰수품등을 처분하려면 관세청장의 지시를 받아야 한다.\n  ④ 세관장은 몰수품등에 대하여 대통령령으로 정하는 금액의 범위에서 몰수 또는 국고귀속 전에 발생한 보관료 및 관리비를 지급할 수 있다.\n  ⑤ 세관장은 몰수품등의 매각대금에서 매각에 든 비용과 제4항에 따른 보관료 및 관리비를 직접 지급할 수 있다.\n  ⑥ 세관장은 제1항에도 불구하고 몰수품등이 농산물인 경우로서 국내시장의 수급조절과 가격안정을 도모하기 위하여 농림축산식품부장관이 요청할 때에는 대통령령으로 정하는 바에 따라 몰수품등을 농림축산식품부장관에게 이 관할 수 있다.<개정 2013. 3. 23.>\n  ⑦ 관세청장 또는 세관장은 제2항에 따른 위탁판매 물품에 대한 적정한 관리를 위하여 필요한 경우에는 수탁판매기관에게 물품의 판매 현황, 재고 현황 등 관리 현황을 관세청장 또는 세관장에게 보고하게 하거나 관련 장부 및 서류의 제출을 명할 수 있다. 이 경우 보고의 방법 및 절차 등 필요한 사항은 관세청장이 정한다.<신설 2018. 12. 31.>\n  [전문개정 2010. 12. 30.]","D241-0":"제241조(담보제공 등) ① 법 제235조제3항 및 제4항에 따라 통관 보류나 유치를 요청하려는 자와 법 제235조제5항 각 호 외의 부분 단서에 따라 통관 또는 유치 해제를 요청하려는 자는 세관장에게 해당 물품의 과세가격의 100분의 120에 상당하는 금액의 담보를 법 제24조제1항제1호부터 제3호까지 및 제7호에 따른 금전 등으로 제공하여야 한다. <개정 2013. 2. 15.>\n  ② 제1항에 따른 담보 금액은 담보를 제공해야 하는 자가 「조세특례제한법」 제6조제1항에 따른 중소기업인 경우에는 해당 물품의 과세가격의 100분의 40에 상당하는 금액으로 한다. <개정 2013. 2. 15., 2015. 2. 6., 2021. 2. 17.>\n  ③제1항 또는 제2항에 따라 담보를 제공하는 자는 제공된 담보를 법원의 판결에 따라 수출입신고등을 한 자 또는 통관보류등을 요청한 자가 입은 손해의 배상에 사용하여도 좋다는 뜻을 세관장에게 문서로 제출하여야 한다. <개정 2011. 4. 1.>\n  ④ 세관장은 법 제235조제3항 및 제4항에 따라 통관보류등이 된 물품의 통관을 허용하거나 유치를 해제하였을 때 또는 법 제235조제5항 단서에 따른 통관 또는 유치 해제 요청에도 불구하고 통관보류등을 계속할 때에는 제1항 또는 제2항에 따라 제공된 담보를 담보제공자에게 반환하여야 한다. <개정 2011. 4. 1.>\n  ⑤제1항 및 제2항의 규정에 의하여 제공된 담보의 해제신청 및 포괄담보에 관하여는 제11조 및 제13조의 규정을 준용한다.","D245-2":"제245조의2(무역원활화위원회의 구성) ① 법 제240조의4에 따른 통관 등 수출입 절차의 원활화 및 이와 관련된 국제협력의 원활화(이하 “무역원활화”라 한다)의 촉진에 관한 다음 각 호의 사항을 심의하기 위하여 재정경제부장관 소속으로 무역원활화위원회(이하 이 조 및 제245조의3에서 “위원회”라 한다)를 둔다. <개정 2025. 12. 30.>\n    1. 무역원활화 기본계획에 관한 사항\n    2. 무역원활화 추진 관련 행정기관 간의 업무 협조에 관한 사항\n    3. 무역원활화 관련 법령ㆍ제도의 정비ㆍ개선에 관한 사항\n    4. 그 밖에 무역원활화 추진에 관한 주요 사항\n  ② 위원회는 위원장 1명을 포함하여 20명 이내의 위원으로 구성한다.\n  ③ 위원회의 위원장은 재정경제부차관이 되고, 위원은 다음 각 호의 사람이 된다. <개정 2025. 12. 30.>\n    1. 무역원활화 관련 행정기관의 고위공무원단에 속하는 공무원 중에서 재정경제부장관이 임명하는 사람\n    2. 다음 각 목의 어느 하나에 해당하는 사람 중에서 재정경제부장관이 위촉하는 사람\n      가. 무역원활화 관계 기관 및 단체의 임직원\n      나. 무역원활화에 관한 학식과 경험이 풍부한 사람으로서 해당 업무에 2년 이상 종사한 사람\n  ④ 제3항제2호에 따른 위원의 임기는 2년으로 하되, 한번만 연임할 수 있다. 다만, 보궐위원의 임기는 전임위원 임기의 남은 기간으로 한다. <개정 2017. 3. 27., 2018. 2. 13.>\n  ⑤ 재정경제부장관은 위원회의 위원이 다음 각 호의 어느 하나에 해당하는 경우에는 해당 위원을 해임 또는 해촉할 수 있다. <신설 2017. 3. 27., 2025. 12. 30.>\n    1. 심신장애로 인하여 직무를 수행할 수 없게 된 경우\n    2. 직무와 관련된 비위사실이 있는 경우\n    3. 직무태만, 품위손상이나 그 밖의 사유로 인하여 위원으로 적합하지 아니하다고 인정되는 경우\n    4. 위원 스스로 직무를 수행하는 것이 곤란하다고 의사를 밝히는 경우\n  ⑥ 위원회의 사무를 처리하기 위하여 간사 1명을 두며, 간사는 재정경제부의 고위공무원단에 속하는 공무원 중에서 재정경제부장관이 지명한다. <개정 2017. 3. 27., 2025. 12. 30.>\n  ⑦ 제1항부터 제6항까지에서 규정한 사항 외에 위원회의 구성에 필요한 사항은 재정경제부령으로 정한다. <개정 2017. 3. 27., 2025. 12. 30.>\n  [본조신설 2015. 2. 6.]","R54-0":"제54조(관세가 면제되는 재수입 물품 등) ① 법 제99조제1호에서 “재정경제부령으로 정하는 물품”이란 다음 각 호의 물품을 말한다. <개정 2020. 3. 13., 2026. 1. 2.>\n    1. 장기간에 걸쳐 사용할 수 있는 물품으로서 임대차계약 또는 도급계약 등에 따라 해외에서 일시적으로 사용하기 위하여 수출된 물품 중 「법인세법 시행규칙」 제15조에 따른 내용연수가 3년(금형의 경우에는 2년) 이상인 물품\n    2. 박람회, 전시회, 품평회, 「국제경기대회 지원법」 제2조제1호에 따른 국제경기대회, 그 밖에 이에 준하는 행사에 출품 또는 사용된 물품\n    3. 수출물품을 해외에서 설치, 조립 또는 하역하기 위해 사용하는 장비 및 용구\n    4. 수출물품을 운송하는 과정에서 해당 물품의 품질을 유지하거나 상태를 측정 및 기록하기 위해 해당 물품에 부착하는 기기\n    5. 결함이 발견된 수출물품\n    6. 수입물품을 적재하기 위하여 수출하는 용기로서 반복적으로 사용되는 물품\n  ② 법 제99조제1호부터 제3호까지의 규정에 따라 관세를 감면받으려는 자는 그 물품의 수출신고필증ㆍ반송신고필증 또는 이를 갈음할 서류를 세관장에게 제출하여야 한다. 다만, 세관장이 다른 자료에 의하여 그 물품이 감면대상에 해당한다는 사실을 인정할 수 있는 경우에는 그러하지 아니하다.\n  [전문개정 2010. 3. 30.]","D31-4":"제31조의4(관세부과 등을 위한 정보제공 범위) 법 제37조의3 전단에서 “대통령령으로 정하는 정보 또는 자료”란 다음 각 호의 어느 하나에 해당하는 것을 말한다. <개정 2015. 2. 6., 2021. 2. 17.>\n    1. 「국제조세조정에 관한 법률」 제7조에 따른 과세표준 및 세액의 결정ㆍ경정과 관련된 정보 또는 자료\n    2. 그 밖에 과세가격의 결정ㆍ조정에 필요한 자료\n  [본조신설 2012. 2. 2.]\n  [제31조의2에서 이동 <2015. 2. 6.>]","L232-0":"제232조(원산지증명서 등) ① 이 법, 조약, 협정 등에 따라 원산지 확인이 필요한 물품을 수입하는 자는 해당 물품의 원산지를 증명하는 서류(이하 “원산지증명서”라 한다)를 제출하여야 한다. 다만, 대통령령으로 정하는 물품의 경우에는 그러하지 아니하다.\n  ② 세관장은 제1항에 따라 원산지 확인이 필요한 물품을 수입하는 자가 원산지증명서를 제출하지 아니하는 경우에는 이 법, 조약, 협정 등에 따른 관세율을 적용할 때 일반특혜관세ㆍ국제협력관세 또는 편익관세를 배제하는 등 관세의 편익을 적용하지 아니할 수 있다.\n  ③ 세관장은 원산지 확인이 필요한 물품을 수입한 자로 하여금 제1항에 따라 제출받은 원산지증명서의 내용을 확인하기 위하여 필요한 자료(이하 “원산지증명서확인자료”라 한다)를 제출하게 할 수 있다. 이 경우 원산지 확인이 필요한 물품을 수입한 자가 정당한 사유 없이 원산지증명서확인자료를 제출하지 아니할 때에는 세관장은 수입신고 시 제출받은 원산지증명서의 내용을 인정하지 아니할 수 있다.\n  ④ 세관장은 제3항에 따라 원산지증명서확인자료를 제출한 자가 정당한 사유를 제시하여 그 자료를 공개하지 아니할 것을 요청한 경우에는 그 제출인의 명시적 동의 없이는 해당 자료를 공개하여서는 아니 된다.\n  ⑤ 제1항부터 제4항까지의 규정에도 불구하고 조약ㆍ협정 등의 시행을 위하여 원산지증명서 제출 등에 관한 사항을 따로 정할 필요가 있을 때에는 재정경제부령으로 정한다.<신설 2011. 12. 31., 2025. 10. 1.>\n  [전문개정 2010. 12. 30.]","D157-0":"제157조(입항보고서 등의 기재사항) ①법 제135조의 규정에 의한 선박의 입항보고서에는 다음 각호의 사항을 기재하여야 한다.\n    1. 선박의 종류ㆍ등록기호ㆍ명칭ㆍ국적ㆍ선적항ㆍ총톤수 및 순톤수\n    2. 출항지ㆍ기항지ㆍ최종기항지ㆍ입항일시ㆍ출항예정일시 및 목적지\n    3. 적재물품의 개수 및 톤수와 여객ㆍ승무원의 수 및 통과여객수\n  ②법 제135조제1항에 따른 선박용품목록에는 다음 각 호의 사항을 기재해야 한다. <개정 2021. 2. 17.>\n    1. 선박의 종류ㆍ등록기호ㆍ명칭ㆍ국적 및 입항연월일\n    2. 선박용품의 품명ㆍ수량 및 가격\n  ③법 제135조의 규정에 의한 선박의 여객명부에는 다음 각호의 사항을 기재하여야 한다. <개정 2002. 12. 30.>\n    1. 선박의 종류ㆍ등록기호ㆍ명칭ㆍ국적 및 입항연월일\n    2. 여객의 국적ㆍ성명ㆍ생년월일ㆍ여권번호ㆍ승선지 및 상륙지\n  ④법 제135조의 규정에 의한 선박의 승무원명부에는 다음 각호의 사항을 기재하여야 한다.\n    1. 선박의 종류ㆍ등록기호ㆍ명칭ㆍ국적 및 입항연월일\n    2. 승무원의 국적ㆍ성명ㆍ승무원수첩번호 또는 여권번호ㆍ승선지 및 상륙지\n  ⑤법 제135조의 규정에 의한 선박의 승무원 휴대품목록에는 다음 각호의 사항을 기재하여야 한다.\n    1. 선박의 종류ㆍ등록기호ㆍ명칭ㆍ국적 및 입항연월일\n    2. 선원의 국적ㆍ성명ㆍ승무원수첩번호 또는 여권번호\n    3. 품명ㆍ수량 및 가격\n  ⑥법 제135조제1항에 따른 적재화물목록에는 다음 각 호의 사항을 기재해야 한다. <신설 2002. 12. 30., 2021. 2. 17.>\n    1. 선박명 및 적재항\n    2. 품명 및 물품수신인ㆍ물품발송인\n    3. 그 밖의 선박운항 및 화물에 관한 정보로서 관세청장이 필요하다고 인정하는 것\n  ⑦법 제135조의 규정에 의한 항공기의 입항보고서에는 다음 각호의 사항을 기재하여야 한다.\n    1. 항공기의 종류ㆍ등록기호ㆍ명칭ㆍ국적ㆍ출항지 및 입항일시\n    2. 적재물품의 적재지ㆍ개수 및 톤수\n    3. 여객ㆍ승무원ㆍ통과여객의 수\n  ⑧법 제135조제1항에 따른 항공기의 항공기용품목록, 여객명부, 승무원명부, 승무원 휴대품목록 및 적재화물목록에 관하여는 제2항부터 제6항까지의 규정을 준용한다. <개정 2002. 12. 30., 2021. 2. 17.>","R67-0":"제67조(특허 및 기간갱신신청시의 첨부서류) ①영 제188조제1항 각 호 외의 부분에 따라 신청서에 첨부하여야 하는 서류는 다음 각 호와 같다. <개정 2009. 3. 26.>\n    1. 보세구역의 도면\n    2. 보세구역의 위치도\n    3. 운영인의 자격을 증명하는 서류\n    4. 필요한 시설 및 장비의 구비를 증명하는 서류\n  ②영 제188조제3항 각 호 외의 부분에 따라 신청서에 첨부하여야 하는 서류는 다음 각 호와 같다. <개정 2009. 3. 26.>\n    1. 운영인의 자격을 증명하는 서류\n    2. 필요한 시설 및 장비의 구비를 증명하는 서류","D285-4":"제285조의4(전자문서중계사업자의 지정기준) ①법 제327조의3제1항에 따른 전자문서중계사업자의 지정기준은 다음 각 호와 같다. <개정 2006. 5. 22., 2009. 2. 4., 2012. 2. 2.>\n    1. 「상법」상 주식회사로서 납입자본금이 10억원 이상일 것\n    2. 정부, 「공공기관의 운영에 관한 법률」 제4조에 따른 공공기관 및 비영리법인을 제외한 동일인이 의결권있는 주식총수의 100분의 15를 초과하여 소유하거나 사실상 지배하지 아니할 것\n    3. 법 제327조의3제1항에 따른 전자문서중계사업을 영위하기 위한 설비와 기술인력을 보유할 것\n  ②제1항제2호에서 동일인이 소유하거나 사실상 지배하는 주식의 범위는 재정경제부령으로 정한다. <개정 2008. 2. 29., 2025. 12. 30.>\n  ③제1항제3호의 규정에 의한 지정기준의 세부적인 사항은 재정경제부령으로 정한다. <개정 2008. 2. 29., 2025. 12. 30.>\n  [본조신설 2002. 12. 30.]\n  [제285조의3에서 이동, 종전 제285조의4는 제285조의5로 이동 <2009. 2. 4.>]","D79-0":"제79조(상계관세의 부과) ①법 제57조의 규정에 의한 상계관세는 제74조제1항제2호에 따른 조사대상기간(이하 이 조에서 “조사대상기간”이라 한다)에 수출을 한 수출자 중 다음 각 호의 자에 대해서는 수출자 또는 수출국별로 상계관세율을 정하여 부과할 수 있다. 다만, 정당한 사유없이 제78조의 규정에 의한 자료를 제출하지 아니하거나 당해 자료의 공개를 거부하는 경우 및 기타의 사유로 조사 또는 자료의 검증이 곤란한 수출자에 대하여는 단일 상계관세율을 정하여 부과할 수 있다. <개정 2024. 2. 29.>\n    1. 제74조제1항제3호에 따른 조사대상 수출자(이하 “조사대상수출자”라 한다)\n    2. 조사대상수출자와 제23조제1항에 따른 특수관계가 있는 수출자\n  ② 법 제57조에 따라 수출국을 지정하여 상계관세를 부과하는 경우로서 조사대상기간에 수출을 한 수출자 중 제1항을 적용받지 않는 자 및 조사대상기간 후에 수출하는 해당 수출국의 신규 수출자(이하 이 조에서 “신규수출자”라 한다)에 대해서는 다음 각 호에 따라 상계관세를 부과한다. <개정 2024. 2. 29., 2025. 12. 30.>\n    1. 조사대상수출자에게 적용되는 상계관세율을 재정경제부령으로 정하는 바에 따라 가중평균한 상계관세율을 적용하여 부과할 것\n    2. 제1호에도 불구하고 제78조에 따라 자료를 제출한 자에 대해서는 조사를 통해 수출자 또는 수출국별로 상계관세율을 정하여 부과할 것. 이 경우 해당 자료를 제출한 신규수출자에 대해서는 재정경제부령으로 정하는 바에 따라 조사대상수출자와 다른 조사방법 및 조사절차를 적용할 수 있다.\n    3. 제1호 및 제2호에도 불구하고 조사대상수출자와 제23조제1항에 따른 특수관계가 있는 신규수출자에 대해서는 조사대상수출자에 대한 상계관세율을 적용하여 부과할 것. 다만, 정당한 사유 없이 특수관계 관련 자료를 제출하지 않는 등의 사유로 특수관계 여부에 대한 검증이 곤란한 신규수출자에 대해서는 단일 상계관세율을 정하여 부과할 수 있다.\n  ③ 삭제 <2024. 2. 29.>\n  ④ 제2항제2호 전단에 따라 신규수출자에 대한 조사가 개시된 경우 세관장은 그 신규수출자가 수출하는 물품에 대하여 이를 수입하는 자로부터 담보를 제공받고 조사 완료일까지 상계관세의 부과를 유예할 수 있다. <신설 2020. 12. 29., 2024. 2. 29.>\n  ⑤ 제2항제2호 전단에 따라 신규수출자에 대해 정한 상계관세율은 해당 조사의 개시일부터 적용한다. <신설 2020. 12. 29., 2024. 2. 29.>\n  ⑥ 제2항제2호 전단에 따라 조사가 개시된 신규수출자의 가격수정 등의 약속에 관하여는 제81조제1항부터 제3항까지, 제5항 및 제6항을 준용한다. 이 경우 제81조제1항 전단 중 “제75조제5항의 규정에 의한 본조사의 결과에 따른 최종판정”은 “제79조제2항제2호 전단에 따른 조사의 종결”로 본다. <신설 2020. 12. 29., 2024. 2. 29.>","R72-0":"제72조(종합보세구역안에서의 이동신고 대상물품) 법 제201조제3항 후단의 규정에 의하여 세관장에게 신고하여야 하는 물품은 종합보세구역의 운영인 상호간에 이동하는 물품으로 한다.","L246-2":"제246조의2(물품의 검사에 따른 손실보상) ① 관세청장 또는 세관장은 이 법에 따른 세관공무원의 적법한 물품검사로 인하여 물품 등에 손실이 발생한 경우 그 손실을 입은 자에게 보상(이하 “손실보상”이라 한다)하여야 한다. <개정 2019. 12. 31., 2023. 12. 31.>\n  ② 제1항에 따른 손실보상의 기준, 대상 및 보상금액에 관한 사항은 대통령령으로 정한다.<개정 2023. 12. 31.>\n  ③ 제1항에 따른 손실보상의 지급절차 및 방법, 그 밖에 필요한 사항은 관세청장이 정한다.\n  [본조신설 2015. 12. 15.]","R48-0":"제48조(관세가 면제되는 여행자 휴대품 등) ①법 제96조제1항제1호에 따라 관세가 면제되는 물품은 다음 각 호의 어느 하나에 해당하는 것으로 한다. <개정 2012. 2. 28., 2015. 2. 6., 2026. 3. 20.>\n    1. 여행자가 통상적으로 몸에 착용하거나 휴대할 필요성이 있다고 인정되는 물품일 것\n    2. 비거주자인 여행자가 반입하는 물품으로서 본인의 직업상 필요하다고 인정되는 직업용구일 것\n    3. 세관장이 반출 확인한 물품으로서 재반입되는 물품일 것\n    4. 영 제213조제3항 단서에 따라 회수되지 않은 물품일 것\n    5. 물품의 성질ㆍ수량ㆍ가격ㆍ용도 등으로 보아 통상적으로 여행자의 휴대품 또는 별송품인 것으로 인정되는 물품일 것\n  ② 제1항에 따른 관세의 면제 한도는 여행자 1명의 휴대품 또는 별송품으로서 각 물품(제1항제1호에 따른 물품으로서 국내에서 반출된 물품과 제1항제3호에 따른 물품은 제외한다)의 과세가격 합계 기준으로 미화 800달러 이하(이하 이 항 및 제3항에서 “기본면세범위”라 한다)로 하고, 법 제196조제1항제1호 단서 및 같은 조 제2항에 따라 구매한 내국물품이 포함되어 있을 경우에는 기본면세범위에서 해당 내국물품의 구매가격을 공제한 금액으로 한다. 다만, 농림축산물 등 관세청장이 정하는 물품이 휴대품 또는 별송품에 포함되어 있는 경우에는 기본면세범위에서 해당 농림축산물 등에 대하여 관세청장이 따로 정한 면세한도를 적용할 수 있다. <신설 2012. 2. 28., 2014. 9. 2., 2018. 3. 21., 2019. 3. 20., 2020. 3. 13., 2021. 3. 16., 2022. 9. 6.>\n  ③제2항에도 불구하고 술ㆍ담배ㆍ향수에 대해서는 기본면세범위와 관계없이 다음 표(이하 이 항에서 “별도면세범위”라 한다)에 따라 관세를 면제하되, 19세 미만인 사람(19세가 되는 해의 1월 1일을 맞이한 사람은 제외한다)이 반입하는 술ㆍ담배에 대해서는 관세를 면제하지 않고, 법 제196조제1항제1호 단서 및 같은 조 제2항에 따라 구매한 내국물품인 술ㆍ담배ㆍ향수가 포함되어 있을 경우에는 별도면세범위에서 해당 내국물품의 구매수량을 공제한다. 이 경우 해당 물품이 다음 표의 면세한도를 초과하여 관세를 부과하는 경우에는 해당 물품의 가격을 과세가격으로 한다. <개정 2018. 9. 20., 2019. 3. 20., 2020. 3. 13., 2022. 9. 5., 2023. 5. 1., 2023. 12. 29., 2025. 3. 21.>\n  <img alt=\"구분 면세한도 비고&#10;술 용량은 2리터(L) 이하, 가격은 미화 400달러 이하로 한다.&#10;담배 궐련 200개비 둘 이상의 담배 종류를 반입하는 경우에는 한 종류로 한정한다.&#10;엽궐련 50개비&#10;전자담배 &#10;궐련형 200개비&#10;니코틴용액 20밀리리터(mL)&#10;기타유형 110그램&#10;그 밖의 담배 250그램&#10;향수 100밀리리터\" src=\"/LSW/flDownload.do?flSeq=150098083\" />\n  ④ 삭제 <2021. 3. 16.>\n  ⑤ 삭제 <2021. 3. 16.>\n  ⑥법 제96조제1항제1호에 따른 별송품은 천재지변 등 부득이한 사유가 있는 경우를 제외하고는 여행자가 입국한 날부터 6월 이내에 도착한 것이어야 한다. <개정 2012. 2. 28., 2015. 2. 6., 2021. 3. 16.>\n  ⑦ 삭제 <2021. 3. 16.>\n  [제목개정 2021. 3. 16.]","R38-0":"제38조(학술연구용품 등에 대한 관세의 감면신청) ①법 제90조제1항제3호에 따라 관세를 감면받으려는 자는 해당 기증사실을 증명하는 서류를 신청서에 첨부하여 제출하여야 한다. <개정 2011. 4. 1.>\n  ②법 제90조제1항제4호에 따른 물품을 관세감면대상물품으로 지정받으려는 자는 다음 각 호의 사항을 적은 신청서에 해당 물품의 상품목록 등 참고자료를 첨부하여 주무부처를 경유하여 재정경제부장관에게 제출하여야 한다. <개정 2008. 12. 31., 2011. 4. 1., 2026. 1. 2.>\n    1. 신청인의 주소ㆍ성명 및 상호\n    2. 사업의 종류\n    3. 법 별표 관세율표 번호(이하 “관세율표 번호”라 한다)ㆍ품명ㆍ규격ㆍ수량ㆍ가격ㆍ용도 및 구조\n  ③제2항의 규정에 의한 신청서는 매년 2월 말일까지 제출하여야 한다.\n  [제목개정 2011. 4. 1.]","L116-2":"제116조의2(고액ㆍ상습체납자 등의 명단 공개) ① 관세청장은 제116조에도 불구하고 다음 각 호의 구분에 따라 해당 사항을 공개할 수 있다. <개정 2023. 12. 31.>\n    1. 체납발생일부터 1년이 지난 관세 및 내국세등(이하 이 항에서 “체납관세등”이라 한다)이 2억원 이상인 체납자: 해당 체납자의 인적사항과 체납액 등. 다만, 체납관세등에 대하여 이의신청ㆍ심사청구 등 불복청구가 진행 중이거나 체납액의 일정금액 이상을 납부한 경우 등 대통령령으로 정하는 사유에 해당하는 경우에는 그러하지 아니하다.\n    2. 제270조제1항ㆍ제4항 및 제5항에 따른 범죄로 유죄판결이 확정된 자로서 같은 조에 따른 포탈, 감면, 면탈 또는 환급받은 관세 및 내국세등의 금액(이하 이 조에서 “포탈관세액”이라 한다)이 연간 2억원 이상인 자(이하 이 조에서 “관세포탈범”이라 한다): 해당 관세포탈범의 인적사항과 포탈관세액 등. 다만, 제2항에 따른 관세정보위원회가 공개할 실익이 없거나 공개하는 것이 부적절하다고 인정하는 경우 등 대통령령으로 정하는 사유에 해당하는 경우에는 그러하지 아니하다.\n  ② 제1항과 제4항에 따른 체납자의 인적사항과 체납액 또는 관세포탈범의 인적사항과 포탈관세액 등에 대한 공개 여부를 심의 또는 재심의하고 제116조의4제1항제3호에 따른 체납자에 대한 감치 필요성 여부를 의결하기 위하여 관세청에 관세정보위원회(이하 이 조에서 “심의위원회”라 한다)를 둔다.<개정 2019. 12. 31., 2023. 12. 31.>\n  ③ 관세청장은 심의위원회의 심의를 거친 공개대상예정자에게 체납자 또는 관세포탈범 명단 공개대상예정자임을 통지하여 소명할 기회를 주어야 한다.<개정 2023. 12. 31.>\n  ④ 관세청장은 제3항에 따라 통지한 날부터 6개월이 지나면 심의위원회로 하여금 체납액 또는 포탈관세액의 납부이행 등을 고려하여 체납자 또는 관세포탈범의 명단 공개 여부를 재심의하게 한다.<개정 2023. 12. 31.>\n  ⑤ 제1항에 따른 공개는 관보에 게재하거나 관세청장이 지정하는 정보통신망 또는 관할 세관의 게시판에 게시하는 방법으로 한다.\n  ⑥ 제1항부터 제5항까지의 규정에 따른 체납자ㆍ관세포탈범 명단 공개 및 심의위원회의 구성ㆍ운영 등에 필요한 사항은 대통령령으로 정한다.<개정 2023. 12. 31.>\n  [전문개정 2010. 12. 30.]\n  [제목개정 2023. 12. 31.]","L37-0":"제37조(과세가격 결정방법의 사전심사) ① 제38조제1항에 따라 납세신고를 하여야 하는 자는 과세가격 결정과 관련하여 다음 각 호의 사항에 관하여 의문이 있을 때에는 가격신고를 하기 전에 대통령령으로 정하는 바에 따라 관세청장에게 미리 심사하여 줄 것을 신청할 수 있다. <개정 2018. 12. 31.>\n    1. 제30조제1항부터 제3항까지에 규정된 사항\n    2. 제30조에 따른 방법으로 과세가격을 결정할 수 없는 경우에 적용되는 과세가격 결정방법\n    3. 특수관계가 있는 자들 간에 거래되는 물품의 과세가격 결정방법\n  ② 제1항에 따른 신청을 받은 관세청장은 대통령령으로 정하는 기간 이내에 과세가격의 결정방법을 심사한 후 그 결과를 신청인에게 통보하여야 한다.\n  ③ 제2항에 따라 결과를 통보받은 자가 그 결과에 이의가 있는 경우에는 그 결과를 통보받은 날부터 30일 이내에 대통령령으로 정하는 바에 따라 관세청장에게 재심사를 신청할 수 있다. 이 경우 재심사의 기간 및 결과의 통보에 관하여는 제2항을 준용한다.<신설 2014. 12. 23., 2018. 12. 31.>\n  ④ 세관장은 관세의 납세의무자가 제2항 또는 제3항에 따라 통보된 과세가격의 결정방법에 따라 납세신고를 한 경우 대통령령으로 정하는 요건을 갖추었을 때에는 그 결정방법에 따라 과세가격을 결정하여야 한다.<개정 2014. 12. 23.>\n  ⑤ 제1항제3호에 따라 사전심사를 신청하여 제2항에 따라 결과를 통보받은 자는 심사결과 결정된 과세가격 결정방법을 적용하여 산출한 과세가격 및 그 산출과정 등이 포함된 보고서를 대통령령으로 정하는 바에 따라 관세청장에게 제출하여야 한다.<신설 2018. 12. 31.>\n  ⑥ 관세청장은 제5항에 따른 보고서를 제출하지 아니하는 등 대통령령으로 정하는 사유에 해당하는 경우에는 제2항에 따른 사전심사 결과를 변경, 철회 또는 취소할 수 있다. 이 경우 관세청장은 사전심사를 신청한 자에게 그 사실을 즉시 통보하여야 한다.<신설 2018. 12. 31.>\n  [전문개정 2010. 12. 30.]","R45-0":"제45조(관세가 면제되는 소액물품) ①법 제94조제3호에 따라 관세가 면제되는 물품은 다음 각 호와 같다. <개정 2021. 3. 16.>\n    1. 물품이 천공 또는 절단되었거나 통상적인 조건으로 판매할 수 없는 상태로 처리되어 견본품으로 사용될 것으로 인정되는 물품\n    2. 판매 또는 임대를 위한 물품의 상품목록ㆍ가격표 및 교역안내서등\n    3. 과세가격이 미화 250달러 이하인 물품으로서 견본품으로 사용될 것으로 인정되는 물품\n    4. 물품의 형상ㆍ성질 및 성능으로 보아 견본품으로 사용될 것으로 인정되는 물품\n  ②법 제94조제4호에 따라 관세가 면제되는 물품은 다음 각 호와 같다. <개정 2003. 2. 14., 2004. 3. 30., 2015. 12. 1., 2022. 3. 18.>\n    1. 물품가격(법 제30조부터 제35조까지의 규정에 따른 방법으로 결정된 과세가격에서 법 제30조제1항제6호 본문에 따른 금액을 뺀 가격. 다만, 법 제30조제1항제6호 본문에 따른 금액을 명백히 구분할 수 없는 경우에는 이를 포함한 가격으로 한다)이 미화 150달러 이하의 물품으로서 자가사용 물품으로 인정되는 것. 다만, 반복 또는 분할하여 수입되는 물품으로서 관세청장이 정하는 기준에 해당하는 것을 제외한다.\n    2. 박람회 기타 이에 준하는 행사에 참가하는 자가 행사장안에서 관람자에게 무상으로 제공하기 위하여 수입하는 물품(전시할 기계의 성능을 보여주기 위한 원료를 포함한다). 다만, 관람자 1인당 제공량의 정상도착가격이 미화 5달러 상당액 이하의 것으로서 세관장이 타당하다고 인정하는 것에 한한다.","R60-3":"제60조의3(과세정보 전송 요구에 따른 수수료) 법 제116조의6제11항 본문에 따라 과세정보 전송을 요구하려는 자가 관세청장에게 납부해야 하는 수수료에 관하여는 별표 7 제3호를 준용한다.\n  [본조신설 2024. 3. 22.]","L133-0":"제133조(국제항의 지정 등) ① 국제항은 대통령령으로 지정한다. <개정 2020. 12. 22.>\n  ② 제1항에 따른 국제항의 시설기준 등에 관하여 필요한 사항은 대통령령으로 정한다.<개정 2020. 12. 22.>\n  ③ 국제항의 운영자는 국제항이 제2항에 따른 시설기준 등에 미치지 못하게 된 경우 그 시설 등을 신속하게 개선하여야 하며, 재정경제부장관은 대통령령으로 정하는 바에 따라 그 시설 등의 개선을 명할 수 있다.<신설 2018. 12. 31., 2020. 12. 22., 2025. 10. 1.>\n  [전문개정 2010. 12. 30.]\n  [제목개정 2020. 12. 22.]","D18-2":"제18조의2(무료 또는 인하된 가격으로 공급하는 물품 및 용역금액의 배분 등) ① 법 제30조제1항제3호에 따라 무료 또는 인하된 가격으로 공급하는 물품 및 용역의 금액(실제 거래가격을 기준으로 산정한 금액을 말하며 국내에서 생산된 물품 및 용역을 공급하는 경우에는 부가가치세를 제외하고 산정한다)을 더하는 경우 다음 각 호의 요소를 고려하여 배분한다. <개정 2020. 10. 7.>\n    1. 해당 수입물품의 총생산량 대비 실제 수입된 물품의 비율\n    2. 공급하는 물품 및 용역이 해당 수입물품 외의 물품 생산과 함께 관련되어 있는 경우 각 생산 물품별 거래가격(해당 수입물품 외의 물품이 국내에서 생산되는 경우에는 거래가격에서 부가가치세를 제외한다) 합계액 대비 해당 수입물품 거래가격의 비율\n  ② 제1항에도 불구하고 납세의무자는 법 제30조제1항제3호에 따라 무료 또는 인하된 가격으로 공급하는 물품 및 용역의 가격 또는 인하차액 전액을 최초로 수입되는 물품의 실제로 지급하였거나 지급하여야 할 가격에 배분할 수 있다. 이 경우 수입되는 전체 물품에 관세율이 다른 여러 개의 물품이 혼재된 경우에는 전단에 따른 전액을 관세율이 다른 물품별로 최초로 수입되는 물품의 가격에 안분하여 배분한다. <신설 2020. 10. 7.>\n  [본조신설 2013. 2. 15.]","L135-0":"제135조(입항절차) ① 국제무역선이나 국제무역기가 국제항(제134조제1항 단서에 따라 출입허가를 받은 지역을 포함한다. 이하 같다)에 입항하려는 때에는 선장이나 기장은 대통령령으로 정하는 사항이 적힌 선박용품 또는 항공기용품의 목록, 여객명부, 승무원명부, 승무원 휴대품목록과 적재화물목록을 첨부하여 관세청장이 정하는 바에 따라 세관장에게 입항보고를 하여야 하며, 국제무역선은 선박국적증서와 최종 출발항의 출항허가증이나 이를 갈음할 서류를 제시하여야 한다. 다만, 세관장은 감시ㆍ단속에 지장이 없다고 인정될 때에는 선박용품 또는 항공기용품의 목록이나 승무원 휴대품목록의 첨부를 생략하게 할 수 있다. <개정 2020. 12. 22., 2024. 12. 31.>\n  ② 세관장은 신속한 입항 및 통관절차의 이행과 효율적인 감시ㆍ단속을 위하여 필요할 때에는 관세청장이 정하는 바에 따라 입항하는 해당 선박 또는 항공기가 소속된 선박회사 또는 항공사(그 업무를 대행하는 자를 포함한다. 이하 같다)로 하여금 제1항에 따른 여객명부ㆍ적재화물목록 등을 입항하기 전에 제출하게 할 수 있다. 다만, 제222조제1항제2호에 따른 화물운송주선업자(제254조의2제1항에 따른 탁송품 운송업자로 한정한다. 이하 이 항에서 같다)로서 대통령령으로 정하는 요건을 갖춘 자가 작성한 적재화물목록은 관세청장이 정하는 바에 따라 해당 화물운송주선업자로 하여금 제출하게 할 수 있다.<개정 2015. 12. 15., 2020. 12. 22.>\n  [전문개정 2010. 12. 30.]","R9-0":"제9조(부과고지 대상물품) 법 제39조제1항제6호의 규정에 의하여 세관장이 관세를 부과고지하는 물품은 다음 각호와 같다.\n    1. 여행자 또는 승무원의 휴대품 및 별송품\n    2. 우편물(법 제258조제2항에 해당하는 것을 제외한다)\n    3. 법령의 규정에 의하여 세관장이 관세를 부과ㆍ징수하는 물품\n    4. 제1호 내지 제3호외에 납세신고가 부적당하다고 인정하여 관세청장이 지정하는 물품","L115-0":"제115조(관세조사의 결과 통지) 세관공무원은 제110조제2항 각 호의 어느 하나에 해당하는 조사를 종료하였을 때에는 종료 후 20일 이내에 그 조사 결과를 서면으로 납세자에게 통지하여야 한다. 다만, 납세자가 폐업한 경우 등 대통령령으로 정하는 경우에는 그러하지 아니하다. <개정 2017. 12. 19.>\n  [전문개정 2010. 12. 30.]","D142-0":"제142조(과세전통지의 생략) 법 제118조제1항제6호에서 “대통령령으로 정하는 경우”란 다음 각 호의 어느 하나에 해당하는 경우를 말한다. <개정 2004. 3. 29., 2006. 5. 22., 2011. 4. 1., 2018. 2. 13.>\n    1. 납부세액의 계산착오 등 명백한 오류에 의하여 부족하게 된 세액을 징수하는 경우\n    2. 「감사원법」 제33조에 따른 감사원의 시정요구에 따라 징수하는 경우\n    3. 납세의무자가 부도ㆍ휴업ㆍ폐업 또는 파산한 경우\n    4. 법 제85조에 따른 관세품목분류위원회의 의결에 따라 결정한 품목분류에 의하여 수출입물품에 적용할 세율이나 품목분류의 세번이 변경되어 부족한 세액을 징수하는 경우\n    5. 법 제118조제4항제2호 후단 및 제128조제1항제3호 후단(법 제132조제4항에서 준용하는 경우를 포함한다)에 따른 재조사 결과에 따라 해당 처분의 취소ㆍ경정을 하거나 필요한 처분을 하는 경우","D220-0":"제220조(매각대행기관) 법 제208조제4항에 따라 세관장이 매각을 대행하게 할 수 있는 기관은 다음 각 호의 기관 또는 법인ㆍ단체 중에서 관세청장이 지정하는 기관ㆍ법인 또는 단체(이하 “매각대행기관”이라 한다)로 한다. <개정 2006. 5. 22., 2014. 3. 24., 2022. 2. 17., 2023. 2. 28.>\n    1. 「한국자산관리공사 설립 등에 관한 법률」에 따른 한국자산관리공사\n    2. 「한국보훈복지의료공단법」에 의하여 설립된 한국보훈복지의료공단\n    3. 관세청장이 정하는 기준에 따라 전자문서를 통한 매각을 수행할 수 있는 시설 및 시스템 등을 갖춘 것으로 인정되는 법인 또는 단체\n    4. 삭제 <2002. 12. 30.>","D222-0":"제222조(매각방법 등) ①법 제210조제2항의 규정에 의한 예정가격의 체감은 제2회 경쟁입찰 때부터 하되, 그 체감한도액은 최초예정가격의 100분의 50으로 한다. 다만, 관세청장이 정하는 물품을 제외하고는 최초예정가격을 기초로 하여 산출한 세액이하의 금액으로 체감할 수 없다.\n  ②응찰가격중 다음 회의 입찰에 체감될 예정가격보다 높은 것이 있는 때에는 응찰가격의 순위에 따라 법 제210조제2항의 규정에 의한 수의계약을 체결한다. 단독응찰자의 응찰가격이 다음 회의 입찰시에 체감될 예정가격보다 높은 경우 또는 공매절차가 종료한 물품을 최종 예정가격이상의 가격으로 매수하려는 자가 있는 때에도 또한 같다.\n  ③제2항의 경우 수의계약을 체결하지 못하고 재입찰에 부친 때에는 직전입찰에서의 최고응찰가격을 다음 회의 예정가격으로 한다. <개정 2017. 3. 27.>\n  ④제2항의 규정에 의하여 수의계약을 할 수 있는 자로서 그 체결에 응하지 아니하는 자는 당해 물품에 대한 다음 회 이후의 경쟁입찰에 참가할 수 없다.\n  ⑤법 제210조제4항에서 “대통령령으로 정하는 물품”이란 다음 각 호의 어느 하나에 해당하는 물품중에서 관세청장이 신속한 매각이 필요하다고 인정하여 위탁판매대상으로 지정한 물품을 말한다. <개정 2011. 4. 1.>\n    1. 부패하거나 부패의 우려가 있는 물품\n    2. 기간경과로 사용할 수 없게 되거나 상품가치가 현저히 감소할 우려가 있는 물품\n    3. 공매하는 경우 매각의 효율성이 저하되거나 공매에 전문지식이 필요하여 직접 공매하기에 부적합한 물품\n  ⑥법 제210조제4항의 규정에 의하여 위탁판매하는 경우 판매가격은 당해 물품의 최종예정가격(제5항의 규정에 해당하는 물품은 제7항의 규정에 의하여 산출한 가격을 말한다)으로 하고, 위탁판매의 장소ㆍ방법ㆍ수수료 기타 필요한 사항은 관세청장이 정한다.\n  ⑦법 제210조에 따라 매각할 물품의 예정가격과 매각된 물품의 과세가격은 재정경제부령으로 정하는 바에 따라 산출한다. <개정 2020. 10. 7., 2025. 12. 30.>\n  ⑧법 제210조의 규정에 의하여 매각한 물품으로 다음 각호의 1에 해당하는 물품은 수출하거나 외화를 받고 판매하는 것을 조건으로 매각한다. 다만, 제2호의 물품으로서 관세청장이 필요하다고 인정하는 물품은 주무부장관 또는 주무부장관이 지정하는 기관의 장과 협의하여 수입하는 것을 조건으로 판매할 수 있다.\n    1. 법률에 의하여 수입이 금지된 물품\n    2. 기타 관세청장이 지정하는 물품\n  ⑨법 제210조제3항제2호에서 “매각물품의 성질ㆍ형태ㆍ용도 등을 고려할 때 경쟁입찰의 방법으로 매각할 수 없는 경우”란 다음 각 호의 어느 하나에 해당하는 경우를 말한다. <개정 2011. 4. 1.>\n    1. 부패ㆍ손상ㆍ변질 등의 우려가 현저한 물품으로서 즉시 매각하지 아니하면 상품가치가 저하할 우려가 있는 경우\n    2. 물품의 매각예정가격이 50만원미만인 경우\n    3. 경쟁입찰의 방법으로 매각하는 것이 공익에 반하는 경우","D270-2":"제270조의2(통고처분) ① 법 제311조제1항제1호에 따른 벌금에 상당하는 금액은 해당 벌금 최고액의 100분의 30으로 한다. 다만, 별표 4에 해당하는 범죄로서 해당 물품의 원가가 해당 벌금의 최고액 이하인 경우에는 해당 물품 원가의 100분의 30으로 한다. <개정 2020. 2. 11.>\n  ② 관세청장이나 세관장은 관세범이 조사를 방해하거나 증거물을 은닉ㆍ인멸ㆍ훼손한 경우 등 관세청장이 정하여 고시하는 사유에 해당하는 경우에는 제1항에 따른 금액의 100분의 50 범위에서 관세청장이 정하여 고시하는 비율에 따라 그 금액을 늘릴 수 있다.\n  ③ 관세청장이나 세관장은 관세범이 조사 중 해당 사건의 부족세액을 자진하여 납부한 경우, 심신미약자인 경우 또는 자수한 경우 등 관세청장이 정하여 고시하는 사유에 해당하는 경우에는 제1항에 따른 금액의 100분의 50 범위에서 관세청장이 정하여 고시하는 비율에 따라 그 금액을 줄일 수 있다.\n  ④ 관세범이 제2항 및 제3항에 따른 사유에 2가지 이상 해당하는 경우에는 각각의 비율을 합산하되, 합산한 비율이 100분의 50을 초과하는 경우에는 100분의 50으로 한다.\n  ⑤ 관세청장이나 세관장은 법 제311조제1항에 따라 통고처분을 하는 경우 관세범의 조사를 마친 날부터 10일 이내에 그 범칙행위자 및 법 제279조의 양벌 규정이 적용되는 법인 또는 개인별로 통고서를 작성하여 통고해야 한다. <신설 2019. 2. 12.>\n  ⑥ 법 제311조제5항에서 “대통령령으로 정하는 통고처분납부대행기관”이란 정보통신망을 이용하여 신용카드, 직불카드 등(이하 이 조에서 “신용카드등”이라 한다)에 의한 결재를 수행하는 기관으로서 다음 각 호의 어느 하나에 해당하는 기관을 말한다. <신설 2019. 2. 12.>\n    1. 「민법」 제32조에 따라 설립된 금융결제원\n    2. 시설, 업무수행능력, 자본금 규모 등을 고려하여 관세청장이 지정하는 자\n  ⑦ 제6항에 따른 통고처분납부대행기관은 납부대행의 대가로 재정경제부령으로 정하는 바에 따라 납부대행 수수료를 받을 수 있다. <신설 2019. 2. 12., 2025. 12. 30.>\n  ⑧ 관세청장은 납부에 사용되는 신용카드등의 종류 등 납부에 필요한 사항을 정할 수 있다. <신설 2019. 2. 12.>\n  [본조신설 2016. 2. 5.]","R60-2":"제60조의2(납세증명서의 발급 신청) 영 제141조의8에 따른 납세증명서의 발급 신청서는 별지 제1호서식과 같다. <개정 2024. 3. 22.>\n  [본조신설 2016. 3. 9.]","L116-4":"제116조의4(고액ㆍ상습체납자의 감치) ① 법원은 검사의 청구에 따라 체납자가 다음 각 호의 사유에 모두 해당하는 경우 결정으로 30일의 범위에서 체납된 관세(세관장이 부과ㆍ징수하는 내국세등을 포함한다. 이하 이 조에서 같다)가 납부될 때까지 그 체납자를 감치(監置)에 처할 수 있다.\n    1. 관세를 3회 이상 체납하고 있고, 체납발생일부터 각 1년이 경과하였으며, 체납금액의 합계가 2억원 이상인 경우\n    2. 체납된 관세의 납부능력이 있음에도 불구하고 정당한 사유 없이 체납한 경우\n    3. 제116조의2제2항에 따른 관세정보위원회의 의결에 따라 해당 체납자에 대한 감치 필요성이 인정되는 경우\n  ② 관세청장은 체납자가 제1항 각 호의 사유에 모두 해당하는 경우에는 체납자의 주소 또는 거소를 관할하는 지방공소청 또는 지청의 검사에게 체납자의 감치를 신청할 수 있다.<개정 2026. 3. 24.>\n  ③ 관세청장은 제2항에 따라 체납자의 감치를 신청하기 전에 체납자에게 대통령령으로 정하는 바에 따라 소명자료를 제출하거나 의견을 진술할 수 있는 기회를 주어야 한다.\n  ④ 제1항의 결정에 대하여는 즉시항고를 할 수 있다.\n  ⑤ 제1항에 따라 감치에 처하여진 체납자는 동일한 체납사실로 인하여 재차 감치되지 아니한다.\n  ⑥ 제1항에 따라 감치에 처하는 재판을 받은 체납자가 그 감치의 집행 중에 체납된 관세를 납부한 경우에는 감치집행을 종료하여야 한다.\n  ⑦ 제1항에 따른 감치집행시 세관공무원은 감치대상자에게 감치사유, 감치기간, 제6항에 따른 감치집행의 종료 등 감치결정에 대한 사항을 설명하고 그 밖의 감치집행에 필요한 절차에 협력하여야 한다.\n  ⑧ 제1항에 따른 감치에 처하는 재판 절차 및 그 집행, 그 밖에 필요한 사항은 대법원규칙으로 정한다.\n  [본조신설 2019. 12. 31.]","R77-6":"제77조의6(수출ㆍ수입 또는 반송의 신고) ① 영 제246조제1항제7호에서 “재정경제부령으로 정하는 참고사항”이란 다음 각 호를 말한다. <개정 2024. 3. 22., 2026. 1. 2.>\n    1. 물품의 모델 및 중량\n    2. 품목분류표의 품목 번호\n    3. 법 제226조에 따른 허가ㆍ승인ㆍ표시 또는 그 밖의 조건을 갖춘 것임을 증명하기 위하여 발급된 서류의 명칭\n    4. 수출입 법령에 따라 통관이 일시적으로 제한ㆍ금지되는 물품인지 여부를 확인할 수 있는 정보로서 관세청장이 관계 중앙행정기관의 장과 협의하여 관보에 공고하는 정보\n  ② 영 제246조제2항에 따른 수출 또는 반송의 신고서는 별지 제1호의2서식과 같다.\n  ③ 영 제246조제2항에 따른 수입의 신고서는 별지 제1호의3서식과 같다.\n  ④ 법 제327조제2항에 따른 전자신고의 작성에 필요한 구체적인 사항은 관세청장이 정하여 고시한다.\n  [본조신설 2016. 3. 9.]\n  제78조 삭제 <2024. 3. 22.>","L84-0":"제84조(품목분류체계의 수정) 재정경제부장관은 「통일상품명 및 부호체계에 관한 국제협약」에 따른 관세협력이사회의 권고 또는 결정 등 대통령령으로 정하는 사유로 다음 각 호에 따른 표 또는 품목분류의 품목을 수정할 필요가 있는 경우 그 세율이 변경되지 아니하는 경우에는 대통령령으로 정하는 바에 따라 품목을 신설 또는 삭제하거나 다시 분류할 수 있다. <개정 2025. 10. 1.>\n    1. 별표 관세율표\n    2. 제73조 및 제76조에 따라 대통령령으로 정한 품목분류\n    3. 「통일상품명 및 부호체계에 관한 국제협약」 및 별표 관세율표를 기초로 재정경제부장관이 품목을 세분하여 고시하는 관세ㆍ통계통합품목분류표(이하 “품목분류표”라 한다)\n  [전문개정 2023. 12. 31.]","L277-2":"제277조의2(금품 수수 및 공여) ① 세관공무원이 그 직무와 관련하여 금품을 수수(收受)하였을 때에는 「국가공무원법」 제82조에 따른 징계절차에서 그 금품 수수액의 5배 내의 징계부가금 부과 의결을 징계위원회에 요구하여야 한다.\n  ② 징계대상 세관공무원이 제1항에 따른 징계부가금 부과 의결 전후에 금품 수수를 이유로 다른 법률에 따라 형사처벌을 받거나 변상책임 등을 이행한 경우(몰수나 추징을 당한 경우를 포함한다)에는 징계위원회에 감경된 징계부가금 부과 의결 또는 징계부가금 감면을 요구하여야 한다.\n  ③ 제1항 및 제2항에 따른 징계부가금 부과 의결 요구에 관하여는 「국가공무원법」 제78조제4항을 준용한다. 이 경우 “징계 의결 요구”를 “징계부가금 부과 의결 요구”로 본다.\n  ④ 제1항에 따라 징계부가금 부과처분을 받은 자가 납부기간 내에 그 부가금을 납부하지 아니한 때에는 징계권자는 국세강제징수의 예에 따라 징수할 수 있다.<개정 2020. 12. 29.>\n  ⑤ 관세청장 또는 세관장은 세관공무원에게 금품을 공여한 자에 대해서는 대통령령으로 정하는 바에 따라 그 금품 상당액의 2배 이상 5배 내의 과태료를 부과ㆍ징수한다. 다만, 「형법」 등 다른 법률에 따라 형사처벌을 받은 경우에는 과태료를 부과하지 아니하고, 과태료를 부과한 후 형사처벌을 받은 경우에는 과태료 부과를 취소한다.<개정 2019. 12. 31.>\n  [본조신설 2017. 12. 19.]","L206-0":"제206조(유치 및 예치) ① 세관장은 제1호에 해당하는 물품이 제2호의 사유에 해당하는 경우에는 해당 물품을 유치할 수 있다. <개정 2020. 12. 22., 2023. 12. 31., 2024. 12. 31.>\n    1. 유치대상: 다음 각 목의 어느 하나에 해당하는 물품\n      가. 여행자의 휴대품\n      나. 우리나라와 외국 간을 왕래하는 운송수단에 종사하는 승무원의 휴대품\n    2. 유치사유: 다음 각 목의 어느 하나에 해당하는 경우\n      가. 제226조에 따라 필요한 허가ㆍ승인ㆍ표시 또는 그 밖의 조건이 갖추어지지 아니한 경우\n      나. 제96조제1항제1호와 같은 항 제3호에 따른 관세의 면제 기준을 초과하여 반입하는 물품에 대한 관세를 납부하지 아니한 경우\n      다. 제235조에 따른 지식재산권 등을 침해하는 물품을 수출하거나 수입하는 등 이 법에 따른 의무사항을 위반한 경우\n      라. 불법ㆍ불량ㆍ유해물품 등 사회안전 또는 국민보건을 해칠 우려가 있는 물품으로서 대통령령으로 정하는 경우\n      마. 「국세징수법」 제30조 또는 「지방세징수법」 제39조의2에 따라 세관장에게 강제징수 또는 체납처분이 위탁된 해당 체납자가 물품을 수입하는 경우\n  ② 제1항에 따라 유치한 물품은 해당 사유가 없어졌거나 반송하는 경우에만 유치를 해제한다.<개정 2020. 6. 9.>\n  ③ 제1항제1호 각 목의 어느 하나에 해당하는 물품으로서 수입할 의사가 없는 물품은 세관장에게 신고하여 일시 예치시킬 수 있다. 다만, 부패ㆍ변질 또는 손상의 우려가 있는 물품 등 관세청장이 정하는 물품은 그러하지 아니하다.\n  <개정 2020. 12. 22.>\n  [전문개정 2010. 12. 30.]","L137-2":"제137조의2(승객예약자료의 요청) ① 세관장은 다음 각 호의 어느 하나에 해당하는 업무를 수행하기 위하여 필요한 경우 제135조에 따라 입항하거나 제136조에 따라 출항하는 선박 또는 항공기가 소속된 선박회사 또는 항공사가 운영하는 예약정보시스템의 승객예약자료(이하 이 조에서 “승객예약자료”라 한다)를 정보통신망을 통하여 열람하거나 재정경제부령으로 정하는 시한 내에 제출하여 줄 것을 선박회사 또는 항공사에 요청할 수 있다. 이 경우 해당 선박회사 또는 항공사는 이에 따라야 한다. <개정 2023. 12. 31., 2025. 10. 1., 2025. 12. 23.>\n    1. 제234조에 따른 수출입금지물품을 수출입한 자 또는 수출입하려는 자에 대한 검사업무\n    2. 제241조제1항ㆍ제2항을 위반한 자 또는 제241조제1항ㆍ제2항을 위반하여 다음 각 목의 어느 하나의 물품을 수출입하거나 반송하려는 자에 대한 검사업무\n      가. 제234조의2에 따른 마약류등\n      나. 「총포ㆍ도검ㆍ화약류 등의 안전관리에 관한 법률」에 따른 총포ㆍ도검ㆍ화약류ㆍ분사기ㆍ전자충격기 및 석궁\n  ② 세관장이 제1항에 따라 열람이나 제출을 요청할 수 있는 승객예약자료는 다음 각 호의 자료로 한정한다.\n    1. 국적, 성명, 생년월일, 여권번호 및 예약번호\n    2. 주소 및 전화번호\n    3. 예약 및 탑승수속 시점\n    4. 항공권 또는 승선표의 번호ㆍ발권일ㆍ발권도시 및 대금결제방법\n    5. 여행경로 및 여행사\n    6. 동반탑승자 및 좌석번호\n    7. 수하물 자료\n    8. 항공사 또는 선박회사의 회원으로 가입한 경우 그 회원번호 및 등급과 승객주문정보\n  ③ 제1항에 따라 제공받은 승객예약자료를 열람할 수 있는 사람은 관세청장이 지정하는 세관공무원으로 한정한다.\n  ④ 제3항에 따른 세관공무원은 직무상 알게 된 승객예약자료를 누설 또는 권한 없이 처리하거나 타인이 이용하도록 제공하는 등 부당한 목적을 위하여 사용하여서는 아니 된다.\n  ⑤ 제1항에 따라 제공받은 승객예약자료의 열람방법, 보존기한 등에 관하여 필요한 사항은 대통령령으로 정한다.\n  [전문개정 2010. 12. 30.]","D2-0":"제2조(천재지변 등으로 인한 기한의 연장) ①법 제10조에서 “대통령령으로 정하는 사유”란 다음 각 호의 어느 하나에 해당하는 경우를 말한다. <개정 2011. 4. 1.>\n    1. 전쟁ㆍ화재 등 재해나 도난으로 인하여 재산에 심한 손실을 입은 경우\n    2. 사업에 현저한 손실을 입은 경우\n    3. 사업이 중대한 위기에 처한 경우\n    4. 그 밖에 세관장이 제1호부터 제3호까지의 규정에 준하는 사유가 있다고 인정하는 경우\n  ②세관장은 법 제10조의 규정에 의하여 납부기한을 연장하는 때에는 관세청장이 정하는 기준에 의하여야 한다.\n  ③법 제10조의 규정에 의하여 납부기한을 연장받고자 하는 자는 다음 각호의 사항을 기재한 신청서를 당해 납부기한이 종료되기 전에 세관장에게 제출하여야 한다.\n    1. 납세의무자의 성명ㆍ주소 및 상호\n    2. 납부기한을 연장받고자 하는 세액 및 당해 물품의 신고일자ㆍ신고번호ㆍ품명ㆍ규격ㆍ수량 및 가격\n    3. 납부기한을 연장받고자 하는 사유 및 기간\n  ④세관장은 법 제10조에 따라 납부기한을 연장한 때에는 법 제39조에 따른 납부고지를 해야 한다. <개정 2021. 2. 17.>\n  ⑤ 삭제 <2017. 3. 27.>\n  ⑥세관장은 법 제10조의 규정에 의하여 납부기한연장을 받은 납세의무자가 다음 각호의 1에 해당하게 된 때에는 납부기한연장을 취소할 수 있다.\n    1. 관세를 지정한 납부기한내에 납부하지 아니하는 때\n    2. 재산상황의 호전 기타 상황의 변화로 인하여 납부기한연장을 할 필요가 없게 되었다고 인정되는 때\n    3. 파산선고, 법인의 해산 기타의 사유로 당해 관세의 전액을 징수하기 곤란하다고 인정되는 때\n  ⑦세관장은 제6항에 따라 납부기한연장을 취소한 때에는 15일 이내의 납부기한을 정하여 법 제39조에 따른 납부고지를 해야 한다. <개정 2013. 2. 15., 2021. 2. 17.>\n  [제목개정 2011. 4. 1.]","L149-0":"제149조(국경출입차량의 도착절차) ① 국경출입차량이 통관역이나 통관장에 도착하면 통관역장이나 도로차량(선박ㆍ 철도차량 또는 항공기가 아닌 운송수단을 말한다. 이하 같다)의 운전자는 차량용품목록ㆍ여객명부ㆍ승무원명부 및 승무원 휴대품목록과 관세청장이 정하는 적재화물목록을 첨부하여 지체 없이 세관장에게 도착보고를 하여야 하며, 최종 출발지의 출발허가서 또는 이를 갈음하는 서류를 제시하여야 한다. 다만, 세관장은 감시ㆍ단속에 지장이 없다고 인정될 때에는 차량용품목록이나 승무원 휴대품목록의 첨부를 생략하게 할 수 있다. <개정 2020. 12. 22.>\n  ② 세관장은 신속한 입국 및 통관절차의 이행과 효율적인 감시ㆍ단속을 위하여 필요한 경우에는 관세청장이 정하는 바에 따라 도착하는 해당 차량이 소속된 회사(그 업무를 대행하는 자를 포함한다. 이하 같다)로 하여금 제1항에 따른 여객명부ㆍ적재화물목록 등을 도착하기 전에 제출하게 할 수 있다.<개정 2020. 12. 22.>\n  ③ 제1항에도 불구하고 대통령령으로 정하는 물품을 일정 기간에 일정량으로 나누어 반복적으로 운송하는 데에 사용되는 도로차량의 운전자는 제152조제2항에 따라 사증(査證)을 받는 것으로 도착보고를 대신할 수 있다. 다만, 최종 도착보고의 경우는 제외한다.\n  ④ 제3항에 따라 사증을 받는 것으로 도착보고를 대신하는 도로차량의 운전자는 최종 도착보고를 할 때에 제1항에 따른 서류를 한꺼번에 제출하여야 한다.\n  [전문개정 2010. 12. 30.]","L178-0":"제178조(반입정지 등과 특허의 취소) ① 세관장은 특허보세구역의 운영인이 다음 각 호의 어느 하나에 해당하는 경우에는 관세청장이 정하는 바에 따라 6개월의 범위에서 해당 특허보세구역에의 물품반입 또는 보세건설ㆍ보세판매ㆍ 보세전시 등(이하 이 조에서 “물품반입등”이라 한다)을 정지시킬 수 있다. <개정 2019. 12. 31.>\n    1. 장치물품에 대한 관세를 납부할 자금능력이 없다고 인정되는 경우\n    2. 본인이나 그 사용인이 이 법 또는 이 법에 따른 명령을 위반한 경우\n    3. 해당 시설의 미비 등으로 특허보세구역의 설치 목적을 달성하기 곤란하다고 인정되는 경우\n    4. 그 밖에 제1호부터 제3호까지의 규정에 준하는 것으로서 대통령령으로 정하는 사유에 해당하는 경우\n  ② 세관장은 특허보세구역의 운영인이 다음 각 호의 어느 하나에 해당하는 경우에는 그 특허를 취소할 수 있다. 다만, 제1호, 제2호 및 제5호에 해당하는 경우에는 특허를 취소하여야 한다.<개정 2011. 12. 31., 2014. 12. 23., 2016. 12. 20., 2018. 12. 31.>\n    1. 거짓이나 그 밖의 부정한 방법으로 특허를 받은 경우\n    2. 제175조 각 호의 어느 하나에 해당하게 된 경우. 다만, 제175조제8호에 해당하는 경우로서 같은 조 제2호 또는 제3호에 해당하는 사람을 임원으로 하는 법인이 3개월 이내에 해당 임원을 변경한 경우에는 그러하지 아니하다.\n    3. 1년 이내에 3회 이상 물품반입등의 정지처분(제3항에 따른 과징금 부과처분을 포함한다)을 받은 경우\n    4. 2년 이상 물품의 반입실적이 없어서 세관장이 특허보세구역의 설치 목적을 달성하기 곤란하다고 인정하는 경우\n    5. 제177조의2를 위반하여 명의를 대여한 경우\n  ③ 세관장은 제1항에 따른 물품반입등의 정지처분이 그 이용자에게 심한 불편을 주거나 공익을 해칠 우려가 있는 경우에는 특허보세구역의 운영인에게 물품반입등의 정지처분을 갈음하여 해당 특허보세구역 운영에 따른 매출액의 100분의 3 이하의 과징금을 부과할 수 있다. 이 경우 매출액 산정, 과징금의 금액, 과징금의 납부기한 등에 관하여 필요한 사항은 대통령령으로 정한다.\n  ④ 제3항에 따른 과징금을 납부하여야 할 자가 납부기한까지 납부하지 아니한 경우 과징금의 징수에 관하여는 제26조를 준용한다.\n  [전문개정 2010. 12. 30.]","L233-3":"제233조의3(원산지표시위반단속기관협의회) ① 이 법, 「농수산물의 원산지 표시 등에 관한 법률」 및 「대외무역법」에 따른 원산지표시 위반 단속업무에 필요한 정보교류 등 대통령령으로 정하는 사항을 협의하기 위하여 관세청에 원산지표시위반단속기관협의회를 둔다. <개정 2021. 11. 30.>\n  ② 제1항에 따른 원산지표시위반단속기관협의회의 구성ㆍ운영과 그 밖에 필요한 사항은 대통령령으로 정한다.\n  [본조신설 2014. 1. 1.]","D256-0":"제256조(신고수리전 반출) ①법 제252조의 규정에 의한 승인을 얻고자 하는 자는 다음 각호의 사항을 기재한 신청서를 세관장에게 제출하여야 한다.\n    1. 제175조 각호의 사항\n    2. 신고의 종류\n    3. 신고연월일 및 신고번호\n    4. 신청사유\n  ②세관장이 제1항의 규정에 의한 신청을 받아 법 제252조의 규정에 의한 승인을 하는 때에는 관세청장이 정하는 절차에 따라야 한다.\n  ③ 다음 각 호의 어느 하나에 해당하는 물품에 대해서는 법 제252조 단서에 따라 담보의 제공을 생략할 수 있다. 다만, 제2호 및 제3호의 물품을 수입하는 자 중 관세 등의 체납, 불성실신고 등의 사유로 담보 제공을 생략하는 것이 타당하지 아니하다고 관세청장이 인정하는 자가 수입하는 물품에 대해서는 담보를 제공하게 할 수 있다. <신설 2011. 4. 1.>\n    1. 국가, 지방자치단체, 「공공기관의 운영에 관한 법률」 제4조에 따른 공공기관, 「지방공기업법」 제49조에 따라 설립된 지방공사 및 같은 법 제79조에 따라 설립된 지방공단이 수입하는 물품\n    2. 법 제90조제1항제1호 및 제2호에 따른 기관이 수입하는 물품\n    3. 최근 2년간 법 위반(관세청장이 법 제270조ㆍ제276조 및 제277조에 따른 처벌을 받은 자로서 재범의 우려가 없다고 인정하는 경우를 제외한다) 사실이 없는 수출입자 또는 신용평가기관으로부터 신용도가 높은 것으로 평가를 받은 자로서 관세청장이 정하는 자가 수입하는 물품\n    4. 수출용원재료 등 수입물품의 성질, 반입사유 등을 고려할 때 관세채권의 확보에 지장이 없다고 관세청장이 인정하는 물품\n    5. 거주 이전(移轉)의 사유, 납부할 세액 등을 고려할 때 관세채권의 확보에 지장이 없다고 관세청장이 정하여 고시하는 기준에 해당하는 자의 이사물품","D285-5":"제285조의5(전자문서중계사업자의 지정절차) ①법 제327조의3제1항에 따른 전자문서중계사업자의 지정을 받고자 하는 자는 관세청장이 정하는 서류를 갖추어 관세청장에게 신청하여야 한다. 지정을 받은 전자문서중계사업자가 지정받은 사항을 변경하고자 할 때에도 또한 같다. <개정 2009. 2. 4.>\n  ②관세청장은 법 제327조의3제1항에 따라 지정을 한 때에는 당해 신청인에게 지정증을 교부하고, 그 사실을 관계행정기관의 장 및 관세업무 관련기관의 장에게 통지하여야 한다. <개정 2009. 2. 4.>\n  [본조신설 2002. 12. 30.]\n  [제285조의4에서 이동, 종전 제285조의5는 제285조의6으로 이동 <2009. 2. 4.>]","D120-0":"제120조(용도 외 사용물품의 관세 감면 신청 등) ①법 제103조의 규정에 의하여 관세의 감면을 받고자 하는 자는 제109조제1항 또는 제134조의 규정에 의한 승인 또는 확인신청시에 다음 각호의 사항을 기재한 신청서에 그 새로운 용도에 사용하기 위하여 수입하는 때에 관세의 감면을 받기 위하여 필요한 서류를 첨부하여 세관장에게 제출하여야 한다.\n    1. 당해 물품의 품명ㆍ규격ㆍ수량 및 가격\n
