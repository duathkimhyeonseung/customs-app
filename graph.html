여야 한다.\n  [본조신설 2014. 12. 23.]","D283-0":"제283조(몰수품 등에 대한 보관료 등의 지급기준) 법 제326조제4항에서 “대통령령으로 정하는 금액”이란 통상적인 물품의 보관료 및 관리비를 고려하여 관세청장이 정하여 고시하는 금액을 말한다. 이 경우 해당 물품의 매각대금에서 보관료 및 관리비를 지급하는 경우에는 매각대금에서 매각비용을 공제한 금액을 초과하여 지급할 수 없다. <개정 2002. 12. 30., 2011. 4. 1., 2020. 12. 29.>","D239-0":"제239조(통관보류등) ① 세관장은 법 제235조제3항 및 제4항에 따라 통관보류등이 요청된 같은 조 제3항 각 호의 어느 하나에 해당하는 물품이 지식재산권등을 침해한 물품이라고 인정되면 해당 물품의 통관보류등을 하여야 한다. 다만, 지식재산권등의 권리자가 해당 물품의 통관 또는 유치 해제에 동의하는 때에는 관세청장이 정하는 바에 따라 통관을 허용하거나 유치를 해제할 수 있다. <개정 2011. 4. 1., 2025. 2. 28.>\n  ② 세관장은 법 제235조제5항 및 제7항에 따라 통관보류등을 한 경우 그 사실을 해당 물품의 수출입, 환적 또는 복합환적, 보세구역 반입, 보세운송, 법 제141조제1호에 따른 일시양륙의 신고(이하 “수출입신고등”이라 한다)를 한 자 또는 법 제235조제3항제6호에 해당하는 물품의 화주(이하 “우편물의 화주”라 한다)에게 통보해야 하며, 지식재산권등의 권리자에게는 통관보류등의 사실 및 다음 각 호의 사항을 통보해야 한다. <개정 2008. 2. 22., 2011. 4. 1., 2021. 2. 17., 2023. 2. 28., 2025. 2. 28., 2026. 2. 27.>\n    1. 다음 각 목에 해당하는 자의 성명과 주소\n      가. 수출입신고등을 한 자 또는 우편물의 화주\n      나. 물품발송인\n      다. 물품수신인\n    2. 통관보류등을 한 물품의 성질ㆍ상태 및 수량\n    3. 원산지 등 그 밖의 필요한 사항\n  ③세관장은 통관보류등을 요청한 자가 제2항에 따라 해당 물품에 대한 통관보류등의 사실을 통보받은 후 10일(법 제8조제3항 각 호에 해당하는 날은 제외한다. 이하 이 항에서 같다) 이내에 법원에의 제소사실 또는 무역위원회에의 조사신청사실을 입증하였을 때에는 해당 통관보류등을 계속할 수 있다. 이 경우 통관보류등을 요청한 자가 부득이한 사유로 인하여 10일 이내에 법원에 제소하지 못하거나 무역위원회에 조사신청을 하지 못하는 때에는 상기 입증기간은 10일간 연장될 수 있다. <개정 2011. 4. 1., 2017. 3. 27., 2023. 2. 28.>\n  ④제3항에도 불구하고 해당 통관보류등이 법원의 임시보호조치에 따라 시행되는 상태이거나 계속되는 경우 통관보류등의 기간은 다음 각 호의 구분에 따른다. <개정 2011. 4. 1., 2021. 2. 17.>\n    1. 법원에서 임시보호조치 기간을 명시한 경우: 그 마지막 날\n    2. 법원에서 임시보호조치 기간을 명시하지 않은 경우: 임시보호조치 개시일부터 31일\n  ⑤법 제235조제7항에 따른 통관보류등은 위반사실 및 통관보류등을 한 해당 물품의 신고번호ㆍ품명ㆍ수량 등을 명시한 문서로써 하여야 한다. <신설 2007. 4. 5., 2011. 4. 1.>\n  ⑥법 제235조제5항 및 제7항에 따라 통관보류등이 된 물품은 통관이 허용되거나 유치가 해제될 때까지 세관장이 지정한 장소에 보관하여야 한다. <개정 2007. 4. 5., 2011. 4. 1.>\n  [제목개정 2011. 4. 1.]","L79-0":"제79조(대항조치) ① 정부는 외국이 특정물품에 관한 양허의 철회ㆍ수정 또는 그 밖의 조치를 하려고 하거나 그 조치를 한 경우 해당 조약에 따라 대항조치를 할 수 있다고 인정될 때에는 다음 각 호의 조치를 할 수 있다.\n    1. 특정물품에 대하여 이 법에 따른 관세 외에 그 물품의 과세가격 상당액의 범위에서 관세를 부과하는 조치\n    2. 특정물품에 대하여 관세의 양허를 하고 있는 경우에는 그 양허의 적용을 정지하고 이 법에 따른 세율의 범위에서 관세를 부과하는 조치\n  ② 제1항 각 호의 조치는 외국의 조치에 대한 대항조치로서 필요한 범위에서만 할 수 있다.\n  ③ 제1항에 따른 조치의 대상 국가, 시기, 내용, 그 밖에 필요한 사항은 대통령령으로 정한다.\n  [전문개정 2010. 12. 30.]","D157-2":"제157조의2(적재화물목록을 제출할 수 있는 화물운송주선업자) 법 제135조제2항 단서 및 제136조제3항 단서에서 “대통령령으로 정하는 요건을 갖춘 자”란 각각 다음 각 호의 어느 하나에 해당하는 자를 말한다. <개정 2021. 2. 17., 2022. 2. 15., 2025. 12. 30.>\n    1. 법 제255조의2에 따라 수출입 안전관리 우수업체로 공인된 업체\n    2. 제259조의6제1항에 따른 준수도측정ㆍ평가의 결과가 우수한 자\n    3. 재정경제부령으로 정하는 화물운송 주선 실적이 있는 자\n  [본조신설 2016. 2. 5.]\n  [제목개정 2021. 2. 17.]","L197-0":"제197조(종합보세구역의 지정 등) ① 관세청장은 직권으로 또는 관계 중앙행정기관의 장이나 지방자치단체의 장, 그 밖에 종합보세구역을 운영하려는 자(이하 “지정요청자”라 한다)의 요청에 따라 무역진흥에의 기여 정도, 외국물품의 반입ㆍ반출 물량 등을 고려하여 일정한 지역을 종합보세구역으로 지정할 수 있다.\n  ② 종합보세구역에서는 보세창고ㆍ보세공장ㆍ보세전시장ㆍ보세건설장 또는 보세판매장의 기능 중 둘 이상의 기능 (이하 “종합보세기능”이라 한다)을 수행할 수 있다.\n  ③ 종합보세구역의 지정요건, 지정절차 등에 관하여 필요한 사항은 대통령령으로 정한다.\n  [전문개정 2010. 12. 30.]","L37-3":"제37조의3(관세의 부과 등을 위한 정보제공) 관세청장 또는 세관장은 과세가격의 결정ㆍ조정 및 관세의 부과ㆍ징수를 위하여 필요한 경우에는 국세청장, 지방국세청장 또는 관할 세무서장에게 대통령령으로 정하는 정보 또는 자료를 요청할 수 있다. 이 경우 요청을 받은 기관은 정당한 사유가 없으면 요청에 따라야 한다.\n  [본조신설 2011. 12. 31.]\n  [제37조의2에서 이동, 종전 제37조의3은 제37조의4로 이동 <2014. 12. 23.>]","D2-2":"제2조의2(공시송달) 법 제11조제2항제3호에서 “등기우편으로 송달하였으나 수취인 부재로 반송되는 경우 등 대통령령으로 정하는 경우”란 다음 각 호의 어느 하나에 해당하는 경우를 말한다.\n    1. 서류를 등기우편으로 송달하였으나 수취인이 부재중(不在中)인 것으로 확인되어 반송됨으로써 납부기한까지 송달이 곤란하다고 인정되는 경우\n    2. 세관공무원이 2회 이상 납세자를 방문[처음 방문한 날과 마지막 방문한 날 사이의 기간이 3일(기간을 계산할 때 공휴일, 대체공휴일, 토요일 및 일요일은 산입하지 않는다) 이상이어야 한다]해 서류를 교부하려고 하였으나 수취인이 부재중인 것으로 확인되어 납부기한까지 송달이 곤란하다고 인정되는 경우\n  [본조신설 2023. 2. 28.]","D213-2":"제213조의2(입국장 인도장의 설치ㆍ운영 등) ① 보세판매장이 법 제196조제1항제1호 단서에 따라 물품을 판매하는 경우에는 공항ㆍ항만 등의 입국경로에 설치된 해당 물품을 인도하는 장소(이하 “입국장 인도장”이라 한다)에서 물품을 인도해야 한다.\n  ② 제1항에 따른 입국장 인도장을 설치ㆍ운영하려는 자는 관할 세관장의 승인을 받아야 한다.\n  ③ 제2항에 따라 승인을 받으려는 자는 다음 각 호의 요건을 모두 갖추어 세관장에게 신청해야 한다.\n    1. 제189조제1호 및 제2호의 요건을 모두 갖출 것\n    2. 공항ㆍ항만 등의 입국경로에서 물품을 적절하게 관리ㆍ인도할 수 있는 공간을 확보할 것\n    3. 법 제96조에 따른 여행자 휴대품의 면세 통관이 적절하게 이루어질 수 있도록 입국장 인도장에서 인도한 물품의 내역을 확인하여 세관장에게 통보할 수 있는 관세청장이 정하는 전산설비 또는 시스템을 갖출 것. 다만, 해당 공항ㆍ항만 등의 입국경로에 법 제196조제2항에 따른 보세판매장(이하 “입국장 면세점”이라 한다)이 있는 경우에는 입국장 인도장에서 인도한 물품의 내역과 입국장 면세점에서 판매한 물품의 내역을 통합ㆍ확인하여 세관장에게 통보할 수 있는 관세청장이 정하는 전산설비 또는 시스템을 갖출 것\n    4. 입국장 인도장이 설치되는 공항ㆍ항만 등 입국경로의 시설을 관리하는 중앙행정기관ㆍ지방자치단체 또는 법인의 동의를 받을 것\n  ④ 관할 세관장은 제2항에 따른 승인을 받아 입국장 인도장을 설치ㆍ운영하는 자가 다음 각 호의 어느 하나에 해당하는 경우에는 그 승인을 취소할 수 있다.\n    1. 거짓이나 그 밖의 부정한 방법으로 승인을 받은 경우\n    2. 입국장 인도장을 설치한 자가 그 승인의 취소를 요청하는 경우\n    3. 제3항의 요건에 해당하지 않게 된 경우\n  ⑤ 법 제196조제1항제1호 단서에 따라 입국장 인도장에서 인도할 수 있는 물품의 종류 및 한도는 재정경제부령으로 정한다. <개정 2025. 12. 30.>\n  ⑥ 제1항부터 제5항까지에서 규정한 사항 외에 입국장 인도장 설치ㆍ운영 및 인도 방법 등에 관하여 필요한 사항은 관세청장이 정한다.\n  [본조신설 2020. 2. 11.]","L55-0":"제55조(덤핑방지관세의 부과 시기) 덤핑방지관세의 부과와 잠정조치는 각각의 조치일 이후 수입되는 물품에 대하여 적용된다. 다만, 잠정조치가 적용된 물품에 대하여 국제협약에서 달리 정하는 경우와 그 밖에 대통령령으로 정하는 경우에는 그 물품에 대하여도 덤핑방지관세를 부과할 수 있다.\n  [전문개정 2010. 12. 30.]","D81-0":"제81조(보조금등의 철폐 또는 삭감, 가격수정 등의 약속) ①상계관세의 부과여부를 결정하기 위한 조사가 개시된 물품의 수출국정부 또는 수출자가 법 제60조제1항의 규정에 의하여 약속을 제의하거나 법 제60조제2항의 규정에 의하여 피해조사를 계속하여 줄 것을 요청하고자 하는 때에는 제75조제5항의 규정에 의한 본조사의 결과에 따른 최종판정을 하기 45일 전에 서면(전자문서를 포함한다)으로 그 뜻을 무역위원회에 제출하여야 한다. 이 경우 무역위원회는 제출된 서류의 원본(전자문서로 제출된 경우에는 그 전자문서를 말한다)을 지체없이 재정경제부장관에게 송부하여야 한다. <개정 2008. 2. 29., 2024. 2. 29., 2025. 6. 2., 2025. 12. 30.>\n  ②재정경제부장관은 제1항의 규정에 의하여 제의한 약속이 다음 각호의 1에 해당하는 것인 때에는 그 약속을 수락할 수 있다. 다만, 그 약속의 이행을 확보하는 것이 곤란하다고 인정되는 경우로서 재정경제부령이 정하는 경우에는 그러하지 아니하다. <개정 2008. 2. 29., 2025. 12. 30.>\n    1. 즉시로 가격을 수정하는 약속인 경우\n    2. 약속일부터 6월 이내에 보조금등을 철폐 또는 삭감하는 약속인 경우\n    3. 약속일부터 6월 이내에 보조금등의 국내산업에 대한 피해효과를 제거하기 위한 적절한 조치에 관한 약속인 경우\n  ③재정경제부장관은 필요하다고 인정되는 때에는 법 제60조제1항의 규정에 의한 약속을 수출국정부 또는 수출자를 지정하여 제의할 수 있다. <개정 2008. 2. 29., 2025. 12. 30.>\n  ④재정경제부장관은 제75조제2항의 규정에 의한 예비조사결과 보조금등의 지급과 그로 인한 실질적 피해등의 사실이 있다고 추정되는 충분한 증거가 있다고 판정하기 전에는 제2항의 규정에 의한 약속의 수락이나 제3항의 규정에 의한 약속의 제의를 할 수 없다. <개정 2008. 2. 29., 2025. 12. 30.>\n  ⑤ 재정경제부장관은 수출국 정부 또는 수출자가 법 제60조제2항에 따라 수락된 약속을 이행하지 않은 경우 이용가능한 최선의 정보에 근거하여 다음 각 호의 구분에 따른 신속한 조치를 취할 수 있다. 이 경우 제2호에 따른 조치의 적용기간에 관하여는 제80조제2항 및 제3항을 준용한다. <개정 2020. 12. 29., 2025. 12. 30.>\n    1. 법 제60조제2항 단서에 따라 조사를 계속하여 상계관세율 등 부과내용을 정한 경우: 상계관세의 부과\n    2. 제1호 외의 경우: 법 제59조제1항제2호에 따른 잠정조치\n  ⑥재정경제부장관은 법 제60조제2항 단서의 규정에 의하여 조사를 계속한 결과 실질적 피해등의 사실이 없거나 보조금등의 금액이 없는 것으로 확인된 경우에는 당해 약속의 효력은 실효된 것으로 본다. 다만, 실질적 피해등의 사실이 없거나 보조금등의 금액이 없는 원인이 약속으로 인한 것으로 판단되는 때에는 재정경제부장관은 적정한 기간을 정하여 약속을 계속 이행하게 할 수 있으며, 수출국정부 또는 수출자가 그 약속의 이행을 거부하는 때에는 이용가능한 최선의 정보에 의하여 잠정조치를 실시하는 등 상계관세부과를 위한 신속한 조치를 취할 수 있다. <개정 2008. 2. 29., 2025. 12. 30.>","L258-0":"제258조(우편물통관에 대한 결정) ① 통관우체국의 장은 세관장이 우편물에 대하여 수출ㆍ수입 또는 반송을 할 수 없다고 결정하였을 때에는 그 우편물을 발송하거나 수취인에게 내줄 수 없다.\n  ② 우편물이 「대외무역법」 제11조에 따른 수출입의 승인을 받은 것이거나 그 밖에 대통령령으로 정하는 기준에 해당하는 것일 때에는 해당 우편물의 수취인이나 발송인은 제241조제1항에 따른 신고를 하여야 한다.<개정 2021. 12. 21.>\n  [전문개정 2010. 12. 30.]","D194-0":"제194조(특허의 승계신고) ①법 제179조제3항의 규정에 의하여 특허보세구역의 운영을 계속하고자 하는 상속인 또는 승계법인은 당해 특허보세구역의 종류ㆍ명칭 및 소재지를 기재한 특허보세구역승계신고서에 다음 각호의 서류를 첨부하여 세관장에게 제출하여야 한다.\n    1. 상속인 또는 승계법인을 확인할 수 있는 서류\n    2. 법 제174조제3항의 규정에 의한 특허요건의 구비를 확인할 수 있는 서류로서 관세청장이 정하는 서류\n  ②제1항의 규정에 의하여 신고를 받은 세관장은 이를 심사하여 신고일부터 5일 이내에 그 결과를 신고인에게 통보하여야 한다.","D129-0":"제129조(관세감면 및 분할납부 승인물품의 반입 및 변경신고) ①법 제83조ㆍ법 제89조제1항제2호ㆍ법 제90조ㆍ법 제91조ㆍ법 제93조ㆍ법 제95조, 법 제98조 및 법 제107조에 따라 용도세율의 적용, 관세의 감면 또는 분할납부의 승인을 받은 자는 해당 물품을 수입신고 수리일부터 1개월 이내에 설치 또는 사용할 장소에 반입하여야 한다. <개정 2017. 3. 27.>\n  ② 제1항에 따른 용도세율의 적용, 관세의 감면 또는 분할납부의 승인을 받은 자는 설치장소 부족 등 부득이한 반입 지연사유가 있는 경우에는 관세청장이 정하는 바에 따라 세관장에게 반입 기한의 연장을 신청할 수 있다. <신설 2017. 3. 27.>\n  ③ 제2항에 따른 신청을 받은 세관장은 수입신고 수리일부터 3개월의 범위에서 해당 기한을 연장할 수 있다. <신설 2017. 3. 27.>\n  ④제1항의 규정에 의하여 설치 또는 사용할 장소에 물품을 반입한 자는 당해 장소에 다음 각호의 사항을 기재한 장부를 비치하여야 한다. <개정 2017. 3. 27.>\n    1. 당해 물품의 품명ㆍ규격 및 수량\n    2. 당해 물품의 가격과 용도세율의 적용, 관세의 감면 또는 분할납부에 관한 사항\n    3. 당해 물품의 수입신고번호ㆍ수입신고수리 연월일과 통관지세관명\n    4. 설치 또는 사용장소에 반입한 연월일과 사용개시 연월일\n    5. 설치 또는 사용장소와 사용상황\n  ⑤ 제1항에 따른 용도세율의 적용, 관세의 감면 또는 분할납부의 승인을 받은 자는 다음 각 호의 물품을 해당 호에서 정한 기간 내에 그 설치 또는 사용 장소를 변경하려는 경우에는 변경 전의 관할지 세관장에게 설치 또는 사용장소변경신고서를 제출하고, 제출일부터 1개월 이내에 해당 물품을 변경된 설치 또는 사용 장소에 반입해야 한다. 다만, 재해ㆍ노사분규 등의 긴급한 사유로 국내에 소재한 자기 소유의 다른 장소로 해당 물품의 설치 또는 사용 장소를 변경하려는 경우에는 관할지 세관장에게 신고하고, 변경된 설치 또는 사용 장소에 반입한 후 1개월 이내에 설치 또는 사용장소변경신고서를 제출해야 한다. <개정 2022. 2. 15.>\n    1. 법 제83조ㆍ법 제89조제1항제2호ㆍ법 제90조ㆍ법 제91조ㆍ법 제93조ㆍ법 제95조 및 법 제98조에 따라 용도세율이 적용된 물품이나 관세의 감면을 받은 물품: 해당 규정에서 정하는 기간\n    2. 법 제107조에 따라 관세의 분할납부 승인을 받은 물품: 해당 물품의 관세 분할납부기간\n  ⑥ 제5항 각 호 외의 부분에 따른 설치 또는 사용장소변경신고서에는 다음 각 호의 사항이 기재되어야 한다. <신설 2022. 2. 15.>\n    1. 해당 물품의 품명ㆍ규격 및 수량\n    2. 해당 물품의 가격 및 적용된 용도세율, 면세액 또는 분할납부승인액과 그 법적 근거\n    3. 해당 물품의 수입신고번호 및 통관지 세관명\n    4. 설치 또는 사용 장소에 반입한 연월일과 사용개시 연월일\n    5. 설치 또는 사용 장소와 신고자의 성명ㆍ주소","L8-0":"제8조(기간 및 기한의 계산) ① 이 법에 따른 기간을 계산할 때 제252조에 따른 수입신고수리전 반출승인을 받은 경우에는 그 승인일을 수입신고의 수리일로 본다.\n  ② 이 법에 따른 기간의 계산은 이 법에 특별한 규정이 있는 것을 제외하고는 「민법」에 따른다.\n  ③ 이 법에 따른 기한이 다음 각 호의 어느 하나에 해당하는 경우에는 그 다음 날을 기한으로 한다.<개정 2022. 12. 31., 2025. 11. 11.>\n    1. 토요일 및 일요일\n    2. 「공휴일에 관한 법률」에 따른 공휴일 및 대체공휴일\n    3. 「노동절 제정에 관한 법률」에 따른 노동절\n    4. 그 밖에 대통령령으로 정하는 날\n  ④ 제327조에 따른 국가관세종합정보시스템, 연계정보통신망 또는 전산처리설비가 대통령령으로 정하는 장애로 가동이 정지되어 이 법에 따른 기한까지 이 법에 따른 신고, 신청, 승인, 허가, 수리, 교부, 통지, 통고, 납부 등을 할 수 없게 되는 경우에는 그 장애가 복구된 날의 다음 날을 기한으로 한다.<개정 2020. 12. 22., 2023. 12. 31.>\n  [전문개정 2010. 12. 30.]","D234-0":"제234조(의무의 면제) 법 제227조제1항의 규정에 의하여 수입신고수리시에 부과된 의무를 면제받고자 하는 자는 다음 각호의 1에 해당하는 경우에 한하여 당해 의무이행을 요구한 세관장의 승인을 얻어야 한다.\n    1. 법령이 정하는 허가ㆍ승인ㆍ추천 기타 조건을 구비하여 의무이행이 필요하지 아니하게 된 경우\n    2. 법령의 개정 등으로 인하여 의무이행이 해제된 경우\n    3. 관계행정기관의 장의 요청 등으로 부과된 의무를 이행할 수 없는 사유가 있다고 인정된 경우","D285-2":"제285조의2(전자송달) ①법 제327조제6항에 따라 전자송달을 받으려는 자는 관세청장이 정하는 바에 따라 전자송달에 필요한 설비를 갖추고 다음 각 호의 사항을 기재한 신청서를 관할 세관장에게 제출해야 한다. <개정 2009. 2. 4., 2021. 2. 17., 2024. 2. 29.>\n    1. 성명ㆍ주민등록번호 등 인적사항\n    2. 주소ㆍ거소 또는 영업소의 소재지\n    3. 전자우편주소, 법 제327조제1항에 따른 국가관세종합정보시스템의 전자사서함 또는 같은 조 제3항에 따른 연계정보통신망의 전자고지함 등 전자송달을 받을 곳\n    4. 제3항의 규정에 의한 서류중 전자송달을 받고자 하는 서류의 종류\n    5. 그 밖의 필요한 사항으로서 관세청장이 정하는 것\n  ②법 제327조제7항에서 “대통령령으로 정하는 사유”란 다음 각 호의 어느 하나에 해당하는 경우를 말한다. <개정 2009. 2. 4., 2011. 4. 1., 2021. 2. 17., 2024. 2. 29.>\n    1. 정전, 프로그램의 오류 그 밖의 부득이한 사유로 인하여 금융기관 또는 체신관서의 전산처리장치의 가동이 정지된 경우\n    2. 전자송달을 받으려는 자의 법 제327조제1항에 따른 국가관세종합정보시스템 또는 같은 조 제3항에 따른 연계정보통신망 이용권한이 정지된 경우\n    3. 그 밖의 전자송달이 불가능한 경우로서 관세청장이 정하는 경우\n  ③법 제327조제8항에 따라 전자송달할 수 있는 서류는 납부서ㆍ납부고지서ㆍ환급통지서 및 그 밖에 관세청장이 정하는 서류로 한다. <개정 2009. 2. 4., 2021. 2. 17.>\n  ④관세청장은 제3항에 따른 서류 중 납부서ㆍ납부고지서ㆍ환급통지서 및 관세청장이 따로 정하는 서류를 전자송달하는 경우에는 법 제327조제1항에 따른 국가관세종합정보시스템의 전자사서함 또는 같은 조 제3항에 따른 연계정보통신망의 전자고지함에 저장하는 방식으로 이를 송달해야 한다. <개정 2021. 2. 17., 2024. 2. 29.>\n  ⑤관세청장이 제4항의 규정에 의한 서류외의 서류를 전자송달하는 경우에는 전자송달을 받고자 하는 자가 지정한 전자우편주소로 이를 송달하여야 한다.\n  [본조신설 2002. 12. 30.]\n  제285조의3 삭제 <2024. 2. 29.>","R68-0":"제68조(특허수수료) ①법 제174조제2항의 규정에 의하여 납부하여야 하는 특허신청의 수수료는 4만5천원으로 한다.\n  ②법 제174조제2항의 규정에 의하여 납부하여야 하는 특허보세구역의 설치ㆍ운영에 관한 수수료(이하 이 조에서 “특허수수료”라 한다)는 다음 각호의 구분에 의한 금액으로 한다. 다만, 보세공장과 목재만 장치하는 수면의 보세창고에 대하여는 각호의 구분에 의한 금액의 4분의 1로 한다.\n    1. 특허보세구역의 연면적이 1천제곱미터 미만인 경우 : 매 분기당 7만2천원\n    2. 특허보세구역의 연면적이 1천제곱미터 이상 2천제곱미터 미만인 경우 : 매 분기당 10만8천원\n    3. 특허보세구역의 연면적이 2천제곱미터 이상 3천5백제곱미터 미만인 경우 : 매 분기당 14만4천원\n    4. 특허보세구역의 연면적이 3천5백제곱미터 이상 7천제곱미터 미만인 경우 : 매 분기당 18만원\n    5. 특허보세구역의 연면적이 7천제곱미터 이상 1만5천제곱미터 미만인 경우 : 매 분기당 22만5천원\n    6. 특허보세구역의 연면적이 1만5천제곱미터 이상 2만5천제곱미터 미만인 경우 : 매 분기당 29만1천원\n    7. 특허보세구역의 연면적이 2만5천제곱미터 이상 5만제곱미터 미만인 경우 : 매 분기당 36만원\n    8. 특허보세구역의 연면적이 5만제곱미터 이상 10만제곱미터 미만인 경우 : 매 분기당 43만5천원\n    9. 특허보세구역의 연면적이 10만제곱미터 이상인 경우 : 매 분기당 51만원\n  ③특허수수료는 분기단위로 매분기말까지 다음 분기분을 납부하되, 특허보세구역의 설치ㆍ운영에 관한 특허가 있은 날이 속하는 분기분의 수수료는 이를 면제한다. 이 경우 운영인이 원하는 때에는 1년 단위로 일괄하여 미리 납부할 수 있다.\n  ④특허수수료를 계산함에 있어서 특허보세구역의 연면적은 특허보세구역의 설치ㆍ운영에 관한 특허가 있은 날의 상태에 의하되, 특허보세구역의 연면적이 변경된 때에는 그 변경된 날이 속하는 분기의 다음 분기 첫째 달 1일의 상태에 의한다.\n  ⑤특허보세구역의 연면적이 수수료납부후에 변경된 경우 납부하여야 하는 특허수수료의 금액이 증가한 때에는 변경된 날부터 5일내에 그 증가분을 납부하여야 하고, 납부하여야 하는 특허수수료의 금액이 감소한 때에는 그 감소분을 다음 분기 이후에 납부하는 수수료의 금액에서 공제한다.\n  ⑥영 제193조의 규정에 의한 특허보세구역의 휴지 또는 폐지의 경우에는 당해 특허보세구역안에 외국물품이 없는 때에 한하여 그 다음 분기의 특허수수료를 면제한다. 다만, 휴지 또는 폐지를 한 날이 속하는 분기분의 특허수수료는 이를 환급하지 아니한다.\n  ⑦우리나라에 있는 외국공관이 직접 운영하는 보세전시장에 대하여는 특허수수료를 면제한다.\n  ⑧제1항 및 제2항의 규정에 의한 수수료를 납부하여야 하는 자가 관세청장이 정하는 바에 의하여 이를 따로 납부한 때에는 그 사실을 증명하는 증표를 특허신청서 등에 첨부하여야 한다.","R77-4":"제77조의4(무역원활화 위원회의 구성) ① 영 제245조의2제3항제1호에 따라 재정경제부장관이 임명하는 위원은 다음 각 호와 같다. <개정 2017. 3. 31., 2021. 3. 16., 2023. 3. 20., 2025. 10. 31., 2026. 1. 2.>\n    1. 재정경제부 관세정책관\n    2. 과학기술정보통신부, 농림축산식품부, 산업통상부, 기후에너지환경부, 국토교통부, 해양수산부, 식품의약품안전처 및 관세청 소속 고위공무원단에 속하는 일반직공무원 중에서 그 소속기관의 장이 추천하는 사람\n  ② 영 제245조의2제3항제2호가목에 따라 재정경제부장관이 위촉하는 위원은 「관세사법」에 따른 관세사회, 「대한무역투자진흥공사법」에 따른 대한무역투자진흥공사, 「민법」 제32조에 따라 산업통상부장관의 허가를 받아 설립된 한국무역협회 및 「상공회의소법」에 따른 대한상공회의소의 임원 중에서 그 소속기관의 장이 추천하는 사람으로 한다. <개정 2025. 10. 31., 2026. 1. 2.>\n  ③ 삭제 <2023. 3. 20.>\n  [본조신설 2015. 7. 16.]\n  [종전 제77조의4는 제77조의5로 이동 <2015. 7. 16.>]","D34-0":"제34조(세액의 경정) ①법 제38조의3제2항의 규정에 의하여 경정의 청구를 하고자 하는 자는 다음 각호의 사항을 기재한 경정청구서를 세관장에게 제출하여야 한다. <개정 2004. 3. 29.>\n    1. 당해 물품의 수입신고번호와 품명ㆍ규격 및 수량\n    2. 경정전의 당해 물품의 품목분류ㆍ과세표준ㆍ세율 및 세액\n    3. 경정후의 당해 물품의 품목분류ㆍ과세표준ㆍ세율 및 세액\n    4. 경정사유\n    5. 기타 참고사항\n  ② 법 제38조의3제3항에서 “최초의 신고 또는 경정에서 과세표준 및 세액의 계산근거가 된 거래 또는 행위 등이 그에 관한 소송에 대한 판결(판결과 같은 효력을 가지는 화해나 그 밖의 행위를 포함한다)에 의하여 다른 것으로 확정되는 등 대통령령으로 정하는 사유”란 다음 각 호의 어느 하나에 해당하는 경우를 말한다. <신설 2012. 2. 2., 2013. 2. 15.>\n    1. 최초의 신고 또는 경정에서 과세표준 및 세액의 계산근거가 된 거래 또는 행위 등이 그에 관한 소송에 대한 판결(판결과 같은 효력을 가지는 화해나 그 밖의 행위를 포함한다)에 의하여 다른 것으로 확정된 경우\n    2. 최초의 신고 또는 경정을 할 때 장부 및 증거서류의 압수, 그 밖의 부득이한 사유로 과세표준 및 세액을 계산할 수 없었으나 그 후 해당 사유가 소멸한 경우\n    3. 법 제233조제1항 후단에 따라 원산지증명서 등의 진위 여부 등을 회신받은 세관장으로부터 그 회신 내용을 통보받은 경우\n  ③세관장은 법 제38조의3제6항에 따라 세액을 경정하려는 때에는 다음 각 호의 사항을 적은 경정통지서를 납세의무자에게 교부하여야 한다. <개정 2004. 3. 29., 2012. 2. 2., 2017. 3. 27.>\n    1. 당해 물품의 수입신고번호와 품명ㆍ규격 및 수량\n    2. 경정전의 당해 물품의 품목분류ㆍ과세표준ㆍ세율 및 세액\n    3. 경정후의 당해 물품의 품목분류ㆍ과세표준ㆍ세율 및 세액\n    4. 가산세액\n    5. 경정사유\n    6. 기타 참고사항\n  ④제3항에 따라 경정을 하는 경우 이미 납부한 세액에 부족이 있거나 납부할 세액에 부족이 있는 경우에는 그 부족세액에 대하여 제36조에 따른 납부고지를 해야 한다. 이 경우 동일한 납세의무자에게 경정에 따른 납부고지를 여러 건 해야 할 경우 통합하여 하나의 납부고지를 할 수 있다. <개정 2012. 2. 2., 2013. 2. 15., 2016. 2. 5., 2021. 2. 17.>\n  ⑤세관장은 제3항의 규정에 의하여 경정을 한 후 그 세액에 과부족이 있는 것을 발견한 때에는 그 경정한 세액을 다시 경정한다. <개정 2012. 2. 2., 2013. 2. 15.>","D32-4":"제32조의4(세액의 보정) ①세관장은 법 제38조의2제2항 전단의 규정에 의하여 세액의 보정을 통지하는 경우에는 다음 각호의 사항을 기재한 보정통지서를 교부하여야 한다.\n    1. 당해 물품의 수입신고번호와 품명ㆍ규격 및 수량\n    2. 보정전 당해 물품의 품목분류ㆍ과세표준ㆍ세율 및 세액\n    3. 보정후 당해 물품의 품목분류ㆍ과세표준ㆍ세율 및 세액\n    4. 보정사유 및 보정기한\n    5. 그 밖의 참고사항\n  ②법 제38조의2제1항 및 제2항 후단의 규정에 따라 신고납부한 세액을 보정하고자 하는 자는 세관장에게 세액보정을 신청한 다음에 이미 제출한 수입신고서를 교부받아 수입신고서상의 품목분류ㆍ과세표준ㆍ세율 및 세액 그 밖의 관련사항을 보정하고, 그 보정한 부분에 서명 또는 날인하여 세관장에게 제출하여야 한다.\n  ③ 삭제 <2012. 2. 2.>\n  ④법 제38조의2제5항 본문에 따라 부족세액에 가산하여야 할 이율의 계산에 관하여는 제56조제2항의 규정을 준용한다. <개정 2010. 3. 26.>\n  ⑤ 법 제38조의2제5항제1호에서 “국가 또는 지방자치단체가 직접 수입하는 물품 등 대통령령으로 정하는 물품”이란 다음 각 호의 어느 하나에 해당하는 물품을 말한다. <신설 2020. 2. 11.>\n    1. 국가 또는 지방자치단체(「지방자치법」에 따른 지방자치단체조합을 포함한다. 이하 같다)가 직접 수입하는 물품과 국가 또는 지방자치단체에 기증되는 물품\n    2. 우편물. 다만, 법 제241조에 따라 수입신고를 해야 하는 것은 제외한다.\n  ⑥ 법 제38조의2제5항제2호에서 “대통령령으로 정하는 정당한 사유가 있는 경우”란 다음 각 호의 어느 하나에 해당하는 경우를 말한다. <신설 2020. 2. 11.>\n    1. 법 제10조에 따른 기한 연장 사유에 해당하는 경우\n    2. 제1조의3에 따른 법 해석에 관한 질의ㆍ회신 등에 따라 신고ㆍ납부했으나 이후 동일한 사안에 대해 다른 과세처분을 하는 경우\n    3. 그 밖에 납세자가 의무를 이행하지 않은 정당한 사유가 있는 경우\n  ⑦ 법 제38조의2제5항제2호에 따라 부족세액에 가산하여야 할 금액을 면제받으려는 자는 다음 각 호의 사항을 적은 신청서를 세관장에게 제출하여야 한다. 이 경우 제2호 및 제3호와 관련한 증명자료가 있으면 이를 첨부할 수 있다. <신설 2010. 3. 26., 2020. 2. 11.>\n    1. 납세의무자의 성명 또는 상호 및 주소\n    2. 면제받으려는 금액\n    3. 정당한 사유\n  ⑧ 세관장은 제7항에 따른 신청서를 제출받은 경우에는 신청일부터 20일 이내에 면제 여부를 서면으로 통지하여야 한다. <신설 2010. 3. 26., 2020. 2. 11.>\n  [본조신설 2004. 3. 29.]","D259-6":"제259조의6(준수도측정ㆍ평가의 절차 및 활용 등) ① 관세청장은 법 제255조의7제1항에 따라 연 4회의 범위에서 다음 각 호의 어느 하나에 해당하는 자를 대상으로 안전관리기준의 준수 정도에 대한 측정ㆍ평가(이하 이 조에서 “준수도측정ㆍ평가”라 한다)를 할 수 있다. <개정 2022. 2. 15., 2025. 2. 28.>\n    1. 운영인\n    2. 법 제19조에 따른 납세의무자\n    3. 법 제172조제2항에 따른 화물관리인\n    4. 법 제225조제1항에 따른 선박회사 또는 항공사\n    5. 법 제242조에 따른 수출ㆍ수입ㆍ반송 등의 신고인(화주를 포함한다)\n    6. 법 제254조제2항에 따라 등록한 전자상거래업체등\n    7. 보세운송업자등\n    8. 「자유무역지역의 지정 및 운영에 관한 법률」 제2조제2호에 따른 입주기업체\n  ② 관세청장은 법 제255조의7제2항에 따라 준수도측정ㆍ평가의 결과를 다음 각 호의 사항에 활용할 수 있다. <개정 2022. 2. 15., 2025. 12. 30.>\n    1. 간이한 신고 방식의 적용 등 통관 절차의 간소화\n    2. 검사 대상 수출입물품의 선별\n    3. 그 밖에 업체 및 화물 관리의 효율화를 위하여 재정경제부령으로 정하는 사항\n  ③ 준수도측정ㆍ평가에 대한 평가 항목, 배점 및 등급 등 세부 사항은 관세청장이 정하여 고시한다. <개정 2022. 2. 15.>\n  [본조신설 2015. 2. 6.]\n  [제목개정 2022. 2. 15.]\n  [제259조의4에서 이동 <2022. 2. 15.>]","D283-2":"제283조의2(사업에 관한 허가 등의 제한의 예외) ① 법 제326조의2제1항 단서에서 “대통령령으로 정하는 사유”란 다음 각 호의 어느 하나에 해당하는 경우로서 세관장이 인정하는 사유를 말한다.\n    1. 공시송달의 방법으로 납부고지된 경우\n    2. 법 제10조에 따른 기한의 연장 사유에 해당하는 경우\n    3. 「국세징수법 시행령」 제101조제1항제2호 및 제4호에 해당하는 경우\n    4. 법 제19조제10항에 따라 양도담보재산으로써 발생한 납세의무(이하 이 호에서 “물적납세의무”라 한다)를 부담하는 양도담보권자가 그 물적납세의무와 관련된 관세ㆍ내국세등 및 강제징수비를 체납한 경우\n    5. 제1호부터 제4호까지의 규정에 준하는 사유가 있는 경우\n  ② 법 제326조의2제2항 단서에서 “대통령령으로 정하는 사유”란 다음 각 호의 어느 하나에 해당하는 경우를 말한다.\n    1. 제1항 각 호의 어느 하나에 해당하는 경우로서 세관장이 인정하는 경우\n    2. 그 밖에 세관장이 납세자에게 납부가 곤란한 사정이 있다고 인정하는 경우\n  [본조신설 2023. 2. 28.]","L235-0":"제235조(지식재산권 등의 보호) ① 다음 각 호의 어느 하나에 해당하는 지식재산권 등을 침해하는 물품은 수출하거나 수입할 수 없다. <개정 2012. 6. 1., 2020. 12. 22., 2024. 12. 31.>\n    1. 「상표법」에 따라 설정등록된 상표권\n    2. 「저작권법」에 따른 저작권과 저작인접권(이하 “저작권등”이라 한다)\n    3. 「식물신품종 보호법」에 따라 설정등록된 품종보호권\n    4. 「농수산물 품질관리법」에 따라 등록되거나 조약ㆍ협정 등에 따라 보호대상으로 지정된 지리적표시권 또는 지리적표시(이하 “지리적표시권등”이라 한다)\n    5. 「특허법」에 따라 설정등록된 특허권\n    6. 「디자인보호법」에 따라 설정등록된 디자인권\n    7. 「방위산업기술 보호법」에 따른 방위산업기술(이하 “방위산업기술”이라 한다)\n  ② 관세청장은 제1항 각 호에 따른 지식재산권 등을 침해하는 물품을 효율적으로 단속하기 위하여 필요한 경우에는 해당 지식재산권 등을 관계 법령에 따라 등록 또는 설정등록한 자 등으로 하여금 해당 지식재산권 등에 관한 사항을 신고하게 할 수 있다.<개정 2024. 12. 31.>\n  ③ 세관장은 다음 각 호의 어느 하나에 해당하는 물품이 제2항에 따라 신고된 지식재산권 등을 침해하였다고 인정될 때에는 그 지식재산권 등을 신고한 자에게 해당 물품의 수출입, 환적, 복합환적, 보세구역 반입, 보세운송, 제141조제1호에 따른 일시양륙의 신고(이하 이 조에서 “수출입신고등”이라 한다) 또는 통관우체국 도착 사실을 통보하여야 한다. 이 경우 통보를 받은 자는 세관장에게 담보를 제공하고 해당 물품의 통관 보류나 유치를 요청할 수 있다.<개정 2022. 12. 31., 2024. 12. 31.>\n    1. 수출입신고된 물품\n    2. 환적 또는 복합환적 신고된 물품\n    3. 보세구역에 반입신고된 물품\n    4. 보세운송신고된 물품\n    5. 제141조제1호에 따라 일시양륙이 신고된 물품\n    6. 통관우체국에 도착한 물품\n  ④ 제1항 각 호에 따른 지식재산권 등을 보호받으려는 자는 세관장에게 담보를 제공하고 해당 물품의 통관 보류나 유치를 요청할 수 있다.<개정 2024. 12. 31.>\n  ⑤ 제3항 또는 제4항에 따른 요청을 받은 세관장은 특별한 사유가 없으면 해당 물품의 통관을 보류하거나 유치하여야 한다. 다만, 수출입신고등을 한 자 또는 제3항제6호에 해당하는 물품의 화주가 담보를 제공하고 통관 또는 유치 해제를 요청하는 경우에는 다음 각 호의 물품을 제외하고는 해당 물품의 통관을 허용하거나 유치를 해제할 수 있다.\n  <개정 2020. 6. 9., 2022. 12. 31., 2024. 12. 31.>\n    1. 위조하거나 유사한 상표를 붙여 제1항제1호에 따른 상표권을 침해하는 물품\n    2. 불법복제된 물품으로서 저작권등을 침해하는 물품\n    3. 같거나 유사한 품종명칭을 사용하여 제1항제3호에 따른 품종보호권을 침해하는 물품\n    4. 위조하거나 유사한 지리적표시를 사용하여 지리적표시권등을 침해하는 물품\n    5. 특허로 설정등록된 발명을 사용하여 제1항제5호에 따른 특허권을 침해하는 물품\n    6. 같거나 유사한 디자인을 사용하여 제1항제6호에 따른 디자인권을 침해하는 물품\n    7. 다음 각 목의 어느 하나에 해당하는 방위산업기술이 사용된 물품\n      가. 부정한 방법으로 취득한 방위산업기술\n      나. 가목에 해당하는 방위산업기술임을 알고 취득한 방위산업기술\n  ⑥ 제2항부터 제5항까지의 규정에 따른 지식재산권 등에 관한 신고, 담보 제공, 통관의 보류ㆍ허용 및 유치ㆍ유치해제 등에 필요한 사항은 대통령령으로 정한다.<개정 2024. 12. 31.>\n  ⑦ 세관장은 제3항 각 호에 따른 물품이 제1항 각 호의 어느 하나에 해당하는 지식재산권 등을 침해하였음이 명백한 경우에는 대통령령으로 정하는 바에 따라 직권으로 해당 물품의 통관을 보류하거나 해당 물품을 유치할 수 있다. 이 경우 세관장은 해당 물품의 수출입신고등을 한 자 또는 제3항제6호에 해당하는 물품의 화주에게 그 사실을 즉시 통보하여야 한다.<개정 2022. 12. 31., 2024. 12. 31.>\n  [전문개정 2010. 12. 30.]\n  [제목개정 2024. 12. 31.]","R73-0":"제73조(매각대행수수료) ①법 제208조제6항의 규정에 의한 매각대행수수료는 다음 각호의 금액으로 한다.\n    1. 매각대행을 의뢰한 물품이 매각된 경우 : 건별 매각금액에 1천분의 20을 곱하여 계산한 금액\n    2. 매각대행을 의뢰한 물품이 수입 또는 반송되어 매각대행이 중지된 경우 : 건별 최초공매예정가격에 1천분의 1을 곱하여 계산한 금액\n    3. 매각대행을 의뢰한 물품의 국고귀속ㆍ폐기ㆍ매각의뢰철회 등의 사유로 매각대행이 종료된 경우 : 건별 최초공매예정가격에 1천분의 2를 곱하여 계산한 금액\n  ②제1항의 규정에 의한 매각대행수수료를 계산함에 있어서 건별 매각금액이나 건별 최초공매예정가격이 10억원을 초과하는 때에는 당해 매각금액 또는 최초공매예정가격은 10억원으로 한다.\n  ③제1항의 규정에 의하여 계산한 매각대행수수료의 금액이 5천원 미만인 때에는 당해 매각대행수수료는 5천원으로 한다.","D53-0":"제53조(관세환급금의 양도) 법 제46조제3항에 따라 관세환급금에 관한 권리를 제3자에게 양도하고자 하는 자는 다음 각 호의 사항을 적은 문서를 세관장에게 제출해야 한다. <개정 2013. 2. 15., 2019. 2. 12.>\n    1. 양도인의 주소와 성명\n    2. 양수인의 주소와 성명\n    3. 환급사유\n    4. 환급금액\n  [제목개정 2013. 2. 15.]","L172-0":"제172조(물품에 대한 보관책임) ① 지정장치장에 반입한 물품은 화주 또는 반입자가 그 보관의 책임을 진다.\n  ② 세관장은 지정장치장의 질서유지와 화물의 안전관리를 위하여 필요하다고 인정할 때에는 화주를 갈음하여 보관의 책임을 지는 화물관리인을 지정할 수 있다. 다만, 세관장이 관리하는 시설이 아닌 경우에는 세관장은 해당 시설의 소유자나 관리자와 협의하여 화물관리인을 지정하여야 한다.<개정 2011. 12. 31.>\n  ③ 지정장치장의 화물관리인은 화물관리에 필요한 비용(제323조에 따른 세관설비 사용료를 포함한다)을 화주로부터 징수할 수 있다. 다만, 그 요율에 대하여는 세관장의 승인을 받아야 한다.\n  ④ 지정장치장의 화물관리인은 제3항에 따라 징수한 비용 중 세관설비 사용료에 해당하는 금액을 세관장에게 납부하여야 한다.\n  ⑤ 세관장은 불가피한 사유로 화물관리인을 지정할 수 없을 때에는 화주를 대신하여 직접 화물관리를 할 수 있다. 이 경우 제3항에 따른 화물관리에 필요한 비용을 화주로부터 징수할 수 있다.\n  ⑥ 제2항에 따른 화물관리인의 지정기준, 지정절차, 지정의 유효기간, 재지정 및 지정 취소 등에 필요한 사항은 대통령령으로 정한다.<신설 2011. 12. 31.>\n  [전문개정 2010. 12. 30.]","D83-0":"제83조(잠정상계관세액 등의 정산) ①제82조제1항의 규정에 해당되는 경우로서 법 제59조제2항의 규정에 의하여 잠정조치가 적용된 기간중에 수입된 물품에 대하여 부과하는 상계관세액이 잠정상계관세액과 같거나 많은 때에는 그 잠정상계관세액을 상계관세액으로 하여 그 차액을 징수하지 아니하며, 적은 때에는 그 차액에 상당하는 잠정상계관세액을 환급하여야 한다.\n  ②법 제59조제1항의 규정에 의하여 담보가 제공된 경우로서 제82조제1항의 규정에 해당되는 경우에는 당해 잠정조치가 적용된 기간중에 소급 부과될 상계관세액이 제공된 담보금액과 같거나 많은 경우에는 그 담보금액을 상계관세액으로 하여 그 차액을 징수하지 않으며, 적은 경우에는 그 차액에 상당하는 담보를 해제해야 한다. <개정 2024. 2. 29.>\n  ③제81조제1항의 규정에 의한 약속이 제75조제5항의 규정에 의한 본조사의 결과에 따라 보조금등의 지급과 그로 인한 실질적 피해등의 사실이 있는 것으로 판정이 내려진 후에 수락된 경우로서 조사된 최종상계관세율을 기초로 산정한 상계관세액이 잠정상계관세액 또는 제공된 담보금액과 같거나 많은 경우에는 그 차액을 징수하지 않으며, 적은 경우에는 그 차액을 환급하거나 차액에 상당하는 담보를 해제해야 한다. <개정 2024. 2. 29.>","R24-0":"제24조(상계관세부과를 위한 본조사의 종결) 영 제75조제4항 전단에서 “재정경제부령으로 정하는 기준”이란 국제협약에서 달리 정하지 않는 한 보조금등의 금액이 해당 물품 가격대비 100분의 1이상인 경우를 말한다. <개정 2008. 12. 31., 2020. 12. 29., 2026. 1. 2.>","R58-0":"제58조(사후관리면제) 법 제102조제1항 단서에서 “재정경제부령으로 정하는 물품”이란 다음 각 호의 어느 하나에 해당하는 물품을 말한다. <개정 2008. 12. 31., 2011. 4. 1., 2026. 1. 2., 2026. 3. 20.>\n    1. 법 제89조제1항제1호의 물품\n    2. 법 제93조제19호의 자원\n    3. 법 제95조제1항제1호의 물품 중 자동차의 부분품","L81-0":"제81조(간이세율의 적용) ① 다음 각 호의 어느 하나에 해당하는 물품 중 대통령령으로 정하는 물품에 대하여는 다른 법령에도 불구하고 간이세율을 적용할 수 있다. <개정 2021. 12. 21.>\n    1. 여행자 또는 외국을 오가는 운송수단의 승무원이 휴대하여 수입하는 물품\n    2. 우편물. 다만, 제258조제2항에 따라 제241조제1항에 따른 수입신고를 하여야 하는 우편물은 제외한다.\n    3. 삭제<2018. 12. 31.>\n    4. 탁송품 또는 별송품\n  ② 삭제<2018. 12. 31.>\n  ③ 간이세율은 수입물품에 대한 관세, 임시수입부가세 및 내국세의 세율을 기초로 하여 대통령령으로 정한다.<개정 2018. 12. 31.>\n  ④ 제1항제1호에 해당하는 물품으로서 그 총액이 대통령령으로 정하는 금액 이하인 물품에 대하여는 일반적으로 휴대하여 수입하는 물품의 관세, 임시수입부가세 및 내국세의 세율을 고려하여 제3항에 따른 세율을 단일한 세율로 할 수 있다.\n  [전문개정 2010. 12. 30.]","L110-2":"제110조의2(통합조사의 원칙) 세관공무원은 특정한 분야만을 조사할 필요가 있는 등 대통령령으로 정하는 경우를 제외하고는 신고납부세액과 이 법 및 다른 법령에서 정하는 수출입 관련 의무 이행과 관련하여 그 권한에 속하는 사항을 통합하여 조사하는 것을 원칙으로 한다.\n  [본조신설 2011. 12. 31.]","L71-0":"제71조(할당관세) ① 다음 각 호의 어느 하나에 해당하는 경우에는 100분의 40의 범위의 율을 기본세율에서 빼고 관세를 부과할 수 있다. 이 경우 필요하다고 인정될 때에는 그 수량을 제한할 수 있다.\n    1. 원활한 물자수급 또는 산업의 경쟁력 강화를 위하여 특정물품의 수입을 촉진할 필요가 있는 경우\n    2. 수입가격이 급등한 물품 또는 이를 원재료로 한 제품의 국내가격을 안정시키기 위하여 필요한 경우\n    3. 유사물품 간의 세율이 현저히 불균형하여 이를 시정할 필요가 있는 경우\n  ② 특정물품의 수입을 억제할 필요가 있는 경우에는 일정한 수량을 초과하여 수입되는 분에 대하여 100분의 40의 범위의 율을 기본세율에 더하여 관세를 부과할 수 있다. 다만, 농림축수산물인 경우에는 기본세율에 동종물품ㆍ유사물품 또는 대체물품의 국내외 가격차에 상당하는 율을 더한 율의 범위에서 관세를 부과할 수 있다.\n  ③ 제1항과 제2항에 따른 관세를 부과하여야 하는 대상 물품, 수량, 세율, 적용기간 등은 대통령령으로 정한다.\n  ④ 재정경제부장관은 매 회계연도 종료 후 5개월 이내에 제1항부터 제3항까지의 규정에 따른 관세의 전년도 부과 실적 및 그 결과(관세 부과의 효과 등을 조사ㆍ분석한 보고서를 포함한다)를 국회 소관 상임위원회에 보고하여야 한다.<신설 2011. 12. 31., 2014. 1. 1., 2025. 10. 1.>\n  [전문개정 2010. 12. 30.]","L42-2":"제42조의2(가산세의 감면) ① 세관장은 다음 각 호의 어느 하나에 해당하는 경우에는 제42조제1항에 따른 가산세액에서 다음 각 호에서 정하는 금액을 감면한다. <개정 2021. 12. 21., 2022. 12. 31., 2023. 12. 31., 2025. 10. 1., 2025. 12. 23.>\n    1. 제9조제2항에 따라 수입신고가 수리되기 전에 관세를 납부한 결과 부족세액이 발생한 경우로서 수입신고가 수리되기 전에 납세의무자가 해당 세액에 대하여 수정신고를 하거나 세관장이 경정하는 경우: 제42조제1항제1호 및 제2호의 금액을 합한 금액\n    2. 제28조제1항에 따른 잠정가격신고를 기초로 납세신고를 하고 이에 해당하는 세액을 납부한 경우(납세의무자가 제출한 자료가 사실과 다름이 판명되어 추징의 사유가 발생한 경우는 제외한다): 제42조제1항제1호 및 제2호의 금액을 합한 금액\n    3. 제37조제1항제3호에 관한 사전심사의 결과를 통보받은 경우 그 통보일부터 2개월 이내에 통보된 과세가격의 결정방법에 따라 해당 사전심사의 결과를 통보받은 날 전에 신고납부한 세액을 수정신고하는 경우: 제42조제1항제1호의 금액\n    4. 제38조제2항 단서에 따라 재정경제부령으로 정하는 물품 중 감면대상 및 감면율을 잘못 적용하여 부족세액이 발생한 경우: 제42조제1항제1호의 금액\n    5. 제38조의3제1항에 따라 수정신고(제38조의2제1항에 따른 보정기간이 지난 날부터 1년 6개월이 지나기 전에 한 수정신고로 한정한다)를 한 경우에는 다음 각 목의 구분에 따른 금액. 다만, 해당 관세에 대하여 과세표준과 세액을 경정할 것을 미리 알고 수정신고를 한 경우로서 재정경제부령으로 정하는 경우는 제외한다.\n      가. 제38조의2제1항에 따른 보정기간이 지난 날부터 6개월 이내에 수정신고한 경우: 제42조제1항제1호의 금액의 100분의 30\n      나. 제38조의2제1항에 따른 보정기간이 지난 날부터 6개월 초과 1년 이내에 수정신고한 경우: 제42조제1항제1호의 금액의 100분의 20\n      다. 제38조의2제1항에 따른 보정기간이 지난 날부터 1년 초과 1년 6개월 이내에 수정신고한 경우: 제42조제1항제1호의 금액의 100분의 10\n    6. 국가 또는 지방자치단체가 직접 수입하는 물품 등 대통령령으로 정하는 물품의 경우: 제42조제1항제1호 및 제2호의 금액을 합한 금액\n    7. 제86조제2항에 따라 사전심사 결과의 통지를 받은 경우로서 해당 사전심사 신청 물품 및 그와 동일한 물품에 대하여 가목에 따른 기간에 신고납부한 세액을 통지된 품목분류를 적용하여 나목에 따른 기간에 수정신고하는 경우: 제42조제1항제1호의 금액\n      가. 사전심사 신청일부터 사전심사 결과 통지일 전날까지\n      나. 사전심사 결과 통지일부터 2개월이 되는 날까지\n    8. 제118조의4제9항 전단에 따른 관세심사위원회가 제118조제3항 본문에 따른 기간 내에 과세전적부심사의 결정ㆍ통지(이하 이 호에서 “결정ㆍ통지”라 한다)를 하지 아니한 경우: 결정ㆍ통지가 지연된 기간에 대하여 부과되는 가산세(제42조제1항제2호가목에 따른 계산식에 결정ㆍ통지가 지연된 기간을 적용하여 계산한 금액에 해당하는 가산세를 말한다) 금액의 100분의 50\n    9. 신고납부한 세액의 부족 등에 대하여 납세의무자에게 대통령령으로 정하는 정당한 사유가 있는 경우: 제42조제1항제1호 및 제2호의 금액을 합한 금액\n  ② 제1항에 따른 가산세 감면을 받으려는 자는 대통령령으로 정하는 바에 따라 감면을 신청할 수 있다.\n  [본조신설 2019. 12. 31.]","L134-0":"제134조(국제항 등에의 출입) ① 국제무역선이나 국제무역기는 국제항에 한정하여 운항할 수 있다. 다만, 대통령령으로 정하는 바에 따라 국제항이 아닌 지역에 대한 출입의 허가를 받은 경우에는 그러하지 아니하다. <개정 2020. 12. 22.>\n  ② 국제무역선의 선장이나 국제무역기의 기장은 제1항 단서에 따른 허가를 받으려면 재정경제부령으로 정하는 바에 따라 허가수수료를 납부하여야 한다.<개정 2020. 12. 22., 2025. 10. 1.>\n  ③ 세관장은 제1항 단서에 따른 허가의 신청을 받은 날부터 10일 이내에 허가 여부를 신청인에게 통지하여야 한다.\n  <신설 2018. 12. 31.>\n  ④ 세관장이 제3항에서 정한 기간 내에 허가 여부 또는 민원 처리 관련 법령에 따른 처리기간의 연장을 신청인에게 통지하지 아니하면 그 기간(민원 처리 관련 법령에 따라 처리기간이 연장 또는 재연장된 경우에는 해당 처리기간을 말한다)이 끝난 날의 다음 날에 허가를 한 것으로 본다.<신설 2018. 12. 31.>\n  [전문개정 2010. 12. 30.]\n  [제목개정 2020. 12. 22.]","L243-0":"제243조(신고의 요건) ① 제206조제1항제1호가목의 물품 중 관세청장이 정하는 물품은 관세청장이 정하는 바에 따라 반송방법을 제한할 수 있다. <개정 2020. 12. 22.>\n  ② 제241조제1항에 따른 수입의 신고는 해당 물품을 적재한 선박이나 항공기가 입항된 후에만 할 수 있다.\n  ③ 제241조제1항에 따른 반송의 신고는 해당 물품이 이 법에 따른 장치 장소에 있는 경우에만 할 수 있다.\n  ④ 밀수출 등 불법행위가 발생할 우려가 높거나 감시단속을 위하여 필요하다고 인정하여 대통령령으로 정하는 물품은 관세청장이 정하는 장소에 반입한 후 제241조제1항에 따른 수출의 신고를 하게 할 수 있다.<신설 2015. 12. 15., 2020. 6. 9.>\n  [전문개정 2010. 12. 30.]","D141-12":"제141조의12(출국금지 등의 해제 요청) ① 법 제116조의5제3항제4호에서 “대통령령으로 정하는 사유”란 다음 각 호의 어느 하나에 해당하는 경우를 말한다. <개정 2023. 2. 28.>\n    1. 체납액의 부과결정의 취소 등에 따라 체납된 관세(세관장이 부과ㆍ징수하는 내국세등을 포함한다)가 5천만원 미만이 된 경우\n    2. 제141조의11제1항에 따른 출국금지 요청의 요건을 충족하지 않게 된 경우\n  ② 관세청장은 출국금지 중인 사람에게 다음 각 호의 어느 하나에 해당하는 사유가 발생한 경우로서 강제징수를 회피할 목적으로 국외로 도피할 우려가 없다고 인정할 때에는 법무부장관에게 출국금지의 해제를 요청할 수 있다. <개정 2021. 2. 17.>\n    1. 국외건설계약 체결, 수출신용장 개설, 외국인과의 합작사업계약 체결 등 구체적인 사업계획을 가지고 출국하려는 경우\n    2. 국외에 거주하는 직계존비속이 사망하여 출국하려는 경우\n    3. 제1호 및 제2호의 사유 외에 본인의 신병 치료 등 불가피한 사유로 출국할 필요가 있다고 인정되는 경우\n  [본조신설 2020. 2. 11.]\n  [제141조의9에서 이동 <2023. 2. 28.>]","D258-5":"제258조의5(세관장과 탁송품 운송업자간 협력 등) 법 제254조의2제9항에서 “세관장과 탁송품 운송업자간 협력에 관한 사항 등 대통령령으로 정하는 사항”이란 다음 각 호의 사항을 말한다. <개정 2022. 2. 15.>\n    1. 밀수출입 정보교환 및 법에 따른 정보제공 등 세관장과 탁송품 운송업자 간 협력에 관한 사항\n    2. 신속한 통관을 위한 절차 개선 협약 등 세관장과 탁송품 운송업자 간 업무협약 체결에 관한 사항\n    3. 세관장의 탁송품 운송업자에 대한 법 제255조의7제1항 및 제2항에 따른 평가 및 관리에 관한 세부사항\n    4. 그 밖에 관세청장이 필요하다고 인정하는 사항\n  [본조신설 2021. 2. 17.]\n  제259조 삭제 <2015. 2. 6.>","D75-0":"제75조(보조금등을 받은 물품의 수입 및 실질적 피해등의 조사) ①법 제57조의 규정에 의한 보조금등을 받은 물품의 수입사실 및 실질적 피해등의 사실에 관한 조사는 무역위원회가 담당한다. 이 경우 무역위원회는 필요하다고 인정하는 때에는 관계행정기관의 공무원 또는 관계전문가로 하여금 조사활동에 참여하도록 할 수 있다.\n  ②무역위원회는 제74조제3항 전단에 따라 상계관세의 부과에 관한 사항과 조사개시의 결정에 관한 사항이 관보에 게재된 날부터 3개월 이내에 보조금등을 받은 물품의 수입사실 및 그로 인한 실질적 피해등의 사실이 있다고 추정되는 충분한 증거가 있는지에 관한 예비조사를 하여 그 결과를 재정경제부장관에게 제출해야 한다. <개정 2008. 2. 29., 2020. 12. 29., 2025. 12. 30.>\n  ③재정경제부장관은 제2항의 규정에 의한 예비조사결과가 제출된 날부터 1월 이내에 법 제59조제1항의 규정에 의한 조치의 필요여부 및 내용에 관한 사항을 결정하여야 한다. 다만, 필요하다고 인정되는 경우에는 20일의 범위내에서 그 결정기간을 연장할 수 있다. <개정 2008. 2. 29., 2025. 12. 30.>\n  ④무역위원회는 제2항의 예비조사에 따른 보조금등의 금액 또는 보조금등을 받은 물품의 수입량이 재정경제부령으로 정하는 기준에 미달하거나 실질적 피해등이 경미한 것으로 인정되는 때에는 제5항에 따른 본조사를 종결해야 한다. 이 경우 무역위원회는 본조사 종결에 관한 사항을 재정경제부장관에게 통보해야 하며, 재정경제부장관은 이를 관보에 게재해야 한다. <개정 2008. 2. 29., 2020. 12. 29., 2024. 2. 29., 2025. 12. 30.>\n  ⑤무역위원회는 재정경제부령이 정하는 특별한 사유가 없는 한 제2항의 규정에 의한 예비조사결과를 제출한 날의 다음날부터 본조사를 개시하여야 하며, 본조사개시일부터 3월 이내에 본조사결과를 재정경제부장관에게 제출하여야 한다. <개정 2008. 2. 29., 2025. 12. 30.>\n  ⑥무역위원회는 제2항 및 제5항의 규정에 의한 조사와 관련하여 조사기간을 연장할 필요가 있거나 이해관계인이 정당한 사유를 제시하여 조사기간의 연장을 요청하는 때에는 2월의 범위내에서 그 조사기간을 연장할 수 있다.\n  ⑦ 재정경제부장관은 제5항에 따른 본조사 결과가 접수되면 제74조제3항 전단에 따른 관보게재일부터 12개월 이내에 상계관세의 부과여부 및 내용을 결정하여 법 제57조에 따른 상계관세의 부과조치를 해야 한다. 다만, 특별한 사유가 있다고 인정되는 경우에는 관보게재일부터 18개월 이내에 상계관세의 부과조치를 할 수 있다. <개정 2020. 12. 29., 2025. 12. 30.>\n  ⑧ 제6항에도 불구하고 재정경제부장관은 제7항 단서에 따라 18개월 이내에 상계관세의 부과조치를 할 특별한 사유가 있다고 인정하는 경우 무역위원회와 협의하여 제6항에 따른 본조사 기간을 2개월의 범위에서 추가로 연장하게 할 수 있다. <개정 2020. 12. 29., 2024. 2. 29., 2025. 12. 30.>\n  ⑨무역위원회는 제2항 및 제5항에 따른 조사결과 제출 시 필요하다고 인정되는 때에는 재정경제부장관에게 다음 각 호의 사항을 건의할 수 있다. <개정 2008. 2. 29., 2020. 12. 29., 2025. 12. 30.>\n    1. 법 제57조에 따른 상계관세 부과\n    2. 법 제59조제1항에 따른 잠정조치\n    3. 법 제60조제1항에 따른 약속의 제의 또는 수락\n  ⑩ 제1항부터 제9항까지에서 규정한 사항 외에 상계관세부과 신청ㆍ조사ㆍ판정 절차에 관하여 필요한 사항은 무역위원회가 재정경제부장관과 협의하여 고시한다. <신설 2020. 12. 29., 2025. 12. 30.>","D140-0":"제140조(관세조사의 연기신청) ①법 제114조제2항에서 “대통령령으로 정하는 사유”란 다음 각 호의 어느 하나에 해당하는 경우를 말한다. <개정 2011. 4. 1.>\n    1. 화재나 그 밖의 재해로 사업상 심한 어려움이 있는 경우\n    2. 납세자 또는 그 위임을 받은 자의 질병, 장기출장 등으로 관세조사가 곤란하다고 판단되는 경우\n    3. 권한있는 기관에 의하여 장부 및 증빙서류가 압수 또는 영치된 경우\n    4. 그 밖에 제1호부터 제3호까지의 규정에 준하는 사유가 있는 경우\n  ②법 제114조제2항의 규정에 의하여 관세조사의 연기를 받고자 하는 자는 다음 각호의 사항을 기재한 문서를 당해 세관장에게 제출하여야 한다.\n    1. 관세조사의 연기를 받고자 하는 자의 성명과 주소 또는 거소\n    2. 관세조사의 연기를 받고자 하는 기간\n    3. 관세조사의 연기를 받고자 하는 사유\n    4. 기타 필요한 사항\n  ③ 제2항에 따라 관세조사 연기를 신청받은 세관장은 연기신청 승인 여부를 결정하고 그 결과를 조사 개시 전까지 신청인에게 통지하여야 한다. <신설 2013. 2. 15.>","D236-0":"제236조(원산지증명서의 제출 등) ①다음 각 호의 어느 하나에 해당하는 자는 해당 물품의 수입신고 시에 그 물품의 원산지를 증명하는 서류(이하 “원산지증명서”라 한다)를 세관장에게 제출하여야 한다. 다만, 제1호에 해당하는 자로서 수입신고 전에 원산지증명서를 발급받았으나 분실 등의 사유로 수입신고 시에 원산지증명서를 제출하지 못한 경우에는 제4항에 따른 원산지증명서 유효기간 내에 해당 원산지증명서 또는 그 부본을 제출할 수 있다. <개정 2015. 2. 6.>\n    1. 법ㆍ조약ㆍ협정 등에 의하여 다른 국가의 생산(가공을 포함한다)물품에 적용되는 세율보다 낮은 세율을 적용받고자 하는 자로서 원산지확인이 필요하다고 관세청장이 정하는 자\n    2. 관세율의 적용 기타의 사유로 인하여 원산지확인이 필요하다고 관세청장이 지정한 물품을 수입하는 자\n  ②법 제232조제1항 단서의 규정에 의하여 다음 각호의 물품에 대하여는 제1항의 규정을 적용하지 아니한다. <개정 2004. 3. 29.>\n    1. 세관장이 물품의 종류ㆍ성질ㆍ형상 또는 그 상표ㆍ생산국명ㆍ제조자 등에 의하여 원산지를 확인할 수 있는 물품\n    2. 우편물(법 제258조제2항의 규정에 해당하는 것을 제외한다)\n    3. 과세가격(종량세의 경우에는 이를 법 제15조의 규정에 준하여 산출한 가격을 말한다)이 15만원 이하인 물품\n    4. 개인에게 무상으로 송부된 탁송품ㆍ별송품 또는 여행자의 휴대품\n    5. 기타 관세청장이 관계행정기관의 장과 협의하여 정하는 물품\n  ③제1항의 규정에 의하여 세관장에게 제출하는 원산지증명서는 다음 각호의 1에 해당하는 것이어야 한다.\n    1. 원산지국가의 세관 기타 발급권한이 있는 기관 또는 상공회의소가 당해 물품에 대하여 원산지국가(지역을 포함한다)를 확인 또는 발행한 것\n    2. 원산지국가에서 바로 수입되지 아니하고 제3국을 경유하여 수입된 물품에 대하여 그 제3국의 세관 기타 발급권한이 있는 기관 또는 상공회의소가 확인 또는 발행한 경우에는 원산지국가에서 당해 물품에 대하여 발행된 원산지증명서를 기초로 하여 원산지국가(지역을 포함한다)를 확인 또는 발행한 것\n    3. 관세청장이 정한 물품의 경우에는 당해 물품의 상업송장 또는 관련서류에 생산자ㆍ공급자ㆍ수출자 또는 권한있는 자가 원산지국가를 기재한 것\n  ④제3항에 따른 원산지증명서에는 해당 수입물품의 품명, 수량, 생산지, 수출자 등 관세청장이 정하는 사항이 적혀 있어야 하며, 제출일부터 소급하여 1년(다음 각 호의 구분에 따른 기간은 제외한다) 이내에 발행된 것이어야 한다. <개정 2011. 4. 1., 2015. 2. 6.>\n    1. 원산지증명서 발행 후 1년 이내에 해당 물품이 수입항에 도착하였으나 수입신고는 1년을 경과하는 경우: 물품이 수입항에 도착한 날의 다음 날부터 해당 물품의 수입신고를 한 날까지의 기간\n    2. 천재지변, 그 밖에 이에 준하는 사유로 원산지증명서 발행 후 1년이 경과한 이후에 수입항에 도착한 경우: 해당 사유가 발생한 날의 다음 날부터 소멸된 날까지의 기간\n  ⑤ 제1항 각 호 외의 부분 단서에 따라 원산지증명서 또는 그 부본을 제출하는 경우에는 제34조제1항에 따른 경정청구서를 함께 제출하여야 한다. <신설 2015. 2. 6.>","D59-0":"제59조(덤핑방지관세의 부과요청) ①법 제51조의 규정에 의한 실질적 피해등(이하 “실질적 피해등”이라 한다)을 받은 국내산업에 이해관계가 있는 자 또는 당해 산업을 관장하는 주무부장관은 재정경제부령이 정하는 바에 따라 재정경제부장관에게 덤핑방지관세의 부과를 요청할 수 있으며, 이 요청은 「불공정무역행위 조사 및 산업피해구제에 관한 법률」 제27조에 따른 무역위원회(이하 “무역위원회”라 한다)에 대한 덤핑방지관세의 부과에 필요한 조사신청으로 갈음한다. <개정 2006. 5. 22., 2008. 2. 29., 2025. 12. 30.>\n  ② 주무부장관은 제1항에 따라 재정경제부장관에게 덤핑방지관세 부과를 요청하기 전에 관세청장에게 해당 수입물품의 덤핑거래에 관한 검토를 요청할 수 있다. <신설 2020. 2. 11., 2025. 12. 30.>\n  ③ 관세청장은 제2항에 따른 덤핑거래에 관한 검토 요청이 없는 경우에도 덤핑거래 우려가 있다고 판단되는 경우에는 해당 수입물품의 덤핑거래 여부에 대하여 검토하고 그 결과를 주무부장관에게 통지할 수 있다. <신설 2020. 2. 11.>\n  ④법 제51조를 적용함에 있어서의 국내산업은 정상가격 이하로 수입되는 물품과 동종물품의 국내생산사업(당해 수입물품의 공급자 또는 수입자와 제23조제1항의 규정에 의한 특수관계에 있는 생산자에 의한 생산사업과 당해 수입물품의 수입자인 생산자로서 재정경제부령이 정하는 자에 의한 생산사업을 제외할 수 있다. 이하 이 항에서 같다)의 전부 또는 국내총생산량의 상당부분을 점하는 국내생산사업으로 한다. <개정 2008. 2. 29., 2020. 2. 11., 2025. 12. 30.>\n  ⑤제1항에서 “국내산업에 이해관계가 있는 자”라 함은 실질적 피해등을 받은 국내산업에 속하는 국내생산자와 이들을 구성원으로 하거나 이익을 대변하는 법인ㆍ단체 및 개인으로서 재정경제부령이 정하는 자를 말한다. <개정 2008. 2. 29., 2020. 2. 11., 2025. 12. 30.>\n  ⑥제1항에 따라 조사를 신청하려는 자는 다음 각 호의 자료를 무역위원회에 제출해야 한다. <개정 2008. 2. 29., 2020. 2. 11., 2020. 12. 29., 2025. 12. 30.>\n    1. 다음 각목의 사항을 기재한 신청서 3부\n      가. 당해 물품의 품명ㆍ규격ㆍ특성ㆍ용도ㆍ생산자 및 생산량\n      나. 당해 물품의 공급국ㆍ공급자ㆍ수출실적 및 수출가능성과 우리나라의 수입자ㆍ수입실적 및 수입가능성\n      다. 당해 물품의 공급국에서의 공장도가격 및 시장가격과 우리나라에의 수출가격 및 제3국에의 수출가격\n      라. 국내의 동종물품의 품명ㆍ규격ㆍ특성ㆍ용도ㆍ생산자ㆍ생산량ㆍ공장도가격ㆍ시장가격 및 원가계산\n      마. 당해 물품의 수입으로 인한 국내산업의 실질적 피해등\n      바. 국내의 동종물품생산자들의 당해 조사신청에 대한 지지 정도\n      사. 신청서의 기재사항 및 첨부자료를 비밀로 취급할 필요가 있는 경우에는 그 사유\n      아. 기타 재정경제부장관이 필요하다고 인정하는 사항\n    2. 덤핑물품의 수입사실과 당해 물품의 수입으로 인한 실질적 피해등의 사실에 관한 충분한 증빙자료 3부\n  ⑦ 무역위원회는 제6항에 따라 조사신청을 받은 사실을 재정경제부장관 및 관계 행정기관의 장과 해당 물품의 공급국 정부에 통보해야 한다. 이 경우 제6항 각 호의 자료는 제60조제1항에 따른 조사개시결정을 한 후에 통보해야 한다. <신설 2020. 12. 29., 2025. 12. 30.>","L246-3":"제246조의3(물품에 대한 안전성 검사) ① 관세청장은 중앙행정기관의 장의 요청을 받아 세관장으로 하여금 제226조에 따른 세관장의 확인이 필요한 수출입물품 등 다른 법령에서 정한 물품의 성분ㆍ품질 등에 대한 안전성 검사(이하 “안전성 검사”라 한다)를 하게 할 수 있다. 다만, 관세청장은 제226조에 따른 세관장의 확인이 필요한 수출입물품에 대하여는 필요한 경우 해당 중앙행정기관의 장에게 세관장과 공동으로 안전성 검사를 할 것을 요청할 수 있다. <개정 2017. 12. 19., 2019. 12. 31.>\n  ② 중앙행정기관의 장은 제1항에 따라 안전성 검사를 요청하는 경우 관세청장에게 해당 물품에 대한 안전성 검사방법 등 관련 정보를 제공하여야 하고, 필요한 인력을 제공할 수 있다.<신설 2017. 12. 19., 2019. 12. 31.>\n  ③ 관세청장은 제1항에 따라 중앙행정기관의 장의 안전성 검사 요청을 받거나 중앙행정기관의 장에게 안전성 검사를 요청한 경우 해당 안전성 검사를 위하여 필요한 인력 및 설비 등을 고려하여 안전성 검사 대상 물품을 지정하여야 하고, 그 결과를 해당 중앙행정기관의 장에게 통보하여야 한다.<신설 2017. 12. 19., 2019. 12. 31.>\n  ④ 관세청장은 안전성 검사를 위하여 협업검사센터를 주요 공항ㆍ항만에 설치할 수 있고, 세관장에게 제3항에 따라 지정된 안전성 검사 대상 물품의 안전성 검사에 필요한 자체 검사 설비를 지원하는 등 원활한 안전성 검사를 위한 조치를 취하여야 한다.<신설 2017. 12. 19., 2019. 12. 31.>\n  ⑤ 세관장은 제3항에 따라 안전성 검사 대상 물품으로 지정된 물품에 대하여 중앙행정기관의 장과 협력하여 안전성 검사를 실시하여야 한다.<신설 2017. 12. 19.>\n  ⑥ 관세청장은 안전성 검사 결과 불법ㆍ불량ㆍ유해 물품으로 확인된 물품의 정보를 관세청 인터넷 홈페이지를 통하여 공개할 수 있다.<신설 2017. 12. 19.>\n  ⑦ 안전성 검사에 필요한 정보교류, 제264조의10에 따른 불법ㆍ불량ㆍ유해물품에 대한 정보 등의 제공 요청 등 대통령령으로 정하는 사항을 협의하기 위하여 관세청에 수출입물품안전관리기관협의회를 둔다.<개정 2017. 12. 19., 2020. 12. 22.>\n  ⑧ 제7항에 따른 수출입물품안전관리기관협의회의 구성ㆍ운영과 그 밖에 필요한 사항은 대통령령으로 정한다.<개정 2017. 12. 19.>\n  ⑨ 제1항부터 제8항까지에서 규정한 사항 외에 안전성 검사의 방법ㆍ절차 등에 관하여 필요한 사항은 관세청장이 정한다.<개정 2017. 12. 19.>\n  [본조신설 2015. 12. 15.]","L136-0":"제136조(출항절차) ① 국제무역선이나 국제무역기가 국제항을 출항하려면 선장이나 기장은 출항하기 전에 관세청장이 정하는 바에 따라 세관장에게 출항허가를 받아야 한다. <개정 2020. 12. 22., 2024. 12. 31.>\n  ② 선장이나 기장은 제1항에 따른 출항허가를 받으려면 그 국제항에서 적재화물목록을 제출하여야 한다. 다만, 세관장이 출항절차를 신속하게 진행하기 위하여 필요하다고 인정하여 출항허가 후 7일의 범위에서 따로 기간을 정하는 경우에는 그 기간 내에 그 목록을 제출할 수 있다.<개정 2020. 12. 22.>\n  ③ 세관장은 신속한 출항 및 통관절차의 이행과 효율적인 감시ㆍ단속을 위하여 필요한 경우에는 관세청장이 정하는 바에 따라 출항하는 해당 국제무역선 또는 국제무역기가 소속된 선박회사 또는 항공사로 하여금 제2항에 따른 적재화물목록을 출항허가 신청 전에 제출하게 할 수 있다. 다만, 제222조제1항제2호에 따른 화물운송주선업자(제254조의2제1항에 따른 탁송품 운송업자로 한정한다. 이하 이 항에서 같다)로서 대통령령으로 정하는 요건을 갖춘 자가 작성한 적재화물목록은 관세청장이 정하는 바에 따라 해당 화물운송주선업자로 하여금 제출하게 할 수 있다.\n  <신설 2019. 12. 31., 2020. 12. 22.>\n  ④ 세관장은 제1항에 따른 허가의 신청을 받은 날부터 10일 이내에 허가 여부를 신청인에게 통지하여야 한다.<신설 2018. 12. 31., 2019. 12. 31.>\n  ⑤ 세관장이 제4항에서 정한 기간 내에 허가 여부 또는 민원 처리 관련 법령에 따른 처리기간의 연장을 신청인에게 통지하지 아니하면 그 기간(민원 처리 관련 법령에 따라 처리기간이 연장 또는 재연장된 경우에는 해당 처리기간을 말한다)이 끝난 날의 다음 날에 허가를 한 것으로 본다.<신설 2018. 12. 31., 2019. 12. 31.>\n  [전문개정 2010. 12. 30.]","D266-0":"제266조(국내도매가격) 법 제282조제3항에서 “국내도매가격”이라 함은 도매업자가 수입물품을 무역업자로부터 매수하여 국내도매시장에서 공정한 거래방법에 의하여 공개적으로 판매하는 가격을 말한다.","L61-0":"제61조(상계관세의 부과 시기) 상계관세의 부과와 잠정조치는 각각의 조치일 이후 수입되는 물품에 대하여 적용된다. 다만, 잠정조치가 적용된 물품에 대하여 국제협약에서 달리 정하고 있는 경우와 그 밖에 대통령령으로 정하는 경우에는 그 물품에 대하여도 상계관세를 부과할 수 있다.\n  [전문개정 2010. 12. 30.]","D263-0":"제263조(우편물에 관한 납세절차) 법 제260조제1항의 규정에 의하여 관세를 납부하고자 하는 자는 제262조제2항의 경우에는 세관장에게, 기타의 경우에는 체신관서에 각각 금전으로 이를 납부하여야 한다.","L97-0":"제97조(재수출면세) ① 수입신고 수리일부터 다음 각 호의 어느 하나의 기간에 다시 수출하는 물품에 대하여는 그 관세를 면제할 수 있다. <개정 2025. 10. 1.>\n    1. 재정경제부령으로 정하는 물품: 1년의 범위에서 대통령령으로 정하는 기준에 따라 세관장이 정하는 기간. 다만, 세관장은 부득이한 사유가 있다고 인정될 때에는 1년의 범위에서 그 기간을 연장할 수 있다.\n    2. 1년을 초과하여 수출하여야 할 부득이한 사유가 있는 물품으로서 재정경제부령으로 정하는 물품: 세관장이 정하는 기간\n  ② 제1항에 따라 관세를 면제받은 물품은 같은 항의 기간에 같은 항에서 정한 용도 외의 다른 용도로 사용되거나 양도될 수 없다. 다만, 대통령령으로 정하는 바에 따라 미리 세관장의 승인을 받았을 때에는 그러하지 아니하다.\n  ③ 다음 각 호의 어느 하나에 해당하는 경우에는 수출하지 아니한 자, 용도 외로 사용한 자 또는 양도를 한 자로부터 면제된 관세를 즉시 징수하며, 양도인으로부터 해당 관세를 징수할 수 없을 때에는 양수인으로부터 면제된 관세를 즉시 징수한다. 다만, 재해나 그 밖의 부득이한 사유로 멸실되었거나 미리 세관장의 승인을 받아 폐기하였을 때에는 그러하지 아니하다.\n    1. 제1항에 따라 관세를 면제받은 물품을 같은 항에 규정된 기간 내에 수출하지 아니한 경우\n    2. 제1항에서 정한 용도 외의 다른 용도로 사용하거나 해당 용도 외의 다른 용도로 사용하려는 자에게 양도한 경우\n  ④ 세관장은 제1항에 따라 관세를 면제받은 물품 중 재정경제부령으로 정하는 물품이 같은 항에 규정된 기간 내에 수출되지 아니한 경우에는 500만원을 넘지 아니하는 범위에서 해당 물품에 부과될 관세의 100분의 20에 상당하는 금액을 가산세로 징수한다.<개정 2013. 1. 1., 2025. 10. 1.>\n  [전문개정 2010. 12. 30.]","L11-0":"제11조(납부고지서의 송달) ① 관세 납부고지서의 송달은 납세의무자에게 직접 발급하는 경우를 제외하고는 인편(人便), 우편 또는 제327조에 따른 전자송달의 방법으로 한다. <개정 2015. 12. 15., 2020. 12. 22.>\n  ② 납부고지서를 송달받아야 할 자가 다음 각 호의 어느 하나에 해당하는 경우에는 납부고지사항을 공고한 날부터 14일이 지나면 제1항의 납부고지서의 송달이 된 것으로 본다.<개정 2022. 12. 31.>\n    1. 주소, 거소(居所), 영업소 또는 사무소가 국외에 있고 송달하기 곤란한 경우\n    2. 주소, 거소, 영업소 또는 사무소가 분명하지 아니한 경우\n    3. 납세의무자가 송달할 장소에 없는 경우로서 등기우편으로 송달하였으나 수취인 부재로 반송되는 경우 등 대통령령으로 정하는 경우\n  ③ 제2항에 따른 공고는 다음 각 호의 어느 하나에 해당하는 방법으로 게시하거나 게재하여야 한다. 이 경우 제1호에 따라 공시송달을 하는 경우에는 다른 공시송달 방법과 함께 하여야 한다.<개정 2022. 12. 31., 2023. 12. 31.>\n    1. 제327조의 국가관세종합정보시스템에 게시하는 방법\n    2. 관세청 또는 세관의 홈페이지, 게시판이나 그 밖의 적절한 장소에 게시하는 방법\n    3. 해당 서류의 송달 장소를 관할하는 특별자치시ㆍ특별자치도ㆍ시ㆍ군ㆍ구(자치구를 말한다)의 홈페이지, 게시판이나 그 밖의 적절한 장소에 게시하는 방법\n    4. 관보 또는 일간신문에 게재하는 방법\n  [전문개정 2010. 12. 30.]\n  [제목개정 2020. 12. 22.]","L130-0":"제130조(서류의 열람 및 의견 진술) 이의신청인ㆍ심사청구인ㆍ심판청구인 또는 처분청(처분청의 경우 심판청구에 한정한다)은 그 청구와 관계되는 서류를 열람할 수 있으며 대통령령으로 정하는 바에 따라 해당 재결청에 의견을 진술할 수 있다. <개정 2015. 12. 15.>\n  [전문개정 2010. 12. 30.]","R79-2":"제79조의2(탁송품의 특별통관) ① 법 제254조의2제1항 각 호 외의 부분에서 “재정경제부령으로 정하는 물품”이란 자가사용물품 또는 면세되는 상업용 견본품 중 물품가격(법 제30조부터 제35조까지의 규정에 따른 방법으로 결정된 과세가격에서 법 제30조제1항제6호 본문에 따른 금액을 뺀 가격. 다만, 법 제30조제1항제6호 본문에 따른 금액을 명백히 구분할 수 없는 경우에는 이를 포함한 가격으로 한다)이 미화 150달러 이하인 물품을 말한다. <개정 2015. 12. 1., 2018. 3. 21., 2021. 3. 16., 2022. 3. 18., 2026. 1. 2.>\n  ② 법 제254조의2제1항제3호에서 “재정경제부령으로 정하는 사항”이란 다음 각 호의 사항을 말한다. <개정 2020. 3. 13., 2021. 3. 16., 2023. 3. 20., 2026. 1. 2.>\n    1. 운송업자명\n    2. 선박편명 또는 항공편명\n    3. 선하증권 번호\n    4. 물품수신인의 통관고유부호\n    5. 그 밖에 관세청장이 정하는 사항\n  [본조신설 2009. 3. 26.]","D176-0":"제176조(물품의 반출입신고) ①법 제157조제1항에 따른 물품의 반입신고는 다음 각 호의 사항을 기재한 신고서로 해야 한다. <개정 2019. 2. 12.>\n    1. 외국물품(수출신고가 수리된 물품은 제외한다)의 경우\n      가. 당해 물품을 외국으로부터 운송하여 온 선박 또는 항공기의 명칭ㆍ입항일자ㆍ입항세관ㆍ적재항\n      나. 물품의 반입일시, 선하증권번호 또는 항공화물운송장번호와 화물관리번호\n      다. 물품의 품명, 포장의 종류, 반입개수와 장치위치\n    2. 내국물품(수출신고가 수리된 물품을 포함한다)의 경우\n      가. 물품의 반입일시\n      나. 물품의 품명, 포장의 종류, 반입개수, 장치위치와 장치기간\n  ②제1항의 규정에 의하여 반입신고된 물품의 반출신고는 다음 각호의 사항을 기재한 신고서에 의하여야 한다.\n    1. 반출신고번호ㆍ반출일시ㆍ반출유형ㆍ반출근거번호\n    2. 화물관리번호\n    3. 반출개수 및 반출중량\n  ③세관장은 다음 각 호의 어느 하나에 해당하는 경우에는 제1항 및 제2항에 따른 신고서의 제출을 면제하거나 기재사항의 일부를 생략하게 할 수 있다. <개정 2019. 2. 12., 2021. 2. 17.>\n    1. 다음 각 목의 어느 하나에 해당하는 서류를 제출하여 반출입하는 경우\n      가. 적재화물목록\n      나. 보세운송신고서 사본 또는 수출신고필증\n      다. 제197조제1항에 의한 내국물품장치신고서\n    2. 법 제164조에 따라 자율관리보세구역으로 지정받은 자가 제1항제2호의 물품(수입신고가 수리된 물품은 제외한다)에 대하여 장부를 비치하고 반출입사항을 기록관리하는 경우\n  ④세관장은 법 제157조제2항의 규정에 의한 검사를 함에 있어서 반입신고서ㆍ송품장 등 검사에 필요한 서류를 제출하게 할 수 있다.","L195-0":"제195조(보세건설장 외 작업 허가) ① 세관장은 보세작업을 위하여 필요하다고 인정될 때에는 대통령령으로 정하는 바에 따라 기간, 장소, 물품 등을 정하여 해당 보세건설장 외에서의 보세작업을 허가할 수 있다. <개정 2020. 6. 9.>\n  ② 제1항에 따른 보세건설장 외에서의 보세작업 허가에 관하여는 제187조제2항부터 제7항까지의 규정을 준용한다.\n  <개정 2018. 12. 31.>\n  [전문개정 2010. 12. 30.]","D35-0":"제35조(수입물품의 과세가격 조정에 따른 경정) ① 법 제38조의4제1항에 따라 경정청구를 하려는 자는 다음 각 호의 사항을 적은 경정청구서를 세관장에게 제출하여야 한다.\n    1. 해당 물품의 수입신고번호와 품명ㆍ규격 및 수량\n    2. 경정 전의 해당 물품의 품목분류ㆍ과세표준ㆍ세율 및 세액\n    3. 경정 후의 해당 물품의 품목분류ㆍ과세표준ㆍ세율 및 세액\n    4. 수입물품 가격의 조정내역, 가격결정방법 및 계산근거 자료\n    5. 경정사유\n    6. 그 밖의 필요한 사항\n  ② 제1항에 따른 경정청구서를 제출받은 세관장은 경정청구의 대상이 되는 납세신고의 사실과 경정청구에 대한 의견을 첨부하여 관세청장에게 보고하여야 한다. 이 경우 관세청장은 세관장을 달리하는 동일한 내용의 경정청구가 있으면 경정처분의 기준을 정하거나, 경정청구를 통합 심사할 세관장을 지정할 수 있다.\n  ③ 세관장은 법 제38조의4제2항에 따라 다음 각 호의 어느 하나에 해당하는 경우에는 세액을 경정할 수 있다. <개정 2021. 2. 17.>\n    1. 지방국세청장 또는 세무서장의 결정ㆍ경정 처분에 따라 조정된 사항이 수입물품의 지급가격, 권리사용료 등 법 제30조제1항의 과세가격으로 인정되는 경우\n    2. 지방국세청장 또는 세무서장이 「국제조세조정에 관한 법률」 제8조에 따른 정상가격의 산출방법에 따라 조정하는 경우로서 그 비교대상거래, 통상이윤의 적용 등 조정방법과 계산근거가 법 제31조부터 제35조까지의 규정에 적합하다고 인정되는 경우\n  ④ 제3항에 따른 세액경정을 하는 경우 경정통지서의 교부, 납부고지, 경정에 대한 재경정 등의 절차에 관하여는 제34조제3항부터 제5항까지의 규정을 준용한다. <개정 2021. 2. 17.>\n  [본조신설 2012. 2. 2.]","D66-0":"제66조(잠정조치의 적용) ①법 제53조제1항의 규정에 의한 잠정조치는 제61조제2항의 규정에 의한 예비조사결과 덤핑사실 및 그로 인한 실질적 피해등의 사실이 있다고 추정되는 충분한 증거가 있다고 판정된 경우로서 당해 조사의 개시후 최소한 60일이 경과된 날 이후부터 적용할 수 있다.\n  ②제61조제3항의 규정에 의한 잠정조치의 적용기간은 4월 이내로 하여야 한다. 다만, 당해 물품의 무역에 있어서 중요한 비중을 차지하는 공급자가 요청하는 경우에는 그 적용기간을 6월까지 연장할 수 있다.\n  ③제2항에도 불구하고 덤핑차액에 상당하는 금액 이하의 관세 부과로도 국내산업 피해를 충분히 제거할 수 있는지 여부를 조사하는 경우 등 재정경제부장관이 필요하다고 인정하는 때에는 국제협약에 따라 잠정조치의 적용기간을 9개월까지 연장할 수 있다. <개정 2008. 2. 29., 2017. 3. 27., 2025. 12. 30.>\n  ④법 제53조제1항의 규정에 의하여 제공되는 담보는 법 제24조제1항제1호부터 제4호까지 및 제7호에 해당하는 것으로서 잠정덤핑방지관세액에 상당하는 금액이어야 한다. <개정 2009. 2. 4.>","L255-2":"제255조의2(수출입 안전관리 우수업체의 공인) ① 관세청장은 수출입물품의 제조ㆍ운송ㆍ보관 또는 통관 등 무역과 관련된 자가 시설, 서류 관리, 직원 교육 등에서 이 법 또는 「자유무역협정의 이행을 위한 관세법의 특례에 관한 법률」 등 수출입에 관련된 법령의 준수 여부, 재무 건전성 등 대통령령으로 정하는 안전관리 기준을 충족하는 경우 수출입안전관리 우수업체로 공인할 수 있다.\n  ② 관세청장은 제1항에 따른 공인을 받기 위하여 심사를 요청한 자에 대하여 대통령령으로 정하는 바에 따라 심사하여야 한다.\n  ③ 제2항에 따른 심사를 요청하려는 자는 제출서류의 적정성, 개별 안전관리 기준의 충족 여부 등 관세청장이 정하여 고시하는 사항에 대하여 미리 관세청장에게 예비심사를 요청할 수 있다.\n  ④ 관세청장은 제3항에 따른 예비심사를 요청한 자에게 예비심사 결과를 통보하여야 하고, 제2항에 따른 심사를 하는 경우 예비심사 결과를 고려하여야 한다.\n  ⑤ 제1항에 따른 공인의 유효기간은 5년으로 하며, 대통령령으로 정하는 바에 따라 공인을 갱신할 수 있다.\n  ⑥ 제1항부터 제5항까지에서 규정한 사항 외에 수출입 안전관리 우수업체의 공인에 필요한 사항은 대통령령으로 정한다.\n  [전문개정 2021. 12. 21.]","L256-2":"제256조의2(우편물의 사전전자정보 제출) ① 통관우체국의 장은 수입하려는 우편물의 발송국으로부터 해당 우편물이 발송되기 전에 세관신고정보를 포함하여 대통령령으로 정하는 전자정보(이하 “사전전자정보”라 한다)를 제공받은 경우에는 그 제공받은 정보를 해당 우편물이 발송국에서 출항하는 운송수단에 적재되기 전까지 세관장에게 제출하여야 한다.\n  ② 세관장은 관세청장이 우정사업본부장과 협의하여 사전전자정보 제출대상으로 정한 국가에서 발송한 우편물 중 사전전자정보가 제출되지 아니한 우편물에 대해서는 통관우체국의 장으로 하여금 반송하도록 할 수 있다.\n  ③ 통관우체국의 장은 사전전자정보가 제출된 우편물에 대해서는 제257조 본문에 따른 우편물목록의 제출을 생략하고 세관장에게 검사를 받을 수 있다. 다만, 통관우체국의 장은 세관장이 통관절차의 이행과 효율적인 감시ㆍ단속을 위하여 대통령령으로 정하는 사유에 해당하여 우편물목록의 제출을 요구하는 경우에는 이를 제출하여야 한다.\n  ④ 제1항부터 제3항까지에서 규정한 사항 외에 사전전자정보의 제출 절차 및 반송 등에 필요한 세부사항은 대통령령으로 정한다.\n  [본조신설 2021. 12. 21.]","D123-0":"제123조(멸실ㆍ변질ㆍ손상 등의 관세환급) ①법 제106조제4항의 규정에 의하여 관세를 환급받고자 하는 자는 다음 각호의 사항을 기재한 신청서에 당해 물품의 수입신고필증 또는 이에 갈음할 세관의 증명서를 첨부하여 세관장에게 제출하여야 한다.\n    1. 당해 물품의 품명ㆍ규격ㆍ수량ㆍ수입신고수리 연월일ㆍ수입신고번호 및 장치장소\n    2. 피해상황 및 기타 참고사항\n    3. 환급받고자 하는 관세액과 그 산출기초\n  ②제1항의 규정에 의하여 환급하는 관세액은 다음 각호의 구분에 의한 금액으로 한다.\n    1. 멸실된 물품 : 이미 납부한 관세의 전액\n    2. 변질 또는 손상된 물품 : 제118조의 규정을 준용하여 산출한 금액","L237-0":"제237조(통관의 보류) ① 세관장은 다음 각 호의 어느 하나에 해당하는 경우에는 해당 물품의 통관을 보류할 수 있다.\n  <개정 2015. 12. 15., 2016. 12. 20., 2020. 12. 22., 2021. 12. 21.>\n    1. 제241조 또는 제244조에 따른 수출ㆍ수입 또는 반송에 관한 신고서의 기재사항에 보완이 필요한 경우\n    2. 제245조에 따른 제출서류 등이 갖추어지지 아니하여 보완이 필요한 경우\n    3. 이 법에 따른 의무사항(대한민국이 체결한 조약 및 일반적으로 승인된 국제법규에 따른 의무를 포함한다)을 위반하거나 국민보건 등을 해칠 우려가 있는 경우\n    4. 제246조의3제1항에 따른 안전성 검사가 필요한 경우\n    4의2. 제246조의3제1항에 따른 안전성 검사 결과 불법ㆍ불량ㆍ유해 물품으로 확인된 경우\n    5. 「국세징수법」 제30조 및 「지방세징수법」 제39조의2에 따라 세관장에게 강제징수 또는 체납처분이 위탁된 해당 체납자가 수입하는 경우\n    6. 그 밖에 이 법에 따라 필요한 사항을 확인할 필요가 있다고 인정하여 대통령령으로 정하는 경우\n  ② 세관장은 제1항에 따라 통관을 보류할 때에는 즉시 그 사실을 화주(화주의 위임을 받은 자를 포함한다) 또는 수출입 신고인에게 통지하여야 한다.<신설 2020. 12. 22.>\n  ③ 세관장은 제2항에 따라 통지할 때에는 이행기간을 정하여 통관의 보류 해제에 필요한 조치를 요구할 수 있다.\n  <신설 2020. 12. 22.>\n  ④ 제2항에 따라 통관의 보류 사실을 통지받은 자는 세관장에게 제1항 각 호의 통관 보류사유에 해당하지 아니함을 소명하는 자료 또는 제3항에 따른 세관장의 통관 보류 해제에 필요한 조치를 이행한 사실을 증명하는 자료를 제출하고 해당 물품의 통관을 요청할 수 있다. 이 경우 세관장은 해당 물품의 통관 허용 여부(허용하지 아니하는 경우에는 그 사유를 포함한다)를 요청받은 날부터 30일 이내에 통지하여야 한다.<신설 2020. 12. 22.>\n  [전문개정 2010. 12. 30.]","R77-2":"제77조의2(원산지증명서 등의 확인 요청에 대한 회신기간) 법 제233조제2항제1호에서 “재정경제부령으로 정한 기간”이란 다음 각 호의 구분에 따른 기간을 말한다. <개정 2026. 1. 2.>\n    1. 법 제73조에 따른 국제협력관세로서 「아시아ㆍ태평양 무역협정」에 따른 국제협정관세를 적용하기 위하여 원산지증명서를 발급한 국가의 세관이나 그 밖에 발급권한이 있는 기관(이하 이 조에서 “외국세관등”이라 한다)에 원산지증명서 등의 확인을 요청한 경우: 확인을 요청한 날부터 4개월\n    2. 법 제76조제3항에 따른 최빈 개발도상국에 대한 일반특혜관세를 적용하기 위하여 외국세관등에 원산지증명서 등의 확인을 요청한 경우: 확인을 요청한 날부터 6개월\n  [본조신설 2014. 3. 14.]\n  [종전 제77조의2는 제77조의3으로 이동 <2014. 3. 14.>]","R5-2":"제5조의2(신고가격 증명자료 제출기간) 영 제24조제2항에 따른 “재정경제부령으로 정하는 기간”은 자료제출 요구일로부터 15일로 한다. 다만, 부득이한 사유로 납세의무자가 자료제출 기간 연장을 요청하는 경우에는 세관장이 해당 사유를 고려하여 타당하다고 인정하는 기간으로 한다. <개정 2026. 1. 2.>\n  [본조신설 2020. 10. 7.]\n  제6조 삭제 <2012. 2. 28.>","L51-0":"제51조(덤핑방지관세의 부과대상) 국내산업과 이해관계가 있는 자로서 대통령령으로 정하는 자 또는 주무부장관이 부과요청을 한 경우로서 외국의 물품이 대통령령으로 정하는 정상가격 이하로 수입(이하 “덤핑”이라 한다)되어 다음 각 호의 어느 하나에 해당하는 것(이하 이 관에서 “실질적 피해등”이라 한다)으로 조사를 통하여 확인되고 해당 국내산업을 보호할 필요가 있다고 인정되는 경우에는 재정경제부령으로 그 물품과 공급자 또는 공급국을 지정하여 해당 물품에 대하여 정상가격과 덤핑가격 간의 차액(이하 “덤핑차액”이라 한다)에 상당하는 금액 이하의 관세(이하 “덤핑방지관세”라 한다)를 추가하여 부과할 수 있다. <개정 2020. 6. 9., 2025. 10. 1.>\n    1. 국내산업이 실질적인 피해를 받거나 받을 우려가 있는 경우\n    2. 국내산업의 발전이 실질적으로 지연된 경우\n  [전문개정 2010. 12. 30.]","L142-0":"제142조(항외 하역) ① 국제무역선이 국제항의 바깥에서 물품을 하역하거나 환적하려는 경우에는 선장은 세관장의 허가를 받아야 한다. <개정 2020. 12. 22.>\n  ② 선장은 제1항에 따른 허가를 받으려면 재정경제부령으로 정하는 바에 따라 허가수수료를 납부하여야 한다.<개정 2025. 10. 1.>\n  ③ 세관장은 제1항에 따른 허가의 신청을 받은 날부터 10일 이내에 허가 여부를 신청인에게 통지하여야 한다.<신설 2018. 12. 31.>\n  ④ 세관장이 제3항에서 정한 기간 내에 허가 여부 또는 민원 처리 관련 법령에 따른 처리기간의 연장을 신청인에게 통지하지 아니하면 그 기간(민원 처리 관련 법령에 따라 처리기간이 연장 또는 재연장된 경우에는 해당 처리기간을 말한다)이 끝난 날의 다음 날에 허가를 한 것으로 본다.<신설 2018. 12. 31.>\n  [전문개정 2010. 12. 30.]","L164-0":"제164조(보세구역의 자율관리) ① 보세구역 중 물품의 관리 및 세관감시에 지장이 없다고 인정하여 관세청장이 정하는 바에 따라 세관장이 지정하는 보세구역(이하 “자율관리보세구역”이라 한다)에 장치한 물품은 제157조에 따른 세관공무원의 참여와 이 법에 따른 절차 중 관세청장이 정하는 절차를 생략한다.\n  ② 보세구역의 화물관리인이나 운영인은 자율관리보세구역의 지정을 받으려면 세관장에게 지정을 신청하여야 한다.\n  ③ 제2항에 따라 자율관리보세구역의 지정을 신청하려는 자는 해당 보세구역에 장치된 물품을 관리하는 사람(이하 “보세사”라 한다)을 채용하여야 한다.\n  ④ 세관장은 제2항에 따른 지정신청을 받은 경우 해당 보세구역의 위치와 시설상태 등을 확인하여 제1항에 따른 자율관리보세구역으로 적합하다고 인정될 때에는 해당 보세구역을 자율관리보세구역으로 지정할 수 있다.\n  ⑤ 제4항에 따라 자율관리보세구역의 지정을 받은 자는 제1항에 따라 생략하는 절차에 대하여 기록하고 관리하여야 한다.<개정 2023. 12. 31.>\n  ⑥ 세관장은 자율관리보세구역의 지정을 받은 자가 이 법에 따른 의무를 위반하거나 세관감시에 지장이 있다고 인정되는 경우 등 대통령령으로 정하는 사유가 발생한 경우에는 제4항에 따른 지정을 취소할 수 있다.<개정 2017. 12. 19.>\n  [전문개정 2010. 12. 30.]","L62-0":"제62조(상계관세에 대한 재심사 등) ① 재정경제부장관은 필요하다고 인정될 때에는 대통령령으로 정하는 바에 따라 다음 각 호의 조치(이하 이 조에서 “상계조치”라 한다)에 대하여 재심사를 할 수 있으며, 재심사의 결과에 따라 상계조치의 변경, 환급 등 필요한 조치를 할 수 있다. <개정 2023. 12. 31., 2025. 10. 1.>\n    1. 상계관세의 부과\n    2. 제60조에 따른 약속\n  ② 재정경제부장관은 제1항에 따른 재심사에 필요한 사항으로서 상계조치 물품의 수입 및 징수실적 등 대통령령으로 정하는 사항을 조사할 수 있다.<신설 2021. 12. 21., 2025. 10. 1.>\n  ③ 상계조치는 재정경제부령으로 그 적용시한을 따로 정하는 경우를 제외하고는 해당 상계조치의 시행일부터 5년 이 지나면 그 효력을 잃으며, 제1항에 따라 보조금등의 지급과 산업피해를 재심사하고 그 결과에 따라 내용을 변경할 때에는 재정경제부령으로 그 적용시한을 따로 정하는 경우를 제외하고는 변경된 내용의 시행일부터 5년이 지나면 그 효력을 잃는다. 다만, 대통령령으로 정하는 사유로 재심사하는 경우에는 재심사가 끝나기 전에 해당 상계조치의 적용시한이 종료되더라도 재심사기간 동안 그 상계조치는 효력을 잃지 아니한다.<개정 2021. 12. 21., 2023. 12. 31., 2025. 10. 1.>\n  ④ 제1항부터 제3항까지의 규정과 제57조부터 제61조까지의 규정에 따른 상계관세의 부과 및 시행 등에 필요한 사항은 대통령령으로 정한다.<개정 2021. 12. 21.>\n  [전문개정 2010. 12. 30.]","R35-0":"제35조(세율불균형물품에 대한 관세의 감면) ① 법 제89조제1항 각 호 외의 부분에 따라 관세가 감면되는 물품은 다음 각 호와 같다. <개정 2013. 3. 23., 2019. 3. 20., 2025. 10. 31.>\n    1. 항공기 제조업자 또는 수리업자가 항공기와 그 부분품의 제조 또는 수리에 사용하기 위하여 수입하는 부분품 및 원재료\n    2. 장비 제조업자 또는 수리업자가 반도체 제조용 장비의 제조 또는 수리에 사용하기 위하여 수입하는 부분품 및 원재료 중 산업통상부장관 또는 그가 지정하는 자가 추천하는 물품\n  ② 법 제89조제6항제1호에서 “「세계무역기구 설립을 위한 마라케쉬 협정 부속서 4의 민간항공기 무역에 관한 협정」 대상 물품 중 재정경제부령으로 정하는 물품”은 별표 1과 같다. <신설 2019. 3. 20., 2026. 1. 2.>\n  [전문개정 2013. 2. 23.]","L152-0":"제152조(도로차량의 국경출입) ① 국경을 출입하려는 도로차량의 운전자는 해당 도로차량이 국경을 출입할 수 있음을 증명하는 서류를 세관장으로부터 발급받아야 한다.\n  ② 국경을 출입하는 도로차량의 운전자는 출입할 때마다 제1항에 따른 서류를 세관공무원에게 제시하고 사증을 받아야 한다. 이 경우 전자적인 방법으로 서류의 제시 및 사증 발급을 대신할 수 있다.\n  ③ 제2항에 따른 사증을 받으려는 자는 재정경제부령으로 정하는 바에 따라 수수료를 납부하여야 한다. 다만, 재정경제부령으로 정하는 차량은 수수료를 면제한다.<개정 2025. 10. 1.>\n  [전문개정 2010. 12. 30.] 제153조 삭제 <2006. 12. 30.>","L57-0":"제57조(상계관세의 부과대상) 국내산업과 이해관계가 있는 자로서 대통령령으로 정하는 자 또는 주무부장관이 부과요청을 한 경우로서, 외국에서 제조ㆍ생산 또는 수출에 관하여 직접 또는 간접으로 보조금이나 장려금(이하 “보조금등”이라 한다)을 받은 물품의 수입으로 인하여 다음 각 호의 어느 하나에 해당하는 것(이하 이 관에서 “실질적 피해등”이라 한다)으로 조사를 통하여 확인되고 해당 국내산업을 보호할 필요가 있다고 인정되는 경우에는 재정경제부령으로 그 물품과 수출자 또는 수출국을 지정하여 그 물품에 대하여 해당 보조금등의 금액 이하의 관세(이하 “상계관세”라 한다)를 추가하여 부과할 수 있다. <개정 2020. 6. 9., 2025. 10. 1.>\n    1. 국내산업이 실질적인 피해를 받거나 받을 우려가 있는 경우\n    2. 국내산업의 발전이 실질적으로 지연된 경우\n  [전문개정 2010. 12. 30.]","L198-0":"제198조(종합보세사업장의 설치ㆍ운영에 관한 신고 등) ① 종합보세구역에서 종합보세기능을 수행하려는 자는 그 기능을 정하여 세관장에게 종합보세사업장의 설치ㆍ운영에 관한 신고를 하여야 한다.\n  ② 제175조 각 호의 어느 하나에 해당하는 자는 제1항에 따른 종합보세사업장의 설치ㆍ운영에 관한 신고를 할 수 없다.\n  ③ 종합보세사업장의 운영인은 그가 수행하는 종합보세기능을 변경하려면 세관장에게 이를 신고하여야 한다.\n  ④ 제1항 및 제3항에 따른 신고의 절차 등에 관하여 필요한 사항은 대통령령으로 정한다.\n  [전문개정 2010. 12. 30.]","L10-0":"제10조(천재지변 등으로 인한 기한의 연장) 세관장은 천재지변이나 그 밖에 대통령령으로 정하는 사유로 이 법에 따른 신고, 신청, 청구, 그 밖의 서류의 제출, 통지, 납부 또는 징수를 정하여진 기한까지 할 수 없다고 인정되는 경우에는 1년을 넘지 아니하는 기간을 정하여 대통령령으로 정하는 바에 따라 그 기한을 연장할 수 있다. 이 경우 세관장은 필요하다고 인정하는 경우에는 납부할 관세에 상당하는 담보를 제공하게 할 수 있다. <개정 2016. 12. 20.>\n  [전문개정 2010. 12. 30.]","D56-0":"제56조(관세환급가산금 등의 결정) ① 세관장은 법 제46조에 따라 충당 또는 환급(법 제28조제4항에 따라 잠정가격을 기초로 신고납부한 세액과 확정된 가격에 따른 세액을 충당 또는 환급하는 경우는 제외한다)하거나 법 제47조제1항에 따라 과다환급금을 징수하는 때에는 법 제47조제2항 또는 법 제48조에 따른 가산금을 결정하여야 한다. <개정 2013. 2. 15.>\n  ②제1항에 따른 가산금의 이율은 「은행법」에 따른 은행업의 인가를 받은 은행으로서 서울특별시에 본점을 둔 은행의 1년 만기 정기예금 이자율의 평균을 고려하여 재정경제부령으로 정하는 이자율로 한다. <개정 2001. 12. 31., 2006. 5. 22., 2010. 11. 15., 2012. 2. 2., 2020. 12. 29., 2025. 12. 30.>\n  ③ 법 제48조에서 “대통령령으로 정하는 관세환급가산금 기산일”이란 다음 각 호의 구분에 따른 날의 다음 날로 한다. <신설 2013. 2. 15., 2015. 2. 6., 2016. 6. 30., 2021. 2. 17., 2025. 2. 28.>\n    1. 착오납부, 이중납부 또는 납부 후 그 납부의 기초가 된 신고 또는 부과를 경정하거나 취소함에 따라 발생한 관세환급금: 납부일. 다만, 2회 이상 분할납부된 것인 경우에는 그 최종 납부일로 하되, 관세환급금액이 최종 납부된 금액을 초과하는 경우에는 관세환급금액이 될 때까지 납부일의 순서로 소급하여 계산한 관세환급금의 각 납부일로 한다.\n    2. 적법하게 납부된 관세의 감면으로 발생한 관세환급금: 감면 결정일\n    3. 적법하게 납부된 후 법률이 개정되어 발생한 관세환급금: 개정된 법률의 시행일\n    4. 이 법에 따라 신청한 환급세액(잘못 신청한 경우 이를 경정한 금액을 말한다)을 환급하는 경우: 신청을 한 날부터 30일이 지난 날. 다만, 환급세액을 신청하지 아니하였으나 세관장이 직권으로 결정한 환급세액을 환급하는 경우에는 해당 결정일로부터 30일이 지난 날로 한다.\n    5. 「자유무역협정의 이행을 위한 관세법의 특례에 관한 법률」 제9조제6항에 따른 관세환급금: 같은 조 제5항 후단에 따른 협정관세 적용 등의 통지일\n  ④ 법 제48조 단서에서 “국가 또는 지방자치단체가 직접 수입하는 물품 등 대통령령으로 정하는 물품”이란 제32조의4제5항 각 호의 어느 하나에 해당하는 물품을 말한다. <신설 2020. 2. 11.>\n  [제목개정 2013. 2. 15.]","R51-0":"제51조(재수출물품에 대한 관세의 감면신청) 법 제97조제1항의 규정에 의하여 관세를 감면받고자 하는 자는 영 제112조제1항 각호의 사항외에 당해 물품의 수출예정시기ㆍ수출지 및 수출예정세관명을 신청서에 기재하여야 한다.","D151-2":"제151조의2(재조사의 연기ㆍ중지ㆍ연장 등) 법 제128조제5항 후단(법 제118조제6항 및 제132조제4항에서 준용하는 경우를 포함한다)에 따라 재조사를 연기 또는 중지하거나 조사기간을 연장하는 경우에는 제139조의2제2항부터 제5항까지 및 제140조를 준용한다.\n  [본조신설 2018. 2. 13.]","D11-0":"제11조(포괄담보) ①법 제24조제4항의 규정에 의하여 담보를 포괄하여 제공하고자 하는 자는 그 기간 및 담보의 최고액과 담보제공자의 전년도 수출입실적 및 예상수출입물량을 기재한 신청서를 세관장에게 제출하여야 한다.\n  ②담보를 포괄하여 제공할 수 있는 요건, 그 담보의 종류 기타 필요한 사항은 관세청장이 정한다.","D236-9":"제236조의9(원산지표시위반단속기관협의회) ① 법 제233조의3제1항에서 “원산지표시 위반 단속업무에 필요한 정보교류 등 대통령령으로 정하는 사항”이란 다음 각 호의 사항을 말한다.\n    1. 원산지표시 위반 단속업무에 필요한 정보교류에 관한 사항\n    2. 원산지표시 위반 단속업무와 관련된 인력교류에 관한 사항\n    3. 그 밖에 원산지표시 위반 단속업무와 관련되어 위원장이 회의에 부치는 사항\n  ② 법 제233조의3제1항에 따른 원산지표시위반단속기관협의회(이하 이 조에서 “협의회”라 한다)는 위원장 1명을 포함하여 25명 이내의 위원으로 구성한다.\n  ③ 협의회의 위원장은 원산지표시 위반 단속업무를 관장하는 관세청의 고위공무원단에 속하는 공무원 중에서 관세청장이 지정하는 사람이 되고, 위원은 다음 각 호의 사람이 된다.\n    1. 관세청장이 지정하는 과장급 공무원 1명\n    2. 농림축산식품부장관이 지정하는 국립농산물품질관리원 소속 과장급 공무원 1명\n    3. 해양수산부장관이 지정하는 국립수산물품질관리원 소속 과장급 공무원 1명\n    4. 특별시, 광역시, 특별자치시, 도, 특별자치도의 장이 지정하는 과장급 공무원 각 1명\n  ④ 위원장은 협의회를 대표하고 사무를 총괄한다. 다만, 부득이한 사유로 위원장이 그 직무를 수행하지 못하는 경우에는 위원장이 미리 지명한 사람이 그 직무를 대행한다. <개정 2020. 12. 29.>\n  ⑤ 협의회의 회의는 정기회의와 임시회의로 구분하되, 정기회의는 반기마다 소집하며, 임시회의는 위원장이 필요하다고 인정하는 경우에 소집한다.\n  ⑥ 협의회의 회의는 위원장이 소집하며 그 의장은 위원장이 된다.\n  ⑦ 협의회의 회의는 재적위원 과반수의 출석으로 개의하고, 출석위원 3분의 2 이상의 찬성으로 의결한다.\n  ⑧ 협의회의 사무를 처리하게 하기 위하여 관세청 소속 5급 공무원 1명을 간사로 둔다.\n  ⑨ 제1항부터 제8항까지에서 규정한 사항 외에 협의회의 운영에 필요한 사항은 협의회의 의결을 거쳐 위원장이 정한다.\n  [본조신설 2014. 3. 5.]","D20-0":"제20조(운임 등의 결정) ①법 제30조제1항제6호의 규정에 의한 운임 및 보험료는 당해 사업자가 발급한 운임명세서ㆍ보험료명세서 또는 이에 갈음할 수 있는 서류에 의하여 산출한다.\n  ②제1항에 따라 운임 및 보험료를 산출할 수 없는 경우의 운임 및 보험료는 운송거리ㆍ운송방법 등을 고려하여 재정경제부령으로 정하는 바에 따라 산출한다. <개정 2020. 10. 7., 2025. 12. 30.>\n  ③재정경제부령으로 정하는 물품이 항공기로 운송되는 경우에는 제1항에도 불구하고 해당 물품이 항공기 외의 일반적인 운송방법에 의하여 운송된 것으로 보아 재정경제부령으로 정하는 바에 따라 운임 및 보험료를 산출한다. <개정 2020. 10. 7., 2025. 12. 30.>\n  ④다음 각 호의 어느 하나에 해당하는 물품의 운임(제4호의 경우에는 보험료를 포함한다. 이하 이 조에서 같다)이 통상의 운임과 현저하게 다른 때에는 제1항에도 불구하고 법 제225조제1항에 따른 선박회사 또는 항공사(그 업무를 대행하는 자를 포함한다. 이하 이 항에서 “선박회사등”이라 한다)가 통상적으로 적용하는 운임을 해당 물품의 운임으로 할 수 있다. 이 경우 통상적으로 적용하는 운임의 기준, 적용기한, 그 밖에 필요한 사항은 관세청장이 정한다. <개정 2020. 10. 7., 2026. 5. 8.>\n    1. 수입자 또는 수입자와 특수관계에 있는 선박회사등의 운송수단으로 운송되는 물품\n    2. 운임과 적재수량을 특약한 항해용선계약에 따라 운송되는 물품(실제 적재수량이 특약수량에 미치지 아니하는 경우를 포함한다)\n    3. 기타 특수조건에 의하여 운송되는 물품\n    4. 전쟁, 천재지변 등 불가피한 사유가 발생하여 통상적인 운송경로ㆍ운송일정 등과 다르게 운송되는 물품\n  ⑤법 제30조제1항제6호 본문에 따른 금액은 해당 수입물품이 수입항에 도착하여 본선하역준비가 완료될 때까지 발생하는 비용으로 한다. <개정 2022. 2. 15.>\n  ⑥ 제3항에 따라 산출된 운임 및 보험료 또는 제4항에 따라 통상적으로 적용하는 운임을 적용받으려는 납세의무자는 해당 물품에 대하여 법 제27조에 따른 가격신고를 할 때 해당 물품이 제3항 또는 제4항에 따른 물품에 해당됨을 증명하는 자료를 세관장에게 제출해야 한다. 다만, 과세가격 금액이 소액인 경우 등으로서 세관장이 자료 제출이 필요하지 않다고 인정하는 경우는 제외한다. <개정 2020. 10. 7., 2025. 12. 30., 2026. 5. 8.>\n  ⑦ 삭제 <2020. 10. 7.>","D225-2":"제225조의2(압류물품의 유찰 가격) ① 법 제212조제3항에서 “대통령령으로 정하는 유찰물품의 가격”은 해당 물품의 최종예정가격을 말한다.\n  ② 제1항에 따른 최종예정가격은 마지막 입찰 시 제222조제7항에 따라 산출한 예정가격으로 한다.\n  [본조신설 2023. 2. 28.]","R7-9":"제7조의9(가산율 또는 공제율의 결정 방법) ① 영 제30조제2항에 따라 가산율 또는 공제율의 적용을 받으려 하는 자는 관세청장이 정하는 가산율 또는 공제율 산정신청서에 다음 각 호의 서류를 첨부하여 관세청장 또는 세관장에게 제출해야한다.\n    1. 최근 3년간의 해당물품의 수입실적 자료\n    2. 영 제31조제1항 각 호의 서류\n    3. 최근 3년간 해당 수입물품의 국내판매 가격자료와 이윤 및 일반경비를 확인할 수 있는 자료(공제율 산정의 경우에 한정한다)\n  ② 영 제30조제1항에 따라 가산율 또는 공제율을 산정하는 경우 관세청장 또는 세관장은 해당 납세의무자에게 의견을 제시할 기회를 주어야 한다.\n  ③ 제1항에 따른 신청을 받은 관세청장 또는 세관장은 신청서류 및 신청인의 최근 거래관계와 거래내용을 심사하여 20일 이내에 관세청장이 정하는 가산율 또는 공제율 결정서를 신청인에게 발급해야 한다. 다만, 다음 각 호의 어느 하나에 해당하여 가산율 또는 공제율의 산정이 곤란한 경우에는 가산율 또는 공제율 결정서를 발급하지 아니한다.\n    1. 가산 또는 공제할 금액의 지급기준이 변경되는 경우\n    2. 가산율 또는 공제율 결정의 기초가 되는 거래관계나 내용이 변경된 경우\n    3. 그 밖에 관세청장 또는 세관장이 거래관계나 거래내용 등을 고려하여 가산율 또는 공제율의 산정이 곤란하다고 인정하는 경우\n  ④ 제3항에 따라 결정되는 가산율 또는 공제율은 소수점 이하 셋째 자릿수까지 계산한 후 이를 반올림하여 둘째 자릿수까지 산정한다.\n  ⑤ 가산율 또는 공제율은 제3항에 따른 가산율 또는 공제율 결정서를 발급한 날부터 1년 간 적용한다. 다만, 세관장이 필요하다고 인정하는 경우에는 적용 기간을 다르게 정할 수 있다.\n  [본조신설 2020. 10. 7.]","R1-3":"제1조의3(담보의 관세충당) 법 제25조제1항에 따른 담보의 관세충당은 다음 각 호의 구분에 의한 방법에 따른다. <개정 2005. 2. 11., 2009. 3. 26., 2020. 10. 7.>\n    1. 담보물이 법 제24조제1항제2호ㆍ제3호ㆍ제5호 및 제6호에 해당하는 경우 : 이를 매각하는 방법\n    2. 담보물이 법 제24조제1항제4호 및 제7호에 해당하는 경우 : 그 보증인에게 담보한 관세에 상당하는 금액을 납부할 것을 즉시 통보하는 방법\n    3. 삭제 <2009. 3. 26.>\n  [제1조에서 이동 <2020. 10. 7.>]","R60-0":"제60조(분할납부의 기간 및 방법) 법 제107조제2항의 규정에 의하여 관세의 분할납부승인을 하는 경우의 납부기간과 납부방법은 별표 5와 같다. 다만, 수입신고 건당 관세액이 30만원 미만인 물품을 제외한다.","D261-0":"제261조(수출입신고대상 우편물) 법 제258조제2항에서 “대통령령으로 정하는 기준에 해당하는 것”이란 다음 각 호의 어느 하나에 해당하는 우편물을 말한다. <개정 2002. 12. 30., 2011. 4. 1., 2023. 2. 28., 2025. 2. 28.>\n    1. 법령에 따라 수출입이 제한되거나 금지되는 물품\n    2. 법 제226조에 따라 세관장의 확인이 필요한 물품\n    3. 판매를 목적으로 반입하는 물품 또는 대가를 지급하였거나 지급하여야 할 물품(통관허용여부 및 과세대상여부에 관하여 관세청장이 정한 기준에 해당하는 것으로 한정한다)\n    4. 가공무역을 위하여 우리나라와 외국간에 무상으로 수출입하는 물품 및 그 물품의 원ㆍ부자재\n    4의2. 다음 각 목의 어느 하나에 해당하는 수입물품\n      가. 「건강기능식품에 관한 법률」 제3조제1호에 따른 건강기능식품\n      나. 「약사법」 제2조제4호에 따른 의약품\n      다. 그 밖에 가목 및 나목의 물품과 유사한 물품으로서 관세청장이 국민보건을 위하여 수입신고가 필요하다고 인정하여 고시하는 물품\n    5. 그 밖에 수출입신고가 필요하다고 인정되는 물품으로서 관세청장이 정하는 금액을 초과하는 물품","D259-3":"제259조의3(수출입 안전관리 우수업체의 공인절차 등) ① 법 제255조의2제1항에 따라 수출입 안전관리 우수업체(이하 “수출입안전관리우수업체”라 한다)로 공인받으려는 자는 신청서에 다음 각 호의 서류를 첨부하여 관세청장에게 제출하여야 한다. <개정 2022. 2. 15.>\n    1. 자체 안전관리 평가서\n    2. 안전관리 현황 설명서\n    3. 그 밖에 업체의 안전관리 현황과 관련하여 관세청장이 정하는 서류\n  ② 법 제255조의2제5항에 따라 공인을 갱신하려는 자는 공인의 유효기간이 끝나는 날의 6개월 전까지 신청서에 제1항 각 호에 따른 서류를 첨부하여 관세청장에게 제출해야 한다. <개정 2016. 2. 5., 2022. 2. 15.>\n  ③ 관세청장은 공인을 받은 자에게 공인을 갱신하려면 공인의 유효기간이 끝나는 날의 6개월 전까지 갱신을 신청하여야 한다는 사실을 해당 공인의 유효기간이 끝나는 날의 7개월 전까지 휴대폰에 의한 문자전송, 전자메일, 팩스, 전화, 문서 등으로 미리 알려야 한다. <신설 2016. 2. 5.>\n  ④ 관세청장은 제1항 또는 제2항에 따른 신청을 받은 경우 안전관리기준을 충족하는 업체에 대하여 공인증서를 교부하여야 한다. <신설 2016. 2. 5.>\n  ⑤ 수출입안전관리우수업체에 대한 공인의 등급, 안전관리 공인심사에 관한 세부절차, 그 밖에 필요한 사항은 관세청장이 정한다. 다만, 「국제항해선박 및 항만시설의 보안에 관한 법률」 등 안전관리에 관한 다른 법령과 관련된 사항에 대해서는 관계기관의 장과 미리 협의해야 한다. <개정 2016. 2. 5., 2022. 2. 15.>\n  [본조신설 2009. 2. 4.]","L30-0":"제30조(과세가격 결정의 원칙) ① 수입물품의 과세가격은 우리나라에 수출하기 위하여 판매되는 물품에 대하여 구매자가 실제로 지급하였거나 지급하여야 할 가격에 다음 각 호의 금액을 더하여 조정한 거래가격으로 한다. 다만, 다음 각 호의 금액을 더할 때에는 객관적이고 수량화할 수 있는 자료에 근거하여야 하며, 이러한 자료가 없는 경우에는 이 조에 규정된 방법으로 과세가격을 결정하지 아니하고 제31조부터 제35조까지에 규정된 방법으로 과세가격을 결정한다. <개정 2013. 1. 1., 2025. 10. 1.>\n    1. 구매자가 부담하는 수수료와 중개료. 다만, 구매수수료는 제외한다.\n    2. 해당 수입물품과 동일체로 취급되는 용기의 비용과 해당 수입물품의 포장에 드는 노무비와 자재비로서 구매자가 부담하는 비용\n    3. 구매자가 해당 수입물품의 생산 및 수출거래를 위하여 대통령령으로 정하는 물품 및 용역을 무료 또는 인하된 가격으로 직접 또는 간접으로 공급한 경우에는 그 물품 및 용역의 가격 또는 인하차액을 해당 수입물품의 총생산량 등 대통령령으로 정하는 요소를 고려하여 적절히 배분한 금액\n    4. 특허권, 실용신안권, 디자인권, 상표권 및 이와 유사한 권리를 사용하는 대가로 지급하는 것으로서 대통령령으로 정하는 바에 따라 산출된 금액\n    5. 해당 수입물품을 수입한 후 전매ㆍ처분 또는 사용하여 생긴 수익금액 중 판매자에게 직접 또는 간접으로 귀속되는 금액\n    6. 수입항(輸入港)까지의 운임ㆍ보험료와 그 밖에 운송과 관련되는 비용으로서 대통령령으로 정하는 바에 따라 결정된 금액. 다만, 재정경제부령으로 정하는 수입물품의 경우에는 이의 전부 또는 일부를 제외할 수 있다.\n  ② 제1항 각 호 외의 부분 본문에서 “구매자가 실제로 지급하였거나 지급하여야 할 가격”이란 해당 수입물품의 대가로서 구매자가 지급하였거나 지급하여야 할 총금액을 말하며, 구매자가 해당 수입물품의 대가와 판매자의 채무를 상계(相計)하는 금액, 구매자가 판매자의 채무를 변제하는 금액, 그 밖의 간접적인 지급액을 포함한다. 다만, 구매자가 지급하였거나 지급하여야 할 총금액에서 다음 각 호의 어느 하나에 해당하는 금액을 명백히 구분할 수 있을 때에는 그 금액을 뺀 금액을 말한다.\n    1. 수입 후에 하는 해당 수입물품의 건설, 설치, 조립, 정비, 유지 또는 해당 수입물품에 관한 기술지원에 필요한 비용\n    2. 수입항에 도착한 후 해당 수입물품을 운송하는 데에 필요한 운임ㆍ보험료와 그 밖에 운송과 관련되는 비용\n    3. 우리나라에서 해당 수입물품에 부과된 관세 등의 세금과 그 밖의 공과금\n    4. 연불조건(延拂條件)의 수입인 경우에는 해당 수입물품에 대한 연불이자\n  ③ 다음 각 호의 어느 하나에 해당하는 경우에는 제1항에 따른 거래가격을 해당 물품의 과세가격으로 하지 아니하고 제31조부터 제35조까지에 규정된 방법으로 과세가격을 결정한다. 이 경우 세관장은 다음 각 호의 어느 하나에 해당하는 것으로 판단하는 근거를 납세의무자에게 미리 서면으로 통보하여 의견을 제시할 기회를 주어야 한다.<개정 2011. 12. 31., 2014. 12. 23.>\n    1. 해당 물품의 처분 또는 사용에 제한이 있는 경우. 다만, 세관장이 제1항에 따른 거래가격에 실질적으로 영향을 미치지 아니한다고 인정하는 제한이 있는 경우 등 대통령령으로 정하는 경우는 제외한다.\n    2. 해당 물품에 대한 거래의 성립 또는 가격의 결정이 금액으로 계산할 수 없는 조건 또는 사정에 따라 영향을 받은 경우\n    3. 해당 물품을 수입한 후에 전매ㆍ처분 또는 사용하여 생긴 수익의 일부가 판매자에게 직접 또는 간접으로 귀속되는 경우. 다만, 제1항에 따라 적절히 조정할 수 있는 경우는 제외한다.\n    4. 구매자와 판매자 간에 대통령령으로 정하는 특수관계(이하 “특수관계”라 한다)가 있어 그 특수관계가 해당 물품의 가격에 영향을 미친 경우. 다만, 해당 산업부문의 정상적인 가격결정 관행에 부합하는 방법으로 결정된 경우 등 대통령령으로 정하는 경우는 제외한다.\n  ④ 세관장은 납세의무자가 제1항에 따른 거래가격으로 가격신고를 한 경우 해당 신고가격이 동종ㆍ동질물품 또는 유사물품의 거래가격과 현저한 차이가 있는 등 이를 과세가격으로 인정하기 곤란한 경우로서 대통령령으로 정하는 경우에는 대통령령으로 정하는 바에 따라 납세의무자에게 신고가격이 사실과 같음을 증명할 수 있는 자료를 제출할 것을 요구할 수 있다.\n  ⑤ 세관장은 납세의무자가 다음 각 호의 어느 하나에 해당하면 제1항과 제2항에 규정된 방법으로 과세가격을 결정하지 아니하고 제31조부터 제35조까지에 규정된 방법으로 과세가격을 결정한다. 이 경우 세관장은 빠른 시일 내에 과세가격 결정을 하기 위하여 납세의무자와 정보교환 등 적절한 협조가 이루어지도록 노력하여야 하고, 신고가격을 과세가격으로 인정하기 곤란한 사유와 과세가격 결정 내용을 해당 납세의무자에게 통보하여야 한다.<개정 2013. 1. 1.>\n    1. 제4항에 따라 요구받은 자료를 제출하지 아니한 경우\n    2. 제4항의 요구에 따라 제출한 자료가 일반적으로 인정된 회계원칙에 부합하지 아니하게 작성된 경우\n    3. 그 밖에 대통령령으로 정하는 사유에 해당하여 신고가격을 과세가격으로 인정하기 곤란한 경우\n  [전문개정 2010. 12. 30.]","L56-0":"제56조(덤핑방지관세에 대한 재심사 등) ① 재정경제부장관은 필요하다고 인정될 때에는 대통령령으로 정하는 바에 따라 다음 각 호의 조치(이하 이 조에서 “덤핑방지조치”라 한다)에 대하여 재심사를 할 수 있으며, 재심사의 결과에 따라 덤핑방지조치의 변경, 환급 등 필요한 조치를 할 수 있다. <개정 2023. 12. 31., 2025. 10. 1.>\n    1. 덤핑방지관세의 부과\n    2. 제54조에 따른 약속\n  ② 재정경제부장관은 제1항에 따른 재심사에 필요한 사항으로서 덤핑방지조치 물품의 수입 및 징수실적 등 대통령령으로 정하는 사항을 조사할 수 있다.<신설 2021. 12. 21., 2025. 10. 1.>\n  ③ 덤핑방지조치는 재정경제부령으로 그 적용시한을 따로 정하는 경우를 제외하고는 해당 덤핑방지조치의 시행일부터 5년이 지나면 그 효력을 잃으며, 제1항에 따라 덤핑과 산업피해를 재심사하고 그 결과에 따라 내용을 변경할 때에는 재정경제부령으로 그 적용시한을 따로 정하는 경우를 제외하고는 변경된 내용의 시행일부터 5년이 지나면 그 효력을 잃는다. 다만, 대통령령으로 정하는 사유로 재심사하는 경우에는 재심사가 끝나기 전에 해당 덤핑방지조치의 적용시한이 종료되더라도 재심사기간 동안 그 덤핑방지조치는 효력을 잃지 아니한다.<개정 2021. 12. 21., 2023. 12. 31., 2025. 10. 1.>\n  ④ 제1항부터 제3항까지의 규정과 제51조부터 제55조까지의 규정에 따른 덤핑방지관세의 부과 및 시행 등에 필요한 사항은 대통령령으로 정한다.<개정 2021. 12. 21.>\n  [전문개정 2010. 12. 30.]","D10-0":"제10조(담보의 제공절차 등) ①관세의 담보를 제공하고자 하는 자는 담보의 종류ㆍ수량ㆍ금액 및 담보사유를 기재한 담보제공서를 세관장에게 제출하여야 한다.\n  ② 금전을 담보로 제공하려는 자는 「국고금 관리법 시행령」 제11조제1항 각 호의 금융기관 중 관세청장이 지정한 금융기관에 이를 납입하고 그 확인서를 담보제공서에 첨부해야 한다. <신설 2019. 2. 12.>\n  ③국채 또는 지방채를 담보로 제공하려는 자는 해당 채권에 관하여 모든 권리를 행사할 수 있는 자의 위임장을 담보제공서에 첨부하여야 한다. <개정 2009. 2. 4., 2019. 2. 12.>\n  ④ 법 제24조제1항제3호에 따른 유가증권을 담보로 제공하려는 자는 해당 증권발행자의 증권확인서와 해당 증권에 관한 모든 권리를 행사할 수 있는 자의 위임장을 담보제공서에 첨부하여야 한다. <개정 2009. 2. 4., 2019. 2. 12.>\n  ⑤ 법 제24조제1항제4호에 따른 납세보증보험증권이나 같은 항 제7호에 따라 세관장이 인정하는 보증인의 납세보증서를 담보로 제공하려는 자는 그 납세보증보험증권 또는 납세보증서를 담보제공서에 첨부하여야 한다. 이 경우 담보가 되는 보증 또는 보험의 기간은 해당 담보를 필요로 하는 기간으로 하되, 납부기한이 확정되지 아니한 경우에는 관세청장이 정하는 기간으로 한다. <개정 2009. 2. 4., 2019. 2. 12.>\n  ⑥ 법 제24조제1항제5호에 따른 토지, 같은 항 제6호에 따른 건물ㆍ공장재단ㆍ광업재단ㆍ선박ㆍ항공기나 건설기계를 담보로 제공하려는 자는 저당권을 설정하는 데에 필요한 서류를 담보제공서에 첨부하여야 한다. 이 경우 세관장은 저당권의 설정을 위한 등기 또는 등록의 절차를 밟아야 한다. <개정 2009. 2. 4., 2019. 2. 12.>\n  ⑦ 제6항에 따라 보험에 든 건물ㆍ공장재단ㆍ광업재단ㆍ선박ㆍ항공기나 건설기계를 담보로 제공하려는 자는 그 보험증권을 제출하여야 한다. 이 경우에 그 보험기간은 담보를 필요로 하는 기간에 30일 이상을 더한 것이어야 한다. <개정 2009. 2. 4., 2019. 2. 12.>\n  ⑧제공하고자 하는 담보의 금액은 납부하여야 하는 관세에 상당하는 금액이어야 한다. 다만, 그 관세가 확정되지 아니한 경우에는 관세청장이 정하는 금액으로 한다.\n  ⑨세관장은 다음 각 호의 어느 하나에 해당하는 경우에는 법 제39조에 따른 납부고지를 할 수 있다. <개정 2021. 2. 17.>\n    1. 관세의 담보를 제공하고자 하는 자가 담보액의 확정일부터 10일 이내에 담보를 제공하지 아니하는 경우\n    2. 납세의무자가 수입신고후 10일 이내에 법 제248조제2항의 규정에 의한 담보를 제공하지 아니하는 경우","D263-2":"제263조의2(과세자료의 범위 및 제출시기 등) ① 법 제264조의2에 따른 과세자료제출기관(이하 “과세자료제출기관”이라 한다)이 법 제264조의3 및 제264조의4에 따라 제출하여야 하는 과세자료의 범위, 과세자료를 제출받을 기관 및 제출시기는 별표 3과 같다.\n  ② 과세자료제출기관의 장은 법 제264조의4제3항에 따라 관세청장 또는 세관장으로부터 과세자료의 추가 또는 보완을 요구받은 경우에는 정당한 사유가 없으면 그 요구를 받은 날부터 15일 이내에 그 요구에 따라야 한다.\n  [본조신설 2014. 3. 5.]","R3-0":"제3조(잠정가격신고 대상물품 등) ① 영 제16조제1항제1호에서 “재정경제부령으로 정하는 것”이란 원유ㆍ곡물ㆍ광석 그 밖의 이와 비슷한 1차산품을 말한다. <개정 2008. 12. 31., 2011. 4. 1., 2017. 3. 31., 2026. 1. 2.>\n  ② 영 제16조제1항제2호의3에서 “재정경제부령으로 정하는 요건을 갖춘 경우”란 판매자와 구매자가 수립하는 수입물품의 거래가격 조정계획에 따라 조정(「국제조세조정에 관한 법률」 제7조에 따른 조정은 제외한다)하는 금액이 실제로 지급 또는 영수되고 해당 거래의 수입물품에 객관적으로 배분ㆍ계산될 것으로 판단되는 거래로서 다음 각 호의 요건을 모두 갖춘 경우를 말한다. <신설 2017. 3. 31., 2021. 3. 16., 2026. 1. 2.>\n    1. 납세의무자가 다음 각 목의 어느 하나에 해당될 것\n      가. 법 제37조제1항제3호에 따라 과세가격 결정방법의 사전심사를 신청하여 과세가격 결정방법을 통보받아 영 제16조제1항제2호의2에 따른 잠정가격 신고의 자격이 없는 경우 중 해당 통보받은 과세가격 결정방법이 법 제30조제1항 본문에 따른 방법인 경우\n      나. 「국제조세조정에 관한 법률」 제14조에 따른 정상가격 산출방법의 사전승인을 받은 경우\n    2. 납세의무자가 제1호가목에 따른 과세가격 결정방법을 통보받거나 같은 호 나목에 따른 정상가격 산출방법 사전승인을 받은 이후 해당 거래의 수입물품 수입신고 1개월 전까지 별지 제1호의5 서식의 수입물품 거래가격 조정 계획서에 다음 각 목의 서류를 첨부하여 세관장에게 제출했을 것\n      가. 수입물품별 가격의 산출방법을 구체적으로 설명하는 다음의 자료\n  1) 구매자와 판매자간 가격결정 및 조정에 관하여 합의한 계약서, 구매자의 내부지침 등 자료\n  2)「국제조세조정에 관한 법률」 제8조에 따른 정상가격을 산출하기 위하여 작성한 검토 보고서 및 관련 재무자료\n      나. 과세관청으로부터 과세가격 결정방법을 통보받은 내역 또는 「국제조세조정에 관한 법률」 제14조에 따른 정상가격 산출방법의 사전승인을 받은 내역\n      다. 「국제조세조정에 관한 법률」 제16조제1항에 따른 국제거래정보통합보고서\n      라. 그 밖에 잠정가격 신고요건을 확인하기 위하여 필요한 서류로서 세관장이 요청하는 서류\n  ③ 영 제16조제1항제3호에서 “재정경제부령으로 정하는 경우”란 다음 각 호의 어느 하나에 해당하는 경우를 말한다. <신설 2020. 10. 7., 2026. 1. 2.>\n    1. 법 제33조에 따라 과세가격을 결정하기 위한 이윤 및 일반경비 산출 등에 오랜 시간이 소요되는 경우\n    2. 설계ㆍ시공 일괄입찰 방식으로 계약된 플랜트 등 물품의 최초 발주시기보다 상당기간이 지나 인도가 완료되는 경우\n    3. 수입 후에 수입물품의 가격이 확정되는 경우로서 다음 각 목의 요건을 모두 충족하는 경우\n      가. 수입 이전에 거래 당사자간의 계약에 따라 최종 거래가격 산출공식이 확정되어 있을 것\n      나. 최종 거래가격은 수입 후 발생하는 사실에 따라 확정될 것\n      다. 수입 후 발생하는 사실은 거래 당사자가 통제할 수 없는 변수에 기초할 것\n    4. 그 밖에 계약의 내용이나 거래의 특성상 잠정가격으로 가격신고를 하는 것이 불가피하다고 세관장이 인정하는 경우\n  [제목개정 2017. 3. 31.]","R69-2":"제69조의2(화물관리인의 지정절차 및 지정기준) ① 세관장이나 해당 시설의 소유자 또는 관리자는 영 제187조제2항제2호에 따라 화물관리인을 지정하려는 경우에는 지정 예정일 3개월 전까지 지정 계획을 공고하여야 한다.\n  ② 영 제187조제2항제2호에 따라 화물관리인으로 지정을 받으려는 자는 지정신청서를 제1항에 따른 공고일부터 30일 내에 세관장이나 해당 시설의 소유자 또는 관리자에게 제출하여야 한다.\n  ③ 영 제187조제3항제4호에서 “재정경제부령으로 정하는 사항”이란 다음 각 호의 사항을 말한다. <개정 2026. 1. 2.>\n    1. 지게차, 크레인 등 화물관리에 필요한 시설장비 구비 현황\n    2. 법 제255조의2제1항에 따라 수출입 안전관리 우수업체로 공인을 받았는지 여부\n    3. 그 밖에 관세청장이나 해당 시설의 소유자 또는 관리자가 정하는 사항\n  ④ 제1항 및 제2항에서 규정한 사항 외에 화물관리인의 지정절차 등에 관하여 필요한 사항은 관세청장이 정한다.\n  [본조신설 2011. 4. 1.]\n  제69조의3 삭제 <2022. 3. 18.>","R55-2":"제55조의2(가치감소 산정기준) 영 제118조제2항에 따른 가치감소의 산정기준은 다음 각 호와 같다.\n    1. 변질 또는 손상으로 인한 가치감소의 경우 제7조의2제2호 각 목에 따른 금액 산정 방법을 준용한다.\n    2. 사용으로 인한 가치감소의 경우 제7조의5제1항제3호에 따른 가치감소분 산정방법을 준용한다.\n  [본조신설 2020. 10. 7.]","R26-0":"제26조(상계관세부과를 위한 피해의 통산) 영 제77조제3항제1호에서 “재정경제부령이 정하는 기준”이란 국제협약에서 달리 정하지 아니하는 한 보조금등의 금액이 당해 물품 가격대비 100분의 1이상인 경우를 말한다. <개정 2008. 12. 31., 2026. 1. 2.>","D246-0":"제246조(수출ㆍ수입 또는 반송의 신고) ①법 제241조제1항에서 “대통령령으로 정하는 사항”이란 다음 각 호의 사항을 말한다. <개정 2002. 12. 30., 2011. 4. 1., 2015. 2. 6., 2016. 2. 5., 2025. 12. 30.>\n    1. 포장의 종류ㆍ번호 및 개수\n    2. 목적지ㆍ원산지 및 선적지\n    3. 원산지표시 대상물품인 경우에는 표시유무ㆍ방법 및 형태\n    4. 상표\n    5. 납세의무자 또는 화주의 상호(개인의 경우 성명을 말한다)ㆍ사업자등록번호ㆍ통관고유부호와 해외공급자부호 또는 해외구매자부호\n    6. 물품의 장치장소\n    7. 그 밖에 재정경제부령으로 정하는 참고사항\n  ②법 제241조제1항의 규정에 의하여 수출ㆍ수입 또는 반송의 신고를 하고자 하는 자는 재정경제부령으로 정하는 수출ㆍ수입 또는 반송의 신고서를 세관장에게 제출하여야 한다. <개정 2016. 2. 5., 2025. 12. 30.>\n    1. 삭제 <2016. 2. 5.>\n    2. 삭제 <2016. 2. 5.>\n  ③ 법 제241조제1항에 따른 가격은 다음 각 호의 구분에 따른다. <개정 2019. 2. 12.>\n    1. 수출ㆍ반송신고가격: 해당 물품을 본선에 인도하는 조건으로 실제로 지급받았거나 지급받아야 할 가격으로서 최종 선적항 또는 선적지까지의 운임ㆍ보험료를 포함한 가격\n    2. 수입신고가격: 법 제30조부터 제35조까지의 규정에 따른 방법으로 결정된 과세가격\n  ④법 제241조제2항의 규정에 의하여 신고를 생략하게 하는 물품은 다음 각호의 1과 같다. 다만, 법 제226조의 규정에 해당하는 물품을 제외한다. <개정 2015. 2. 6., 2018. 2. 13.>\n    1. 법 제96조제1항제1호에 따른 여행자휴대품\n    2. 법 제96조제1항제3호에 따른 승무원휴대품\n    3. 우편물(법 제258조제2항에 해당하는 것을 제외한다)\n    4. 국제운송을 위한 컨테이너(법 별표 관세율표중 기본세율이 무세인 것에 한한다)\n    5. 기타 서류ㆍ소액면세물품 등 신속한 통관을 위하여 필요하다고 인정하여 관세청장이 정하는 탁송품 또는 별송품\n  ⑤법 제241조제2항의 규정에 의한 수입물품중 관세가 면제되거나 무세인 물품에 있어서는 그 검사를 마친 때에 당해 물품에 대한 수입신고가 수리된 것으로 본다. <개정 2015. 2. 6.>\n  ⑥법 제241조의 규정에 의하여 수출신고를 함에 있어 수출신고가격을 산정하기 위하여 외국통화로 표시된 가격을 내국통화로 환산하는 때에는 수출신고일이 속하는 주의 전주의 기준환율 또는 재정환율을 평균하여 관세청장이 정한 율로 하여야 한다. <개정 2015. 2. 6., 2022. 9. 15.>\n  ⑦법 제241조제6항 전단에서 “대통령령으로 정하는 물품”이란 다음 각 호의 어느 하나에 해당하는 것을 말한다. <신설 2007. 4. 5., 2011. 4. 1., 2015. 2. 6.>\n    1. 전기\n    2. 가스\n    3. 유류\n    4. 용수(用水)\n  ⑧법 제241조제6항 전단에서 “전선이나 배관 등 대통령령으로 정하는 시설 또는 장치 등”이란 전선로, 배관 등 제7항 각 호의 어느 하나에 해당하는 물품을 공급하기에 적합하도록 설계ㆍ제작된 일체의 시설을 말한다. <신설 2007. 4. 5., 2011. 4. 1., 2015. 2. 6., 2023. 2. 28.>\n  ⑨제1항 및 제2항은 법 제241조제6항에 따라 수출ㆍ수입 또는 반송하는 경우에 준용한다. <신설 2007. 4. 5., 2015. 2. 6.>","D70-0":"제70조(덤핑방지관세 및 약속의 재심사) ①재정경제부장관은 재심사가 필요하다고 인정되거나 이해관계인이나 해당 산업을 관장하는 주무부장관이 다음 각 호의 어느 하나에 해당하는 경우에 관한 명확한 정보 제공과 함께 재심사 요청서를 제출한 때에는 덤핑방지관세가 부과되고 있거나 법 제54조에 따른 약속(이하 이 조에서 “약속”이라 한다)이 시행되고 있는 물품에 대하여 법 제56조제1항에 따른 재심사여부를 결정해야 한다. <개정 2008. 2. 22., 2008. 2. 29., 2020. 12. 29., 2024. 2. 29., 2025. 12. 30.>\n    1. 덤핑방지관세 또는 약속(이하 “덤핑방지조치”라 한다)의 시행 이후 그 조치의 내용변경이 필요하다고 인정할 만한 충분한 상황변동이 발생한 경우\n    2. 덤핑방지조치의 종료로 덤핑 및 국내산업피해가 지속되거나 재발될 우려가 있는 경우\n    3. 실제 덤핑차액보다 덤핑방지관세액이 과다하게 납부된 경우 또는 약속에 따른 가격수정이 과도한 경우\n  ②제1항에 따른 재심사의 요청은 덤핑방지조치의 시행일부터 1년이 경과된 날 이후에 할 수 있으며, 덤핑방지조치의 효력이 상실되는 날 6월 이전에 요청해야 한다. <개정 2008. 2. 29., 2010. 3. 26., 2020. 12. 29., 2024. 2. 29.>\n  ③ 재정경제부장관은 제1항에 따라 재심사를 요청받은 날부터 2개월 이내에 재심사의 필요 여부를 결정해야 하며, 그 결정일부터 10일 이내에 재심사 개시의 결정에 관한 사항을 재심사 요청자, 해당 물품의 공급국 정부 및 공급자, 그 밖의 이해관계인에게 통지하고, 관보에 게재해야 한다. 이 경우 해당 물품의 공급국 정부 및 공급자에게는 제1항에 따른 요청서를 함께 제공해야 한다. <신설 2020. 12. 29., 2025. 12. 30.>\n  ④ 제3항에도 불구하고 재정경제부장관은 이해관계인의 요청에 따라 다음 각 호의 어느 하나에 해당하는 물품과 연계하여 검토할 필요가 있는 등 특별한 사유가 있다고 인정되는 경우에는 1개월의 범위에서 제3항에 따른 재심사 필요 여부 결정기간을 연장할 수 있다. <신설 2026. 2. 27.>\n    1. 제1항에 따라 요청받은 재심사의 대상이 아닌 다른 덤핑방지관세가 부과되는 물품\n    2. 제59조제1항에 따라 덤핑방지관세의 부과가 요청된 물품\n  ⑤재정경제부장관은 제1항의 규정에 의하여 재심사를 하는 경우 외에 시행 중인 덤핑방지조치의 적정성 여부에 관한 재심사를 할 수 있으며, 이를 위하여 덤핑방지조치의 내용(재심사에 따라 변경된 내용을 포함한다)에 관하여 매년 그 시행일이 속하는 달에 덤핑가격에 대한 재검토를 하여야 한다. 이 경우 관세청장은 재검토에 필요한 자료를 작성하여 매년 그 시행일이 속하는 달에 재정경제부장관에게 제출해야 한다. <개정 2008. 2. 29., 2020. 2. 11., 2020. 12. 29., 2024. 2. 29., 2025. 12. 30., 2026. 2. 27.>\n  ⑥재정경제부장관은 제1항 또는 제5항에 따라 재심사의 필요 여부를 결정하는 때에는 관계행정기관의 장 및 무역위원회와 협의할 수 있으며, 재심사가 필요한 것으로 결정된 때에는 무역위원회는 이를 조사해야 한다. 이 경우 무역위원회는 재심사의 사유가 되는 부분에 한정하여 조사할 수 있다. <개정 2008. 2. 29., 2020. 12. 29., 2025. 12. 30., 2026. 2. 27.>\n  ⑦무역위원회는 재심사 개시일부터 6개월 이내에 제6항에 따른 조사를 종결하여 그 결과를 재정경제부장관에게 제출해야 한다. 다만, 무역위원회는 조사기간을 연장할 필요가 있거나 이해관계인이 정당한 사유를 제시하여 조사기간의 연장을 요청하는 때에는 4개월의 범위에서 그 조사기간을 연장할 수 있다. <개정 2008. 2. 29., 2020. 12. 29., 2025. 12. 30., 2026. 2. 27.>\n  ⑧ 재정경제부장관은 제7항에 따른 조사결과가 제출되면 제3항 전단에 따른 관보게재일부터 12개월 이내에 법 제56조제1항에 따른 조치 여부 및 내용을 결정하여 필요한 조치를 해야 한다. <개정 2014. 3. 5., 2020. 12. 29., 2025. 12. 30., 2026. 2. 27.>\n  ⑨ 법 제56조제3항 단서에서 “대통령령으로 정하는 사유”란 제1항제2호에 해당하는 경우를 말한다. <개정 2024. 2. 29., 2026. 2. 27.>\n  ⑩ 법 제56조제3항 단서에 따라 재심사기간 중 덤핑방지관세가 계속 부과된 물품에 대하여 같은 조 제1항에 따라 재정경제부장관이 새로운 덤핑방지관세의 부과 또는 가격수정ㆍ수출중지 등의 약속을 시행하는 때에는 제67조제1항 및 제3항의 예에 따라 정산할 수 있다. <신설 2008. 2. 22., 2008. 2. 29., 2020. 12. 29., 2025. 12. 30., 2026. 2. 27.>\n  ⑪재정경제부장관은 제1항 또는 제5항에 따른 재심사 결과 약속의 실효성이 상실되거나 상실될 우려가 있다고 판단되는 때에는 해당 약속을 이행하고 있는 수출자에게 약속의 수정을 요구할 수 있으며, 해당 수출자가 약속의 수정을 거부하는 때에는 이용가능한 정보를 바탕으로 덤핑방지관세율을 산정하여 덤핑방지관세를 부과할 수 있다. <개정 2008. 2. 22., 2008. 2. 29., 2020. 12. 29., 2024. 2. 29., 2025. 12. 30., 2026. 2. 27.>\n  ⑫ 법 제56조제2항에서 “덤핑방지조치 물품의 수입 및 징수실적 등 대통령령으로 정하는 사항”이란 다음 각 호의 사항을 말한다. <개정 2022. 2. 15., 2025. 12. 30., 2026. 2. 27.>\n    1. 덤핑방지조치 물품의 수입 및 징수실적\n    2. 가격수정ㆍ수출중지 등의 약속 준수 여부\n    3. 그 밖에 재정경제부장관이 덤핑방지관세의 부과와 약속의 재심사를 위하여 조사가 필요하다고 인정하는 사항\n  ⑬ 제1항에 따라 재심사를 요청한 자가 해당 요청을 철회하려는 경우에는 서면으로 그 뜻을 재정경제부장관에게 제출해야 한다. 이 경우 재정경제부장관은 무역위원회 및 관계 행정기관의 장과 협의하여 제3항 전단에 따른 재심사 개시 여부의 결정을 중지하거나 제6항에 따른 조사를 종결하도록 할 수 있다. <신설 2013. 2. 15., 2020. 12. 29., 2025. 12. 30., 2026. 2. 27.>\n  ⑭ 제6항에 따른 조사를 위한 자료협조 요청에 관하여는 제64조를 준용하고, 법 제56조제1항의 재심사 결과에 따른 재정경제부장관의 조치 중 덤핑방지관세의 부과에 관하여는 제65조를, 가격수정ㆍ수출중지 등의 약속에 관하여는 제68조제1항 전단, 제2항, 제3항, 제5항 및 제6항을 준용한다. 이 경우 제68조제1항 전단 중 “제61조제5항의 규정에 의한 본조사의 결과에 따른 최종판정”은 “제70조제6항에 따른 조사의 종결”로, “무역위원회”는 “재정경제부장관”으로 본다. <개정 2010. 3. 26., 2013. 2. 15., 2020. 12. 29., 2025. 12. 30., 2026. 2. 27.>","D98-0":"제98조(품목분류표 등) ①재정경제부장관은 「통일상품명 및 부호체계에 관한 국제협약」(이하 이 절에서 “협약”이라 한다) 제3조제3항에 따라 수출입물품의 신속한 통관, 통계파악 등을 위하여 협약 및 법 별표 관세율표를 기초로 하여 품목을 세분한 관세ㆍ통계통합품목분류표(이하 이 절에서 “품목분류표”라 한다)를 고시할 수 있다. <개정 2006. 5. 22., 2008. 2. 29., 2015. 2. 6., 2019. 2. 12., 2024. 2. 29., 2025. 12. 30.>\n  ② 법 제84조 각 호 외의 부분에서 “「통일상품명 및 부호체계에 관한 국제협약」에 따른 관세협력이사회의 권고 또는 결정 등 대통령령으로 정하는 사유”란 다음 각 호의 어느 하나에 해당하는 경우를 말한다. <개정 2024. 2. 29., 2025. 12. 30.>\n    1. 관세협력이사회로부터 협약의 통일상품명 및 부호체계에 관한 권고 또는 결정이 있은 경우\n    2. 관계 법령이 개정된 경우\n    3. 그 밖에 제1호 및 제2호와 유사한 경우로서 법 제84조 각 호에 따른 품목을 수정(품목을 신설 또는 삭제하거나 다시 분류하는 것을 말한다. 이하 이 조에서 같다)할 필요가 있다고 재정경제부장관이 인정하는 경우\n  ③ 법 제84조제2호에서 “대통령령으로 정한 품목분류”란 「세계무역기구협정 등에 의한 양허관세규정」 별표 1부터 별표 4까지, 「특정국가와의 관세협상에 따른 국제협력관세의 적용에 관한 규정」 별표 및 「최빈개발도상국에 대한 특혜관세 공여규정」 별표 2에 따른 품목분류를 말한다. <개정 2024. 2. 29.>\n  ④ 재정경제부장관은 법 제84조에 따라 같은 조 각 호에 따른 품목을 수정한 경우에는 이를 고시해야 한다. <신설 2024. 2. 29., 2025. 12. 30.>\n  ⑤ 재정경제부장관은 제2항제1호의 사유로 법 제84조제1호 및 제3호에 따른 품목을 수정하는 경우에는 협약 제16조제4항에 따른 기한 내에 수정해야 한다. <신설 2024. 2. 29., 2025. 12. 30.>","D99-0":"제99조(품목분류의 적용기준) ① 법 제85조제1항에 따른 품목분류의 적용기준은 재정경제부령으로 정한다. <개정 2025. 12. 30.>\n  ② 재정경제부장관은 관세협력이사회가 협약에 따라 권고한 통일상품명 및 부호체계의 품목분류에 관한 사항을 관세청장으로 하여금 고시하게 할 수 있다. 이 경우 관세청장은 고시할 때 재정경제부장관의 승인을 받아야 한다. <개정 2025. 12. 30.>\n  [전문개정 2015. 2. 6.]","L199-2":"제199조의2(종합보세구역의 판매물품에 대한 관세 등의 환급) ① 외국인 관광객 등 대통령령으로 정하는 자가 종합보세구역에서 구입한 물품을 국외로 반출하는 경우에는 해당 물품을 구입할 때 납부한 관세 및 내국세등을 환급받을 수 있다.\n  ② 제1항에 따른 관세 및 내국세등의 환급 절차 및 방법 등에 관하여 필요한 사항은 대통령령으로 정한다.\n  [전문개정 2010. 12. 30.]","R80-2":"제80조의2(명예세관원의 자격요건 등) ① 법 제268조에 따른 명예세관원은 다음 각 호의 어느 하나에 해당하는 사람 중에서 위촉한다\n    1. 수출입물품과 같은 종류의 물품을 생산ㆍ유통ㆍ보관 및 판매하는 등의 업무에 종사하는 사람 및 관련단체의 임직원\n    2. 소비자 관련단체의 임직원\n    3. 관세행정 발전에 기여한 공로가 있는 사람\n    4. 수출입물품의 유통에 관심이 있고 명예세관원의 임무를 성실히 수행할 수 있는 사람\n  ② 명예세관원의 임무는 다음 각 호와 같다.\n    1. 세관의 조사ㆍ감시 등 관세행정과 관련한 정보제공\n    2. 밀수방지 등을 위한 홍보 활동 지원 및 개선 건의\n    3. 세관직원을 보조하여 공항, 항만 또는 유통단계의 감시 등 밀수단속 활동 지원\n    4. 세관직원을 보조하여 원산지 표시 위반, 지식재산권 침해 등에 대한 단속 활동 지원\n  ③ 관세청장은 필요한 경우 명예세관원에게 활동경비 등을 지급할 수 있다.\n  ④ 명예세관원의 위촉ㆍ해촉, 그 밖에 필요한 사항은 관세청장이 정한다.\n  [본조신설 2012. 2. 28.]","D17-2":"제17조의2(구매수수료의 범위 등) ① 법 제30조제1항제1호 단서에 따른 구매수수료(이하 “구매수수료”라 한다)는 해당 수입물품의 구매와 관련하여 외국에서 구매자를 대리하여 행하는 용역의 대가로서 구매자가 구매대리인에게 지급하는 비용으로 한다.\n  ② 구매자가 구매대리인에게 지급한 비용에 구매수수료 외의 비용이 포함된 경우에는 그 지급한 비용 중 구매수수료에 해당하는 금액이 따로 구분하여 산정될 수 있는 경우에만 해당 금액을 구매수수료로 한다.\n  ③ 세관장은 필요하다고 인정하는 경우 구매수수료에 관한 자료의 제출을 구매자에게 요청할 수 있다.\n  [본조신설 2011. 4. 1.]","R83-0":"제83조(세관설비사용료) ①법 제323조의 규정에 의하여 납부하여야 하는 세관설비사용료는 기본사용료 1만2천원에 다음 각호의 구분에 의한 금액을 합한 금액으로 한다. <개정 2010. 3. 30.>\n    1. 토지 : 분기마다 1제곱미터당 780원\n    2. 건물 : 분기마다 1제곱미터당 1,560원\n  ②세관장은 토지의 상황 기타의 사정에 의하여 필요하다고 인정하는 때에는 관세청장의 승인을 얻어 제1항의 규정에 의한 세관설비사용료를 경감할 수 있다.\n  ③제68조제3항 내지 제5항의 규정은 제1항의 규정에 의한 세관설비사용료에 관하여 이를 준용한다.","D61-0":"제61조(덤핑 및 실질적 피해등의 조사) ①법 제52조의 규정에 의한 덤핑사실 및 실질적 피해등의 사실에 관한 조사는 무역위원회가 담당한다. 이 경우 무역위원회는 필요하다고 인정하는 때에는 관계행정기관의 공무원 또는 관계전문가로 하여금 조사활동에 참여하도록 할 수 있다.\n  ②무역위원회는 제60조제3항 전단에 따라 조사개시의 결정에 관한 사항이 관보에 게재된 날부터 3월 이내에 덤핑사실 및 그로 인한 실질적 피해등의 사실이 있다고 추정되는 충분한 증거가 있는지에 관한 예비조사를 하여 그 결과를 재정경제부장관에게 제출해야 한다. <개정 2008. 2. 29., 2020. 12. 29., 2025. 12. 30.>\n  ③재정경제부장관은 제2항에 따른 예비조사결과가 제출된 날부터 1개월 이내에 법 제53조제1항에 따른 조치의 필요 여부 및 내용에 관한 사항을 결정해야 한다. 다만, 필요하다고 인정되는 경우에는 1개월의 범위내에서 그 결정기간을 연장할 수 있다. <개정 2008. 2. 29., 2025. 12. 30., 2026. 2. 27.>\n  ④무역위원회는 제2항의 규정에 의한 예비조사에 따른 덤핑차액 또는 덤핑물품의 수입량이 재정경제부령이 정하는 기준에 미달하거나 실질적 피해등이 경미한 것으로 인정되는 때에는 제5항의 규정에 의한 본조사를 종결하여야 한다. 이 경우 무역위원회는 재정경제부장관에게 본조사 종결에 관한 사항을 통보해야 하며, 재정경제부장관은 이를 관보에 게재해야 한다. <개정 2008. 2. 29., 2010. 3. 26., 2024. 2. 29., 2025. 12. 30.>\n  ⑤무역위원회는 재정경제부령이 정하는 특별한 사유가 없는 한 제2항의 규정에 의한 예비조사결과를 제출한 날의 다음날부터 본조사를 개시하여야 하며, 본조사개시일부터 3월 이내에 본조사결과를 재정경제부장관에게 제출하여야 한다. <개정 2008. 2. 29., 2025. 12. 30.>\n  ⑥무역위원회는 제2항 및 제5항의 규정에 의한 조사와 관련하여 조사기간을 연장할 필요가 있거나 이해관계인이 정당한 사유를 제시하여 조사기간의 연장을 요청하는 때에는 2월의 범위내에서 그 조사기간을 연장할 수 있다.\n  ⑦재정경제부장관은 제5항에 따른 본조사 결과가 접수되면 제60조제3항 전단에 따른 관보게재일부터 12개월 이내에 덤핑방지관세의 부과여부 및 내용을 결정하여 법 제51조에 따른 덤핑방지관세의 부과조치를 해야 한다. 다만, 특별한 사유가 있다고 인정되는 경우에는 관보게재일부터 18개월 이내에 덤핑방지관세의 부과조치를 할 수 있다. <개정 2008. 2. 29., 2010. 3. 26., 2014. 3. 5., 2020. 12. 29., 2025. 12. 30.>\n  ⑧ 제6항에도 불구하고 재정경제부장관은 제7항 단서에 따라 18개월 이내에 덤핑방지관세의 부과조치를 할 특별한 사유가 있다고 인정하는 경우 무역위원회와 협의하여 제6항에 따른 본조사 기간을 2개월의 범위에서 추가로 연장하게 할 수 있다. <신설 2020. 12. 29., 2024. 2. 29., 2025. 12. 30.>\n  ⑨무역위원회는 제2항 및 제5항에 따라 조사결과를 제출하는 경우 필요하다고 인정되는 때에는 재정경제부장관에게 다음 각 호의 사항을 건의할 수 있다. <개정 2008. 2. 29., 2017. 3. 27., 2025. 12. 30.>\n    1. 법 제51조의 규정에 의한 덤핑방지관세부과\n    2. 법 제53조제1항의 규정에 의한 잠정조치\n    3. 법 제54조제1항에 따른 약속의 제의 또는 수락\n  ⑩ 제1항부터 제9항까지에서 규정한 사항 외에 덤핑방지관세부과 신청ㆍ조사ㆍ판정 절차에 관하여 필요한 사항은 무역위원회가 재정경제부장관과 협의하여 고시한다. <신설 2010. 3. 26., 2020. 12. 29., 2025. 12. 30.>","D32-3":"제32조의3(세액의 정정) 법 제38조제5항의 규정에 의하여 세액을 정정하고자 하는 자는 당해 납세신고와 관련된 서류를 세관장으로부터 교부받아 과세표준 및 세액 등을 정정하고, 그 정정한 부분에 서명 또는 날인하여 세관장에게 제출하여야 한다. <개정 2025. 2. 28.>\n  [본조신설 2004. 3. 29.]","L59-0":"제59조(상계관세를 부과하기 전의 잠정조치) ① 재정경제부장관은 상계관세의 부과 여부를 결정하기 위하여 조사가 시작된 물품이 보조금등을 받아 수입되어 다음 각 호의 어느 하나에 해당한다고 인정되는 경우에는 대통령령으로 정하는 바에 따라 국내산업의 보호를 위하여 조사가 종결되기 전이라도 그 물품의 수출자 또는 수출국 및 기간을 정하여 보조금등의 추정액에 상당하는 금액 이하의 잠정상계관세를 부과하도록 명하거나 담보를 제공하도록 명하는 조치(이하 이 관에서 “잠정조치”라 한다)를 할 수 있다. <개정 2025. 10. 1.>\n    1. 국내산업에 실질적 피해등이 발생한 사실이 있다고 추정되는 충분한 증거가 있음이 확인되는 경우\n    2. 제60조에 따른 약속을 철회하거나 위반한 경우와 그 약속의 이행에 관한 자료를 제출하지 아니한 경우로서 이용할 수 있는 최선의 정보가 있는 경우\n  ② 잠정조치가 취하여진 물품에 대하여 상계관세의 부과요청이 철회되어 조사가 종결되거나 상계관세의 부과 여부가 결정된 경우 또는 제60조에 따른 약속이 수락된 경우에는 대통령령으로 정하는 바에 따라 납부된 잠정상계관세를 환급하거나 제공된 담보를 해제하여야 한다. 다만, 다음 각 호의 어느 하나에 해당하는 경우 상계관세액이 잠정상계관세액 또는 제공된 담보금액을 초과할 때에는 그 차액을 징수하지 아니하며, 상계관세액이 잠정상계관세액 또는 제공된 담보금액에 미달될 때에는 그 차액을 환급하거나 차액에 해당하는 담보를 해제하여야 한다.<개정 2023. 12. 31.>\n    1. 보조금등의 지급과 그로 인한 산업피해를 조사한 결과 해당 물품에 대한 보조금등의 지급과 그로 인한 실질적 피해등의 사실이 있다고 판정된 이후에 제60조에 따른 약속이 수락된 경우\n    2. 제61조 단서에 따라 상계관세를 소급하여 부과하는 경우\n  [전문개정 2010. 12. 30.]","L254-0":"제254조(전자상거래물품의 특별통관 등) ① 전자상거래물품 중 대통령령으로 정하는 물품에 대하여는 대통령령으로 정하는 바에 따라 수출입신고ㆍ물품검사 등 통관에 필요한 사항을 생략하거나 간소한 방법으로 적용할 수 있다.\n  ② 다음 각 호의 자(국내에 주소 또는 영업소가 없는 자를 포함하며, 이하 “전자상거래업자등”이라 한다)는 제1항에 따라 통관에 필요한 사항을 생략하거나 간소한 방법으로 적용받으려는 경우에는 대통령령으로 정하는 바에 따라 관세청장 또는 세관장에게 등록하여야 한다.\n    1. 「전자상거래 등에서의 소비자보호에 관한 법률」에 따른 통신판매업자\n    2. 「전자상거래 등에서의 소비자보호에 관한 법률」에 따른 통신판매중개를 하는 자\n    3. 화주의 위임을 받아 국외에서 전자상거래물품을 수령하여 배송을 대행하는 자\n  ③ 관세청장은 관세의 부과ㆍ징수 및 통관을 위하여 필요한 경우 제2항에 따라 등록한 전자상거래업자등에게 전자상거래물품의 주문ㆍ결제 등과 관련된 거래정보로서 대통령령으로 정하는 정보를 수입 전에 제공하여 줄 것을 요청할 수 있다.\n  ④ 제3항에 따라 요청받은 정보의 제공 방법ㆍ절차 등 정보의 제공에 필요한 사항은 대통령령으로 정한다.\n  ⑤ 관세청장은 납세자의 권리 보호를 위하여 화주에게 전자상거래물품의 통관 및 납세와 관련된 사항으로서 대통령령으로 정하는 사항을 안내할 수 있다.\n  ⑥ 제1항은 다음 각 호의 구분에 따른 규정에 우선하여 적용한다.\n    1. 수출입신고에 관한 사항의 경우: 제254조의2제1항 및 제258조제2항\n    2. 물품검사에 관한 사항의 경우: 제254조의2제5항, 제256조의2제3항 및 제257조\n  ⑦ 제2항에 따른 등록의 유효기간은 3년으로 하며, 대통령령으로 정하는 바에 따라 갱신할 수 있다.\n  ⑧ 다음 각 호의 어느 하나에 해당하면 제2항에 따른 등록은 그 효력을 상실한다.\n    1. 전자상거래업자등이 폐업한 경우\n    2. 전자상거래업자등이 사망한 경우(법인인 경우에는 해산된 경우)\n    3. 제7항에 따른 등록의 유효기간이 만료된 경우\n  [전문개정 2024. 12. 31.]","L37-4":"제37조의4(특수관계자의 수입물품 과세가격결정자료등 제출) ① 세관장은 관세조사 및 제38조제2항에 따른 세액심사 시 특수관계에 있는 자가 수입하는 물품의 과세가격의 적정성을 심사하기 위하여 해당 특수관계자에게 과세가격결정자료(전산화된 자료를 포함한다)를 제출할 것을 요구할 수 있다. 이 경우 자료의 제출범위, 제출방법 등은 대통령령으로 정한다. <개정 2013. 8. 13., 2022. 12. 31., 2023. 12. 31.>\n  ② 세관장은 제1항에 따라 제출받은 과세가격결정자료에서 제30조제1항 각 호의 어느 하나에 해당하는 금액이 이에 해당하지 아니하는 금액과 합산되어 있는지 불분명한 경우에는 이를 구분하여 계산할 수 있는 객관적인 증명자료(전산화된 자료를 포함한다)의 제출을 요구할 수 있다.<신설 2016. 12. 20., 2022. 12. 31.>\n  ③ 제1항에 따른 과세가격결정자료 또는 제2항에 따른 증명자료(이하 “과세가격결정자료등”이라 한다)의 제출을 요구받은 자는 자료제출을 요구받은 날부터 60일 이내에 해당 자료를 제출하여야 한다. 다만, 대통령령으로 정하는 부득이한 사유로 제출기한의 연장을 신청하는 경우에는 세관장은 한 차례만 60일까지 연장할 수 있다.<개정 2016. 12. 20., 2022. 12. 31.>\n  ④ 세관장은 특수관계에 있는 자가 다음 각 호의 어느 하나에 해당하는 경우에는 제31조부터 제35조까지의 규정에 따른 방법으로 과세가격을 결정할 수 있다. 이 경우 세관장은 과세가격을 결정하기 전에 특수관계에 있는 자와 대통령령으로 정하는 바에 따라 협의를 하여야 하며 의견을 제시할 기회를 주어야 한다.<신설 2016. 12. 20., 2018. 12. 31., 2022. 12. 31.>\n    1. 과세가격결정자료등을 제3항에 따른 기한까지 제출하지 아니하는 경우\n    2. 과세가격결정자료등을 거짓으로 제출하는 경우\n  ⑤ 제4항에도 불구하고 세관장은 특수관계에 있는 자가 제30조제3항제4호 단서에 해당하는 경우임을 증명하는 경우에는 같은 조 제1항 및 제2항에 따라 과세가격을 결정하여야 한다.<신설 2018. 12. 31.>\n  ⑥ 세관장은 과세가격결정자료등의 제출을 요구받은 자가 제277조제1항에 따라 과태료를 부과받고도 자료를 제출하지 아니하거나 거짓의 자료를 시정하여 제출하지 아니하는 경우에는 미제출된 자료를 제출하도록 요구하거나 거짓의 자료를 시정하여 제출하도록 요구할 수 있다.<신설 2021. 12. 21., 2022. 12. 31.>\n  ⑦ 제6항에 따라 자료제출을 요구받은 자는 그 요구를 받은 날부터 30일 이내에 그 요구에 따른 자료를 제출하여야 한다.<신설 2021. 12. 21.>\n  [본조신설 2013. 1. 1.]\n  [제목개정 2022. 12. 31.]\n  [제37조의3에서 이동 <2014. 12. 23.>]","D243-2":"제243조의2(탁송품 등의 상표권 보호 절차 간소화) ① 법 제235조제3항 각 호의 물품이 법 제235조의2 각 호의 사유에 모두 해당하는 경우 세관장은 법 제235조제1항제1호에 따른 상표권(이하 “상표권”이라 한다)의 권리자(이하 “상표권자”라 한다)와 수출입신고등을 한 자 또는 우편물의 화주에게 해당 물품의 상표권 침해 인정 사항을 통보할 수 있다.\n  ② 제1항에 따른 통보를 받은 상표권자는 세관장에게 해당 물품의 통관보류등을 요청할 수 있다. 이 경우 상표권자는 해당 물품의 상표권 침해사실을 입증하는 자료를 관세청장이 정하여 고시하는 기간 내에 제출해야 한다.\n  ③ 제1항에 따른 통보를 받은 수출입신고등을 한 자 또는 우편물의 화주는 해당 물품이 상표권을 침해하지 않았음을 입증하는 자료를 관세청장이 정하여 고시하는 기간 내에 세관장에게 제출할 수 있다.\n  ④ 세관장은 제2항 후단 및 제3항에 따라 제출된 자료를 근거로 관세청장이 정하여 고시하는 기간 내에 해당 물품에 대한 통관보류등의 여부를 결정한다.\n  ⑤ 제4항에도 불구하고 상표권자가 제2항 후단에 따른 자료를 제출하지 않은 경우에는 세관장은 해당 물품의 통관을 허용할 수 있고, 수출입신고등을 한 자 또는 우편물의 화주가 제3항에 따른 자료를 제출하지 않은 경우에는 제2항 후단에 따라 제출된 자료에 근거하여 해당 물품에 대한 통관보류등의 여부를 결정할 수 있다.\n  ⑥ 세관장은 제4항 및 제5항에 따라 통관보류등의 여부를 결정하거나 통관을 허용한 때에는 즉시 상표권자와 수출입신고등을 한 자 또는 우편물의 화주에게 각각 그 사실을 통보해야 한다.\n  ⑦ 제1항부터 제6항까지에서 규정한 사항 외에 법 제235조의2에 따른 탁송품 등의 상표권 보호에 필요한 사항은 관세청장이 정하여 고시한다.\n  [본조신설 2026. 2. 27.]","R7-5":"제7조의5(중고물품의 과세가격의 결정) ① 영 제29조제3항제4호에 따른 중고물품의 과세가격은 다음 각 호의 가격을 기초로 하여 결정할 수 있다.\n    1. 관련 법령에 따른 감정기관의 감정가격\n    2. 국내도매가격에 제7조의3제1항제3호의 시가역산율을 적용하여 산출한 가격\n    3. 해외로부터 수입되어 국내에서 거래되는 신품 또는 중고물품의 수입당시의 과세가격을 기초로 하여 가치감소분을 공제한 가격. 다만, 내용연수가 경과된 물품의 경우는 제외한다.\n    4. 그 밖에 세관장이 타당하다고 인정하는 합리적인 가격\n  ② 제1항제3호의 가치감소 산정기준은 관세청장이 정할 수 있다.\n  [본조신설 2020. 10. 7.]","R85-2":"제85조의2(전자문서중계사업자의 지정취소 및 업무정지 기준) 법 제327조의3제3항에 따른 전자문서중계사업자의 지정취소 및 업무정지 처분의 세부기준은 별표 8과 같다.\n  [본조신설 2024. 3. 22.]","D131-0":"제131조(담보제공의 신고 등) ①법 제108조제1항의 규정에 의한 담보의 제공여부는 물품의 성질 및 종류, 관세채권의 확보가능성 등을 기준으로 하여 정하되, 다음 각 호의 어느 하나에 해당하는 경우에 한하여야 한다. <개정 2007. 4. 5.>\n    1. 법 제97조 또는 법 제98조의 규정에 의하여 관세를 감면받은 경우\n    2. 법 제107조의 규정에 의하여 분할납부승인을 받은 경우\n  ②법 제108조제1항에 따라 세관장은 수입신고를 수리하는 때까지 담보를 제공하게 할 수 있다. 다만, 긴급한 사유로 법 제8조제3항 각 호에 해당하는 날 등 금융기관이 업무를 수행할 수 없는 날에 수입하는 물품으로서 긴급성의 정도 등을 고려하여 관세청장이 정하여 고시하는 물품에 대하여는 수입신고를 수리하는 때 이후 최초로 금융기관이 업무를 수행하는 날까지 담보를 제공하게 할 수 있다. <신설 2007. 4. 5., 2023. 2. 28.>","L88-0":"제88조(외교관용 물품 등의 면세) ① 다음 각 호의 어느 하나에 해당하는 물품이 수입될 때에는 그 관세를 면제한다.\n  <개정 2025. 10. 1.>\n    1. 우리나라에 있는 외국의 대사관ㆍ공사관 및 그 밖에 이에 준하는 기관의 업무용품\n    2. 우리나라에 주재하는 외국의 대사ㆍ공사 및 그 밖에 이에 준하는 사절과 그 가족이 사용하는 물품\n    3. 우리나라에 있는 외국의 영사관 및 그 밖에 이에 준하는 기관의 업무용품\n    4. 우리나라에 있는 외국의 대사관ㆍ공사관ㆍ영사관 및 그 밖에 이에 준하는 기관의 직원 중 대통령령으로 정하는 직원과 그 가족이 사용하는 물품\n    5. 정부와 체결한 사업계약을 수행하기 위하여 외국계약자가 계약조건에 따라 수입하는 업무용품\n    6. 국제기구 또는 외국 정부로부터 우리나라 정부에 파견된 고문관ㆍ기술단원 및 그 밖에 재정경제부령으로 정하는 자가 사용하는 물품\n  ② 제1항에 따라 관세를 면제받은 물품 중 재정경제부령으로 정하는 물품은 수입신고 수리일부터 3년의 범위에서 대통령령으로 정하는 기준에 따라 관세청장이 정하는 기간에 제1항의 용도 외의 다른 용도로 사용하기 위하여 양수할 수 없다. 다만, 대통령령으로 정하는 바에 따라 미리 세관장의 승인을 받았을 때에는 그러하지 아니하다.<개정 2025. 10. 1.>\n  ③ 제2항에 따라 재정경제부령으로 정하는 물품을 제2항에 따른 기간에 제1항에 따른 용도 외의 다른 용도로 사용하기 위하여 양수한 경우에는 그 양수자로부터 면제된 관세를 즉시 징수한다.<개정 2025. 10. 1.>\n  [전문개정 2010. 12. 30.]","D216-0":"제216조(종합보세구역에의 물품 반ㆍ출입절차 등) 법 제199조제1항의 규정에 의한 종합보세구역에의 물품반출입신고에 관하여는 제176조의 규정을 준용한다.","R43-0":"제43조(관세가 면제되는 특정물품) ① 법 제93조제1호에 따라 관세를 면제하는 물품은 사료작물 재배용 종자(호밀ㆍ귀리 및 수수에 한한다)로 한다. <개정 2007. 5. 29.>\n  ② 법 제93조제2호에 따라 관세를 면제하는 물품은 다음 각 호의 어느 하나에 해당하는 물품으로 한다. <개정 2010. 3. 30., 2011. 6. 7., 2012. 2. 28., 2013. 2. 23., 2014. 3. 14., 2015. 7. 16., 2015. 12. 1., 2017. 3. 31., 2018. 3. 21., 2022. 3. 18., 2023. 3. 20.>\n    1. 「포뮬러원 국제자동차경주대회 지원법」에 따른 포뮬러원 국제자동차경주대회에 참가하는 자가 해당 대회와 관련하여 사용할 목적으로 수입하는 물품으로서 같은 법 제4조에 따른 포뮬러원국제자동차경주
