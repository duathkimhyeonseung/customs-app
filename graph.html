대회조직위원회가 확인하는 물품\n    2. 「2023 새만금 세계스카우트잼버리 지원 특별법」에 따른 2023 새만금 세계스카우트잼버리에 참가하는 세계스카우트연맹, 각국 스카우트연맹이 그 소속 대원ㆍ지도자ㆍ운영요원 등 구성원이나 다른 참가단체의 소속 대원ㆍ지도자ㆍ운영요원 등 구성원 또는 같은 법 제5조제1항에 따라 설립된 2023 새만금 세계스카우트잼버리조직위원회에 제공하는 등 해당 행사와 관련하여 사용할 목적으로 수입하는 물품으로서 2023 새만금 세계스카우트잼버리조직위원회가 확인하는 물품\n    3. 「국제경기대회 지원법」 제2조제1호가목에 따른 올림픽대회 중 2024년에 강원도에서 개최되는 15세 이상 18세 이하 선수들이 활동하는 대회(이하 이 호에서 “2024 강원동계청소년올림픽”이라 한다)와 관련하여 사용할 목적으로 수입하는 물품으로서 다음 각 목의 어느 하나에 해당하는 물품\n      가. 2024 강원동계청소년올림픽에 참가하는 국제올림픽위원회, 국제경기연맹, 각국 올림픽위원회가 그 소속 직원ㆍ선수 등 구성원, 다른 참가단체의 소속 직원ㆍ선수 등 구성원 또는 「국제경기대회 지원법」 제9조에 따라 설립된 2024 강원동계청소년올림픽대회 조직위원회(이하 이 호에서 “조직위원회”라 한다)에 제공하는 등 해당 대회와 관련하여 사용할 목적으로 수입하는 물품으로서 조직위원회가 확인하는 물품\n      나. 국제올림픽위원회가 지정한 주관방송사 및 방송권자가 2024 강원동계청소년올림픽에서 사용할 목적으로 수입하는 방송용 기자재로서 조직위원회가 확인하는 물품\n      다. 국제올림픽위원회가 지정한 후원업체가 2024 강원동계청소년올림픽과 관련하여 사용할 목적으로 수입하여 조직위원회에 제공하는 물품으로서 조직위원회가 확인하는 물품\n    4. 삭제 <2022. 3. 18.>\n    5. 삭제 <2022. 3. 18.>\n    6. 삭제 <2022. 3. 18.>\n    7. 삭제 <2015. 12. 1.>\n    8. 삭제 <2015. 12. 1.>\n  ③ 제2항에 따라 관세가 면제되는 물품 중 해당 행사 외의 다른 용도로 사용하거나 양도하는 물품에 대해서는 관세를 면제하지 아니한다. 다만, 해당 행사 종료 후 다음 각 호의 어느 하나에 해당하는 자에 무상으로 양도하는 물품은 관세를 면제한다. <개정 2014. 3. 14.>\n    1. 국가\n    2. 지방자치단체\n    3. 「국민체육진흥법」 제2조제11호에 따른 경기단체\n    4. 해당 행사의 조직위원회(해당 행사의 조직위원회가 해산된 후 해당 행사와 관련된 사업 및 자산을 관리하기 위한 법인이 설립된 경우에는 그 법인을 말한다)\n  ④법 제93조제3호에 따라 관세가 면제되는 물품은 다음 각 호와 같다. <개정 2002. 5. 10., 2011. 4. 1.>\n    1. 방사선측정기\n    2. 시료채취 및 처리기\n    3. 시료분석장비\n    4. 방사능 방호장비\n    5. 제염용장비\n  ⑤법 제93조제5호에서 “재정경제부령으로 정하는 방법”이란 「원양산업발전법」 제6조에 따라 해양수산부장관으로부터 원양모선식 어업허가를 받고 외국과의 협상 등에 의하여 해외수역에서 해당 외국의 국적을 가진 자선과 공동으로 수산물을 채집 또는 포획하는 원양어업방법을 말한다. <개정 2002. 5. 10., 2005. 12. 30., 2008. 12. 31., 2011. 4. 1., 2013. 3. 23., 2026. 1. 2.>\n  ⑥ 법 제93조제6호에서 “재정경제부령으로 정하는 요건”이란 다음 각 호의 요건을 모두 갖춘 경우를 말한다. <개정 2021. 12. 13., 2026. 1. 2.>\n    1. 「원양산업발전법」 제6조제7항에 따라 해외현지법인으로 원양어업을 하기 위하여 신고한 경우로서 해외현지법인이 다음 각 목의 어느 하나에 해당할 것\n      가. 대한민국 국민이 납입한 자본금이나 보유한 의결권이 49퍼센트 이상일 것\n      나. 해외현지법인이 설립된 국가의 법령에 따라 대한민국 국민이 보유할 수 있는 지분이 25퍼센트 미만으로 제한되는 경우에는 대한민국 국민이 납입한 자본금이나 보유한 의결권이 24퍼센트 이상일 것\n    2. 「원양산업발전법」 제2조제10호에 따른 해외수역에서 해양수산부장관이 재정경제부장관과 협의하여 고시한 선박ㆍ어구 등의 생산수단을 투입하여 수산동식물을 채집 또는 포획(어획할당량 제한으로 불가피하게 해외현지법인이 직접 수산동식물을 채집 또는 포획하지 못하게 되었을 때에는 생산수단을 실질적으로 운영하고 소요경비를 전액 부담하는 등 해외현지법인의 계산과 책임으로 합작상대국 어업자를 통하여 수산동식물을 채집 또는 포획하는 경우를 포함한다)하고 직접 수출할 것\n  ⑦법 제93조제7호에서 “재정경제부령으로 정하는 물품”이란 우리나라 선박 등에 의하여 채집 또는 포획된 수산물과 제5항 및 제6항에 따른 방법 또는 요건에 따라 채집 또는 포획된 수산물을 포장한 관세율표 번호 제4819호의 골판지 어상자를 말한다. <개정 2002. 5. 10., 2004. 3. 30., 2008. 12. 31., 2011. 4. 1., 2026. 1. 2.>\n  ⑧ 법 제93조제8호에서 “재정경제부령으로 정하는 요건에 적합한 물품”이란 법 제93조제8호에 따른 해당 중소기업에 외국인이 무상으로 공급하는 물품을 말한다. <개정 2008. 12. 31., 2011. 4. 1., 2026. 1. 2.>\n  ⑨법 제93조제12호에 따라 관세가 면제되는 증표는 다음 각 호와 같다. <개정 2002. 5. 10., 2011. 4. 1., 2021. 3. 16.>\n    1. 캐나다 공인검사기관에서 발행하는 시ㆍ에스ㆍ에이(C.S.A)증표\n    2. 호주 공인검사기관에서 발행하는 에스ㆍ에이ㆍ에이(S.A.A)증표\n    3. 독일 공인검사기관에서 발행하는 브이ㆍ디ㆍ이(V.D.E)증표\n    4. 영국 공인검사기관에서 발행하는 비ㆍ에스ㆍ아이(B.S.I)증표\n    5. 불란서 공인검사기관에서 발행하는 엘ㆍ시ㆍ아이ㆍ이(L.C.I.E)증표\n    6. 미국 공인검사기관에서 발행하는 유ㆍ엘(U.L)증표\n    7. 유럽경제위원회 공인검사기관에서 발행하는 이ㆍ시ㆍ이(E.C.E)증표\n    8. 유럽공동시장 공인검사기관에서 발행하는 이ㆍ이ㆍ시(E.E.C)증표\n    9. 유럽공동체 공인검사기관에서 발행하는 이ㆍ시(E.C)증표\n  ⑩법 제93조제15호에 따라 관세가 면제되는 물품은 「국민체육진흥법」에 따라 설립된 대한체육회 또는 대한장애인체육회가 수입하는 물품으로 한다. <개정 2002. 5. 10., 2005. 2. 11., 2008. 12. 31., 2011. 4. 1.>\n  ⑪ 법 제93조제18호에 따라 관세가 면제되는 물품은 「개별소비세법 시행령」 별표 1 제3호가목1)가)에 따른 보석의 원석 및 나석으로 한다. <신설 2020. 3. 13.>\n  ⑫ 법 제93조제19호에서 “재정경제부령으로 정하는 것”이란 산업통상부장관이 재정경제부장관과 협의를 거쳐 고시한 자원으로서 「해외자원개발 사업법」 제2조제5호에 따른 해외자원개발사업자(이하 이 항 및 제44조제7항에서 “해외자원개발사업자”라 한다)가 같은 법 제3조제1호에 따른 해외자원개발의 방법(이하 제44조제7항에서 “해외자원개발방법”이라 한다)을 통해 생산한 자원 중 연간 누적 수입량이 다음 각 호의 물량 합계 이내인 것을 말한다. <신설 2026. 3. 20.>\n    1. 개발 대상 광구의 연간 생산량 중 해외자원개발사업자가 취득한 지분 비율(「해외자원개발 사업법 시행령」 제5조제2항제2호에 따른 투자 비율 중 해당 해외자원개발사업자가 해당 광구의 조사 및 개발에 관한 권리를 취득한 부분을 말한다)만큼의 물량\n    2. 개발 대상 광구의 연간 생산량 중 제1호에 따른 물량 외에 해외자원개발사업자가 처분권을 확보한 물량(제1호에 따른 물량의 2배 이내로 한정한다)","D169-0":"제169조(국경출입차량의 도착보고 등) ①법 제149조제1항의 규정에 의한 도착보고서에는 다음 각호의 사항을 기재하여야 한다.\n    1. 차량의 회사명ㆍ국적ㆍ종류ㆍ등록기호ㆍ번호ㆍ총화차수ㆍ총객차수\n    2. 차량의 최초출발지ㆍ경유지ㆍ최종출발지ㆍ도착일시ㆍ출발예정일시 및 목적지\n    3. 적재물품의 내용ㆍ개수 및 중량\n    4. 여객 및 승무원수와 통과여객의 수\n  ②법 제149조제1항의 규정에 의한 차량용품목록ㆍ여객명부ㆍ승무원명부 및 승무원휴대품목록에 관하여는 제157조제2항 내지 제5항의 규정을 준용한다.\n  ③법 제149조제3항 본문에서 “대통령령으로 정하는 물품”이란 다음 각 호의 어느 하나에 해당하는 것을 말한다. <신설 2007. 4. 5., 2011. 4. 1.>\n    1. 모래ㆍ자갈 등 골재\n    2. 석탄ㆍ흑연 등 광물","L27-0":"제27조(가격신고) ① 관세의 납세의무자는 수입신고를 할 때 대통령령으로 정하는 바에 따라 세관장에게 해당 물품의 가격에 대한 신고(이하 “가격신고”라 한다)를 하여야 한다. 다만, 통관의 능률을 높이기 위하여 필요하다고 인정되는 경우에는 대통령령으로 정하는 바에 따라 물품의 수입신고를 하기 전에 가격신고를 할 수 있다.\n  ② 가격신고를 할 때에는 대통령령으로 정하는 바에 따라 과세가격의 결정과 관계되는 자료(이하 “과세가격결정자료”라 한다)를 제출하여야 한다.<개정 2013. 8. 13., 2020. 6. 9.>\n  ③ 과세가격을 결정하기가 곤란하지 아니하다고 인정하여 재정경제부령으로 정하는 물품에 대하여는 가격신고를 생략할 수 있다.<개정 2025. 10. 1.>\n  [전문개정 2010. 12. 30.]","D185-3":"제185조의3(보세사징계위원회의 구성 등) ① 법 제165조의5에 따라 보세사의 징계에 관한 사항을 심의ㆍ의결하기 위하여 세관에 보세사징계위원회를 둔다. <개정 2021. 2. 17.>\n  ② 보세사징계위원회는 위원장 1명을 포함하여 5명 이상 10명 이하의 위원으로 구성한다.\n  ③ 보세사징계위원회의 위원장은 세관장 또는 해당 세관 소속 4급 이상 공무원으로서 세관장이 지명하는 사람이 되고, 위원은 다음 각 호의 사람 중에서 세관장이 임명 또는 위촉하는 사람으로 구성한다.\n    1. 소속 세관공무원\n    2. 제288조제7항에 따라 관세청장이 지정하여 고시하는 법인의 임원\n    3. 관세 또는 물류 전문가로서 제2호에 따른 법인의 대표자가 추천하는 사람\n  ④ 제3항제2호 및 제3호에 해당하는 위원의 임기는 2년으로 하되, 한 번만 연임할 수 있다. 다만, 보궐위원의 임기는 전임위원 임기의 남은 기간으로 한다.\n  ⑤ 세관장은 보세사징계위원회의 위원이 다음 각 호의 어느 하나에 해당하는 경우에는 해당 위원을 해임 또는 해촉할 수 있다.\n    1. 심신장애로 인하여 직무를 수행할 수 없게 된 경우\n    2. 직무와 관련된 비위사실이 있는 경우\n    3. 직무태만, 품위손상이나 그 밖의 사유로 인하여 위원으로 적합하지 않다고 인정되는 경우\n    4. 위원 스스로 직무를 수행하는 것이 곤란하다고 의사를 밝히는 경우\n    5. 제6항 각 호의 어느 하나에 해당함에도 불구하고 회피하지 않은 경우\n  ⑥ 보세사징계위원회의 위원은 다음 각 호의 어느 하나에 해당하는 경우에는 보세사징계위원회의 심의ㆍ의결에서 제척된다.\n    1. 위원 본인이 징계의결 대상 보세사인 경우\n    2. 위원이 징계의결 대상 보세사와 채권ㆍ채무 등 금전관계가 있는 경우\n    3. 위원이 징계의결 대상 보세사와 친족[배우자(사실상 혼인관계에 있는 사람을 포함한다), 6촌 이내의 혈족 또는 4촌 이내의 인척을 말한다. 이하 이 호에서 같다]이거나 친족이었던 경우\n    4. 위원이 징계의결 대상 보세사와 직접적으로 업무연관성이 있는 경우\n  ⑦ 보세사징계위원회의 위원은 제6항 각 호의 어느 하나에 해당하는 경우에는 스스로 해당 안건의 심의ㆍ의결에서 회피해야 한다.\n  [본조신설 2019. 2. 12.]","D71-4":"제71조의4(우회덤핑 조사의 신청) ① 법 제56조의2제1항제1호에 따른 우회덤핑 해당 여부에 대한 조사를 신청하려는 자는 무역위원회에 다음 각 호의 자료를 제출해야 한다.\n    1. 다음 각 목의 사항을 적은 신청서 3부\n      가. 덤핑방지관세물품에 대한 덤핑방지관세 부과 내용\n      나. 덤핑방지관세물품과 관련된 무역위원회의 의결서 공개본 내용\n      다. 신청인이 덤핑방지관세물품의 덤핑방지관세 부과요청을 한 자인지 여부\n      라. 우회덤핑 조사대상물품의 사진ㆍ도면ㆍ사양ㆍ표준 등 시각적 요소를 제공하는 자료 및 품명ㆍ규격ㆍ특성ㆍ용도ㆍ생산자ㆍ생산량\n      마. 우회덤핑 조사대상물품의 공급국ㆍ공급자ㆍ수출실적 및 수출가능성과 우리나라의 수입자ㆍ수입실적 및 수입가능성\n      바. 우회덤핑 조사대상물품과 같은 종류의 국내 물품의 품명ㆍ규격ㆍ특성ㆍ용도ㆍ생산자ㆍ생산량\n      사. 신청서의 기재사항 및 첨부자료를 비밀로 취급할 필요가 있는 경우에는 그 사유\n      아. 그 밖에 무역위원회가 우회덤핑의 조사에 필요하다고 인정하는 사항\n    2. 우회덤핑 조사대상물품이 수입된 사실과 해당 물품이 우회덤핑에 해당함을 충분히 증명할 수 있는 자료 3부\n    3. 신청인이 우회덤핑이라고 판단한 이유를 적은 사유서 3부\n  ② 무역위원회는 제1항에 따른 신청을 받은 경우에는 그 사실을 재정경제부장관 및 관계 행정기관의 장과 해당 물품의 공급국 정부에 통보해야 한다. 이 경우 제1항 각 호에 따른 자료는 제71조의5제1항에 따른 조사개시 결정을 한 후에 통보해야 한다. <개정 2025. 12. 30.>\n  [본조신설 2024. 2. 29.]","L213-0":"제213조(보세운송의 신고) ① 외국물품은 다음 각 호의 장소 간에 한정하여 외국물품 그대로 운송할 수 있다. 다만, 제248조에 따라 수출신고가 수리된 물품은 해당 물품이 장치된 장소에서 다음 각 호의 장소로 운송할 수 있다. <개정 2020. 12. 22.>\n    1. 국제항\n    2. 보세구역\n    3. 제156조에 따라 허가된 장소\n    4. 세관관서\n    5. 통관역\n    6. 통관장\n    7. 통관우체국\n  ② 제1항에 따라 보세운송을 하려는 자는 관세청장이 정하는 바에 따라 세관장에게 보세운송의 신고를 하여야 한다. 다만, 물품의 감시 등을 위하여 필요하다고 인정하여 대통령령으로 정하는 경우에는 세관장의 승인을 받아야 한다.\n  ③ 세관공무원은 감시ㆍ단속을 위하여 필요하다고 인정될 때에는 관세청장이 정하는 바에 따라 보세운송을 하려는 물품을 검사할 수 있다.\n  ④ 수출신고가 수리된 물품은 관세청장이 따로 정하는 것을 제외하고는 보세운송절차를 생략한다.\n  ⑤ 제2항과 제3항에 따른 보세운송의 신고ㆍ승인 및 검사에 대하여는 제247조와 제250조를 준용한다.\n  [전문개정 2010. 12. 30.]","R84-0":"제84조(동일인이 소유하거나 사실상 지배하는 주식의 범위) ①영 제285조의4제2항에서 “동일인이 소유하거나 사실상 지배하는 주식의 범위”란 주주 1명 또는 그와 다음 각 호의 어느 하나에 해당하는 자가 자기 또는 타인의 명의로 소유하는 주식을 말한다. <개정 2009. 3. 26.>\n    1. 주주 1인의 배우자, 8촌 이내의 혈족 또는 4촌 이내의 인척(이하 “친족”이라 한다)\n    2. 주주 1인이 법인인 경우에 당해 법인이 100분의 30 이상을 출자 또는 출연하고 있는 법인과 당해 법인에 100분의 30 이상을 출자 또는 출연하고 있는 법인이나 개인\n    3. 주주 1인이 개인인 경우에 당해 개인 또는 그와 그 친족이 100분의 30 이상을 출자 또는 출연하고 있는 법인\n    4. 주주 1인 또는 그 친족이 최다수 주식소유자 또는 최다액 출자자로서 경영에 참여하고 있는 법인\n    5. 주주 1인과 그 친족이 이사 또는 업무집행사원의 과반수인 법인\n  ②제1항의 규정은 외국인에게도 이를 준용한다.\n  [본조신설 2003. 2. 14.]","D193-2":"제193조의2(특허보세구역의 물품반입 정지 사유) 법 제178조제1항제4호에서 “대통령령으로 정하는 사유”란 다음 각 호의 어느 하나에 해당하는 경우를 말한다.\n    1. 제207조에 따른 재고조사 결과 원자재소요량 관리가 적정하지 않은 경우\n    2. 1년 동안 계속하여 물품의 반입ㆍ반출 실적이 없거나, 6개월 이상 보세작업을 하지 않은 경우\n    3. 운영인이 최근 1년 이내에 법에 따른 절차 등을 위반한 경우 등 관세청장이 정하는 사유에 해당하는 경우\n  [본조신설 2020. 2. 11.]\n  [종전 제193조의2는 제193조의3으로 이동 <2020. 2. 11.>]","D276-0":"제276조(통계ㆍ증명서의 작성 및 교부의 신청) ①법 제322조제1항 및 제3항의 규정에 의하여 통계의 열람 또는 교부를 신청하고자 하는 자는 다음 각호의 사항을 기재한 신청서를 관세청장에게 제출하여야 한다. <개정 2002. 12. 30.>\n    1. 통계의 종류 및 내용\n    2. 열람 또는 교부의 사유\n  ②법 제322조제2항의 규정에 의한 통계의 공표는 연 1회 이상으로 한다.\n  ③법 제322조제3항 후단에서 “대통령령으로 정하는 경우”란 열람 또는 교부의 대상이 되는 자료가 「공공기관의 정보공개에 관한 법률」 제9조제1항 각 호의 어느 하나에 해당하는 경우를 말한다. <신설 2002. 12. 30., 2004. 7. 29., 2006. 5. 22., 2011. 4. 1.>\n  ④법 제322조제6항에 따라 증명서, 통계 또는 통계자료를 교부받으려는 자는 다음 각 호의 사항을 적은 신청서를 관세청장ㆍ세관장 또는 법 제322조제5항에 따라 업무를 대행하는 자에게 제출하여야 한다. <개정 2002. 12. 30., 2011. 4. 1.>\n    1. 증명서, 통계 또는 통계자료의 내용이 기록되는 매체의 종류 및 내용\n    2. 교부받으려는 사유","D116-0":"제116조(재수출조건 감면물품의 수출 및 가산세징수) ①법 제97조제1항 또는 법 제98조제1항의 규정에 의하여 관세의 감면을 받은 물품을 당해 기간내에 수출하고자 하는 자는 수출신고시에 당해 물품의 수입신고필증 또는 이에 대신할 세관의 증명서와 기타 참고서류를 제출하여야 한다.\n  ②세관장은 제1항의 물품이 수출된 때에는 세관에 제출된 수입신고필증 또는 이에 대신할 세관의 증명서에 수출된 사실을 기재하여 수출신고인에게 교부하여야 한다.\n  ③ 삭제 <2013. 2. 15.>\n  제117조 삭제 <2006. 5. 22.>","R23-0":"제23조(보조금등을 받은 물품의 수입 및 실질적  피해등의 조사개시) ①영 제74조제1항제1호 및 제3호의 규정에 의하여 조사대상 물품과 수출국정부 또는 수출자를 선정함에 있어서는 이용가능한 자료를 기초로 통계적으로 유효한 표본추출방법(수출국정부 또는 수출자의 수 또는 물품의 수를 수입량의 비율이 큰 순서대로 선정하는 방법 등을 포함한다)을 사용함을 원칙으로 한다.\n  ②영 제74조제2항제3호에서 “재정경제부령이 정하는 기준”이란 국제협약에서 달리 정하지 아니하는 한 보조금등의 금액이 당해 물품가격대비 100분의 1 이상인 경우를 말한다. <개정 2008. 12. 31., 2026. 1. 2.>\n  ③ 영 제74조제2항제4호에서 “국내생산자들의 생산량합계가 재정경제부령이 정하는 기준에 미달된다고 인정되는 경우”란 다음 각 호의 어느 하나에 해당하는 경우를 말한다. <개정 2008. 12. 31., 2026. 1. 2.>\n    1. 영 제73조제1항에 의한 부과요청에 대하여 찬성 또는 반대의사를 표시한 국내생산자들의 동종물품 국내생산량합계중 찬성의사를 표시한 국내생산자들의 생산량합계가 100분의 50 이하인 경우\n    2. 영 제73조제1항에 의한 부과요청에 대하여 찬성의사를 표시한 국내생산자들의 생산량합계가 동종물품 국내총생산량의 100분의 25 미만인 경우","L229-0":"제229조(원산지 확인 기준) ① 이 법, 조약, 협정 등에 따른 관세의 부과ㆍ징수, 수출입물품의 통관, 제233조제3항의 확인요청에 따른 조사 등을 위하여 원산지를 확인할 때에는 다음 각 호의 어느 하나에 해당하는 나라를 원산지로 한다.\n  <개정 2014. 1. 1.>\n    1. 해당 물품의 전부를 생산ㆍ가공ㆍ제조한 나라\n    2. 해당 물품이 2개국 이상에 걸쳐 생산ㆍ가공 또는 제조된 경우에는 그 물품의 본질적 특성을 부여하기에 충분한 정도의 실질적인 생산ㆍ가공ㆍ제조 과정이 최종적으로 수행된 나라\n  ② 제1항 각 호를 적용할 물품의 범위, 구체적 확인 기준 등에 관하여 필요한 사항은 재정경제부령으로 정한다.<개정 2025. 10. 1.>\n  ③ 제1항과 제2항에도 불구하고 조약ㆍ협정 등의 시행을 위하여 원산지 확인 기준 등을 따로 정할 필요가 있을 때에는 재정경제부령으로 원산지 확인 기준 등을 따로 정한다.<개정 2025. 10. 1.>\n  [전문개정 2010. 12. 30.]","L110-3":"제110조의3(관세조사 대상자 선정) ① 세관장은 다음 각 호의 어느 하나에 해당하는 경우에 정기적으로 신고의 적정성을 검증하기 위하여 대상을 선정(이하 “정기선정”이라 한다)하여 조사를 할 수 있다. 이 경우 세관장은 객관적 기준에 따라 공정하게 그 대상을 선정하여야 한다.\n    1. 관세청장이 수출입업자의 신고 내용에 대하여 정기적으로 성실도를 분석한 결과 불성실 혐의가 있다고 인정하는 경우\n    2. 최근 4년 이상 조사를 받지 아니한 납세자에 대하여 업종, 규모 등을 고려하여 대통령령으로 정하는 바에 따라 신고 내용이 적정한지를 검증할 필요가 있는 경우\n    3. 무작위추출방식으로 표본조사를 하려는 경우\n  ② 세관장은 정기선정에 의한 조사 외에 다음 각 호의 어느 하나에 해당하는 경우에는 조사를 할 수 있다.<개정 2013. 8. 13., 2017. 12. 19.>\n    1. 납세자가 이 법에서 정하는 신고ㆍ신청, 과세가격결정자료의 제출 등의 납세협력의무를 이행하지 아니한 경우\n    2. 수출입업자에 대한 구체적인 탈세제보 등이 있는 경우\n    3. 신고내용에 탈세나 오류의 혐의를 인정할 만한 자료가 있는 경우\n    4. 납세자가 세관공무원에게 직무와 관련하여 금품을 제공하거나 금품제공을 알선한 경우\n  ③ 세관장은 제39조제1항에 따라 부과고지를 하는 경우 과세표준과 세액을 결정하기 위한 조사를 할 수 있다.\n  ④ 세관장은 최근 2년간 수출입신고 실적이 일정금액 이하인 경우 등 대통령령으로 정하는 요건을 충족하는 자에 대해서는 제1항에 따른 조사를 하지 아니할 수 있다. 다만, 객관적인 증거자료에 의하여 과소 신고한 것이 명백한 경우에는 그러하지 아니하다.\n  [본조신설 2011. 12. 31.]","D40-0":"제40조(압류ㆍ매각의 유예) ① 체납자는 법 제43조의2제1항에 따라 압류 또는 매각의 유예를 받으려는 경우에는 다음 각 호의 사항을 적은 신청서를 세관장에게 제출해야 한다. <개정 2021. 2. 17.>\n    1. 체납자의 주소 또는 거소와 성명\n    2. 납부할 체납액의 세목, 세액과 납부기한\n    3. 압류 또는 매각의 유예를 받으려는 이유와 기간\n    4. 체납자가 체납액을 분할하여 납부하려는 경우에는 그 분납액 및 분납횟수\n  ② 세관장이 제1항의 신청에 따라 압류 또는 매각을 유예하는 경우 그 유예기간은 유예한 날부터 2년 이내로 한다. 이 경우 세관장은 그 유예기간 이내에 분할하여 납부하게 할 수 있다. <개정 2021. 2. 17.>\n  ③ 법 제43조의2제4항에 따라 제출받는 체납액 납부계획서에는 다음 각 호의 사항이 포함되어야 한다.\n    1. 체납액 납부에 제공될 재산 또는 소득에 관한 사항\n    2. 체납액의 납부일정에 관한 사항(제2항 후단에 따라 분할하여 납부하게 된 경우에는 분납일정을 포함해야 한다)\n    3. 그 밖에 체납액 납부계획과 관련된 사항으로서 관세청장이 정하여 고시하는 사항\n  ④ 세관장이 제1항의 신청에 따라 압류 또는 매각을 유예하여 그 사실을 통지하는 경우에는 다음 각 호의 사항을 적은 문서로 해야 한다. <개정 2021. 2. 17.>\n    1. 압류 또는 매각을 유예한 체납액의 세목, 세액과 납부기한\n    2. 체납액을 분할하여 납부하게 하는 경우에는 그 분납액 및 분납횟수\n    3. 압류 또는 매각의 유예기간\n  ⑤ 세관장이 제1항에 따른 신청을 거부하거나 법 제43조의2제5항에 따라 압류 또는 매각의 유예를 취소하는 경우에는 그 사유를 적은 문서로 통지해야 한다. <개정 2021. 2. 17.>\n  [본조신설 2019. 2. 12.]\n  [제목개정 2021. 2. 17.]","L126-0":"제126조(대리인) ① 이의신청인, 심사청구인 또는 심판청구인은 변호사나 관세사를 대리인으로 선임할 수 있다. <개정 2016. 12. 20.>\n  ② 이의신청인, 심사청구인 또는 심판청구인은 신청 또는 청구의 대상이 대통령령으로 정하는 금액 미만인 경우에는 배우자, 4촌 이내의 혈족 또는 배우자의 4촌 이내의 혈족을 대리인으로 선임할 수 있다.<신설 2016. 12. 20.>\n  ③ 대리인의 권한은 서면으로 증명하여야 한다.<개정 2016. 12. 20.>\n  ④ 대리인은 본인을 위하여 청구에 관한 모든 행위를 할 수 있다. 다만, 청구의 취하는 특별한 위임을 받은 경우에만 할 수 있다.<개정 2016. 12. 20.>\n  ⑤ 대리인을 해임하였을 때에는 그 뜻을 서면으로 해당 재결청에 신고하여야 한다.<개정 2016. 12. 20.>\n  [전문개정 2010. 12. 30.]","D251-2":"제251조의2(물품 등의 검사에 대한 손실보상의 금액) ① 법 제246조의2제1항에 따른 손실보상의 대상은 세관공무원의 적법한 물품검사로 손실이 발생한 다음 각 호의 어느 하나에 해당하는 것으로 한다. <신설 2024. 2. 29.>\n    1. 검사 대상 물품\n    2. 제1호의 물품을 포장한 용기 또는 운반ㆍ운송하는 수단\n  ② 법 제246조의2제1항에 따른 손실보상의 금액은 다음 각 호의 구분에 따른 금액으로 한다. <개정 2024. 2. 29.>\n    1. 해당 물품 등을 수리할 수 없는 경우: 다음 각 목의 구분에 따른 금액\n      가. 제1항제1호에 해당하는 경우: 법 제30조부터 제35조까지의 규정에 따른 해당 물품의 과세가격에 상당하는 금액. 다만, 과세가격에 상당하는 금액을 산정할 수 없는 경우에는 구매가격 및 손실을 입은 자가 청구하는 금액을 고려하여 관세청장이 합리적인 범위에서 인정하는 금액으로 한다.\n      나. 제1항제2호에 해당하는 경우: 구매가격 및 손실을 입은 자가 청구하는 금액을 고려하여 관세청장이 합리적인 범위에서 인정하는 금액\n    2. 해당 물품 등을 수리할 수 있는 경우: 수리비에 상당하는 금액. 다만, 제1호에 따른 금액을 한도로 한다.\n  [본조신설 2016. 2. 5.]\n  [제목개정 2024. 2. 29.]","D32-0":"제32조(납세신고) ①법 제38조제1항의 규정에 의하여 납세신고를 하고자 하는 자는 제246조의 규정에 의한 수입신고서에 동조 각호의 사항외에 다음 각호의 사항을 기재하여 세관장에게 제출하여야 한다.\n    1. 당해 물품의 관세율표상의 품목분류ㆍ세율과 품목분류마다 납부하여야 할 세액 및 그 합계액\n    2. 법 기타 관세에 관한 법률 또는 조약에 의하여 관세의 감면을 받는 경우에는 그 감면액과 법적 근거\n    3. 제23조제1항의 규정에 의한 특수관계에 해당하는지 여부와 그 내용\n    4. 기타 과세가격결정에 참고가 되는 사항\n  ②관세청장은 법 제38조제2항의 규정에 의한 세액심사의 원활을 기하기 위하여 필요한 때에는 심사방법 등에 관한 기준을 정할 수 있다.","L200-0":"제200조(반출입물품의 범위 등) ① 종합보세구역에서 소비하거나 사용되는 물품으로서 재정경제부령으로 정하는 물품은 수입통관 후 이를 소비하거나 사용하여야 한다. <개정 2025. 10. 1.>\n  ② 종합보세구역에 반입한 물품의 장치기간은 제한하지 아니한다. 다만, 제197조제2항에 따른 보세창고의 기능을 수행하는 장소 중에서 관세청장이 수출입물품의 원활한 유통을 촉진하기 위하여 필요하다고 인정하여 지정한 장소에 반입되는 물품의 장치기간은 1년의 범위에서 관세청장이 정하는 기간으로 한다.\n  ③ 세관장은 종합보세구역에 반입ㆍ반출되는 물품으로 인하여 국가안전, 공공질서, 국민보건 또는 환경보전 등에 지장이 초래되거나 종합보세구역의 지정 목적에 부합되지 아니하는 물품이 반입ㆍ반출되고 있다고 인정될 때에는 해당 물품의 반입ㆍ반출을 제한할 수 있다.\n  [전문개정 2010. 12. 30.]","L24-0":"제24조(담보의 종류 등) ① 이 법에 따라 제공하는 담보의 종류는 다음 각 호와 같다.\n    1. 금전\n    2. 국채 또는 지방채\n    3. 세관장이 인정하는 유가증권\n    4. 납세보증보험증권\n    5. 토지\n    6. 보험에 가입된 등기 또는 등록된 건물ㆍ공장재단ㆍ광업재단ㆍ선박ㆍ항공기 또는 건설기계\n    7. 세관장이 인정하는 보증인의 납세보증서\n  ② 제1항제4호에 따른 납세보증보험증권 및 제7호에 따른 납세보증서는 세관장이 요청하면 특정인이 납부하여야 하는 금액을 일정 기일 이후에는 언제든지 세관장에게 지급한다는 내용의 것이어야 한다.\n  ③ 제1항에 따른 담보의 제공에 필요한 사항은 대통령령으로 정한다.\n  ④ 납세의무자(관세의 납부를 보증한 자를 포함한다)는 이 법에 따라 계속하여 담보를 제공하여야 하는 사유가 있는 경우에는 관세청장이 정하는 바에 따라 일정 기간에 제공하여야 하는 담보를 포괄하여 미리 세관장에게 제공할 수 있다.\n  [전문개정 2010. 12. 30.]","D92-0":"제92조(할당관세) ①관계부처의 장 또는 이해관계인은 법 제71조제1항에 따라 할당관세의 부과 또는 변경부과를 요청하는 경우에는 해당 물품과 관련된 다음 각 호의 사항에 관한 자료를 재정경제부장관에게 제출하여야 한다. <개정 2008. 2. 29., 2025. 12. 30., 2026. 4. 3.>\n    1. 제91조제1항제1호부터 제5호까지의 사항에 관한 자료\n    2. 해당 할당관세를 적용하려는 세율ㆍ인하이유 및 그 적용기간\n    3. 법 제71조제1항 후단에 따라 수량을 제한하여야 하는 때에는 그 수량 및 산출근거\n    4. 물품의 신속한 공급 등을 위해 집중관리가 필요한 품목(이하 이 조에서 “집중관리품목”이라 한다)으로 할당관세의 부과를 요청하는 경우에는 그 이유 및 근거\n  ②관계부처의 장 또는 이해관계인은 법 제71조제2항의 규정에 의하여 할당관세의 부과를 요청하고자 하는 때에는 당해 물품에 관련된 다음 각호의 사항에 관한 자료를 재정경제부장관에게 제출하여야 한다. <개정 2008. 2. 29., 2025. 12. 30.>\n    1. 제91조제1항제1호 내지 제5호의 사항에 관한 자료\n    2. 당해 할당관세를 적용하여야 하는 세율ㆍ인상이유 및 그 적용기간\n    3. 기본관세율을 적용하여야 하는 수량 및 그 산출근거\n    4. 법 제71조제2항 단서의 규정에 의한 농림축수산물의 경우에는 최근 2년간의 월별 또는 분기별 동종물품ㆍ유사물품 또는 대체물품별 국내외 가격동향\n  ③법 제71조의 규정에 따른 일정수량의 할당은 해당 수량의 범위 안에서 주무부장관 또는 그 위임을 받은 자(이하 이 조에서 “추천기관”이라 한다)의 추천으로 행한다. 다만, 재정경제부장관이 정하는 물품에 있어서는 수입신고 순위에 따르되, 일정수량에 달하는 날의 할당은 그 날에 수입신고되는 분을 해당 수량에 비례하여 할당한다. <개정 2008. 2. 29., 2025. 12. 30., 2026. 4. 3.>\n  ④ 추천기관은 제3항 본문에 따라 소관 물품에 대해 수량의 할당을 받기 위한 자를 추천하는 경우에는 할당관세의 목적을 달성하기 위해 필요한 조건을 붙일 수 있다. 다만, 집중관리품목의 경우에는 반출기한 등 그 물품의 신속한 공급을 위한 조건을 붙여야 한다. <신설 2026. 4. 3.>\n  ⑤제3항 본문에 따라 추천기관의 추천을 받은 자는 해당 추천서를 수입신고 수리 전까지 세관장에게 제출해야 한다. 다만, 해당 물품이 보세구역에서 반출되지 않은 경우에는 수입신고 수리일부터 15일이 되는 날까지 제출할 수 있다. <개정 2021. 2. 17., 2026. 4. 3.>\n  ⑥ 제3항 본문에 따라 추천기관의 추천을 받은 자가 제4항에 따른 조건을 위반한 경우 추천기관은 그 자가 추천받은 수량의 전부 또는 일부에 대해 추천을 취소할 수 있다. <신설 2026. 4. 3.>\n  ⑦ 추천기관은 제3항 본문에 따라 추천을 하거나 제6항에 따라 추천을 취소한 경우에는 다음 각 호의 사항을 세관장(수입신고를 하지 않은 경우에는 관세청장을 말한다)에게 통보해야 한다. <신설 2026. 4. 3.>\n    1. 추천 물품에 대한 정보\n    2. 추천을 받은 자 및 수량\n    3. 추천의 조건이 있는 경우에는 그 조건\n    4. 제6항에 따라 추천을 취소한 경우에는 추천이 취소된 자 및 추천이 취소된 수량 등 추천 취소에 관한 정보\n  ⑧ 세관장은 물품의 통관과 관련하여 추천을 받은 자가 반출기한 등 추천의 조건을 위반한 사실을 확인한 경우에는 해당 추천기관에게 그 사실을 통보해야 한다. <신설 2026. 4. 3.>\n  ⑨ 제6항에 따라 추천이 취소된 경우 세관장은 해당 수량의 물품에 대해서는 할당관세를 적용하지 않는다. <신설 2026. 4. 3.>\n  ⑩법 제71조의 규정에 의한 일정수량까지의 수입통관실적의 확인은 관세청장이 이를 행한다. <개정 2026. 4. 3.>\n  ⑪ 관계부처의 장은 제1항 또는 제2항에 따라 할당관세의 부과를 요청하는 경우 다음 각 호의 사항을 해당 관계부처의 인터넷 홈페이지 등에 10일 이상 게시하여 의견을 수렴하고 그 결과를 재정경제부장관에게 제출하여야 한다. 다만, 자연재해 또는 가격급등 등으로 할당관세를 긴급히 부과할 필요가 있는 경우에는 재정경제부장관과 협의하여 의견 수렴을 생략할 수 있다. <신설 2015. 2. 6., 2025. 12. 30., 2026. 4. 3.>\n    1. 해당 물품의 관세율표 번호, 품명, 규격, 용도 및 대체물품\n    2. 제1항제2호ㆍ제3호 또는 제2항제2호ㆍ제3호의 사항\n  ⑫재정경제부장관은 제1항 및 제2항의 규정에 의한 할당관세의 적용에 관하여 필요한 사항을 조사하기 위하여 필요하다고 인정되는 때에는 관계기관ㆍ수출자ㆍ수입자 기타 이해관계인에게 관계자료의 제출 기타 필요한 협조를 요청할 수 있다. <개정 2008. 2. 29., 2015. 2. 6., 2025. 12. 30., 2026. 4. 3.>\n  ⑬ 재정경제부장관은 법 제71조제4항에 따른 관세의 전년도 부과 실적 등의 보고를 위하여 관계부처의 장에게 매 회계연도 종료 후 3개월 이내에 관세 부과 실적 및 효과 등에 관한 자료를 재정경제부장관에게 제출할 것을 요청할 수 있다. 이 경우 요청을 받은 관계부처의 장은 특별한 사유가 없으면 그 요청에 따라야 한다. <신설 2015. 2. 6., 2025. 12. 30., 2026. 4. 3.>","D141-8":"제141조의8(납세증명서의 발급 신청) 법 제116조의3제2항에 따라 납세증명서를 발급받으려는 자는 재정경제부령으로 정하는 서식에 따른 신청서를 세관장에게 제출하여야 한다. <개정 2025. 12. 30.>\n  [본조신설 2015. 2. 6.]\n  [제141조의5에서 이동, 종전 제141조의8은 제141조의11로 이동 <2023. 2. 28.>]","L116-6":"제116조의6(납세자 본인에 관한 과세정보의 전송 요구) ① 납세자는 관세청장에 대하여 본인에 관한 정보로서 제116조에 따른 과세정보를 본인이나 본인이 지정하는 자로서 본인정보를 이용하여 업무를 처리하려는 다음 각 호에 해당하는 자에게 전송하여 줄 것을 요구할 수 있다.\n    1. 납세자 본인\n    2. 「관세사법」 제7조에 따라 등록한 관세사, 같은 법 제17조의2에 따라 등록한 관세법인 또는 같은 법 제19조에 따라 등록한 통관취급법인등\n    3. 「세무사법」 제6조에 따라 등록한 세무사 또는 같은 법 제16조의4에 따라 등록한 세무법인\n    4. 「세무사법」에 따라 세무대리를 할 수 있는 공인회계사 또는 변호사\n    5. 「전기통신사업법」 제2조제8호에 따른 전기통신사업자로서 대통령령으로 정하는 자\n  ② 관세청장은 제1항에 따른 전송 요구를 받은 경우에는 대통령령으로 정하는 범위에서 해당 정보를 컴퓨터 등 정보처리장치를 이용하여 처리 가능한 형태로 전송하여야 한다.\n  ③ 납세자는 제1항에 따른 전송 요구를 철회할 수 있다.\n  ④ 제2항에도 불구하고 관세청장은 납세자의 본인 여부가 확인되지 아니하는 경우 등 대통령령으로 정하는 경우에는 제1항에 따른 전송 요구를 거절하거나 전송을 중단할 수 있다. 이 경우 관세청장은 지체 없이 해당 사실을 납세자에게 통지하여야 한다.\n  ⑤ 납세자는 제1항 각 호의 어느 하나에 해당하는 자에게 제1항에 따른 전송 요구를 할 때에는 다음 각 호의 사항을 모두 특정하여 전자문서나 그 밖에 안전성과 신뢰성이 확보된 방법으로 하여야 한다.\n    1. 전송을 요구하는 본인의 과세정보\n    2. 본인의 과세정보를 제공받는 자\n    3. 정기적인 전송을 요구하는지 여부 및 요구하는 경우 그 주기\n    4. 그 밖에 제1호부터 제3호까지에서 정한 사항과 유사한 사항으로서 관세청장이 정하는 사항\n  ⑥ 납세자는 제1항에 따른 전송 요구로 인하여 타인의 권리나 정당한 이익을 침해하여서는 아니 된다.\n  ⑦ 제1항부터 제6항까지에서 규정한 사항 외에 전송 요구의 방법, 전송의 기한ㆍ주기 및 방법, 전송 요구 철회의 방법 등 필요한 사항은 대통령령으로 정한다.\n  ⑧ 관세청장은 이 조에 따른 과세정보의 전송 업무를 제322조제5항에 따른 대행기관에 대행하게 할 수 있다. 이 경우 관세청장은 과세정보 전송 업무를 위하여 기초자료를 대행기관에 제공하여야 한다.\n  ⑨ 제2항에 따라 전송된 과세정보를 알게 된 제1항 각 호(제1호는 제외한다)의 자 또는 제8항에 따라 과세정보의 전송 업무를 대행하는 자는 대통령령으로 정하는 바에 따라 과세정보의 유출을 방지하기 위한 시스템 구축 등 과세정보의 안정성 확보를 위한 조치를 하여야 한다.\n  ⑩ 제2항에 따라 전송된 과세정보를 알게 된 제1항 각 호(제1호는 제외한다)의 자 또는 제8항에 따라 과세정보의 전송 업무를 대행하는 자는 과세정보를 타인에게 제공 또는 누설하거나 그 목적 외의 용도로 사용하여서는 아니 된다.\n  ⑪ 제1항에 따른 과세정보를 전송 요구하려는 자는 재정경제부령으로 정하는 바에 따라 관세청장에게 수수료를 납부하여야 한다. 다만, 제8항에 따라 대행기관이 업무를 대행하는 경우에는 대행기관이 정하는 수수료를 해당 대행기관에 납부하여야 한다.<개정 2025. 10. 1.>\n  [본조신설 2023. 12. 31.]","D187-4":"제187조의4(검사비용 지원 대상) ① 법 제173조제3항 단서에서 “「중소기업기본법」 제2조에 따른 중소기업 또는 「중견기업 성장촉진 및 경쟁력 강화에 관한 특별법」 제2조제1호에 따른 중견기업의 컨테이너 화물로서 해당 화물에 대한 검사 결과 이 법 또는 「대외무역법」 등 물품의 수출입과 관련된 법령을 위반하지 아니하는 물품 등 대통령령으로 정하는 물품”이란 다음 각 호의 요건을 모두 갖춘 물품을 말한다. <개정 2021. 2. 17.>\n    1. 「중소기업기본법」 제2조에 따른 중소기업 또는 「중견기업 성장촉진 및 경쟁력 강화에 관한 특별법」 제2조제1호에 따른 중견기업이 해당 물품의 화주일 것\n    2. 컨테이너로 운송되는 물품으로서 관세청장이 정하는 별도 검사 장소로 이동하여 검사받는 물품일 것\n    3. 검사 결과 법령을 위반하여 통고처분을 받거나 고발되는 경우가 아닐 것\n    4. 검사 결과 제출한 신고 자료(적재화물목록은 제외한다)가 실제 물품과 일치할 것\n    5. 예산의 범위에 따라 관세청장이 정하는 기준을 충족할 것\n  ② 제1항제3호에 따른 법령은 법, 「자유무역협정의 이행을 위한 관세법의 특례에 관한 법률」, 「수출용 원재료에 대한 관세 등 환급에 관한 특례법」, 「대외무역법」, 「상표법」, 그 밖에 물품의 수출입과 관련된 법령으로 재정경제부령으로 정하는 법령을 말한다. <개정 2025. 12. 30.>\n  [본조신설 2020. 2. 11.]","L199-0":"제199조(종합보세구역에의 물품의 반입ㆍ반출 등) ① 종합보세구역에 물품을 반입하거나 반출하려는 자는 대통령령으로 정하는 바에 따라 세관장에게 신고하여야 한다.\n  ② 종합보세구역에 반입ㆍ반출되는 물품이 내국물품인 경우에는 재정경제부령으로 정하는 바에 따라 제1항에 따른 신고를 생략하거나 간소한 방법으로 반입ㆍ반출하게 할 수 있다.<개정 2025. 10. 1.>\n  [전문개정 2010. 12. 30.]","R77-3":"제77조의3(조사 전 통지) 영 제236조의8제2항에서 “재정경제부령으로 정하는 사항”이란 다음 각 호의 구분에 따른 사항을 말한다. <개정 2026. 1. 2.>\n    1. 서면조사의 경우\n      가. 조사대상자 및 조사기간\n      나. 조사대상 수출입물품\n      다. 조사이유\n      라. 조사할 내용\n      마. 조사의 법적 근거\n      바. 제출서류 및 제출기간\n      사. 조사기관, 조사자의 직위 및 성명\n      아. 그 밖에 세관장이 필요하다고 인정하는 사항\n    2. 현지조사의 경우\n      가. 조사대상자 및 조사예정기간\n      나. 조사대상 수출입물품\n      다. 조사방법 및 조사이유\n      라. 조사할 내용\n      마. 조사의 법적 근거\n      바. 조사에 대한 동의 여부 및 조사동의서 제출기간(조사에 동의하지 아니하거나 조사동의서 제출기간에 그 동의 여부를 통보하지 아니하는 경우의 조치사항을 포함한다)\n      사. 조사기관, 조사자의 직위 및 성명\n      아. 그 밖에 세관장이 필요하다고 인정하는 사항\n  [본조신설 2011. 4. 1.]\n  [제77조의2에서 이동 , 종전 제77조의3은 제77조의4로 이동 <2014. 3. 14.>]","D145-0":"제145조(심사청구) ①법 제119조의 규정에 의한 심사청구를 하는 때에는 관세청장이 정하는 심사청구서에 다음 각호의 사항을 기재하여야 한다. 이 경우 관계증거서류 또는 증거물이 있는 때에는 이를 첨부할 수 있다.\n    1. 심사청구인의 주소 또는 거소와 성명\n    2. 처분이 있은 것을 안 연월일(처분의 통지를 받은 경우에는 그 받은 연월일)\n    3. 처분의 내용\n    4. 심사청구의 요지와 불복의 이유\n  ② 세관장 또는 관세청장은 제1항에 따른 심사청구에 관한 법 제122조제3항에 따른 의견서 작성 또는 법 제127조에 따른 의결ㆍ결정을 위하여 필요하다고 인정하는 경우에는 직권으로 또는 심사청구인의 신청에 따라 해당 청구의 대상이 된 처분에 관계되는 통관절차 등을 대행한 관세사(합동사무소ㆍ관세사법인 및 통관취급법인을 포함한다)에게 통관경위에 관하여 질문하거나 관련 자료를 제출하도록 요구할 수 있다. <개정 2010. 3. 26., 2021. 2. 17.>\n  ③법 제119조제9항 전단에서 “이 법이나 그 밖의 관세에 관한 법률 또는 조약에 따른 처분으로 권리나 이익을 침해받게 되는 제2차 납세의무자 등 대통령령으로 정하는 이해관계인”이란 다음 각 호의 어느 하나에 해당하는 자를 말한다. <개정 2008. 2. 29., 2011. 4. 1., 2019. 2. 12., 2021. 2. 17., 2025. 12. 30.>\n    1. 제2차 납세의무자로서 납부고지서를 받은 자\n    2. 법 제19조제10항에 따라 물적 납세의무를 지는 자로서 납부고지서를 받은 자\n    3. 납세보증인\n    4. 그 밖에 재정경제부령으로 정하는 자\n  ④심사청구서가 법 제122조제1항의 규정에 의한 세관장외의 세관장 또는 관세청장에게 제출된 때에는 당해 청구서를 관할세관장에게 지체없이 송부하고 그 뜻을 당해 청구인에게 통지하여야 한다.\n  ⑤ 삭제 <2018. 2. 13.>\n  ⑥ 삭제 <2018. 2. 13.>","D277-0":"제277조(포상방법) ①법 제324조의 규정에 의한 포상은 관세청장이 정하는 바에 의하여 포상장 또는 포상금을 수여하거나 포상장과 포상금을 함께 수여할 수 있다.\n  ②관세청장이 제1항의 규정에 의하여 포상금의 수여기준을 정하는 경우 포상금의 수여대상자가 공무원인 때에는 공무원에게 수여하는 포상금총액을 그 공로에 의한 실제 국고수입액의 100분의 25 이내로 하여야 한다. 다만, 1인당 수여액을 100만원 이하로 하는 때에는 그러하지 아니하다. <개정 2001. 12. 31.>\n  ③제1항의 경우에 법 제324조제1항의 규정에 의한 공로자중 관세범을 세관, 그 밖의 수사기관에 통보한 자와 법 제324조제2항에 따라 체납자의 은닉재산을 신고한 자에 대하여는 관세청장이 정하는 바에 의하여 익명으로 포상할 수 있다. <개정 2007. 4. 5.>\n  ④법 제324조제2항에 따라 체납자의 은닉재산을 신고한 자에 대해서는 은닉재산의 신고를 통하여 징수된 금액(이하 이 조에서 “징수금액”이라 한다)에 다음의 지급률을 곱하여 계산한 금액을 포상금으로 지급할 수 있다. 다만, 10억원을 초과하는 부분은 지급하지 않는다. <신설 2007. 4. 5., 2013. 2. 15., 2014. 3. 5., 2022. 2. 15.>\n  <img alt=\"징수금액 지급률&#10;2천만원 이상 5억원 이하 100분의 20&#10;5억원 초과 20억원 이하 @@LATEX@@1억원 + 5억원초과금액의100분의15@@/LATEX@@&#10;20억원 초과 30억원 이하 @@LATEX@@3억2천5백만원 + 20억원초과금액의100분의10@@/LATEX@@&#10;30억원 초과 @@LATEX@@4억2천5백만원 + 30억원초과금액의100분의5@@/LATEX@@&#10;\" src=\"/LSW/flDownload.do?flSeq=112929945\" />\n  ⑤법 제324조제2항 단서에서 “대통령령으로 정하는 금액”이란 2천만원을 말한다. <신설 2007. 4. 5., 2011. 4. 1.>\n  ⑥법 제324조제3항제3호에서 “대통령령으로 정하는 것”이란 체납자 본인의 명의로 등기된 국내소재 부동산을 말한다. <신설 2007. 4. 5., 2011. 4. 1.>\n  ⑦은닉재산을 신고한 자에 대한 포상금은 재산은닉 체납자의 체납액에 해당하는 금액을 징수한 후 지급한다. <신설 2007. 4. 5.>","R42-0":"제42조(정부용품 등에 대한 관세의 면제신청) ①법 제92조제1호의 규정에 의하여 관세를 면제받고자 하는 자는 당해 기증사실을 증명하는 서류를 신청서에 첨부하여야 한다.\n  ② 법 제92조제2호 본문에 따라 관세를 면제받으려는 경우에는 다음 각 호의 서류를 신청서에 첨부해야 한다. <개정 2021. 3. 16.>\n    1. 해당 물품이 제41조제2항에 따른 통상품이 아님을 국방부장관 또는 방위사업청장이 지정하는 자가 확인한 서류\n    2. 정부의 위탁을 받아 수입하는 경우에는 정부의 위탁을 받아 수입한다는 것을 국방부장관 또는 방위사업청장이 지정하는 자가 확인한 서류\n  ③법 제92조제6호 또는 제7호의 규정에 의하여 국가 또는 지방자치단체가 설립하였거나 출연 또는 출자한 법인이 관세를 면제받고자 하는 때에는 환경 또는 상수도업무를 관장하는 주무부처의 장이 확인한 서류를 첨부하여야 한다.","L52-0":"제52조(덤핑 및 실질적 피해등의 조사) ① 제51조에 따른 덤핑 사실과 실질적 피해등의 사실에 관한 조사는 대통령령으로 정하는 바에 따른다.\n  ② 재정경제부장관은 덤핑방지관세를 부과할 때 관련 산업의 경쟁력 향상, 국내 시장구조, 물가안정, 통상협력 등을 고려할 필요가 있는 경우에는 이를 조사하여 반영할 수 있다.<개정 2016. 12. 20., 2025. 10. 1.>\n  [전문개정 2010. 12. 30.]","D144-2":"제144조의2(납세자보호관 및 담당관의 자격ㆍ직무 등) ① 법 제118조의2제2항에서 “대통령령으로 정하는 세관”이란 인천공항세관ㆍ서울세관ㆍ부산세관ㆍ인천세관ㆍ대구세관 및 광주세관(이하 “본부세관”이라 한다)을 말한다. <개정 2023. 4. 11.>\n  ② 법 제118조의2제5항에 따른 납세자보호관(이하 “납세자보호관”이라 한다)의 직무 및 권한은 다음 각 호와 같다. <개정 2021. 2. 17.>\n    1. 위법ㆍ부당한 관세조사 및 관세조사 중 세관공무원의 위법ㆍ부당한 행위에 대한 일시중지 및 중지\n    2. 위법ㆍ부당한 처분(법에 따른 납부고지는 제외한다)에 대한 시정요구\n    3. 위법ㆍ부당한 처분이 있을 수 있다고 인정되는 경우 그 처분 절차의 일시중지 및 중지\n    4. 납세서비스 관련 제도ㆍ절차 개선에 관한 사항\n    5. 납세자의 권리보호업무에 관하여 법 제118조의2제2항에 따른 담당관(이하 “납세자보호담당관”이라 한다)에 대한 지도ㆍ감독\n    6. 세금 관련 고충민원의 해소 등 납세자 권리보호에 관한 사항\n    7. 그 밖에 납세자의 권리보호와 관련하여 관세청장이 정하는 사항\n  ③ 납세자보호관은 제2항에 따른 업무를 효율적으로 수행하기 위하여 납세자보호담당관에게 그 직무와 권한의 일부를 위임할 수 있다.\n  ④ 납세자보호담당관은 관세청 소속 공무원 중에서 그 직급ㆍ경력 등을 고려하여 관세청장이 정하는 기준에 해당하는 사람으로 한다.\n  ⑤ 납세자보호담당관의 직무 및 권한은 다음 각 호와 같다.\n    1. 세금 관련 고충민원의 처리 등 납세자 권리보호에 관한 사항\n    2. 제3항에 따라 위임받은 업무\n    3. 그 밖에 납세자 권리보호에 관하여 관세청장이 정하는 사항\n  [본조신설 2020. 2. 11.]","D238-0":"제238조(통관보류등의 요청) 법 제235조제3항 및 제4항에 따라 통관의 보류나 유치(이하 “통관보류등”이라 한다)를 요청하려는 자는 다음 각 호의 사항을 적은 신청서와 해당 법령에 따른 정당한 권리자임을 증명하는 서류를 세관장에게 제출하여야 한다. <개정 2008. 2. 22., 2011. 4. 1., 2025. 2. 28.>\n    1. 품명ㆍ수출입자 및 수출입국\n    2. 지식재산권등의 내용 및 범위\n    3. 요청사유\n    4. 침해사실을 입증하기 위하여 필요한 사항\n  [제목개정 2011. 4. 1.]","D144-5":"제144조의5(납세자보호위원회에 대한 납세자의 심의 등의 요청 및 결과 통지 등) ① 납세자는 법 제118조의5제1항에 따라 심의를 요청하는 경우 또는 같은 조 제3항에 따라 취소 또는 변경 요청을 하는 경우에는 서면으로 해야 한다.\n  ② 세관장이 법 제118조의5제2항에 따른 결과를 통지하거나 관세청장이 같은 조 제4항에 따른 결과를 통지하는 경우에는 서면으로 해야 한다.\n  ③ 법 제118조의5제5항 단서에서 “납세자가 관세조사를 기피하려는 것이 명백한 경우 등 대통령령으로 정하는 경우”란 다음 각 호의 경우를 말한다.\n    1. 납세자가 장부ㆍ서류 등을 은닉하거나 제출을 지연 또는 거부하는 등 조사를 기피하는 행위가 명백한 경우\n    2. 납세자의 심의 요청 및 취소 또는 변경 요청이 관세조사를 기피하려는 행위임을 세관공무원이 자료ㆍ근거 등으로 명백하게 입증하는 경우\n  ④ 법 제118조의5제7항에 따라 의견 진술을 하려는 납세자는 다음 각 호의 사항을 적은 문서를 해당 세관장 또는 관세청장에게 제출하여 신청해야 한다.\n    1. 진술자의 성명(법인인 경우 법인의 대표자 성명)\n    2. 진술자의 주소 또는 거소\n    3. 진술하려는 내용\n  ⑤ 제4항의 신청을 받은 해당 세관장 또는 관세청장은 출석 일시 및 장소와 필요하다고 인정하는 진술시간을 정하여 회의 개최일 3일 전까지 납세자에게 통지해야 한다.\n  ⑥ 제1항부터 제5항까지에서 규정한 사항 외에 납세자보호위원회에 대한 납세자의 심의 요청 및 결과 통지 등에 필요한 사항은 관세청장이 정한다.\n  [본조신설 2020. 2. 11.]\n  [제144조의4에서 이동 <2023. 2. 28.>]","D232-0":"제232조(보세화물 취급 선박회사 등의 신고 및 보고) ①법 제225조제1항에 따라 보세화물을 취급하는 선박회사 또는 항공사(그 업무를 대행하는 자를 포함하며, 이하 이 조에서 “선박회사 또는 항공사”라 한다)는 다음 각 호의 요건을 모두 갖추어 주소ㆍ성명ㆍ상호 및 영업장소 등을 적은 신고서를 세관장에게 제출하여야 한다. <개정 2011. 9. 7., 2017. 3. 29.>\n    1. 법 제175조 각 호의 어느 하나에 해당하지 아니할 것\n    2. 「해운법」, 「항공사업법」 등 관련 법령에 따른 등록을 할 것\n  ②법 제225조제1항 후단에서 “대통령령으로 정하는 중요한 사항”이란 다음 각 호의 어느 하나에 해당하는 사항을 말한다. <신설 2006. 5. 22., 2011. 4. 1.>\n    1. 신고인의 주소 및 성명\n    2. 신고인의 상호 또는 영업장소\n    3. 제1항제2호에 따라 신고한 등록사항\n  ③세관장은 법 제225조제2항에 따라 다음 각 호의 사항을 선박회사 또는 항공사로 하여금 보고하게 할 수 있다. <개정 2011. 9. 7.>\n    1. 선박회사 또는 항공사가 화주 또는 법 제222조제1항제2호에 따른 화물운송주선업자에게 발행한 선하증권 또는 항공화물운송장의 내역\n    2. 화물 취급과정에서 발견된 보세화물의 이상 유무 등 통관의 신속 또는 관세범의 조사상 필요한 사항\n  [제목개정 2011. 9. 7.]","D77-0":"제77조(실질적 피해등의 판정) ①무역위원회는 제75조에 따라 실질적 피해등의 사실을 조사ㆍ판정하는 때에는 다음 각 호의 사항을 포함한 실질적 증거에 근거해야 한다. <개정 2020. 12. 29.>\n    1. 보조금등을 받은 물품의 수입물량(당해 물품의 수입이 절대적으로 또는 국내생산이나 국내소비에 대하여 상대적으로 뚜렷하게 증가되었는지 여부를 포함한다)\n    2. 보조금등을 받은 물품의 가격(국내의 동종물품의 가격과 비교하여 뚜렷하게 하락되었는지 여부를 포함한다)\n    3. 보조금등의 금액의 정도(보조금등을 받은 물품의 수입가격이 수출국내 정상가격과 비교하여 뚜렷하게 하락되었는지 여부를 포함한다)\n    4. 국내산업의 생산량ㆍ가동률ㆍ재고ㆍ판매량ㆍ시장점유율ㆍ가격(가격하락 또는 인상억제의 효과를 포함한다)ㆍ이윤ㆍ생산성ㆍ투자수익ㆍ현금수지ㆍ고용ㆍ임금ㆍ성장ㆍ자본조달ㆍ투자능력\n    5. 제1호 및 제2호의 내용이 국내산업에 미치는 실재적 또는 잠재적 영향\n  ②제1항에 따라 실질적 피해등을 조사ㆍ판정하는 경우 실질적 피해등을 받을 우려가 있는지에 대한 판정은 제1항 각 호의 사항뿐만 아니라 다음 각 호의 사항을 포함한 사실에 근거를 두어야 하며, 보조금등을 받은 물품으로 인한 피해는 명백히 예견되고 급박한 것이어야 한다. <개정 2020. 12. 29.>\n    1. 당해 보조금등의 성격 및 이로부터 발생할 수 있는 무역효과\n    2. 실질적인 수입증가의 가능성을 나타내는 보조금등을 받은 물품의 현저한 증가율\n    3. 우리나라에 보조금등을 받은 물품의 수출을 증가시킬 수 있는 생산능력의 실질적 증가(다른 나라에의 수출가능성을 고려한 것이어야 한다)\n    4. 보조금등을 받은 물품의 가격이 동종물품의 가격을 하락 또는 억제시킬 수 있는지의 여부 및 추가적인 수입수요의 증대가능성\n    5. 보조금등을 받은 물품의 재고 및 동종물품의 재고상태\n  ③무역위원회는 제1항의 규정에 의하여 실질적 피해등의 사실을 조사ㆍ판정함에 있어 2 이상의 국가로부터 수입된 물품이 동시에 조사대상물품이 되고 다음 각 호에 모두 해당하는 경우에는 그 수입에 따른 피해를 통산하여 평가할 수 있다. <개정 2008. 2. 29., 2024. 2. 29., 2025. 12. 30.>\n    1. 보조금등의 금액 및 보조금등을 받은 물품의 수입량이 재정경제부령이 정하는 기준에 해당하는 경우\n    2. 보조금 등을 받은 물품이 상호 경쟁적이고 국내 동종물품과 경쟁적인 경우\n  ④무역위원회는 보조금등을 받은 물품의 수입외의 다른 요인으로서 국내산업에 피해를 미치는 요인들을 조사하여야 하며, 이러한 요인들에 의한 산업피해 등을 보조금등을 받은 물품의 수입에 의한 것으로 간주하여서는 아니된다.\n  [제목개정 2020. 12. 29.]","D130-0":"제130조(사후관리 대상물품의 이관 및 관세의 징수) ①법 제83조, 제89조제1항제2호, 제90조, 제91조, 제93조, 제95조제1항제1호부터 제3호까지, 제98조 및 제107조에 따라 용도세율의 적용, 관세의 감면 또는 분할납부의 승인을 받은 물품의 통관세관과 관할지세관이 서로 다른 경우에는 통관세관장은 관세청장이 정하는 바에 따라 관할지세관장에게 해당 물품에 대한 관계서류를 인계하여야 한다. <개정 2011. 4. 1.>\n  ②제1항의 규정에 의하여 통관세관장이 관할지세관장에게 관계서류를 인계한 물품에 대하여 법 제97조제3항(법 제98조제2항에서 준용하는 경우를 포함한다) 및 법 제102조제2항의 규정에 의하여 징수하는 관세는 관할지세관장이 이를 징수한다.","R36-0":"제36조(세율불균형물품에 대한 관세의 감면신청) 법 제89조제1항 및 제6항에 따라 관세를 감면받고자 하는 자는 영 제112조제1항 각 호의 사항 외에 제조할 물품의 품명ㆍ규격ㆍ수량 및 가격, 제조개시 및 완료예정연월일과 지정제조공장의 명칭 및 소재지를 신청서에 기재하고, 원자재소요량증명서 또는 이에 갈음할 서류를 첨부하여 세관장에게 제출하여야 한다. 다만, 세관장이 필요없다고 인정하는 때에는 원자재소요량증명서 등의 첨부를 생략할 수 있다. <개정 2009. 3. 26., 2019. 3. 20.>","D141-11":"제141조의11(출국금지 등의 요청) ① 법 제116조의5제1항에서 “대통령령으로 정하는 자”란 다음 각 호의 어느 하나에 해당하는 사람으로서 관할 세관장이 압류ㆍ공매, 담보 제공, 보증인의 납세보증서 등으로 조세채권을 확보할 수 없고, 강제징수를 회피할 우려가 있다고 인정되는 사람을 말한다. <개정 2021. 2. 17., 2023. 2. 28., 2024. 2. 29., 2025. 2. 28.>\n    1. 배우자 또는 직계존비속이 국외로 이주(국외에 3년 이상 장기체류 중인 경우를 포함한다)한 사람\n    2. 「출입국관리법」 제4조에 따른 출국금지(같은 법 제29조에 따른 출국정지를 포함한다. 이하 이 조 및 제141조의12에서 “출국금지”라 한다)의 요청일 현재 최근 2년간 미화 5만달러 상당액 이상을 국외로 송금한 사람\n    3. 미화 5만달러 상당액 이상의 국외자산이 발견된 사람\n    4. 법 제116조의2에 따라 명단이 공개된 자\n    5. 출국금지 요청일을 기준으로 최근 1년간 사업 목적, 질병 치료, 직계존비속의 사망 등 정당한 사유 없이 국외 출입 횟수가 3회 이상이거나 국외 체류 일수가 6개월 이상인 사람\n    6. 법 제26조에 따라 「국세징수법」 제25조에 따른 사해행위(詐害行爲) 취소소송 중이거나 「국세기본법」 제35조제6항에 따른 제3자와 짜고 한 거짓계약에 대한 취소소송 중인 사람\n  ② 관세청장은 법 제116조의5제1항에 따라 법무부장관에게 체납자에 대한 출국금지를 요청하는 경우에는 해당 체납자가 제1항 각 호 중 어느 항목에 해당하는지와 조세채권을 확보할 수 없고 강제징수를 회피할 우려가 있다고 인정하는 사유를 구체적으로 밝혀야 한다. <개정 2021. 2. 17.>\n  [본조신설 2020. 2. 11.]\n  [제141조의8에서 이동 <2023. 2. 28.>]","L127-0":"제127조(결정절차) ① 제122조에 따른 심사청구가 있으면 관세청장은 관세심사위원회의 의결에 따라 결정하여야 한다. 다만, 심사청구기간이 지난 후 심사청구가 제기된 경우 등 대통령령으로 정하는 사유에 해당하는 경우에는 그러하지 아니하다. <개정 2020. 12. 22.>\n  ② 관세청장은 제1항에 따른 관세심사위원회의 의결이 법령에 명백히 위반된다고 판단하는 경우 구체적인 사유를 적어 서면으로 관세심사위원회에 한 차례에 한정하여 다시 심의할 것을 요청할 수 있다.<신설 2020. 12. 22.>\n  ③ 관세심사위원회의 회의는 공개하지 아니한다. 다만, 관세심사위원회의 위원장이 필요하다고 인정할 때에는 공개할 수 있다.<개정 2020. 12. 22.>\n  [전문개정 2010. 12. 30.]","R9-2":"제9조의2(가산세) 법 제42조의2제1항제5호 단서에서 “재정경제부령으로 정하는 경우”란 다음 각 호의 어느 하나에 해당하는 경우를 말한다. <개정 2020. 3. 13., 2026. 1. 2.>\n    1. 납세자가 법 제114조제1항 본문에 따른 관세조사의 사전통지를 받은 후 수정신고서를 제출한 경우\n    2. 납세자가 법 제114조제1항 단서에 따라 사전통지 없이 법 제110조제2항 각 호의 조사가 개시된 사실을 알고 수정신고서를 제출한 경우\n    3. 납세자가 법 제118조제1항에 따른 서면통지를 받은 후 수정신고서를 제출한 경우\n  [본조신설 2015. 3. 6.]\n  [종전 제9조의2는 제9조의3으로 이동 <2015. 3. 6.>]","R41-0":"제41조(관세가 면제되는 정부용품 등) ①법 제92조제1호 단서에 따라 관세가 부과되는 물품은 관세율표 번호 제8703호에 해당하는 승용자동차로 한다. <개정 2011. 4. 1.>\n  ②법 제92조제2호 단서의 규정에 의하여 관세가 부과되는 물품은 「군수품관리법」 제3조의 규정에 의한 통상품으로 한다. <개정 2005. 2. 11., 2007. 5. 29., 2007. 12. 31.>\n    1. 삭제 <2007. 12. 31.>\n    2. 삭제 <2007. 12. 31.>\n    3. 삭제 <2007. 12. 31.>\n    4. 삭제 <2007. 12. 31.>\n    5. 삭제 <2007. 12. 31.>\n    6. 삭제 <2007. 12. 31.>\n    7. 삭제 <2007. 12. 31.>\n    8. 삭제 <2007. 12. 31.>\n    9. 삭제 <2007. 12. 31.>\n    10. 삭제 <2007. 12. 31.>\n    11. 삭제 <2007. 12. 31.>\n  ③법 제92조제6호 또는 제7호의 규정에 의하여 관세가 면제되는 물품은 다음 각호의 물품중 개당 또는 셋트당 과세가격이 100만원 이상인 기기와 그 기기의 부분품 및 부속품(사후에 보수용으로 따로 수입하는 물품을 포함한다)중 국내에서 제작하기 곤란한 것으로서 당해  물품의 생산에 관한 사무를 관장하는 주무부처의 장 또는 그가 지정하는 자가 추천하는 물품으로 한다.\n    1. 대기질의 채취 및 측정용 기계ㆍ기구\n    2. 소음ㆍ진동의 측정 및 분석용 기계ㆍ기구\n    3. 환경오염의 측정 및 분석용 기계ㆍ기구\n    4. 수질의 채취 및 측정용 기계ㆍ기구","L73-0":"제73조(국제협력관세) ① 정부는 우리나라의 대외무역 증진을 위하여 필요하다고 인정될 때에는 특정 국가 또는 국제기구와 관세에 관한 협상을 할 수 있다\n  ② 제1항에 따른 협상을 수행할 때 필요하다고 인정되면 관세를 양허할 수 있다. 다만, 특정 국가와 협상할 때에는 기본 관세율의 100분의 50의 범위를 초과하여 관세를 양허할 수 없다.\n  ③ 제2항에 따른 관세를 부과하여야 하는 대상 물품, 세율 및 적용기간 등은 대통령령으로 정한다.\n  [전문개정 2010. 12. 30.]","D248-0":"제248조(가산세 대상물품) 법 제241조제4항에 따른 가산세를 징수해야 하는 물품은 다음 각 호의 물품으로 한다. <개정 2020. 12. 29., 2026. 4. 3.>\n    1. 물품의 신속한 유통이 긴요하다고 인정하여 보세구역의 종류와 물품의 특성을 고려하여 관세청장이 정하는 물품\n    2. 제92조제1항제4호에 따른 집중관리품목","L43-2":"제43조의2(압류ㆍ매각의 유예) ① 세관장은 재산의 압류나 압류재산의 매각을 유예함으로써 사업을 정상적으로 운영할 수 있게 되어 체납액의 징수가 가능하다고 인정되는 경우에는 그 체납액에 대하여 강제징수에 의한 재산의 압류나 압류재산의 매각을 대통령령으로 정하는 바에 따라 유예할 수 있다. <개정 2020. 12. 22.>\n  ② 세관장은 제1항에 따라 유예하는 경우에 필요하다고 인정하면 이미 압류한 재산의 압류를 해제할 수 있다.\n  ③ 세관장은 제1항 및 제2항에 따라 재산의 압류를 유예하거나 압류한 재산의 압류를 해제하는 경우에는 그에 상당하는 납세담보의 제공을 요구할 수 있다.\n  ④ 제3항에도 불구하고 세관장은 압류 또는 매각의 유예 결정일 기준으로 최근 3년 이내에 이 법, 「자유무역협정의 이행을 위한 관세법의 특례에 관한 법률」, 「수출용 원재료에 대한 관세 등 환급에 관한 특례법」 또는 「조세범 처벌법」 위반으로 처벌받은 사실이 없는 체납자로부터 체납액 납부계획서를 제출받고 그 납부계획의 타당성을 인정하는 경우에는 납세담보의 제공을 요구하지 아니할 수 있다.<개정 2020. 12. 22.>\n  ⑤ 세관장은 압류 또는 매각의 유예를 받은 체납자가 다음 각 호의 어느 하나에 해당하는 경우에는 그 압류 또는 매각의 유예를 취소하고, 유예에 관계되는 체납액을 한꺼번에 징수할 수 있다. 다만, 제1호에 정당한 사유가 있는 것으로 세관장이 인정하는 경우에는 압류 또는 매각의 유예를 취소하지 아니할 수 있다.<개정 2020. 12. 22.>\n    1. 체납액을 분납계획에 따라 납부하지 아니한 경우\n    2. 담보의 변경이나 그 밖에 담보 보전에 필요한 세관장의 명령에 따르지 아니한 경우\n    3. 재산상황이나 그 밖의 사정의 변화로 유예할 필요가 없다고 인정될 경우\n    4. 다음 각 목 중 어느 하나의 경우에 해당되어 그 유예한 기한까지 유예에 관계되는 체납액의 전액을 징수할 수 없다고 인정될 경우\n      가. 국세ㆍ지방세 또는 공과금의 체납으로 강제징수 또는 체납처분이 시작된 경우\n      나. 「민사집행법」에 따른 강제집행ㆍ담보권 실행 등을 위한 경매가 시작된 경우\n      다. 「어음법」 및 「수표법」에 따른 어음교환소에서 거래정지처분을 받은 경우\n      라. 「채무자 회생 및 파산에 관한 법률」에 따른 파산선고를 받은 경우\n      마. 법인이 해산된 경우\n      바. 관세의 체납이 발생되거나 관세를 포탈하려는 행위가 있다고 인정되는 경우\n  ⑥ 세관장은 제1항에 따라 압류 또는 매각을 유예하였거나 제5항에 따라 압류 또는 매각의 유예를 취소하였을 때에는 체납자에게 그 사실을 통지하여야 한다.<개정 2020. 12. 22.>\n  ⑦ 세관장은 다음 각 호의 어느 하나에 해당하는 경우에는 제1항에 따라 압류 또는 매각의 유예를 받은 체납액에 대하여 유예기간이 지난 후 다시 압류 또는 매각의 유예를 할 수 있다.<개정 2020. 12. 22.>\n    1. 제5항 각 호 외의 부분 단서에 따라 압류 또는 매각의 유예를 취소하지 아니한 경우\n    2. 제5항제3호에 따라 압류 또는 매각의 유예를 취소한 경우\n  ⑧ 관세청장은 제4항에 따른 법 위반 사실을 확인하기 위하여 관계 기관의 장에게 범죄경력자료(이 법, 「자유무역협정의 이행을 위한 관세법의 특례에 관한 법률」, 「수출용 원재료에 대한 관세 등 환급에 관한 특례법」 또는 「조세범 처벌법」 위반에 한정한다)의 조회를 요청할 수 있으며, 그 요청을 받은 관계 기관의 장은 정당한 사유가 없으면 이에 따라야 한다.<신설 2020. 12. 22.>\n  ⑨ 제1항부터 제8항까지에서 규정한 사항 외에 압류 또는 매각의 유예 신청, 통지 및 유예기간 등 압류 또는 매각의 유예에 필요한 세부사항은 대통령령으로 정한다.<개정 2020. 12. 22.>\n  [본조신설 2018. 12. 31.]\n  [제목개정 2020. 12. 22.]","L173-0":"제173조(세관검사장) ① 세관검사장은 통관하려는 물품을 검사하기 위한 장소로서 세관장이 지정하는 지역으로 한다.\n  ② 세관장은 관세청장이 정하는 바에 따라 검사를 받을 물품의 전부 또는 일부를 세관검사장에 반입하여 검사할 수 있다\n  ③ 제2항에 따라 세관검사장에 반입되는 물품의 채취ㆍ운반 등에 필요한 비용(이하 이 항에서 “검사비용”이라 한다)은 화주가 부담한다. 다만, 국가는 「중소기업기본법」 제2조에 따른 중소기업 또는 「중견기업 성장촉진 및 경쟁력 강화에 관한 특별법」 제2조제1호에 따른 중견기업의 컨테이너 화물로서 해당 화물에 대한 검사 결과 이 법 또는 「대외무역법」 등 물품의 수출입과 관련된 법령을 위반하지 아니하는 경우의 물품 등 대통령령으로 정하는 물품에 대해서는 예산의 범위에서 관세청장이 정하는 바에 따라 해당 검사비용을 지원할 수 있다.<개정 2019. 12. 31.>\n  [전문개정 2010. 12. 30.]","L46-0":"제46조(관세환급금의 환급) ① 세관장은 납세의무자가 관세ㆍ가산세 또는 강제징수비로 납부한 금액 중 잘못 납부하거나 초과하여 납부한 금액 또는 이 법에 따라 환급하여야 할 환급세액의 환급을 청구할 때에는 대통령령으로 정하는 바에 따라 지체 없이 이를 관세환급금으로 결정하고 30일 이내에 환급하여야 하며, 세관장이 확인한 관세환급금은 납세의무자가 환급을 청구하지 아니하더라도 환급하여야 한다. <개정 2013. 1. 1., 2019. 12. 31., 2020. 12. 29., 2023. 12. 31.>\n  ② 세관장은 제1항에 따라 관세환급금을 환급하는 경우에 환급받을 자가 세관에 납부하여야 하는 관세와 그 밖의 세금, 가산세 또는 강제징수비가 있을 때에는 환급하여야 하는 금액에서 이를 충당할 수 있다<개정 2013. 1. 1., 2019. 12. 31., 2020. 12. 29.>\n  ③ 납세의무자의 관세환급금에 관한 권리는 대통령령으로 정하는 바에 따라 제3자에게 양도할 수 있다.<개정 2013. 1. 1.>\n  ④ 제1항에 따른 관세환급금의 환급은 「국가재정법」 제17조에도 불구하고 대통령령으로 정하는 바에 따라 「한국은행법」에 따른 한국은행의 해당 세관장의 소관 세입금에서 지급한다.<개정 2013. 1. 1.>\n  [전문개정 2010. 12. 30.]\n  [제목개정 2013. 1. 1.]","D69-0":"제69조(덤핑방지관세의 소급부과) ①법 제55조 단서에 따라 잠정조치가 적용된 물품으로서 덤핑방지관세가 부과되는 물품은 다음과 같다. <개정 2008. 2. 29., 2017. 3. 27., 2025. 12. 30.>\n    1. 실질적 피해등이 있다고 최종판정이 내려진 경우 또는 실질적인 피해등의 우려가 있다는 최종판정이 내려졌으나 잠정조치가 없었다면 실질적인 피해등이 있다는 최종판정이 내려졌을 것으로 인정되는 경우에는 잠정조치가 적용된 기간동안 수입된 물품\n    2. 비교적 단기간내에 대량 수입되어 발생되는 실질적 피해등의 재발을 방지하기 위하여 덤핑방지관세를 소급하여 부과할 필요가 있는 경우로서 당해 물품이 과거에 덤핑되어 실질적 피해등을 입힌 사실이 있었던 경우 또는 수입자가 덤핑사실과 그로 인한 실질적 피해등의 사실을 알았거나 알 수 있었을 경우에는 잠정조치를 적용한 날부터 90일전 이후에 수입된 물품\n    3. 법 제54조제1항에 따른 약속(이하 이 호에서 “약속”이라 한다)을 위반하여 잠정조치가 적용된 물품의 수입으로 인한 실질적 피해등의 사실이 인정되는 경우에는 잠정조치를 적용한 날부터 90일전 이후에 수입된 물품(재정경제부장관이 필요하다고 인정한 경우 약속을 위반한 물품으로 한정할 수 있다). 이 경우 약속위반일 이전에 수입된 물품을 제외한다.\n    4. 기타 국제협약에서 정하는 바에 따라 재정경제부장관이 정하는 기간에 수입된 물품\n  ②제59조의 규정에 의한 국내산업에 이해관계가 있는 자는 제61조제5항의 규정에 의한 본조사의 결과에 따라 최종판정의 통지를 받은 날부터 7일 이내에 당해 물품이 제1항 각호의 1에 해당된다는 증거를 제출하여 법 제55조 단서의 규정에 의한 덤핑방지관세의 부과를 요청할 수 있다.","D138-0":"제138조(납세자의 성실성 추정 등의 배제사유) ①법 제113조제1항에서 “대통령령으로 정하는 경우”란 다음 각 호의 어느 하나에 해당하는 경우를 말한다. <개정 2011. 4. 1.>\n    1. 납세자가 법에서 정하는 신고 및 신청, 과세자료의 제출 등의 납세협력의무를 이행하지 아니한 경우\n    2. 납세자에 대한 구체적인 탈세정보가 있는 경우\n    3. 신고내용에 탈루나 오류의 혐의를 인정할 만한 명백한 자료가 있는 경우\n    4. 납세자의 신고내용이 관세청장이 정한 기준과 비교하여 불성실하다고 인정되는 경우\n  ②법 제113조제2항에서 “대통령령으로 정하는 행위”란 다음 각 호의 어느 하나에 해당하는 것을 말한다. <개정 2006. 5. 22., 2011. 4. 1.>\n    1. 법 제38조제2항에 따른 세액심사를 위한 질문이나 자료제출의 요구\n    2. 법 제246조에 따른 물품의 검사\n    3. 법 제266조제1항에 따른 장부 또는 자료의 제출\n    4. 그 밖의 법(「수출용원재료에 대한 관세 등 환급에 관한 특례법」을 포함한다)에 따른 자료조사나 자료제출의 요구","L119-0":"제119조(불복의 신청) ① 이 법이나 그 밖의 관세에 관한 법률 또는 조약에 따른 처분으로서 위법한 처분 또는 부당한 처분을 받거나 필요한 처분을 받지 못하여 권리나 이익을 침해당한 자는 이 절의 규정에 따라 그 처분의 취소 또는 변경을 청구하거나 필요한 처분을 청구할 수 있다. 다만, 다음 각 호의 처분에 대해서는 그러하지 아니하다. <개정 2018. 12. 31., 2020. 12. 22.>\n    1. 이 법에 따른 통고처분\n    2. 「감사원법」에 따라 심사청구를 한 처분이나 그 심사청구에 대한 처분\n    3. 이 법이나 그 밖의 관세에 관한 법률에 따른 과태료 부과처분\n  ② 제1항 각 호 외의 부분 본문에 따른 처분이 관세청장이 조사ㆍ결정 또는 처리하거나 하였어야 할 것인 경우를 제외하고는 그 처분에 대하여 심사청구 또는 심판청구에 앞서 이 절의 규정에 따른 이의신청을 할 수 있다.<개정 2018. 12. 31.>\n  ③ 이 절의 규정에 따른 심사청구 또는 심판청구에 대한 처분에 대해서는 이의신청, 심사청구 또는 심판청구를 제기할 수 없다. 다만, 제128조제1항제3호 후단(제131조에서 「국세기본법」을 준용하는 경우를 포함한다)의 재조사 결정에 따른 처분청의 처분에 대해서는 해당 재조사 결정을 한 재결청에 심사청구 또는 심판청구를 제기할 수 있다.<신설 2018. 12. 31.>\n  ④ 이 절의 규정에 따른 이의신청에 대한 처분과 제128조제1항제3호 후단(제132조제4항에서 준용하는 경우를 포함한다)의 재조사 결정에 따른 처분청의 처분에 대해서는 이의신청을 할 수 없다.<신설 2018. 12. 31.>\n  ⑤ 제1항제2호의 심사청구는 그 처분을 한 것을 안 날(처분의 통지를 받았을 때에는 그 통지를 받은 날을 말한다)부터 90일 이내에 하여야 한다.<개정 2018. 12. 31.>\n  ⑥ 제1항제2호의 심사청구를 거친 처분에 대한 행정소송은 「행정소송법」 제18조제2항ㆍ제3항 및 같은 법 제20조에도 불구하고 그 심사청구에 대한 결정을 통지받은 날부터 90일 내에 처분청을 당사자로 하여 제기하여야 한다.\n  <개정 2018. 12. 31.>\n  ⑦ 제5항과 제6항의 기간은 불변기간으로 한다.<개정 2018. 12. 31.>\n  ⑧ 수입물품에 부과하는 내국세등의 부과, 징수, 감면, 환급 등에 관한 세관장의 처분에 불복하는 자는 이 절에 따른 이의신청ㆍ심사청구 및 심판청구를 할 수 있다.<개정 2018. 12. 31.>\n  ⑨ 이 법이나 그 밖의 관세에 관한 법률 또는 조약에 따른 처분으로 권리나 이익을 침해받게 되는 제2차 납세의무자 등 대통령령으로 정하는 이해관계인은 그 처분에 대하여 이 절에 따른 심사청구 또는 심판청구를 하여 그 처분의 취소 또는 변경이나 그 밖에 필요한 처분을 청구할 수 있다. 이 경우 제2항부터 제4항까지 및 제8항을 준용한다.\n  <개정 2018. 12. 31.>\n  ⑩ 동일한 처분에 대하여는 심사청구와 심판청구를 중복하여 제기할 수 없다.<개정 2018. 12. 31.>\n  [전문개정 2010. 12. 30.]","D141-7":"제141조의7(납세증명서의 제출) ① 법 제116조의3제1항제1호에서 “대통령령으로 정하는 정부 관리기관”이란 「감사원법」 제22조제1항제3호 및 제4호에 따라 감사원의 회계검사의 대상이 되는 법인 또는 단체 등을 말한다.\n  ② 법 제116조의3제1항제2호에서 “체류기간 연장허가 등 대통령령으로 정하는 체류허가”란 다음 각 호의 어느 하나에 해당하는 경우를 말한다. <신설 2019. 2. 12.>\n    1. 「재외동포의 출입국과 법적 지위에 관한 법률」 제6조에 따른 국내거소신고\n    2. 「출입국관리법」 제20조에 따른 체류자격 외 활동허가\n    3. 「출입국관리법」 제21조에 따른 근무처 변경ㆍ추가에 관한 허가 또는 신고\n    4. 「출입국관리법」 제23조에 따른 체류자격부여\n    5. 「출입국관리법」 제24조에 따른 체류자격 변경허가\n    6. 「출입국관리법」 제25조에 따른 체류기간 연장허가\n    7. 「출입국관리법」 제31조에 따른 외국인등록\n  ③ 법 제116조의3에 따른 납세증명서의 내용과 납세증명서의 제출 등에 관하여는 「국세징수법」 제107조제2항(각 호 외의 부분 중 지정납부기한 연장 부분 및 제1호는 제외한다), 같은 법 시행령 제90조, 제91조, 제93조 및 제94조(제1호는 제외한다)를 준용한다. 이 경우 「국세징수법 시행령」 제93조 중 “국세청장 또는 관할 세무서장에게 조회(국세청장에게 조회하는 경우에는 국세정보통신망을 통한 방법으로 한정한다)”는 “관세청장 또는 세관장에게 조회”로 본다. <개정 2019. 2. 12., 2021. 2. 17.>\n  [본조신설 2015. 2. 6.]\n  [제141조의4에서 이동, 종전 제141조의7은 제141조의10으로 이동 <2023. 2. 28.>]","R62-0":"제62조(국제항이 아닌 지역에 대한 출입허가수수료) ①법 제134조제2항에 따라 국제항이 아닌 지역에 출입하기 위하여 내야 하는 수수료는  다음 표에 따라 계산하되, 산정된 금액이 1만원에 미달하는 경우에는 1만원으로 한다. 이 경우 수수료의 총액은 50만원을 초과하지 못한다. <개정 2012. 2. 28., 2018. 3. 21., 2021. 3. 16.>\n  <img alt=\"구분 출입 횟수 기준 적용 무게 기준 수수료&#10;국제무역선 1회 해당 선박의 순톤수 1톤 100원&#10;국제무역기 1회 해당 항공기의 자체무게 1톤 1천2백원\" src=\"/LSW/flDownload.do?flSeq=97484189\" />\n  ②세관장은 다음 각 호의 어느 하나에 해당하는 사유가 있는 경우에는 제1항에 따른 출입허가수수료를 징수하지 않는다. <개정 2013. 2. 23., 2021. 3. 16.>\n    1. 법령의 규정에 의하여 강제로 입항하는 경우\n    2. 급병환자, 항해중 발견한 밀항자, 항해중 구조한 조난자ㆍ조난선박ㆍ조난화물 등의 하역 또는 인도를 위하여 일시입항하는 경우\n    3. 위험물품ㆍ오염물품 기타 이에 준하는 물품의 취급, 유조선의 청소 또는 가스발생선박의 가스제거작업을 위하여 법령 또는 권한 있는 행정관청이 정하는 일정한 장소에 입항하는 경우\n    4. 국제항의 협소 등 입항여건을 고려하여 관세청장이 정하는 일정한 장소에 입항하는 경우\n  ③ 세관장은 영 제156조제1항제3호 기간의 개시일까지 해당 출입허가를 취소한 경우에는 제1항에 따라 징수한 수수료를 반환한다. <개정 2013. 2. 23.>\n  [제목개정 2021. 3. 16.]","D95-2":"제95조의2(준용규정) 법 제79조제1항에 따른 대항조치에 관하여는 제86조를 준용한다.\n  [본조신설 2026. 4. 3.]","R52-0":"제52조(재수출감면 및 가산세징수 대상물품) 법 제98조제1항의 규정에 의하여 관세가 감면되거나 동조제2항의 규정에 의하여 가산세가 징수되는 물품은 다음 각호의 요건을 갖춘 물품으로서 국내제작이 곤란함을 당해 물품의 생산에 관한 업무를 관장하는 중앙행정기관의 장 또는 그 위임을 받은 자가 확인하고 추천하는 기관 또는 기업이 수입하는 물품에 한한다. <개정 2002. 5. 10., 2005. 2. 11.>\n    1. 「법인세법 시행규칙」 제15조의 규정에 의한 내용연수가 5년(금형의 경우에는 2년) 이상인 물품\n    2. 개당 또는 셋트당 관세액이 500만원 이상인 물품","L157-0":"제157조(물품의 반입ㆍ반출) ① 보세구역에 물품을 반입하거나 반출하려는 자는 대통령령으로 정하는 바에 따라 세관장에게 신고하여야 한다.\n  ② 제1항에 따라 보세구역에 물품을 반입하거나 반출하려는 경우에는 세관장은 세관공무원을 참여시킬 수 있으며, 세관공무원은 해당 물품을 검사할 수 있다.\n  ③ 세관장은 보세구역에 반입할 수 있는 물품의 종류를 제한할 수 있다.\n  [전문개정 2010. 12. 30.]","L208-0":"제208조(매각대상 및 매각절차) ① 세관장은 보세구역에 반입한 외국물품의 장치기간이 지나면 그 사실을 공고한 후 해당 물품을 매각할 수 있다. 다만, 다음 각 호의 어느 하나에 해당하는 물품은 기간이 지나기 전이라도 공고한 후 매각할 수 있다. <개정 2022. 12. 31.>\n    1. 살아 있는 동식물\n    2. 부패하거나 부패할 우려가 있는 것\n    3. 창고나 다른 외국물품에 해를 끼칠 우려가 있는 것\n    4. 기간이 지나면 사용할 수 없게 되거나 상품가치가 현저히 떨어질 우려가 있는 것\n    5. 관세청장이 정하는 물품 중 화주가 요청하는 것\n    6. 제26조에 따른 강제징수, 「국세징수법」 제30조에 따른 강제징수 및 「지방세징수법」 제39조의2에 따른 체납처분을 위하여 세관장이 압류한 수입물품(제2조제4호가목의 외국물품으로 한정한다)\n  ② 장치기간이 지난 물품이 제1항 각 호의 어느 하나에 해당하는 물품으로서 급박하여 공고할 여유가 없을 때에는 매각한 후 공고할 수 있다.\n  ③ 매각된 물품의 질권자나 유치권자는 다른 법령에도 불구하고 그 물품을 매수인에게 인도하여야 한다.\n  ④ 세관장은 제1항에 따른 매각을 할 때 다음 각 호의 어느 하나에 해당하는 경우에는 대통령령으로 정하는 기관(이하 이 절에서 “매각대행기관”이라 한다)에 이를 대행하게 할 수 있다.<개정 2021. 12. 21.>\n    1. 신속한 매각을 위하여 사이버몰 등에서 전자문서를 통하여 매각하려는 경우\n    2. 매각에 전문지식이 필요한 경우\n    3. 그 밖에 특수한 사정이 있어 직접 매각하기에 적당하지 아니하다고 인정되는 경우\n  ⑤ 제4항에 따라 매각대행기관이 매각을 대행하는 경우(제211조제6항에 따라 매각대금의 잔금처리를 대행하는 경우를 포함한다)에는 매각대행기관의 장을 세관장으로 본다.\n  ⑥ 세관장은 제4항에 따라 매각대행기관이 매각을 대행하는 경우에는 매각대행에 따른 실비 등을 고려하여 재정경제부령으로 정하는 바에 따라 수수료를 지급할 수 있다.<개정 2025. 10. 1.>\n  ⑦ 삭제<2016. 12. 20.>\n  ⑧ 제4항에 따라 매각대행기관이 대행하는 매각에 필요한 사항은 대통령령으로 정한다.\n  [전문개정 2010. 12. 30.]","D141-2":"제141조의2(과세정보의 제공 기관 및 범위) ① 법 제116조제1항제5호나목에서 “대통령령으로 정하는 공공기관”이란 다음 각 호의 어느 하나에 해당하는 기관을 말한다. <개정 2024. 4. 30.>\n    1. 「기술보증기금법」에 따른 기술보증기금\n    2. 「농촌진흥법」 제33조에 따른 한국농업기술진흥원\n    3. 「대한무역투자진흥공사법」에 따른 대한무역투자진흥공사\n    4. 「무역보험법」 제37조에 따른 한국무역보험공사\n    5. 「산업기술혁신 촉진법」 제39조에 따른 한국산업기술기획평가원\n    6. 「신용보증기금법」에 따른 신용보증기금\n    7. 「정부출연연구기관 등의 설립ㆍ운영 및 육성에 관한 법률」에 따른 한국해양수산개발원\n    8. 「중소기업진흥에 관한 법률」 제68조에 따른 중소벤처기업진흥공단\n    9. 「한국농수산식품유통공사법」에 따른 한국농수산식품유통공사\n    10. 「한국해양진흥공사법」에 따른 한국해양진흥공사\n    11. 그 밖에 「공공기관의 운영에 관한 법률」에 따른 공공기관으로서 공공기관이 수행하는 급부ㆍ지원사업 등의 대상자 선정 및 자격의 조사ㆍ심사를 위하여 과세정보(납세자가 법에서 정한 납세의무를 이행하기 위하여 제출한 자료나 관세의 부과ㆍ징수 또는 통관을 목적으로 업무상 취득한 자료 등을 말한다. 이하 같다)가 필요하다고 관세청장이 정하여 고시하는 공공기관\n  ② 법 제116조제1항제5호라목에서 “대통령령으로 정하는 자”란 다음 각 호의 어느 하나에 해당하는 기관 또는 법인ㆍ단체를 말한다.\n    1. 법 제116조제1항제5호가목 및 나목에 해당하는 자의 급부ㆍ지원 등의 대상자 선정 및 그 자격의 조사ㆍ심사 업무를 위임 또는 위탁받아 수행하는 기관 또는 법인ㆍ단체\n    2. 법 제116조제1항제5호가목 및 나목에 해당하는 자가 급부ㆍ지원 등의 업무를 수행하기 위하여 출연ㆍ보조하는 기관 또는 법인ㆍ단체로서 관세청장이 정하여 고시하는 기관 또는 법인ㆍ단체\n    3. 그 밖에 기업의 경쟁력 강화, 산업발전 및 무역진흥을 위한 급부ㆍ지원 등의 업무를 수행하는 비영리법인으로서 급부ㆍ지원 등의 대상자 선정 및 자격의 조사ㆍ심사를 위하여 과세정보가 필요하다고 관세청장이 정하여 고시하는 법인\n  ③ 세관공무원이 법 제116조제2항에 따라 제공할 수 있는 과세정보의 구체적인 범위는 별표 2의2와 같다.\n  [본조신설 2023. 2. 28.]\n  [종전 제141조의2는 제141조의5로 이동 <2023. 2. 28.>]","D219-0":"제219조(물품의 유치 및 예치와 해제) ① 법 제206조제1항제2호라목에서 “대통령령으로 정하는 경우”란 다음 각 호의 경우를 말한다. <신설 2021. 2. 17.>\n    1. 해당 물품에 대해 식품의약품안전처장 등 관계 기관의 장으로부터 부적합 통보 또는 통관 제한 요청을 받은 경우\n    2. 성분 또는 규격 등이 불명확한 물품으로서 식품의약품안전처 등 관계 기관의 확인 또는 법 제265조의2에 따른 물품분석이 필요한 경우\n    3. 그 밖에 유해 성분이 포함된 식품ㆍ의약품 등 세관장이 사회안전 또는 국민보건을 위해 유치가 필요하다고 인정하는 경우\n  ②세관장이 법 제206조의 규정에 의하여 물품을 유치 또는 예치한 때에는 다음 각호의 사항을 기재한 유치증 또는 예치증을 교부하여야 한다. <개정 2021. 2. 17.>\n    1. 당해 물품의 포장의 종류ㆍ개수ㆍ품명ㆍ규격 및 수량\n    2. 유치사유 또는 예치사유\n    3. 보관장소\n  ③유치를 해제하거나 예치물품을 반환받으려는 자는 제2항에 따라 교부받은 유치증 또는 예치증을 세관장에게 제출해야 한다. <개정 2021. 2. 17.>","D118-0":"제118조(변질ㆍ손상 등의 관세경감액) ①법 제100조의 규정에 의하여 경감하는 관세액은 다음 각호의 관세액중 많은 금액으로 한다.\n    1. 수입물품의 변질ㆍ손상 또는 사용으로 인한 가치의 감소에 따르는 가격의 저하분에 상응하는 관세액\n    2. 수입물품의 관세액에서 그 변질ㆍ손상 또는 사용으로 인한 가치의 감소후의 성질 및 수량에 의하여 산출한 관세액을 공제한 차액\n  ②제1항의 변질ㆍ손상 또는 사용으로 인한 가치감소의 산정기준은 재정경제부령으로 정할 수 있다. <개정 2020. 10. 7., 2025. 12. 30.>","R63-2":"제63조의2(반복운송 도로차량의 신고) 법 제150조제3항에 따른 도로차량을 운행하려는 운전자는 다음 각 호의 사항을 기재한 신고서를 세관장에게 제출하여야 한다.\n    1. 차량의 회사명ㆍ종류 및 차량등록번호\n    2. 차량의 출발지, 경유지, 최종목적지, 최초 출발일시, 최종 도착일시 및 총운행횟수\n    3. 운송대상 물품의 내용 및 총중량\n  [본조신설 2007. 5. 29.]","L38-4":"제38조의4(수입물품의 과세가격 조정에 따른 경정) ① 납세의무자는 「국제조세조정에 관한 법률」 제7조제1항에 따라 관할 지방국세청장 또는 세무서장이 해당 수입물품의 거래가격을 조정하여 과세표준 및 세액을 결정ㆍ경정 처분하거나 같은 법 제14조제3항(일방적 사전승인의 대상인 경우에 한정한다)에 따라 국세청장이 해당 수입물품의 거래가격과 관련하여 소급하여 적용하도록 사전승인을 함에 따라 그 거래가격과 이 법에 따라 신고납부ㆍ경정한 세액의 산정기준이 된 과세가격 간 차이가 발생한 경우에는 그 결정ㆍ경정 처분 또는 사전승인이 있음을 안 날(처분 또는 사전승인의 통지를 받은 경우에는 그 받은 날)부터 3개월 또는 최초로 납세신고를 한 날부터 5년 내에 대통령령으로 정하는 바에 따라 세관장에게 세액의 경정을 청구할 수 있다. <개정 2014. 1. 1., 2014. 12. 23., 2017. 12. 19., 2020. 12. 22.>\n  ② 제1항에 따른 경정청구를 받은 세관장은 대통령령으로 정하는 바에 따라 해당 수입물품의 거래가격 조정방법과 계산근거 등이 제30조부터 제35조까지의 규정에 적합하다고 인정하는 경우에는 세액을 경정할 수 있다.\n  ③ 세관장은 제1항에 따른 경정청구를 받은 날부터 2개월 내에 세액을 경정하거나 경정하여야 할 이유가 없다는 뜻을 청구인에게 통지하여야 한다.\n  ④ 제3항에 따른 세관장의 통지에 이의가 있는 청구인은 그 통지를 받은 날(2개월 내에 통지를 받지 못한 경우에는 2개월이 지난 날)부터 30일 내에 재정경제부장관에게 국세의 정상가격과 관세의 과세가격 간의 조정을 신청할 수 있다. 이 경우 「국제조세조정에 관한 법률」 제20조를 준용한다.<개정 2020. 6. 9., 2020. 12. 22., 2025. 10. 1.>\n  ⑤ 청구인은 제3항에 따라 2개월 이내에 통지를 받지 못한 경우에는 그 2개월이 되는 날의 다음 날부터 제5장에 따른 이의신청, 심사청구, 심판청구 또는 「감사원법」에 따른 심사청구를 할 수 있다.<신설 2016. 12. 20.>\n  ⑥ 세관장은 제2항에 따라 세액을 경정하기 위하여 필요한 경우에는 관할 지방국세청장 또는 세무서장과 협의할 수 있다.<개정 2016. 12. 20.>\n  [본조신설 2011. 12. 31.]","D71-10":"제71조의10(우회덤핑에 대한 덤핑방지관세의 부과) ① 법 제56조의2에 따른 우회덤핑 물품에 대한 덤핑방지관세의 부과는 법 제51조 및 이 영 제65조에 따라 해당 덤핑방지관세물품에 적용되는 공급자 또는 공급국별 덤핑방지관세율이나 기준수입가격에 따른다. 다만, 정당한 사유 없이 제71조의9제1항에 따라 준용되는 제64조제1항에 따른 자료제출 요청에 응하지 않거나 같은 조 제4항에 따라 자료의 공개를 거부하는 경우 또는 그 밖의 사유로 조사 또는 자료의 검증이 곤란한 공급자에 대해서는 덤핑방지관세물품에 부과되는 덤핑방지관세율 또는 기준수입가격을 초과하지 않는 범위에서 별도로 정하여 부과할 수 있다.\n  ② 법 제56조의2제3항에 따른 우회덤핑에 대한 조사의 개시일은 제71조의5제3항 전단 및 제71조의6제4항에 따른 관보게재일로 한다.\n  [본조신설 2024. 2. 29.]","L268-0":"제268조(명예세관원) ① 관세청장은 밀수감시단속 활동의 효율적인 수행을 위하여 필요한 경우에는 수출입 관련 분야의 민간종사자 등을 명예세관원으로 위촉하여 다음 각 호의 활동을 하게 할 수 있다.\n    1. 공항ㆍ항만에서의 밀수 감시\n    2. 정보 제공과 밀수 방지의 홍보\n  ② 제1항에 따른 명예세관원의 자격요건, 임무, 그 밖에 필요한 사항은 재정경제부령으로 정한다.<개정 2025. 10. 1.>\n  [전문개정 2010. 12. 30.]","L39-0":"제39조(부과고지) ① 다음 각 호의 어느 하나에 해당하는 경우에는 제38조에도 불구하고 세관장이 관세를 부과ㆍ징수한다. <개정 2011. 12. 31., 2024. 12. 31., 2025. 3. 14., 2025. 10. 1.>\n    1. 제16조제1호부터 제6호까지 및 제8호부터 제11호까지에 해당되어 관세를 징수하는 경우\n    2. 보세건설장에서 건설된 시설로서 제248조에 따라 수입신고가 수리되기 전에 가동된 경우\n    3. 보세구역(제156조제1항에 따라 보세구역 외 장치를 허가받은 장소를 포함한다)에 반입된 물품이 제248조제3항을 위반하여 수입신고가 수리되기 전에 반출된 경우\n    4. 납세의무자가 관세청장이 정하는 사유로 과세가격이나 관세율 등을 결정하기 곤란하여 부과고지를 요청하는 경우\n    5. 제253조에 따라 즉시 반출한 물품을 같은 조 제3항의 기간 내에 수입신고를 하지 아니하여 관세를 징수하는 경우\n    6. 그 밖에 제38조에 따른 납세신고가 부적당한 것으로서 재정경제부령으로 정하는 경우\n  ② 세관장은 과세표준, 세율, 관세의 감면 등에 관한 규정의 적용 착오 또는 그 밖의 사유로 이미 징수한 금액이 부족한 것을 알게 되었을 때에는 그 부족액을 징수한다.\n  ③ 제1항과 제2항에 따라 세관장이 관세를 징수하려는 경우에는 대통령령으로 정하는 바에 따라 납세의무자에게 납부고지를 하여야 한다.<개정 2020. 12. 22.>\n  [전문개정 2010. 12. 30.]","D258-2":"제258조의2(탁송품의 검사설비) ① 법 제254조의2제6항 단서에 따라 세관장이 탁송품 운송업자가 운영하는 보세창고 또는 시설(이하 이 조부터 제258조의4까지에서 “자체시설”이라 한다)에서 탁송품을 통관하는 경우 탁송품 운송업자가 갖추어야 할 검사설비는 다음 각 호와 같다. <개정 2015. 2. 6.>\n    1. X-Ray 검색기\n    2. 자동분류기\n    3. 세관직원전용 검사장소\n  ② 제1항에 따른 검사설비의 세부기준은 관세청장이 고시로 정한다.\n  [본조신설 2013. 2. 15.]","D248-2":"제248조의2(보세구역 반입 후 수출신고의 대상 등) ① 법 제243조제4항에서 “대통령령으로 정하는 물품”이란 다음 각 호의 어느 하나에 해당하는 물품으로서 관세청장이 정하여 고시하는 물품을 말한다. <개정 2019. 9. 24.>\n    1. 도난우려가 높은 물품 등 국민의 재산권 보호를 위하여 수출관리가 필요한 물품\n    2. 고세율 원재료를 제조ㆍ가공하여 수출하는 물품 등 부정환급 우려가 높은 물품\n    3. 국민보건이나 사회안전 또는 국제무역질서 준수 등을 위해 수출관리가 필요한 물품\n  ② 제1항에도 불구하고 법 제255조의2제1항에 따라 수출입 안전관리 우수업체로 공인된 업체가 수출하는 물품은 법 제243조제4항에 따라 관세청장이 정하는 장소에 반입한 후 수출의 신고를 하는 물품(이하 이 조에서 “반입 후 신고물품”이라 한다)에서 제외할 수 있다. <개정 2022. 2. 15.>\n  ③ 반입 후 신고물품의 반입절차 및 그 밖에 필요한 사항은 관세청장이 정하여 고시한다.\n  [본조신설 2017. 3. 27.]","L240-4":"제240조의4(무역원활화 기본계획의 수립 및 시행) ① 재정경제부장관은 「세계무역기구 설립을 위한 마라케쉬협정」에 따라 이 법 및 관련법에서 정한 통관 등 수출입 절차의 원활화 및 이와 관련된 국제협력의 원활화(이하 “무역원활화”라 한다)를 촉진하기 위하여 다음 각 호의 사항이 포함된 무역원활화 기본계획(이하 “기본계획”이라 한다)을 수립ㆍ 시행하여야 한다. <개정 2025. 10. 1.>\n    1. 무역원활화 정책의 기본 방향에 관한 사항\n    2. 무역원활화 기반 시설의 구축과 운영에 관한 사항\n    3. 무역원활화의 환경조성에 관한 사항\n    4. 무역원활화와 관련된 국제협력에 관한 사항\n    5. 무역원활화와 관련된 통계자료의 수집ㆍ분석 및 활용방안에 관한 사항\n    6. 무역원활화 촉진을 위한 재원 확보 및 배분에 관한 사항\n    7. 그 밖에 무역원활화를 촉진하기 위하여 필요한 사항\n  ② 재정경제부장관은 기본계획을 시행하기 위하여 대통령령으로 정하는 바에 따라 무역원활화에 관한 업무를 수행하는 기관 또는 단체에 필요한 지원을 할 수 있다.<개정 2025. 10. 1.>\n  [본조신설 2014. 12. 23.]","D141-5":"제141조의5(고액ㆍ상습체납자 등의 명단공개) ①법 제116조의2제1항제1호 단서에서 “체납관세등에 대하여 이의신청ㆍ심사청구 등 불복청구가 진행 중이거나 체납액의 일정금액 이상을 납부한 경우 등 대통령령으로 정하는 사유”란 다음 각 호의 어느 하나에 해당하는 경우를 말한다. <개정 2011. 4. 1., 2020. 2. 11., 2021. 2. 17., 2024. 2. 29., 2026. 2. 27.>\n    1. 다음 계산식에 따라 계산한 체납액 납부비율이 100분의 50 이상인 경우\n  <img alt=\"@@LATEX@@체납액납부비율 = frac{B + C}{A + B}@@/LATEX@@&#10;&#10;A: 명단공개 예정일이 속하는 연도의 직전 연도 12월 31일 당시 명단공개 대상예정자의 체납액&#10;B: 명단공개 예정일이 속하는 연도의 직전 2개 연도 동안 명단공개 대상예정자가 납부한 체납액&#10;C: 명단공개 예정일이 속하는 연도의 1월 1일부터 명단공개 대상예정자의 명단공개 여부를 재심의하기 위한 법 제116조의2제4항에 따른 관세정보위원회 회의 개최일 전날까지 해당 명단공개 대상예정자가 납부한 체납액\" src=\"/LSW/flDownload.do?flSeq=161838037\" />\n    2. 「채무자 회생 및 파산에 관한 법률」 제243조에 따른 회생계획인가의 결정에 따라 체납된 세금의 징수를 유예받고 그 유예기간 중에 있거나 체납된 세금을 회생계획의 납부일정에 따라 납부하고 있는 경우\n    3. 재산상황, 미성년자 해당여부 및 그 밖의 사정 등을 고려할 때 법 제116조의2제2항에 따른 관세정보위원회가 공개할 실익이 없거나 공개하는 것이 부적절하다고 인정하는 경우\n  ② 법 제116조의2제1항제2호 단서에서 “제2항에 따른 관세정보위원회가 공개할 실익이 없거나 공개하는 것이 부적절하다고 인정하는 경우 등 대통령령으로 정하는 사유”란 법 제116조의2제2항에 따른 관세정보위원회가 공개할 실익이 없거나 공개하는 것이 부적절하다고 인정하는 경우를 말한다. <신설 2024. 2. 29.>\n  ③관세청장은 법 제116조의2제3항에 따라 공개대상예정자에게 명단공개 대상예정자임을 통지하는 때에는 그 체납하거나 포탈한 세금의 납부촉구와 명단공개 제외사유에 해당되는 경우 이에 관한 소명자료를 제출하도록 각각 안내하여야 한다. <개정 2024. 2. 29.>\n  ④체납자 명단공개시 공개할 사항은 체납자의 성명ㆍ상호(법인의 명칭을 포함한다)ㆍ연령ㆍ직업ㆍ주소, 체납액의 세목ㆍ납기 및 체납요지 등으로 하고, 체납자가 법인인 경우에는 법인의 대표자를 함께 공개한다. <개정 2024. 2. 29.>\n  ⑤ 법 제116조의2제1항제2호에 따라 관세포탈범의 명단을 공개할 때 공개할 사항은 관세포탈범의 성명ㆍ상호(법인의 명칭을 포함한다), 나이, 직업, 주소, 포탈관세액 등의 세목ㆍ금액, 판결 요지 및 형량 등으로 한다. 이 경우 관세포탈범의 범칙행위가 법 제279조제1항 본문에 해당하는 경우에는 해당 법인의 명칭ㆍ주소ㆍ대표자 또는 해당 개인의 성명ㆍ상호ㆍ주소를 함께 공개한다. <신설 2024. 2. 29.>\n  ⑥ 관세청장이 법 제116조의2제5항에 따라 명단을 관세청장이 지정하는 정보통신망 또는 관할 세관의 게시판에 게시하는 방법으로 공개하는 경우 그 공개 기간은 게시일부터 다음 각 호의 구분에 따른 기간이 만료하는 날까지로 한다. <신설 2024. 2. 29.>\n    1. 법 제116조의2제1항제2호에 따른 범죄(「특정범죄 가중처벌 등에 관한 법률」 제6조제8항에 따른 상습범은 제외한다)로 유죄판결이 확정된 자의 경우: 5년\n    2. 법 제116조의2제1항제2호에 따른 범죄(「특정범죄 가중처벌 등에 관한 법률」 제6조제8항에 따른 상습범만 해당한다)로 유죄판결이 확정된 자의 경우: 10년\n  ⑦ 제6항에도 불구하고 같은 항 각 호에 따른 자가 그 공개 기간의 만료일 현재 다음 각 호의 어느 하나에 해당하는 경우에는 해당 호에서 정하는 날까지 계속하여 공개한다. <신설 2024. 2. 29.>\n    1. 법에 따라 납부해야 할 세액, 과태료 또는 벌금을 납부하지 않은 경우: 그 세액 등을 완납하는 날\n    2. 형의 집행이 완료되지 않은 경우: 그 형의 집행이 완료되는 날\n  [본조신설 2006. 5. 22.]\n  [제목개정 2024. 2. 29.]\n  [제141조의2에서 이동, 종전 제141조의5는 제141조의8로 이동 <2023. 2. 28.>]","R82-0":"제82조(증명서 및 통계의 교부수수료) ①법 제322조제6항의 규정에 의한 세관사무에 관한 증명서, 통계 및 통관관련 세부통계자료의 교부수수료는 별표 7과 같다. <개정 2003. 2. 14., 2007. 12. 31.>\n  ② 법 제322조제5항에 따른 대행기관(이하 “대행기관”이라 한다)은 법 제322조제7항에 따라 교부수수료를 정하거나 변경하려는 경우에는 이해관계인의 의견을 수렴할 수 있도록 대행기관의 인터넷 홈페이지에 30일간 정하거나 변경하려는 교부수수료의 내용을 게시하여야 한다. 다만, 긴급하다고 인정되는 경우에는 대행기관의 인터넷 홈페이지에 그 사유를 소명하고 10일간 게시할 수 있다. <신설 2012. 2. 28.>\n  ③ 대행기관은 제2항에 따라 수렴된 의견을 고려하여 제1항에 따른 교부수수료의 범위에서 정한 교부수수료에 대하여 관세청장의 승인을 받아야 한다. 이 경우 대행기관은 원가명세서 등 교부수수료의 승인에 필요한 자료를 관세청장에게 제출하여야 한다. <신설 2012. 2. 28.>\n  ④ 대행기관은 제3항에 따라 승인받은 교부수수료의 금액을 대행기관의 인터넷 홈페이지를 통하여 공개하여야 한다. <신설 2012. 2. 28.>\n  ⑤ 관세청장은 3년마다 원가명세서, 대행기관의 교부수수료 수입ㆍ지출 내역 등을 검토하여 교부수수료 수준을 평가하여야 하며, 필요한 경우 적정한 교부수수료 수준을 통보할 수 있다. <신설 2012. 2. 28.>\n  ⑥ 일일자료교부 등 새로운 컴퓨터프로그램이나 전산처리설비를 필요로 하는 방식으로 교부신청을 하는 경우에는 추가되는 비용의 범위에서 제1항 및 제3항에 따른 교부수수료를 인상하여 적용할 수 있다. <신설 2007. 12. 31., 2012. 2. 28.>\n  ⑦정부 및 지방자치단체에 대하여는 제1항 및 제3항에 따른 교부수수료를 면제한다. <개정 2012. 2. 28.>\n  ⑧ 「공공기관의 운영에 관한 법률」 제4조에 따른 공공기관 및 영 제233조에 따라 관세청과 정보통신망을 연결하여 구비조건을 확인하고 있는 기관에 대하여는 관세청장이 정하는 바에 따라 제1항 및 제3항에 따른 교부수수료를 인하하거나 면제할 수 있다. <신설 2007. 12. 31., 2012. 2. 28.>\n  [제목개정 2003. 2. 14.]","D184-0":"제184조(자율관리보세구역의 지정 등) ①법 제164조제2항의 규정에 의한 자율관리보세구역의 지정을 받고자 하는 자는 다음 각호의 사항을 기재한 신청서에 채용된 법 제164조제3항에 따른 보세사(이하 “보세사”라 한다)의 보세사등록증과 관세청장이 정하는 서류를 첨부하여 세관장에게 지정신청을 하여야 한다. <개정 2018. 2. 13.>\n    1. 보세구역의 종류ㆍ명칭ㆍ소재지ㆍ구조ㆍ동수 및 면적\n    2. 장치하는 물품의 종류 및 수용능력\n  ② 법 제164조제6항에서 “이 법에 따른 의무를 위반하거나 세관감시에 지장이 있다고 인정되는 경우 등 대통령령으로 정하는 사유”란 다음 각 호의 어느 하나에 해당하는 경우를 말한다. <신설 2018. 2. 13.>\n    1. 법 제178조제1항 각 호의 어느 하나에 해당하는 경우\n    2. 자율관리보세구역 운영인이 보세사가 아닌 사람에게 보세사의 직무를 수행하게 한 경우\n    3. 그 밖에 세관감시에 지장이 있다고 인정되는 경우로서 관세청장이 정하여 고시하는 사유에 해당하는 경우\n  ③자율관리보세구역의 관리에 관하여 필요한 사항은 관세청장이 정한다. <개정 2018. 2. 13.>","L35-0":"제35조(합리적 기준에 따른 과세가격의 결정) ① 제30조부터 제34조까지에 규정된 방법으로 과세가격을 결정할 수 없을 때에는 대통령령으로 정하는 바에 따라 제30조부터 제34조까지에 규정된 원칙과 부합되는 합리적인 기준에 따라 과세가격을 결정한다.\n  ② 제1항에 따른 방법으로 과세가격을 결정할 수 없을 때에는 국제거래시세ㆍ산지조사가격을 조정한 가격을 적용하는 방법 등 거래의 실질 및 관행에 비추어 합리적으로 인정되는 방법에 따라 과세가격을 결정한다.\n  [전문개정 2013. 8. 13.]","R30-0":"제30조(가격수정 등의 약속) ① 영 제81조제1항에 따라 수출자가 재정경제부장관에게 약속을 제의하는 경우 그 약속에는 다음 각 호의 사항이 포함되어야 한다. <개정 2008. 12. 31., 2026. 1. 2.>\n    1. 수출자가 수출가격을 실질적 피해등이 제거될 수 있는 수준으로 인상한다는 내용\n    2. 약속수락전까지 계약되거나 선적되는 물품에 관한 내용\n    3. 형식ㆍ모양ㆍ명칭 등의 변경이나 저급품의 판매 등의 방법으로 약속의 이행을 회피하는 행위를 하지 아니하겠다는 내용\n    4. 제3국이나 제3자를 통한 판매 등의 방법으로 사실상 약속을 위반하지 아니하겠다는 내용\n    5. 수출국안에서의 판매물량 및 판매가격과 우리나라로의 수출물량 및 수출가격에 대하여 재정경제부장관에게 정기적으로 보고하겠다는 내용\n    6. 관련자료에 대한 검증을 허용하겠다는 내용\n    7. 그 밖의 상황변동의 경우 재정경제부장관의 요구에 대하여 재협의할 수 있다는 내용\n  ②재정경제부장관은 영 제81조제2항에 따라 약속을 수락하기 전에 무역위원회ㆍ관계행정기관의 장 및 이해관계인의 의견을 물을 수 있다. <개정 2008. 12. 31., 2026. 1. 2.>\n  ③ 재정경제부장관은 다음 각 호의 어느 하나에 해당하는 경우에는 영 제81조제2항 단서에 따라 약속을 수락하지 아니할 수 있다. <개정 2008. 12. 31., 2026. 1. 2.>\n    1. 다수의 수출자를 대리하여 약속을 제의한 자가 그 다수의 수출자간에 완전한 합의가 이루어졌음을 입증하지 못하는 경우\n    2. 약속의 이행여부에 대한 적절한 확인 또는 조사를 곤란하게 하는 조건이 있는 경우\n    3. 과거에 약속을 위반하였던 사실이 있는 등 약속을 수락할 수 없다고 인정되는 합리적인 사유가 있는 경우\n  ④영 제81조제3항에 따라 재정경제부장관으로부터 약속을 제의받은 수출자는 1개월 이내에 수락여부를 통보하여야 한다. <개정 2008. 12. 31., 2026. 1. 2.>","R62-3":"제62조의3(승객예약자료 제출시한) 법 제137조의2제1항에 따른 승객예약자료의 제출시한은 다음 각 호의 구분에 의한다.\n    1. 출항하는 선박 또는 항공기의 경우: 출항 후 3시간 이내\n    2. 입항하는 선박 또는 항공기의 경우: 입항 1시간 전까지. 다만, 운항예정시간이 3시간 이내인 경우에는 입항 30분 전까지 할 수 있다.\n  [본조신설 2009. 3. 26.]\n  [제62조의2에서 이동 <2016. 3. 9.>]","R69-4":"제69조의4(보세판매장 판매한도) ① 법 제196조제2항에 따라 설치된 보세판매장의 운영인이 외국에서 국내로 입국하는 사람에게 물품(술ㆍ담배ㆍ향수는 제외한다)을 판매하는 때에는 미화 800달러의 한도에서 판매해야 하며, 술ㆍ담배ㆍ향수는 제48조제3항에 따른 별도면세범위에서 판매할 수 있다. <개정 2020. 3. 13., 2022. 9. 6.>\n  ② 법 제196조제1항제1호 단서에 따라 입국장 인도장에서 인도하는 것을 조건으로 보세판매장의 운영인이 판매할 수 있는 물품의 한도는 제1항과 같다. <신설 2020. 3. 13.>\n  ③ 제1항 및 제2항에도 불구하고 제1항에 따른 입국장 면세점과 제2항에 따른 입국장 인도장이 동일한 입국경로에 함께 설치된 경우 보세판매장의 운영인은 입국장 면세점에서 판매하는 물품(술ㆍ담배ㆍ향수는 제외한다)과 입국장 인도장에서 인도하는 것을 조건으로 판매하는 물품(술ㆍ담배ㆍ향수는 제외한다)을 합하여 미화 800달러의 한도에서 판매해야 하며, 술ㆍ담배ㆍ향수는 제48조제3항에 따른 별도면세범위에서 판매할 수 있다. <신설 2020. 3. 13., 2022. 9. 6.>\n  [본조신설 2019. 3. 20.]","R7-8":"제7조의8(보세구역에서 거래되는 석유의 과세가격의 결정) ① 영 제29조제3항제7호에 따른 국제거래시세를 조정한 가격으로 보세구역에서 거래되는 석유의 과세가격은 보세구역에서 거래되어 판매된 가격을 알 수 있는 송품장, 계약서 등의 자료를 기초로 하여 결정할 수 있다.\n  ② 국내에서 발생한 하역비, 보관료 등의 비용이 제1항의 보세구역에서 거래되어 판매된 가격에 포함되어 있고, 이를 입증자료를 통해 구분할 수 있는 경우 그 비용을 해당 가격에서 공제할 수 있다.\n  [본조신설 2020. 10. 7.]","D236-8":"제236조의8(수출물품의 원산지증명서 등에 관한 조사 절차 등) ① 법 제233조제3항에 따른 현지조사는 서면조사만으로 원산지증명서 및 원산지증명서확인자료의 진위 여부, 정확성 등을 확인하기 곤란하거나 추가로 확인할 필요가 있는 경우에 할 수 있다. <개정 2018. 2. 13.>\n  ② 세관장은 서면조사 또는 현지조사를 하는 경우에는 재정경제부령으로 정하는 사항을 조사대상자에게 조사 시작 7일 전까지 서면으로 통지하여야 한다. <개정 2025. 12. 30.>\n  ③ 조사의 연기신청, 조사결과의 통지에 관하여는 법 제114조제2항 및 제115조를 준용한다.\n  ④ 조사결과에 대하여 이의가 있는 조사대상자는 조사결과를 통지받은 날부터 30일 이내에 다음 각 호의 사항이 적힌 신청서에 이의제기 내용을 확인할 수 있는 자료를 첨부하여 세관장에게 제출할 수 있다.\n    1. 이의를 제기하는 자의 성명과 주소 또는 거소\n    2. 제3항에 따른 조사결과통지서를 받은 날짜 및 조사결정의 내용\n    3. 해당 물품의 품명ㆍ규격ㆍ용도ㆍ수출자ㆍ생산자 및 수입자\n    4. 이의제기의 요지와 내용\n  ⑤ 세관장은 제4항에 따라 이의제기를 받은 날부터 30일 이내에 심사를 완료하고 그 결정내용을 통지하여야 한다.\n  ⑥ 세관장은 제4항에 따른 이의제기의 내용이나 절차에 결함이 있는 경우에는 20일 이내의 기간을 정하여 다음 각 호의 사항을 적은 문서로서 보정할 것을 요구할 수 있다. 다만, 보정할 사항이 경미한 경우에는 직권으로 보정할 수 있다.\n    1. 보정할 사항\n    2. 보정을 요구하는 이유\n    3. 보정할 기간\n    4. 그 밖의 필요한 사항\n  ⑦ 제6항 본문에 따른 보정기간은 제5항에 따른 결정기간에 산입하지 아니한다.\n  [본조신설 2011. 4. 1.]","D42-0":"제42조(관세체납정리위원회의 구성) ①법 제45조의 규정에 의하여 세관에 관세체납정리위원회(이하 “관세체납정리위원회”라 한다)를 둔다.\n  ②관세체납정리위원회는 위원장 1인을 포함한 5인 이상 7인 이내의 위원으로 구성한다.\n  ③관세체납정리위원회의 위원장은 세관장이 되며, 위원은 다음 각호의 자중에서 세관장이 임명 또는 위촉한다. <개정 2008. 2. 29.>\n    1. 세관공무원\n    2. 변호사ㆍ관세사ㆍ공인회계사ㆍ세무사\n    3. 상공계의 대표\n    4. 기획재정에 관한 학식과 경험이 풍부한 자\n  ④ 제3항제2호부터 제4호까지의 규정에 해당하는 위원의 임기는 2년으로 하되, 한번만 연임할 수 있다. 다만, 보궐위원의 임기는 전임위원 임기의 남은 기간으로 한다. <신설 2017. 3. 27., 2018. 2. 13.>","L189-0":"제189조(원료과세) ① 보세공장에서 제조된 물품을 수입하는 경우 제241조제1항에 따른 수입신고를 하기 전에 세관장에게 해당 물품의 원료인 외국물품에 대한 과세의 적용을 신청한 경우에는 제16조에도 불구하고 제186조에 따른 사용신고를 할 때의 그 원료의 성질 및 수량에 따라 관세를 부과한다. <개정 2025. 12. 23.>\n  ② 세관장은 대통령령으로 정하는 기준에 해당하는 보세공장에 대하여는 1년의 범위에서 원료별, 제품별 또는 보세공장 전체에 대하여 제1항에 따른 신청을 하게 할 수 있다.\n  [전문개정 2010. 12. 30.]","D73-0":"제73조(상계관세의 부과요청) ①법 제57조의 규정에 의한 실질적 피해등을 받은 국내산업에 이해관계가 있는 자 또는 당해 산업을 관장하는 주무부장관은 재정경제부령이 정하는 바에 따라 재정경제부장관에게 상계관세의 부과를 요청할 수 있으며, 이 요청은 무역위원회에 대한 상계관세의 부과에 필요한 조사신청으로 갈음한다. <개정 2008. 2. 29., 2025. 12. 30.>\n  ② 주무부장관은 제1항에 따라 재정경제부장관에게 상계관세 부과를 요청하기 전에 관세청장에게 해당 보조금등을 받은 물품의 수입사실에 관한 검토를 요청할 수 있다. <신설 2020. 12. 29., 2025. 12. 30.>\n  ③ 관세청장은 제2항에 따른 보조금등을 받은 물품의 수입사실에 관한 검토 요청이 없는 경우에도 보조금등을 받은 물품의 수입 우려가 있다고 판단되는 경우에는 해당 보조금등을 받은 물품의 수입사실 여부에 대하여 검토하고 그 결과를 주무부장관에게 통지할 수 있다. <신설 2020. 12. 29.>\n  ④법 제57조를 적용함에 있어서의 국내산업은 보조금등을 받은 물품과 동종물품의 국내생산사업(당해 수입물품의 수출국정부 또는 수출자 또는 수입자와 제23조제1항의 규정에 의한 특수관계에 있는 생산자에 의한 생산사업과 당해 수입물품의 수입자인 생산자로서 재정경제부령이 정하는 자에 의한 생산사업을 제외할 수 있다. 이하 이 항에서 같다)의 전부 또는 국내총생산량의 상당부분을 점하는 국내생산사업으로 한다. <개정 2008. 2. 29., 2020. 12. 29., 2025. 12. 30.>\n  ⑤제1항에서 “국내산업에 이해관계가 있는 자”라 함은 실질적 피해등을 받은 국내산업에 속하는 국내생산자와 이들을 구성원으로 하거나 이익을 대변하는 법인ㆍ단체 및 개인으로서 재정경제부령이 정하는 자를 말한다. <개정 2008. 2. 29., 2020. 12. 29., 2025. 12. 30.>\n  ⑥ 제1항에 따라 조사를 신청하려는 자는 다음 각 호의 자료를 무역위원회에 제출해야 한다. <개정 2020. 12. 29., 2025. 12. 30.>\n    1. 다음 각 목의 사항을 기재한 신청서 3부\n      가. 해당 물품의 품명ㆍ규격ㆍ특성ㆍ용도ㆍ생산자 및 생산량\n      나. 해당 물품의 수출국ㆍ수출자ㆍ수출실적 및 수출가능성과 우리나라의 수입자ㆍ수입실적 및 수입가능성\n      다. 해당 물품의 수출국에서의 공장도가격 및 시장가격과 우리나라로의 수출가격 및 제3국에의 수출가격\n      라. 국내의 동종물품의 품명ㆍ규격ㆍ특성ㆍ용도ㆍ생산자ㆍ생산량ㆍ공장도가격ㆍ시장가격 및 원가계산\n      마. 해당 물품의 수입으로 인한 관련 국내산업의 실질적 피해등\n      바. 수출국에서 해당 물품의 제조ㆍ생산 또는 수출에 관하여 지급한 보조금등의 내용과 이로 인한 해당 물품의 수출가격 인하효과\n      사. 국내의 동종물품 생산자들의 해당 조사신청에 대한 지지 정도\n      아. 신청서의 기재사항 및 첨부자료를 비밀로 취급할 필요가 있는 때에는 그 사유\n      자. 그 밖에 재정경제부장관이 필요하다고 인정하는 사항\n    2. 보조금등을 받은 물품의 수입사실과 해당 물품의 수입으로 인한 실질적 피해등의 사실에 관한 충분한 증빙자료 3부\n  ⑦ 무역위원회는 제6항에 따라 조사신청을 받은 사실을 재정경제부장관 및 관계 행정기관의 장과 해당 물품의 수출국 정부에 통보해야 한다. 이 경우 제6항 각 호의 자료는 제74조제1항에 따른 조사개시결정을 한 후에 통보해야 한다. <신설 2020. 12. 29., 2025. 12. 30.>","L277-0":"제277조(과태료) ① 제37조의4제1항 및 제2항에 따라 과세가격결정자료등의 제출을 요구받은 특수관계에 있는 자로서 제10조에서 정하는 정당한 사유 없이 제37조의4제4항 각 호의 어느 하나에 해당하는 행위를 한 자에게는 1억원 이하의 과태료를 부과한다. 이 경우 제276조는 적용되지 아니한다. <신설 2013. 1. 1., 2014. 12. 23., 2016. 12. 20., 2021. 12. 21., 2022. 12. 31.>\n  ② 제37조의4제7항을 위반한 자에게는 2억원 이하의 과태료를 부과한다. 이 경우 제276조는 적용되지 아니한다.\n  <신설 2021. 12. 21.>\n  ③ 다음 각 호의 어느 하나에 해당하는 자에게는 5천만원 이하의 과태료를 부과한다. 다만, 과실로 제2호에 해당하게 된 경우에는 400만원 이하의 과태료를 부과한다.<신설 2023. 12. 31.>\n    1. 세관공무원의 질문에 대하여 거짓의 진술을 하거나 그 직무의 집행을 거부 또는 기피한 자\n    2. 제200조제3항, 제203조제1항 또는 제262조에 따른 관세청장 또는 세관장의 조치를 위반하거나 검사를 거부ㆍ방해 또는 기피한 자\n    3. 제263조를 위반하여 서류의 제출ㆍ 보고 또는 그 밖에 필요한 사항에 관한 명령을 이행하지 아니하거나 거짓의 보고를 한 자\n    4. 제266조제1항에 따른 세관공무원의 자료 또는 물품의 제시요구 또는 제출요구를 거부한 자\n  ④ 다음 각 호의 어느 하나에 해당하는 자에게는 1천만원 이하의 과태료를 부과한다.<개정 2011. 12. 31., 2013. 1. 1., 2015. 12. 15., 2021. 12. 21., 2023. 12. 31.>\n    1. 제139조(제146조제1항에서 준용하는 경우를 포함한다), 제143조제1항(제146조제1항에서 준용하는 경우를 포함한다), 제152조제1항, 제155조제1항, 제156조제1항, 제159조제2항, 제160조제1항, 제161조제1항, 제186조제1항(제205조에서 준용하는 경우를 포함한다), 제192조(제205조에서 준용하는 경우를 포함한다), 제200조제1항, 제201조제1항ㆍ제3항, 제219조제2항 또는 제266조제2항을 위반한 자\n    2. 제187조제1항(제89조제5항에서 준용하는 경우를 포함한다) 또는 제195조제1항에 따른 허가를 받지 아니하거나 제202조제2항에 따른 신고를 하지 아니하고 보세공장ㆍ보세건설장ㆍ종합보세구역 또는 지정공장 외의 장소에서 작업을 한 자\n  ⑤ 다음 각 호의 어느 하나에 해당하는 자에게는 500만원 이하의 과태료를 부과한다.<개정 2013. 1. 1., 2017. 12. 19., 2021. 12. 21., 2023. 12. 31.>\n    1. 제240조의2제1항을 위반하여 유통이력을 신고하지 아니하거나 거짓으로 신고한 자\n    2. 제240조의2제2항을 위반하여 장부기록 자료를 보관하지 아니한 자\n    3. 제243조제4항을 위반하여 관세청장이 정하는 장소에 반입하지 아니하고 제241조제1항에 따른 수출의 신고를 한 자\n    4. 제327조의2제10항을 위반하여 한국관세정보원 또는 이와 유사한 명칭을 사용한 자\n  ⑥ 다음 각 호의 어느 하나에 해당하는 자에게는 200만원 이하의 과태료를 부과한다.<개정 2011. 7. 25., 2011. 12. 31., 2013. 1. 1., 2018. 12. 31., 2019. 12. 31., 2020. 12. 22., 2021. 12. 21., 2023. 12. 31., 2024. 12. 31.>\n    1. 특허보세구역의 특허사항을 위반한 운영인\n    2. 제38조제4항, 제83조제1항, 제107조제3항, 제135조제2항(제146조제1항에서 준용하는 경우를 포함한다), 제136조제3항(제146조제1항에서 준용하는 경우를 포함한다), 제140조제5항, 제141조제1호ㆍ제3호(제146조제1항에서 준용하는 경우를 포함한다), 제157조제1항, 제158조제2항ㆍ제6항, 제172조제3항, 제194조(제205조에서 준용하는 경우를 포함한다), 제196조의2제5항, 제198조제3항, 제199조제1항, 제202조제1항, 제214조, 제215조(제219조제4항 및 제221조제2항에서 준용하는 경우를 포함한다), 제216조제2항ㆍ제3항(제219조제4항 및 제221조제2항에서 준용하는 경우를 포함한다), 제221조제1항, 제222조제3항, 제225조제1항 후단 또는 제251조제1항을 위반한 자\n    3. 제83조제2항, 제88조제2항, 제97조제2항, 제102조제1항 및 제109조제1항을 위반한 자 중 해당 물품을 직접 수입한 경우 관세를 감면받을 수 있고 수입자와 동일한 용도에 사용하려는 자에게 양도한 자\n    4. 제135조제1항 또는 제137조의2제1항 각 호 외의 부분 후단을 위반한 자 중 과실로 여객명부 또는 승객예약자료를 제출하지 아니한 자\n    5. 제159조제6항, 제180조제3항(제205조에서 준용하는 경우를 포함한다), 제196조제4항, 제216조제1항(제219조제4항 및 제221조제2항에서 준용하는 경우를 포함한다), 제222조제4항, 제225조제2항, 제228조 또는 제266조제3항에 따른 관세청장 또는 세관장의 조치를 위반한 자\n    6. 제321조제2항제2호를 위반하여 운송수단에서 물품을 취급한 자\n    7. 보세구역에 물품을 반입하지 아니하고 거짓으로 제157조제1항에 따른 반입신고를 한 자\n  ⑦ 다음 각 호의 어느 하나에 해당하는 자에게는 100만원 이하의 과태료를 부과한다.<개정 2011. 12. 31., 2013. 1. 1., 2014. 1. 1., 2015. 12. 15., 2020. 6. 9., 2020. 12. 22., 2021. 12. 21., 2022. 12. 31., 2023. 12. 31.>\n    1. 적재물품과 일치하지 아니하는 적재화물목록을 작성하였거나 제출한 자. 다만, 다음 각 목의 어느 하나에 해당하는 자가 투입 및 봉인한 것이어서 적재화물목록을 제출한 자가 해당 적재물품의 내용을 확인하는 것이 불가능한 경우에는 해당 적재화물목록을 제출한 자는 제외한다.\n      가. 제276조제3항제1호에 해당하는 자\n      나. 적재물품을 수출한 자\n      다. 다른 선박회사ㆍ항공사 및 화물운송주선업자\n    2. 제12조제1항을 위반하여 신고필증을 보관하지 아니한 자\n    3. 제28조제2항에 따른 신고를 하지 아니한 자\n    4. 제107조제4항, 제108조제2항, 제138조제2항ㆍ제4항, 제141조제2호, 제157조의2, 제162조, 제179조제2항, 제182조제1항(제205조에서 준용하는 경우를 포함한다), 제183조제2항ㆍ제3항, 제184조(제205조에서 준용하는 경우를 포함한다), 제185조제2항(제205조에서 준용하는 경우를 포함한다), 제245조제3항 또는 제254조의2제2항 및 제3항을 위반한 자\n    5. 제160조제4항(제207조제2항에서 준용하는 경우를 포함한다)에 따른 세관장의 명령을 이행하지 아니한 자\n    6. 제177조제2항(제205조에서 준용하는 경우를 포함한다), 제180조제4항(제205조에서 준용하는 경우를 포함한다) 또는 제249조 각 호 외의 부분 단서에 따른 세관장의 명령이나 보완조치를 이행하지 아니한 자\n    7. 제180조제1항(제205조에서 준용하는 경우를 포함한다)ㆍ제2항(제89조제5항에서 준용하는 경우를 포함한다), 제193조(제205조에서 준용하는 경우를 포함한다) 또는 제203조제2항에 따른 세관장의 감독ㆍ검사ㆍ보고지시 등을 따르지 아니한 자\n  ⑧ 제1항부터 제7항까지의 규정에 따른 과태료는 대통령령으로 정하는 바에 따라 세관장이 부과ㆍ징수한다.<개정 2013. 1. 1., 2014. 1. 1., 2018. 12. 31., 2021. 12. 21., 2023. 12. 31.>\n  [전문개정 2010. 12. 30.]","L99-0":"제99조(재수입면세) 다음 각 호의 어느 하나에 해당하는 물품이 수입될 때에는 그 관세를 면제할 수 있다. <개정 2014. 1. 1., 2019. 12. 31., 2025. 10. 1.>\n    1. 우리나라에서 수출(보세가공수출을 포함한다)된 물품으로서 해외에서 제조ㆍ가공ㆍ수리 또는 사용(장기간에 걸쳐 사용할 수 있는 물품으로서 임대차계약 또는 도급계약 등에 따라 해외에서 일시적으로 사용하기 위하여 수출된 물품이나 박람회, 전시회, 품평회, 국제경기대회, 그 밖에 이에 준하는 행사에 출품 또는 사용된 물품 등 재정경제부령으로 정하는 물품의 경우는 제외한다)되지 아니하고 수출신고 수리일부터 2년 내에 다시 수입(이하 이 조에서 “재수입”이라 한다)되는 물품. 다만, 다음 각 목의 어느 하나에 해당하는 경우에는 관세를 면제하지 아니한다.\n      가. 해당 물품 또는 원자재에 대하여 관세를 감면받은 경우\n      나. 이 법 또는 「수출용원재료에 대한 관세 등 환급에 관한 특례법」에 따른 환급을 받은 경우\n      다. 이 법 또는 「수출용 원재료에 대한 관세 등 환급에 관한 특례법」에 따른 환급을 받을 수 있는 자 외의 자가 해당 물품을 재수입하는 경우. 다만, 재수입하는 물품에 대하여 환급을 받을 수 있는 자가 환급받을 권리를 포기하였음을 증명하는 서류를 재수입하는 자가 세관장에게 제출하는 경우는 제외한다.\n      라. 보세가공 또는 장치기간경과물품을 재수출조건으로 매각함에 따라 관세가 부과되지 아니한 경우\n    2. 수출물품의 용기로서 다시 수입하는 물품\n    3. 해외시험 및 연구를 목적으로 수출된 후 재수입되는 물품\n  [전문개정 2010. 12. 30.]","D283-3":"제283조의3(체납한 횟수 및 체납된 금액의 합계액의 계산) ① 법 제326조의2제3항의 체납한 횟수는 납부고지서 1통을 1회로 보아 계산한다.\n  ② 법 제326조의2제3항의 체납된 금액의 합계액은 다음 각 호의 금액을 합한 금액으로 한다.\n    1. 관세 및 내국세등\n    2. 관세 및 내국세등의 가산세\n    3. 관세 및 내국세등의 강제징수비\n  [본조신설 2023. 2. 28.]","D96-0":"제96조(간이세율의 적용) ①법 제81조의 규정에 의하여 간이세율(이하 “간이세율”이라 한다)을 적용하는 물품과 그 세율은 별표 2와 같다.\n  ②제1항의 규정에 불구하고 다음 각호의 물품에 대하여는 간이세율을 적용하지 아니한다. <개정 2001. 12. 31.>\n    1. 관세율이 무세인 물품과 관세가 감면되는 물품\n    2. 수출용원재료\n    3. 법 제11장의 범칙행위에 관련된 물품\n    4. 종량세가 적용되는 물품\n    5. 다음 각목의 1에 해당하는 물품으로서 관세청장이 정하는 물품\n      가. 상업용으로 인정되는 수량의 물품\n      나. 고가품\n      다. 당해 물품의 수입이 국내산업을 저해할 우려가 있는 물품\n      라. 법 제81조제4항의 규정에 의한 단일한 간이세율의 적용이 과세형평을 현저히 저해할 우려가 있는 물품\n    6. 화주가 수입신고를 할 때에 과세대상물품의 전부에 대하여 간이세율의 적용을 받지 아니할 것을 요청한 경우의 당해 물품","L106-2":"제106조의2(수입한 상태 그대로 수출되는 자가사용물품 등에 대한 관세 환급) ① 수입신고가 수리된 개인의 자가사용물품이 수입한 상태 그대로 수출되는 경우로서 다음 각 호의 어느 하나에 해당하는 경우에는 수입할 때 납부한 관세를 환급한다. 이 경우 수입한 상태 그대로 수출되는 경우의 기준은 대통령령으로 정한다. <개정 2021. 12. 21., 2022. 12. 31., 2025. 10. 1.>\n    1. 수입신고 수리일부터 6개월 이내에 보세구역 또는 「자유무역지역의 지정 및 운영에 관한 법률」에 따른 자유무역지역 중 관세청장이 수출물품을 일정기간 보관하기 위하여 필요하다고 인정하여 고시하는 장소에 반입하였다가 다시 수출하는 경우\n    2. 수입신고 수리일부터 6개월 이내에 관세청장이 정하는 바에 따라 세관장의 확인을 받고 다시 수출하는 경우\n    3. 제241조제2항에 따라 수출신고가 생략되는 탁송품 또는 우편물로서 재정경제부령으로 정하는 금액 이하인 물품을 수입신고 수리일부터 6개월 이내에 수출한 후 관세청장이 정하는 바에 따라 세관장의 확인을 받은 경우\n  ② 여행자가 제96조제2항에 따라 자진신고한 물품이 다음 각 호의 어느 하나에 해당하게 된 경우에는 자진신고할 때 납부한 관세를 환급한다.<개정 2021. 12. 21.>\n    1. 제143조제1항제2호에 따른 국제무역선 또는 국제무역기 안에서 구입한 물품이 환불된 경우\n    2. 제196조에 따른 보세판매장에서 구입한 물품이 환불된 경우\n  ③ 제1항 및 제2항에 따른 관세 환급에 관하여는 제46조, 제47조 및 제106조제2항ㆍ제5항을 준용한다.<개정 2019. 12. 31.>\n  [본조신설 2015. 12. 15.]\n  [제목개정 2019. 12. 31.]","D204-0":"제204조(외국물품과 내국물품의 혼용 비율에 따른 과세 적용 승인) ①법 제188조 단서에 따른 승인을 얻고자 하는 자는 다음 각 호의 사항을 기재한 신청서를 세관장에게 제출해야 한다. <개정 2026. 2. 27.>\n    1. 혼용 외국물품 및 내국물품의 기호ㆍ번호ㆍ품명ㆍ규격별 수량 및 손모율\n    2. 승인을 얻고자 하는 보세작업기간 및 사유\n  ②제1항의 규정에 의한 승인을 할 수 있는 경우는 작업의 성질ㆍ공정 등에 비추어 당해 작업에 사용되는 외국물품과 내국물품의 품명ㆍ규격별 수량과 그 손모율이 확인되고, 제4항의 규정에 의한 과세표준이 결정될 수 있는 경우에 한한다.\n  ③세관장은 제1항의 규정에 의한 승인을 얻은 사항중 혼용하는 외국물품 및 내국물품의 품명 및 규격이 각각 동일하고, 손모율에 변동이 없는 동종의 물품을 혼용하는 경우에는 새로운 승인신청을 생략하게 할 수 있다.\n  ④법 제188조 단서에 따라 외국물품과 내국물품의 혼용 비율에 따른 과세 적용 승인을 받은 때에는 해당 혼용으로 생긴 제품중에서 그 원료 또는 재료중 외국물품의 가격(종량세물품인 경우에는 수량을 말한다)이 차지하는 비율에 상응하는 분을 외국으로부터 우리나라에 도착된 물품으로 본다. <개정 2026. 2. 27.>\n  [제목개정 2026. 2. 27.]","D122-0":"제122조(폐기물품의 관세환급) ①법 제106조제3항의 규정에 의하여 물품의 폐기의 승인을 얻고자 하는 자는 다음 각호의 사항을 기재한 신청서에 당해 물품의 수입신고필증 또는 이에 갈음하는 세관의 증명서와 당해 물품의 폐기가 부득이한 것을 증빙하는 서류를 첨부하여 세관장에게 제출하여야 한다.\n    1. 당해 물품의 품명ㆍ규격ㆍ수량ㆍ수입신고수리 연월일ㆍ수입신고번호 및 장치장소\n    2. 폐기방법ㆍ폐기예정연월일 및 폐기예정장소\n    3. 폐기사유\n  ②제1항의 규정에 의하여 승인을 얻어 폐기한 물품에 대하여 법 제106조제3항의 규정에 의하여 관세를 환급받고자 하는 자는 다음 각호의 사항을 기재한 신청서에 제1항의 규정에 의한 폐기승인서를 첨부하여 세관장에게 제출하여야 한다.\n    1. 당해 물품의 품명ㆍ규격ㆍ수량ㆍ수입신고수리 연월일ㆍ수입신고번호 및 장치장소\n    2. 폐기연월일\n    3. 그 폐기에 의하여 생긴 잔존물의 품명ㆍ규격 및 수량\n  ③제2항의 규정에 의하여 환급하는 관세액은 그 물품에 대하여 이미 납부한 그 관세액으로 한다. 다만, 제2항제3호의 규정에 의한 잔존물에 대하여는 그 폐기한 때의 당해 잔존물의 성질ㆍ수량 및 가격에 의하여 부과될 관세액을 공제한 금액으로 한다.","L103-0":"제103조(관세감면물품의 용도 외 사용) ① 법령, 조약, 협정 등에 따라 관세를 감면받은 물품을 감면받은 용도 외의 다른 용도로 사용하거나 감면받은 용도 외의 다른 용도로 사용하려는 자에게 양도하는 경우(해당 물품을 다른 용도로 사용하는 자나 해당 물품을 다른 용도로 사용하기 위하여 양수하는 자가 그 물품을 다른 용도로 사용하기 위하여 수입하는 경우에는 그 물품에 대하여 법령 또는 조약, 협정 등에 따라 관세를 감면받을 수 있는 경우로 한정한다)에는 대통령령으로 정하는 바에 따라 제83조제3항, 제88조제3항, 제97조제3항, 제98조제2항, 제102조제2항 또는 제109조제2항에 따라 징수하여야 하는 관세를 감면할 수 있다. 다만, 이 법 외의 법령, 조약, 협정 등에 따라 그 감면된 관세를 징수할 때에는 그러하지 아니하다. <개정 2011. 12. 31.>\n  ② 제98조제2항과 제102조제1항에도 불구하고 제90조, 제93조, 제95조 또는 제98조에 따라 관세를 감면받은 물품은 「대ㆍ중소기업 상생협력 촉진에 관한 법률」 제2조제4호에 따른 수탁ㆍ위탁거래의 관계에 있는 기업에 양도할 수 있으며, 이 경우 제98조제2항과 제102조제2항에 따라 징수할 관세를 감면할 수 있다. 다만, 이 법 외의 법령, 조약, 협정 등에 따라 그 감면된 관세를 징수할 때에는 그러하지 아니하다.\n  ③ 제1항과 제2항에 따라 관세를 감면받은 경우 그 사후관리기간은 당초의 수입신고 수리일부터 계산한다.\n  [전문개정 2010. 12. 30.] 제104조 삭제 <2011. 12. 31.>","R12-0":"제12조(덤핑 및 실질적 피해등의 조사개시) ①영 제60조제1항제1호 및 제3호의 규정에 의하여 조사대상물품 또는 공급자를 선정함에 있어서는 이용가능한 자료를 기초로 통계적으로 유효한 표본추출방법(공급자의 수 또는 물품의 수를 수입량의 비율이 큰 순서대로 선정하는 방법 등을 포함한다)을 사용함을 원칙으로 한다.\n  ②영 제60조제2항제3호에서 “재정경제부령이 정하는 기준”이란 다음 각 호의 요건을 모두 갖추는 것을 말한다. <개정 2008. 12. 31., 2024. 3. 22., 2026. 1. 2.>\n    1. 덤핑차액: 덤핑가격의 100분의 2 이상인 경우\n    2. 덤핑물품 수입량: 다음 각 목의 어느 하나에 해당하는 경우\n      가. 특정 공급국으로부터의 수입량이 동종물품의 국내수입량의 100분의 3 이상인 경우\n      나. 동종물품의 국내수입량의 100분의 3 미만의 점유율을 보이는 공급국들로부터의 수입량의 합계가 국내수입량의 100분의 7을 초과하는 경우\n  ③영 제60조제2항제4호에서 “재정경제부령이 정하는 기준”이란 다음 각 호의 어느 하나에 해당하는 경우를 말한다. <개정 2008. 12. 31., 2024. 3. 22., 2026. 1. 2.>\n    1. 영 제59조제1항에 의한 부과요청에 대하여 찬성 또는 반대의사를 표시한 국내생산자들의 동종물품 국내생산량합계 중 찬성의사를 표시한 국내생산자들의 생산량합계가 100분의 50을 초과하는 경우\n    2. 영 제59조제1항에 의한 부과요청에 대하여 찬성의사를 표시한 국내생산자들의 생산량합계가 동종물품 국내총생산량의 100분의 25 이상인 경우","D125-0":"제125조(천재ㆍ지변 등으로 인한 관세의 분할납부) ①법 제107조제1항의 규정에 의하여 관세를 분할납부하고자 하는 자는 다음의 각호의 사항을 기재한 신청서를 납부기한내에 세관장에게 제출하여야 한다.\n    1. 납세의무자의 성명ㆍ주소 및 상호\n    2. 분할납부를 하고자 하는 세액 및 당해 물품의 신고일자ㆍ신고번호ㆍ품명ㆍ규격ㆍ수량ㆍ가격\n    3. 분할납부하고자 하는 사유 및 기간\n    4. 분할납부금액 및 횟수\n  ②세관장은 제1항의 규정에 의하여 분할납부를 하게 하는 경우에는 제2조의 규정을 준용한다.","D233-0":"제233조(구비조건의 확인) 법 제226조제2항의 규정에 의한 허가ㆍ승인ㆍ표시 기타 조건(이하 이 조에서 “구비조건”이라 한다)의 구비를 요하는 물품에 대하여 관세청장은 주무부장관의 요청을 받아 세관공무원에 의하여 확인이 가능한 사항인지 여부, 물품의 특성 기타 수출입물품의 통관여건 등을 고려하여 세관장의 확인대상물품, 확인방법, 확인절차(관세청장이 지정ㆍ고시하는 정보통신망을 이용한 확인신청 등의 절차를 포함한다), 그 밖에 확인에 필요한 사항을 공고하여야 한다. <개정 2006. 5. 22.>","D107-0":"제107조(품목분류의 변경) ① 법 제87조제1항에서 “관세청장이 직권으로 한 품목분류를 변경하여야 할 부득이한 사유가 생겼을 경우 등 대통령령으로 정하는 경우”란 다음 각 호의 경우를 말한다. <개정 2019. 9. 24., 2020. 2. 11., 2024. 2. 29.>\n    1. 삭제 <2024. 2. 29.>\n    2. 삭제 <2024. 2. 29.>\n    3. 신청인의 허위자료 제출 등으로 품목분류에 중대한 착오가 생긴 경우\n    4. 협약에 따른 관세협력이사회의 권고 또는 결정 및 법원의 확정판결이 있는 경우\n    5. 동일 또는 유사한 물품에 대하여 서로 다른 품목분류가 있는 경우\n  ② 관세청장은 협약에 따른 관세협력이사회의 권고ㆍ결정이나 법원의 판결로 법 제87조제1항에 따른 품목분류 변경이 필요한 경우에는 그 권고ㆍ결정이 있은 날 또는 판결이 확정된 날부터 3개월 이내에 이를 관세품목분류위원회의 심의에 부쳐야 한다. <신설 2019. 9. 24., 2024. 2. 29.>\n  [제목개정 2019. 9. 24.]","D149-2":"제149조의2(소액사건) 법 제126조제2항에서 “대통령령으로 정하는 금액”이란 3천만원을 말한다.\n  [본조신설 2017. 3. 27.]","D1-5":"제1조의5(월별납부) ①법 제9조제3항의 규정에 의하여 납부기한이 동일한 달에 속하는 세액을 월별로 일괄하여 납부(이하 “월별납부”라 한다)하고자 하는 자는 납세실적 및 수출입실적에 관한 서류 등 관세청장이 정하는 서류를 갖추어 세관장에게 월별납부의 승인을 신청하여야 한다.\n  ②세관장은 제1항의 규정에 의하여 월별납부의 승인을 신청한 자가 법 제9조제3항의 규정에 의하여 관세청장이 정하는 요건을 갖춘 경우에는 세액의 월별납부를 승인하여야 한다. 이 경우 승인의 유효기간은 승인일부터 그 후 2년이 되는 날이 속하는 달의 마지막 날까지로 한다. <개정 2010. 3. 26.>\n  ③ 삭제 <2017. 3. 27.>\n  ④세관장은 납세의무자가 다음 각 호의 어느 하나에 해당하게 된 때에는 제2항에 따른 월별납부의 승인을 취소할 수 있다. 이 경우 세관장은 월별납부의 대상으로 납세신고된 세액에 대해서는 15일 이내의 납부기한을 정하여 납부고지해야 한다. <개정 2021. 2. 17.>\n    1. 관세를 납부기한이 경과한 날부터 15일 이내에 납부하지 아니하는 경우\n    2. 월별납부를 승인받은 납세의무자가 법 제9조제3항의 규정에 의한 관세청장이 정한 요건을 갖추지 못하게 되는 경우\n    3. 사업의 폐업, 경영상의 중대한 위기, 파산선고 및 법인의 해산 등의 사유로 월별납부를 유지하기 어렵다고 세관장이 인정하는 경우\n  ⑤ 제2항에 따른 승인을 갱신하려는 자는 제1항에 따른 서류를 갖추어 그 유효기간 만료일 1개월 전까지 승인갱신 신청을 하여야 한다. <신설 2010. 3. 26.>\n  ⑥ 세관장은 제2항에 따라 승인을 받은 자에게 승인을 갱신하려면 승인의 유효기간이 끝나는 날의 1개월 전까지 승인갱신을 신청하여야 한다는 사실과 갱신절차를 승인의 유효기간이 끝나는 날의 2개월 전까지 휴대폰에 의한 문자전송, 전자메일, 팩스, 전화, 문서 등으로 미리 알려야 한다. <신설 2012. 2. 2.>\n  [본조신설 2004. 3. 29.]\n  [제1조의3에서 이동 <2013. 2. 15.>]","D264-0":"제264조(영업에 관한 보고) 법 제266조제3항의 규정에 의하여 관세청장 또는 세관장은 상설영업장을 갖추고 외국에서 생산된 물품을 판매하는 자, 그 대리인 기타 관계인에 대하여 판매물품에 관한 다음 각호의 사항에 관한 보고서의 제출을 명할 수 있다.\n    1. 판매물품의 품명ㆍ규격 및 수량\n    2. 수입대상국과 생산국 또는 원산지\n    3. 수입가격 또는 구입가격\n    4. 수입자 또는 구입처\n    5. 구입일자, 당해 영업장에의 반입일자\n    6. 판매일자","L128-0":"제128조(결정) ① 심사청구에 대한 결정은 다음 각 호의 구분에 따른다. <개정 2016. 12. 20., 2017. 12. 19.>\n    1. 심사청구가 다음 각 목의 어느 하나에 해당하는 경우: 그 청구를 각하하는 결정\n      가. 심판청구를 제기한 후 심사청구를 제기(같은 날 제기한 경우도 포함한다)한 경우\n      나. 제121조에 따른 심사청구 기간이 지난 후에 심사청구를 제기한 경우\n      다. 제123조에 따른 보정기간 내에 필요한 보정을 하지 아니한 경우\n      라. 적법하지 아니한 심사청구를 제기한 경우\n      마. 가목부터 라목까지의 규정에 따른 경우와 유사한 경우로서 대통령령으로 정하는 경우\n    2. 심사청구가 이유 없다고 인정되는 경우: 그 청구를 기각하는 결정\n    3. 심사청구가 이유 있다고 인정되는 경우: 그 청구의 대상이 된 처분의 취소ㆍ경정 또는 필요한 처분의 결정. 이 경우 취소ㆍ경정 또는 필요한 처분을 하기 위하여 사실관계 확인 등 추가적으로 조사가 필요한 경우에는 처분청으로 하여금 이를 재조사하여 그 결과에 따라 취소ㆍ경정하거나 필요한 처분을 하도록 하는 재조사 결정을 할 수 있다.\n  ② 제1항에 따른 결정은 심사청구를 받은 날부터 90일 이내에 하여야 한다. 다만, 부득이한 사유가 있을 때에는 그러하지 아니하다.\n  ③ 제1항에 따른 결정을 하였을 때에는 제2항의 결정기간 내에 그 이유를 적은 결정서를 심사청구인에게 통지하여야 한다.\n  ④ 제123조에 따른 보정기간은 제2항에 따른 결정기간에 산입하지 아니한다.\n  ⑤ 제1항제3호 후단에 따른 재조사 결정이 있는 경우 처분청은 재조사 결정일부터 60일 이내에 결정서 주문에 기재된 범위에 한정하여 조사하고, 그 결과에 따라 취소ㆍ경정하거나 필요한 처분을 하여야 한다. 이 경우 처분청은 대통령령으로 정하는 바에 따라 조사를 연기 또는 중지하거나 조사기간을 연장할 수 있다.<신설 2017. 12. 19.>\n  ⑥ 제1항제3호 후단 및 제5항에서 규정한 사항 외에 재조사 결정에 필요한 사항은 대통령령으로 정한다.<신설 2017. 12. 19.>\n  [전문개정 2010. 12. 30.]","D150-0":"제150조(경미한 사항) 법 제127조제1항 단서에서 “대통령령으로 정하는 사유에 해당하는 경우”란 다음 각 호의 어느 하나에 해당하는 경우를 말한다. <개정 2011. 4. 1.>\n    1. 심사청구기간이 지난 경우\n    2. 심사청구의 대상이 되는 처분이 존재하지 아니하는 경우\n    3. 해당 처분으로 권리 또는 이익을 침해당하지 아니한 자가 심사청구를 제기한 경우\n    4. 심사청구의 대상이 되지 아니하는 처분에 대하여 심사청구가 제기된 경우\n    5. 법 제123조제1항에 따른 보정기간 내에 필요한 보정을 하지 아니한 경우\n    6. 심사청구의 대상이 되는 처분의 내용ㆍ쟁점ㆍ적용법령 등이 이미 관세심사위원회의 심의를 거쳐 결정된 사항과 동일한 경우\n    7. 그 밖에 신속히 결정하여 상급심에서 심의를 받도록 하는 것이 권리구제에 도움이 된다고 판단되는 경우","R22-0":"제22조(상계관세의 부과에 필요한 조사신청) ①영 제73조제4항에서 “동종물품”이라 함은 해당 수입물품과 물리적 특성, 품질 및 소비자의 평가 등 모든 면에서 동일한 물품(겉모양에 경미한 차이가 있는 물품을 포함한다)을 말하며, 그러한 물품이 없는 경우 해당 수입물품과 매우 유사한 기능ㆍ특성 및 구성요소를 가지고 있는 물품을 말한다. <개정 2020. 12. 29.>\n  ② 영 제73조제4항에서 “당해 수입물품의 수입자인 생산자로서 재정경제부령이 정하는 자”란 해당 수입물품을 수입한 생산자 중 다음 각 호의 자를 제외한 자를 말한다. <개정 2008. 12. 31., 2020. 12. 29., 2026. 1. 2.>\n    1. 영 제73조제6항에 따른 조사신청 접수일부터 6개월 이전에 보조금등을 받은 물품을 수입한 생산자\n    2. 보조금등을 받은 물품의 수입량이 매우 적은 생산자\n  ③ 영 제73조제4항에 따라 특수관계에 있는 생산자를 판정할 때 해당 수입물품과 동종물품의 생산자가 영 제23조제1항에 따른 특수관계가 없는 자와 동일 또는 유사한 가격 및 조건 등으로 이를 판매하는 경우에는 해당 생산자를 특수관계가 있는 생산자의 범위에서 제외할 수 있다. <개정 2020. 12. 29.>\n  ④영 제73조제5항에서 “재정경제부령이 정하는 자”란 국내생산자로 구성된 협회ㆍ조합 등을 말한다. <개정 2008. 12. 31., 2020. 12. 29., 2026. 1. 2.>","R68-3":"제68조의3(보세판매장 특허 갱신 신청시의 첨부서류) 영 제192조의6제2항 각 호 외의 부분에서 “재정경제부령으로 정하는 서류”란 다음 각 호의 서류를 말한다. <개정 2019. 3. 20., 2026. 1. 2.>\n    1. 운영인의 자격을 증명하는 서류\n    2. 필요한 시설 및 장비의 구비를 증명하는 서류\n    3. 고용창출, 중소기업 및 중견기업간의 상생협력 등 기존 특허신청 또는 직전 갱신 신청시 제출한 사업계획서 이행여부에 대한 자체평가보고서\n    4. 갱신받으려는 특허기간에 대한 사업계획서\n  [본조신설 2015. 3. 6.]","L282-0":"제282조(몰수ㆍ추징) ① 제269조제1항(제271조제3항에 따라 그 죄를 범할 목적으로 예비를 한 자를 포함한다)의 경우에는 그 물품을 몰수한다. <개정 2019. 12. 31.>\n  ② 제269조제2항(제271조제3항에 따라 그 죄를 범할 목적으로 예비를 한 자를 포함한다. 이하 이 조에서 같다), 제269조제3항(제271조제3항에 따라 그 죄를 범할 목적으로 예비를 한 자를 포함한다. 이하 이 조에서 같다) 또는 제274조제1항제1호(같은 조 제3항에 따라 그 죄를 범할 목적으로 예비를 한 자를 포함한다. 이하 이 조에서 같다)의 경우에는 범인이 소유하거나 점유하는 그 물품을 몰수한다. 다만, 제269조제2항 또는 제3항의 경우로서 다음 각 호의 어느 하나에 해당하는 물품은 몰수하지 아니할 수 있다.<개정 2013. 1. 1., 2019. 12. 31.>\n    1. 제154조의 보세구역에 제157조에 따라 신고를 한 후 반입한 외국물품\n    2. 제156조에 따라 세관장의 허가를 받아 보세구역이 아닌 장소에 장치한 외국물품\n    3. 「폐기물관리법」 제2조제1호부터 제5호까지의 규정에 따른 폐기물\n    4. 그 밖에 몰수의 실익이 없는 물품으로서 대통령령으로 정하는 물품\n  ③ 제1항과 제2항에 따라 몰수할 물품의 전부 또는 일부를 몰수할 수 없을 때에는 그 몰수할 수 없는 물품의 범칙 당시의 국내도매가격에 상당한 금액을 범인으로부터 추징한다. 다만, 제274조제1항제1호 중 제269조제2항의 물품을 감정한 자는 제외한다.\n  ④ 제279조의 개인 및 법인은 제1항부터 제3항까지의 규정을 적용할 때에는 이를 범인으로 본다.\n  [전문개정 2010. 12. 30.]","D84-0":"제84조(상계관세 및 약속의 재심사) ① 재정경제부장관은 재심사가 필요하다고 인정되거나 이해관계인이나 해당 산업을 관장하는 주무부장관이 다음 각 호의 어느 하나에 해당하는 경우에 명확한 정보 제공과 함께 재심사 요청서를 제출한 때에는 상계관세가 부과되고 있거나 법 제60조에 따른 약속(이하 이 조에서 “약속”이라 한다)이 시행되고 있는 물품에 대하여 법 제62조제1항에 따른 재심사여부를 결정해야 한다. <개정 2024. 2. 29., 2025. 12. 30.>\n    1. 상계관세 또는 약속(이하 “상계조치”라 한다)의 시행 이후 그 조치의 내용변경이 필요하다고 인정할 만한 충분한 상황변동이 발생한 경우\n    2. 상계조치의 종료로 국내산업이 피해를 입을 우려가 있는 경우\n    3. 실제 보조금 등의 금액보다 상계관세액이 과다하게 납부된 경우 또는 약속에 따른 가격수정이 과도한 경우\n  ② 제1항에 따른 재심사의 요청은 상계조치의 시행일부터 1년이 경과된 날 이후에 할 수 있으며, 상계조치의 효력이 상실되는 날 6개월 이전에 요청해야 한다. <개정 2024. 2. 29.>\n  ③ 재정경제부장관은 제1항에 따라 재심사를 요청받은 날부터 2개월 이내에 재심사의 필요 여부를 결정해야 하며, 그 결정일부터 10일 이내에 재심사 개시 결정에 관한 사항을 재심사 요청자, 해당 물품의 수출국 정부 및 수출자, 그 밖의 이해관계인에게 통지하고, 관보에 게재해야 한다. 이 경우 해당 물품의 수출국 정부 및 수출자에게는 제1항에 따른 요청서를 함께 제공해야 한다. <개정 2025. 12. 30.>\n  ④ 재정경제부장관은 제1항에 따라 재심사를 하는 경우 외에 시행 중인 상계조치의 적정성 여부에 관한 재심사를 할 수 있으며, 이를 위해 상계조치의 내용(재심사에 따라 변경된 내용을 포함한다)에 관하여 매년 그 시행일이 속하는 달에 보조금등을 받은 물품의 수입가격에 대한 재검토를 해야 한다. 이 경우 관세청장은 재검토에 필요한 자료를 작성하여 매년 그 시행일이 속하는 달에 재정경제부장관에게 제출해야 한다. <개정 2024. 2. 29., 2025. 12. 30.>\n  ⑤ 재정경제부장관은 제1항 또는 제4항에 따라 재심사의 필요 여부를 결정하는 때에는 관계 행정기관의 장 및 무역위원회와 협의할 수 있으며, 재심사가 필요한 것으로 결정된 때에는 무역위원회는 이를 조사해야 한다. 이 경우 무역위원회는 해당 재심사의 사유가 되는 부분에 한정하여 조사할 수 있다. <개정 2025. 12. 30.>\n  ⑥ 무역위원회는 재심사 개시일부터 6개월 이내에 제5항에 따른 조사를 종결하여 그 결과를 재정경제부장관에게 제출해야 한다. 다만, 무역위원회는 조사기간을 연장할 필요가 있거나 이해관계인이 정당한 사유를 제시하여 조사기간의 연장을 요청하는 때에는 4개월의 범위에서 그 조사기간을 연장할 수 있다. <개정 2025. 12. 30.>\n  ⑦ 재정경제부장관은 제6항에 따른 조사결과가 제출되면 제3항 전단에 따른 관보게재일부터 12개월 이내에 법 제62조제1항에 따른 조치 여부 및 내용을 결정하여 필요한 조치를 해야 한다. <개정 2025. 12. 30.>\n  ⑧ 법 제62조제3항 단서에서 “대통령령으로 정하는 사유”란 제1항제2호에 해당하는 경우를 말한다. <개정 2024. 2. 29.>\n  ⑨ 법 제62조제3항 단서에 따라 재심사기간 중 상계관세가 계속 부과된 물품에 대하여 같은 조 제1항에 따라 재정경제부장관이 새로운 상계관세의 부과 또는 가격수정 등의 약속을 시행하는 때에는 제83조제1항 및 제3항의 예에 따라 정산할 수 있다. <개정 2025. 12. 30., 2026. 2. 27.>\n  ⑩ 재정경제부장관은 제1항 또는 제4항에 따른 재심사결과 약속의 실효성이 상실되거나 상실될 우려가 있다고 판단되는 때에는 해당 약속을 이행하고 있는 수출국정부 또는 수출자에게 약속의 수정을 요구할 수 있으며, 해당 수출국정부 또는 수출자가 약속의 수정을 거부하는 때에는 이용가능한 정보를 바탕으로 상계관세율을 산정하여 상계관세를 부과할 수 있다. <개정 2024. 2. 29., 2025. 12. 30.>\n  ⑪ 법 제62조제2항에서 “상계조치 물품의 수입 및 징수실적 등 대통령령으로 정하는 사항”이란 다음 각 호의 사항을 말한다. <개정 2022. 2. 15., 2025. 12. 30.>\n    1. 상계조치 물품의 수입 및 징수실적\n    2. 가격수정 등의 약속 준수 여부\n    3. 그 밖에 재정경제부장관이 상계관세의 부과와 약속의 재심사를 위하여 조사가 필요하다고 인정하는 사항\n  ⑫ 제1항에 따라 재심사를 요청한 자가 해당 요청을 철회하려는 경우에는 서면으로 그 뜻을 재정경제부장관에게 제출해야 한다. 이 경우 재정경제부장관은 무역위원회 및 관계 행정기관의 장과 협의하여 제3항 전단에 따른 재심사 개시 여부의 결정을 중지하거나 제5항에 따른 조사를 종결하도록 할 수 있다. <개정 2025. 12. 30.>\n  ⑬ 제5항에 따른 조사를 위한 자료협조 요청에 관하여는 제78조를 준용하고, 법 제62조제1항의 재심사 결과에 따른 재정경제부장관의 조치 중 상계관세의 부과에 관하여는 제79조를, 가격수정 등의 약속에 관하여는 제81조제1항 전단, 같은 조 제2항, 제3항, 제5항 및 제6항을 준용한다. 이 경우 제81조제1항 전단 중 “제75조제5항의 규정에 의한 본조사의 결과에 따른 최종판정”은 “제84조제6항에 따른 조사의 종결”로, “무역위원회”는 “재정경제부장관”으로 본다. <개정 2025. 12. 30.>\n  [전문개정 2020. 12. 29.]","L45-0":"제45조(관세체납정리위원회) ① 관세(세관장이 징수하는 내국세등을 포함한다)의 체납정리에 관한 사항을 심의하기 위하여 세관에 관세체납정리위원회를 둘 수 있다\n  ② 제1항에 따른 관세체납정리위원회의 조직과 운영에 필요한 사항은 대통령령으로 정한다.\n  [전문개정 2010. 12. 30.]","D276-3":"제276조의3(관세무역데이터 제공시설 및 제공절차 등) ① 법 제322조제10항 각 호 외의 부분 전단에서 “대통령령으로 정하는 시설”이란 다음 각 호의 요건을 모든 갖춘 시설로서 관세청장이 정하는 시설(이하 “관세무역데이터센터”라고 한다)을 말한다.\n    1. 해당 시설 외부에서 내부통신망에 접근ㆍ침입하는 것을 방지하기 위한 정보보호시스템을 갖춘 시설일 것\n    2. 관세정책의 평가ㆍ연구 등에 활용하기 위하여 통계 작성에 사용된 기초자료와 관세청장이 생산ㆍ가공ㆍ분석한 데이터(이하 “관세무역데이터”라 한다)를 분석할 수 있는 설비 등을 갖춘 시설일 것\n  ② 법 제322조제10항제5호에서 “「정부출연연구기관 등의 설립ㆍ운영 및 육성에 관한 법률」 제2조에 따른 정부출연연구기관의 장 등 대통령령으로 정하는 자”란 다음 각 호의 어느 하나에 해당하는 자를 말한다.\n    1. 「고등교육법」 제2조에 따른 학교의 장\n    2. 「공공기관의 운영에 관한 법률」 제4조에 따른 공공기관의 장\n    3. 「정부출연연구기관 등의 설립ㆍ운영 및 육성에 관한 법률」 제2조에 따른 정부출연연구기관의 장\n    4. 제3호에 준하는 민간 연구기관의 장\n    5. 관세정책의 평가 및 연구를 목적으로 관세무역데이터의 적정성 점검 등을 수행하는 기관의 장\n  ③ 법 제322조제10항 각 호의 어느 하나에 해당하는 자는 같은 항에 따라 관세무역데이터를 직접 분석하기를 원하는 경우에는 다음 각 호의 사항을 포함한 관세무역데이터센터 이용 요청서를 관세청장에게 제출해야 한다.\n    1. 관세무역데이터의 이용 목적\n    2. 관세무역데이터의 명칭 및 내용\n    3. 관세무역데이터센터 이용 기간 및 이용자\n  ④ 제3항에 따른 관세무역데이터센터 이용 요청서를 받은 관세청장은 그 요청서를 받은 날부터 30일 이내에 관세무역데이터센터의 이용 가능 여부 및 이용 기간을 통보해야 한다.\n  ⑤ 관세청장은 다음 각 호의 어느 하나에 해당하는 경우에는 관세무역데이터의 제공을 거부할 수 있다. 이 경우 제4항에 따라 이용 가능 여부를 통보할 때에 거부 사유를 함께 통보해야 한다.\n    1. 관세무역데이터센터 이용 요청자가 요청한 자료를 보유하고 있지 않은 경우\n    2. 관세무역데이터의 이용 목적이 불분명하거나 이용 목적과 무관한 관세무역데이터의 제공을 요청하는 경우\n    3. 「공공기관의 정보공개에 관한 법률」 제9조 각 호에 해당하는 비공개정보의 제공을 요청하는 경우\n    4. 이미 공표된 통계를 요청하거나 공표된 통계로 이용 목적을 달성할 수 있는 경우\n    5. 관세무역데이터센터 이용 요청 전에 법 제322조제11항을 위반한 사실이 있는 경우\n  ⑥ 제3항에 따른 관세무역데이터 이용 요청서의 서식 및 그 밖에 관세무역데이터센터 이용에 필요한 사항은 관세청장이 정하여 고시한다.\n  [본조신설 2023. 2. 28.]\n  [제276조의2에서 이동 <2025. 2. 28.>]","L85-0":"제85조(품목분류의 적용기준 등) ① 재정경제부장관은 대통령령으로 정하는 바에 따라 품목분류를 적용하는 데에 필요한 기준을 정할 수 있다. <개정 2010. 12. 30., 2014. 12. 23., 2025. 10. 1.>\n  ② 다음 각 호의 사항을 심의하기 위하여 관세청에 관세품목분류위원회(이하 이 조에서 “분류위원회”라 한다)를 둔다.<개정 2010. 12. 30., 2014. 12. 23., 2025. 10. 1.>\n    1. 제1항에 따른 품목분류 적용기준의 신설 또는 변경과 관련하여 관세청장이 재정경제부장관에게 요청할 사항\n    2. 제86조에 따른 특정물품에 적용될 품목분류의 사전심사 및 재심사\n    3. 제87조에 따른 특정물품에 적용될 품목분류의 변경 및 재심사\n    4. 그 밖에 품목분류에 관하여 관세청장이 분류위원회에 부치는 사항\n  ③ 삭제<2003. 12. 30.>\n  ④ 분류위원회의 구성, 기능, 운영 등에 필요한 사항은 대통령령으로 정한다.<개정 2010. 12. 30.>","D151-0":"제151조(결정 등의 통지) ①법 제128조 또는 법 제129조의 규정에 의하여 결정 또는 불복방법의 통지를 하는 때에는 인편 또는 등기우편에 의하여야 하며, 인편에 의하는 경우에는 수령증을 받아야 한다.\n  ②심사청구인의 주소 또는 거소가 불명하거나 기타의 사유로 인하여 제1항의 규정에 의한 방법으로 결정 등을 통지할 수 없는 때에는 그 요지를 당해 재결관서의 게시판 기타 적절한 장소에 공고하여야 한다.\n  ③제2항의 규정에 의하여 공고를 한 때에는 그 공고가 있은 날부터 10일을 경과한 날에 결정 등의 통지를 받은 것으로 본다.","L110-0":"제110조(납세자권리헌장의 제정 및 교부) ① 관세청장은 제111조부터 제116조까지, 제116조의2 및 제117조에서 규정한 사항과 그 밖에 납세자의 권리보호에 관한 사항을 포함하는 납세자권리헌장(이하 이 조에서 “납세자권리헌장”이라 한다)을 제정하여 고시하여야 한다.\n  ② 세관공무원은 다음 각 호의 어느 하나에 해당하는 경우에는 납세자권리헌장의 내용이 수록된 문서를 납세자에게 내주어야 하며, 조사사유, 조사기간, 제118조의4제1항에 따른 납세자보호위원회에 대한 심의 요청사항ㆍ절차 및 권리구제 절차 등을 설명하여야 한다.<개정 2011. 12. 31., 2017. 12. 19., 2019. 12. 31., 2023. 12. 31.>\n    1. 제283조에 따른 관세범(「수출용 원재료에 대한 관세 등 환급에 관한 특례법」 제23조제1항부터 제4항까지의 규정에 따른 죄를 포함한다)에 관한 조사를 하는 경우\n    2. 관세조사를 하는 경우\n    3. 그 밖에 대통령령으로 정하는 경우\n  ③ 세관공무원은 납세자를 긴급히 체포ㆍ압수ㆍ수색하는 경우 또는 현행범인 납세자가 도주할 우려가 있는 등 조사목적을 달성할 수 없다고 인정되는 경우에는 납세자권리헌장을 내주지 아니할 수 있다.\n  [전문개정 2010. 12. 30.]","L202-0":"제202조(설비의 유지의무 등) ① 운영인은 대통령령으로 정하는 바에 따라 종합보세기능의 수행에 필요한 시설 및 장비 등을 유지하여야 한다.\n  ② 종합보세구역에 장치된 물품에 대하여 보수작업을 하거나 종합보세구역 밖에서 보세작업을 하려는 자는 대통령령으로 정하는 바에 따라 세관장에게 신고하여야 한다.\n  ③ 제2항에 따라 작업을 하는 경우의 반출검사 등에 관하여는 제187조를 준용한다.\n  [전문개정 2010. 12. 30.]","R3-2":"제3조의2(확정가격 신고기간의 연장방법) ① 영 제16조제4항에 따라 확정가격 신고기간의 연장을 요청하려는 자는 확정가격 신고기간이 만료되기 3일전까지 관세청장이 정하는 확정가격 신고기간 연장신청서에 관련 증빙자료를 첨부하여 영 제16조제2항에 따라 잠정가격을 신고한 세관장에게 제출해야 한다.\n  ② 제1항에 따라 확정가격 신고기간 연장을 신청하려는 자는 잠정가격을 신고한 세관장이 둘 이상인 경우 그 중 어느 하나의 세관장에게 일괄적으로 확정가격 신고기간 연장을 신청할 수 있다.\n  ③ 세관장은 영 제16조제4항에 따라 확정가격 신고기간의 연장 여부가 결정되면 세관장은 그 결과를 신청인에게 통보해야 한다.\n  [본조신설 2020. 10. 7.]\n  [종전 제3조의2는 제3조의3으로 이동 <2020. 10. 7.>]","L98-0":"제98조(재수출 감면) ① 장기간에 걸쳐 사용할 수 있는 물품으로서 그 수입이 임대차계약에 의하거나 도급계약 또는 수출계약의 이행과 관련하여 국내에서 일시적으로 사용하기 위하여 수입하는 물품 중 재정경제부령으로 정하는 물품이 그 수입신고 수리일부터 2년(장기간의 사용이 부득이한 물품으로서 재정경제부령으로 정하는 것 중 수입하기 전에 세관장의 승인을 받은 것은 4년의 범위에서 대통령령으로 정하는 기준에 따라
