 2. 당해 물품의 수입신고번호ㆍ수입신고수리 연월일 및 통관세관명\n    3. 당해 물품의 당초의 용도, 사업의 종류, 설치 또는 사용장소 및 관세감면의 법적 근거\n    4. 당해 물품의 새로운 용도, 사업의 종류, 설치 또는 사용장소 및 관세감면의 법적 근거\n  ②법 제103조의 규정에 의하여 관세를 감면하는 경우에 새로운 용도에 따라 감면되는 관세의 금액이 당초에 감면된 관세의 금액보다 적은 경우에는 그 차액에 해당하는 관세를 징수한다.\n  [제목개정 2021. 2. 17.]","D141-10":"제141조의10(고액ㆍ상습체납자의 감치 신청에 대한 의견진술 등) ① 관세청장은 법 제116조의4제3항에 따라 체납자가 소명자료를 제출하거나 의견을 진술할 수 있도록 다음 각 호의 사항이 모두 포함된 서면(체납자가 동의하는 경우에는 전자문서를 포함한다)을 체납자에게 통지해야 한다. 이 경우 제4호에 따른 기간에 소명자료를 제출하지 않거나 의견진술 신청이 없는 경우에는 의견이 없는 것으로 본다.\n    1. 체납자의 성명과 주소\n    2. 감치(監置) 요건, 감치 신청의 원인이 되는 사실, 감치 기간 및 적용 법령\n    3. 법 제116조의4제6항에 따라 체납된 관세를 납부하는 경우에는 감치 집행이 종료될 수 있다는 사실\n    4. 체납자가 소명자료를 제출하거나 의견을 진술할 수 있다는 사실과 소명자료 제출 및 의견진술 신청기간. 이 경우 그 기간은 통지를 받은 날부터 30일 이상으로 해야 한다.\n    5. 그 밖에 소명자료 제출 및 의견진술 신청에 관하여 필요한 사항\n  ② 법 제116조의4제3항에 따라 의견을 진술하려는 사람은 제1항제4호에 따른 기간에 관세청장에게 진술하려는 내용을 간략하게 적은 문서(전자문서를 포함한다)를 제출해야 한다.\n  ③ 제2항에 따라 의견진술 신청을 받은 관세청장은 법 제116조의2제2항에 따른 관세정보위원회의 회의 개최일 3일 전까지 신청인에게 회의 일시 및 장소를 통지해야 한다.\n  [본조신설 2020. 2. 11.]\n  [제141조의7에서 이동 <2023. 2. 28.>]","L74-0":"제74조(편익관세의 적용기준 등) ① 관세에 관한 조약에 따른 편익을 받지 아니하는 나라의 생산물로서 우리나라에 수입되는 물품에 대하여 이미 체결된 외국과의 조약에 따른 편익의 한도에서 관세에 관한 편익(이하 “편익관세”라 한다)을 부여할 수 있다.\n  ② 편익관세를 부여할 수 있는 대상 국가, 대상 물품, 적용 세율, 적용방법, 그 밖에 필요한 사항은 대통령령으로 정한다.\n  [전문개정 2010. 12. 30.]","D252-0":"제252조(담보의 제공) 법 제248조제2항제5호에서 “대통령령으로 정하는 관세채권의 확보가 곤란한 경우에 해당하는 자”란 다음 각 호의 어느 하나에 해당하는 자를 말한다.\n    1. 최근 2년간 계속해서 수입실적이 없는 자\n    2. 파산, 청산 또는 개인회생절차가 진행 중인 자\n    3. 수입실적, 자산, 영업이익, 수입물품의 관세율 등을 고려할 때 관세채권 확보가 곤란한 경우로서 관세청장이 정하는 요건에 해당하는 자\n  [전문개정 2010. 3. 26.]","D41-0":"제41조(체납자료의 제공 등) ①법 제44조제1항 각 호 외의 부분 단서에서 “대통령령으로 정하는 경우”란 다음 각 호의 어느 하나에 해당하는 경우를 말한다. <개정 2021. 2. 17.>\n    1. 제2조제1항제1호부터 제3호까지의 사유에 해당되는 경우\n    2. 압류 또는 매각이 유예된 경우\n  ② 법 제44조제1항 각 호에서 “대통령령으로 정하는 금액”이란 각각 500만원을 말한다.\n  ③ 세관장은 법 제44조제1항 각 호 외의 부분 본문에 따른 체납자료(이하 이 조에서 “체납자료”라 한다)를 전산정보처리조직에 의하여 처리하는 경우에는 체납자료 파일(자기테이프, 자기디스크, 그 밖에 이와 유사한 매체에 체납자료가 기록ㆍ보관된 것을 말한다. 이하 같다)을 작성할 수 있다.\n  ④ 법 제44조제1항 각 호 외의 부분 본문에 따라 체납자료를 요구하려는 자(이하 이 조에서 “요구자”라 한다)는 다음 각 호의 사항을 적은 문서를 세관장에게 제출하여야 한다.\n    1. 요구자의 이름 및 주소\n    2. 요구하는 자료의 내용 및 이용 목적\n  ⑤ 제4항에 따라 체납자료를 요구받은 세관장은 제3항에 따른 체납자료 파일이나 문서로 제공할 수 있다.\n  ⑥ 제5항에 따라 제공한 체납자료가 체납액의 납부 등으로 체납자료에 해당되지 아니하게 되는 경우에는 그 사실을 사유 발생일부터 15일 이내에 요구자에게 통지하여야 한다.\n  ⑦ 제3항에 따른 체납자료 파일의 정리, 관리, 보관 등에 필요한 사항 또는 이 조에서 규정한 사항 외에 체납자료의 요구 및 제공 등에 필요한 사항은 관세청장이 정한다.\n  [전문개정 2013. 2. 15.]","D21-0":"제21조(처분 또는 사용에 대한 제한의 범위) 법 제30조제3항제1호의 규정에 의한 물품의 처분 또는 사용에 제한이 있는 경우에는 다음 각호의 경우가 포함되는 것으로 한다.\n    1. 전시용ㆍ자선용ㆍ교육용 등 당해 물품을 특정용도로 사용하도록 하는 제한\n    2. 당해 물품을 특정인에게만 판매 또는 임대하도록 하는 제한\n    3. 기타 당해 물품의 가격에 실질적으로 영향을 미치는 제한","L150-0":"제150조(국경출입차량의 출발절차) ① 국경출입차량이 통관역이나 통관장을 출발하려면 통관역장이나 도로차량의 운전자는 출발하기 전에 세관장에게 출발보고를 하고 출발허가를 받아야 한다.\n  ② 통관역장이나 도로차량의 운전자는 제1항에 따른 허가를 받으려면 그 통관역 또는 통관장에서 적재한 물품의 목록을 제출하여야 한다.\n  ③ 제1항에도 불구하고 대통령령으로 정하는 물품을 일정 기간에 일정량으로 나누어 반복적으로 운송하는 데에 사용되는 도로차량의 운전자는 제152조제2항에 따라 사증을 받는 것으로 출발보고 및 출발허가를 대신할 수 있다. 다만, 최초 출발보고와 최초 출발허가의 경우는 제외한다.\n  ④ 제3항에 따른 도로차량을 운행하려는 자는 재정경제부령으로 정하는 바에 따라 미리 세관장에게 신고하여야 한다.<개정 2025. 10. 1.>\n  [전문개정 2010. 12. 30.]","R57-0":"제57조(해외임가공물품에 대한 관세의 감면신청) ①법 제101조제1항의 규정에 의하여 관세를 감면받고자 하는 자는 해외에서 제조ㆍ가공ㆍ수리(이하 이 조에서 “해외임가공”이라 한다)할 물품을 수출신고할 때 미리 해외임가공 후 수입될 예정임을 신고하고, 감면신청을 할 때 영 제112조제1항 각호의 사항외에 수출국 및 적출지와 감면받고자 하는 관세액을 기재한 신청서에 제조인ㆍ가공인 또는 수리인이 발급한 제조ㆍ가공 또는 수리사실을 증명하는 서류와 당해 물품의 수출신고필증 또는 이에 갈음할 서류를 첨부하여 세관장에게 제출하여야 한다. 다만, 세관장이 다른 자료에 의하여 그 물품이 감면대상에 해당한다는 사실을 인정할 수 있는 경우에는 수출신고필증 또는 이를 갈음할 서류를 첨부하지 아니할 수 있다. <개정 2010. 3. 30.>\n  ②제1항의 규정에 의한 제조ㆍ가공 또는 수리사실을 증명하는 서류에는 다음 각호의 사항을 기재하여야 한다.\n    1. 원물품의 품명ㆍ규격ㆍ수량 및 가격\n    2. 제조ㆍ가공 또는 수리에 의하여 부가 또는 환치된 물품의 품명ㆍ규격ㆍ수량 및 가격\n    3. 제조ㆍ가공 또는 수리에 의하여 소요된 비용\n    4. 제조ㆍ가공 또는 수리의 명세\n    5. 감면받고자 하는 금액과 그 산출기초\n    6. 기타 수입물품이 국내에서 수출한 물품으로 제조ㆍ가공 또는 수리된 것임을 확인할 수 있는 자료\n  ③ 삭제 <2010. 3. 30.>","L252-0":"제252조(수입신고수리전 반출) 수입신고를 한 물품을 제248조에 따른 세관장의 수리 전에 해당 물품이 장치된 장소로부터 반출하려는 자는 납부하여야 할 관세에 상당하는 담보를 제공하고 세관장의 승인을 받아야 한다. 다만, 정부 또는 지방자치단체가 수입하거나 담보를 제공하지 아니하여도 관세의 납부에 지장이 없다고 인정하여 대통령령으로 정하는 물품에 대하여는 담보의 제공을 생략할 수 있다.\n  [전문개정 2010. 12. 30.]","D139-0":"제139조(관세조사의 사전통지) 법 제114조제1항에 따라 납세자 또는 그 위임을 받은 자에게 관세조사에 관한 사전통지를 하는 경우에는 다음 각 호의 사항을 적은 문서로 하여야 한다. <개정 2012. 2. 2.>\n    1. 납세자 또는 그 위임을 받은 자의 성명과 주소 또는 거소\n    2. 조사기간\n    3. 조사대상 및 조사사유\n    4. 삭제 <2018. 2. 13.>\n    5. 기타 필요한 사항","D124-0":"제124조(관세가 미납된 계약내용이 상이한 물품의 부과취소신청) 법 제106조제5항의 규정에 의하여 관세의 부과를 취소받고자 하는 자는 해당 수입물품에 대한 관세의 납부기한(징수유예 또는 분할납부의 경우에는 징수유예기간 또는 분할납부기간의 종료일을 말한다) 전에 신청서를 세관장에게 제출하여야 한다. <개정 2013. 2. 15.>","L96-0":"제96조(여행자 휴대품 및 이사물품 등의 감면) ①다음 각 호의 어느 하나에 해당하는 물품이 수입될 때에는 그 관세를 면제할 수 있다. <개정 2014. 12. 23., 2020. 12. 22., 2025. 10. 1.>\n    1. 여행자의 휴대품 또는 별송품으로서 여행자의 입국 사유, 체재기간, 직업, 그 밖의 사정을 고려하여 재정경제부령으로 정하는 기준에 따라 세관장이 타당하다고 인정하는 물품\n    2. 우리나라로 거주를 이전하기 위하여 입국하는 자가 입국할 때 수입하는 이사물품으로서 거주 이전의 사유, 거주기간, 직업, 가족 수, 그 밖의 사정을 고려하여 재정경제부령으로 정하는 기준에 따라 세관장이 타당하다고 인정하는 물품\n    3. 국제무역선 또는 국제무역기의 승무원이 휴대하여 수입하는 물품으로서 항행일수, 체재기간, 그 밖의 사정을 고려하여 재정경제부령으로 정하는 기준에 따라 세관장이 타당하다고 인정하는 물품\n  ② 여행자가 휴대품 또는 별송품(제1항제1호에 해당하는 물품은 제외한다)을 재정경제부령으로 정하는 방법으로 자진신고하는 경우에는 20만원을 넘지 아니하는 범위에서 해당 물품에 부과될 관세(제81조에 따라 간이세율을 적용하는 물품의 경우에는 간이세율을 적용하여 산출된 세액을 말한다)의 100분의 30에 상당하는 금액을 경감할 수 있다.<신설 2014. 12. 23., 2019. 12. 31., 2022. 12. 31., 2025. 10. 1.>\n  [전문개정 2010. 12. 30.]\n  [제목개정 2020. 12. 22.]","L102-0":"제102조(관세감면물품의 사후관리) ① 제89조부터 제91조까지와 제93조 및 제95조에 따라 관세를 감면받은 물품은 수입신고 수리일부터 3년의 범위에서 대통령령으로 정하는 기준에 따라 관세청장이 정하는 기간에는 그 감면받은 용도 외의 다른 용도로 사용하거나 양도(임대를 포함한다. 이하 같다)할 수 없다. 다만, 재정경제부령으로 정하는 물품과 대통령령으로 정하는 바에 따라 미리 세관장의 승인을 받은 물품의 경우에는 그러하지 아니하다. <개정 2025. 10. 1.>\n  ② 다음 각 호의 어느 하나에 해당하면 그 용도 외의 다른 용도로 사용한 자나 그 양도인(임대인을 포함한다. 이하 같다)으로부터 감면된 관세를 즉시 징수하며, 양도인으로부터 해당 관세를 징수할 수 없을 때에는 양수인(임차인을 포함한다. 이하 같다)으로부터 감면된 관세를 징수한다. 다만, 재해나 그 밖의 부득이한 사유로 멸실되었거나 미리 세관장의 승인을 받아 폐기하였을 때에는 그러하지 아니하다.\n    1. 제1항에 따라 관세를 감면받은 물품을 제1항에 따른 기간에 감면받은 용도 외의 다른 용도로 사용한 경우\n    2. 제1항에 따라 관세를 감면받은 물품을 제1항에 따른 기간에 감면받은 용도 외의 다른 용도로 사용하려는 자에게 양도한 경우\n  [전문개정 2010. 12. 30.]","D135-4":"제135조의4(소규모 성실사업자에 대한 관세조사 면제) 법 제110조의3제4항 본문에 따라 다음 각 호의 요건을 모두 충족하는 자에 대해서는 같은 조 제1항에 따른 조사를 하지 아니할 수 있다. <개정 2017. 3. 27.>\n    1. 최근 2년간 수출입신고 실적이 30억원 이하일 것\n    2. 최근 4년 이내에 다음 각 목의 어느 하나에 해당하는 사실이 없을 것\n      가. 수출입 관련 법령을 위반하여 통고처분을 받거나 벌금형 이상의 형의 선고를 받은 사실\n      나. 관세 및 내국세를 체납한 사실\n      다. 법 제38조의3제6항에 따라 신고납부한 세액이 부족하여 세관장으로부터 경정을 받은 사실\n  [본조신설 2012. 2. 2.]","R59-0":"제59조(관세분할납부의 요건) ①법 제107조제2항제1호의 규정에 의하여 관세를 분할납부할 수 있는 물품은 다음 각호의 요건을 갖추어야 한다. <개정 2002. 5. 10., 2005. 2. 11.>\n    1. 법 별표 관세율표에서 부분품으로 분류되지 아니할 것\n    2. 법 기타 관세에 관한 법률 또는 조약에 의하여 관세를 감면받지 아니할 것\n    3. 당해 관세액이 500만원 이상일 것. 다만, 「중소기업기본법」 제2조제1항의 규정에 의한 중소기업이 수입하는 경우에는 100만원 이상일 것\n    4. 법 제51조 내지 제72조의 규정을 적용받는 물품이 아닐 것\n  ②법 제107조제2항제2호 내지 제5호의 규정에 의하여 관세를 분할납부하는 물품 및 기관은 별표 4와 같다.\n  ③법 제107조제2항제6호에 따라 관세분할납부의 승인을 얻을 수 있는 중소제조업체는 「중소기업기본법」 제2조에 따른 중소기업자로서 한국표준산업분류표상 제조업을 영위하는 업체에 한한다. <개정 2002. 5. 10., 2005. 2. 11., 2020. 3. 13.>\n  ④법 제107조제2항제6호의 규정에 의하여 관세를 분할납부할 수 있는 물품은 법 별표 관세율표 제84류ㆍ제85류 및 제90류에 해당하는 물품으로서 다음 각호의 요건을 갖추어야 한다. <개정 2002. 5. 10.>\n    1. 법 기타 관세에 관한 법률 또는 조약에 의하여 관세의 감면을 받지 아니할 것\n    2. 당해 관세액이 100만원 이상일 것\n    3. 법 제51조 내지 제72조의 규정을 적용받는 물품이 아닐 것\n    4. 국내에서 제작이 곤란한 물품으로서 당해 물품의 생산에 관한 사무를 관장하는 주무부처의 장 또는 그 위임을 받은 기관의 장이 확인한 것일 것\n  ⑤법 제107조제2항제2호 내지 제5호 및 제7호의 규정에 의하여 관세를 분할납부할 수 있는 물품은 법 기타 관세에 관한 법률 또는 조약에 의하여 관세를 감면받지 아니한 것이어야 한다.","R37-0":"제37조(관세가 감면되는 학술연구용품) ①법 제90조제1항제1호 및 제2호에 따라 관세가 감면되는 물품은 다음 각 호와 같다. <개정 2002. 5. 10., 2004. 3. 30., 2010. 3. 30., 2021. 3. 16.>\n    1. 표본, 참고품, 도서, 음반, 녹음된 테이프, 녹화된 슬라이드, 촬영된 필름, 시험지, 시약류, 그 밖에 이와 유사한 물품 및 자료\n    2. 다음 각목의 1에 해당하는 것으로서 국내에서 제작하기 곤란한 것중 당해 물품의 생산에 관한 업무를 담당하는 중앙행정기관의 장 또는 그가 지정하는 자가 추천하는 물품\n      가. 개당 또는 셋트당 과세가격이 100만원 이상인 기기\n      나. 가목에 해당하는 기기의 부분품 및 부속품\n    3. 부분품(제2호에 따른 기기의 부분품을 제외하며, 법 제90조제1항제1호 및 제2호에 따라 학술연구용 등에 직접 사용되는 것으로 한정한다)ㆍ원재료 및 견본품\n  ②법 제90조제1항제2호에서 “재정경제부령으로 정하는 기관”이란 다음 각 호와 같다. <개정 2002. 5. 10., 2005. 2. 11., 2005. 12. 30., 2006. 5. 30., 2006. 10. 27., 2007. 5. 29., 2007. 12. 31., 2008. 12. 31., 2009. 3. 26., 2009. 12. 31., 2010. 3. 30., 2011. 4. 1., 2013. 2. 23., 2013. 3. 23., 2018. 3. 21., 2019. 3. 20., 2020. 3. 13., 2021. 3. 16., 2025. 3. 21., 2025. 10. 31., 2026. 1. 2., 2026. 3. 20.>\n    1. 「정부조직법」 제4조 또는 지방자치단체의 조례에 의하여 설치된 시험소ㆍ연구소ㆍ공공도서관ㆍ동물원ㆍ식물원 및 전시관(이들 기관에서 사용하기 위하여 중앙행정기관의 장이 수입하는 경우를 포함한다)\n    2. 대한무역투자진흥공사 전시관\n    3. 「산업집적활성화 및 공장설립에 관한 법률」 제31조에 따라 설립된 산업단지관리공단의 전시관\n    4. 「정부출연연구기관 등의 설립ㆍ운영 및 육성에 관한 법률」 및 「과학기술분야 정부출연연구기관 등의 설립ㆍ운영 및 육성에 관한 법률」에 의하여 설립된 연구기관\n    5. 수출조합전시관(산업통상부장관이 면세추천을 한 것에 한정한다)\n    6. 중소기업진흥공단(농가공산품개발사업을 위하여 개설한 전시관과 「중소기업진흥에 관한 법률」 제74조제1항제13호 및 제14호의 사업을 수행하기 위하여 수입하는 물품에 한한다)\n    7. 「산업디자인진흥법」 제11조의 규정에 의하여 설립된 한국디자인진흥원(「산업디자인진흥법」 제11조제4항제1호ㆍ제2호 및 제5호의 사업을 수행하기 위하여 수입하는 물품에 한한다)\n    8. 수입물품을 실험ㆍ분석하는 국가기관\n    9. 도로교통공단(「도로교통법」 제123조제1호ㆍ제2호ㆍ제4호 및 제5호의 사업을 수행하기 위하여 수입하는 물품에 한한다)\n    10. 「독립기념관법」에 의한 독립기념관\n    11. 한국소비자원(「소비자기본법」 제35조제1항제2호ㆍ제3호 및 제6호의 업무를 수행하기 위하여 수입하는 물품에 한한다)\n    12. 「한국산업안전보건공단법」에 따라 설립된 한국산업안전보건공단(같은 법 제6조의 사업을 수행하기 위하여 수입하는 물품으로 한정한다)\n    13. 「산업발전법」에 의하여 설립된 한국생산성본부\n    14. 「전쟁기념사업회법」에 의하여 설립된 전쟁기념사업회\n    15. 「한국교통안전공단법」에 따라 설립된 한국교통안전공단\n    16. 교육부장관이 인정하는 사내기술대학 및 사내기술대학원\n    17. 고용노동부장관의 인가를 받은 중소기업협동조합부설 직업훈련원\n    18. 「국토안전관리원법」에 따라 설립된 국토안전관리원\n    19. 「과학관육성법」에 의한 과학관\n    20. 「한국교육방송공사법」에 의하여 설립된 한국교육방송공사\n    21. 「지방자치단체의 행정기구와 정원기준 등에 관한 규정」에 의하여 설치된 농업기술원\n    22. 「특정연구기관 육성법」 제2조의 규정에 의한 연구기관\n    23. 산업기술연구를 목적으로 「민법」 제32조 및 「협동조합 기본법」에 따라 설립된 비영리법인으로서 독립된 연구시설을 갖추고 있는 법인임을 산업통상부장관, 과학기술정보통신부장관 또는 재정경제부장관이 확인ㆍ추천하는 기관\n    24. 「산업기술혁신 촉진법」 제42조에 따라 산업통상부장관의 허가를 받아 설립된 연구소\n    25. 「암관리법」에 따라 설립된 국립암센터 및 「국립중앙의료원의 설립 및 운영에 관한 법률」에 따라 설립된 국립중앙의료원\n    26. 「방송통신발전 기본법」 제34조에 따라 설립된 한국정보통신기술협회(한국정보통신기술협회에 설치된 시험연구소에서 사용하기 위하여 수입하는 물품으로 한정한다)\n    27. 「산업교육진흥 및 산학협력촉진에 관한 법률」에 의하여 설립된 산학협력단\n    28. 「경제자유구역 및 제주국제자유도시의 외국교육기관 설립ㆍ운영에 관한 특별법」에 따라 설립된 외국교육기관\n    29. 「국가표준기본법」 제4장의2에 따라 설립된 한국화학융합시험연구원, 한국기계전기전자시험연구원 및 한국건설생활환경시험연구원\n    30. 「산업기술혁신 촉진법」 제21조제4항에 따라 산업통상부장관이 지정한 연구장비관리 전문기관(같은 법 제2조제7호에 따른 산업기술혁신사업을 수행하는 데에 필요한 물품을 제1호부터 제29호까지의 규정에 따른 감면대상기관에서 사용하도록 하기 위하여 수입하는 경우를 포함한다)\n    31. 「보건의료기술 진흥법」 제15조에 따라 보건복지부장관이 지정한 연구중심병원\n    32. 「국방과학연구소법」에 따라 설립된 국방과학연구소\n    33. 「국가과학기술 경쟁력 강화를 위한 이공계지원 특별법」제18조제2항에 따라 과학기술정보통신부장관에게 신고한 연구개발서비스업을 영위하는 기업\n    34. 「식품위생법」 제67조제1항에 따른 식품안전정보원(「수입식품안전관리특별법 시행령」 제14조제2항제3호에 따른 업무를 수행하기 위해 수입하는 직접구매 해외식품등으로 한정한다)\n  ③법 제90조제1항제4호에 따라 관세를 감면받을 수 있는 자는 다음 각 호와 같다. <개정 2002. 5. 10., 2005. 2. 11., 2008. 12. 31., 2011. 4. 1., 2012. 2. 28., 2013. 3. 23., 2019. 3. 20.>\n    1. 기업부설 연구소 또는 연구개발 전담부서를 설치하고 있거나 설치를 위한 신고를 한 기업(「기초연구진흥 및 기술개발지원에 관한 법률」 제14조제1항제2호에 따른 것임을 과학기술정보통신부장관이 확인한 것으로 한정한다)\n    2. 산업기술연구조합(「산업기술연구조합 육성법」에 의한 산업기술연구조합으로서 기술개발을 위한 공동연구시설을 갖추고 자연계분야의 학사 이상의 학위를 가진 연구전담요원 3인 이상을 상시 확보하고 있음을 과학기술정보통신부장관이 확인한 산업기술연구조합에 한정한다)\n  ④ 법 제90조제1항제4호에 따라 관세를 감면하는 물품은 다음 각 호와 같다. <개정 2001. 6. 30., 2002. 5. 10., 2008. 12. 31., 2009. 12. 31., 2011. 4. 1., 2019. 3. 20., 2021. 3. 16.>\n    1. 산업기술의 연구ㆍ개발에 사용하기 위하여 수입하는 별표 1의2의 물품\n    2. 시약 및 견본품\n    3. 연구ㆍ개발 대상물품을 제조 또는 수리하기 위하여 사용하는 부분품 및 원재료\n    4. 제1호의 물품을 수리하기 위한 목적으로 수입하는 부분품\n  ⑤법 제90조제2항의 규정에 의한 관세의 감면율은 100분의 80으로 한다. 다만, 공공의료기관(제2항제25호의 규정에 의한 국립암센터 및 국립중앙의료원은 제외한다) 및 학교부설의료기관에서 사용할 물품에 대한 관세의 감면율은 100분의 50으로 한다. <개정 2003. 2. 14., 2009. 12. 31.>","R61-0":"제61조(과세전적부심사의 청구) 법 제118조제2항 본문에 따라 과세전적부심사를 청구하는 세관장은 다음 각 호의 구분에 의한다. <개정 2001. 3. 29., 2002. 5. 10., 2004. 3. 30., 2005. 12. 30., 2007. 5. 29., 2009. 3. 26., 2016. 1. 18., 2019. 12. 3., 2023. 3. 20., 2023. 4. 11.>\n    1. 인천공항세관장 및 김포공항세관장의 통지에 대한 과세전적부심사인 경우: 인천공항세관장\n    2. 서울세관장ㆍ안양세관장ㆍ천안세관장ㆍ청주세관장ㆍ성남세관장ㆍ파주세관장ㆍ속초세관장ㆍ동해세관장 및 대전세관장의 통지에 대한 과세전적부심사인 경우: 서울세관장\n    3. 부산세관장ㆍ김해공항세관장ㆍ용당세관장ㆍ양산세관장ㆍ창원세관장ㆍ마산세관장ㆍ경남남부세관장 및 경남서부세관장의 통지에 대한 과세전적부심사인 경우: 부산세관장\n    4. 인천세관장ㆍ평택세관장ㆍ수원세관장 및 안산세관장의 통지에 대한 과세전적부심사인 경우: 인천세관장\n    5. 대구세관장ㆍ울산세관장ㆍ구미세관장 및 포항세관장의 통지에 대한 과세전적부심사인 경우: 대구세관장\n    6. 광주세관장ㆍ광양세관장ㆍ목포세관장ㆍ여수세관장ㆍ군산세관장ㆍ제주세관장 및 전주세관장의 통지에 대한 과세전적부심사인 경우: 광주세관장","R77-0":"제77조(원산지증명서확인자료의 제출기간) 법 제232조의2제2항 각 호 외의 부분 후단에서 “재정경제부령으로 정하는 기간”이란 세관장으로부터 원산지증명서확인자료의 제출을 요구받은 날부터 30일을 말한다. 다만, 제출을 요구받은 자가 부득이한 사유로 그 기간에 원산지증명서확인자료를 제출하기 곤란할 때에는 그 기간을 30일의 범위에서 한 차례만 연장할 수 있다. <개정 2026. 1. 2.>\n  [본조신설 2011. 4. 1.]","L210-0":"제210조(매각방법) ① 제208조에 따른 매각은 일반경쟁입찰ㆍ지명경쟁입찰ㆍ수의계약ㆍ경매 및 위탁판매의 방법으로 하여야 한다.\n  ② 경쟁입찰의 방법으로 매각하려는 경우 매각되지 아니하였을 때에는 5일 이상의 간격을 두어 다시 입찰에 부칠 수 있으며 그 예정가격은 최초 예정가격의 100분의 10 이내의 금액을 입찰에 부칠 때마다 줄일 수 있다. 이 경우에 줄어들 예정가격 이상의 금액을 제시하는 응찰자가 있을 때에는 대통령령으로 정하는 바에 따라 그 응찰자가 제시하는 금액으로 수의계약을 할 수 있다.<개정 2016. 12. 20.>\n  ③ 다음 각 호의 어느 하나에 해당하는 경우에는 경매나 수의계약으로 매각할 수 있다.<개정 2016. 12. 20.>\n    1. 제2항에 따라 2회 이상 경쟁입찰에 부쳐도 매각되지 아니한 경우\n    2. 매각물품의 성질ㆍ형태ㆍ용도 등을 고려할 때 경쟁입찰의 방법으로 매각할 수 없는 경우\n  ④ 제3항에 따른 방법으로도 매각되지 아니한 물품과 대통령령으로 정하는 물품은 위탁판매의 방법으로 매각할 수 있다.\n  ⑤ 제1항부터 제4항까지에 따라 매각된 물품에 대한 과세가격은 제30조부터 제35조까지의 규정에도 불구하고 제2항에 따른 최초 예정가격을 기초로 하여 과세가격을 산출한다.\n  ⑥ 매각할 물품의 예정가격의 산출방법과 위탁판매에 관한 사항은 대통령령으로 정하고, 경매절차에 관하여는 「국세징수법」을 준용한다.\n  ⑦ 세관장은 제1항에 따라 매각할 때에는 매각 물건, 매각 수량, 매각 예정가격 등을 매각 시작 10일 전에 공고하여야 한다.\n  [전문개정 2010. 12. 30.]","D58-0":"제58조(정상가격 및 덤핑가격의 비교) ①법 제51조에서 “정상가격”이라 함은 당해 물품의 공급국에서 소비되는 동종물품의 통상거래가격을 말한다. 다만, 동종물품이 거래되지 아니하거나 특수한 시장상황 등으로 인하여 통상거래가격을 적용할 수 없는 때에는 당해 국가에서 제3국으로 수출되는 수출가격중 대표적인 가격으로서 비교가능한 가격 또는 원산지국에서의 제조원가에 합리적인 수준의 관리비 및 판매비와 이윤을 합한 가격(이하 “구성가격”이라 한다)을 정상가격으로 본다.\n  ②당해 물품의 원산지국으로부터 직접 수입되지 아니하고 제3국을 거쳐 수입되는 경우에는 그 제3국의 통상거래가격을 정상가격으로 본다. 다만, 그 제3국안에서 당해 물품을 단순히 옮겨 싣거나 동종물품의 생산실적이 없는 때 또는 그 제3국내에 통상거래가격으로 인정될 가격이 없는 때에는 원산지국의 통상거래가격을 정상가격으로 본다.\n  ③당해 물품이 통제경제를 실시하는 시장경제체제가 확립되지 아니한 국가로부터 수입되는 때에는 제1항 및 제2항의 규정에 불구하고 다음 각호의 1에 해당하는 가격을 정상가격으로 본다. 다만, 시장경제체제가 확립되지 아니한 국가가 시장경제로의 전환체제에 있는 등 재정경제부령이 정하는 경우에는 제1항 및 제2항의 규정에 따른 통상거래가격 등을 정상가격으로 볼 수 있다. <개정 2008. 2. 29., 2025. 12. 30.>\n    1. 우리나라를 제외한 시장경제국가에서 소비되는 동종물품의 통상거래가격\n    2. 우리나라를 제외한 시장경제국가에서 우리나라를 포함한 제3국으로의 수출가격 또는 구성가격\n  ④법 제51조에서 “덤핑가격”이라 함은 제60조의 규정에 의하여 조사가 개시된 조사대상물품에 대하여 실제로 지급하였거나 지급하여야 하는 가격을 말한다. 다만, 공급자와 수입자 또는 제3자 사이에 제23조제1항의 규정에 의한 특수관계 또는 보상약정이 있어 실제로 지급하였거나 지급하여야 하는 가격에 의할 수 없는 때에는 다음 각호의 1의 가격으로 할 수 있다. <개정 2008. 2. 29., 2025. 12. 30.>\n    1. 수입물품이 그 특수관계 또는 보상약정이 없는 구매자에게 최초로 재판매된 경우에는 재정경제부령이 정하는 바에 따라 그 재판매 가격을 기초로 산정한 가격\n    2. 수입물품이 그 특수관계 또는 보상약정이 없는 구매자에게 재판매된 실적이 없거나 수입된 상태로 물품이 재판매되지 아니하는 때에는 재정경제부령이 정하는 합리적인 기준에 의한 가격\n  ⑤정상가격과 덤핑가격의 비교는 가능한 한 동일한 시기 및 동일한 거래단계(통상적으로 공장도 거래단계를 말한다)에서 비교하여야 한다. 이 경우 당해 물품의 물리적 특성, 판매수량, 판매조건, 과세상의 차이, 거래단계의 차이, 환율변동 등이 가격비교에 영향을 미치는 경우에는 재정경제부령이 정하는 바에 따라 정상가격 및 덤핑가격을 조정하여야 하며, 덤핑률 조사대상기간은 6월 이상의 기간으로 한다. <개정 2008. 2. 29., 2025. 12. 30.>\n  ⑥이해관계인은 물리적 특성, 판매수량 및 판매조건의 차이로 인하여 제5항의 규정에 의한 가격조정을 요구하는 때에는 그러한 차이가 시장가격 또는 제조원가에 직접적으로 영향을 미친다는 사실을 입증하여야 한다.","D187-0":"제187조(화물관리인의 지정) ① 법 제172조제2항에 따라 화물관리인으로 지정받을 수 있는 자는 다음 각 호의 어느 하나에 해당하는 자로 한다.\n    1. 직접 물품관리를 하는 국가기관의 장\n    2. 관세행정 또는 보세화물의 관리와 관련 있는 비영리법인\n    3. 해당 시설의 소유자 또는 관리자가 요청한 자(법 제172조제2항 단서에 따라 화물관리인을 지정하는 경우로 한정한다)\n  ② 세관장은 다음 각 호의 구분에 따라 화물관리인을 지정한다.\n    1. 제1항제1호에 해당하는 자: 세관장이 요청한 후 제1항제1호에 해당하는 자가 승낙한 경우에 지정한다.\n    2. 제1항제2호 및 제3호에 해당하는 자: 세관장이 제1항제2호 및 제3호에 해당하는 자로부터 지정신청서를 제출받아 이를 심사하여 지정한다. 이 경우 제1항제3호에 해당하는 자는 해당 시설의 소유자 또는 관리자를 거쳐 제출하여야 한다.\n  ③ 제2항제2호에 따라 화물관리인을 지정할 때에는 다음 각 호의 사항에 대하여 관세청장이 정하는 심사기준에 따라 평가한 결과를 반영하여야 한다. <개정 2025. 12. 30.>\n    1. 보세화물 취급경력 및 화물관리시스템 구비 사항\n    2. 보세사의 보유에 관한 사항\n    3. 자본금, 부채비율 및 신용평가등급 등 재무건전성에 관한 사항\n    4. 그 밖에 재정경제부령으로 정하는 사항\n  ④ 화물관리인 지정의 유효기간은 5년 이내로 한다.\n  ⑤ 화물관리인으로 재지정을 받으려는 자는 제4항에 따른 유효기간이 끝나기 1개월 전까지 세관장에게 재지정을 신청하여야 한다. 이 경우 재지정의 기준 및 절차는 제1항부터 제4항까지의 규정을 준용한다. <개정 2012. 2. 2.>\n  ⑥ 세관장은 제2항에 따라 지정을 받은 자에게 재지정을 받으려면 지정의 유효기간이 끝나는 날의 1개월 전까지 재지정을 신청하여야 한다는 사실과 재지정 절차를 지정의 유효기간이 끝나는 날의 2개월 전까지 휴대폰에 의한 문자전송, 전자메일, 팩스, 전화, 문서 등으로 미리 알려야 한다. <신설 2012. 2. 2.>\n  ⑦ 제2항부터 제6항까지의 규정에 따른 화물관리인 지정 또는 재지정의 심사기준, 절차 등에 관하여 필요한 세부 사항은 재정경제부령으로 정한다. <개정 2012. 2. 2., 2025. 12. 30.>\n  [전문개정 2011. 4. 1.]","D128-0":"제128조(용도외 사용 등의 승인) 법 제107조제3항의 규정에 의한 세관장의 승인을 얻고자 하는 자는 다음 각호의 사항을 기재한 신청서에 당해 물품의 양도ㆍ양수에 관한 계약서의 사본을 첨부하여 그 물품의 관할지 세관장에게 제출하여야 한다.\n    1. 당해 물품의 품명ㆍ규격ㆍ수량ㆍ가격ㆍ통관지세관명ㆍ수입신고수리 연월일ㆍ수입신고번호\n    2. 분할납부하고자 하는 관세액과 이미 납부한 관세액\n    3. 양수인\n    4. 승인을 받고자 하는 사유","D141-6":"제141조의6(관세정보위원회의 구성 및 운영) ①법 제116조의2제2항에 따른 관세정보위원회(이하 이 조에서 “위원회”라 한다)의 위원장은 관세청 차장이 되고, 위원은 다음 각 호의 자가 된다. <개정 2006. 6. 12., 2020. 2. 11.>\n    1. 관세청의 고위공무원단에 속하는 일반직공무원 중에서 관세청장이 임명하는 자 4인\n    2. 법률 또는 재정ㆍ경제에 관한 학식과 경험이 풍부한 자 중에서 관세청장이 성별을 고려하여 위촉하는 자 6인\n  ② 제1항제2호에 해당하는 위원의 임기는 2년으로 하되, 한번만 연임할 수 있다. 다만, 보궐위원의 임기는 전임위원 임기의 남은 기간으로 한다. <개정 2017. 3. 27., 2018. 2. 13.>\n  ③ 관세청장은 위원회의 위원이 다음 각 호의 어느 하나에 해당하는 경우에는 해당 위원을 해임 또는 해촉할 수 있다. <신설 2017. 3. 27., 2018. 2. 13.>\n    1. 심신장애로 인하여 직무를 수행할 수 없게 된 경우\n    2. 직무와 관련된 비위사실이 있는 경우\n    3. 직무태만, 품위손상이나 그 밖의 사유로 인하여 위원으로 적합하지 아니하다고 인정되는 경우\n    4. 위원 스스로 직무를 수행하는 것이 곤란하다고 의사를 밝히는 경우\n    5. 제5항 각 호의 어느 하나에 해당함에도 불구하고 회피하지 아니한 경우\n  ④위원회의 회의는 위원장을 포함한 재적위원 과반수의 출석으로 개의하고, 출석위원 과반수의 찬성으로 의결한다. <개정 2017. 3. 27.>\n  ⑤ 위원회의 위원은 다음 각 호의 어느 하나에 해당하는 경우에는 심의ㆍ의결에서 제척된다. <신설 2018. 2. 13.>\n    1. 위원이 해당 안건의 당사자(당사자가 법인ㆍ단체 등인 경우에는 그 임원을 포함한다. 이하 이 항에서 같다)이거나 해당 안건에 관하여 직접적인 이해관계가 있는 경우\n    2. 위원의 배우자, 4촌 이내의 혈족 및 2촌 이내의 인척의 관계에 있는 사람이 해당 안건의 당사자이거나 해당 안건에 관하여 직접적인 이해관계가 있는 경우\n    3. 위원이 해당 안건 당사자의 대리인이거나 최근 5년 이내에 대리인이었던 경우\n    4. 위원이 해당 안건 당사자의 대리인이거나 최근 5년 이내에 대리인이었던 법인ㆍ단체 등에 현재 속하고 있거나 속하였던 경우\n    5. 위원이 최근 5년 이내에 해당 안건 당사자의 자문ㆍ고문에 응하였거나 해당 안건 당사자와 연구ㆍ용역 등의 업무 수행에 동업 또는 그 밖의 형태로 직접 해당 안건 당사자의 업무에 관여를 하였던 경우\n    6. 위원이 최근 5년 이내에 해당 안건 당사자의 자문ㆍ고문에 응하였거나 해당 안건 당사자와 연구ㆍ용역 등의 업무 수행에 동업 또는 그 밖의 형태로 직접 해당 안건 당사자의 업무에 관여를 하였던 법인ㆍ단체 등에 현재 속하고 있거나 속하였던 경우\n  ⑥ 위원회의 위원은 제5항 각 호의 어느 하나에 해당하는 경우에는 스스로 해당 안건의 심의ㆍ의결에서 회피하여야 한다. <신설 2018. 2. 13.>\n  ⑦제1항부터 제6항까지에서 규정한 사항 외에 위원회의 구성 및 운영에 관하여 필요한 사항은 관세청장이 정한다. <개정 2017. 3. 27., 2018. 2. 13.>\n  [본조신설 2006. 5. 22.]\n  [제목개정 2020. 2. 11.]\n  [제141조의3에서 이동, 종전 제141조의6은 제141조의9로 이동 <2023. 2. 28.>]","L251-0":"제251조(수출신고수리물품의 적재 등) ① 수출신고가 수리된 물품은 수출신고가 수리된 날부터 30일 이내에 운송수단에 적재하여야 한다. 다만, 재정경제부령으로 정하는 바에 따라 1년의 범위에서 적재기간의 연장승인을 받은 것은 그러하지 아니하다. <개정 2025. 10. 1.>\n  ② 세관장은 제1항에 따른 기간 내에 적재되지 아니한 물품에 대하여는 대통령령으로 정하는 바에 따라 수출신고의 수리를 취소할 수 있다.\n  [전문개정 2010. 12. 30.]","D9-0":"제9조(담보물의 평가) ① 법 제24조제1항제2호 및 제3호에 따른 담보물의 평가는 다음 각 호에 따른다. <개정 2013. 8. 27.>\n    1. 「자본시장과 금융투자업에 관한 법률」에 따라 거래소가 개설한 증권시장에 상장된 유가증권 중 매매사실이 있는 것: 담보로 제공하는 날의 전날에 공표된 최종시세가액\n    2. 제1호 외의 유가증권: 담보로 제공하는 날의 전날에 「상속세 및 증여세법 시행령」 제58조제1항제2호를 준용하여 계산한 가액\n  ② 법 제24조제1항제5호 및 제6호에 따른 담보물에 대한 평가는 다음 각 호에 따른다. <개정 2016. 8. 31., 2022. 1. 21.>\n    1. 토지 또는 건물의 평가: 「상속세 및 증여세법」 제61조를 준용하여 평가한 가액\n    2. 공장재단ㆍ광업재단ㆍ선박ㆍ항공기 또는 건설기계: 「감정평가 및 감정평가사에 관한 법률」에 따른 감정평가법인등의 평가액 또는 「지방세법」에 따른 시가표준액\n  [전문개정 2009. 2. 4.]","R19-0":"제19조(가격수정ㆍ수출중지 등의 약속) ①영 제68조제1항에 따라 수출자가 재정경제부장관에게 약속을 제의하는 경우 그 약속에는 다음 각 호의 사항이 포함되어야 한다. <개정 2008. 12. 31., 2026. 1. 2.>\n    1. 수출자가 수출가격을 실질적 피해등이 제거될 수 있는 수준으로 인상한다는 내용 또는 재정경제부장관과 협의하여 정하는 기간내에 덤핑수출을 중지한다는 내용\n    2. 약속수락전까지 계약되거나 선적되는 물품에 관한 내용\n    3. 형식ㆍ모양ㆍ명칭 등의 변경이나 저급품의 판매 등의 방법으로 약속의 이행을 회피하는 행위를 하지 아니하겠다는 내용\n    4. 제3국이나 제3자를 통한 판매 등의 방법으로 사실상 약속을 위반하지 아니하겠다는 내용\n    5. 수출국안에서의 판매물량 및 판매가격과 우리나라로의 수출물량 및 수출가격에 대하여 재정경제부장관에게 정기적으로 보고하겠다는 내용\n    6. 관련자료에 대한 검증을 허용하겠다는 내용\n    7. 그 밖의 상황변동의 경우에 재정경제부장관의 요구에 대하여 재협의할 수 있다는 내용\n  ②재정경제부장관은 영 제68조제2항 본문에 따라 약속을 수락하기 전에 무역위원회, 관계행정기관의 장 및 이해관계인의 의견을 물을 수 있다. <개정 2008. 12. 31., 2026. 1. 2.>\n  ③ 재정경제부장관은 다음 각 호의 어느 하나에 해당하는 경우에는 영 제68조제2항 단서에 따라 약속을 수락하지 아니할 수 있다. <개정 2008. 12. 31., 2026. 1. 2.>\n    1. 다수의 수출자를 대리하여 약속을 제의한 자가 그 다수의 수출자간에 완전한 합의가 이루어졌음을 입증하지 못하는 경우\n    2. 약속의 이행여부에 대한 적절한 확인 또는 조사를 곤란하게 하는 조건이 있는 경우\n    3. 과거에 약속을 위반하였던 사실이 있는 등 약속을 수락할 수 없다고 인정되는 합리적인 사유가 있는 경우\n  ④영 제68조제3항에 따라 재정경제부장관으로부터 약속을 제의받은 수출자는 1개월 이내에 수락여부를 통보하여야 한다. <개정 2008. 12. 31., 2026. 1. 2.>","D17-0":"제17조(우리나라에 수출하기 위하여 판매되는 물품의 범위) 법 제30조제1항 본문에 따른 우리나라에 수출하기 위하여 판매되는 물품은 해당 물품을 우리나라에 도착하게 한 원인이 되는 거래를 통해 판매되는 물품으로 한다. 다만, 다음 각 호의 물품은 포함되지 않는다.\n    1. 무상으로 국내에 도착하는 물품\n    2. 국내 도착 후 경매 등을 통해 판매가격이 결정되는 위탁판매물품\n    3. 수출자의 책임으로 국내에서 판매하기 위해 국내에 도착하는 물품\n    4. 별개의 독립된 법적 사업체가 아닌 지점 등과의 거래에 따라 국내에 도착하는 물품\n    5. 임대차계약에 따라 국내에 도착하는 물품\n    6. 무상으로 임차하여 국내에 도착하는 물품\n    7. 산업쓰레기 등 수출자의 부담으로 국내에서 폐기하기 위해 국내에 도착하는 물품\n  [전문개정 2024. 2. 29.]","L116-5":"제116조의5(출국금지 요청 등) ① 관세청장은 정당한 사유 없이 5천만원 이상의 관세(세관장이 부과ㆍ징수하는 내국세등을 포함한다. 이하 이 조에서 같다)를 체납한 자 중 대통령령으로 정하는 자에 대하여 법무부장관에게 「출입국관리법」 제4조제3항 및 같은 법 제29조제2항에 따라 출국금지 또는 출국정지를 즉시 요청하여야 한다.\n  ② 법무부장관은 제1항에 따른 출국금지 또는 출국정지 요청에 따라 출국금지 또는 출국정지를 한 경우에는 관세청장에게 그 결과를 「정보통신망 이용촉진 및 정보보호 등에 관한 법률」 제2조제1항제1호에 따른 정보통신망 등을 통하여 통보하여야 한다.\n  ③ 관세청장은 다음 각 호의 어느 하나에 해당하는 경우에는 즉시 법무부장관에게 출국금지 또는 출국정지의 해제를 요청하여야 한다.\n    1. 체납자가 체납액을 전부 또는 일부 납부하여 체납된 관세가 5천만원 미만으로 된 경우\n    2. 체납자 재산의 압류, 담보 제공 등으로 출국금지 사유가 해소된 경우\n    3. 관세징수권의 소멸시효가 완성된 경우\n    4. 그 밖에 대통령령으로 정하는 사유가 있는 경우\n  ④ 제1항부터 제3항까지에서 규정한 사항 외에 출국금지 및 출국정지 요청 등의 절차에 관하여 필요한 사항은 대통령령으로 정한다.\n  [본조신설 2019. 12. 31.]","L38-0":"제38조(신고납부) ① 물품(제39조에 따라 세관장이 부과고지하는 물품은 제외한다)을 수입하려는 자는 수입신고를 할 때에 세관장에게 관세의 납부에 관한 신고(이하 “납세신고”라 한다)를 하여야 한다.\n  ② 세관장은 납세신고를 받으면 수입신고서에 기재된 사항과 이 법에 따른 확인사항 등을 심사하되, 신고한 세액 등 납세신고 내용에 대한 심사(이하 “세액심사”라 한다)는 수입신고를 수리한 후에 한다. 다만, 신고한 세액에 대하여 관세채권을 확보하기가 곤란하거나, 수입신고를 수리한 후 세액심사를 하는 것이 적당하지 아니하다고 인정하여 재정경제부령으로 정하는 물품의 경우에는 수입신고를 수리하기 전에 이를 심사한다.<개정 2023. 12. 31., 2025. 10. 1.>\n  ③ 세관장은 세액심사를 할 때 제1항에 따라 제출된 신고서나 그 밖의 서류에 미비한 점이 있거나 오류가 있는 경우에는 보완할 것을 요구할 수 있다.<신설 2024. 12. 31.>\n  ④ 세관장은 제2항 본문에도 불구하고 납세실적과 수입규모 등을 고려하여 관세청장이 정하는 요건을 갖춘 자가 신청할 때에는 납세신고한 세액을 자체적으로 심사(이하 “자율심사”라 한다)하게 할 수 있다. 이 경우 해당 납세의무자는 자율심사한 결과를 세관장에게 제출하여야 한다.<개정 2024. 12. 31.>\n  ⑤ 납세의무자는 납세신고한 세액을 납부하기 전에 그 세액이 과부족(過不足)하다는 것을 알게 되었을 때에는 납세신고한 세액을 정정할 수 있다. 이 경우 납부기한은 당초의 납부기한(제9조에 따른 납부기한을 말한다)으로 한다.\n  <개정 2024. 12. 31.>\n  ⑥ 납세신고, 자율심사 및 제5항에 따른 세액의 정정과 관련하여 그 방법 및 절차 등 필요한 사항은 대통령령으로 정한다.<개정 2024. 12. 31.>\n  ⑦ 관세의 납부에 관하여는 「국세징수법」 제12조제1항제3호, 같은 조 제2항 및 제3항을 준용한다.<개정 2020. 12. 22., 2024. 12. 31.>\n  [전문개정 2010. 12. 30.]","D136-0":"제136조(중복조사의 금지) 법 제111조제2항제5호에서 “대통령령으로 정하는 경우”란 다음 각 호의 어느 하나에 해당하는 경우를 말한다.\n    1. 밀수출입, 부정ㆍ불공정무역 등 경제질서 교란 등을 통한 탈세혐의가 있는 자에 대해서 일제조사를 하는 경우\n    2. 관세 부과 업무를 담당하는 기관 외의 기관이 직무상 목적을 위해 작성하거나 취득해 관세 부과 업무를 담당하는 기관에 제공한 자료의 처리를 위해 조사하는 경우\n    3. 관세환급금의 결정을 위한 확인조사를 하는 경우\n  [전문개정 2025. 2. 28.]\n  제137조 삭제 <2014. 3. 5.>","L176-2":"제176조의2(특허보세구역의 특례) ① 세관장은 제196조제1항에 따라 물품을 판매하는 보세판매장 특허를 부여하는 경우에 다음 각 호의 기업으로서 매출액, 자산총액 및 지분 소유나 출자 관계 등이 대통령령으로 정하는 기준에 맞는 기업 중 제174조제3항에 따른 특허를 받을 수 있는 요건을 갖춘 자(이하 이 조에서 “중소기업등”이라 한다)에게 대통령령으로 정하는 일정 비율 이상의 특허를 부여하여야 하고,「독점규제 및 공정거래에 관한 법률」제31조제1항에 따른 상호출자제한기업집단에 속한 기업에 대해 대통령령으로 정하는 일정 비율 이상의 특허를 부여할 수 없다. 다만, 세관장은 제196조제2항에 따라 물품을 판매하는 보세판매장의 경우에는 중소기업등에게만 특허를 부여할 수 있다.\n  <개정 2014. 1. 1., 2014. 1. 21., 2018. 12. 31., 2020. 12. 29., 2024. 12. 31.>\n    1. 「중소기업기본법」 제2조에 따른 중소기업\n    2. 「중견기업 성장촉진 및 경쟁력 강화에 관한 특별법」 제2조제1호에 따른 중견기업\n  ② 제1항에도 불구하고 기존 특허가 만료되었으나 제3항에 따른 신규 특허의 신청이 없는 등 대통령령으로 정하는 경우에는 제1항을 적용하지 아니한다.\n  ③ 보세판매장의 특허는 대통령령으로 정하는 일정한 자격을 갖춘 자의 신청을 받아 대통령령으로 정하는 평가기준에 따라 심사하여 부여한다. 기존 특허가 만료되는 경우에도 또한 같다.<개정 2014. 12. 23., 2024. 12. 31.>\n  ④ 보세판매장의 특허수수료는 제174조제2항에도 불구하고 운영인의 보세판매장별 매출액(기업회계기준에 따라 계산한 매출액을 말한다)을 기준으로 재정경제부령으로 정하는 바에 따라 다른 종류의 보세구역 특허수수료와 달리 정할 수 있다. 다만, 「재난 및 안전관리 기본법」 제3조제1호의 재난으로 인하여 보세판매장의 영업에 현저한 피해를 입은 경우 보세판매장의 특허수수료를 감경할 수 있다.<개정 2019. 12. 31., 2020. 12. 22., 2025. 10. 1.>\n  ⑤ 삭제<2022. 12. 31.>\n  ⑥ 제1항에 따라 특허를 받은 자는 두 차례에 한정하여 대통령령으로 정하는 바에 따라 특허를 갱신할 수 있다. 이 경우 갱신기간은 한 차례당 5년 이내로 한다.<신설 2014. 12. 23., 2018. 12. 31., 2020. 6. 9., 2022. 12. 31.>\n  ⑦ 재정경제부장관은 매 회계연도 종료 후 4개월 이내에 보세판매장별 매출액을 대통령령으로 정하는 바에 따라 국회 소관 상임위원회에 보고하여야 한다.<개정 2014. 12. 23., 2021. 12. 21., 2025. 10. 1.>\n  ⑧ 그 밖에 보세판매장 특허절차에 관한 사항은 대통령령으로 정한다.<개정 2014. 12. 23., 2020. 6. 9.>\n  [본조신설 2013. 1. 1.]","D218-0":"제218조(종합보세구역의 지정취소 사유) ①법 제204조제1항에서 “대통령령으로 정하는 사유”란 다음 각 호의 경우를 말한다. <개정 2011. 4. 1.>\n    1. 종합보세구역의 지정요청자가 지정취소를 요청한 경우\n    2. 종합보세구역의 지정요건이 소멸한 경우\n  ② 삭제 <2019. 2. 12.>\n  [제목개정 2019. 2. 12.]","L94-0":"제94조(소액물품 등의 면세) 다음 각 호의 어느 하나에 해당하는 물품이 수입될 때에는 그 관세를 면제할 수 있다. <개정 2020. 12. 22., 2025. 10. 1.>\n    1. 우리나라의 거주자에게 수여된 훈장ㆍ기장(紀章) 또는 이에 준하는 표창장 및 상패\n    2. 기록문서 또는 그 밖의 서류\n    3. 상업용견본품 또는 광고용품으로서 재정경제부령으로 정하는 물품\n    4. 우리나라 거주자가 받는 소액물품으로서 재정경제부령으로 정하는 물품\n  [전문개정 2010. 12. 30.]","D143-0":"제143조(과세전적부심사의 범위 및 청구절차 등) ① 법 제118조제2항 단서에서 “법령에 대한 관세청장의 유권해석을 변경하여야 하거나 새로운 해석이 필요한 경우 등 대통령령으로 정하는 경우”란 다음 각 호의 어느 하나에 해당하는 경우를 말한다. <개정 2001. 12. 31., 2004. 3. 29., 2007. 4. 5., 2010. 3. 26., 2011. 4. 1., 2012. 2. 2., 2023. 2. 28.>\n    1. 관세청장의 훈령ㆍ예규ㆍ고시 등과 관련하여 새로운 해석이 필요한 경우\n    2. 관세청장의 업무감사결과 또는 업무지시에 따라 세액을 경정하거나 부족한 세액을 징수하는 경우\n    3. 관세평가분류원장의 품목분류 및 유권해석에 따라 수출입물품에 적용할 세율이나 물품분류의 관세율표 번호가 변경되어 세액을 경정하거나 부족한 세액을 징수하는 경우\n    4. 동일 납세의무자가 동일한 사안에 대하여 둘 이상의 세관장에게 과세전적부심사를 청구하여야 하는 경우\n    5. 제1호부터 제4호까지의 규정에 해당하지 아니하는 경우로서 과세전적부심사 청구금액이 5억원 이상인 것\n  ② 납세의무자가 법 제118조제2항에 따른 과세전적부심사를 청구한 경우 세관장은 그 청구 부분에 대하여 같은 조 제3항에 따른 결정이 있을 때까지 경정을 유보(留保)해야 한다. 다만, 다음 각 호의 어느 하나에 해당하는 경우에는 그렇지 않다. <신설 2023. 2. 28.>\n    1. 과세전적부심사를 청구한 날부터 법 제21조에 따른 관세부과의 제척기간 만료일까지 남은 기간이 3개월 이하인 경우\n    2. 법 제118조제1항 각 호의 어느 하나에 해당하는 경우\n    3. 납세의무자가 과세전적부심사를 청구한 이후 세관장에게 조기에 경정해 줄 것을 신청한 경우\n  [제목개정 2023. 2. 28.]","D37-0":"제37조(징수금액의 최저한) ①법 제40조의 규정에 의하여 세관장이 징수하지 아니하는 금액은 1만원으로 한다. <개정 2001. 12. 31., 2006. 5. 22.>\n  ②제1항의 규정에 따라 관세를 징수하지 아니하게 된 경우에는 당해 물품의 수입신고수리일을 그 납부일로 본다. <신설 2001. 12. 31.>\n  제38조 삭제 <2020. 2. 11.>","D245-5":"제245조의5(다른 국가와의 수출입신고자료 등의 교환) ① 법 제240조의6제3항에서 “수출입신고자료 등 대통령령으로 정하는 사항”이란 다음 각 호의 어느 하나에 해당하는 사항을 말한다.\n    1. 수출ㆍ수입 또는 반송의 신고와 관련된 다음 각 목의 자료\n      가. 신고서\n      나. 송품장, 포장명세서, 원산지증명서 및 선하증권 등 신고 시 제출한 자료\n      다. 가목 및 나목의 서류 또는 자료의 진위 확인에 필요한 자료\n    2. 해당 물품에 대한 법 제30조부터 제35조까지의 규정에 따른 과세가격의 결정 및 관세율표상의 품목분류의 정확성 확인에 필요한 자료\n    3. 법 제234조 및 제235조에 따라 수출하거나 수입할 수 없는 물품의 반출입과 관련된 자료\n    4. 법 제283조부터 제318조까지의 규정에 따른 관세범의 조사 및 처분과 관련된 자료\n  ② 관세청장은 제1항제1호에 따른 자료를 다른 국가와 교환한 경우에는 법 제240조의6제5항에 따라 그 교환한 날부터 10일 이내에 자료의 교환 사실 및 내용 등을 해당 신고인 또는 그 대리인에게 통지하여야 한다.\n  ③ 관세청장은 제2항에도 불구하고 해당 통지가 다음 각 호의 어느 하나에 해당하는 경우에는 6개월의 범위에서 통지를 유예할 수 있다. 다만, 제1호에 해당하는 경우에는 6개월을 초과하여 유예할 수 있다.\n    1. 사람의 생명이나 신체의 안전을 위협할 우려가 있는 경우\n    2. 증거인멸 등 공정한 사법절차의 진행을 방해할 우려가 있는 경우\n    3. 질문ㆍ조사 등의 행정절차 진행을 방해하거나 지나치게 지연시킬 우려가 있는 경우\n    4. 다른 국가로부터 해당 통지의 유예를 서면으로 요청받은 경우\n  [본조신설 2015. 2. 6.]","L225-0":"제225조(보세화물 취급 선박회사 등의 신고 및 보고) ① 보세화물을 취급하는 선박회사 또는 항공사(그 업무를 대행하는 자를 포함한다. 이하 같다)는 대통령령으로 정하는 바에 따라 세관장에게 신고하여야 한다. 신고인의 주소 등 대통령령으로 정하는 중요한 사항을 변경한 때에도 또한 같다. <개정 2011. 7. 25.>\n  ② 세관장은 통관의 신속을 도모하고 보세화물의 관리절차를 간소화하기 위하여 필요하다고 인정할 때에는 대통령령으로 정하는 바에 따라 제1항에 따른 선박회사 또는 항공사로 하여금 해당 업무에 관하여 보고하게 할 수 있다.\n  <개정 2011. 7. 25., 2020. 6. 9.>\n  ③ 삭제<2011. 7. 25.>\n  [전문개정 2010. 12. 30.]\n  [제목개정 2011. 7. 25.]","D23-0":"제23조(특수관계의 범위 등) ①법 제30조제3항제4호에서 “대통령령으로 정하는 특수관계”란 다음 각 호의 어느 하나에 해당하는 경우를 말한다. <개정 2006. 5. 22., 2011. 4. 1., 2013. 2. 15.>\n    1. 구매자와 판매자가 상호 사업상의 임원 또는 관리자인 경우\n    2. 구매자와 판매자가 상호 법률상의 동업자인 경우\n    3. 구매자와 판매자가 고용관계에 있는 경우\n    4. 특정인이 구매자 및 판매자의 의결권 있는 주식을 직접 또는 간접으로 5퍼센트 이상 소유하거나 관리하는 경우\n    5. 구매자 및 판매자중 일방이 상대방에 대하여 법적으로 또는 사실상으로 지시나 통제를 할 수 있는 위치에 있는 등 일방이 상대방을 직접 또는 간접으로 지배하는 경우\n    6. 구매자 및 판매자가 동일한 제3자에 의하여 직접 또는 간접으로 지배를 받는 경우\n    7. 구매자 및 판매자가 동일한 제3자를 직접 또는 간접으로 공동지배하는 경우\n    8. 구매자와 판매자가 「국세기본법 시행령」 제1조의2제1항 각 호의 어느 하나에 해당하는 친족관계에 있는 경우\n  ②법 제30조제3항제4호 단서에서 “해당 산업부문의 정상적인 가격결정 관행에 부합하는 방법으로 결정된 경우 등 대통령령으로 정하는 경우”란 다음 각 호의 어느 하나에 해당하는 경우를 말한다. <개정 2008. 2. 29., 2015. 2. 6., 2020. 10. 7., 2025. 12. 30.>\n    1. 특수관계가 없는 구매자와 판매자간에 통상적으로 이루어지는 가격결정방법으로 결정된 경우\n    2. 당해 산업부문의 정상적인 가격결정 관행에 부합하는 방법으로 결정된 경우\n    3.해당 물품의 가격이 다음 각 목의 어느 하나의 가격(이하 이 조에서 “비교가격”이라 한다)에 근접하는 가격으로서 재정경제부령으로 정하는 가격에 해당함을 구매자가 입증한 경우. 이 경우 비교가격 산출의 기준시점은 재정경제부령으로 정한다.\n      가. 특수관계가 없는 우리나라의 구매자에게 수출되는 동종ㆍ동질물품 또는 유사물품의 거래가격\n      나. 법 제33조 및 법 제34조의 규정에 의하여 결정되는 동종ㆍ동질물품 또는 유사물품의 과세가격\n  ③ 해당 물품의 가격과 비교가격을 비교할 때에는 거래단계, 거래수량 및 법 제30조제1항 각 호의 금액의 차이 등을 고려해야 한다. <개정 2020. 10. 7.>\n  ④제2항의 규정을 적용받고자 하는 자는 관세청장이 정하는 바에 따라 가격신고를 하는 때에 그 증명에 필요한 자료를 제출하여야 한다.","D285-6":"제285조의6(전자문서중계사업자에 대한 과징금의 부과기준 등) ① 법 제327조의3제4항에 따라 부과하는 과징금의 금액은 제1호의 기간에 제2호의 금액을 곱하여 산정한다. 이 경우 산정한 금액이 1억원을 넘을 때에는 1억원으로 한다. <개정 2010. 3. 26., 2024. 2. 29.>\n    1. 기간: 법 제327조의3제3항에 따라 산정된 업무정지 일수(1개월은 30일을 기준으로 한다)\n    2. 1일당 과징금 금액: 30만원\n  ②관세청장은 전자문서중계사업자의 사업규모ㆍ위반행위의 정도 및 횟수 등을 참작하여 제1항의 규정에 의한 과징금의 금액의 4분의 1의 범위안에서 이를 가중 또는 경감할 수 있다. 이 경우 가중하는 때에도 과징금의 총액이 1억원을 초과할 수 없다. <개정 2010. 3. 26., 2024. 2. 29.>\n  [본조신설 2002. 12. 30.]\n  [제목개정 2024. 2. 29.]\n  [제285조의5에서 이동 <2009. 2. 4.>]","D187-3":"제187조의3(화물관리인의 보관책임) 법 제172조제2항 본문에 따른 보관의 책임은 법 제160조제2항에 따른 보관인의 책임과 해당 화물의 보관과 관련한 하역ㆍ재포장 및 경비 등을 수행하는 책임으로 한다.\n  [본조신설 2011. 4. 1.]","L38-2":"제38조의2(보정) ① 납세의무자는 신고납부한 세액이 부족하다는 것을 알게 되거나 세액산출의 기초가 되는 과세가격 또는 품목분류 등에 오류가 있는 것을 알게 되었을 때에는 신고납부한 날부터 6개월 이내(이하 “보정기간”이라 한다)에 대통령령으로 정하는 바에 따라 해당 세액을 보정(補正)하여 줄 것을 세관장에게 신청할 수 있다. <개정 2011. 12. 31.>\n  ② 세관장은 신고납부한 세액이 부족하다는 것을 알게 되거나 세액산출의 기초가 되는 과세가격 또는 품목분류 등에 오류가 있다는 것을 알게 되었을 때에는 대통령령으로 정하는 바에 따라 납세의무자에게 해당 보정기간에 보정신청을 하도록 통지할 수 있다. 이 경우 세액보정을 신청하려는 납세의무자는 대통령령으로 정하는 바에 따라 세관장에게 신청하여야 한다.<개정 2011. 12. 31.>\n  ③ 삭제<2011. 12. 31.>\n  ④ 납세의무자가 제1항과 제2항 후단에 따라 부족한 세액에 대한 세액의 보정을 신청한 경우에는 해당 보정신청을 한 날의 다음 날까지 해당 관세를 납부하여야 한다.\n  ⑤ 세관장은 제1항과 제2항 후단에 따른 신청에 따라 세액을 보정한 결과 부족한 세액이 있을 때에는 제42조에도 불구하고 납부기한(제9조에 따른 납부기한을 말한다) 다음 날부터 보정신청을 한 날까지의 기간과 금융회사의 정기예금에 대하여 적용하는 이자율을 고려하여 대통령령으로 정하는 이율에 따라 계산한 금액을 더하여 해당 부족세액을 징수하여야 한다. 다만, 다음 각 호의 어느 하나에 해당하는 경우에는 그러하지 아니하다.<개정 2011. 12. 31., 2019. 12. 31., 2021. 12. 21.>\n    1. 국가 또는 지방자치단체가 직접 수입하는 물품 등 대통령령으로 정하는 물품의 경우\n    2. 신고납부한 세액의 부족 등에 대하여 납세의무자에게 대통령령으로 정하는 정당한 사유가 있는 경우\n  ⑥ 제5항에도 불구하고 납세의무자가 제42조제2항에 따른 부정한 행위로 과소신고한 후 제1항과 제2항 후단에 따른 신청을 한 경우에는 세관장은 제42조제2항에 따른 가산세를 징수하여야 한다.<신설 2021. 12. 21., 2022. 12. 31.>\n  [전문개정 2010. 12. 30.]","R80-3":"제80조의3(신용카드 등에 의한 통고처분 납부) 영 제270조의2제7항에 따른 납부대행수수료는 관세청장이 통고처분납부대행기관의 운영경비 등을 종합적으로 고려하여 승인하되, 해당 납부금액의 1천분의 10을 초과할 수 없다.\n  [본조신설 2019. 3. 20.]","D100-0":"제100조(관세품목분류위원회의 구성 등) ①법 제85조제2항에 따른 관세품목분류위원회(이하 “관세품목분류위원회”라 한다)는 위원장 1명과 30명 이상 40명 이하의 위원으로 구성한다. <개정 2004. 3. 29., 2007. 4. 5., 2019. 2. 12.>\n  ②관세품목분류위원회의 위원장은 관세청의 3급 공무원 또는 고위공무원단에 속하는 일반직공무원으로서 관세청장이 지정하는 자가 되고, 위원은 다음 각 호의 어느 하나에 해당하는 자중에서 관세청장이 임명 또는 위촉한다. <개정 2004. 3. 29., 2006. 5. 22., 2006. 6. 12., 2007. 4. 5.>\n    1. 관세청소속 공무원\n    2. 관계중앙행정기관의 공무원\n    3. 삭제 <2004. 3. 29.>\n    4. 시민단체(「비영리민간단체 지원법」 제2조의 규정에 의한 비영리민간단체를 말한다. 이하 같다)에서 추천한 자\n    5. 기타 상품학에 관한 지식이 풍부한 자\n  ③ 제2항제4호 및 제5호에 해당하는 위원의 임기는 2년으로 하되, 한번만 연임할 수 있다. 다만, 보궐위원의 임기는 전임위원 임기의 남은 기간으로 한다. <신설 2017. 3. 27., 2018. 2. 13.>\n  ④ 관세청장은 관세품목분류위원회의 위원이 다음 각 호의 어느 하나에 해당하는 경우에는 해당 위원을 해임 또는 해촉할 수 있다. <신설 2017. 3. 27., 2018. 2. 13.>\n    1. 심신장애로 인하여 직무를 수행할 수 없게 된 경우\n    2. 직무와 관련된 비위사실이 있는 경우\n    3. 직무태만, 품위손상이나 그 밖의 사유로 인하여 위원으로 적합하지 아니하다고 인정되는 경우\n    4. 위원 스스로 직무를 수행하는 것이 곤란하다고 의사를 밝히는 경우\n    5. 제101조의2제1항 각 호의 어느 하나에 해당함에도 불구하고 회피하지 아니한 경우\n  ⑤관세품목분류위원회의 위원장은 위원회의 사무를 총괄하고 위원회를 대표한다. <개정 2017. 3. 27., 2020. 12. 29.>\n  ⑥관세품목분류위원회의 위원장이 직무를 수행하지 못하는 부득이한 사정이 있는 때에는 위원장이 지명하는 위원이 그 직무를 대행한다. <개정 2017. 3. 27.>\n  ⑦관세품목분류위원회의 위원중 공무원인 위원이 회의에 출석하지 못할 부득이한 사정이 있는 때에는 그가 소속된 기관의 다른 공무원으로 하여금 회의에 출석하여 그 직무를 대행하게 할 수 있다. <개정 2017. 3. 27.>\n  ⑧관세청장은 회의의 원활한 운영을 위하여 품목분류와 관련된 기술적인 사항 등에 대한 의견을 듣기 위하여 관련 학계ㆍ연구기관 또는 협회 등에서 활동하는 자를 기술자문위원으로 위촉할 수 있다. <신설 2004. 3. 29., 2017. 3. 27.>","D250-0":"제250조(신고서류) ①법 제245조제1항에서 “대통령령으로 정하는 서류”란 다음 각 호의 서류를 말한다. <개정 2011. 4. 1.>\n    1. 선하증권 사본 또는 항공화물운송장 사본\n    2. 원산지증명서(제236조제1항이 적용되는 경우로 한정한다)\n    3. 기타 참고서류\n  ②수출입신고를 하는 물품이 법 제226조의 규정에 의한 증명을 필요로 하는 것인 때에는 관련증명서류를 첨부하여 수출입신고를 하여야 한다. 다만, 세관장은 필요없다고 인정되는 때에는 이를 생략하게 할 수 있다.","D24-0":"제24조(과세가격 불인정의 범위 등) ①법 제30조제4항에서 “대통령령으로 정하는 경우”란 다음 각 호의 어느 하나에 해당하는 경우를 말한다. <개정 2008. 2. 29., 2011. 4. 1., 2013. 2. 15., 2016. 2. 5., 2025. 12. 30.>\n    1. 납세의무자가 신고한 가격이 동종ㆍ동질물품 또는 유사물품의 가격과 현저한 차이가 있는 경우\n    2. 납세의무자가 동일한 공급자로부터 계속하여 수입하고 있음에도 불구하고 신고한 가격에 현저한 변동이 있는 경우\n    3. 신고한 물품이 원유ㆍ광석ㆍ곡물 등 국제거래시세가 공표되는 물품인 경우 신고한 가격이 그 국제거래시세와 현저한 차이가 있는 경우\n    3의2. 신고한 물품이 원유ㆍ광석ㆍ곡물 등으로서 국제거래시세가 공표되지 않는 물품인 경우 관세청장 또는 관세청장이 지정하는 자가 조사한 수입물품의 산지 조사가격이 있는 때에는 신고한 가격이 그 조사가격과 현저한 차이가 있는 경우\n    4. 납세의무자가 거래처를 변경한 경우로서 신고한 가격이 종전의 가격과 현저한 차이가 있는 경우\n    5. 제1호부터 제4호까지의 사유에 준하는 사유로서 재정경제부령으로 정하는 경우\n  ②세관장은 법 제30조제4항에 따라 자료제출을 요구하는 경우 그 사유와 자료제출에 필요한 재정경제부령으로 정하는 기간을 적은 서면으로 해야 한다. <개정 2020. 10. 7., 2025. 12. 30.>\n  ③법 제30조제5항제3호에서 “대통령령으로 정하는 사유에 해당하여 신고가격을 과세가격으로 인정하기 곤란한 경우”란 다음 각 호의 어느 하나에 해당하는 경우를 말한다. <신설 2007. 4. 5., 2011. 4. 1.>\n    1. 납세의무자가 제출한 자료가 수입물품의 거래관계를 구체적으로 나타내지 못하는 경우\n    2. 그 밖에 납세의무자가 제출한 자료에 대한 사실관계를 확인할 수 없는 등 신고가격의 정확성이나 진실성을 의심할만한 합리적인 사유가 있는 경우","L277-3":"제277조의3(비밀유지 의무 위반에 대한 과태료) ① 관세청장은 제116조제1항ㆍ제6항 또는 제116조의6제10항을 위반하여 과세정보를 타인에게 제공 또는 누설하거나 그 목적 외의 용도로 사용한 자에게 2천만원 이하의 과태료를 부과ㆍ징수한다. 다만, 「형법」 등 다른 법률에 따라 형사처벌을 받은 경우에는 과태료를 부과하지 아니하고, 과태료를 부과한 후 형사처벌을 받은 경우에는 과태료 부과를 취소한다. <개정 2023. 12. 31.>\n  ② 제1항 본문에 따른 과태료의 부과기준은 대통령령으로 정한다.\n  [본조신설 2022. 12. 31.]","R7-10":"제7조의10(특수관계자간 거래물품의 과세가격 결정방법 사전심사) ① 영 제31조제1항제4호의2에서 “재정경제부령으로 정하는 서류”란 다음 각 호의 서류를 말한다. 다만, 제2호 및 제7호의 서류는 특수관계 사전심사 신청 물품의 과세가격 결정방법과 관련이 없다고 관세청장이 인정하는 경우에는 제출하지 않을 수 있다. <개정 2021. 3. 16., 2026. 1. 2.>\n    1. 거래당사자의 사업연혁, 사업내용, 조직 및 출자관계 등에 관한 설명자료\n    2. 관할 세무서에 신고한 거래당사자의 최근 3년 동안의 재무제표, 무형자산 및 용역거래를 포함한 「국제조세조정에 관한 법률」 제16조제2항제3호에 따른 정상가격 산출방법 신고서\n    3. 원가분담 계약서, 비용분담 계약서 등 수입물품 거래에 관한 서류\n    4. 수입물품 가격의 산출방법을 구체적으로 설명하는 다음 각 목의 자료\n      가. 가격산출 관련 재무자료\n      나. 가격산출의 전제가 되는 조건 또는 가정에 대한 설명자료\n      다. 특수관계자간 가격결정에 관한 내부지침 및 정책\n    5. 「국제조세조정에 관한 법률」 제14조에 따른 정상가격 산출방법의 사전승인을 받은 경우 이를 증명하는 서류\n    6. 회계법인이 작성한 이전가격보고서가 있는 경우 산출근거자료 및 자산ㆍ용역의 가격에 영향을 미치는 요소에 관한 분석자료가 포함된 보고서\n    7. 판매 형태에 따라 구분한 최근 3년간 수입품목별 매출액ㆍ매출원가\n    8. 특수관계가 거래가격에 영향을 미치지 않았음을 확인할 수 있는 자료\n  ② 제1항에도 불구하고 사전심사를 신청하는 자가 「중소기업기본법」제2조에 따른 중소기업인 경우에는 영 제31조제1항제4호의2의 “재정경제부령으로 정하는 서류”는 제1항제4호 및 제8호의 자료를 말한다. <개정 2026. 1. 2.>\n  ③ 영 제31조제7항제4호에 따라 특수관계 사전심사 결과의 적용기간을 연장하려는 자는 관세청장이 정하는 특수관계 사전심사 적용기간 연장 신청서에 다음 각 호의 서류를 첨부하여 관세청장에게 제출해야 한다. 다만, 연장 신청일 이전에 법 제37조제5항에 따른 보고서에 다음 각 호의 서류를 포함하여 제출하였고, 연장 신청일 현재 거래사실 등이 변동되지 않은 경우에는 첨부하지 않을 수 있다. <개정 2022. 3. 18.>\n    1. 수입물품 거래 관련 계약서(수입물품과 관련된 기술용역 계약서 등을 포함한다)\n    2. 사전심사 결정물품의 거래 상대방 및 거래단계 등을 확인할 수 있는 서류\n    3. 사전심사 결과 결정된 과세가격 결정방법의 전제가 되는 조건 또는 가정의 변동 여부를 확인할 수 있는 자료\n  [본조신설 2020. 10. 7.]","D31-0":"제31조(과세가격 결정방법의 사전심사) ①법 제37조제1항에 따라 과세가격 결정에 관한 사전심사를 신청하려는 자는 거래당사자ㆍ통관예정세관ㆍ신청내용 등을 적은 신청서에 다음 각 호의 서류를 첨부하여 관세청장에게 제출해야 한다. <개정 2008. 2. 22., 2020. 10. 7., 2025. 12. 30.>\n    1. 거래관계에 관한 기본계약서(투자계약서ㆍ대리점계약서ㆍ기술용역계약서ㆍ기술도입계약서 등)\n    2. 수입물품과 관련된 사업계획서\n    3. 수입물품공급계약서\n    4. 수입물품가격결정의 근거자료\n    4의2. 법 제37조제1항제3호의 사항에 해당하는 경우에는 재정경제부령으로 정하는 서류\n    5. 그 밖에 과세가격결정에 필요한 참고자료\n  ②관세청장은 제1항에 따라 제출된 신청서 및 서류가 과세가격의 심사에 충분하지 않다고 인정되는 때에는 다음 각 호의 구분에 따른 기간을 정하여 보정을 요구할 수 있다. <개정 2008. 2. 22., 2020. 10. 7.>\n    1. 법 제37조제1항제1호 및 제2호에 해당하는 경우: 20일 이내\n    2. 법 제37조제1항제3호에 해당하는 경우: 30일 이내\n  ③ 법 제37조제2항에서 “대통령령으로 정하는 기간”이란 다음 각 호의 구분에 따른 기간을 말한다. 이 경우 관세청장이 제2항에 따라 제출된 신청서 및 서류의 보완을 요구한 경우에는 그 기간은 산입하지 아니한다. <개정 2008. 2. 22., 2011. 4. 1.>\n    1. 법 제37조제1항제1호 및 제2호에 해당하는 경우 : 1개월\n    2. 법 제37조제1항제3호에 해당하는 경우 : 1년\n  ④ 법 제37조제3항 전단에 따라 사전심사의 결과에 대하여 재심사를 신청하려는 자는 재심사 신청의 요지와 내용이 기재된 신청서에 다음 각 호의 서류 및 자료를 첨부하여 관세청장에게 제출하여야 한다. <신설 2015. 2. 6.>\n    1. 법 제37조제2항에 따른 과세가격 결정방법 사전심사서 사본\n    2. 재심사 신청의 요지와 내용을 입증할 수 있는 자료\n  ⑤ 제1항 각 호 및 제4항 각 호의 서류 및 자료는 한글로 작성하여 제출해야 한다. 다만, 관세청장이 허용하는 경우에는 영문 등으로 작성된 서류 및 자료를 제출할 수 있다. <신설 2020. 10. 7.>\n  ⑥ 관세청장은 법 제37조제1항에 따른 사전심사 또는 법 제37조제3항 전단에 따른 재심사의 신청이 다음 각 호의 어느 하나에 해당하는 경우에는 해당 신청을 반려할 수 있다. <신설 2020. 10. 7., 2024. 2. 29., 2025. 2. 28.>\n    1. 해당 신청인에 대해 관세조사(과세가격에 대한 관세조사에 한정한다)가 진행 중인 경우\n    2. 해당 신청인에 대한 관세조사를 통해 과세가격결정방법이 확인된 후에 계약관계나 거래실질에 변동이 없는 경우\n    3. 해당 신청인이 법 제119조에 따른 이의신청ㆍ심사청구 및 심판청구나 행정소송을 진행 중인 경우\n    4. 제2항에 따른 기간 내에 보정자료를 제출하지 않은 경우\n    5. 해당 거래관계 또는 거래내용 등 과세가격 결정에 중요한 사항이 신청 내용과 달라 관세청장이 사전심사 또는 재심사가 곤란하다고 판단하는 경우\n  ⑦ 법 제37조제4항에서 “대통령령으로 정하는 요건”이란 다음 각 호의 요건을 말한다. <개정 2008. 2. 22., 2011. 4. 1., 2015. 2. 6., 2019. 2. 12., 2020. 10. 7., 2025. 2. 28.>\n    1. 법 제37조제1항에 따른 신청인과 납세의무자가 동일할 것\n    2. 제1항에 따라 제출된 내용에 거짓이 없고 그 내용이 가격신고된 내용과 같을 것\n    3. 사전심사의 기초가 되는 법령이나 거래관계 등이 달라지지 아니하였을 것\n    4. 다음 각 목의 구분에 따른 기간 이내에 신고할 것\n      가. 법 제37조제1항제1호 또는 제2호에 따라 과세가격 결정방법의 사전심사를 신청한 경우: 법 제37조제2항에 따른 결과의 통보일부터 3년\n      나. 법 제37조제1항제3호에 따라 과세가격 결정방법의 사전심사를 신청한 경우: 다음 1)부터 2)까지의 기간\n  1) 법 제37조제2항에 따른 결과의 통보일\n  2) 법 제37조제2항에 따른 결과의 통보일부터 3년이 되는 날이 속하는 사업연도의 말일. 다만, 법 제37조제2항에 따른 통보일 기준으로 2년 이후부터 3년이 되는 날이 속하는 사업연도의 말일이 도래하기 30일 전까지 신고기간을 2년 연장하여 줄 것을 신청한 경우로서 관세청장이 이를 허용하는 경우에는 5년이 되는 날이 속하는 사업연도의 말일로 한다.\n  ⑧ 법 제37조제5항에 따라 보고서를 제출해야 하는 자는 매년 사업연도 말일 이후 6개월 이내에 다음 각 호의 사항이 포함된 보고서를 관세청장에게 제출해야 한다. <신설 2019. 2. 12., 2020. 10. 7.>\n    1. 사전심사 결과 결정된 과세가격 결정방법의 전제가 되는 조건 또는 가정의 실현 여부\n    2. 사전심사 결과 결정된 과세가격 결정방법으로 산출된 과세가격 및 그 산출과정\n    3. 제2호에 따라 산출된 과세가격과 실제의 거래가격이 다른 경우에는 그 차이에 대한 처리내역\n    4. 그 밖에 관세청장이 법 제37조제2항에 따라 결과를 통보할 때 보고서에 포함하도록 통보한 사항\n  ⑨ 신청인은 관세청장이 법 제37조제2항 또는 제3항에 따라 과세가격의 결정방법을 통보하기 전까지는 신청내용을 변경하여 다시 신청하거나 신청을 철회할 수 있으며, 관세청장은 신청인이 신청을 철회한 때에는 제1항ㆍ제2항ㆍ제4항 및 제5항에 따라 제출된 모든 자료를 신청인에게 반환해야 한다. <신설 2020. 10. 7.>\n  ⑩ 법 제37조제6항 전단에서 “제5항에 따른 보고서를 제출하지 아니하는 등 대통령령으로 정하는 사유”란 다음 각 호의 구분에 따른 사유를 말한다. <신설 2019. 2. 12., 2020. 10. 7.>\n    1. 사전심사 결과를 변경할 수 있는 사유: 다음 각 목의 어느 하나에 해당하는 경우\n      가. 사전심사 결과 결정된 과세가격 결정방법의 전제가 되는 조건 또는 가정의 중요한 부분이 변경되거나 실현되지 않은 경우\n      나. 관련 법령 또는 국제협약이 변경되어 사전심사 결과 결정된 과세가격 결정방법이 적정하지 않게 된 경우\n      다. 사전심사 결과 결정된 과세가격 결정방법을 통보받은 자가 국내외 시장상황 변동 등으로 인하여 과세가격 결정방법의 변경을 요청하는 경우\n      라. 그 밖에 사전심사 결과 결정된 과세가격 결정방법의 변경이 필요하다고 관세청장이 정하여 고시하는 사유에 해당하는 경우\n    2. 사전심사 결과를 철회할 수 있는 사유: 다음 각 목의 어느 하나에 해당하는 경우\n      가. 신청인이 제8항에 따른 보고서의 전부 또는 중요한 부분을 제출하지 않아 보완을 요구했으나 보완을 하지 않은 경우\n      나. 신청인이 제8항에 따른 보고서의 중요한 부분을 고의로 누락했거나 허위로 작성한 경우\n    3. 사전심사 결과를 취소할 수 있는 사유: 다음 각 목의 어느 하나에 해당하는 경우\n      가. 신청인이 제1항에 따른 자료의 중요한 부분을 고의로 누락했거나 허위로 작성한 경우\n      나. 신청인이 사전심사 결과 결정된 과세가격 결정방법의 내용 또는 조건을 준수하지 않고 과세가격을 신고한 경우\n  ⑪ 관세청장 또는 세관장은 제1항ㆍ제2항ㆍ제4항 및 제5항 및 제8항에 따라 제출된 서류 및 자료 등을 법 제37조에 따른 과세가격 결정방법의 사전심사 외의 용도로는 사용할 수 없다. <신설 2020. 2. 11., 2020. 10. 7.>\n  제31조의2 삭제 <2018. 2. 13.>","L106-0":"제106조(계약 내용과 다른 물품 등에 대한 관세 환급) ① 수입신고가 수리된 물품이 계약 내용과 다르고 수입신고 당시의 성질이나 형태가 변경되지 아니한 경우로서 다음 각 호의 어느 하나에 해당하는 경우에는 그 관세를 환급한다.\n  <개정 2022. 12. 31., 2024. 12. 31.>\n    1. 외국으로부터 수입된 물품: 다음 각 목의 어느 하나에 해당하는 장소에 해당 물품을 반입(수입신고 수리일부터 1년 이내에 반입한 경우로 한정한다)하였다가 다시 수출한 경우\n      가. 보세구역(제156조제1항에 따라 세관장의 허가를 받았을 때에는 그 허가받은 장소를 포함한다. 이하 이 조에서 같다)\n      나. 「자유무역지역의 지정 및 운영에 관한 법률」에 따른 자유무역지역 중 관세청장이 수출물품을 일정기간 보관하기 위하여 필요하다고 인정하여 고시하는 장소\n      다. 통관우체국\n    2. 보세공장에서 생산된 물품: 수입신고 수리일부터 1년 이내에 보세공장에 해당 물품을 다시 반입한 경우\n  ② 제1항에 따른 수입물품으로서 세관장이 환급세액을 산출하는 데에 지장이 없다고 인정하여 승인한 경우에는 그 수입물품의 일부를 수출하였을 때에도 제1항에 따라 그 관세를 환급할 수 있다.\n  ③ 제1항과 제2항에 따른 수입물품의 수출을 갈음하여 이를 폐기하는 것이 부득이하다고 인정하여 그 물품을 수입신고 수리일부터 1년 내에 보세구역에 반입하여 미리 세관장의 승인을 받아 폐기하였을 때에는 그 관세를 환급한다.\n  ④ 수입신고가 수리된 물품이 수입신고 수리 후에도 지정보세구역에 계속 장치되어 있는 중에 재해로 멸실되거나 변질 또는 손상되어 그 가치가 떨어졌을 때에는 대통령령으로 정하는 바에 따라 그 관세의 전부 또는 일부를 환급할 수 있다.\n  ⑤ 제1항부터 제4항까지의 규정을 적용할 때 해당 수입물품에 대한 관세의 납부기한이 종료되기 전이거나 징수유예 중 또는 분할납부기간이 끝나지 아니하여 해당 물품에 대한 관세가 징수되지 아니한 경우에는 세관장은 해당 관세의 부과를 취소할 수 있다.<개정 2013. 1. 1.>\n  ⑥ 제1항부터 제4항까지에서 규정한 관세의 환급에 관하여는 제46조와 제47조를 준용한다.\n  [전문개정 2010. 12. 30.]","D226-0":"제226조(보세운송의 신고 등) ①법 제213조에 따른 보세운송신고를 하거나 승인을 받으려는 자는 다음 각 호의 사항(제7호, 제9호 및 제10호는 승인을 받으려는 경우만 해당한다)을 기재한 신고서 또는 신청서를 세관장에게 제출해야 한다. 다만, 국제무역선 또는 국제무역기의 효율적인 하역을 위하여 필요하거나 세관의 감시ㆍ단속에 지장이 없다고 인정하여 관세청장이 따로 정하는 경우에는 그 정하는 바에 따른다. <개정 2002. 12. 30., 2021. 2. 17., 2026. 2. 27.>\n    1. 운송수단의 종류 및 번호\n    2. 운송통로와 목적지\n    3. 화물상환증, 선하증권번호 또는 항공화물운송장번호, 적재화물목록번호, 컨테이너번호 및 봉인번호\n    4. 포장의 종류ㆍ번호 및 개수\n    5. 품명ㆍ규격ㆍ중량 및 가격\n    6. 운송기간\n    7. 화주의 명칭(성명)ㆍ주소ㆍ사업자등록번호 및 대표자성명\n    8. 신고인 또는 신청인의 유형ㆍ상호ㆍ주소ㆍ성명(법인인 경우에는 대표자의 성명을 말한다)\n    9. 담보의 종류 및 담보 금액\n    10. 보세운송 사유\n    11. 제189조제3호에 따른 위험물품에 해당하는지 여부\n  ②세관장은 운송거리 기타의 사정을 참작하여 필요가 없다고 인정되는 때에는 제1항 각호의 사항중 일부의 기재를 생략하게 할 수 있다.\n  ③법 제213조제2항 단서에 따라 보세운송의 승인을 받아야 하는 경우는 다음 각 호의 어느 하나에 해당하는 물품을 운송하려는 경우를 말한다. <개정 2006. 5. 22., 2014. 12. 9., 2021. 2. 17., 2025. 8. 5.>\n    1. 보세운송된 물품중 다른 보세구역 등으로 재보세운송하고자 하는 물품\n    2. 「검역법」ㆍ「식물방역법」ㆍ「가축전염병예방법」 등에 따라 검역을 요하는 물품\n    3. 「위험물안전관리법」에 따른 위험물\n    3의2. 「화학물질관리법」에 따른 허가물질, 제한물질, 금지물질 및 유해화학물질\n    4. 비금속설\n    5. 화물이 국내에 도착된 후 최초로 보세구역에 반입된 날부터 30일이 경과한 물품\n    6. 통관이 보류되거나 수입신고수리가 불가능한 물품\n    7. 법 제156조의 규정에 의한 보세구역외 장치허가를 받은 장소로 운송하는 물품\n    8. 귀석ㆍ반귀석ㆍ귀금속ㆍ한약재ㆍ의약품ㆍ향료 등과 같이 부피가 작고 고가인 물품\n    9. 화주 또는 화물에 대한 권리를 가진 자가 직접 보세운송하는 물품\n    10. 법 제236조의 규정에 의하여 통관지가 제한되는 물품\n    11. 적재화물목록상 동일한 화주의 선하증권 단위의 물품을 분할하여 보세운송하는 경우 그 물품\n    12. 불법 수출입의 방지 등을 위하여 세관장이 지정한 물품\n    13. 법 및 법에 의한 세관장의 명령을 위반하여 관세범으로 조사를 받고 있거나 기소되어 확정판결을 기다리고 있는 보세운송업자등이 운송하는 물품\n  ④제3항의 규정에 의한 물품중 관세청장이 보세운송승인대상으로 하지 아니하여도 화물관리 및 불법 수출입의 방지에 지장이 없다고 판단하여 정하는 물품에 대하여는 신고만으로 보세운송할 수 있다.","R44-0":"제44조(특정물품에 대한 관세의 면제신청) ①법 제93조제1호ㆍ제2호 및 제15호에 따라 관세를 면제받으려는 자는 신청서에 주무부처의 장 또는 그 위임을 받은 기관의 장의 확인을 받아야 한다. 다만, 다른 법령에 따라 반입승인ㆍ수입승인 등을 받은 물품의 경우 그 승인서에 의하여 해당 물품이 관세의 면제를 받은 용도에 사용될 것임을 확인할 수 있거나 관할지 세관장이 이를 확인한 경우에는 그러하지 아니하다. <개정 2011. 4. 1.>\n  ②법 제93조제3호에 따라 관세를 면제받으려는 자는 해당 기증사실을 증명하는 서류를 신청서에 첨부하여 제출하여야 하며, 해당 기증목적에 관하여 원자력안전위원회의 확인을 받아야 한다. <개정 2008. 12. 31., 2011. 4. 1., 2013. 3. 23.>\n  ③법 제93조제10호에 따라 관세를 면제받으려는 자는 영 제112조제1항 각 호의 사항 외에 운수기관명ㆍ조난장소 및 조난연월일을 신청서에 적고 주무부장관이 확인한 서류를 첨부하여 제출하여야 한다. <개정 2011. 4. 1.>\n  ④법 제93조제11호에 따라 관세를 면제받으려는 자는 영 제112조제1항 각 호의 사항 외에 사용계획ㆍ사용기간과 공사장의 명칭 및 소재지를 신청서에 적어 제출하여야 한다. <개정 2011. 4. 1.>\n  ⑤법 제93조제12호에 따라 관세를 면제받으려는 자는 해당 증표 공급국의 권한있는 기관과의 공급 및 관리에 관한 계약서 또는 이에 갈음할 서류를 신청서에 첨부하여 제출하여야 한다. 다만, 세관장이 필요 없다고 인정하는 경우에는 해당 계약서 등의 첨부를 생략할 수 있다. <개정 2011. 4. 1.>\n  ⑥법 제93조제13호 및 제14호에 따라 관세를 면제받으려는 자는 영 제112조제1항 각 호의 사항 외에 수리선박명 또는 수리항공기명을 신청서에 적고, 해당 수리가 외국의 보험회사ㆍ가해자 또는 매도인의 부담으로 행하는 것임을 증명하는 서류와 수리인이 발급한 수리사실을 증명하는 서류를 첨부하여 제출하여야 한다. <개정 2011. 4. 1.>\n  ⑦ 법 제93조제19호에 따라 관세를 면제받으려는 자는 수입하려는 자원의 해외자원개발사업자 및 해외자원개발방법 등 관세 면제에 필요한 사항에 대해 산업통상부장관이 확인한 서류를 신청서에 첨부해야 한다. 이 경우 확인의 방법ㆍ절차ㆍ비용 등 필요한 사항은 산업통상부장관이 정하여 고시한다. <신설 2026. 3. 20.>\n  ⑧제1항부터 제7항까지의 규정에 따른 확인 및 증명은 세관장이 당해 물품의 수량 또는 가격을 참작하여 필요없다고 인정하는 때에는 이를 생략할 수 있다. <개정 2026. 3. 20.>","D141-0":"제141조(관세조사에 있어서의 결과통지) 법 제115조 단서에서 “대통령령으로 정하는 경우”란 다음 각 호의 어느 하나에 해당하는 경우를 말한다. <개정 2011. 4. 1.>\n    1. 납세자에게 통고처분을 하는 경우\n    2. 범칙사건을 고발하는 경우\n    3. 폐업한 경우\n    4. 납세자의 주소 및 거소가 불명하거나 그 밖의 사유로 통지를 하기 곤란하다고 인정되는 경우","R76-0":"제76조(직접운송원칙) 법 제229조에 따라 원산지를 결정할 때 해당 물품이 원산지가 아닌 국가를 경유하지 아니하고 직접 우리나라에 운송ㆍ반입된 물품인 경우에만 그 원산지로 인정한다. 다만, 다음 각 호의 어느 하나에 해당하는 물품인 경우에는 우리나라에 직접 반입한 것으로 본다.\n    1. 다음 각 목의 요건을 모두 충족하는 물품일 것\n      가. 지리적 또는 운송상의 이유로 단순 경유한 것\n      나. 원산지가 아닌 국가에서 관세당국의 통제하에 보세구역에 장치된 것\n      다. 원산지가 아닌 국가에서 하역, 재선적 또는 그 밖에 정상 상태를 유지하기 위하여 요구되는 작업 외의 추가적인 작업을 하지 아니한 것\n    2. 박람회ㆍ전시회 및 그 밖에 이에 준하는 행사에 전시하기 위하여 원산지가 아닌 국가로 수출되어 해당 국가 관세당국의 통제하에 전시목적에 사용된 후 우리나라로 수출된 물품일 것\n  [전문개정 2012. 2. 28.]","D16-0":"제16조(잠정가격의 신고 등) ①법 제28조제1항 전단에서 “대통령령으로 정하는 경우”란 다음 각 호의 어느 하나에 해당하는 경우를 말한다. <개정 2008. 2. 22., 2008. 2. 29., 2011. 4. 1., 2017. 3. 27., 2020. 10. 7., 2021. 2. 17., 2025. 12. 30.>\n    1. 거래관행상 거래가 성립된 때부터 일정기간이 지난 후에 가격이 정하여지는 물품(재정경제부령으로 정하는 것으로 한정한다)으로서 수입신고일 현재 그 가격이 정하여지지 아니한 경우\n    2. 법 제30조제1항 각 호에 따라 조정하여야 할 금액이 수입신고일부터 일정기간이 지난 후에 정하여 질 수 있음이 제2항에 따른 서류 등으로 확인되는 경우\n    2의2. 법 제37조제1항제3호에 따라 과세가격 결정방법의 사전심사를 신청한 경우\n    2의3. 제23조제1항 각 호의 어느 하나에 해당하는 특수관계가 있는 구매자와 판매자 사이의 거래 중 법 제30조제1항 본문에 따른 수입물품의 거래가격이 수입신고 수리 이후에 「국제조세조정에 관한 법률」 제8조에 따른 정상가격으로 조정될 것으로 예상되는 거래로서 재정경제부령으로 정하는 요건을 갖춘 경우\n    3. 계약의 내용이나 거래의 특성상 잠정가격으로 가격신고를 하는 것이 불가피한 경우로서 재정경제부령으로 정하는 경우\n  ②제1항에 따라 잠정가격으로 가격신고를 하려는 자는 다음 각 호의 사항을 적은 신고서에 제15조제5항 각 호의 서류를 첨부하여 세관장에게 제출하여야 한다. <개정 2008. 2. 22.>\n    1. 제15조제1항 각호의 사항\n    2. 거래내용\n    3. 가격을 확정할 수 없는 사유\n    4. 잠정가격 및 잠정가격의 결정방법\n    5. 가격확정예정시기\n  ③잠정가격으로 가격신고를 한 자는 2년의 범위안에서 구매자와 판매자 간의 거래계약의 내용 등을 고려하여 세관장이 지정하는 기간내에 확정된 가격(이하 이 조에서 “확정가격”이라 한다)을 신고하여야 한다. 이 경우 잠정가격으로 가격신고를 한 자는 관세청장이 정하는 바에 따라 전단에 따른 신고기간이 끝나기 30일 전까지 확정가격의 계산을 위한 가산율을 산정해 줄 것을 요청할 수 있다. <개정 2007. 4. 5., 2020. 10. 7.>\n  ④세관장은 구매자와 판매자간의 거래계약내용이 변경되는 등 잠정가격을 확정할 수 없는 불가피한 사유가 있다고 인정되는 경우로서 납세의무자의 요청이 있는 경우에는 재정경제부령으로 정하는 바에 따라 제3항 전단에 따른 신고기간을 연장할 수 있다. 이 경우 연장하는 기간은 제3항 전단에 따른 신고기간의 만료일부터 2년을 초과할 수 없다. <개정 2007. 4. 5., 2020. 10. 7., 2025. 12. 30.>\n  ⑤법 제28조제2항에 따라 확정가격을 신고하려는 자는 다음 각 호의 사항이 적힌 신고서에 제15조제5항제3호부터 제5호까지의 자료를 첨부하여 세관장에게 제출하여야 한다. <개정 2008. 2. 22., 2025. 2. 28.>\n    1. 잠정가격신고번호 또는 수입신고번호와 신고일자\n    2. 품명 및 수입신고수리일자\n    3. 잠정가격 및 확정가격과 그 차액\n  ⑥법 제28조제4항에 따라 잠정가격을 기초로 신고납부한 세액과 확정가격에 의한 세액과의 차액을 징수하거나 환급하는 때에는 제33조, 제34조제3항부터 제5항까지 및 제50조 내지 제55조의 규정을 준용한다. <개정 2006. 5. 22., 2012. 2. 2.>","L156-0":"제156조(보세구역 외 장치의 허가) ① 제155조제1항제2호에 해당하는 물품을 보세구역이 아닌 장소에 장치하려는 자는 세관장의 허가를 받아야 한다.\n  ② 세관장은 외국물품에 대하여 제1항의 허가를 하려는 때에는 그 물품의 관세에 상당하는 담보의 제공, 필요한 시설의 설치 등을 명할 수 있다.\n  ③ 제1항에 따른 허가를 받으려는 자는 재정경제부령으로 정하는 금액과 방법 등에 따라 수수료를 납부하여야 한다.<개정 2025. 10. 1.>\n  [전문개정 2010. 12. 30.]","D7-0":"제7조(관세징수권 소멸시효의 기산일) ①법 제22조제1항에 따른 관세징수권을 행사할 수 있는 날은 다음 각 호의 날로 한다. <개정 2002. 12. 30., 2004. 3. 29., 2012. 2. 2., 2013. 2. 15., 2021. 2. 17.>\n    1. 법 제38조에 따라 신고납부하는 관세에 있어서는 수입신고가 수리된 날부터 15일이 경과한 날의 다음날. 다만, 제1조의5에 따른 월별납부의 경우에는 그 납부기한이 경과한 날의 다음 날로 한다.\n    1의2. 법 제38조의2제4항의 규정에 의하여 납부하는 관세에 있어서는 부족세액에 대한 보정신청일의 다음날의 다음날\n    2. 법 제38조의3제1항의 규정에 의하여 납부하는 관세에 있어서는 수정신고일의 다음날의 다음날\n    3. 법 제39조에 따라 부과고지하는 관세의 경우 납부고지를 받은 날부터 15일이 경과한 날의 다음 날\n    4. 법 제253조제3항의 규정에 의하여 납부하는 관세에 있어서는 수입신고한 날부터 15일이 경과한 날의 다음날\n    5. 그 밖의 법령에 따라 납부고지하여 부과하는 관세의 경우 납부기한을 정한 때에는 그 납부기한이 만료된 날의 다음 날\n  ②법 제22조제2항에 따른 관세환급청구권을 행사할 수 있는 날은 다음 각 호의 날로 한다. <개정 2004. 3. 29., 2010. 3. 26., 2012. 2. 2., 2017. 3. 27., 2018. 2. 13., 2022. 2. 15.>\n    1. 법 제38조의3제6항에 따른 경정으로 인한 환급의 경우에는 경정결정일\n    2. 착오납부 또는 이중납부로 인한 환급의 경우에는 그 납부일\n    3. 법 제106조제1항에 따른 계약과 상이한 물품 등에 대한 환급의 경우에는 당해 물품의 수출신고수리일 또는 보세공장반입신고일\n    3의2. 법 제106조제3항 및 제4항에 따른 폐기, 멸실, 변질, 또는 손상된 물품에 대한 환급의 경우에는 해당 물품이 폐기, 멸실, 변질 또는 손상된 날\n    3의3. 법 제106조의2제1항에 따른 수입한 상태 그대로 수출되는 자가사용물품에 대한 환급의 경우에는 수출신고가 수리된 날. 다만, 수출신고가 생략되는 물품의 경우에는 운송수단에 적재된 날로 한다.\n    3의4. 법 제106조의2제2항에 따라 국제무역선, 국제무역기 또는 보세판매장에서 구입한 후 환불한 물품에 대한 환급의 경우에는 해당 물품이 환불된 날\n    3의5. 종합보세구역에서 물품을 판매하는 자가 법 제199조의2 및 이 영 제216조의5제2항의 규정에 의하여 환급받고자 하는 경우에는 동규정에 의한 환급에 필요한 서류의 제출일\n    4. 수입신고 또는 입항전수입신고를 하고 관세를 납부한 후 법 제250조의 규정에 의하여 신고가 취하 또는 각하된 경우에는 신고의 취하일 또는 각하일\n    5. 적법하게 납부한 후 법률의 개정으로 인하여 환급하는 경우에는 그 법률의 시행일\n  제8조 삭제 <2009. 2. 4.>","D5-0":"제5조(납세의무자) 법 제19조제1항제1호 나목에서 “대통령령으로 정하는 상업서류”란 다음 각 호의 어느 하나에 해당하는 것을 말한다. <개정 2011. 4. 1.>\n    1. 송품장\n    2. 선하증권 또는 항공화물운송장","R68-2":"제68조의2(보세판매장 특허수수료) ①법 제176조의2제4항 본문에 따라 보세판매장의 설치ㆍ운영에 관한 수수료(이하 이 조에서 “보세판매장 특허수수료”라 한다)는 제68조제2항에도 불구하고 영 제192조의7에 따른 보세판매장의 매장별 매출액을 기준으로 다음 표의 특허수수료율을 적용하여 계산한 금액으로 한다. <개정 2014. 3. 14., 2017. 2. 15., 2019. 3. 20., 2021. 3. 16., 2025. 3. 21.>\n  <img alt=\"해당 연도 매출액 특허수수료율&#10;2천억원 이하 해당 연도 매출액의 1만분의 5&#10;2천억원 초과 1조원 이하 @@LATEX@@1억원 + left(2천억원을초과하는금액의1만분의25right)@@/LATEX@@&#10;1조원 초과 @@LATEX@@21억원 + left(1조원을초과하는금액의1천분의5right)@@/LATEX@@\" src=\"/LSW/flDownload.do?flSeq=150097439\" />\n  ② 제1항에도 불구하고 다음 각 호의 어느 하나에 해당하는 경우에는 보세판매장 특허수수료는 해당 연도 매출액의 1만분의 1에 해당하는 금액으로 한다. 다만, 제3호의 경우에는 해당 제품에 대한 해당 연도 매출액의 1만분의 1에 해당하는 금액으로 하고, 해당 제품에 대한 매출액을 제외한 매출액에 대한 보세판매장 특허수수료는 제1항에 따른다. <신설 2019. 3. 20.>\n    1. 「중소기업기본법」 제2조에 따른 중소기업으로서 영 제192조의2제1항 각 호의 요건을 모두 충족하는 기업이 운영인인 경우\n    2. 「중견기업 성장촉진 및 경쟁력 강화에 관한 특별법」 제2조제1호에 따른 중견기업으로서 영 제192조의2제1항 각 호의 요건을 모두 충족하는 기업이 운영인인 경우\n    3. 제1호 및 제2호에 해당하지 않는 자가 「중소기업기본법」 제2조에 따른 중소기업 또는 「중견기업 성장촉진 및 경쟁력 강화에 관한 특별법」 제2조제1호에 따른 중견기업의 제품을 판매하는 경우\n  ③ 법 제176조의2제4항 단서에 따라 2020년 1월 1일부터 2023년 12월 31일까지 발생한 매출액에 대한 보세판매장 특허수수료는 제1항 및 제2항에 따른 보세판매장 특허수수료의 100분의 50을 감경한다. <신설 2021. 3. 16., 2023. 3. 20., 2024. 3. 22.>\n  ④ 보세판매장 특허수수료는 연단위로 해당 연도분을 다음 연도 4월 30일까지 납부해야 한다. 다만, 해당 연도 중간에 특허의 기간 만료, 취소 및 반납 등으로 인하여 특허의 효력이 상실된 경우에는 그 효력이 상실된 날부터 3개월 이내에 납부해야 한다. <개정 2019. 3. 20., 2021. 3. 16., 2023. 3. 20.>\n  [본조신설 2013. 11. 5.]","D82-0":"제82조(상계관세의 소급부과) ①법 제61조 단서의 규정에 의하여 잠정조치가 적용된 물품으로서 상계관세가 부과되는 물품은 다음과 같다. <개정 2008. 2. 29., 2025. 12. 30.>\n    1. 실질적 피해등이 있다고 최종판정이 내려진 경우 또는 실질적 피해등의 우려가 있다는 최종판정이 내려졌으나 잠정조치가 없었다면 실질적 피해등이 있다는 최종판정이 내려졌을 것으로 인정되는 경우에는 잠정조치가 적용된 기간동안 수입된 물품\n    2. 비교적 단기간내에 대량 수입되어 발생되는 실질적 피해등의 재발을 방지하기 위하여 상계관세를 소급하여 부과할 필요가 있는 경우로서 당해 물품이 과거에 보조금등을 받아 수입되어 실질적 피해등을 입힌 사실이 있었던 경우 또는 수입자가 보조금등을 받은 물품의 수입사실과 그로 인한 실질적 피해등의 사실을 알았거나 알 수 있었을 경우에는 잠정조치를 적용한 날부터 90일전 이후에 수입된 물품\n    3. 법 제60조제1항의 규정에 의한 약속을 위반하여 잠정조치가 적용된 물품의 수입으로 인한 실질적 피해등의 사실이 인정되는 때에는 잠정조치를 적용한 날부터 90일전 이후에 수입된 물품. 이 경우 약속위반일 이전에 수입된 물품을 제외한다.\n    4. 기타 국제협약에서 정하는 바에 따라 재정경제부장관이 정하는 기간에 수입된 물품\n  ②제73조의 규정에 의한 국내산업에 이해관계가 있는 자는 제75조제5항의 규정에 의한 본조사의 결과에 따라 최종판정의 통지를 받은 날부터 7일 이내에 당해 물품이 제1항 각호의 1에 해당된다는 증거를 제출하여 법 제61조 단서의 규정에 의한 상계관세의 부과를 요청할 수 있다.","L28-0":"제28조(잠정가격의 신고 등) ① 납세의무자는 가격신고를 할 때 신고하여야 할 가격이 확정되지 아니한 경우로서 대통령령으로 정하는 경우에는 잠정가격으로 가격신고를 할 수 있다. 이 경우 신고의 방법과 그 밖에 필요한 사항은 대통령령으로 정한다.\n  ② 납세의무자는 제1항에 따른 잠정가격으로 가격신고를 하였을 때에는 대통령령으로 정하는 기간 내에 해당 물품의 확정된 가격을 세관장에게 신고하여야 한다.\n  ③ 세관장은 납세의무자가 제2항에 따른 기간 내에 확정된 가격을 신고하지 아니하는 경우에는 해당 물품에 적용될 가격을 확정할 수 있다. 다만, 납세의무자가 폐업, 파산신고, 법인해산 등의 사유로 확정된 가격을 신고하지 못할 것으로 인정되는 경우에는 제2항에 따른 기간 중에도 해당 물품에 적용될 가격을 확정할 수 있다.<개정 2015. 12. 15.>\n  ④ 세관장은 제2항에 따라 확정된 가격을 신고받거나 제3항에 따라 가격을 확정하였을 때에는 대통령령으로 정하는 바에 따라 잠정가격을 기초로 신고납부한 세액과 확정된 가격에 따른 세액의 차액을 징수하거나 환급하여야 한다.\n  [전문개정 2010. 12. 30.]","R79-0":"제79조(적재기간 등 연장승인) 법 제251조제1항 단서의 규정에 의하여 적재기간의 연장승인을 얻고자 하는 자는 다음 각호의 사항을 기재한 신청서를 세관장에게 제출하여야 한다.\n    1. 수출신고번호ㆍ품명ㆍ규격 및 수량\n    2. 수출자ㆍ신고자 및 제조자\n    3. 연장승인신청의 사유\n    4. 기타 참고사항","L240-6":"제240조의6(국가 간 세관정보의 상호 교환 등) ① 관세청장은 물품의 신속한 통관과 이 법을 위반한 물품의 반입을 방지하기 위하여 세계관세기구에서 정하는 수출입 신고항목 및 화물식별번호를 발급하거나 사용하게 할 수 있다.\n  ② 관세청장은 세계관세기구에서 정하는 수출입 신고항목 및 화물식별번호 정보를 다른 국가와 상호 조건에 따라 교환할 수 있다.\n  ③ 관세청장은 관세의 부과와 징수, 과세 불복에 대한 심리, 형사소추 및 수출입신고의 검증을 위하여 수출입신고자료 등 대통령령으로 정하는 사항을 대한민국 정부가 다른 국가와 관세행정에 관한 협력 및 상호지원에 관하여 체결한 협정과 국제기구와 체결한 국제협약에 따라 다른 법률에 저촉되지 아니하는 범위에서 다른 국가와 교환할 수 있다.<개정 2019. 12. 31.>\n  ④ 제3항에도 불구하고 관세청장은 상호주의 원칙에 따라 상대국에 수출입신고자료 등을 제공하는 것을 제한할 수 있다.\n  ⑤ 관세청장은 제3항에 따라 다른 국가와 수출입신고자료 등을 교환하는 경우 대통령령으로 정하는 바에 따라 이를 신고인 또는 그 대리인에게 통지하여야 한다.\n  [본조신설 2014. 12. 23.]","L113-0":"제113조(납세자의 성실성 추정 등) ① 세관공무원은 납세자가 이 법에 따른 신고 등의 의무를 이행하지 아니한 경우 또는 납세자에게 구체적인 관세포탈 등의 혐의가 있는 경우 등 대통령령으로 정하는 경우를 제외하고는 납세자가 성실하며 납세자가 제출한 신고서 등이 진실한 것으로 추정하여야 한다.\n  ② 제1항은 세관공무원이 납세자가 제출한 신고서 등의 내용에 관하여 질문을 하거나 신고한 물품에 대하여 확인을 하는 행위 등 대통령령으로 정하는 행위를 하는 것을 제한하지 아니한다.\n  [전문개정 2010. 12. 30.]","D158-0":"제158조(출항허가의 신청) ①법 제136조제1항의 규정에 의하여 선박이 출항하고자 하는 때에는 다음 각호의 사항을 기재한 신청서를 세관장에게 제출하여야 한다.\n    1. 선박의 종류ㆍ등록기호ㆍ명칭ㆍ국적ㆍ총톤수 및 순톤수\n    2. 여객ㆍ승무원ㆍ통과여객의 수\n    3. 적재물품의 개수 및 톤수\n    4. 선적지ㆍ목적지 및 출항일시\n  ②법 제136조제1항의 규정에 의하여 항공기가 출항하고자 하는 경우에는 다음 각호의 사항을 기재한 신청서를 세관장에게 제출하여야 한다.\n    1. 항공기의 종류ㆍ등록기호ㆍ명칭 및 국적\n    2. 여객ㆍ승무원ㆍ통과여객의 수\n    3. 적재물품의 개수 및 톤수\n    4. 선적지ㆍ목적지 및 출항일시\n  ③법 제136조제2항의 규정에 의한 물품의 목록에 관하여는 관세청장이 정하는 바에 의한다.","L326-2":"제326조의2(사업에 관한 허가 등의 제한) ① 세관장은 납세자가 허가ㆍ인가ㆍ면허 및 등록 등(이하 이 조에서 “허가등”이라 한다)을 받은 사업과 관련된 관세 또는 내국세등을 체납한 경우 해당 사업의 주무관청에 그 납세자에 대하여 허가등의 갱신과 그 허가등의 근거 법률에 따른 신규 허가등을 하지 아니할 것을 요구할 수 있다. 다만, 재난, 질병 또는 사업의 현저한 손실, 그 밖에 대통령령으로 정하는 사유가 있는 경우에는 그러하지 아니하다.\n  ② 세관장은 허가등을 받아 사업을 경영하는 자가 해당 사업과 관련된 관세, 내국세등을 3회 이상 체납하고 그 체납된 금액의 합계액이 500만원 이상인 경우 해당 주무관청에 사업의 정지 또는 허가등의 취소를 요구할 수 있다. 다만, 재난, 질병 또는 사업의 현저한 손실, 그 밖에 대통령령으로 정하는 사유가 있는 경우에는 그러하지 아니하다.\n  ③ 제2항의 관세 또는 내국세등을 체납한 횟수와 체납된 금액의 합계액을 정하는 기준과 방법은 대통령령으로 정한다.\n  ④ 세관장은 제1항 또는 제2항의 요구를 한 후 해당 관세 또는 내국세등을 징수한 경우 즉시 그 요구를 철회하여야 한다.\n  ⑤ 해당 주무관청은 제1항 또는 제2항에 따른 세관장의 요구가 있는 경우 정당한 사유가 없으면 요구에 따라야 하며, 그 조치 결과를 즉시 관할 세관장에 알려야 한다.\n  [본조신설 2022. 12. 31.]","R49-2":"제49조의2(여행자 휴대품 등에 대한 자진신고 방법) 법 제96조제2항에서 “재정경제부령으로 정하는 방법”이란 여행자가 다음 각 호의 구분에 따른 여행자 휴대품 신고서를 작성하여 세관공무원에게 제출하는 것을 말한다. <개정 2026. 1. 2.>\n    1. 항공기를 통하여 입국하는 경우: 별지 제42호서식의 여행자 휴대품 신고서\n    2. 선박을 통하여 입국하는 경우: 별지 제43호서식의 여행자 휴대품 신고서\n  [본조신설 2015. 2. 6.]","D155-0":"제155조(국제항의 지정) ①법 제133조에 따른 국제항(이하 “국제항”이라 한다)은 다음 표와 같다. <개정 2012. 2. 2., 2012. 6. 5., 2015. 2. 6., 2018. 5. 8., 2021. 2. 17.>\n  <img alt=\"구분 국제항명&#10;항구 인천항, 부산항, 마산항, 여수항, 목포항, 군산항, 제주항, 동해ㆍ묵호항, 울산항, 통영항, 삼천포항, 장승포항, 포항항, 장항항, 옥포항, 광양항, 평택ㆍ당진항, 대산항, 삼척항, 진해항, 완도항, 속초항, 고현항, 경인항, 보령항 &#10;공항 인천공항, 김포공항, 김해공항, 제주공항, 청주공항, 대구공항, 무안공항, 양양공항&#10;\" src=\"/LSW/flDownload.do?flSeq=95995077\" />\n  ②국제항의 항계는 「항만법 시행령」 별표 1에 따른 항만의 수상구역 또는 「공항시설법」에 따른 범위로 한다. <개정 2006. 5. 22., 2015. 8. 3., 2016. 2. 5., 2017. 3. 29., 2021. 2. 17.>\n  [제목개정 2021. 2. 17.]","D68-0":"제68조(가격수정ㆍ수출중지 등의 약속) ①덤핑방지관세의 부과여부를 결정하기 위한 조사가 개시된 물품의 수출자가 법 제54조제1항에 따라 약속을 제의하거나 법 제54조제2항 단서에 따라 피해조사를 계속하여 줄 것을 요청하고자 하는 때에는 제61조제5항에 따른 본조사의 결과에 따라 최종판정을 하기 45일 전에 서면(전자문서를 포함한다)으로 그 뜻을 무역위원회에 제출해야 한다. 이 경우 무역위원회는 제출된 서류의 원본(전자문서로 제출된 경우에는 그 전자문서를 말한다)을 지체없이 재정경제부장관에게 송부해야 한다. <개정 2008. 2. 29., 2023. 2. 28., 2025. 6. 2., 2025. 12. 30.>\n  ②제1항의 규정에 의하여 제의한 약속의 내용이 즉시로 가격을 수정하거나 약속일부터 6월 이내에 덤핑수출을 중지하는 것인 때에는 재정경제부장관은 그 약속을 수락할 수 있다. 다만, 동 약속의 이행을 확보하는 것이 곤란하다고 인정되는 경우로서 재정경제부령이 정하는 경우에는 그러하지 아니하다. <개정 2008. 2. 29., 2025. 12. 30.>\n  ③재정경제부장관은 필요하다고 인정되는 때에는 법 제54조제1항의 규정에 의한 약속을 수출자를 지정하여 제의할 수 있다. <개정 2008. 2. 29., 2025. 12. 30.>\n  ④재정경제부장관은 제61조제2항의 규정에 의한 예비조사결과 덤핑사실 및 그로 인한 실질적 피해등의 사실이 있다고 추정되는 충분한 증거가 있다고 판정하기 전에는 제2항의 규정에 의한 약속의 수락이나 제3항의 규정에 의한 약속의 제의를 할 수 없다. <개정 2008. 2. 29., 2025. 12. 30.>\n  ⑤ 재정경제부장관은 수출자가 법 제54조제2항에 따라 수락된 약속을 이행하지 아니한 경우 덤핑방지를 위하여 다음 각 호의 구분에 따른 신속한 조치를 취할 수 있다. 이 경우 제2호에 따른 조치의 적용기간에 관하여는 제66조제2항 및 제3항을 준용한다. <개정 2017. 3. 27., 2025. 12. 30.>\n    1. 법 제54조제2항 단서에 따라 조사를 계속하여 덤핑방지관세율 등 부과내용을 정한 경우: 덤핑방지관세의 부과\n    2. 제1호 외의 경우: 법 제53조제1항제2호에 따른 잠정조치\n  ⑥재정경제부장관이 법 제54조제2항 단서의 규정에 의하여 조사를 계속한 결과 실질적 피해등의 사실이 없거나 덤핑차액이 없는 것으로 확인한 때에는 당해 약속의 효력은 소멸된 것으로 본다. 다만, 실질적 피해 등의 사실이 없거나 덤핑차액이 없는 원인이 약속으로 인한 것으로 판단되는 때에는 재정경제부장관은 적정한 기간을 정하여 약속을 계속 이행하게 할 수 있으며, 수출자가 그 약속의 이행을 거부하는 때에는 이용 가능한 최선의 정보에 의하여 잠정조치를 실시하는 등 덤핑방지를 위한 신속한 조치를 취할 수 있다. <개정 2008. 2. 29., 2025. 12. 30.>","R65-2":"제65조의2(보세사에 대한 행정처분 기준) ① 법 제165조제5항에 따른 보세사의 행정처분이나 조치의 세부기준은 별표 5의2와 같다.\n  ② 그 밖에 보세사의 행정처분이나 조치에 필요한 사항은 관세청장이 정하여 고시한다.\n  [본조신설 2025. 3. 21.]\n  제66조 삭제 <2004. 3. 30.>","R32-0":"제32조(긴급관세 관련 비밀취급자료) ①법 제65조제7항의 규정에 의하여 제출된 자료중 자료를 제출하는 자가 정당한 사유를 제시하여 비밀로 취급하여 줄 것을 요청한 자료에 대하여는 당해 자료를 제출한 자의 명시적인 동의없이는 이를 공개하여서는 아니된다.\n  ②제1항의 규정에 의하여 비밀로 취급하는 자료에 대하여는 제15조의 규정을 준용한다.","L22-0":"제22조(관세징수권 등의 소멸시효) ① 관세의 징수권은 이를 행사할 수 있는 날부터 다음 각 호의 구분에 따른 기간 동안 행사하지 아니하면 소멸시효가 완성된다. <개정 2014. 12. 23.>\n    1. 5억원 이상의 관세(내국세를 포함한다. 이하 이 항에서 같다): 10년\n    2. 제1호 외의 관세: 5년\n  ② 납세자가 납부한 금액 중 잘못 납부하거나 초과하여 납부한 금액 또는 그 밖의 관세의 환급청구권은 그 권리를 행사할 수 있는 날부터 5년간 행사하지 아니하면 소멸시효가 완성된다.<개정 2023. 12. 31.>\n  ③ 제1항에 따른 관세의 징수권과 제2항에 따른 잘못 납부하거나 초과하여 납부한 금액 또는 그 밖의 관세의 환급청구권을 행사할 수 있는 날은 대통령령으로 정한다.<개정 2023. 12. 31.>\n  [전문개정 2010. 12. 30.]","L233-0":"제233조(원산지증명서 등의 확인요청 및 조사) ① 세관장은 원산지증명서를 발급한 국가의 세관이나 그 밖에 발급권한이 있는 기관(이하 이 조에서 “외국세관등” 이라 한다)에 제232조제1항 및 제3항에 따라 제출된 원산지증명서 및 원산지증명서확인자료의 진위 여부, 정확성 등의 확인을 요청할 수 있다. 이 경우 세관장의 확인요청은 해당 물품의 수입신고가 수리된 이후에 하여야 하며, 세관장은 확인을 요청한 사실 및 회신 내용과 그에 따른 결정 내용을 수입자에게 통보하여야 한다. <개정 2013. 1. 1., 2014. 1. 1.>\n  ② 제1항에 따라 세관장이 확인을 요청한 사항에 대하여 조약 또는 협정에서 다르게 규정한 경우를 제외하고 다음 각 호의 어느 하나에 해당하는 경우에는 일반특혜관세ㆍ국제협력관세 또는 편익관세를 적용하지 아니할 수 있다. 이 경우 세관장은 제38조의3제6항 및 제39조제2항에 따라 납부하여야 할 세액 또는 납부하여야 할 세액과 납부한 세액의 차액을 부과ㆍ징수하여야 한다.<신설 2014. 1. 1., 2016. 12. 20., 2025. 10. 1.>\n    1. 외국세관등이 재정경제부령으로 정한 기간 이내에 그 결과를 회신하지 아니한 경우\n    2. 세관장에게 신고한 원산지가 실제 원산지와 다른 것으로 확인된 경우\n    3. 외국세관등의 회신내용에 제229조에 따른 원산지증명서 및 원산지증명서확인자료를 확인하는 데 필요한 정보가 포함되지 아니한 경우\n  ③ 세관장은 원산지증명서가 발급된 물품을 수입하는 국가의 권한 있는 기관으로부터 원산지증명서 및 원산지증명서확인자료의 진위 여부, 정확성 등의 확인을 요청받은 경우 등 필요하다고 인정되는 경우에는 다음 각 호의 어느 하나에 해당하는 자를 대상으로 서면조사 또는 현지조사를 할 수 있다.<개정 2014. 1. 1., 2018. 12. 31.>\n    1. 원산지증명서를 발급받은 자\n    2. 원산지증명서를 발급한 자\n    3. 수출물품의 생산자 또는 수출자\n  ④ 제1항에 따른 확인요청 및 제3항에 따른 조사에 필요한 사항은 대통령령으로 정한다.<개정 2014. 1. 1.>\n  ⑤ 제1항부터 제4항까지의 규정에도 불구하고 조약ㆍ협정 등의 시행을 위하여 원산지증명서 확인요청 및 조사 등에 관한 사항을 따로 정할 필요가 있을 때에는 재정경제부령으로 정한다.<신설 2011. 12. 31., 2014. 1. 1., 2025. 10. 1.>\n  [전문개정 2010. 12. 30.]","D231-2":"제231조의2(보세운송업자 등에 대한 과징금의 부과기준 등) ① 법 제224조제2항에 따라 부과하는 과징금의 금액은 제1호의 기간에 제2호의 금액을 곱하여 산정한다.\n    1. 기간: 법 제224조제1항에 따라 산정된 업무정지 일수(1개월은 30일을 기준으로 한다)\n    2. 1일당 과징금 금액: 해당 사업의 수행에 따른 연간매출액의 6천분의 1\n  ② 제1항제2호의 연간매출액은 다음 각 호의 구분에 따라 산정한다.\n    1. 법 제222조제1항 각 호의 어느 하나에 해당하는 자(이하 “보세운송업자등”이라 한다)가 해당 사업연도 개시일 전에 사업을 시작한 경우: 직전 3개 사업연도의 평균 매출액. 이 경우 사업을 시작한 날부터 직전 사업연도 종료일까지의 기간이 3년 미만인 경우에는 그 시작일부터 그 종료일까지의 매출액을 연간 평균매출액으로 환산한 금액으로 한다.\n    2. 보세운송업자등이 해당 사업연도에 사업을 시작한 경우: 사업을 시작한 날부터 업무정지의 처분 사유가 발생한 날까지의 매출액을 연간매출액으로 환산한 금액\n  ③ 세관장은 제1항에 따라 산정된 과징금 금액의 4분의 1 범위에서 사업규모, 위반행위의 정도 및 위반횟수 등을 고려하여 그 금액을 가중하거나 감경할 수 있다. 이 경우 과징금을 가중하는 때에는 과징금 총액이 제2항에 따라 산정된 연간매출액의 100분의 3을 초과할 수 없다.\n  ④ 제1항에 따른 과징금의 부과 및 납부에 관하여는 제285조의7을 준용한다. 이 경우 제285조의7제1항, 제2항 및 제4항 중 “관세청장”은 “세관장”으로 본다.\n  [본조신설 2015. 2. 6.]","D124-2":"제124조의2(수입한 상태 그대로 수출되는 자가사용물품에 대한 관세 환급) ① 법 제106조의2제1항 전단에 따른 수입한 상태 그대로 수출되는 자가사용물품은 다음 각 호의 요건을 모두 갖춘 물품으로 한다.\n    1. 해당 물품이 수입신고 당시의 성질 또는 형태가 변경되지 아니한 상태로 수출될 것\n    2. 해당 물품이 국내에서 사용된 사실이 없다고 세관장이 인정할 것\n  ② 법 제106조의2제1항 또는 제2항에 따라 관세의 환급을 받으려는 자는 해당 물품의 품명ㆍ규격ㆍ수량ㆍ수입신고연월일ㆍ수입신고번호와 환급받으려는 관세액을 적은 신청서에 다음 각 호의 서류를 첨부하여 세관장에게 제출해야 한다. <개정 2022. 2. 15.>\n    1. 해당 물품의 수입신고필증이나 이를 갈음하는 세관의 증명서\n    2. 해당 물품의 수출 또는 환불을 증명하는 서류로서 다음 각 목의 구분에 따른 서류\n      가. 법 제106조의2제1항제1호 및 제2호의 경우: 수출신고필증이나 이를 갈음하는 세관의 증명서\n      나. 법 제106조의2제1항제3호의 경우: 선하증권 또는 항공화물운송장, 판매자가 발행한 환불 및 반품을 증명하는 자료\n      다. 법 제106조의2제2항의 경우: 판매자가 발행한 환불 및 반품을 증명하는 자료\n  ③ 법 제106조의2제1항 및 제2항에 따라 환급하는 관세액은 다음 각 호의 구분에 따른 금액으로 한다. <개정 2022. 2. 15.>\n    1. 물품을 전부 수출하거나 환불하는 경우: 이미 납부한 관세의 전액\n    2. 물품의 일부를 수출하거나 환불하는 경우: 그 일부 물품에 해당하는 관세액\n  [본조신설 2016. 2. 5.]","D257-0":"제257조(수입신고전 물품반출) ①법 제253조제1항의 규정에 의하여 수입하고자 하는 물품을 수입신고전에 즉시반출하고자 하는 자는 당해 물품의 품명ㆍ규격ㆍ수량 및 가격을 기재한 신고서를 제출하여야 한다.\n  ②법 제253조제1항의 규정에 의한 즉시반출을 할 수 있는 자 및 물품은 다음 각호의 1에 해당하는 것중 법 제226조제2항의 규정에 의한 구비조건의 확인에 지장이 없는 경우로서 세관장이 지정하는 것에 한한다.\n    1. 관세 등의 체납이 없고 최근 3년동안 수출입실적이 있는 제조업자 또는 외국인투자자가 수입하는 시설재 또는 원부자재\n    2. 삭제 <2010. 3. 26.>\n    3. 기타 관세 등의 체납우려가 없는 경우로서 관세청장이 정하는 물품","D90-0":"제90조(농림축산물에 대한 특별긴급관세) ①법 제68조제1항에 따라 특별긴급관세(이하 “특별긴급관세”라 한다)를 부과할 수 있는 경우는 다음 각 호의 어느 하나에 해당하는 경우로 한다. 다만, 다음 각 호 모두에 해당하는 경우에는 재정경제부령으로 정하는 바에 따라 그중 하나를 선택하여 적용할 수 있다. <개정 2008. 2. 29., 2014. 12. 30., 2025. 12. 30.>\n    1. 당해 연도 수입량이 제2항의 규정에 의한 기준발동물량을 초과하는 경우\n    2. 원화로 환산한 운임 및 보험료를 포함한 해당 물품의 수입가격(이하 “수입가격”이라 한다)이 1988년부터 1990년까지의 평균수입가격(별표 1에 해당하는 물품의 경우에는 1986년부터 1988년까지의 평균수입가격으로 하며, 이하 “기준가격”이라 한다)의 100분의 10을 초과하여 하락하는 경우\n  ②제1항제1호에서 규정한 기준발동물량은 자료입수가 가능한 최근 3년간의 평균수입량에 다음 각호의 구분에 의한 계수(이하 “기준발동계수”라 한다)를 곱한 것과 자료입수가 가능한 최근 연도의 당해 품목 국내소비량의 그 전년도대비 변화량을 합한 물량(이하 “기준발동물량”이라 한다)으로 한다. 다만, 기준발동물량이 최근 3년간 평균수입량의 100분의 105미만인 경우에는 기준발동물량을 최근 3년간 평균수입량의 100분의 105로 한다.\n    1. 자료입수가 가능한 최근 3년동안의 당해 물품 국내소비량에 대한 수입량 비율(이하 “시장점유율”이라 한다)이 100분의 10 이하인 때 : 100분의 125\n    2. 시장점유율이 100분의 10초과 100분의 30이하인 때 : 100분의 110\n    3. 시장점유율이 100분의 30을 초과하는 때 : 100분의 105\n    4. 시장점유율을 산정할 수 없는 때 : 100분의 125\n  ③제1항제1호의 규정에 의하여 부과하는 특별긴급관세는 국내외가격차에 상당한 율인 당해 양허세율에 그 양허세율의 3분의 1까지를 추가한 세율로 부과할 수 있으며 당해 연도 말까지 수입되는 분에 대하여서만 이를 적용한다.\n  ④ 제1항제2호에 따라 특별긴급관세를 부과하는 경우에는 국내외가격차에 상당한 율인 해당 양허세율에 따른 관세에 다음 표의 금액을 추가하여 부과할 수 있다. 다만, 수입량이 감소하는 경우에는 재정경제부령으로 정하는 바에 따라 다음 표에 따른 특별긴급관세를 부과하지 않을 수 있다. <개정 2024. 2. 29., 2025. 12. 30.>\n  <img alt=\"기준가격 대비 수입가격의 하락률 특별긴급관세액&#10;10퍼센트 초과 40퍼센트 이하 @@LATEX@@기준가격 times left(하락률- 10퍼센트포인트right) times 30퍼센트@@/LATEX@@&#10;40퍼센트 초과 60퍼센트 이하 @@LATEX@@기준가격 times left[9퍼센트 + left(하락률- 40퍼센트포인트right) times 50퍼센트right]@@/LATEX@@&#10;60퍼센트 초과 75퍼센트 이하 @@LATEX@@기준가격 times left[19퍼센트 + left(하락률- 60퍼센트포인트right) times 70퍼센트right]@@/LATEX@@&#10;75퍼센트 초과 @@LATEX@@기준가격 times left[29.5퍼센트 + left(하락률- 75퍼센트포인트right) times 90퍼센트right]@@/LATEX@@\" src=\"/LSW/flDownload.do?flSeq=138285497\" />\n  ⑤제1항의 규정을 적용함에 있어서 부패하기 쉽거나 계절성이 있는 물품에 대하여는 기준발동물량을 산정함에 있어서는 3년보다 짧은 기간을 적용하거나 기준가격을 산정시 다른 기간동안의 가격을 적용하는 등 당해 물품의 특성을 고려할 수 있다.\n  ⑥법 제73조의 규정에 의하여 국제기구와 관세에 관한 협상에서 양허된 시장접근물량으로 수입되는 물품은 특별긴급관세 부과대상에서 제외한다. 다만, 그 물품은 제1항제1호의 규정에 의한 특별긴급관세의 부과를 위하여 수입량을 산정하는 때에는 이를 산입한다.\n  ⑦특별긴급관세가 부과되기 전에 계약이 체결되어 운송중에 있는 물품은 제1항제1호의 규정에 의한 특별긴급관세 부과대상에서 제외한다. 다만, 당해 물품은 다음 해에 제1항제1호의 규정에 의하여 특별긴급관세를 부과하기 위하여 필요한 수입량에는 산입할 수 있다.\n  ⑧관계부처의 장 또는 이해관계인이 법 제68조에 따른 조치를 요청하려는 경우에는 해당 물품과 관련된 다음 각 호의 사항에 관한 자료를 재정경제부장관에게 제출하여야 한다. <개정 2008. 2. 29., 2011. 4. 1., 2014. 12. 30., 2025. 12. 30.>\n    1. 해당 물품의 관세율표 번호ㆍ품명ㆍ규격ㆍ용도 및 대체물품\n    2. 해당 물품의 최근 3년간 연도별 국내소비량ㆍ수입량 및 기준가격\n    3. 인상하여야 하는 세율, 인상이유, 적용기간 및 그 밖의 참고사항\n  ⑨재정경제부장관은 특별긴급관세의 적용에 관하여 필요한 사항을 조사하기 위하여 필요하다고 인정되는 때에는 관계기관ㆍ수출자ㆍ수입자 기타 이해관계인에게 관계자료의 제출 기타 필요한 협조를 요청할 수 있다. <개정 2008. 2. 29., 2025. 12. 30.>","R85-0":"제85조(전자문서중계사업자 지정기준) ①영 제285조의4제3항에 따른 지정기준은 다음과 같다. <개정 2005. 2. 11., 2009. 3. 26., 2017. 3. 31.>\n    1. 전자문서중계사업에 필요한 다음 각 목의 설비에 대한 정당한 사용권을 가질 것\n      가. 전자문서중계사업을 안정적으로 수행할 수 있는 충분한 속도 및 용량의 전산설비\n      나. 전자문서를 변환ㆍ처리ㆍ전송 및 보관할 수 있는 소프트웨어\n      다. 전자문서를 전달하고자 하는 자의 전산처리설비로부터 관세청의 전산처리설비까지 전자문서를 안전하게 전송할 수 있는 통신설비 및 통신망\n      라. 전자문서의 변환ㆍ처리ㆍ전송ㆍ보관, 데이터베이스의 안전한 운영과 보안을 위한 전산설비 및 소프트웨어\n    2. 전자문서중계사업에 필요한 다음 각목의 기술인력을 보유할 것\n      가. 「국가기술자격법」에 의한 정보처리 또는 통신 분야의 기술사 이상의 자격이 있는 자 1인 이상\n      나. 전자문서중계사업을 위한 표준전자문서의 개발 또는 전자문서중계방식과 관련한 기술 분야의 근무경력이 2년 이상인 자 2인 이상\n      다. 전자문서와 데이터베이스의 보안관리를 위한 전문요원 1인 이상\n      라. 「관세사법」에 의한 관세사 자격이 있는 자 1인 이상\n  ②제1항제1호 및 제2호 각목의 세부적인 사항은 관세청장이 정하여 고시한다.\n  [본조신설 2003. 2. 14.]","L38-3":"제38조의3(수정 및 경정) ① 납세의무자는 신고납부한 세액이 부족한 경우에는 대통령령으로 정하는 바에 따라 수정신고(보정기간이 지난 날부터 제21조제1항에 따른 기간이 끝나기 전까지로 한정한다)를 할 수 있다. 이 경우 납세의무자는 수정신고한 날의 다음 날까지 해당 관세를 납부하여야 한다. <개정 2013. 1. 1.>\n  ② 납세의무자는 신고납부한 세액, 제38조의2제1항에 따라 보정신청한 세액 및 이 조 제1항에 따라 수정신고한 세액이 과다한 것을 알게 되었을 때에는 최초로 납세신고를 한 날부터 5년 이내에 대통령령으로 정하는 바에 따라 신고한 세액의 경정을 세관장에게 청구할 수 있다.<개정 2011. 12. 31., 2013. 8. 13., 2014. 12. 23., 2016. 12. 20., 2022. 12. 31.>\n  ③ 납세의무자는 최초의 신고 또는 경정에서 과세표준 및 세액의 계산근거가 된 거래 또는 행위 등이 그에 관한 소송에 대한 판결(판결과 같은 효력을 가지는 화해나 그 밖의 행위를 포함한다)에 의하여 다른 것으로 확정되는 등 대통령령으로 정하는 사유가 발생하여 납부한 세액이 과다한 것을 알게 되었을 때에는 제2항에 따른 기간에도 불구하고 그 사유가 발생한 것을 안 날부터 2개월 이내에 대통령령으로 정하는 바에 따라 납부한 세액의 경정을 세관장에게 청구할 수 있다.<신설 2011. 12. 31., 2016. 12. 20.>\n  ④ 세관장은 제2항 또는 제3항에 따른 경정의 청구를 받은 날부터 2개월 이내에 세액을 경정하거나 경정하여야 할 이유가 없다는 뜻을 그 청구를 한 자에게 통지하여야 한다.<신설 2016. 12. 20.>\n  ⑤ 제2항 또는 제3항에 따라 경정을 청구한 자가 제4항에 따라 2개월 이내에 통지를 받지 못한 경우에는 그 2개월 이 되는 날의 다음 날부터 제5장에 따른 이의신청, 심사청구, 심판청구 또는 「감사원법」에 따른 심사청구를 할 수 있다.<신설 2016. 12. 20.>\n  ⑥ 세관장은 납세의무자가 신고납부한 세액, 납세신고한 세액 또는 제2항 및 제3항에 따라 경정청구한 세액을 심사한 결과 과부족하다는 것을 알게 되었을 때에는 대통령령으로 정하는 바에 따라 그 세액을 경정하여야 한다.<개정 2011. 12. 31., 2016. 12. 20.>\n  [전문개정 2010. 12. 30.]","L222-0":"제222조(보세운송업자등의 등록 및 보고) ① 다음 각 호의 어느 하나에 해당하는 자(이하 “보세운송업자등”이라 한다)는 대통령령으로 정하는 바에 따라 관세청장이나 세관장에게 등록하여야 한다. <개정 2011. 7. 25., 2019. 12. 31., 2020. 12. 22.>\n    1. 보세운송업자\n    2. 보세화물을 취급하려는 자로서 다른 법령에 따라 화물운송의 주선을 업으로 하는 자(이하 “화물운송주선업자”라 한다)\n    3. 국제무역선ㆍ국제무역기 또는 국경출입차량에 물품을 하역하는 것을 업으로 하는 자\n    4. 국제무역선ㆍ국제무역기 또는 국경출입차량에 다음 각 목의 어느 하나에 해당하는 물품 등을 공급하는 것을 업으로 하는 자\n      가. 선박용품\n      나. 항공기용품\n      다. 차량용품\n      라. 선박ㆍ항공기 또는 철도차량 안에서 판매할 물품\n      마. 용역\n    5. 국제항 안에 있는 보세구역에서 물품이나 용역을 제공하는 것을 업으로 하는 자\n    6. 국제무역선ㆍ국제무역기 또는 국경출입차량을 이용하여 상업서류나 그 밖의 견본품 등을 송달하는 것을 업으로 하는 자\n    7. 삭제<2024. 12. 31.>\n  ② 제1항에 따른 등록의 기준ㆍ절차 등에 관하여 필요한 사항은 대통령령으로 정한다.\n  ③ 관세청장이나 세관장은 이 법의 준수 여부를 확인하기 위하여 필요하다고 인정할 때에는 보세운송업자등에게 업무실적, 등록사항 변경, 업무에 종사하는 자의 성명이나 그 밖의 인적사항 등 그 영업에 관하여 보고를 하게 하거나 장부 또는 그 밖의 서류를 제출하도록 명할 수 있다. 이 경우 영업에 관한 보고 또는 서류제출에 필요한 사항은 관세청장이 정한다.<개정 2018. 12. 31., 2020. 12. 22.>\n  ④ 관세청장이나 세관장은 화물운송주선업자에게 제225조제2항에 따라 해당 업무에 관하여 보고하게 할 수 있다.\n  <신설 2011. 7. 25.>\n  ⑤ 제1항에 따른 등록의 유효기간은 3년으로 하며, 대통령령으로 정하는 바에 따라 갱신할 수 있다. 다만, 관세청장이나 세관장은 제255조의7제1항에 따른 안전관리 기준의 준수 정도 측정ㆍ평가 결과가 우수한 자가 등록을 갱신하는 경우에는 유효기간을 2년의 범위에서 연장하여 정할 수 있다.<신설 2014. 1. 1., 2015. 12. 15., 2021. 12. 21.>\n  [전문개정 2010. 12. 30.]\n  [제목개정 2011. 7. 25.]","D168-0":"제168조(특수선박) 법 제146조 단서에서 “대통령령으로 정하는 선박 및 항공기”란 다음 각 호의 어느 하나에 해당하는 것을 말한다. <개정 2011. 4. 1.>\n    1. 군함 및 군용기\n    2. 국가원수 또는 정부를 대표하는 외교사절이 전용하는 선박 또는 항공기","R81-0":"제81조(업무시간 및 물품취급시간외 통관절차 등에 관한 수수료) ①법 제321조제3항의 규정에 의하여 납부하여야 하는 업무시간외 통관절차ㆍ보세운송절차 또는 입출항절차에 관한 수수료(구호용 물품의 경우 당해 수수료를 면제한다)는 기본수수료 4천원(휴일은 1만2천원)에 다음 각호의 구분에 의한 금액을 합한 금액으로 한다. 다만, 수출물품의 통관절차 또는 출항절차에 관한 수수료는 수입물품의 통관절차 또는 출항절차에 관한 수수료의 4분의 1에 상당하는 금액으로 한다. <개정 2003. 2. 14., 2025. 3. 21.>\n    1. 오전 6시부터 오후 6시까지 : 1시간당 3천원\n    2. 오후 6시부터 오후 10시까지 : 1시간당 4천8백원\n    3. 오후 10시부터 그 다음날 오전 6시까지 : 1시간당 7천원\n  ②제1항의 규정에 의하여 수수료를 계산함에 있어서 관세청장이 정하는 물품의 경우 여러 건의 수출입물품을 1건으로 하여 통관절차ㆍ보세운송절차 또는 입출항절차를 신청하는 때에는 이를 1건으로 한다.\n  ③법 제321조제3항의 규정에 의하여 납부하여야 하는 물품취급시간외의 물품취급에 관한 수수료는 당해 물품을 취급하는 때에 세관공무원이 참여하는 경우에는 기본수수료 2천원(휴일은 6천원)에 다음 각호의 1에 해당하는 금액을 합한 금액으로 하며, 세관공무원이 참여하지 아니하는 경우에는 기본수수료 2천원(휴일은 6천원)으로 한다. 다만, 수출물품을 취급하는 때에는 그 금액의 4분의 1에 상당하는 금액(보세구역에 야적하는 산물인 광석류의 경우에는 그 금액의 5분의 1에 상당하는 금액)으로 한다.\n    1. 오전 6시부터 오후 6시까지 : 1시간당 1천5백원\n    2. 오후 6시부터 오후 10시까지 : 1시간당 2천4백원\n    3. 오후 10시부터 그 다음날 오전 6시까지 : 1시간당 3천6백원\n  ④제1항 및 제3항의 규정에 의한 수수료금액을 계산함에 있어서 소요시간중 1시간이 제1항 각호 상호간 또는 제3항 각호 상호간에 걸쳐 있는 경우의 수수료는 금액이 많은 것으로 한다.\n  ⑤세관장은 제1항 및 제3항의 규정에 의한 수수료를 일정기간별로 일괄하여 납부하게 할 수 있다.\n  ⑥제1항 및 제3항의 규정에 의한 수수료를 납부하여야 하는 자가 관세청장이 정하는 바에 따라 이를 따로 납부한 때에는 그 사실을 증명하는 증표를 세관장에게 제출하여야 한다.\n  [제목개정 2025. 3. 21.]","D31-3":"제31조의3(사전조정의 절차 등) ① 관세청장은 법 제37조의2제1항에 따른 신청을 받은 날부터 90일 이내에 같은 조 제2항에 따른 사전조정 절차를 시작하고, 그 사실을 신청자에게 통지하여야 한다. 다만, 관세청장은 제31조제1항 및 제2항에 따른 자료가 제출되지 아니하거나 거짓으로 작성되는 등의 사유로 사전조정 절차를 시작할 수 없으면 그 사유를 신청자에게 통지하여야 한다. <개정 2018. 2. 13.>\n  ② 신청자는 제1항 단서에 따라 사전조정 절차를 시작할 수 없다는 통지를 받은 경우에는 그 통지를 받은 날부터 30일 이내에 자료를 보완하여 제출하거나 법 제37조제1항제3호의 사항에 관한 사전심사와 「국제조세조정에 관한 법률」 제14조제2항 단서에 따른 사전승인 절차를 따로 진행할 것인지를 관세청장에게 통지할 수 있다. 이 경우 관세청장은 그 통지받은 사항을 지체 없이 국세청장에게 알려야 한다. <개정 2018. 2. 13., 2021. 2. 17.>\n  ③ 법 제37조의2제5항에 따른 사전조정 신청 방법 및 절차 등에 관하여는 제31조 및 「국제조세조정에 관한 법률 시행령」 제26조, 제27조, 제29조, 제30조, 제32조 및 제40조제3항을 준용한다. <개정 2018. 2. 13., 2021. 2. 17.>\n  ④ 제1항부터 제3항까지에서 규정한 사항 외에 사전조정의 실시, 그 밖에 사전조정에 필요한 사항은 재정경제부령으로 정한다. <개정 2025. 12. 30.>\n  [본조신설 2015. 2. 6.]\n  [종전 제31조의3은 제31조의5로 이동 <2015. 2. 6.>]","L114-0":"제114조(관세조사의 사전통지와 연기신청) ① 세관공무원은 제110조제2항 각 호의 어느 하나에 해당하는 조사를 하기 위하여 해당 장부, 서류, 전산처리장치 또는 그 밖의 물품 등을 조사하는 경우에는 조사를 받게 될 납세자(그 위임을 받은 자를 포함한다. 이하 이 조에서 같다)에게 조사 시작 20일[제118조제4항제2호 후단 또는 제128조제1항제3호 후단(제131조제2호 전단과 제132조제4항 본문에서 준용하는 경우를 포함한다)에 따른 재조사 결정으로 재조사를 하는 경우에는 7일] 전에 조사 대상, 조사 사유, 그 밖에 대통령령으로 정하는 사항을 통지(이하 이 조에서 “사전통지”라 한다)하여야 한다. 다만, 다음 각 호의 어느 하나에 해당하는 경우에는 그러하지 아니하다. <개정 2016. 12. 20., 2017. 12. 19., 2025. 12. 23.>\n    1. 범칙사건에 대하여 조사하는 경우\n    2. 사전에 통지하면 증거인멸 등으로 조사 목적을 달성할 수 없는 경우\n  ② 제1항에 따른 통지를 받은 납세자가 천재지변이나 그 밖에 대통령령으로 정하는 사유로 조사를 받기가 곤란한 경우에는 대통령령으로 정하는 바에 따라 해당 세관장에게 조사를 연기하여 줄 것을 신청할 수 있다.\n  ③ 세관공무원은 제1항제2호의 사유로 사전통지를 하지 아니하고 조사를 개시하는 경우에는 조사를 개시하는 날에 조사받을 자에게 사전통지 사항과 사전통지를 하지 아니한 사유를 서면으로 교부하여야 한다.<신설 2025. 12. 23.>\n  ④ 세관공무원은 사전통지 또는 제3항에 따라 교부한 사항을 변경하여 조사하는 경우에는 변경사항 및 변경사유를 서면으로 통지하여야 한다.<신설 2025. 12. 23.>\n  [전문개정 2010. 12. 30.]","D193-3":"제193조의3(특허보세구역의 운영인에 대한 과징금의 부과기준 등) ① 법 제178조제3항에 따라 부과하는 과징금의 금액은 제1호의 기간에 제2호의 금액을 곱하여 산정한다.\n    1. 기간: 법 제178조제1항에 따라 산정한 물품반입 등의 정지 일수(1개월은 30일을 기준으로 한다)\n    2. 1일당 과징금 금액: 해당 특허보세구역 운영에 따른 연간 매출액의 6천분의 1\n  ② 제1항제2호의 연간매출액은 다음 각 호의 구분에 따라 산정한다.\n    1. 특허보세구역의 운영인이 해당 사업연도 개시일 이전에 특허보세구역의 운영을 시작한 경우: 직전 3개 사업연도의 평균 매출액(특허보세구역의 운영을 시작한 날부터 직전 사업연도 종료일까지의 기간이 3년 미만인 경우에는 그 시작일부터 그 종료일까지의 매출액을 연평균 매출액으로 환산한 금액)\n    2. 특허보세구역의 운영인이 해당 사업연도에 특허보세구역 운영을 시작한 경우: 특허보세구역의 운영을 시작한 날부터 반입정지 등의 처분사유가 발생한 날까지의 매출액을 연매출액으로 환산한 금액\n  ③ 세관장은 제1항에 따라 산정된 과징금 금액의 4분의 1의 범위에서 사업규모, 위반행위의 정도 및 위반횟수 등을 고려하여 그 금액을 가중하거나 감경할 수 있다. 다만, 과징금을 가중하는 경우에는 과징금 총액이 제2항에 따라 산정된 연간매출액의 100분의 3을 초과할 수 없다.\n  ④ 제1항에 따른 과징금의 부과 및 납부에 관하여는 제285조의7을 준용한다. 이 경우 “관세청장”은 “세관장”으로 본다.\n  [본조신설 2011. 4. 1.]\n  [제목개정 2015. 2. 6.]\n  [제193조의2에서 이동 <2020. 2. 11.>]","R10-0":"제10조(정상가격 및 덤핑가격의 비교) ①영 제58조제1항 본문의 규정에 의한 통상거래가격과 동항 단서의 규정에 의한 제3국으로 수출되는 수출가격을 결정함에 있어서 동종물품의 판매가 다음 각호의 1에 해당하는 경우에는 그 판매가격을 근거로 하지 아니할 수 있다.\n    1. 조사대상기간 동안 정상가격을 결정하기 위하여 고려되고 있는 거래중 당해 물품의 제조원가에 합리적인 수준의 판매비 및 일반관리비를 가산한 가격(이하 이 조에서 “원가”라 한다) 이하로 판매한 양이 100분의 20 이상이거나 정상가격을 결정하기 위하여 고려되고 있는 거래의 가중평균 판매가격이 당해 거래의 가중평균 원가 이하이고, 당해 원가 이하의 판매에 의하여 적절한 기간내에 그 물품의 원가수준에 상당하는 비용을 회수할 수 없는 경우(판매시 원가 이하인 가격이 조사대상기간동안의 가중평균 원가보다 높은 때에는 그 물품의 원가수준에 상당하는 비용을 회수할 수 있는 것으로 본다)\n    2. 영 제23조제1항의 규정에 의한 특수관계가 있는 당사자간의 판매가격으로서 당해 가격이 당사자간의 관계에 의하여 영향을 받은 경우\n  ②영 제58조제1항 단서의 규정에 의한 특수한 시장상황 등에는 공급국안에서의 판매량이 그 공급국으로부터의 수입량의 100분의 5 미만으로서 정상가격결정의 기초로 사용하기에 부적당한 경우를 포함한다. 다만, 공급국안에서의 판매량이 100분의 5 미만인 경우에도 덤핑가격과 비교할 수 있음이 입증되는 때에는 그러하지 아니하다.\n  ③영 제58조제1항 단서의 규정에 의한 구성가격을 산정함에 있어서 판매비ㆍ일반관리비 및 이윤의 금액은 조사대상 공급자에 의하여 동종물품의 통상적인 거래에서 발생한 생산 및 판매와 관련된 실제자료에 기초하여야 한다. 이 경우 현재 또는 미래의 생산에 기여할 수 있는 일회성 비용이나 조사대상기간중의 생산개시비용 등으로 인하여 원가가 적절히 반영되지 아니한 때에는 이를 조정하여야 한다.\n  ④제3항의 규정에 의하여 구성가격을 산정함에 있어서 실제자료에 기초할 수 없는 때에는 다음 각호의 자료에 기초할 수 있다. <개정 2010. 3. 30.>\n    1. 조사대상 공급자에 의하여 원산지국가의 국내시장에서 동일부류의 물품의 생산ㆍ판매와 관련하여 발생되고 실현된 실제금액\n    2. 원산지국가의 국내시장에서 동종물품의 생산ㆍ판매와 관련하여 다른 조사대상 공급자에 의하여 발생되고 실현된 실제금액의 가중평균\n    3. 기타 합리적이라고 인정되는 방법. 다만, 이러한 방법으로 산정된 이윤은 원산지국가안에서 동일부류의 물품을 다른 공급자가 판매하여 통상적으로 실현시킨 이윤을 초과하여서는 아니된다.\n  ⑤영 제58조제3항 각호외의 부분 본문의 규정을 적용함에 있어서의 시장경제국가는 원칙적으로 당해 물품을 공급한 국가와 경제발전정도, 당해 물품의 생산기술수준 등이 비슷한 국가로 한다.\n  ⑥ 영 제58조제3항 각 호 외의 부분 단서에서 “재정경제부령이 정하는 경우”란 해당 국가 안에서 해당 물품의 생산 또는 판매가 시장경제원리에 따르고 있는 경우를 말한다. <개정 2008. 12. 31., 2026. 1. 2.>\n  ⑦영 제58조제4항제1호의 규정에 의한 재판매가격을 기초로 산정한 가격은 수입과 재판매 사이에 발생하는 제세를 포함한 비용과 그로 인한 이윤을 공제한 가격으로 하며, 영 제58조제4항제2호의 규정에 의한 합리적인 기준에 의한 가격은 당해 물품의 수입가격에 당해 수입과 관련하여 발생하거나 당해 수입과 재판매 사이에서 발생하는 비용과 적정한 이윤 등을 참작하여 산출한 가격으로 한다.\n  ⑧영 제58조제5항 전단의 규정에 의하여 정상가격과 덤핑가격을 비교하는 때에는 원칙적으로 거래량을 가중치로 하여 가중산술평균한 가격으로 비교하여야 한다. 이 경우 개별 덤핑가격이 정상가격보다 높은 경우를 포함하여 모든 개별 덤핑가격을 가중산술평균한 가격을 덤핑가격으로 한다. <개정 2010. 3. 30.>\n  ⑨ 영 제58조제5항 전단에 따라 정상가격과 덤핑가격을 비교할 때 적용하는 환율은 원칙적으로 해당 물품 거래일의 환율로 한다. 다만, 해당 물품 거래가 선물환거래와 직접적으로 연계되어 있는 경우에는 그 약정환율을 적용할 수 있다. <신설 2010. 3. 30.>\n  ⑩영 제58조제5항 후단의 규정에 의하여 물리적 특성의 차이로 가격조정을 하는 때에는 그 물리적 특성이 공급국의 시장가격에 미치는 영향을 기준으로 계산하여야 한다. 다만, 공급국의 시장가격에 관한 자료를 구할 수 없거나 그 자료가 가격비교에 사용하기에 부적합한 때에는 물리적 특성의 차이에 따른 제조원가의 차이를 기준으로 조정할 수 있다. <개정 2010. 3. 30.>\n  ⑪영 제58조제5항 후단의 규정에 의하여 판매수량의 차이로 가격조정을 하는 경우는 대량생산에 따른 생산비의 절감에 의한 것이거나 통상적인 거래에서 모든 구매자에게 제공되는  대량판매에 의한 할인이 있는 경우로 한다. <개정 2010. 3. 30.>\n  ⑫영 제58조제5항 후단의 규정에 의하여 판매조건의 차이로 가격조정을 하는 경우는 그 판매조건이 당해 판매가격에 영향을 미칠 정도의 직접적인 관계가 있는 경우에 한한다. <개정 2010. 3. 30.>\n  ⑬영 제58조제5항 후단의 규정에 의하여 환율변동으로 가격을 조정하는 경우는 덤핑률 조사대상 기간 중 환율이 일정한 방향으로 변동하여 지속된 경우로 하며, 그 조정된 가격을 조사대상 공급자에게 환율변동 후 60일 동안 적용할 수 있게 하여야 한다. <개정 2010. 3. 30.>","L244-0":"제244조(입항전수입신고) ① 수입하려는 물품의 신속한 통관이 필요할 때에는 제243조제2항에도 불구하고 대통령령으로 정하는 바에 따라 해당 물품을 적재한 선박이나 항공기가 입항하기 전에 수입신고를 할 수 있다. 이 경우 입항전수입신고가 된 물품은 우리나라에 도착한 것으로 본다.\n  ② 세관장은 입항전수입신고를 한 물품에 대하여 제246조에 따른 물품검사의 실시를 결정하였을 때에는 수입신고를 한 자에게 이를 통보하여야 한다.\n  ③ 제2항에 따라 검사대상으로 결정된 물품은 수입신고를 한 세관의 관할 보세구역(보세구역이 아닌 장소에 장치하는 경우 그 장소를 포함한다)에 반입되어야 한다. 다만, 세관장이 적재상태에서 검사가 가능하다고 인정하는 물품은 해당 물품을 적재한 선박이나 항공기에서 검사할 수 있다.\n  ④ 제2항에 따라 검사대상으로 결정되지 아니한 물품은 입항 전에 그 수입신고를 수리할 수 있다.\n  ⑤ 입항전수입신고가 수리되고 보세구역 등으로부터 반출되지 아니한 물품에 대하여는 해당 물품이 지정보세구역에 장치되었는지 여부와 관계없이 제106조제4항을 준용한다.<개정 2020. 6. 9.>\n  ⑥ 입항전수입신고된 물품의 통관절차 등에 관하여 필요한 사항은 관세청장이 정한다.\n  [전문개정 2010. 12. 30.]","L12-0":"제12조(장부 등의 보관) ① 이 법에 따라 가격신고, 납세신고, 수출입신고, 반송신고, 보세화물반출입신고, 보세운송신고를 한 자 또는 제출된 적재화물목록을 작성한 자는 신고 또는 작성한 자료의 내용을 증빙할 수 있는 장부 및 증거서류(신고필증을 포함한다. 이하 이 조에서 같다)를 성실하게 작성하여 신고일 또는 자료 제출일부터 5년의 범위에서 대통령령으로 정하는 기간 동안 갖추어 두어야 한다. 이 경우 장부 및 증거서류 중 제37조의4제1항 및 제2항에 따라 세관장이 제30조제3항제4호에 따른 특수관계에 있는 자에게 제출하도록 요구할 수 있는 자료의 경우에는 「소득세법」 제6조 또는 「법인세법」 제9조에 따른 납세지(「소득세법」 제9조 또는 「법인세법」 제10조에 따라 국세청장이나 관할지방국세청장이 지정하는 납세지를 포함한다)에 갖추어 두어야 한다. <개정 2024. 12. 31.>\n  ② 제1항에 따라 장부 및 증거서류를 작성ㆍ보관하여야 하는 자는 그 장부와 증거서류의 전부 또는 일부를 「전자문서 및 전자거래 기본법」에 따른 정보처리시스템을 이용하여 작성할 수 있다. 이 경우 그 처리과정 등을 대통령령으로 정하는 기준에 따라 디스켓 또는 그 밖의 정보보존 장치에 보존하여야 한다.\n  ③ 제1항을 적용하는 경우 「전자문서 및 전자거래 기본법」에 따른 전자문서로 작성하거나 같은 법 제5조제2항에 따른 전자화문서로 변환하여 같은 법 제31조의2에 따른 공인전자문서센터에 보관한 경우에는 제1항에 따라 장부 및 증거서류를 갖춘 것으로 본다. 다만, 계약서 등 위조ㆍ변조하기 쉬운 장부 및 증거서류로서 대통령령으로 정하는 것은 그러하지 아니하다.\n  [전문개정 2023. 12. 31.]","L201-0":"제201조(운영인의 물품관리) ① 운영인은 종합보세구역에 반입된 물품을 종합보세기능별로 구분하여 관리하여야 한다.\n  ② 세관장은 종합보세구역에 장치된 물품 중 제208조제1항 단서에 해당되는 물품은 같은 조에 따라 매각할 수 있다.\n  ③ 운영인은 종합보세구역에 반입된 물품을 종합보세구역 안에서 이동ㆍ사용 또는 처분을 할 때에는 장부 또는 전산처리장치를 이용하여 그 기록을 유지하여야 한다. 이 경우 재정경제부령으로 정하는 물품은 미리 세관장에게 신고하여야 한다.<개정 2025. 10. 1.>\n  ④ 제3항에 따른 기록의 방법과 절차 등에 관하여 필요한 사항은 관세청장이 정한다.\n  ⑤ 운영인은 종합보세구역에 장치된 물품 중 반입한 날부터 6개월 이상의 범위에서 관세청장이 정하는 기간이 지난 외국물품이 다음 각 호의 어느 하나에 해당하는 경우에는 관세청장이 정하여 고시하는 바에 따라 세관장에게 그 외국물품의 매각을 요청할 수 있다.<신설 2018. 12. 31.>\n    1. 화주가 분명하지 아니한 경우\n    2. 화주가 부도 또는 파산한 경우\n    3. 화주의 주소ㆍ거소 등 그 소재를 알 수 없는 경우\n    4. 화주가 수취를 거절하는 경우\n    5. 화주가 거절의 의사표시 없이 수취하지 아니한 경우\n  ⑥ 제5항에 따른 세관장의 외국물품의 매각에 관하여는 제208조부터 제212조까지의 규정을 준용한다. 이 경우 제208조제1항 각 호 외의 부분 본문 중 “장치기간이 지나면”은 “매각요청을 접수하면”으로, 같은 조 제2항 중 “장치기간이 지난 물품” 및 제209조제1항 중 “외국물품”은 각각 “매각요청물품”으로 본다.<신설 2018. 12. 31., 2022. 12. 31.>\n  [전문개정 2010. 12. 30.]","D74-0":"제74조(보조금등을 받은 물품의 수입 및 실질적 피해등의 조사개시) ①무역위원회는 제73조제1항의 후단의 규정에 의한 조사신청을 받은 경우 보조금등을 받은 물품의 수입사실과 실질적 피해등의 사실에 관한 조사의 개시여부를 결정하여 조사신청을 받은 날부터 2월 이내에 그 결과와 다음 각호의 사항을 재정경제부장관에게 통보하여야 한다. <개정 2008. 2. 29., 2025. 12. 30.>\n    1. 조사대상물품(조사대상물품이 많은 경우에는 재정경제부령이 정하는 바에 따라 선정된 조사대상물품)\n    2. 조사대상기간\n    3. 조사대상 수출국정부 또는 수출자(조사대상 수출국정부 또는 수출자가 많은 경우에는 재정경제부령이 정하는 바에 따라 선정된 조사대상 수출국정부 또는 수출자)\n  ②무역위원회는 제1항의 규정에 의하여 조사의 개시여부를 결정함에 있어서 조사신청이 다음 각호의 1에 해당하는 경우에는 당해 조사신청을 기각할 수 있다. <개정 2008. 2. 29., 2025. 12. 30.>\n    1. 신청서를 제출한 자가 제73조제1항의 규정에 의하여 부과요청을 할 수 있는 자가 아닌 경우\n    2. 보조금등을 받은 물품의 수입사실과 실질적 피해등의 사실에 관한 충분한 증빙자료를 제출하지 아니한 경우\n    3. 보조금등의 금액 또는 보조금등을 받은 물품의 수입량이 재정경제부령이 정하는 기준에 미달되거나 실질적 피해등이 경미하다고 인정되는 경우\n    4. 당해 조사신청에 찬성의사를 표시한 국내생산자들의 생산량합계가 재정경제부령이 정하는 기준에 미달된다고 인정되는 경우\n    5. 조사개시전에 국내산업에 미치는 나쁜 영향을 제거하기 위한 조치가 취하여지는 등 조사개시가 필요 없게 된 경우\n  ③무역위원회는 제1항에 따른 조사개시결정을 한 때에는 그 결정일부터 10일 이내에 조사개시의 결정에 관한 사항을 조사신청자, 해당 물품의 수출국 정부 및 수출자, 그 밖의 이해관계인에게 통지하고, 관보에 게재해야 한다. 이 경우 해당 물품의 수출국 정부 및 수출자에게는 제73조제6항 각 호의 자료를 함께 제공해야 한다. <개정 2020. 12. 29.>\n  ④ 무역위원회는 제1항제1호에 따른 조사대상물품의 품목분류 등에 대해서는 관세청장과 협의하여 선정할 수 있다. <신설 2020. 12. 29.>","L56-2":"제56조의2(우회덤핑 물품에 대한 덤핑방지관세의 부과) ① 다음 각 호의 어느 하나에 해당하는 경우로서 제51조에 따라 덤핑방지관세가 부과되는 물품의 물리적 특성이나 형태 등을 경미하게 변경하는 행위 등 대통령령으로 정하는 행위를 통하여 해당 덤핑방지관세의 부과를 회피(이하 “우회덤핑”이라 한다)하려는 사실이 조사를 통하여 확인되는 경우에는 재정경제부령으로 그 물품을 지정하여 같은 조에 따른 덤핑방지관세를 부과할 수 있다. <개정 2025. 10. 1.>\n    1. 제51조에 따른 부과요청을 한 자가 우회덤핑 해당 여부에 대한 조사를 신청한 경우\n    2. 그 밖에 대통령령으로 정하는 경우\n  ② 제1항에 따른 물품(이하 이 조에서 “우회덤핑 물품”이라 한다)에 대해서는 제53조 및 제54조를 적용하지 아니한다.\n  ③ 제55조에도 불구하고 제1항에 따른 덤핑방지관세의 부과는 해당 우회덤핑에 대한 조사의 개시일 이후 수입되는 물품에 대해서도 적용한다.\n  ④ 우회덤핑에 관한 조사, 우회덤핑 물품에 대한 덤핑방지관세의 부과 및 시행 등에 필요한 사항은 대통령령으로 정한다.\n  [본조신설 2023. 12. 31.]","R4-0":"제4조(무료 또는 인하된 가격으로 공급하는 물품 및 용역) ①영 제18조제2호에서 “재정경제부령으로 정하는 것”이란 해당 수입물품의 조립ㆍ가공ㆍ성형 등의 생산과정에 직접 사용되는 기계ㆍ기구 등을 말한다. <개정 2008. 12. 31., 2011. 4. 1., 2026. 1. 2.>\n  ②영 제18조제4호의 규정에 의한 수입물품의 생산에 필요한 기술은 특허기술ㆍ노하우 등 이미 개발되어 있는 기술과 새로이 수행하여 얻은 기술로 한다.\n  ③영 제18조 각 호의 물품 및 용역의 가격은 다음 각 호의 구분에 따른 금액으로 결정한다. <개정 2020. 10. 7.>\n    1. 해당 물품 및 용역을 영 제23조제1항에 따른 특수관계가 없는 자로부터 구입 또는 임차하여 구매자가 공급하는 경우: 그 구입 또는 임차하는 데에 소요되는 비용과 이를 생산장소까지 운송하는 데에 소요되는 비용을 합한 금액\n    2. 해당 물품 및 용역을 구매자가 직접 생산하여 공급하는 경우: 그 생산비용과 이를 수입물품의 생산장소까지 운송하는 데에 소요되는 비용을 합한 금액\n    3. 해당 물품 및 용역을 구매자와 영 제23조제1항에 따른 특수관계에 있는 자로부터 구입 또는 임차하여 공급하는 경우: 다음 각 목의 어느 하나에 따라 산출된 비용과 이를 수입물품의 생산장소까지 운송하는 데에 소요되는 비용을 합한 금액\n      가. 해당 물품 및 용역의 생산비용\n      나. 특수관계에 있는 자가 해당 물품 및 용역을 구입 또는 임차한 비용\n    4. 수입물품의 생산에 필요한 기술ㆍ설계ㆍ고안ㆍ공예 및 의장(이하 이 호에서 “기술등”이라 한다)이 수입물품 및 국내생산물품에 함께 관련된 경우 : 당해 기술등이 제공되어 생산된 수입물품에 해당되는 기술등의 금액","R39-0":"제39조(종교ㆍ자선ㆍ장애인용품에 대한 관세의 부과) ①법 제91조제1호 단서에 따라 관세가 부과되는 물품은 다음 각 호와 같다. <개정 2007. 5. 29., 2011. 4. 1.>\n    1. 관세율표 번호 제8518호에 해당하는 물품\n    2. 관세율표 번호 제8531호에 해당하는 물품\n    3. 관세율표 번호 제8519호ㆍ제8521호ㆍ제8522호ㆍ제8523호 및 제92류에 해당하는 물품(파이프오르간은 제외한다)\n  ② 법 제91조제2호에 따라 관세를 면제받을 수 있는 자선ㆍ구호시설 또는 사회복지시설은 다음 각 호와 같다. <개정 2005. 2. 11., 2008. 12. 31., 2016. 12. 30.>\n    1. 삭제 <2016. 12. 30.>\n    2. 「국민기초생활 보장법」 제32조의 규정에 의한 시설\n    3. 「아동복지법」 제3조제10호에 따른 아동복지시설\n  ③법 제91조제2호 단서에 따라 관세가 부과되는 물품은 관세율표 번호 제8702호 및 제8703호에 해당하는 자동차와 번호 제8711호에 해당하는 이륜자동차로 한다. <개정 2011. 4. 1.>\n  ④법 제91조제4호의 규정에 의하여 관세가 면제되는 물품은 별표 2와 같다.\n  ⑤ 법 제91조제4호의2에서 “재정경제부령으로 정하는 의약품”이란 다음 각 호의 어느 하나에 해당하는 의약품을 말한다. <신설 2026. 3. 20.>\n    1. 「국민건강보험법 시행령」 별표 2 제3호나목2)에 따라 보건복지부장관이 정하여 고시하는 희귀난치성 질환(이하 이 항 및 제40조제5항에서 “희귀난치성질환”이라 한다)을 가진 사람이 자신의 희귀난치성질환을 치료하기 위해 「약사법」 제91조에 따른 한국희귀ㆍ필수의약품센터(이하 제40조제5항에서 “한국희귀ㆍ필수의약품센터”라 한다)에 구매를 신청한 의약품\n    2. 「의약품 등의 안전에 관한 규칙」 제57조제1항제1호의2의 의약품으로서 희귀난치성질환의 치료에 사용되는 의약품","L311-0":"제311조(통고처분) ① 관세청장이나 세관장은 관세범을 조사한 결과 범죄의 확증을 얻었을 때에는 대통령령으로 정하는 바에 따라 그 대상이 되는 자에게 그 이유를 구체적으로 밝히고 다음 각 호에 해당하는 금액이나 물품을 납부할 것을 통고할 수 있다. <개정 2015. 12. 15., 2018. 12. 31.>\n    1. 벌금에 상당하는 금액\n    2. 몰수에 해당하는 물품\n    3. 추징금에 해당하는 금액\n  ② 관세청장이나 세관장은 제1항에 따른 통고처분을 받는 자가 벌금이나 추징금에 상당한 금액을 예납(豫納)하려는 경우에는 이를 예납시킬 수 있다.\n  ③ 제1항에 따른 통고가 있는 때에는 공소의 시효는 정지된다.\n  ④ 제1항에 따른 벌금에 상당하는 금액의 부과기준은 대통령령으로 정한다.<신설 2015. 12. 15.>\n  ⑤ 제1항에 따라 통고처분을 받은 자는 납부하여야 할 금액을 대통령령으로 정하는 통고처분납부대행기관을 통하여 신용카드, 직불카드 등(이하 이 조에서 “신용카드등”이라 한다)으로 납부할 수 있다.<신설 2018. 12. 31.>\n  ⑥ 제5항에 따라 신용카드등으로 납부하는 경우에는 통고처분납부대행기관의 승인일을 납부일로 본다.<신설 2018. 12. 31.>\n  ⑦ 제5항 및 제6항에서 정한 사항 외에 통고처분납부대행기관의 지정 및 운영, 납부대행 수수료 등 통고처분에 따른 금액을 신용카드등으로 납부하는 경우에 필요한 세부사항은 대통령령으로 정한다.<신설 2018. 12. 31.>\n  ⑧ 관세청장이나 세관장은 통고처분 대상자의 연령과 환경, 법 위반의 동기와 결과, 범칙금 부담능력과 그 밖에 정상을 고려하여 제284조의2에 따른 관세범칙조사심의위원회의 심의ㆍ의결을 거쳐 제1항에 따른 통고처분을 면제할 수 있다. 이 경우 관세청장이나 세관장은 관세범칙조사심의위원회의 심의ㆍ의결 결과를 따라야 한다.<신설 2019. 12. 31.>\n  ⑨ 제8항에 따른 통고처분 면제는 다음 각 호의 요건을 모두 갖춘 관세범을 대상으로 한다.<신설 2019. 12. 31.>\n    1. 제1항제1호의 금액이 30만원 이하일 것\n    2. 제1항제2호의 물품의 가액과 같은 항 제3호의 금액을 합한 금액이 100만원 이하일 것\n  [전문개정 2010. 12. 30.]","R13-0":"제13조(덤핑방지관세부과를 위한 본조사의 종결 및 피해의 통산) 영 제61조제4항 및 영 제63조제3항제1호에서 “재정경제부령이 정하는 기준”이란 제12조제2항 각 호의 요건을 모두 갖추는 것을 말한다. <개정 2008. 12. 31., 2026. 1. 2.>","R79-3":"제79조의3(준수도 측정ㆍ평가 결과 활용) 영 제259조의6제2항제3호에서 “재정경제부령으로 정하는 사항”이란 다음 각 호의 사항을 말한다. <개정 2018. 3. 21., 2022. 3. 18., 2026. 1. 2.>\n    1. 보세구역의 지정 또는 특허\n    2. 보세구역의 관리ㆍ감독\n    3. 법 제222조제1항에 따른 보세운송업자등의 관리ㆍ감독\n    4. 「자유무역지역의 지정 및 운영에 관한 법률」에 따른 자유무역지역 입주기업체의 지원ㆍ관리\n    5. 과태료ㆍ과징금의 산정\n    6. 행정제재 처분의 감경\n  [본조신설 2016. 3. 9.]\n  [종전 제79조의3은 제79조의4로 이동 <2016. 3. 9.>]","L29-0":"제29조(가격조사 보고 등) ① 재정경제부장관 또는 관세청장은 과세가격을 결정하기 위하여 필요하다고 인정되는 경우에는 수출입업자, 경제단체 또는 그 밖의 관계인에게 과세가격 결정에 필요한 자료를 제출할 것을 요청할 수 있다. 이 경우 그 요청을 받은 자는 정당한 사유가 없으면 이에 따라야 한다. <개정 2025. 10. 1.>\n  ② 관세청장은 다음 각 호의 어느 하나에 해당하는 경우 국민 생활에 긴요한 물품으로서 국내물품과 비교 가능한 수입물품의 평균 신고가격이나 반입 수량에 관한 자료를 대통령령으로 정하는 바에 따라 집계하여 공표할 수 있다.\n    1. 원활한 물자수급을 위하여 특정물품의 수입을 촉진시킬 필요가 있는 경우\n    2. 수입물품의 국내가격을 안정시킬 필요가 있는 경우\n  [전문개정 2010. 12. 30.]","L118-4":"제118조의4(납세자보호위원회) ① 다음 각 호의 사항을 심의(제3호의 사항은 의결을 포함한다)하기 위하여 제118조의2제2항의 세관 및 관세청에 납세자보호위원회(이하 “납세자보호위원회”라 한다)를 둔다. <개정 2022. 12. 31.>\n    1. 납세자 권리보호에 관한 사항\n    2. 제118조제2항에 따른 과세전적부심사\n    3. 제122조제1항에 따른 심사청구\n    4. 제132조제1항에 따른 이의신청\n  ② 제1항에 따라 제118조의2제2항의 세관에 두는 납세자보호위원회(이하 “세관 납세자보호위원회”라 한다)는 다음 각 호의 사항을 심의한다.<개정 2022. 12. 31.>\n    1. 관세조사 범위의 확대\n    2. 관세조사 기간 연장에 대한 납세자의 관세조사 일시중지 또는 중지 요청\n    3. 위법ㆍ부당한 관세조사 및 관세조사 중 세관공무원의 위법ㆍ부당한 행위에 대한 납세자의 관세조사 일시중지 또는 중지 요청\n    4. 제114조의2제4항 단서에 따른 장부등의 일시 보관 기간 연장\n    5. 제118조제2항 본문에 따른 과세전적부심사\n    6. 제132조제1항에 따른 이의신청\n    7. 그 밖에 고충민원의 처리 등 납세자의 권리보호를 위하여 납세자보호담당관이 심의가 필요하다고 인정하는 안건\n  ③ 제1항에 따라 관세청에 두는 납세자보호위원회(이하 “관세청 납세자보호위원회”라 한다)는 다음 각 호의 사항을 심의(제3호의 사항은 의결을 포함한다)한다.<개정 2022. 12. 31.>\n    1. 제2항제1호부터 제3호까지의 사항에 대하여 세관 납세자보호위원회의 심의를 거친 해당 세관장의 결정에 대한 납세자의 취소 또는 변경 요청\n    2. 제118조제2항 단서에 따른 과세전적부심사\n    3. 제122조제1항에 따른 심사청구\n    4. 그 밖에 고충민원의 처리 또는 납세자 권리보호를 위한 관세행정의 제도 및 절차 개선 등으로서 납세자보호위원회의 위원장 또는 납세자보호관이 심의가 필요하다고 인정하는 사항\n  ④ 삭제<2022. 12. 31.>\n  ⑤ 납세자보호위원회의 위원장은 다음 각 호의 구분에 따른 사람이 된다.<개정 2025. 10. 1.>\n    1. 세관 납세자보호위원회: 공무원이 아닌 사람 중에서 해당 세관장의 추천을 받아 관세청장이 위촉하는 사람\n    2. 관세청 납세자보호위원회: 공무원이 아닌 사람 중에서 재정경제부장관의 추천을 받아 관세청장이 위촉하는 사람\n  ⑥ 납세자보호위원회의 위원은 관세ㆍ법률ㆍ재정 분야에 전문적인 학식과 경험이 풍부한 사람과 관계 공무원 중에서 관세청장(세관 납세자보호위원회의 위원은 해당 세관장)이 임명 또는 위촉한다.\n  ⑦ 납세자보호위원회의 위원은 업무 중 알게 된 과세정보를 타인에게 제공 또는 누설하거나 목적 외의 용도로 사용해서는 아니 된다.\n  ⑧ 납세자보호위원회의 위원은 공정한 심의를 기대하기 어려운 사정이 있다고 인정될 때에는 대통령령으로 정하는 바에 따라 위원회 회의에서 제척되거나 회피하여야 한다.\n  ⑨ 제2항제5호ㆍ제6호 및 제3항제2호ㆍ제3호의 사항을 심의하거나 심의ㆍ의결하기 위하여 세관 납세자보호위원회 및 관세청 납세자보호위원회에 각각 분과위원회로 관세심사위원회(이하 “관세심사위원회”라 한다)를 둔다. 이 경우 관세심사위원회의 심의 또는 심의ㆍ의결은 납세자보호위원회의 심의 또는 심의ㆍ의결로 본다.<신설 2022. 12. 31.>\n  ⑩ 납세자보호위원회의 구성 및 운영 등에 필요한 사항은 대통령령으로 정한다.<개정 2022. 12
