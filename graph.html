세관장이 정하는 기간을 말한다) 이내에 재수출되는 것에 대해서는 다음 각 호의 구분에 따라 그 관세를 경감할 수 있다. 다만, 외국과 체결한 조약ㆍ협정 등에 따라 수입되는 것에 대해서는 상호 조건에 따라 그 관세를 면제한다. <개정 2020. 12. 22., 2025. 10. 1.>\n    1. 재수출기간이 6개월 이내인 경우: 해당 물품에 대한 관세액의 100분의 85\n    2. 재수출기간이 6개월 초과 1년 이내인 경우: 해당 물품에 대한 관세액의 100분의 70\n    3. 재수출기간이 1년 초과 2년 이내인 경우: 해당 물품에 대한 관세액의 100분의 55\n    4. 재수출기간이 2년 초과 3년 이내인 경우: 해당 물품에 대한 관세액의 100분의 40\n    5. 재수출기간이 3년 초과 4년 이내인 경우: 해당 물품에 대한 관세액의 100분의 30\n  ② 제1항에 따라 관세를 감면한 물품에 대하여는 제97조제2항부터 제4항까지의 규정을 준용한다.\n  [전문개정 2010. 12. 30.]\n  [제목개정 2020. 12. 22.]","R80-0":"제80조(자료를 갖춰 두어야 하는 영업장) 법 제266조제2항에서 “재정경제부령으로 정하는 기준에 해당하는 자”란 다음 각 호의 어느 하나에 해당하는 상설영업장을 갖추고 외국에서 생산된 물품을 판매하는 자를 말한다. <개정 2005. 2. 11., 2008. 12. 31., 2011. 4. 1., 2026. 1. 2.>\n    1. 백화점\n    2. 최근 1년간 수입물품의 매출액이 5억원 이상인 수입물품만을 취급하거나 수입물품을 할인판매하는 상설영업장\n    3. 통신판매하는 자로서 최근 1년간 수입물품의 매출액이 10억원 이상인 상설영업장\n    4. 관세청장이 정하는 물품을 판매하는 자로서 최근 1년간 수입물품의 매출액이 전체 매출액의 30퍼센트를 초과하는 상설영업장\n    5. 상설영업장의 판매자 또는 그 대리인이 최근 3년 이내에 「관세법」 또는 「관세사법」위반으로 처벌받은 사실이 있는 경우 그 상설영업장\n  [제목개정 2011. 4. 1.]","R2-0":"제2조(가격신고의 생략) ①법 제27조제3항의 규정에 따라 가격신고를 생략할 수 있는 물품은 다음 각 호와 같다. <개정 2005. 2. 11., 2007. 12. 31., 2020. 10. 7.>\n    1. 정부 또는 지방자치단체가 수입하는 물품\n    2. 정부조달물품\n    3. 「공공기관의 운영에 관한 법률」 제4조에 따른 공공기관이 수입하는 물품\n    4. 관세 및 내국세등이 부과되지 않는 물품\n    5. 방위산업용 기계와 그 부분품 및 원재료로 수입하는 물품. 다만, 해당 물품과 관련된 중앙행정기관의 장의 수입확인 또는 수입추천을 받은 물품에 한정한다.\n    6. 수출용 원재료\n    7. 「특정연구기관 육성법」의 규정에 의한 특정연구기관이 수입하는 물품\n    8. 과세가격이 미화 1만불 이하인 물품.  다만, 개별소비세, 주세, 교통ㆍ에너지ㆍ환경세가 부과되는 물품과 분할하여 수입되는 물품은 제외한다.\n    9. 종량세 적용물품. 다만, 종량세와 종가세 중 높은 세액 또는 높은 세율을 선택하여 적용해야 하는 물품의 경우에는 제외한다.\n    10. 법 제37조제1항제3호에 따른 과세가격 결정방법의 사전심사 결과가 통보된 물품. 다만, 「관세법 시행령」(이하 “영”이라 한다) 제16조제1항 각 호의 물품은 제외한다.\n  ②다음 각 호의 어느 하나에 해당하는 물품은 제1항(제10호는 제외한다)에 따른 가격신고 생략물품에 해당하지 않는 것으로 한다. <개정 2005. 2. 11., 2020. 10. 7.>\n    1. 과세가격을 결정함에 있어서 법 제30조제1항제1호 내지 제5호의 규정에 의한 금액을 가산하여야 하는 물품\n    1의2. 법 제30조제2항에 따른 구매자가 실제로 지급하였거나 지급하여야 할 가격에 구매자가 해당 수입물품의 대가와 판매자의 채무를 상계(相計)하는 금액, 구매자가 판매자의 채무를 변제하는 금액, 그 밖의 간접적인 지급액이 포함되어 있는 경우에 해당하는 물품\n    1의3. 과세가격이 법 제31조부터 제35조까지에 따라 결정되는 경우에 해당하는 물품\n    2. 법 제39조에 따라 세관장이 관세를 부과ㆍ징수하는 물품\n    3. 영 제16조제1항 각 호의 물품\n    4. 제8조제1항제3호부터 제5호까지의 물품","D144-0":"제144조(관세심사위원회의 심사를 생략할 수 있는 사유) 법 제118조제3항 단서에서 “과세전적부심사 청구기간이 지난 후 과세전적부심사청구가 제기된 경우 등 대통령령으로 정하는 사유”란 다음 각 호의 어느 하나에 해당하는 사유를 말한다. <개정 2020. 2. 11., 2023. 2. 28.>\n    1. 과세전적부심사 청구기간이 지난 후 과세전적부심사청구가 제기된 경우\n    2. 법 제118조제1항 각 호 외의 부분 본문에 따른 통지가 없는 경우\n    3. 법 제118조제1항 각 호 외의 부분 본문에 따른 통지가 청구인에게 한 것이 아닌 경우\n    4. 법 제118조제6항에 따라 준용되는 법 제123조제1항 본문에 따른 보정기간 내에 보정을 하지 아니한 경우\n    5. 과세전적부심사청구의 대상이 되는 통지의 내용이나 쟁점 등이 이미 법 제118조의4제9항 전단에 따른 관세심사위원회(이하 “관세심사위원회”라 한다)의 심의를 거쳐 결정된 사항과 동일한 경우\n  [본조신설 2016. 2. 5.]","D16-2":"제16조의2(수입신고가격 등의 공표) ① 관세청장은 법 제29조제2항에 따라 수입물품의 평균 신고가격이나 반입 수량에 관한 자료의 집계결과를 공표할 때에는 관세청의 인터넷 홈페이지를 통하여 공표하여야 한다. 이 경우 공표대상 수입물품의 선정기준 및 수입물품의 평균 신고가격이나 반입 수량에 관한 자료의 집계방법 등을 함께 공표하여야 한다.\n  ② 관세청장은 다음 각 호의 어느 하나에 해당하는 사항은 공표하여서는 아니 된다.\n    1. 수입물품의 상표 및 상호\n    2. 수입자의 영업상 비밀에 관한 사항\n    3. 그 밖에 공개될 경우 수입자의 정당한 이익을 현저히 침해할 우려가 있는 사항\n  ③ 법 제29조제2항에 따른 국내물품과 비교 가능한 수입물품은 다음 각 호의 요건을 모두 충족하는 것으로 한다. <개정 2023. 2. 28.>\n    1. 제98조에 따른 관세ㆍ통계통합품목분류표상 품목번호(이하 이 호에서 “품목번호”라 한다)에 해당할 것. 다만, 품목번호에 해당하는 품목의 가격 공표만으로 법 제29조제2항 각 호에 해당하는 목적을 달성하기 어렵다고 인정되는 경우로서 관세청장이 수입물품의 용도ㆍ특성 등을 고려하여 품목번호보다 세분화된 수입물품의 번호를 정하는 경우에는 그 세분화된 번호에 해당할 것\n    2. 해당 수입물품의 수입자가 2인 이상일 것\n  [본조신설 2011. 4. 1.]","D213-3":"제213조의3(시내보세판매장의 현장인도 방법 등) ① 법 제196조의2제1항에 따른 시내보세판매장(이하 “시내보세판매장”이라 한다)에서 외국인에게 내국물품을 판매 현장에서 인도하려는 경우 시내보세판매장 운영인은 구매자의 여권과 항공권 등 출국에 관한 예약내용을 확인할 수 있는 자료를 확인해야 한다.\n  ② 법 제196조의2제2항 전단에서 “물품 구매자의 출입국 관리기록 등대통령령으로 정하는 정보 또는 자료”란 다음 각 호의 어느 하나에 해당하는 것을 말한다.\n    1. 물품을 구매한 외국인의 출입국관리기록\n    2. 그 밖에 시내보세판매장에서 현장 인도된 물품의 외국 반출 여부를 확인하기 위하여 관세청장이 필요하다고 인정하는 정보 또는 자료\n  ③ 법 제196조의2제3항에서 “대통령령으로 정하는 사람”이란 다음 각 호를 고려하여 관세청장이 정하는 사람을 말한다.\n    1. 시내보세판매장에서의 구매내역\n    2. 항공권 등의 예약 및 취소 내역\n    3. 그 밖에 현장 인도 제한 사유로 관세청장이 필요하다고 인정하는 사유\n  ④ 제1항부터 제3항까지에서 규정한 사항 외에 시내보세판매장의 현장인도 방법 및 그 밖에 필요한 사항은 관세청장이 정한다.\n  [본조신설 2020. 2. 11.]","L165-0":"제165조(보세사의 자격 등) ① 제175조제2호부터 제7호까지의 어느 하나에 해당하지 아니하는 사람으로서 보세화물의 관리업무에 관한 시험(이하 이 조에서 “보세사 시험”이라 한다)에 합격한 사람은 보세사의 자격이 있다. <개정 2013. 1. 1., 2014. 1. 1., 2019. 12. 31., 2023. 12. 31.>\n    1. 삭제<2019. 12. 31.>\n    2. 삭제<2019. 12. 31.>\n  ② 제1항에도 불구하고 일반직공무원으로 5년 이상 관세행정에 종사한 경력이 있는 사람이 제1항의 보세사 시험에 응시하는 경우에는 시험 과목 수의 2분의 1을 넘지 아니하는 범위에서 대통령령으로 정하는 과목을 면제한다. 다만, 다음 각 호의 어느 하나에 해당하는 사람은 면제하지 아니한다.<신설 2019. 12. 31.>\n    1. 탄핵이나 징계처분에 따라 그 직에서 파면되거나 해임된 자\n    2. 강등 또는 정직처분을 받은 후 2년이 지나지 아니한 자\n  ③ 제1항의 자격을 갖춘 사람이 보세사로 근무하려면 해당 보세구역을 관할하는 세관장에게 등록하여야 한다.<개정 2019. 12. 31.>\n  ④ 다음 각 호의 어느 하나에 해당하는 사람은 제3항에 따른 등록을 할 수 없다.<개정 2023. 12. 31.>\n    1. 제5항에 따라 등록이 취소(제175조제1호부터 제3호까지의 어느 하나에 해당하여 등록이 취소된 경우는 제외한다)된 후 2년이 지나지 아니한 사람\n    2. 등록 신청일을 기준으로 제175조제1호에 해당하는 사람\n  ⑤ 세관장은 제3항에 따른 등록을 한 사람이 다음 각 호의 어느 하나에 해당하는 경우에는 등록의 취소, 6개월 이내의 업무정지, 견책 또는 그 밖에 필요한 조치를 할 수 있다. 다만, 제1호 및 제2호에 해당하면 등록을 취소하여야 한다.<개정 2017. 12. 19., 2018. 12. 31., 2019. 12. 31.>\n    1. 제175조제1호부터 제7호까지의 어느 하나에 해당하게 된 경우\n    2. 사망한 경우\n    3. 이 법이나 이 법에 따른 명령을 위반한 경우\n  ⑥ 제5항에 따른 행정처분이나 조치의 세부기준은 재정경제부령으로 정한다.<신설 2024. 12. 31., 2025. 10. 1.>\n  ⑦ 관세청장은 다음 각 호의 어느 하나에 해당하는 사람에 대하여는 해당 시험을 정지시키거나 무효로 하고, 그 처분이 있는 날부터 5년간 시험 응시자격을 정지한다.<신설 2015. 12. 15., 2017. 12. 19., 2019. 12. 31., 2024. 12. 31.>\n    1. 부정한 방법으로 시험에 응시한 사람\n    2. 시험에서 부정한 행위를 한 사람\n  ⑧ 보세사의 직무, 보세사 시험 및 등록절차와 그 밖에 필요한 사항은 대통령령으로 정한다.<개정 2014. 1. 1., 2015. 12. 15., 2017. 12. 19., 2019. 12. 31., 2024. 12. 31.>\n  [전문개정 2010. 12. 30.]","D135-3":"제135조의3(장기 미조사자에 대한 관세조사 기준) 법 제110조의3제1항제2호에 따라 실시하는 조사는 수출입업자 등의 업종, 규모, 이력 등을 고려하여 관세청장이 정하는 기준에 따른다.\n  [본조신설 2012. 2. 2.]","L220-2":"제220조의2(국제항 안에서 국제무역선을 이용한 보세운송의 특례) 제214조에도 불구하고 국제무역선이 소속된 선박회사(그 업무를 대행하는 자를 포함한다)로서 재정경제부령으로 정하는 선박회사는 국제항 안에서 제213조제1항에 따라 환적물품 등 재정경제부령으로 정하는 물품을 국제무역선으로 보세운송할 수 있다. <개정 2025. 10. 1.>\n  [본조신설 2023. 12. 31.]","R71-0":"제71조(수입통관 후 소비 또는 사용하는 물품) 법 제200조제1항의 규정에 의하여 수입통관후 소비 또는 사용하여야 하는 물품은 다음 각호의 것으로 한다.\n    1. 제조ㆍ가공에 사용되는 시설기계류 및 그 수리용 물품\n    2. 연료ㆍ윤활유ㆍ사무용품 등 제조ㆍ가공에 직접적으로 사용되지 아니하는 물품","R58-2":"제58조의2(수입한 상태 그대로 수출되는 자가사용물품에 대한 관세 환급) 법 제106조의2제1항제3호에서 “재정경제부령으로 정하는 금액 이하인 물품”이란 영 제246조제3항제1호에 따른 수출신고가격이 200만원 이하인 물품을 말한다. <개정 2026. 1. 2.>\n  [본조신설 2022. 3. 18.]","D192-2":"제192조의2(보세판매장의 특허 비율 등) ① 법 제176조의2제1항에 따라 세관장은 「중소기업기본법」 제2조에 따른 중소기업으로서 다음 각 호의 기준을 모두 갖춘 기업(이하 “특허보세구역 특례 적용 대상 중소기업”이라 한다) 및 「중견기업 성장촉진 및 경쟁력 강화에 관한 특별법」 제2조제1호에 따른 중견기업으로서 다음 각 호의 기준을 모두 갖춘 기업(이하 “특허보세구역 특례 적용 대상 중견기업”이라 한다) 중 법 제174조제3항에 따른 특허를 받을 수 있는 요건을 갖춘 기업에 보세판매장 총 특허 수의 100분의 30 이상(2017년 12월 31일까지는 보세판매장 총 특허 수의 100분의 20 이상)의 특허를 부여해야 한다. <개정 2014. 3. 5., 2014. 7. 21., 2019. 9. 24., 2021. 2. 17., 2025. 2. 28.>\n    1. 제192조의5제1항에 따른 공고일 직전 3개 사업연도의 매출액(기업회계기준에 따라 작성한 손익계산서상의 매출액으로서, 창업ㆍ분할ㆍ합병의 경우 그 등기일의 다음 날 또는 창업일이 속하는 사업연도의 매출액을 연간 매출액으로 환산한 금액을 말하며, 사업연도가 1년 미만인 사업연도의 매출액은 1년으로 환산한 매출액을 말한다)의 평균금액이 5천억원 미만인 기업일 것\n    2. 자산총액(제192조의5제1항에 따른 공고일 직전 사업연도 말일 현재 재무상태표상의 자산총액을 말한다. 이하 이 항에서 같다)이 1조원 미만인 기업일 것\n    3. 자산총액이 1조원 이상인 법인(외국법인을 포함한다)이 주식 또는 출자지분의 100분의 30 이상을 직접적 또는 간접적으로 소유하고 있는 기업이나 자산총액이 1조원 이상인 법인(외국법인을 포함한다)과 지배 또는 종속의 관계에 있는 기업이 아닐 것. 이 경우 주식 또는 출자지분의 간접소유 비율에 관하여는 「국제조세조정에 관한 법률 시행령」 제2조제3항을 준용하고, 지배 또는 종속의 관계에 관하여는 「중소기업제품 구매촉진 및 판로지원에 관한 법률 시행령」 제9조의3을 준용한다.\n  ② 법 제176조의2제1항에 따라 세관장은 「독점규제 및 공정거래에 관한 법률」 제31조제1항에 따른 상호출자제한기업집단에 속한 기업에 대하여 보세판매장 총 특허 수의 100분의 60 이상의 특허를 부여할 수 없다. <개정 2021. 12. 28.>\n  ③ 제1항과 제2항에 따른 특허 비율에 적합한지를 판단하는 시점은 보세판매장의 설치ㆍ운영에 관한 특허를 부여할 때를 기준으로 한다.\n  ④ 세관장이 제3항에 따라 특허 비율에 적합한지를 판단할 때에 제192조의5제1항에 따른 공고일 이후 기존 특허의 반납 등 예상하지 못한 사유로 특허 비율이 변경된 경우 그 변경된 특허 비율은 적용하지 아니한다.\n  ⑤ 법 제176조의2제2항에서 “기존 특허가 만료되었으나 제3항에 따른 신규 특허의 신청이 없는 등 대통령령으로 정하는 경우”란 기존 특허의 기간 만료, 취소 및 반납 등으로 인하여 보세판매장의 설치ㆍ운영에 관한 특허를 부여하는 경우로서 다음 각 호의 모두에 해당하는 경우를 말한다. <개정 2014. 3. 5., 2025. 2. 28.>\n    1. 특허보세구역 특례 적용 대상 중소기업 또는 특허보세구역 특례 적용 대상 중견기업 외의 자에게 특허를 부여할 경우 제1항 또는 제2항에 따른 특허 비율 요건을 충족하지 못하게 되는 경우\n    2. 제192조의3제1항에 따른 특허의 신청자격 요건을 갖춘 특허보세구역 특례 적용 대상 중소기업 또는 특허보세구역 특례 적용 대상 중견기업이 없는 경우\n  [본조신설 2013. 11. 5.]","L37-2":"제37조의2(관세의 과세가격 결정방법과 국세의 정상가격 산출방법의 사전조정) ① 제37조제1항제3호에 관하여 의문이 있어 같은 항에 따른 사전심사를 신청하는 자는 관세의 과세가격과 국세의 정상가격을 사전에 조정(이하 이 조에서 “사전조정”이라 한다)받기 위하여 「국제조세조정에 관한 법률」 제14조제1항에 따른 정상가격 산출방법의 사전승인 (같은 조 제2항 단서에 따른 일방적 사전승인의 대상인 경우에 한정한다)을 관세청장에게 동시에 신청할 수 있다.\n  <개정 2017. 12. 19., 2020. 12. 22.>\n  ② 관세청장은 제1항에 따른 신청을 받은 경우에는 국세청장에게 정상가격 산출방법의 사전승인 신청서류를 첨부하여 신청을 받은 사실을 통보하고, 국세청장과 과세가격 결정방법, 정상가격 산출방법 및 사전조정 가격의 범위에 대하여 대통령령으로 정하는 바에 따라 협의하여야 한다.<개정 2017. 12. 19.>\n  ③ 관세청장은 제2항에 따른 협의가 이루어진 경우에는 사전조정을 하여야 한다.<개정 2017. 12. 19.>\n  ④ 관세청장은 제1항에 따른 신청의 처리결과를 사전조정을 신청한 자와 재정경제부장관에게 통보하여야 한다.<개정 2017. 12. 19., 2025. 10. 1.>\n  ⑤ 제1항부터 제4항까지의 규정에 따른 사전조정 신청 방법 및 절차 등에 관하여 필요한 사항은 대통령령으로 정한다.\n  [본조신설 2014. 12. 23.]\n  [종전 제37조의2는 제37조의3으로 이동 <2014. 12. 23.>]","L165-5":"제165조의5(보세사징계위원회) ① 세관장은 보세사가 제165조제5항제3호에 해당하여 등록의 취소 등 필요한 조치를 하는 경우 보세사징계위원회의 의결에 따라 징계처분을 한다. <개정 2019. 12. 31.>\n  ② 제1항에 따른 보세사징계위원회의 구성 및 운영 등에 필요한 사항은 대통령령으로 정한다.\n  [본조신설 2018. 12. 31.]\n  [제165조의3에서 이동 <2020. 12. 22.>]","D71-3":"제71조의3(우회덤핑 직권조사 사유) 법 제56조의2제1항제2호에서 “대통령령으로 정하는 경우”란 무역위원회가 경미한 변경행위등을 통해 해당 덤핑방지관세의 부과를 회피(이하 “우회덤핑”이라 한다)하려는 사실에 관한 충분한 증거를 확보하는 등 직권으로 조사를 개시할 수 있는 특별한 상황이 인정되는 경우를 말한다. <개정 2025. 11. 28.>\n  [본조신설 2024. 2. 29.]","L241-0":"제241조(수출ㆍ수입 또는 반송의 신고) ① 물품을 수출ㆍ수입 또는 반송하려면 해당 물품의 품명ㆍ규격ㆍ수량 및 가격과 그 밖에 대통령령으로 정하는 사항을 세관장에게 신고하여야 한다.\n  ② 다음 각 호의 어느 하나에 해당하는 물품은 대통령령으로 정하는 바에 따라 제1항에 따른 신고를 생략하게 하거나 관세청장이 정하는 간소한 방법으로 신고하게 할 수 있다.<개정 2014. 12. 23., 2018. 12. 31.>\n    1. 휴대품ㆍ탁송품 또는 별송품\n    2. 우편물\n    3. 제91조부터 제94조까지, 제96조제1항 및 제97조제1항에 따라 관세가 면제되는 물품\n    3의2. 제135조, 제136조, 제149조 및 제150조에 따른 보고 또는 허가의 대상이 되는 운송수단. 다만, 다음 각 목의 어느 하나에 해당하는 운송수단은 제외한다.\n      가. 우리나라에 수입할 목적으로 최초로 반입되는 운송수단\n      나. 해외에서 수리하거나 부품 등을 교체한 우리나라의 운송수단\n      다. 해외로 수출 또는 반송하는 운송수단\n    4. 국제운송을 위한 컨테이너(별표 관세율표 중 기본세율이 무세인 것으로 한정한다)\n  ③ 수입하거나 반송하려는 물품을 지정장치장 또는 보세창고에 반입하거나 보세구역이 아닌 장소에 장치한 자는 그 반입일 또는 장치일부터 30일 이내(제243조제1항에 해당하는 물품은 관세청장이 정하는 바에 따라 반송신고를 할 수 있는 날부터 30일 이내)에 제1항에 따른 신고를 하여야 한다.\n  ④ 세관장은 대통령령으로 정하는 물품을 수입하거나 반송하는 자가 제3항에 따른 기간 내에 수입 또는 반송의 신고를 하지 아니한 경우에는 해당 물품 과세가격의 100분의 2에 상당하는 금액의 범위에서 대통령령으로 정하는 금액을 가산세로 징수한다.\n  ⑤ 세관장은 다음 각 호의 어느 하나에 해당하는 경우에는 해당 물품에 대하여 납부할 세액(관세 및 내국세를 포함한다)의 100분의 20(제1호의 경우에는 100분의 40으로 하되, 반복적으로 자진신고를 하지 아니하는 경우 등 대통령령으로 정하는 사유에 해당하는 경우에는 100분의 60)에 상당하는 금액을 가산세로 징수한다.<개정 2014. 12. 23.>\n    1. 여행자나 승무원이 제2항제1호에 해당하는 휴대품(제96조제1항제1호 및 제3호에 해당하는 물품은 제외한다)을 신고하지 아니하여 과세하는 경우\n    2. 우리나라로 거주를 이전하기 위하여 입국하는 자가 입국할 때에 수입하는 이사물품(제96조제1항제2호에 해당하는 물품은 제외한다)을 신고하지 아니하여 과세하는 경우\n  ⑥ 제3항에도 불구하고 전기ㆍ유류 등 대통령령으로 정하는 물품을 그 물품의 특성으로 인하여 전선이나 배관 등 대통령령으로 정하는 시설 또는 장치 등을 이용하여 수출ㆍ수입 또는 반송하는 자는 1개월을 단위로 하여 해당 물품에 대한 제1항의 사항을 대통령령으로 정하는 바에 따라 다음 달 10일까지 신고하여야 한다. 이 경우 기간 내에 수출ㆍ수입 또는 반송의 신고를 하지 아니하는 경우의 가산세 징수에 관하여는 제4항을 준용한다.\n  [전문개정 2010. 12. 30.]","D15-0":"제15조(가격신고) ①법 제27조제1항 본문에 따른 가격신고를 하려는 자는 다음 각 호의 사항을 적은 서류를 세관장에게 제출하여야 한다. <개정 2008. 2. 22.>\n    1. 수입관련거래에 관한 사항\n    2. 과세가격산출내용에 관한 사항\n  ② 세관장은 다음 각 호의 어느 하나에 해당하는 경우로서 관세청장이 정하여 고시하는 경우에는 제1항 각 호에 해당하는 서류의 전부 또는 일부를 제출하지 아니하게 할 수 있다. <신설 2008. 2. 22., 2025. 2. 28.>\n    1. 같은 판매자와 구매자가 같은 조건으로 물품을 반복적으로 수입하는 경우\n    2. 수입항까지의 운임 및 보험료 외에 우리나라에 수출하기 위하여 판매되는 물품에 대하여 구매자가 실제로 지급하였거나 지급하여야 할 가격에 가산할 금액이 없는 경우\n    3. 그 밖에 과세가격결정에 곤란이 없다고 인정하여 관세청장이 정하는 경우\n  ③ 세관장은 가격신고를 하려는 자가 제2항제1호에 해당하는 경우에는 법 제27조제1항 본문에 따른 가격신고를 관세청장이 정하여 고시하는 바에 따라 일정기간 일괄하여 신고하게 할 수 있다. <신설 2008. 2. 22., 2025. 2. 28.>\n  ④법 제27조제1항 단서의 규정에 의하여 물품의 수입신고일 이전에 가격신고를 하고자 하는 자는 그 사유와 제1항 각호의 사항을 기재한 신고서를 세관장에게 제출하여야 한다. <개정 2008. 2. 22.>\n  ⑤법 제27조제2항의 규정에 의하여 가격신고를 할 때에 제출하여야 하는 과세자료는 다음 각호와 같다. 다만, 당해 물품의 거래의 내용, 과세가격결정방법 등에 비추어 과세가격결정에 곤란이 없다고 세관장이 인정하는 경우에는 자료의 일부를 제출하지 아니할 수 있다. <개정 2008. 2. 22., 2025. 2. 28.>\n    1. 송품장\n    2. 수입물품 구매계약서\n    3. 다음 각 목의 자료\n      가. 법 제30조제1항 각 호의 금액에 관한 계약서\n      나. 법 제30조제2항 각 호 외의 부분 본문에 따른 다음의 금액에 관한 계약서\n  1) 구매자가 해당 수입물품의 대가와 판매자의 채무를 상계(相計)하는 금액\n  2) 구매자가 판매자의 채무를 변제하는 금액\n  3) 그 밖의 간접적인 지급액\n      다. 법 제30조제2항 각 호의 금액에 관한 계약서(같은 항 제3호의 경우에는 납부고지서나 그 밖의 증빙자료를 말한다)\n      라. 각종 비용의 금액 및 산출근거를 나타내는 증빙자료\n    4. 구매자와 판매자 간에 제23조제1항에 따른 특수관계가 있는 경우 제31조의5제1항제3호에 따른 수입물품 가격산출 내역 등 내부가격 결정자료\n    5. 기타 가격신고의 내용을 입증하는 데에 필요한 자료","R8-2":"제8조의2(신용카드 등에 의한 관세납부) ① 영 제32조의5제2항에서 “재정경제부령으로 정하는 바에 따라 관세납부를 대행하는 기관”(이하 “관세납부대행기관”이라 한다)이란 다음 각 호의 어느 하나에 해당하는 자를 말한다. <개정 2011. 4. 1., 2019. 3. 20., 2026. 1. 2.>\n    1. 「민법」제32조 및 「금융위원회 소관 비영리법인의 설립 및 감독에 관한 규칙」에 따라 설립된 금융결제원\n    2. 시설, 업무수행능력, 자본금 규모 등을 고려하여 관세청장이 관세납부대행기관으로 지정하는 자\n  ② 영 제32조의5제3항에 따른 납부대행수수료는 관세청장이 관세납부대행기관의 운영경비 등을 종합적으로 고려하여 승인하되, 해당 납부세액의 1천분의 10을 초과할 수 없다. <개정 2012. 2. 28.>\n  [본조신설 2009. 3. 26.]","D22-0":"제22조(거래가격에 영향을 미치지 아니하는 제한 등) ①법 제30조제3항제1호 단서에서 “거래가격에 실질적으로 영향을 미치지 아니한다고 인정하는 제한이 있는 경우 등 대통령령으로 정하는 경우”란 다음 각 호의 어느 하나에 해당하는 제한이 있는 경우를 말한다. <개정 2011. 4. 1., 2015. 2. 6., 2020. 10. 7.>\n    1. 우리나라의 법령이나 법령에 의한 처분에 의하여 부과되거나 요구되는 제한\n    2. 수입물품이 판매될 수 있는 지역의 제한\n    3. 그 밖에 해당 수입물품의 특성, 해당 산업부문의 관행 등을 고려하여 통상적으로 허용되는 제한으로서 수입가격에 실질적으로 영향을 미치지 않는다고 세관장이 인정하는 제한\n  ②법 제30조제3항제2호의 규정에 의하여 금액으로 계산할 수 없는 조건 또는 사정에 의하여 영향을 받은 경우에는 다음 각호의 경우가 포함되는 것으로 한다.\n    1. 구매자가 판매자로부터 특정수량의 다른 물품을 구매하는 조건으로 당해 물품의 가격이 결정되는 경우\n    2. 구매자가 판매자에게 판매하는 다른 물품의 가격에 따라 당해 물품의 가격이 결정되는 경우\n    3. 판매자가 반제품을 구매자에게 공급하고 그 대가로 그 완제품의 일정수량을 받는 조건으로 당해 물품의 가격이 결정되는 경우","D29-0":"제29조(합리적 기준에 따른 과세가격의 결정) ①법 제35조에 따라 과세가격을 결정할 때에는 국내에서 이용 가능한 자료를 기초로 다음 각 호의 방법을 적용한다. 이 경우 적용순서는 법 제30조부터 제34조까지의 규정을 따른다. <개정 2013. 2. 15., 2020. 10. 7.>\n    1. 법 제31조 또는 법 제32조의 규정을 적용함에 있어서 법 제31조제1항제1호의 요건을 신축적으로 해석ㆍ적용하는 방법\n    2. 법 제33조의 규정을 적용함에 있어서 수입된 것과 동일한 상태로 판매되어야 한다는 요건을 신축적으로 해석ㆍ적용하는 방법\n    3. 법 제33조 또는 법 제34조의 규정에 의하여 과세가격으로 인정된 바 있는 동종ㆍ동질물품 또는 유사물품의 과세가격을 기초로 과세가격을 결정하는 방법\n    4. 제27조제3항 단서를 적용하지 않는 방법\n    5. 그 밖에 거래의 실질 및 관행에 비추어 합리적이라고 인정되는 방법\n  ②법 제35조의 규정에 의하여 과세가격을 결정함에 있어서는 다음 각호의 1에 해당하는 가격을 기준으로 하여서는 아니된다.\n    1. 우리나라에서 생산된 물품의 국내판매가격\n    2. 선택가능한 가격중 반드시 높은 가격을 과세가격으로 하여야 한다는 기준에 따라 결정하는 가격\n    3. 수출국의 국내판매가격\n    4. 동종ㆍ동질물품 또는 유사물품에 대하여 법 제34조의 규정에 의한 방법외의 방법으로 생산비용을 기초로 하여 결정된 가격\n    5. 우리나라외의 국가에 수출하는 물품의 가격\n    6. 특정수입물품에 대하여 미리 설정하여 둔 최저과세기준가격\n    7. 자의적 또는 가공적인 가격\n  ③제1항제1호부터 제4호까지의 규정에 따른 방법을 적용하기 곤란하거나 적용할 수 없는 경우로서 다음 각 호의 어느 하나에 해당하는 물품에 대한 과세가격 결정에 필요한 기초자료, 금액의 계산방법 등 세부사항은 재정경제부령으로 정할 수 있다. <개정 2020. 2. 11., 2020. 10. 7., 2025. 12. 30.>\n    1. 수입신고전에 변질ㆍ손상된 물품\n    2. 여행자 또는 승무원의 휴대품ㆍ우편물ㆍ탁송품 및 별송품\n    3. 임차수입물품\n    4. 중고물품\n    5. 법 제188조 단서의 규정에 의하여 외국물품으로 보는 물품\n    6. 범칙물품\n    7. 「석유 및 석유대체연료 사업법」 제2조제1호의 석유로서 국제거래시세를 조정한 가격으로 보세구역에서 거래되는 물품\n    8. 그 밖에 과세가격결정에 혼란이 발생할 우려가 있는 물품으로서 재정경제부령으로 정하는 물품\n  [제목개정 2020. 10. 7.]","R7-2":"제7조의2(수입신고 전 변질 또는 손상물품의 과세가격의 결정) 영 제29조제3항제1호에 해당하는 물품의 과세가격은 다음 각 호의 가격을 기초로 하여 결정할 수 있다.\n    1. 변질 또는 손상으로 인해 구매자와 판매자간에 다시 결정된 가격\n    2. 변질 또는 손상되지 않은 물품의 가격에서 다음 각 목 중 어느 하나의 금액을 공제한 가격\n      가. 관련 법령에 따른 감정기관의 손해평가액\n      나. 수리 또는 개체(改替)비용\n      다. 보험회사의 손해보상액\n  [본조신설 2020. 10. 7.]","L226-0":"제226조(허가ㆍ승인 등의 증명 및 확인) ① 수출입을 할 때 법령에서 정하는 바에 따라 허가ㆍ승인ㆍ표시 또는 그 밖의 조건을 갖출 필요가 있는 물품은 세관장에게 그 허가ㆍ승인ㆍ표시 또는 그 밖의 조건을 갖춘 것임을 증명하여야 한다.\n  ② 통관을 할 때 제1항의 구비조건에 대한 세관장의 확인이 필요한 수출입물품에 대하여는 다른 법령에도 불구하고 그 물품과 확인방법, 확인절차, 그 밖에 필요한 사항을 대통령령으로 정하는 바에 따라 미리 공고하여야 한다.\n  ③ 제1항에 따른 증명에 관하여는 제245조제2항을 준용한다.\n  [전문개정 2010. 12. 30.]","L253-0":"제253조(수입신고전의 물품 반출) ① 수입하려는 물품을 수입신고 전에 운송수단, 관세통로, 하역통로 또는 이 법에 따른 장치 장소로부터 즉시 반출하려는 자는 대통령령으로 정하는 바에 따라 세관장에게 즉시반출신고를 하여야 한다. 이 경우 세관장은 납부하여야 하는 관세에 상당하는 담보를 제공하게 할 수 있다.\n  ② 제1항에 따른 즉시반출을 할 수 있는 자 또는 물품은 대통령령으로 정하는 바에 따라 세관장이 지정한다.\n  ③ 제1항에 따른 즉시반출신고를 하고 반출을 하는 자는 즉시반출신고를 한 날부터 10일 이내에 제241조에 따른 수입신고를 하여야 한다.\n  ④ 세관장은 제1항에 따라 반출을 한 자가 제3항에 따른 기간 내에 수입신고를 하지 아니하는 경우에는 관세를 부과ㆍ징수한다. 이 경우 해당 물품에 대한 관세의 100분의 20에 상당하는 금액을 가산세로 징수하고, 제2항에 따른 지정을 취소할 수 있다.\n  [전문개정 2010. 12. 30.]","L101-0":"제101조(해외임가공물품 등의 감면) ① 다음 각 호의 어느 하나에 해당하는 물품이 수입될 때에는 대통령령으로 정하는 바에 따라 그 관세를 경감할 수 있다. <개정 2025. 10. 1.>\n    1. 원재료 또는 부분품을 수출하여 재정경제부령으로 정하는 물품으로 제조하거나 가공한 물품\n    2. 가공 또는 수리할 목적으로 수출한 물품으로서 재정경제부령으로 정하는 기준에 적합한 물품\n  ② 제1항의 물품이 다음 각 호의 어느 하나에 해당하는 경우에는 그 관세를 경감하지 아니한다.\n    1. 해당 물품 또는 원자재에 대하여 관세를 감면받은 경우. 다만, 제1항제2호의 경우는 제외한다.\n    2. 이 법 또는 「수출용원재료에 대한 관세 등 환급에 관한 특례법」에 따른 환급을 받은 경우\n    3. 보세가공 또는 장치기간경과물품을 재수출조건으로 매각함에 따라 관세가 부과되지 아니한 경우\n  [전문개정 2010. 12. 30.]\n  [제목개정 2020. 12. 22.]","D247-0":"제247조(가산세율) ①법 제241조제4항의 규정에 의한 가산세액은 다음 각호의 율에 의하여 산출한다.\n    1. 법 제241조제3항의 규정에 의한 기한(이하 이 조에서 “신고기한”이라 한다)이 경과한 날부터 20일내에 신고를 한 때에는 당해 물품의 과세가격의 1천분의 5\n    2. 신고기한이 경과한 날부터 50일내에 신고를 한 때에는 당해 물품의 과세가격의 1천분의 10\n    3. 신고기한이 경과한 날부터 80일내에 신고를 한 때에는 당해 물품의 과세가격의 1천분의 15\n    4. 제1호 내지 제3호외의 경우에는 당해 물품의 과세가격의 1천분의 20\n  ②제1항에 따른 가산세액은 500만원을 초과할 수 없다. <개정 2012. 2. 2.>\n  ③신고기한이 경과한 후 보세운송된 물품에 대하여는 보세운송신고를 한 때를 기준으로 제1항의 규정에 의한 가산세율을 적용하며 그 세액은 수입 또는 반송신고를 하는 때에 징수한다.\n  ④ 법 제241조제5항 각 호 외의 부분에서 “반복적으로 자진신고를 하지 아니하는 경우 등 대통령령으로 정하는 사유에 해당하는 경우”란 같은 여행자나 승무원에 대하여 그 여행자나 승무원의 입국일을 기준으로 소급하여 2년 이내에 2회 이상 법 제241조제5항제1호의 경우에 해당하는 사유로 가산세를 징수한 경우를 말한다. <신설 2015. 2. 6.>","D188-0":"제188조(특허보세구역의 설치ㆍ운영에 관한 특허의 신청) ①법 제174조제1항의 규정에 의하여 법 제154조의 규정에 의한 특허보세구역(이하 “특허보세구역”이라 한다)의 설치ㆍ운영에 관한 특허를 받고자 하는 자는 다음 각호의 사항을 기재한 신청서에 재정경제부령이 정하는 서류를 첨부하여 세관장에게 제출하여야 한다. <개정 2008. 2. 29., 2025. 12. 30.>\n    1. 특허보세구역의 종류 및 명칭, 소재지, 구조, 동수와 면적 및 수용능력\n    2. 장치할 물품의 종류\n    3. 설치ㆍ운영의 기간\n  ②제1항의 규정에 불구하고 특허보세구역 중 보세공장의 설치운영에 관한 특허를 받으려는 자는 다음 각 호의 사항을 기재한 신청서에 사업계획서와 그 구역 및 부근의 도면을 첨부하여 세관장에게 제출하여야 한다. 이 경우 세관장은 「전자정부법」 제36조제1항에 따른 행정정보의 공동이용을 통하여 법인 등기사항증명서를 확인하여야 한다. <개정 2001. 12. 31., 2006. 6. 12., 2010. 5. 4., 2010. 11. 2.>\n    1. 공장의 명칭, 소재지, 구조, 동수 및 면적\n    2. 공장의 작업설비ㆍ작업능력\n    3. 공장에서 할 수 있는 작업의 종류\n    4. 원재료 및 제품의 종류\n    5. 설치ㆍ운영의 기간\n  ③제1항에 따른 특허를 갱신하려는 자는 다음 각 호의 사항을 적은 신청서에 재정경제부령으로 정하는 서류를 첨부하여 그 기간만료 1개월 전까지 세관장에게 제출하여야 한다. <개정 2008. 2. 29., 2012. 2. 2., 2025. 12. 30.>\n    1. 갱신사유\n    2. 갱신기간\n  ④ 세관장은 제1항에 따라 특허를 받은 자에게 특허를 갱신받으려면 특허기간이 끝나는 날의 1개월 전까지 특허 갱신을 신청하여야 한다는 사실과 갱신절차를 특허기간이 끝나는 날의 2개월 전까지 휴대폰에 의한 문자전송, 전자메일, 팩스, 전화, 문서 등으로 미리 알려야 한다. <신설 2012. 2. 2.>","L327-3":"제327조의3(전자문서중계사업자의 지정 등) ① 「전기통신사업법」 제2조제8호에 따른 전기통신사업자로서 전자신고등 및 전자송달을 중계하는 업무(이하 “전자문서중계업무”라 한다)를 수행하려는 자는 대통령령으로 정하는 기준과 절차에 따라 관세청장의 지정을 받아야 한다.\n  ② 다음 각 호의 어느 하나에 해당하는 자는 제1항에 따른 지정을 받을 수 없다.<개정 2018. 12. 31.>\n    1. 제175조제2호부터 제5호까지의 어느 하나에 해당하는 자\n    2. 제3항에 따라 지정이 취소(제175조제2호 또는 제3호에 해당하여 지정이 취소된 경우는 제외한다)된 날부터 2년 이 지나지 아니한 자\n    3. 제1호 또는 제2호에 해당하는 자를 임원으로 하는 법인\n  ③ 관세청장은 제1항에 따라 지정을 받은 자(이하 “전자문서중계사업자”라 한다)가 다음 각 호의 어느 하나에 해당하는 경우에는 그 지정을 취소하거나 1년 이내의 기간을 정하여 전자문서중계업무의 전부 또는 일부의 정지를 명할 수 있다. 다만, 제1호 및 제2호에 해당하는 경우에는 그 지정을 취소하여야 한다.<개정 2014. 1. 1., 2018. 12. 31., 2023. 12. 31.>\n    1. 제2항 각 호의 어느 하나에 해당한 경우. 다만, 제2항제3호에 해당하는 경우로서 제175조제2호 또는 제3호에 해당하는 사람을 임원으로 하는 법인이 3개월 이내에 해당 임원을 변경한 경우에는 그러하지 아니하다.\n    2. 거짓이나 그 밖의 부정한 방법으로 제1항에 따른 지정을 받은 경우\n    3. 제1항에 따른 기준을 충족하지 못하게 된 경우\n    4. 제7항에 따른 관세청장의 지도ㆍ감독을 위반한 경우\n    5. 제8항에 따른 관세청장의 시정명령을 그 정하여진 기간 이내에 이행하지 아니한 경우\n    6. 제327조의4제3항을 위반하여 업무상 알게 된 전자문서상의 비밀과 관련 정보에 관한 비밀을 누설하거나 도용한 경우\n  ④ 관세청장은 제3항에 따른 업무정지가 그 이용자에게 심한 불편을 주거나 그 밖에 공익을 해칠 우려가 있는 경우에는 업무정지처분을 갈음하여 1억원 이하의 과징금을 부과할 수 있다. 이 경우 과징금을 부과하는 위반행위의 종류와 위반 정도 등에 따른 과징금의 금액 등에 관하여 필요한 사항은 대통령령으로 정한다.\n  ⑤ 제4항에 따른 과징금을 납부하여야 할 자가 납부기한까지 이를 납부하지 아니한 경우에는 제26조를 준용한다.\n  ⑥ 전자문서중계사업자는 전자문서중계업무를 제공받는 자에게 재정경제부령으로 정하는 바에 따라 수수료 등 필요한 요금을 부과할 수 있다.<개정 2025. 10. 1.>\n  ⑦ 관세청장은 전자문서중계사업의 안정적인 운영을 위하여 전자문서중계사업자에게 사업실적 등 운영사업과 관련한 주요 내용을 매년 보고하도록 하거나 관련 장부 및 서류를 제출하도록 명할 수 있다. 이 경우 보고의 방법 및 절차 등 필요한 사항은 관세청장이 정한다.<개정 2023. 12. 31.>\n  ⑧ 관세청장은 전자문서중계사업자의 업무 수행의 방법, 절차 등이 부적절하여 전자문서중계의 안정성을 저해하거나 저해할 우려가 있는 경우 6개월 이내의 기간을 정하여 그 시정을 명할 수 있다.<신설 2023. 12. 31.>\n  ⑨ 제3항에 따른 지정취소 및 업무정지 처분의 세부기준에 관한 사항은 재정경제부령으로 정한다.<신설 2023. 12. 31., 2025. 10. 1.>\n  [전문개정 2010. 12. 30.]","R77-5":"제77조의5(통관고유부호 등의 신청) ① 영 제246조제1항제5호에 따른 통관고유부호, 해외공급자부호 또는 해외구매자부호를 발급받거나 변경하려는 자는 주소, 성명, 사업종류 등을 적은 신청서에 다음 각 호의 서류를 첨부하여 세관장에게 제출하여야 한다. 다만, 세관장이 필요 없다고 인정하는 경우에는 첨부서류의 제출을 생략할 수 있다.\n    1. 사업자등록증\n    2. 해외공급자 또는 해외구매자의 국가ㆍ상호ㆍ주소가 표기된 송품장\n    3. 그 밖에 관세청장이 정하여 고시하는 서류\n  ② 제1항에 따른 통관고유부호, 해외공급자부호 또는 해외구매자부호의 발급절차 및 관리 등에 관하여 필요한 사항은 관세청장이 정한다.\n  [본조신설 2011. 4. 1.]\n  [제77조의4에서 이동 <2015. 7. 16.>]","D119-0":"제119조(해외임가공물품에 대한 관세경감액) 법 제101조제1항에 따라 경감하는 관세액은 다음 각 호와 같다. <개정 2004. 3. 29., 2015. 2. 6.>\n    1. 법 제101조제1항제1호의 물품 : 수입물품의 제조ㆍ가공에 사용된 원재료 또는 부분품의 수출신고가격에 당해 수입물품에 적용되는 관세율을 곱한 금액\n    2. 법 제101조제1항제2호의 물품: 가공ㆍ수리물품의 수출신고가격에 해당 수입물품에 적용되는 관세율을 곱한 금액. 다만, 수입물품이 매매계약상의 하자보수보증 기간(수입신고수리 후 1년으로 한정한다) 중에 하자가 발견되거나 고장이 발생하여 외국의 매도인 부담으로 가공 또는 수리하기 위하여 수출된 물품에 대하여는 다음 각 목의 금액을 합한 금액에 해당 수입물품에 적용되는 관세율을 곱한 금액으로 한다.\n      가. 수출물품의 수출신고가격\n      나. 수출물품의 양륙항까지의 운임ㆍ보험료\n      다. 가공 또는 수리 후 물품의 선적항에서 국내 수입항까지의 운임ㆍ보험료\n      라. 가공 또는 수리의 비용에 상당하는 금액","L321-0":"제321조(세관의 업무시간ㆍ물품취급시간) ① 세관의 업무시간, 보세구역과 운송수단의 물품취급시간은 대통령령으로 정하는 바에 따른다. <개정 2020. 6. 9.>\n  ② 다음 각 호의 어느 하나에 해당하는 자는 대통령령으로 정하는 바에 따라 세관장에게 미리 통보하여야 한다.\n    1. 세관의 업무시간이 아닌 때에 통관절차ㆍ보세운송절차 또는 입출항절차를 밟으려는 자\n    2. 운송수단의 물품취급시간이 아닌 때에 물품을 취급하려는 자\n  ③ 제2항에 따라 사전통보를 한 자는 재정경제부령으로 정하는 바에 따라 수수료를 납부하여야 한다.<개정 2025. 10. 1.>\n  [전문개정 2010. 12. 30.]","R63-0":"제63조(항외하역에 관한 허가수수료) 법 제142조제2항의 규정에 의하여 납부하여야 하는 항외하역에 관한 허가수수료는 하역 1일마다 4만원으로 한다. 다만, 수출물품(보세판매장에서 판매하는 물품과 보세공장, 「자유무역지역의 지정 및 운영에 관한 법률」에 의한 자유무역지역에서 제조ㆍ가공하여 외국으로 반출하는 물품을 포함한다)에 대한 하역인 경우에는 하역 1일마다 1만원으로 한다. <개정 2005. 2. 11.>","D80-0":"제80조(잠정조치의 적용) ①법 제59조제1항의 규정에 의한 잠정조치는 제75조제2항의 규정에 의한 예비조사결과 보조금등의 지급과 그로 인한 실질적 피해등의 사실이 있다고 추정되는 충분한 증거가 있다고 판정된 경우로서 당해 조사의 개시후 최소한 60일이 경과된 후부터 적용할 수 있다.\n  ②제75조제3항에 따른 잠정조치의 적용기간은 4개월 이내로 해야 한다. 다만, 해당 물품의 무역에서 중요한 비중을 차지하는 수출자가 요청하는 경우에는 그 적용기간을 6개월까지 연장할 수 있다. <개정 2020. 12. 29.>\n  ③ 제2항에도 불구하고 보조금등에 상당하는 금액 이하의 관세 부과로도 국내산업 피해를 충분히 제거할 수 있는지를 조사하는 경우 등 재정경제부장관이 필요하다고 인정하는 때에는 국제협약에 따라 잠정조치의 적용기간을 9개월까지 연장할 수 있다. <신설 2020. 12. 29., 2025. 12. 30.>\n  ④법 제59조제1항의 규정에 의하여 제공되는 담보는 법 제24조제1항제1호부터 제4호까지 및 제7호에 해당하는 것으로서 잠정상계관세액에 상당하는 금액이어야 한다. <개정 2009. 2. 4., 2020. 12. 29.>","R76-2":"제76조의2(원산지증명서 발급 기관 등) ① 법 제232조의2제1항에서 원산지증명서를 발급할 권한이 있는 기관이란 다음 각 호의 자를 말한다.\n    1. 「대외무역법 시행령」 제91조제4항 단서에 따라 원산지증명서 발급 권한을 위임받은 자\n    2. 「대외무역법 시행령」 제91조제10항에 따라 원산지증명서 발급 업무를 위탁받은 자\n  ② 법 제232조의2제1항에 따른 원산지증명서의 발급 요청은 수출물품 선적이 완료되기 전까지 해야 한다. 다만, 과실ㆍ착오 또는 그 밖의 부득이한 사유로 수출물품 선적이 완료되기 전까지 원산지증명서의 발급을 요청하지 못한 경우에는 수출물품 선적일부터 1년의 범위에서 관세청장이 정하여 고시하는 기간 내에 원산지증명서의 발급을 요청할 수 있다.\n  ③ 제1항 및 제2항에서 규정한 사항 외에 원산지증명서의 발급에 필요한 사항은 관세청장이 정하여 고시한다.\n  [본조신설 2025. 3. 21.]","D50-0":"제50조(관세환급금의 환급신청) 법 제46조제1항에 따른 관세환급금(이하 이 조부터 제56조까지에서 “관세환급금”이라 한다)의 환급을 받고자 하는 자는 당해 물품의 품명ㆍ규격ㆍ수량ㆍ수입신고수리연월일ㆍ신고번호 및 환급사유와 환급받고자 하는 금액을 기재한 신청서를 세관장에게 제출하여야 한다. <개정 2013. 2. 15.>\n  [제목개정 2013. 2. 15.]","L100-0":"제100조(손상물품에 대한 감면) ① 수입신고한 물품이 수입신고가 수리되기 전에 변질되거나 손상되었을 때에는 대통령령으로 정하는 바에 따라 그 관세를 경감할 수 있다.\n  ② 이 법이나 그 밖의 법률 또는 조약ㆍ협정 등에 따라 관세를 감면받은 물품에 대하여 관세를 추징하는 경우 그 물품이 변질 또는 손상되거나 사용되어 그 가치가 떨어졌을 때에는 대통령령으로 정하는 바에 따라 그 관세를 경감할 수 있다.<개정 2011. 12. 31.>\n  [전문개정 2010. 12. 30.]\n  [제목개정 2020. 12. 22.]","L116-0":"제116조(비밀유지) ① 세관공무원은 납세자가 이 법에서 정한 납세의무를 이행하기 위하여 제출한 자료나 관세의 부과ㆍ징수 또는 통관을 목적으로 업무상 취득한 자료 등(이하 “과세정보”라 한다)을 타인에게 제공하거나 누설하여서는 아니 되며, 사용 목적 외의 용도로 사용하여서도 아니 된다. 다만, 다음 각 호의 어느 하나에 해당하는 경우에는 그 사용 목적에 맞는 범위에서 납세자의 과세정보를 제공할 수 있다. <개정 2017. 12. 19., 2022. 12. 31., 2025. 10. 1.>\n    1. 국가기관이 관세에 관한 쟁송이나 관세범에 대한 소추(訴追)를 목적으로 과세정보를 요구하는 경우\n    2. 법원의 제출명령이나 법관이 발부한 영장에 따라 과세정보를 요구하는 경우\n    3. 세관공무원 상호간에 관세를 부과ㆍ징수, 통관 또는 질문ㆍ검사하는 데에 필요하여 과세정보를 요구하는 경우\n    4. 국가데이터처장이 국가통계작성 목적으로 과세정보를 요구하는 경우\n    5. 다음 각 목에 해당하는 자가 급부ㆍ지원 등의 대상자 선정 및 그 자격을 조사ㆍ심사하는데 필요한 과세정보를 당사자의 동의를 받아 요구하는 경우\n      가. 국가행정기관 및 지방자치단체\n      나. 「공공기관의 운영에 관한 법률」에 따른 공공기관 중 대통령령으로 정하는 공공기관\n      다. 「은행법」에 따른 은행\n      라. 그 밖에 급부ㆍ지원 등의 업무와 관련된 자로서 대통령령으로 정하는 자\n    6. 제5호나목 또는 다목에 해당하는 자가 「대외무역법」 제2조제3호에 따른 무역거래자의 거래, 지급, 수령 등을 확인하는데 필요한 과세정보를 당사자의 동의를 받아 요구하는 경우\n    7. 다른 법률에 따라 과세정보를 요구하는 경우\n  ② 제1항제5호 및 제6호에 해당하는 경우에 제공할 수 있는 과세정보의 구체적인 범위는 대통령령으로 정한다.<신설 2022. 12. 31.>\n  ③ 제1항제1호 및 제4호부터 제7호까지의 규정에 따라 과세정보의 제공을 요구하는 자는 대통령령으로 정하는 바에 따라 문서로 관세청장 또는 해당 세관장에게 요구하여야 한다.<개정 2022. 12. 31.>\n  ④ 세관공무원은 제1항부터 제3항까지의 규정에 위반되게 과세정보의 제공을 요구받으면 이를 거부하여야 한다.\n  <개정 2022. 12. 31.>\n  ⑤ 관세청장은 제1항제5호부터 제7호까지에 따른 과세정보의 제공 업무를 제322조제5항에 따른 대행기관에 대행하게 할 수 있다. 이 경우 관세청장은 과세정보 제공 업무를 위한 기초자료를 대행기관에 제공하여야 한다.<신설 2022. 12. 31.>\n  ⑥ 제1항에 따라 과세정보를 알게 된 자 또는 제5항에 따라 과세정보의 제공 업무를 대행하는 자는 과세정보를 타인에게 제공하거나 누설하여서는 아니 되며, 그 목적 외의 용도로 사용하여서도 아니 된다.<개정 2022. 12. 31.>\n  ⑦ 제1항에 따라 과세정보를 알게 된 자 또는 제5항에 따라 과세정보의 제공 업무를 대행하는 자는 과세정보의 유출을 방지하기 위한 시스템 구축 등 대통령령으로 정하는 바에 따라 과세정보의 안전성 확보를 위한 조치를 하여야 한다.<신설 2022. 12. 31.>\n  ⑧ 이 조에 따라 과세정보를 제공받아 알게 된 자 또는 과세정보의 제공 업무를 대행하는 자 중 공무원이 아닌 자는 「형법」이나 그 밖의 법률에 따른 벌칙을 적용할 때 공무원으로 본다.<개정 2022. 12. 31.>\n  [전문개정 2010. 12. 30.]","R34-0":"제34조(외교관용 물품 등에 대한 면세 신청) ①법 제88조제1항제5호의 규정에 의하여 관세를 면제받고자 하는 자는 영 제112조제1항 각호의 사항외에 계약의 종류, 사업장소재지와 사용목적 및 사용방법을 기재하여 당해 업무를 관장하는 중앙행정기관의 장의 확인을 받은 신청서에 계약서 사본을 첨부하여야 한다.\n  ②법 제88조제1항제6호에서 “재정경제부령으로 정하는 자”란 면세업무와 관련된 조약 등에 의하여 외교관에 준하는 대우를 받는 자로서 해당 업무를 관장하는 중앙행정기관의 장이 확인한 자를 말한다. <개정 2008. 12. 31., 2011. 4. 1., 2026. 1. 2.>\n  ③법 제88조제1항제6호의 규정에 의하여 관세를 면제받고자 하는 자는 당해 업무를 관장하는 중앙행정기관의 장이 국제기구 또는 외국정부로부터 정부에 파견된 자임을 증명하는 서류를 신청서에 첨부하여야 한다.\n  ④법 제88조제2항의 규정에 의하여 양수가 제한되는 물품은 다음 각호와 같다.\n    1. 자동차(삼륜자동차와 이륜자동차를 포함한다)\n    2. 선박\n    3. 피아노\n    4. 전자오르간 및 파이프오르간\n    5. 엽총\n  [제목개정 2011. 4. 1.]"}};
G.edges = G.edges.filter((e) => e[2] !== "k");
{ const used = new Set(); G.edges.forEach(([a, b]) => { used.add(a); used.add(b); }); G.nodes = G.nodes.filter((n) => used.has(n.id)); }
const NS = "http://www.w3.org/2000/svg";
const N = {}; G.nodes.forEach((n) => (N[n.id] = n));
const adj = {}; G.nodes.forEach((n) => (adj[n.id] = []));
G.edges.forEach(([a, b, c], i) => { adj[a].push([b, c, i]); adj[b].push([a, c, i]); });
const ord = (n) => n.no[0] * 1000 + n.no[1];
const LAWN = { L: "법", D: "영", R: "규칙" };

// ---- layout: one circle split into three arcs (법 · 영 · 규칙); chapters in order inside each arc ----
const STEP = 12.5, CHGAP = 0, LAWGAP = 15, LABW = 250;
const seq = [], segs = [];
for (const law of ["L", "D", "R"]) {
  for (const [ch] of G.chapters) {
    const ns = G.nodes.filter((n) => n.ch === ch && n.law === law).sort((a, b) => ord(a) - ord(b));
    if (!ns.length) continue;
    segs.push({ law, ch, i0: seq.length, i1: seq.length + ns.length - 1 });
    ns.forEach((n) => seq.push(n));
    for (let i = 0; i < CHGAP; i++) seq.push(null);
  }
  for (let i = 0; i < LAWGAP; i++) seq.push(null);
}
const SLOTS = seq.length, RAD = (SLOTS * STEP) / (2 * Math.PI), C = RAD + LABW + 80, SIZE = 2 * C;
const ang = (i) => (i / SLOTS) * 2 * Math.PI - Math.PI / 2 + (LAWGAP / 2 / SLOTS) * 2 * Math.PI;
seq.forEach((n, i) => { if (n) { n.a = ang(i); n.x = C + RAD * Math.cos(n.a); n.y = C + RAD * Math.sin(n.a); } });
const TOTALW = SIZE, TOTALH = SIZE;

// ---- draw ----
const svg = document.getElementById("map");
svg.setAttribute("viewBox", `0 0 ${SIZE} ${SIZE}`);
const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent && parent.appendChild(e); return e; };
const gB = el("g", {}, svg), gE = el("g", {}, svg), gN = el("g", {}, svg);
const arcPath = (r, a0, a1) => { const large = a1 - a0 > Math.PI ? 1 : 0; return `M${C + r * Math.cos(a0)},${C + r * Math.sin(a0)} A${r},${r} 0 ${large} 1 ${C + r * Math.cos(a1)},${C + r * Math.sin(a1)}`; };
const half = Math.PI / SLOTS;
const radLabel = (txt, cls, r, am) => {
  const x = C + r * Math.cos(am), y = C + r * Math.sin(am);
  const t = el("text", { class: cls, x, y, "text-anchor": "middle", "dominant-baseline": "middle" }, gB); t.textContent = txt;
  const deg = (am * 180) / Math.PI + 90; const flip = ((deg % 360) + 360) % 360 > 90 && ((deg % 360) + 360) % 360 < 270;
  t.setAttribute("transform", `rotate(${flip ? deg + 180 : deg} ${x} ${y})`);
};
const bands = [];
segs.forEach((sg, k) => {
  const a0 = ang(sg.i0) - half * 0.8, a1 = ang(sg.i1) + half * 0.8, am = (a0 + a1) / 2;
  el("path", { class: `lawarc ${sg.law}${k % 2 ? " alt" : ""}`, d: arcPath(RAD, a0, a1) }, gB);
  const name = G.chapters.find((c) => c[0] === sg.ch)[1];
  if (sg.i1 - sg.i0 >= 3) radLabel(`${sg.ch}장`, "chlab", RAD + LABW + 30, am);
  if (sg.law === "L") bands.push({ ch: sg.ch, name, am, a0, a1 });
});
// 법: one wall between neighbouring chapters
{
  const ls = segs.filter((s) => s.law === "L");
  for (let i = 1; i < ls.length; i++) {
    const a = (ang(ls[i - 1].i1) + ang(ls[i].i0)) / 2;
    el("line", { class: "wall", x1: C + (RAD - 22) * Math.cos(a), y1: C + (RAD - 22) * Math.sin(a), x2: C + (RAD + LABW + 10) * Math.cos(a), y2: C + (RAD + LABW + 10) * Math.sin(a) }, gB);
  }
}
for (const law of ["L", "D", "R"]) {
  const ss = segs.filter((s) => s.law === law); const am = (ang(ss[0].i0) + ang(ss[ss.length - 1].i1)) / 2;
  radLabel({ L: "법", D: "시행령", R: "시행규칙" }[law], "lawlab " + law, RAD - 90, am);
}
const lines = G.edges.map(([a, b, c]) => { const A = N[a], B = N[b]; return el("line", { class: c, x1: A.x, y1: A.y, x2: B.x, y2: B.y }, gE); });
const fit = (s, px) => { let w = 0, out = ""; for (const ch of s) { w += /[\x00-\x7f]/.test(ch) ? 6.2 : 11; if (w > px) return out + "…"; out += ch; } return out; };
const nodeEl = {};
for (const n of G.nodes) {
  const deg = (n.a * 180) / Math.PI; const flip = deg > 90 && deg < 270;
  const g = el("g", { class: `node ${n.law}${adj[n.id].length ? "" : " iso"}`, transform: `translate(${n.x},${n.y}) rotate(${flip ? deg + 180 : deg})`, tabindex: 0, role: "button" }, gN);
  el("rect", { class: "hitbox", x: flip ? -LABW : -4, y: -STEP / 2, width: LABW + 4, height: STEP }, g);
  el("circle", { r: 3.2 }, g);
  const t = el("text", { x: flip ? -8 : 8, y: 4, "text-anchor": flip ? "end" : "start" }, g);
  const no = el("tspan", { class: "no" }, t); no.textContent = LAWN[n.law] + n.lab.replace("제", "").replace("조의", "-").replace("조", "") + " ";
  const ti = el("tspan", {}, t); ti.textContent = fit(n.t, LABW - 70);
  el("title", {}, g).textContent = `${LAWN[n.law]} ${n.lab}(${n.t})`;
  g.addEventListener("click", (e) => { e.stopPropagation(); select(n.id); });
  g.addEventListener("keydown", (e) => { if (e.key === "Enter") select(n.id); });
  nodeEl[n.id] = g;
}

// ---- zoom ----
const view = document.getElementById("view");
let z = Math.min((view.clientWidth - 8) / SIZE, (view.clientHeight - 8) / SIZE);
let zMin = z;
/* 크기가 늦게 잡히는 기기 대비: 화면 크기가 정해지면 다시 맞춤 */
if (!(z > 0)) { z = zMin = 0.3; }
try { new ResizeObserver(() => { const nz = Math.min((view.clientWidth - 8) / SIZE, (view.clientHeight - 8) / SIZE); if (!(nz > 0)) return; const atMin = Math.abs(z - zMin) < 1e-6 || !(zMin > 0); zMin = nz; if (atMin || z < zMin) { z = zMin; applyZoom(false); } }).observe(view); } catch (e) {}

// ---- fullscreen toggle ----
{
  const fs = document.getElementById("fs");
  const root = document.documentElement;
  const req = root.requestFullscreen || root.webkitRequestFullscreen;
  const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
  if (!req || document.fullscreenEnabled === false) fs.hidden = true;
  fs.onclick = async () => {
    try {
      if (fsEl()) await (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      else await req.call(root);
    } catch (e) { fs.textContent = "전체화면 불가"; fs.disabled = true; }
  };
  const onChange = () => {
    const on = !!fsEl();
    fs.textContent = on ? "전체화면 끄기" : "전체화면"; fs.setAttribute("aria-pressed", String(on));
    setTimeout(() => {
      const atMin = Math.abs(z - zMin) < 1e-6;
      zMin = Math.min((view.clientWidth - 8) / SIZE, (view.clientHeight - 8) / SIZE);
      if (atMin || z < zMin) { z = zMin; applyZoom(false); }
    }, 150);
  };
  document.addEventListener("fullscreenchange", onChange);
  document.addEventListener("webkitfullscreenchange", onChange);
}
function applyZoom(keepCenter) {
  const cx = (view.scrollLeft + view.clientWidth / 2) / (svg.clientWidth || 1), cy = (view.scrollTop + view.clientHeight / 2) / (svg.clientHeight || 1);
  svg.setAttribute("width", SIZE * z); svg.setAttribute("height", SIZE * z);
  if (keepCenter) { view.scrollLeft = cx * SIZE * z - view.clientWidth / 2; view.scrollTop = cy * SIZE * z - view.clientHeight / 2; }
}
applyZoom(false);
document.getElementById("zi").onclick = () => { z = Math.min(3, z * 1.3); applyZoom(true); };
document.getElementById("zo").onclick = () => { z = Math.max(zMin, z / 1.3); applyZoom(true); };
// svg position inside the scroll area (nonzero only while the svg is smaller than the view and centered)
const offL = () => svg.getBoundingClientRect().left - view.getBoundingClientRect().left + view.scrollLeft;
const offT = () => svg.getBoundingClientRect().top - view.getBoundingClientRect().top + view.scrollTop;
// ---- pinch zoom (two fingers) + ctrl/trackpad wheel zoom ----
const zMax = 3;
const clampZ = (v) => Math.max(zMin, Math.min(zMax, v));
let pinch = null;
const tdist = (t) => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
const tmid = (t) => { const r = view.getBoundingClientRect(); return { x: (t[0].clientX + t[1].clientX) / 2 - r.left, y: (t[0].clientY + t[1].clientY) / 2 - r.top }; };
view.addEventListener("touchstart", (e) => {
  if (e.touches.length !== 2) return;
  e.preventDefault();
  const m = tmid(e.touches);
  pinch = { d0: tdist(e.touches), z0: z, m0: m, px: (view.scrollLeft + m.x - offL()) / z, py: (view.scrollTop + m.y - offT()) / z, s: 1, m };
}, { passive: false });
view.addEventListener("touchmove", (e) => {
  if (!pinch || e.touches.length !== 2) return;
  e.preventDefault();
  const m = tmid(e.touches);
  pinch.s = clampZ(pinch.z0 * (tdist(e.touches) / pinch.d0)) / pinch.z0; pinch.m = m;
  const ox = pinch.px * pinch.z0, oy = pinch.py * pinch.z0;
  const tx = ox + view.scrollLeft * 0 + (m.x - pinch.m0.x) - ox * pinch.s + ox * 0;
  svg.style.transform = `translate(${ox - ox * pinch.s + (m.x - pinch.m0.x)}px, ${oy - oy * pinch.s + (m.y - pinch.m0.y)}px) scale(${pinch.s})`;
}, { passive: false });
function endPinch() {
  if (!pinch) return;
  const p = pinch; pinch = null;
  svg.style.transform = "";
  z = clampZ(p.z0 * p.s); applyZoom(false);
  view.scrollLeft = p.px * z + offL() - p.m.x; view.scrollTop = p.py * z + offT() - p.m.y;
}
view.addEventListener("touchend", (e) => { if (e.touches.length < 2) endPinch(); });
view.addEventListener("touchcancel", endPinch);
view.addEventListener("wheel", (e) => {
  if (!e.ctrlKey) return;
  e.preventDefault();
  const r = view.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  const px = (view.scrollLeft + mx - offL()) / z, py = (view.scrollTop + my - offT()) / z;
  z = clampZ(z * Math.exp(-e.deltaY * 0.01)); applyZoom(false);
  view.scrollLeft = px * z + offL() - mx; view.scrollTop = py * z + offT() - my;
}, { passive: false });

// move from the current view to (cx, cy) at zoom z1: animate with a transform, then commit the real zoom once
let flyAnim = 0;
function flyTo(cx, cy, z1, ms = 450) {
  cancelAnimationFrame(flyAnim);
  svg.style.transform = "";
  const W = view.clientWidth, H = view.clientHeight;
  const z0 = z, sl0 = view.scrollLeft, st0 = view.scrollTop, oL = offL(), oT = offT();
  const cx0 = (sl0 + W / 2 - oL) / z0, cy0 = (st0 + H / 2 - oT) / z0;
  const t0 = performance.now();
  const step = (now) => {
    const u = Math.min(1, (now - t0) / ms), e = u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
    const zt = Math.exp(Math.log(z0) + (Math.log(z1) - Math.log(z0)) * e);
    const cxt = cx0 + (cx - cx0) * e, cyt = cy0 + (cy - cy0) * e;
    const s = zt / z0;
    svg.style.transform = `translate(${W / 2 - oL + sl0 - zt * cxt}px, ${H / 2 - oT + st0 - zt * cyt}px) scale(${s})`;
    if (u < 1) { flyAnim = requestAnimationFrame(step); return; }
    svg.style.transform = "";
    z = z1; applyZoom(false);
    view.scrollLeft = cx * z + offL() - W / 2; view.scrollTop = cy * z + offT() - H / 2;
  };

}
function goTo(x, y, minZ) { flyTo(x, y, Math.max(z, minZ || 0)); }
const goNode = (n) => { const r = RAD + LABW / 2; goTo(C + r * Math.cos(n.a), C + r * Math.sin(n.a), 0.8); };

// ---- chapter focus: zoom so the chapter's 법 arc and its titles fill the screen ----
function focusChapter(b) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (let i = 0; i <= 24; i++) {
    const a = b.a0 + ((b.a1 - b.a0) * i) / 24;
    for (const r of [RAD - 10, RAD + LABW + 40]) {
      const x = C + r * Math.cos(a), y = C + r * Math.sin(a);
      x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y);
    }
  }
  const z1 = Math.max(zMin, Math.min(zMax, 0.92 * Math.min(view.clientWidth / (x1 - x0), view.clientHeight / (y1 - y0))));
  flyTo((x0 + x1) / 2, (y0 + y1) / 2, z1);
}

// ---- chapter chips ----
const chips = document.getElementById("chips");
for (const b of bands) { const bt = document.createElement("button"); bt.textContent = `${b.ch}장 ${b.name}`; bt.onclick = () => focusChapter(b); chips.appendChild(bt); }

// ---- legend toggles ----
for (const [id, c] of [["sp", "p"], ["so", "o"]]) document.getElementById(id).onchange = (e) => svg.classList.toggle("hide-" + c, !e.target.checked);

// ---- selection ----
const panel = document.getElementById("panel"), pc = document.getElementById("pc");
const COLORN = { p: "대통령령 위임", o: "재정경제부령 위임", k: "그 밖의 인용" };
// ---- 원문 비교 ----
const LV = { L: 0, D: 1, R: 2 };
const PFX = { L: "법", D: "영" };
const DELEG = { p: /대통령령(?:으로 정(?:하는|한다|하며|하되|하여|하고|할|한)(?: 바에 따라)?(?: [가-힣ㆍ]+)?)?/g, o: /(?:재정경제부령|기획재정부령)(?:으로 정(?:하는|한다|하며|하되|하여|하고|할|한)(?: 바에 따라)?(?: [가-힣ㆍ]+)?)?/g };
const REFY = /제(\d+)조(?:의(\d+))?/y;
const SEPY = /(?:제\d+항|제\d+호|의\d+|[가-하]목|\([^)]*\)|ㆍ|, |,| 및 | 또는 |부터 |까지| 각 호 외의 부분| 각 호| 단서| 본문| 후단| 전단|·)*/y;
// spans in text t citing article `no` of law prefix P
function citeSpans(t, P, no) {
  const out = []; const re = new RegExp("(?<![가-힣」\\w])" + P + " 제", "g"); let m;
  while ((m = re.exec(t))) {
    if (t.slice(Math.max(0, m.index - 3), m.index).endsWith("같은 ")) continue;
    let pos = m.index + P.length + 1, prev = null, rng = false, hit = false, end = pos;
    for (;;) {
      REFY.lastIndex = pos; const r = REFY.exec(t); if (!r) break;
      const a = +r[1], b = +(r[2] || 0);
      if ((a === no[0] && b === no[1]) || (rng && prev && no[1] === 0 && no[0] > prev && no[0] < a)) hit = true;
      prev = a; pos = REFY.lastIndex; end = pos;
      SEPY.lastIndex = pos; const sp = SEPY.exec(t); const seg = sp ? sp[0] : "";
      rng = seg.includes("부터"); pos += seg.length;
      if (seg.length) { const tail = seg.replace(/[\s,ㆍ·]+$|(?:및|또는)\s*$/g, ""); end = pos - (seg.length - tail.length); }
      if (seg.includes("까지")) { REFY.lastIndex = pos; if (!REFY.exec(t)) break; }
    }
    if (hit) {
      const tail = /^(?:에서|에 따른|에 따라|에 의한|의 규정에 의하여|의 규정에 의한|의 규정에 따라|의 규정에 따른)/.exec(t.slice(end));
      out.push([m.index, end + (tail ? tail[0].length : 0)]);
    }
    re.lastIndex = Math.max(re.lastIndex, end);
  }
  return out;
}
function delegSpans(t, c) { const out = []; const re = new RegExp(DELEG[c].source, "g"); let m; while ((m = re.exec(t))) out.push([m.index, m.index + m[0].length]); return out; }
// render article text with marks: spans = [[s,e,cls]]
function renderArt(t, spans) {
  spans.sort((a, b) => a[0] - b[0]);
  const merged = []; for (const sp of spans) { const l = merged[merged.length - 1]; if (l && sp[0] < l[1]) { l[1] = Math.max(l[1], sp[1]); } else merged.push([...sp]); }
  let html = "", i = 0;
  for (const [a, b, c] of merged) { html += esc(t.slice(i, a)) + `<mark class="${c}">` + esc(t.slice(a, b)) + "</mark>"; i = b; }
  html += esc(t.slice(i));
  return html.split("\n").map((ln, k) => {
    let cls = "";
    if (/^ {6}/.test(ln)) cls = "mok"; else if (/^ {4}/.test(ln)) cls = "ho";
    let x = ln.trim();
    if (k === 0) x = x.replace(/^제\d+조(?:의\d+)?\([^)]*\)\s*/, "");
    if (/^\[/.test(x)) cls = "nt";
    x = x.replace(/(&lt;(?:개정|신설|본조신설|전문개정|타법개정)[^&]*?&gt;)/g, '<span class="am">$1</span>');
    return `<p class="${cls}">${x}</p>`;
  }).join("");
}
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// marks for article X with respect to linked article Y (edge color c)
function marksFor(X, Y, c) {
  const t = G.texts[X.id] || "";
  if (LV[X.law] < LV[Y.law]) return delegSpans(t, c).map((s) => [...s, c]);           // X 위임하는 쪽: 대통령령/재경부령 문구
  return citeSpans(t, PFX[Y.law], Y.no).map((s) => [...s, c]);                        // X 위임받는 쪽: 상위 조문 인용 문구
}
const LAWFULL = { L: "관세법", D: "관세법 시행령", R: "관세법 시행규칙" };
function artCard(X, spans, edgeC) {
  const tag = edgeC ? `<span class="tag ${edgeC}">${edgeC === "p" ? "대통령령" : "재정경제부령"}</span>` : "";
  return `<div class="art ${X.law}"><h3>${tag}<span>${LAWFULL[X.law]} ${X.lab}(${esc(X.t)})</span></h3><div class="tx">${renderArt(G.texts[X.id] || "", spans)}</div></div>`;
}
function openCompare(id) {
  const n = N[id];
  const links = adj[id].map(([m, c]) => [N[m], c]).sort((a, b) => LV[a[0].law] - LV[b[0].law] || ord(a[0]) - ord(b[0]));
  const leftSpans = []; links.forEach(([m, c]) => leftSpans.push(...marksFor(n, m, c)));
  document.getElementById("cl").innerHTML = `<div class="colt">선택한 조문</div>` + artCard(n, leftSpans);
  document.getElementById("cr").innerHTML = `<div class="colt">연결된 조문 ${links.length}개</div>` + links.map(([m, c]) => artCard(m, marksFor(m, n, c), c)).join("");
  document.getElementById("cmpt").textContent = `원문 비교 · ${LAWN[n.law]} ${n.lab}(${n.t})`;
  const cmp = document.getElementById("cmp"); cmp.hidden = false;
  document.getElementById("cl").scrollTop = 0; document.getElementById("cr").scrollTop = 0; cmp.querySelector(".cols").scrollTop = 0;
  document.getElementById("cmpx").focus();
}
document.getElementById("cmpx").onclick = () => (document.getElementById("cmp").hidden = true);
document.addEventListener("keydown", (e) => { if (e.key === "Escape") document.getElementById("cmp").hidden = true; });

function select(id) {
  svg.classList.add("focus");
  document.querySelectorAll(".on,.me").forEach((e) => e.classList.remove("on", "me"));
  const n = N[id]; nodeEl[id].classList.add("on", "me");
  for (const [m, c, i] of adj[id]) { nodeEl[m].classList.add("on"); lines[i].classList.add("on"); }
  const groups = { L: [], D: [], R: [] };
  adj[id].forEach(([m, c]) => groups[N[m].law].push([N[m], c]));
  let h = `<h2>${LAWN[n.law]} ${n.lab}(${n.t})</h2><div class="note">제${n.ch}장 · 연결 ${adj[id].length}개</div>`;
  for (const k of ["L", "D", "R"]) {
    if (!groups[k].length) continue;
    groups[k].sort((a, b) => ord(a[0]) - ord(b[0]));
    h += `<h3>${{ L: "법", D: "시행령", R: "시행규칙" }[k]}</h3><ul>` + groups[k].map(([m, c]) => `<li data-id="${m.id}" title="${COLORN[c]}"><i style="background:var(--${c})"></i>${m.lab}(${m.t})</li>`).join("") + "</ul>";
  }
  if (!adj[id].length) h += `<p class="note">위임으로 이어진 다른 단계 조문이 없습니다.</p>`;
  if (adj[id].length) h += `<button class="cmpbtn" id="cmpgo">원문 비교</button>`;
  pc.innerHTML = h; panel.hidden = false;
  const cg = document.getElementById("cmpgo"); if (cg) cg.onclick = () => openCompare(id);
  pc.querySelectorAll("li").forEach((li) => (li.onclick = () => { const m = N[li.dataset.id]; select(m.id); goNode(m); }));
}
function clearSel() { svg.classList.remove("focus"); document.querySelectorAll(".on,.me").forEach((e) => e.classList.remove("on", "me")); showIntro(); }
function showIntro() {
  pc.innerHTML = `<h2>사용법</h2><p class="note" style="margin:0">조문을 누르면 이어진 조문만 진하게 보이고, 목록에서 다시 누르면 그 조문으로 이동합니다. 빈 곳을 누르면 선택이 풀립니다. 위임으로 이어진 조문만 담았습니다.<br>법 ${G.nodes.filter(n=>n.law==="L").length} · 영 ${G.nodes.filter(n=>n.law==="D").length} · 규칙 ${G.nodes.filter(n=>n.law==="R").length}개 조문, 선 ${G.edges.length}개</p>`;
}
svg.addEventListener("click", clearSel);
document.getElementById("px").onclick = () => (panel.hidden = true);
showIntro();

// ---- search: "법 30", "영 17의2", "규칙 4", or title words ----
document.getElementById("q").addEventListener("keydown", (e) => {
  if (e.key !== "Enter") return;
  const v = e.target.value.trim(); if (!v) return;
  document.querySelectorAll(".hit").forEach((x) => x.classList.remove("hit"));
  const m = v.replace(/\s+/g, "").match(/^(법|영|시행령|규칙|시행규칙)?제?(\d+)(?:조)?(?:의(\d+))?$/);
  let hits;
  if (m) {
    const law = { 법: "L", 영: "D", 시행령: "D", 규칙: "R", 시행규칙: "R" }[m[1]] || "L";
    hits = G.nodes.filter((n) => n.law === law && n.no[0] === +m[2] && n.no[1] === +(m[3] || 0));
  } else hits = G.nodes.filter((n) => n.t.includes(v));
  hits.forEach((n) => nodeEl[n.id].classList.add("hit"));
  if (hits.length) { select(hits[0].id); goNode(hits[0]); }
});
</script>
