* { box-sizing:border-box; }

<script>
const D = {"nodes": [{"id": "L30--", "col": 0, "art": "30", "h": "", "ho": "", "lab": "30조(과세가격 결정의 원칙)", "fam": "30", "lv": 0}, {"id": "L30-1-", "col": 0, "art": "30", "h": "1", "ho": "", "lab": "30조 1항", "fam": "30", "lv": 1, "body": "① 수입물품의 과세가격은 우리나라에 수출하기 위하여 판매되는 물품에 대하여 구매자가 실제로 지급하였거나 지급하여야 할 가격에 다음 각 호의 금액을 더하여 조정한 거래가격으로 한다. 다만, 다음 각 호의 금액을 더할 때에는 객관적이고 수량화할 수 있는 자료에 근거하여야 하며, 이러한 자료가 없는 경우에는 이 조에 규정된 방법으로 과세가격을 결정하지 아니하고 제31조부터 제35조까지에 규정된 방법으로 과세가격을 결정한다."}, {"id": "L30-1-1", "col": 0, "art": "30", "h": "1", "ho": "1", "lab": "30조 1항 1호", "fam": "30", "lv": 2}, {"id": "L30-1-2", "col": 0, "art": "30", "h": "1", "ho": "2", "lab": "30조 1항 2호", "fam": "30", "lv": 2}, {"id": "L30-1-3", "col": 0, "art": "30", "h": "1", "ho": "3", "lab": "30조 1항 3호", "fam": "30", "lv": 2}, {"id": "L30-1-4", "col": 0, "art": "30", "h": "1", "ho": "4", "lab": "30조 1항 4호", "fam": "30", "lv": 2}, {"id": "L30-1-5", "col": 0, "art": "30", "h": "1", "ho": "5", "lab": "30조 1항 5호", "fam": "30", "lv": 2}, {"id": "L30-1-6", "col": 0, "art": "30", "h": "1", "ho": "6", "lab": "30조 1항 6호", "fam": "30", "lv": 2}, {"id": "L30-2-", "col": 0, "art": "30", "h": "2", "ho": "", "lab": "30조 2항", "fam": "30", "lv": 1, "body": "② 제1항 각 호 외의 부분 본문에서 “구매자가 실제로 지급하였거나 지급하여야 할 가격”이란 해당 수입물품의 대가로서 구매자가 지급하였거나 지급하여야 할 총금액을 말하며, 구매자가 해당 수입물품의 대가와 판매자의 채무를 상계(相計)하는 금액, 구매자가 판매자의 채무를 변제하는 금액, 그 밖의 간접적인 지급액을 포함한다. 다만, 구매자가 지급하였거나 지급하여야 할 총금액에서 다음 각 호의 어느 하나에 해당하는 금액을 명백히 구분할 수 있을 때에는 그 금액을 뺀 금액을 말한다."}, {"id": "L30-2-1", "col": 0, "art": "30", "h": "2", "ho": "1", "lab": "30조 2항 1호", "fam": "30", "lv": 2}, {"id": "L30-2-2", "col": 0, "art": "30", "h": "2", "ho": "2", "lab": "30조 2항 2호", "fam": "30", "lv": 2}, {"id": "L30-2-3", "col": 0, "art": "30", "h": "2", "ho": "3", "lab": "30조 2항 3호", "fam": "30", "lv": 2}, {"id": "L30-2-4", "col": 0, "art": "30", "h": "2", "ho": "4", "lab": "30조 2항 4호", "fam": "30", "lv": 2}, {"id": "L30-3-", "col": 0, "art": "30", "h": "3", "ho": "", "lab": "30조 3항", "fam": "30", "lv": 1, "body": "③ 다음 각 호의 어느 하나에 해당하는 경우에는 제1항에 따른 거래가격을 해당 물품의 과세가격으로 하지 아니하고 제31조부터 제35조까지에 규정된 방법으로 과세가격을 결정한다. 이 경우 세관장은 다음 각 호의 어느 하나에 해당하는 것으로 판단하는 근거를 납세의무자에게 미리 서면으로 통보하여 의견을 제시할 기회를 주어야 한다."}, {"id": "L30-3-1", "col": 0, "art": "30", "h": "3", "ho": "1", "lab": "30조 3항 1호", "fam": "30", "lv": 2}, {"id": "L30-3-2", "col": 0, "art": "30", "h": "3", "ho": "2", "lab": "30조 3항 2호", "fam": "30", "lv": 2}, {"id": "L30-3-3", "col": 0, "art": "30", "h": "3", "ho": "3", "lab": "30조 3항 3호", "fam": "30", "lv": 2}, {"id": "L30-3-4", "col": 0, "art": "30", "h": "3", "ho": "4", "lab": "30조 3항 4호", "fam": "30", "lv": 2}, {"id": "L30-4-", "col": 0, "art": "30", "h": "4", "ho": "", "lab": "30조 4항", "fam": "30", "lv": 1, "body": "④ 세관장은 납세의무자가 제1항에 따른 거래가격으로 가격신고를 한 경우 해당 신고가격이 동종·동질물품 또는 유사물품의 거래가격과 현저한 차이가 있는 등 이를 과세가격으로 인정하기 곤란한 경우로서 대통령령으로 정하는 경우에는 대통령령으로 정하는 바에 따라 납세의무자에게 신고가격이 사실과 같음을 증명할 수 있는 자료를 제출할 것을 요구할 수 있다."}, {"id": "L30-5-", "col": 0, "art": "30", "h": "5", "ho": "", "lab": "30조 5항", "fam": "30", "lv": 1, "body": "⑤ 세관장은 납세의무자가 다음 각 호의 어느 하나에 해당하면 제1항과 제2항에 규정된 방법으로 과세가격을 결정하지 아니하고 제31조부터 제35조까지에 규정된 방법으로 과세가격을 결정한다. 이 경우 세관장은 빠른 시일 내에 과세가격 결정을 하기 위하여 납세의무자와 정보교환 등 적절한 협조가 이루어지도록 노력하여야 하고, 신고가격을 과세가격으로 인정하기 곤란한 사유와 과세가격 결정 내용을 해당 납세의무자에게 통보하여야 한다."}, {"id": "L30-5-1", "col": 0, "art": "30", "h": "5", "ho": "1", "lab": "30조 5항 1호", "fam": "30", "lv": 2}, {"id": "L30-5-2", "col": 0, "art": "30", "h": "5", "ho": "2", "lab": "30조 5항 2호", "fam": "30", "lv": 2}, {"id": "L30-5-3", "col": 0, "art": "30", "h": "5", "ho": "3", "lab": "30조 5항 3호", "fam": "30", "lv": 2}, {"id": "L31--", "col": 0, "art": "31", "h": "", "ho": "", "lab": "31조(동종ㆍ동질물품의 거래가격을 기초로 한 과세가격의 결정)", "fam": "31", "lv": 0}, {"id": "L31-1-", "col": 0, "art": "31", "h": "1", "ho": "", "lab": "31조 1항", "fam": "31", "lv": 1, "body": "① 제30조에 따른 방법으로 과세가격을 결정할 수 없는 경우에는 과세가격으로 인정된 사실이 있는 동종·동질물품의 거래가격으로서 다음 각 호의 요건을 갖춘 가격을 기초로 하여 과세가격을 결정한다."}, {"id": "L31-1-1", "col": 0, "art": "31", "h": "1", "ho": "1", "lab": "31조 1항 1호", "fam": "31", "lv": 2}, {"id": "L31-1-2", "col": 0, "art": "31", "h": "1", "ho": "2", "lab": "31조 1항 2호", "fam": "31", "lv": 2}, {"id": "L31-2-", "col": 0, "art": "31", "h": "2", "ho": "", "lab": "31조 2항", "fam": "31", "lv": 1, "body": "② 제1항에 따라 과세가격으로 인정된 사실이 있는 동종·동질물품의 거래가격이라 하더라도 그 가격의 정확성과 진실성을 의심할만한 합리적인 사유가 있는 경우 그 가격은 과세가격 결정의 기초자료에서 제외한다."}, {"id": "L31-3-", "col": 0, "art": "31", "h": "3", "ho": "", "lab": "31조 3항", "fam": "31", "lv": 1, "body": "③ 제1항을 적용할 때 동종·동질물품의 거래가격이 둘 이상 있는 경우에는 생산자, 거래 시기, 거래 단계, 거래 수량 등(이하 “거래내용등”이라 한다)이 해당 물품과 가장 유사한 것에 해당하는 물품의 가격을 기초로 하고, 거래내용 등이 같은 물품이 둘 이상이 있고 그 가격도 둘 이상이 있는 경우에는 가장 낮은 가격을 기초로 하여 과세가격을 결정한다."}, {"id": "L32--", "col": 0, "art": "32", "h": "", "ho": "", "lab": "32조(유사물품의 거래가격을 기초로 한 과세가격의 결정)", "fam": "32", "lv": 0}, {"id": "L32-1-", "col": 0, "art": "32", "h": "1", "ho": "", "lab": "32조 1항", "fam": "32", "lv": 1, "body": "① 제30조와 제31조에 따른 방법으로 과세가격을 결정할 수 없을 때에는 과세가격으로 인정된 사실이 있는 유사물품의 거래가격으로서 제31조제1항 각 호의 요건을 갖춘 가격을 기초로 하여 과세가격을 결정한다."}, {"id": "L32-2-", "col": 0, "art": "32", "h": "2", "ho": "", "lab": "32조 2항", "fam": "32", "lv": 1, "body": "② 제1항에 따라 과세가격으로 인정된 사실이 있는 유사물품의 거래가격이라 하더라도 그 가격의 정확성과 진실성을 의심할만한 합리적인 사유가 있는 경우 그 가격은 과세가격 결정의 기초자료에서 제외한다."}, {"id": "L32-3-", "col": 0, "art": "32", "h": "3", "ho": "", "lab": "32조 3항", "fam": "32", "lv": 1, "body": "③ 제1항을 적용할 때 유사물품의 거래가격이 둘 이상이 있는 경우에는 거래내용등이 해당 물품과 가장 유사한 것에 해당하는 물품의 가격을 기초로 하고, 거래내용등이 같은 물품이 둘 이상이 있고 그 가격도 둘 이상이 있는 경우에는 가장 낮은 가격을 기초로 하여 과세가격을 결정한다."}, {"id": "L33--", "col": 0, "art": "33", "h": "", "ho": "", "lab": "33조(국내판매가격을 기초로 한 과세가격의 결정)", "fam": "33", "lv": 0}, {"id": "L33-1-", "col": 0, "art": "33", "h": "1", "ho": "", "lab": "33조 1항", "fam": "33", "lv": 1, "body": "① 제30조부터 제32조까지에 규정된 방법으로 과세가격을 결정할 수 없을 때에는 제1호의 금액에서 제2호부터 제4호까지의 금액을 뺀 가격을 과세가격으로 한다. 다만, 납세의무자가 요청하면 제34조에 따라 과세가격을 결정하되 제34조에 따라 결정할 수 없는 경우에는 이 조, 제35조의 순서에 따라 과세가격을 결정한다."}, {"id": "L33-1-1", "col": 0, "art": "33", "h": "1", "ho": "1", "lab": "33조 1항  3, "art": "36", "lab": "36조(납세의무자 비율 산출)", "kind": "gosi", "fam": "33"}, {"id": "gosi:37", "col": 3, "art": "37", "lab": "37조(동종·동류비율에 대한 이의제기)", "kind": "gosi", "fam": "33"}, {"id": "gosi:38", "col": 3, "art": "38", "lab": "38조(제5방법을 적용할 수 없는 수입물품)", "kind": "gosi", "fam": "34"}, {"id": "gosi:39", "col": 3, "art": "39", "lab": "39조(제6방법의 적용)", "kind": "gosi", "fam": "35"}, {"id": "gosi:40", "col": 3, "art": "40", "lab": "40조(여행자휴대품 등의 과세가격)", "kind": "gosi", "fam": "35"}, {"id": "gosi:41", "col": 3, "art": "41", "lab": "41조(중고물품의 과세가격)", "kind": "gosi", "fam": "35"}], "lawtext": {"law:30": [["1", "", "① 수입물품의 과세가격은 우리나라에 수출하기 위하여 판매되는 물품에 대하여 구매자가 실제로 지급하였거나 지급하여야 할 가격에 다음 각 호의 금액을 더하여 조정한 거래가격으로 한다. 다만, 다음 각 호의 금액을 더할 때에는 객관적이고 수량화할 수 있는 자료에 근거하여야 하며, 이러한 자료가 없는 경우에는 이 조에 규정된 방법으로 과세가격을 결정하지 아니하고 제31조부터 제35조까지에 규정된 방법으로 과세가격을 결정한다."], ["1", "1", "    1. 구매자가 부담하는 수수료와 중개료. 다만, 구매수수료는 제외한다."], ["1", "2", "    2. 해당 수입물품과 동일체로 취급되는 용기의 비용과 해당 수입물품의 포장에 드는 노무비와 자재비로서 구매자가 부담하는 비용"], ["1", "3", "    3. 구매자가 해당 수입물품의 생산 및 수출거래를 위하여 대통령령으로 정하는 물품 및 용역을 무료 또는 인하된 가격으로 직접 또는 간접으로 공급한 경우에는 그 물품 및 용역의 가격 또는 인하차액을 해당 수입물품의 총생산량 등 대통령령으로 정하는 요소를 고려하여 적절히 배분한 금액"], ["1", "4", "    4. 특허권, 실용신안권, 디자인권, 상표권 및 이와 유사한 권리를 사용하는 대가로 지급하는 것으로서 대통령령으로 정하는 바에 따라 산출된 금액"], ["1", "5", "    5. 해당 수입물품을 수입한 후 전매·처분 또는 사용하여 생긴 수익금액 중 판매자에게 직접 또는 간접으로 귀속되는 금액"], ["1", "6", "    6. 수입항(輸入港)까지의 운임·보험료와 그 밖에 운송과 관련되는 비용으로서 대통령령으로 정하는 바에 따라 결정된 금액. 다만, 재정경제부령으로 정하는 수입물품의 경우에는 이의 전부 또는 일부를 제외할 수 있다."], ["2", "", "② 제1항 각 호 외의 부분 본문에서 “구매자가 실제로 지급하였거나 지급하여야 할 가격”이란 해당 수입물품의 대가로서 구매자가 지급하였거나 지급하여야 할 총금액을 말하며, 구매자가 해당 수입물품의 대가와 판매자의 채무를 상계(相計)하는 금액, 구매자가 판매자의 채무를 변제하는 금액, 그 밖의 간접적인 지급액을 포함한다. 다만, 구매자가 지급하였거나 지급하여야 할 총금액에서 다음 각 호의 어느 하나에 해당하는 금액을 명백히 구분할 수 있을 때에는 그 금액을 뺀 금액을 말한다."], ["2", "1", "    1. 수입 후에 하는 해당 수입물품의 건설, 설치, 조립, 정비, 유지 또는 해당 수입물품에 관한 기술지원에 필요한 비용"], ["2", "2", "    2. 수입항에 도착한 후 해당 수입물품을 운송하는 데에 필요한 운임·보험료와 그 밖에 운송과 관련되는 비용"], ["2", "3", "    3. 우리나라에서 해당 수입물품에 부과된 관세 등의 세금과 그 밖의 공과금"], ["2", "4", "    4. 연불조건(延拂條件)의 수입인 경우에는 해당 수입물품에 대한 연불이자"], ["3", "", "③ 다음 각 호의 어느 하나에 해당하는 경우에는 제1항에 따른 거래가격을 해당 물품의 과세가격으로 하지 아니하고 제31조부터 제35조까지에 규정된 방법으로 과세가격을 결정한다. 이 경우 세관장은 다음 각 호의 어느 하나에 해당하는 것으로 판단하는 근거를 납세의무자에게 미리 서면으로 통보하여 의견을 제시할 기회를 주어야 한다."], ["3", "1", "    1. 해당 물품의 처분 또는 사용에 제한이 있는 경우. 다만, 세관장이 제1항에 따른 거래가격에 실질적으로 영향을 미치지 아니한다고 인정하는 제한이 있는 경우 등 대통령령으로 정하는 경우는 제외한다."], ["3", "2", "    2. 해당 물품에 대한 거래의 성립 또는 가격의 결정이 금액으로 계산할 수 없는 조건 또는 사정에 따라 영향을 받은 경우"], ["3", "3", "    3. 해당 물품을 수입한 후에 전매·처분 또는 사용하여 생긴 수익의 일부가 판매자에게 직접 또는 간접으로 귀속되는 경우. 다만, 제1항에 따라 적절히 조정할 수 있는 경우는 제외한다."], ["3", "4", "    4. 구매자와 판매자 간에 대통령령으로 정하는 특수관계(이하 “특수관계”라 한다)가 있어 그 특수관계가 해당 물품의 가격에 영향을 미친 경우. 다만, 해당 산업부문의 정상적인 가격결정 관행에 부합하는 방법으로 결정된 경우 등 대통령령으로 정하는 경우는 제외한다."], ["4", "", "④ 세관장은 납세의무자가 제1항에 따른 거래가격으로 가격신고를 한 경우 해당 신고가격이 동종·동질물품 또는 유사물품의 거래가격과 현저한 차이가 있는 등 이를 과세가격으로 인정하기 곤란한 경우로서 대통령령으로 정하는 경우에는 대통령령으로 정하는 바에 따라 납세의무자에게 신고가격이 사실과 같음을 증명할 수 있는 자료를 제출할 것을 요구할 수 있다."], ["5", "", "⑤ 세관장은 납세의무자가 다음 각 호의 어느 하나에 해당하면 제1항과 제2항에 규정된 방법으로 과세가격을 결정하지 아니하고 제31조부터 제35조까지에 규정된 방법으로 과세가격을 결정한다. 이 경우 세관장은 빠른 시일 내에 과세가격 결정을 하기 위하여 납세의무자와 정보교환 등 적절한 협조가 이루어지도록 노력하여야 하고, 신고가격을 과세가격으로 인정하기 곤란한 사유와 과세가격 결정 내용을 해당 납세의무자에게 통보하여야 한다."], ["5", "1", "    1. 제4항에 따라 요구받은 자료를 제출하지 아니한 경우"], ["5", "2", "    2. 제4항의 요구에 따라 제출한 자료가 일반적으로 인정된 회계원칙에 부합하지 아니하게 작성된 경우"], ["5", "3", "    3. 그 밖에 대통령령으로 정하는 사유에 해당하여 신고가격을 과세가격으로 인정하기 곤란한 경우"]], "law:31": [["1", "", "① 제30조에 따른 방법으로 과세가격을 결정할 수 없는 경우에는 과세가격으로 인정된 사실이 있는 동종·동질물품의 거래가격으로서 다음 각 호의 요건을 갖춘 가격을 기초로 하여 과세가격을 결정한다."], ["1", "1", "    1. 과세가격을 결정하려는 해당 물품의 생산국에서 생산된 것으로서 해당 물품의 선적일(船積日)에 선적되거나 해당 물품의 선적일을 전후하여 가격에 영향을 미치는 시장조건이나 상관행(商慣行)에 변동이 없는 기간 중에 선적되어 우리나라에 수입된 것일 것"], ["1", "2", "    2. 거래 단계, 거래 수량, 운송 거리, 운송 형태 등이 해당 물품과 같아야 하며, 두 물품 간에 차이가 있는 경우에는 그에 따른 가격차이를 조정한 가격일 것"], ["2", "", "② 제1항에 따라 과세가격으로 인정된 사실이 있는 동종·동질물품의 거래가격이라 하더라도 그 가격의 정확성과 진실성을 의심할만한 합리적인 사유가 있는 경우 그 가격은 과세가격 결정의 기초자료에서 제외한다."], ["3", "", "③ 제1항을 적용할 때 동종·동질물품의 거래가격이 둘 이상 있는 경우에는 생산자, 거래 시기, 거래 단계, 거래 수량 등(이하 “거래내용등”이라 한다)이 해당 물품과 가장 유사한 것에 해당하는 물품의 가격을 기초로 하고, 거래내용 등이 같은 물품이 둘 이상이 있고 그 가격도 둘 이상이 있는 경우에는 가장 낮은 가격을 기초로 하여 과세가격을 결정한다."]], "law:32": [["1", "", "① 제30조와 제31조에 따른 방법으로 과세가격을 결정할 수 없을 때에는 과세가격으로 인정된 사실이 있는 유사물품의 거래가격으로서 제31조제1항 각 호의 요건을 갖춘 가격을 기초로 하여 과세가격을 결정한다."], ["2", "", "② 제1항에 따라 과세가격으로 인정된 사실이 있는 유사물품의 거래가격이라 하더라도 그 가격의 정확성과 진실성을 의심할만한 합리적인 사유가 있는 경우 그 가격은 과세가격 결정의 기초자료에서 제외한다."], ["3", "", "③ 제1항을 적용할 때 유사물품의 거래가격이 둘 이상이 있는 경우에는 거래내용등이 해당 물품과 가장 유사한 것에 해당하는 물품의 가격을 기초로 하고, 거래내용등이 같은 물품이 둘 이상이 있고 그 가격도 둘 이상이 있는 경우에는 가장 낮은 가격을 기초로 하여 과세가격을 결정한다."]], "law:33": [["1", "", "① 제30조부터 제32조까지에 규정된 방법으로 과세가격을 결정할 수 없을 때에는 제1호의 금액에서 제2호부터 제4호까지의 금액을 뺀 가격을 과세가격으로 한다. 다만, 납세의무자가 요청하면 제34조에 따라 과세가격을 결정하되 제34조에 따라 결정할 수 없는 경우에는 이 조, 제35조의 순서에 따라 과세가격을 결정한다."], ["1", "1", "    1. 해당 물품, 동종·동질물품 또는 유사물품이 수입된 것과 동일한 상태로 해당 물품의 수입신고일 또는 수입신고일과 거의 동시에 특수관계가 없는 자에게 가장 많은 수량으로 국내에서 판매되는 단위가격을 기초로 하여 산출한 금액"], ["1", "2", "    2. 국내판매와 관련하여 통상적으로 지급하였거나 지급하여야 할 것으로 합의된 수수료 또는 동종·동류의 수입물품이 국내에서 판매되는 때에 통상적으로 부가되는 이윤 및 일반경비에 해당하는 금액"], ["1", "3", "    3. 수입항에 도착한 후 국내에서 발생한 통상의 운임·보험료와 그 밖의 관련 비용"], ["1", "4", "    4. 해당 물품의 수입 및 국내판매와 관련하여 납부하였거나 납부하여야 하는 조세와 그 밖의 공과금"], ["2", "", "② 제1항제1호에 따른 국내에서 판매되는 단위가격이라 하더라도 그 가격의 정확성과 진실성을 의심할만한 합리적인 사유가 있는 경우에는 제1항을 적용하지 아니할 수 있다."], ["3", "", "③ 해당 물품, 동종·동질물품 또는 유사물품이 수입된 것과 동일한 상태로 국내에서 판매되는 사례가 없는 경우 납세의무자가 요청할 때에는 해당 물품이 국내에서 가공된 후 특수관계가 없는 자에게 가장 많은 수량으로 판매되는 단위가격을 기초로 하여 산출된 금액에서 다음 각 호의 금액을 뺀 가격을 과세가격으로 한다."], ["3", "1", "    1. 제1항제2호부터 제4호까지의 금액"], ["3", "2", "    2. 국내 가공에 따른 부가가치"]], "law:34": [["1", "", "① 제30조부터 제33조까지에 규정된 방법으로 과세가격을 결정할 수 없을 때에는 다음 각 호의 금액을 합한 가격을 기초로 하여 과세가격을 결정한다."], ["1", "1", "    1. 해당 물품의 생산에 사용된 원자재 비용 및 조립이나 그 밖의 가공에 드는 비용 또는 그 가격"], ["1", "2", "    2. 수출국 내에서 해당 물품과 동종·동류의 물품의 생산자가 우리나라에 수출하기 위하여 판매할 때 통상적으로 반영하는 이윤 및 일반 경비에 해당하는 금액"], ["1", "3", "    3. 해당 물품의 수입항까지의 운임·보험료와 그 밖에 운송과 관련된 비용으로서 제30조제1항제6호에 따라 결정된 금액"], ["2", "", "② 납세의무자가 제1항 각 호의 금액을 확인하는데 필요한 자료를 제출하지 않은 경우에는 제1항을 적용하지 않을 수 있다."]], "law:35": [["1", "", "① 제30조부터 제34조까지에 규정된 방법으로 과세가격을 결정할 수 없을 때에는 대통령령으로 정하는 바에 따라 제30조부터 제34조까지에 규정된 원칙과 부합되는 합리적인 기준에 따라 과세가격을 결정한다."], ["2", "", "② 제1항에 따른 방법으로 과세가격을 결정할 수 없을 때에는 국제거래시세·산지조사가격을 조정한 가격을 적용하는 방법 등 거래의 실질 및 관행에 비추어 합리적으로 인정되는 방법에 따라 과세가격을 결정한다."]]}, "edges": [["L30-1-3", "dec:18", "d"], ["L30-1-3", "dec:18의2", "d"], ["L30-1-4", "dec:19", "d"], ["L30-1-6", "dec:20", "d"], ["L30-1-6", "rule:4의3", "r"], ["L30-3-1", "dec:21", "d"], ["L30-3-1", "dec:22", "d"], ["L30-3-4", "dec:23", "d"], ["L30-4-", "dec:24", "d"], ["L30-5-3", "dec:24", "d"], ["L35-1-", "dec:29", "d"], ["dec:18", "rule:4", "r"], ["dec:20", "rule:4의3", "r"], ["dec:24", "rule:5의2", "r"], ["dec:29", "rule:7의2", "r"], ["dec:29", "rule:7의3", "r"], ["dec:29", "rule:7의4", "r"], ["L30-1-", "dec:17", "c"], ["L30-1-1", "dec:17의2", "c"], ["L30-1-5", "dec:19의2", "c"], ["L30-2-4", "dec:20의2", "c"], ["L31-1-1", "dec:25", "c"], ["L31-1-2", "dec:25", "c"], ["L31-3-", "dec:25", "c"], ["L32-1-", "dec:26", "c"], ["L33-1-1", "dec:27", "c"], ["L33-1-2", "dec:27", "c"], ["L33-1-3", "dec:27", "c"], ["L33-2-", "dec:27", "c"], ["L34-1-1", "dec:28", "c"], ["dec:17의2", "rule:3의3", "c"], ["dec:19", "rule:4의2", "c"], ["dec:23", "rule:5", "c"], ["dec:29", "rule:7", "c"], ["dec:29", "rule:7의5", "c"], ["dec:29", "rule:7의6", "c"], ["dec:29", "rule:7의7", "c"], ["dec:29", "rule:7의8", "c"], ["L30--", "gosi:13", "g"], ["L30-3-", "gosi:14", "g"], ["L30-5-", "gosi:14", "g"], ["dec:17", "gosi:14", "g"], ["L30-1-", "gosi:15", "g"], ["L30-1-1", "gosi:17", "g"], ["L30-1-2", "gosi:18", "g"], ["dec:18", "gosi:19", "g"], ["dec:18의2", "gosi:20", "g"], ["dec:23", "gosi:21", "g"], ["rule:4의2", "gosi:21", "g"], ["dec:19", "gosi:22", "g"], ["L30-1-5", "gosi:23", "g"], ["L30-2-2", "gosi:24", "g"], ["rule:4의3", "gosi:24", "g"], ["dec:20", "gosi:25", "g"], ["dec:20", "gosi:26", "g"], ["L30-3-2", "gosi:27", "g"], ["dec:23", "gosi:28", "g"], ["dec:23", "gosi:29", "g"], ["dec:25", "gosi:30", "g"], ["dec:27", "gosi:31", "g"], ["L33-1-4", "gosi:32", "g"], ["L33-1-2", "gosi:32", "g"], ["L33-3-", "gosi:32", "g"], ["dec:27", "gosi:33", "g"], ["dec:27", "gosi:35", "g"], ["dec:27", "gosi:37", "g"], ["dec:28", "gosi:38", "g"], ["rule:7", "gosi:39", "g"], ["rule:7의3", "gosi:40", "g"], ["rule:7의5", "gosi:41", "g"], ["L33-1-1", "gosi:34", "g"], ["L33-1-1", "gosi:36", "g"], ["L30-2-", "gosi:16", "g"], ["L30-2-", "dec:20의2", "c"]], "texts": {"law:30": "① 수입물품의 과세가격은 우리나라에 수출하기 위하여 판매되는 물품에 대하여 구매자가 실제로 지급하였거나 지급하여야 할 가격에 다음 각 호의 금액을 더하여 조정한 거래가격으로 한다. 다만, 다음 각 호의 금액을 더할 때에는 객관적이고 수량화할 수 있는 자료에 근거하여야 하며, 이러한 자료가 없는 경우에는 이 조에 규정된 방법으로 과세가격을 결정하지 아니하고 제31조부터 제35조까지에 규정된 방법으로 과세가격을 결정한다.\n    1. 구매자가 부담하는 수수료와 중개료. 다만, 구매수수료는 제외한다.\n    2. 해당 수입물품과 동일체로 취급되는 용기의 비용과 해당 수입물품의 포장에 드는 노무비와 자재비로서 구매자가 부담하는 비용\n    3. 구매자가 해당 수입물품의 생산 및 수출거래를 위하여 대통령령으로 정하는 물품 및 용역을 무료 또는 인하된 가격으로 직접 또는 간접으로 공급한 경우에는 그 물품 및 용역의 가격 또는 인하차액을 해당 수입물품의 총생산량 등 대통령령으로 정하는 요소를 고려하여 적절히 배분한 금액\n    4. 특허권, 실용신안권, 디자인권, 상표권 및 이와 유사한 권리를 사용하는 대가로 지급하는 것으로서 대통령령으로 정하는 바에 따라 산출된 금액\n    5. 해당 수입물품을 수입한 후 전매·처분 또는 사용하여 생긴 수익금액 중 판매자에게 직접 또는 간접으로 귀속되는 금액\n    6. 수입항(輸入港)까지의 운임·보험료와 그 밖에 운송과 관련되는 비용으로서 대통령령으로 정하는 바에 따라 결정된 금액. 다만, 재정경제부령으로 정하는 수입물품의 경우에는 이의 전부 또는 일부를 제외할 수 있다.\n② 제1항 각 호 외의 부분 본문에서 “구매자가 실제로 지급하였거나 지급하여야 할 가격”이란 해당 수입물품의 대가로서 구매자가 지급하였거나 지급하여야 할 총금액을 말하며, 구매자가 해당 수입물품의 대가와 판매자의 채무를 상계(相計)하는 금액, 구매자가 판매자의 채무를 변제하는 금액, 그 밖의 간접적인 지급액을 포함한다. 다만, 구매자가 지급하였거나 지급하여야 할 총금액에서 다음 각 호의 어느 하나에 해당하는 금액을 명백히 구분할 수 있을 때에는 그 금액을 뺀 금액을 말한다.\n    1. 수입 후에 하는 해당 수입물품의 건설, 설치, 조립, 정비, 유지 또는 해당 수입물품에 관한 기술지원에 필요한 비용\n    2. 수입항에 도착한 후 해당 수입물품을 운송하는 데에 필요한 운임·보험료와 그 밖에 운송과 관련되는 비용\n    3. 우리나라에서 해당 수입물품에 부과된 관세 등의 세금과 그 밖의 공과금\n    4. 연불조건(延拂條件)의 수입인 경우에는 해당 수입물품에 대한 연불이자\n③ 다음 각 호의 어느 하나에 해당하는 경우에는 제1항에 따른 거래가격을 해당 물품의 과세가격으로 하지 아니하고 제31조부터 제35조까지에 규정된 방법으로 과세가격을 결정한다. 이 경우 세관장은 다음 각 호의 어느 하나에 해당하는 것으로 판단하는 근거를 납세의무자에게 미리 서면으로 통보하여 의견을 제시할 기회를 주어야 한다.\n    1. 해당 물품의 처분 또는 사용에 제한이 있는 경우. 다만, 세관장이 제1항에 따른 거래가격에 실질적으로 영향을 미치지 아니한다고 인정하는 제한이 있는 경우 등 대통령령으로 정하는 경우는 제외한다.\n    2. 해당 물품에 대한 거래의 성립 또는 가격의 결정이 금액으로 계산할 수 없는 조건 또는 사정에 따라 영향을 받은 경우\n    3. 해당 물품을 수입한 후에 전매·처분 또는 사용하여 생긴 수익의 일부가 판매자에게 직접 또는 간접으로 귀속되는 경우. 다만, 제1항에 따라 적절히 조정할 수 있는 경우는 제외한다.\n    4. 구매자와 판매자 간에 대통령령으로 정하는 특수관계(이하 “특수관계”라 한다)가 있어 그 특수관계가 해당 물품의 가격에 영향을 미친 경우. 다만, 해당 산업부문의 정상적인 가격결정 관행에 부합하는 방법으로 결정된 경우 등 대통령령으로 정하는 경우는 제외한다.\n④ 세관장은 납세의무자가 제1항에 따른 거래가격으로 가격신고를 한 경우 해당 신고가격이 동종·동질물품 또는 유사물품의 거래가격과 현저한 차이가 있는 등 이를 과세가격으로 인정하기 곤란한 경우로서 대통령령으로 정하는 경우에는 대통령령으로 정하는 바에 따라 납세의무자에게 신고가격이 사실과 같음을 증명할 수 있는 자료를 제출할 것을 요구할 수 있다.\n⑤ 세관장은 납세의무자가 다음 각 호의 어느 하나에 해당하면 제1항과 제2항에 규정된 방법으로 과세가격을 결정하지 아니하고 제31조부터 제35조까지에 규정된 방법으로 과세가격을 결정한다. 이 경우 세관장은 빠른 시일 내에 과세가격 결정을 하기 위하여 납세의무자와 정보교환 등 적절한 협조가 이루어지도록 노력하여야 하고, 신고가격을 과세가격으로 인정하기 곤란한 사유와 과세가격 결정 내용을 해당 납세의무자에게 통보하여야 한다.\n    1. 제4항에 따라 요구받은 자료를 제출하지 아니한 경우\n    2. 제4항의 요구에 따라 제출한 자료가 일반적으로 인정된 회계원칙에 부합하지 아니하게 작성된 경우\n    3. 그 밖에 대통령령으로 정하는 사유에 해당하여 신고가격을 과세가격으로 인정하기 곤란한 경우", "law:31": "① 제30조에 따른 방법으로 과세가격을 결정할 수 없는 경우에는 과세가격으로 인정된 사실이 있는 동종·동질물품의 거래가격으로서 다음 각 호의 요건을 갖춘 가격을 기초로 하여 과세가격을 결정한다.\n    1. 과세가격을 결정하려는 해당 물품의 생산국에서 생산된 것으로서 해당 물품의 선적일(船積日)에 선적되거나 해당 물품의 선적일을 전후하여 가격에 영향을 미치는 시장조건이나 상관행(商慣行)에 변동이 없는 기간 중에 선적되어 우리나라에 수입된 것일 것\n    2. 거래 단계, 거래 수량, 운송 거리, 운송 형태 등이 해당 물품과 같아야 하며, 두 물품 간에 차이가 있는 경우에는 그에 따른 가격차이를 조정한 가격일 것\n② 제1항에 따라 과세가격으로 인정된 사실이 있는 동종·동질물품의 거래가격이라 하더라도 그 가격의 정확성과 진실성을 의심할만한 합리적인 사유가 있는 경우 그 가격은 과세가격 결정의 기초자료에서 제외한다.\n③ 제1항을 적용할 때 동종·동질물품의 거래가격이 둘 이상 있는 경우에는 생산자, 거래 시기, 거래 단계, 거래 수량 등(이하 “거래내용등”이라 한다)이 해당 물품과 가장 유사한 것에 해당하는 물품의 가격을 기초로 하고, 거래내용 등이 같은 물품이 둘 이상이 있고 그 가격도 둘 이상이 있는 경우에는 가장 낮은 가격을 기초로 하여 과세가격을 결정한다.", "law:32": "① 제30조와 제31조에 따른 방법으로 과세가격을 결정할 수 없을 때에는 과세가격으로 인정된 사실이 있는 유사물품의 거래가격으로서 제31조제1항 각 호의 요건을 갖춘 가격을 기초로 하여 과세가격을 결정한다.\n② 제1항에 따라 과세가격으로 인정된 사실이 있는 유사물품의 거래가격이라 하더라도 그 가격의 정확성과 진실성을 의심할만한 합리적인 사유가 있는 경우 그 가격은 과세가격 결정의 기초자료에서 제외한다.\n③ 제1항을 적용할 때 유사물품의 거래가격이 둘 이상이 있는 경우에는 거래내용등이 해당 물품과 가장 유사한 것에 해당하는 물품의 가격을 기초로 하고, 거래내용등이 같은 물품이 둘 이상이 있고 그 가격도 둘 이상이 있는 경우에는 가장 낮은 가격을 기초로 하여 과세가격을 결정한다.", "law:33": "① 제30조부터 제32조까지에 규정된 방법으로 과세가격을 결정할 수 없을 때에는 제1호의 금액에서 제2호부터 제4호까지의 금액을 뺀 가격을 과세가격으로 한다. 다만, 납세의무자가 요청하면 제34조에 따라 과세가격을 결정하되 제34조에 따라 결정할 수 없는 경우에는 이 조, 제35조의 순서에 따라 과세가격을 결정한다.\n    1. 해당 물품, 동종·동질물품 또는 유사물품이 수입된 것과 동일한 상태로 해당 물품의 수입신고일 또는 수입신고일과 거의 동시에 특수관계가 없는 자에게 가장 많은 수량으로 국내에서 판매되는 단위가격을 기초로 하여 산출한 금액\n    2. 국내판매와 관련하여 통상적으로 지급하였거나 지급하여야 할 것으로 합의된 수수료 또는 동종·동류의 수입물품이 국내에서 판매되는 때에 통상적으로 부가되는 이윤 및 일반경비에 해당하는 금액\n    3. 수입항에 도착한 후 국내에서 발생한 통상의 운임·보험료와 그 밖의 관련 비용\n    4. 해당 물품의 수입 및 국내판매와 관련하여 납부하였거나 납부하여야 하는 조세와 그 밖의 공과금\n② 제1항제1호에 따른 국내에서 판매되는 단위가격이라 하더라도 그 가격의 정확성과 진실성을 의심할만한 합리적인 사유가 있는 경우에는 제1항을 적용하지 아니할 수 있다.\n③ 해당 물품, 동종·동질물품 또는 유사물품이 수입된 것과 동일한 상태로 국내에서 판매되는 사례가 없는 경우 납세의무자가 요청할 때에는 해당 물품이 국내에서 가공된 후 특수관계가 없는 자에게 가장 많은 수량으로 판매되는 단위가격을 기초로 하여 산출된 금액에서 다음 각 호의 금액을 뺀 가격을 과세가격으로 한다.\n    1. 제1항제2호부터 제4호까지의 금액\n    2. 국내 가공에 따른 부가가치", "law:34": "① 제30조부터 제33조까지에 규정된 방법으로 과세가격을 결정할 수 없을 때에는 다음 각 호의 금액을 합한 가격을 기초로 하여 과세가격을 결정한다.\n    1. 해당 물품의 생산에 사용된 원자재 비용 및 조립이나 그 밖의 가공에 드는 비용 또는 그 가격\n    2. 수출국 내에서 해당 물품과 동종·동류의 물품의 생산자가 우리나라에 수출하기 위하여 판매할 때 통상적으로 반영하는 이윤 및 일반 경비에 해당하는 금액\n    3. 해당 물품의 수입항까지의 운임·보험료와 그 밖에 운송과 관련된 비용으로서 제30조제1항제6호에 따라 결정된 금액\n② 납세의무자가 제1항 각 호의 금액을 확인하는데 필요한 자료를 제출하지 않은 경우에는 제1항을 적용하지 않을 수 있다.", "law:35": "① 제30조부터 제34조까지에 규정된 방법으로 과세가격을 결정할 수 없을 때에는 대통령령으로 정하는 바에 따라 제30조부터 제34조까지에 규정된 원칙과 부합되는 합리적인 기준에 따라 과세가격을 결정한다.\n② 제1항에 따른 방법으로 과세가격을 결정할 수 없을 때에는 국제거래시세·산지조사가격을 조정한 가격을 적용하는 방법 등 거래의 실질 및 관행에 비추어 합리적으로 인정되는 방법에 따라 과세가격을 결정한다.", "dec:17": " 법 제30조제1항 본문에 따른 우리나라에 수출하기 위하여 판매되는 물품은 해당 물품을 우리나라에 도착하게 한 원인이 되는 거래를 통해 판매되는 물품으로 한다. 다만, 다음 각 호의 물품은 포함되지 않는다.\n    1. 무상으로 국내에 도착하는 물품\n    2. 국내 도착 후 경매 등을 통해 판매가격이 결정되는 위탁판매물품\n    3. 수출자의 책임으로 국내에서 판매하기 위해 국내에 도착하는 물품\n    4. 별개의 독립된 법적 사업체가 아닌 지점 등과의 거래에 따라 국내에 도착하는 물품\n    5. 임대차계약에 따라 국내에 도착하는 물품\n    6. 무상으로 임차하여 국내에 도착하는 물품\n    7. 산업쓰레기 등 수출자의 부담으로 국내에서 폐기하기 위해 국내에 도착하는 물품", "dec:17의2": "① 법 제30조제1항제1호 단서에 따른 구매수수료(이하 “구매수수료”라 한다)는 해당 수입물품의 구매와 관련하여 외국에서 구매자를 대리하여 행하는 용역의 대가로서 구매자가 구매대리인에게 지급하는 비용으로 한다.\n② 구매자가 구매대리인에게 지급한 비용에 구매수수료 외의 비용이 포함된 경우에는 그 지급한 비용 중 구매수수료에 해당하는 금액이 따로 구분하여 산정될 수 있는 경우에만 해당 금액을 구매수수료로 한다.\n③ 세관장은 필요하다고 인정하는 경우 구매수수료에 관한 자료의 제출을 구매자에게 요청할 수 있다.", "dec:18": " 법 제30조제1항제3호에서 “대통령령으로 정하는 물품 및 용역”이란 구매자가 직접 또는 간접으로 공급하는 것으로서 다음 각 호의 어느 하나에 해당하는 것을 말한다.\n    1. 수입물품에 결합되는 재료·구성요소·부분품 및 그 밖에 이와 비슷한 물품\n    2. 수입물품의 생산에 사용되는 공구·금형·다이스 및 그 밖에 이와 비슷한 물품으로서 재정경제부령으로 정하는 것\n    3. 수입물품의 생산과정에 소비되는 물품\n    4. 수입물품의 생산에 필요한 기술·개발·설계·고안·공예 및 디자인. 다만, 우리나라에서 수행된 것은 제외한다.", "dec:18의2": "① 법 제30조제1항제3호에 따라 무료 또는 인하된 가격으로 공급하는 물품 및 용역의 금액(실제 거래가격을 기준으로 산정한 금액을 말하며 국내에서 생산된 물품 및 용역을 공급하는 경우에는 부가가치세를 제외하고 산정한다)을 더하는 경우 다음 각 호의 요소를 고려하여 배분한다.\n    1. 해당 수입물품의 총생산량 대비 실제 수입된 물품의 비율\n    2. 공급하는 물품 및 용역이 해당 수입물품 외의 물품 생산과 함께 관련되어 있는 경우 각 생산 물품별 거래가격(해당 수입물품 외의 물품이 국내에서 생산되는 경우에는 거래가격에서 부가가치세를 제외한다) 합계액 대비 해당 수입물품 거래가격의 비율\n② 제1항에도 불구하고 납세의무자는 법 제30조제1항제3호에 따라 무료 또는 인하된 가격으로 공급하는 물품 및 용역의 가격 또는 인하차액 전액을 최초로 수입되는 물품의 실제로 지급하였거나 지급하여야 할 가격에 배분할 수 있다. 이 경우 수입되는 전체 물품에 관세율이 다른 여러 개의 물품이 혼재된 경우에는 전단에 따른 전액을 관세율이 다른 물품별로 최초로 수입되는 물품의 가격에 안분하여 배분한다.", "dec:19": "① 법 제30조제1항제4호에서 “이와 유사한 권리”라 함은 다음 각호의 1에 해당하는 것을 말한다.\n    1. 저작권 등의 법적 권리\n    2. 법적 권리에는 속하지 아니하지만 경제적 가치를 가지는 것으로서 상당한 노력에 의하여 비밀로 유지된 생산방법·판매방법 기타 사업활동에 유용한 기술상 또는 경영상의 정보 등(이하 “영업비밀”이라 한다)\n② 법 제30조제1항의 규정에 의하여 당해 물품에 대하여 구매자가 실제로 지급하였거나 지급하여야 할 가격에 가산하여야 하는 특허권·실용신안권·디자인권·상표권 및 이와 유사한 권리를 사용하는 대가(특정한 고안이나 창안이 구현되어 있는 수입물품을 이용하여 우리나라에서 그 고안이나 창안을 다른 물품에 재현하는 권리를 사용하는 대가를 제외하며, 이하 “권리사용료”라 한다)는 당해 물품에 관련되고 당해 물품의 거래조건으로 구매자가 직접 또는 간접으로 지급하는 금액으로 한다.\n③ 제2항의 규정을 적용함에 있어서 다음 각호의 1에 해당하는 경우에는 권리사용료가 당해 물품과 관련되는 것으로 본다.\n    1. 권리사용료가 특허권에 대하여 지급되는 때에는 수입물품이 다음 각목의 1에 해당하는 물품인 경우\n      가. 특허발명품\n      나. 방법에 관한 특허에 의하여 생산된 물품\n      다. 국내에서 당해 특허에 의하여 생산될 물품의 부분품·원재료 또는 구성요소로서 그 자체에 당해 특허의 내용의 전부 또는 일부가 구현되어 있는 물품\n      라. 방법에 관한 특허를 실시하기에 적합하게 고안된 설비·기계 및 장치(그 주요특성을 갖춘 부분품 등을 포함한다)\n    2. 권리사용료가 디자인권에 대하여 지급되는 때에는 수입물품이 당해 디자인을 표현하는 물품이거나 국내에서 당해 디자인권에 의하여 생산되는 물품의 부분품 또는 구성요소로서 그 자체에 당해 디자인의 전부 또는 일부가 표현되어 있는 경우\n    3. 권리사용료가 상표권에 대하여 지급되는 때에는 수입물품에 상표가 부착되거나 희석·혼합·분류·단순조립·재포장 등의 경미한 가공후에 상표가 부착되는 경우\n    4. 권리사용료가 저작권에 대하여 지급되는 때에는 수입물품에 가사·선율·영상·컴퓨터소프트웨어 등이 수록되어 있는 경우\n    5. 권리사용료가 실용신안권 또는 영업비밀에 대하여 지급되는 때에는 당해 실용신안권 또는 영업비밀이 수입물품과 제1호의 규정에 준하는 관련이 있는 경우\n    6. 권리사용료가 기타의 권리에 대하여 지급되는 때에는 당해 권리가 수입물품과 제1호 내지 제5호의 규정중 권리의 성격상 당해 권리와 가장 유사한 권리에 대한 규정에 준하는 관련이 있는 경우\n④ 제2항을 적용할 때 컴퓨터소프트웨어에 대하여 지급되는 권리사용료는 컴퓨터소프트웨어가 수록된 마그네틱테이프·마그네틱디스크·시디롬 및 이와 유사한 물품[법 별표 관세율표 번호(이하 “관세율표 번호”라 한다) 제8523호에 속하는 것으로 한정한다]과 관련되지 아니하는 것으로 본다.\n⑤ 제2항의 규정을 적용함에 있어서 다음 각호의 1에 해당하는 경우에는 권리사용료가 당해 물품의 거래조건으로 지급되는 것으로 본다.\n    1. 구매자가 수입물품을 구매하기 위하여 판매자에게 권리사용료를 지급하는 경우\n    2. 수입물품의 구매자와 판매자간의 약정에 따라 구매자가 수입물품을 구매하기 위하여 당해 판매자가 아닌 자에게 권리사용료를 지급하는 경우\n    3. 구매자가 수입물품을 구매하기 위하여 판매자가 아닌 자로부터 특허권 등의 사용에 대한 허락을 받아 판매자에게 그 특허권 등을 사용하게 하고 당해 판매자가 아닌 자에게 권리사용료를 지급하는 경우\n⑥ 제2항을 적용할 때 구매자가 지급하는 권리사용료에 수입물품과 관련이 없는 물품이나 국내 생산 및 그 밖의 사업 등에 대한 활동 대가가 포함되어 있는 경우에는 전체 권리사용료 중 수입물품과 관련된 권리사용료만큼 가산한다. 이 경우 관세청장은 필요한 계산식을 정할 수 있다.", "dec:19의2": " 법 제30조제1항제5호에서 “해당 수입물품을 수입한 후 전매·처분 또는 사용하여 생긴 수익금액”이란 해당 수입물품의 전매·처분대금, 임대료 등을 말한다. 다만, 주식배당금 및 금융서비스의 대가 등 수입물품과 관련이 없는 금액은 제외한다.", "dec:20": "① 법 제30조제1항제6호의 규정에 의한 운임 및 보험료는 당해 사업자가 발급한 운임명세서·보험료명세서 또는 이에 갈음할 수 있는 서류에 의하여 산출한다.\n② 제1항에 따라 운임 및 보험료를 산출할 수 없는 경우의 운임 및 보험료는 운송거리·운송방법 등을 고려하여 재정경제부령으로 정하는 바에 따라 산출한다.\n③ 재정경제부령으로 정하는 물품이 항공기로 운송되는 경우에는 제1항에도 불구하고 해당 물품이 항공기 외의 일반적인 운송방법에 의하여 운송된 것으로 보아 재정경제부령으로 정하는 바에 따라 운임 및 보험료를 산출한다.\n④ 다음 각 호의 어느 하나에 해당하는 물품의 운임(제4호의 경우에는 보험료를 포함한다. 이하 이 조에서 같다)이 통상의 운임과 현저하게 다른 때에는 제1항에도 불구하고 법 제225조제1항에 따른 선박회사 또는 항공사(그 업무를 대행하는 자를 포함한다. 이하 이 항에서 “선박회사등”이라 한다)가 통상적으로 적용하는 운임을 해당 물품의 운임으로 할 수 있다. 이 경우 통상적으로 적용하는 운임의 기준, 적용기한, 그 밖에 필요한 사항은 관세청장이 정한다.\n    1. 수입자 또는 수입자와 특수관계에 있는 선박회사등의 운송수단으로 운송되는 물품\n    2. 운임과 적재수량을 특약한 항해용선계약에 따라 운송되는 물품(실제 적재수량이 특약수량에 미치지 아니하는 경우를 포함한다)\n    3. 기타 특수조건에 의하여 운송되는 물품\n    4. 전쟁, 천재지변 등 불가피한 사유가 발생하여 통상적인 운송경로·운송일정 등과 다르게 운송되는 물품\n⑤ 법 제30조제1항제6호 본문에 따른 금액은 해당 수입물품이 수입항에 도착하여 본선하역준비가 완료될 때까지 발생하는 비용으로 한다.\n⑥ 제3항에 따라 산출된 운임 및 보험료 또는 제4항에 따라 통상적으로 적용하는 운임을 적용받으려는 납세의무자는 해당 물품에 대하여 법 제27조에 따른 가격신고를 할 때 해당 물품이 제3항 또는 제4항에 따른 물품에 해당됨을 증명하는 자료를 세관장에게 제출해야 한다. 다만, 과세가격 금액이 소액인 경우 등으로서 세관장이 자료 제출이 필요하지 않다고 인정하는 경우는 제외한다.\n⑦ 삭제", "dec:20의2": "① 법 제30조제2항 각 호 외의 부분 본문의 “그 밖의 간접적인 지급액”에는 다음 각 호의 금액이 포함되는 것으로 한다.\n    1. 수입물품의 대가 중 전부 또는 일부를 판매자의 요청으로 제3자에게 지급하는 경우 그 금액\n    2. 수입물품의 거래조건으로 판매자 또는 제3자가 수행해야 하는 하자보증을 구매자가 대신하고 그에 해당하는 금액을 할인받았거나 하자보증비 중 전부 또는 일부를 별도로 지급하는 경우 그 금액\n    3. 수입물품의 거래조건으로 구매자가 외국훈련비, 외국교육비 또는 연구개발비 등을 지급하는 경우 그 금액\n    4. 그 밖에 일반적으로 판매자가 부담하는 금융비용 등을 구매자가 지급하는 경우 그 금액\n② 법 제30조제1항 각 호의 가산금액 외에 구매자가 자기의 계산으로 행한 활동의 비용은 같은 조 제2항 각 호 외의 부분 본문의 “그 밖의 간접적인 지급액”으로 보지 않는다.\n③ 법 제30조제2항제4호에 따라 구매자가 지급하였거나 지급하여야 할 총금액에서 수입물품에 대한 연불이자를 빼는 경우는 해당 연불이자가 다음 각 호의 요건을 모두 갖춘 경우로 한다.\n    1. 연불이자가 수입물품의 대가로 실제로 지급하였거나 지급하여야 할 금액과 구분될 것\n    2. 금융계약이 서면으로 체결되었을 것\n    3. 해당 물품이 수입신고된 가격으로 판매되고, 그 이자율은 금융이 제공된 국가에서 당시 금융거래에 통용되는 수준의 이자율을 초과하지 않을 것", "dec:21": " 법 제30조제3항제1호의 규정에 의한 물품의 처분 또는 사용에 제한이 있는 경우에는 다음 각호의 경우가 포함되는 것으로 한다.\n    1. 전시용·자선용·교육용 등 당해 물품을 특정용도로 사용하도록 하는 제한\n    2. 당해 물품을 특정인에게만 판매 또는 임대하도록 하는 제한\n    3. 기타 당해 물품의 가격에 실질적으로 영향을 미치는 제한", "dec:22": "① 법 제30조제3항제1호 단서에서 “거래가격에 실질적으로 영향을 미치지 아니한다고 인정하는 제한이 있는 경우 등 대통령령으로 정하는 경우”란 다음 각 호의 어느 하나에 해당하는 제한이 있는 경우를 말한다.\n    1. 우리나라의 법령이나 법령에 의한 처분에 의하여 부과되거나 요구되는 제한\n    2. 수입물품이 판매될 수 있는 지역의 제한\n    3. 그 밖에 해당 수입물품의 특성, 해당 산업부문의 관행 등을 고려하여 통상적으로 허용되는 제한으로서 수입가격에 실질적으로 영향을 미치지 않는다고 세관장이 인정하는 제한\n② 법 제30조제3항제2호의 규정에 의하여 금액으로 계산할 수 없는 조건 또는 사정에 의하여 영향을 받은 경우에는 다음 각호의 경우가 포함되는 것으로 한다.\n    1. 구매자가 판매자로부터 특정수량의 다른 물품을 구매하는 조건으로 당해 물품의 가격이 결정되는 경우\n    2. 구매자가 판매자에게 판매하는 다른 물품의 가격에 따라 당해 물품의 가격이 결정되는 경우\n    3. 판매자가 반제품을 구매자에게 공급하고 그 대가로 그 완제품의 일정수량을 받는 조건으로 당해 물품의 가격이 결정되는 경우", "dec:23": "① 법 제30조제3항제4호에서 “대통령령으로 정하는 특수관계”란 다음 각 호의 어느 하나에 해당하는 경우를 말한다.\n    1. 구매자와 판매자가 상호 사업상의 임원 또는 관리자인 경우\n    2. 구매자와 판매자가 상호 법률상의 동업자인 경우\n    3. 구매자와 판매자가 고용관계에 있는 경우\n    4. 특정인이 구매자 및 판매자의 의결권 있는 주식을 직접 또는 간접으로 5퍼센트 이상 소유하거나 관리하는 경우\n    5. 구매자 및 판매자중 일방이 상대방에 대하여 법적으로 또는 사실상으로 지시나 통제를 할 수 있는 위치에 있는 등 일방이 상대방을 직접 또는 간접으로 지배하는 경우\n    6. 구매자 및 판매자가 동일한 제3자에 의하여 직접 또는 간접으로 지배를 받는 경우\n    7. 구매자 및 판매자가 동일한 제3자를 직접 또는 간접으로 공동지배하는 경우\n    8. 구매자와 판매자가 「국세기본법 시행령」 제1조의2제1항 각 호의 어느 하나에 해당하는 친족관계에 있는 경우\n② 법 제30조제3항제4호 단서에서 “해당 산업부문의 정상적인 가격결정 관행에 부합하는 방법으로 결정된 경우 등 대통령령으로 정하는 경우”란 다음 각 호의 어느 하나에 해당하는 경우를 말한다.\n    1. 특수관계가 없는 구매자와 판매자간에 통상적으로 이루어지는 가격결정방법으로 결정된 경우\n    2. 당해 산업부문의 정상적인 가격결정 관행에 부합하는 방법으로 결정된 경우 3.해당 물품의 가격이 다음 각 목의 어느 하나의 가격(이하 이 조에서 “비교가격”이라 한다)에 근접하는 가격으로서 재정경제부령으로 정하는 가격에 해당함을 구매자가 입증한 경우. 이 경우 비교가격 산출의 기준시점은 재정경제부령으로 정한다.\n      가. 특수관계가 없는 우리나라의 구매자에게 수출되는 동종·동질물품 또는 유사물품의 거래가격\n      나. 법 제33조 및 법 제34조의 규정에 의하여 결정되는 동종·동질물품 또는 유사물품의 과세가격\n③ 해당 물품의 가격과 비교가격을 비교할 때에는 거래단계, 거래수량 및 법 제30조제1항 각 호의 금액의 차이 등을 고려해야 한다.\n④ 제2항의 규정을 적용받고자 하는 자는 관세청장이 정하는 바에 따라 가격신고를 하는 때에 그 증명에 필요한 자료를 제출하여야 한다.", "dec:24": "① 법 제30조제4항에서 “대통령령으로 정하는 경우”란 다음 각 호의 어느 하나에 해당하는 경우를 말한다.\n    1. 납세의무자가 신고한 가격이 동종·동질물품 또는 유사물품의 가격과 현저한 차이가 있는 경우\n    2. 납세의무자가 동일한 공급자로부터 계속하여 수입하고 있음에도 불구하고 신고한 가격에 현저한 변동이 있는 경우\n    3. 신고한 물품이 원유·광석·곡물 등 국제거래시세가 공표되는 물품인 경우 신고한 가격이 그 국제거래시세와 현저한 차이가 있는 경우\n    3의2. 신고한 물품이 원유·광석·곡물 등으로서 국제거래시세가 공표되지 않는 물품인 경우 관세청장 또는 관세청장이 지정하는 자가 조사한 수입물품의 산지 조사가격이 있는 때에는 신고한 가격이 그 조사가격과 현저한 차이가 있는 경우\n    4. 납세의무자가 거래처를 변경한 경우로서 신고한 가격이 종전의 가격과 현저한 차이가 있는 경우\n    5. 제1호부터 제4호까지의 사유에 준하는 사유로서 재정경제부령으로 정하는 경우\n② 세관장은 법 제30조제4항에 따라 자료제출을 요구하는 경우 그 사유와 자료제출에 필요한 재정경제부령으로 정하는 기간을 적은 서면으로 해야 한다.\n③ 법 제30조제5항제3호에서 “대통령령으로 정하는 사유에 해당하여 신고가격을 과세가격으로 인정하기 곤란한 경우”란 다음 각 호의 어느 하나에 해당하는 경우를 말한다.\n    1. 납세의무자가 제출한 자료가 수입물품의 거래관계를 구체적으로 나타내지 못하는 경우\n    2. 그 밖에 납세의무자가 제출한 자료에 대한 사실관계를 확인할 수 없는 등 신고가격의 정확성이나 진실성을 의심할만한 합리적인 사유가 있는 경우", "dec:25": "① 법 제31조제1항 각 호 외의 부분에서 “동종·동질물품”이란 해당 수입물품의 생산국에서 생산된 것으로서 물리적 특성, 품질 및 소비자 등의 평판을 포함한 모든 면에서 동일한 물품(외양에 경미한 차이가 있을 뿐 그 밖의 모든 면에서 동일한 물품을 포함한다)을 말한다.\n② 법 제31조제1항제1호에서 “선적일”은 수입물품을 수출국에서 우리나라로 운송하기 위하여 선적하는 날로 하며, 선하증권, 송품장 등으로 확인한다. 다만, 선적일의 확인이 곤란한 경우로서 해당 물품의 선적국 및 운송수단이 동종·동질물품의 선적국 및 운송수단과 동일한 경우에는 같은 호에 따른 “선적일”을 “입항일”로, “선적”을 “입항”으로 본다.\n③ 법 제31조제1항제1호에서 “해당 물품의 선적일을 전후하여 가격에 영향을 미치는 시장조건이나 상관행에 변동이 없는 기간”은 해당 물품의 선적일 전 60일과 선적일 후 60일을 합한 기간으로 한다. 다만, 농림축산물 등 계절에 따라 가격의 차이가 심한 물품의 경우에는 선적일 전 30일과 선적일 후 30일을 합한 기간으로 한다.\n④ 법 제31조제1항제2호에 따른 가격차이의 조정은 다음 각 호의 구분에 따른 방법으로 한다.\n    1. 거래 단계가 서로 다른 경우: 수출국에서 통상적으로 인정하는 각 단계별 가격차이를 반영하여 조정\n    2. 거래 수량이 서로 다른 경우: 수량할인 등의 근거자료를 고려하여 가격차이를 조정\n    3. 운송 거리가 서로 다른 경우: 운송 거리에 비례하여 가격차이를 조정\n    4. 운송 형태가 서로 다른 경우: 운송 형태별 통상적으로 적용되는 가격차이를 반영하여 조정\n⑤ 법 제31조제3항을 적용할 때 해당 물품의 생산자가 생산한 동종·동질물품은 다른 생산자가 생산한 동종·동질물품보다 우선하여 적용한다.", "dec:26": "① 법 제32조제1항에서 “유사물품”이라 함은 당해 수입물품의 생산국에서 생산된 것으로서 모든 면에서 동일하지는 아니하지만 동일한 기능을 수행하고 대체사용이 가능할 수 있을 만큼 비슷한 특성과 비슷한 구성요소를 가지고 있는 물품을 말한다.\n② 법 제32조에 따라 과세가격을 결정할 때에는 제25조제2항부터 제5항까지의 규정을 준용한다. 이 경우 “동종·동질물품”은 “유사물품”으로 본다.", "dec:27": "① 법 제33조제1항제1호에서 “국내에서 판매되는 단위가격”이란 수입 후 최초의 거래에서 판매되는 단위가격을 말한다. 다만, 다음 각 호의 어느 하나에 해당하는 경우의 가격은 이를 국내에서 판매되는 단위가격으로 보지 아니한다.\n    1. 최초거래의 구매자가 판매자 또는 수출자와 제23조제1항에 따른 특수관계에 있는 경우\n    2. 최초거래의 구매자가 판매자 또는 수출자에게 제18조 각호의 물품 및 용역을 수입물품의 생산 또는 거래에 관련하여 사용하도록 무료 또는 인하된 가격으로 공급하는 경우\n② 법 제33조제1항제1호에 따른 금액을 산출할 때에는 해당 물품, 동종·동질물품, 유사물품의 순서로 적용한다. 이 경우 해당 수입자가 동종·동질물품 또는 유사물품을 판매하고 있는 경우에는 해당 수입자의 판매가격을 다른 수입자의 판매가격에 우선하여 적용한다.\n③ 법 제33조제1항제1호의 규정을 적용함에 있어서의 수입신고일과 거의 동시에 판매되는 단위가격은 당해 물품의 종류와 특성에 따라 수입신고일의 가격과 가격변동이 거의 없다고 인정되는 기간중의 판매가격으로 한다. 다만, 수입신고일부터 90일이 경과된 후에 판매되는 가격을 제외한다.\n④ 법 제33조제1항제2호에서 “동종·동류의 수입물품”이라 함은 당해 수입물품이 제조되는 특정산업 또는 산업부문에서 생산되고 당해 수입물품과 일반적으로 동일한 범주에 속하는 물품(동종·동질물품 또는 유사물품을 포함한다)을 말한다.\n⑤ 법 제33조제1항제2호에 따른 이윤 및 일반경비는 일체로서 취급하며, 일반적으로 인정된 회계원칙에 따라 작성된 회계보고서를 근거로 하여 다음 각 호의 구분에 따라 계산한다.\n    1. 납세의무자가 제출한 회계보고서를 근거로 계산한 이윤 및 일반경비의 비율이 제6항 또는 제8항에 따라 산출한 이윤 및 일반경비의 비율(이하 이 조에서 “동종·동류비율”이라 한다)의 100분의 120 이하인 경우: 납세의무자가 제출한 이윤 및 일반경비\n    2. 제1호 외의 경우: 동종·동류비율을 적용하여 산출한 이윤 및 일반경비\n⑥ 세관장은 관세청장이 정하는 바에 따라 해당 수입물품의 특성, 거래 규모 등을 고려하여 동종·동류의 수입물품을 선정하고 이 물품이 국내에서 판매되는 때에 부가되는 이윤 및 일반경비의 평균값을 기준으로 동종·동류비율을 산출하여야 한다.\n⑦ 세관장은 동종·동류비율 및 그 산출근거를 납세의무자에게 서면으로 통보하여야 한다.\n⑧ 납세의무자는 세관장이 산출한 동종·동류비율이 불합리하다고 판단될 때에는 제7항에 따른 통보를 받은 날부터 30일 이내에 관세청장이 정하는 바에 따라 해당 납세의무자의 수입물품을 통관했거나 통관할 세관장을 거쳐 관세청장에게 이의를 제기할 수 있다. 이 경우 관세청장은 해당 납세의무자가 제출하는 자료와 관련 업계 또는 단체의 자료를 검토하여 동종·동류비율을 다시 산출할 수 있다.\n⑨ 법 제33조제1항제3호에서 “그 밖의 관련 비용”이란 해당 물품, 동종·동질물품 또는 유사물품의 하역, 검수, 검역, 검사, 통관 비용 등 수입과 관련하여 발생하는 비용을 말한다.\n⑩ 법 제33조제2항에서 “그 가격의 정확성과 진실성을 의심할만한 합리적인 사유가 있는 경우”란 해당 물품의 국내판매가격이 동종·동질물품 또는 유사물품의 국내판매가격보다 현저하게 낮은 경우 등을 말한다.", "dec:28": "① 법 제34조제1항제1호에 해당하는 금액은 해당 물품의 생산자가 생산국에서 일반적으로 인정된 회계원칙에 따라 작성하여 제공하는 회계장부 등 생산에 관한 자료를 근거로 하여 산정한다.\n② 법 제34조제1항제1호에 따른 조립이나 그 밖의 가공에 드는 비용 또는 그 가격에는 법 제30조제1항제2호에 따른 금액이 포함되는 것으로 하며, 우리나라에서 개발된 기술·설계·고안·디자인 또는 공예에 드는 비용을 생산자가 부담하는 경우에는 해당 비용이 포함되는 것으로 한다.", "dec:29": "① 법 제35조에 따라 과세가격을 결정할 때에는 국내에서 이용 가능한 자료를 기초로 다음 각 호의 방법을 적용한다. 이 경우 적용순서는 법 제30조부터 제34조까지의 규정을 따른다.\n    1. 법 제31조 또는 법 제32조의 규정을 적용함에 있어서 법 제31조제1항제1호의 요건을 신축적으로 해석·적용하는 방법\n    2. 법 제33조의 규정을 적용함에 있어서 수입된 것과 동일한 상태로 판매되어야 한다는 요건을 신축적으로 해석·적용하는 방법\n    3. 법 제33조 또는 법 제34조의 규정에 의하여 과세가격으로 인정된 바 있는 동종·동질물품 또는 유사물품의 과세가격을 기초로 과세가격을 결정하는 방법\n    4. 제27조제3항 단서를 적용하지 않는 방법\n    5. 그 밖에 거래의 실질 및 관행에 비추어 합리적이라고 인정되는 방법\n② 법 제35조의 규정에 의하여 과세가격을 결정함에 있어서는 다음 각호의 1에 해당하는 가격을 기준으로 하여서는 아니된다.\n    1. 우리나라에서 생산된 물품의 국내판매가격\n    2. 선택가능한 가격중 반드시 높은 가격을 과세가격으로 하여야 한다는 기준에 따라 결정하는 가격\n    3. 수출국의 국내판매가격\n    4. 동종·동질물품 또는 유사물품에 대하여 법 제34조의 규정에 의한 방법외의 방법으로 생산비용을 기초로 하여 결정된 가격\n    5. 우리나라외의 국가에 수출하는 물품의 가격\n    6. 특정수입물품에 대하여 미리 설정하여 둔 최저과세기준가격\n    7. 자의적 또는 가공적인 가격\n③ 제1항제1호부터 제4호까지의 규정에 따른 방법을 적용하기 곤란하거나 적용할 수 없는 경우로서 다음 각 호의 어느 하나에 해당하는 물품에 대한 과세가격 결정에 필요한 기초자료, 금액의 계산방법 등 세부사항은 재정경제부령으로 정할 수 있다.\n    1. 수입신고전에 변질·손상된 물품\n    2. 여행자 또는 승무원의 휴대품·우편물·탁송품 및 별송품\n    3. 임차수입물품\n    4. 중고물품\n    5. 법 제188조 단서의 규정에 의하여 외국물품으로 보는 물품\n    6. 범칙물품\n    7. 「석유 및 석유대체연료 사업법」 제2조제1호의 석유로서 국제거래시세를 조정한 가격으로 보세구역에서 거래되는 물품\n    8. 그 밖에 과세가격결정에 혼란이 발생할 우려가 있는 물품으로서 재정경제부령으로 정하는 물품", "rule:3의3": " 영 제17조의2제1항에 따른 구매자를 대리하여 행하는 용역은 구매자의 계산과 위험부담으로 공급자 물색, 구매 관련 사항 전달, 샘플수집, 물품검사, 보험·운송·보관 및 인도 등을 알선하는 용역으로 한다. 다만, 다음 각 호의 어느 하나에 해당하는 경우에는 그러하지 아니하다.\n    1. 구매대리인이 자기의 계산으로 용역을 수행하는 경우\n    2. 구매대리인이 해당 수입물품에 대하여 소유권 또는 그 밖의 이와 유사한 권리가 있는 경우\n    3. 구매대리인이 해당 거래나 가격을 통제하여 실질적인 결정권을 행사하는 경우", "rule:4": "① 영 제18조제2호에서 “재정경제부령으로 정하는 것”이란 해당 수입물품의 조립·가공·성형 등의 생산과정에 직접 사용되는 기계·기구 등을 말한다.\n② 영 제18조제4호의 규정에 의한 수입물품의 생산에 필요한 기술은 특허기술·노하우 등 이미 개발되어 있는 기술과 새로이 수행하여 얻은 기술로 한다.\n③ 영 제18조 각 호의 물품 및 용역의 가격은 다음 각 호의 구분에 따른 금액으로 결정한다.\n    1. 해당 물품 및 용역을 영 제23조제1항에 따른 특수관계가 없는 자로부터 구입 또는 임차하여 구매자가 공급하는 경우: 그 구입 또는 임차하는 데에 소요되는 비용과 이를 생산장소까지 운송하는 데에 소요되는 비용을 합한 금액\n    2. 해당 물품 및 용역을 구매자가 직접 생산하여 공급하는 경우: 그 생산비용과 이를 수입물품의 생산장소까지 운송하는 데에 소요되는 비용을 합한 금액\n    3. 해당 물품 및 용역을 구매자와 영 제23조제1항에 따른 특수관계에 있는 자로부터 구입 또는 임차하여 공급하는 경우: 다음 각 목의 어느 하나에 따라 산출된 비용과 이를 수입물품의 생산장소까지 운송하는 데에 소요되는 비용을 합한 금액\n      가. 해당 물품 및 용역의 생산비용\n      나. 특수관계에 있는 자가 해당 물품 및 용역을 구입 또는 임차한 비용\n    4. 수입물품의 생산에 필요한 기술·설계·고안·공예 및 의장(이하 이 호에서 “기술등”이라 한다)이 수입물품 및 국내생산물품에 함께 관련된 경우 : 당해 기술등이 제공되어 생산된 수입물품에 해당되는 기술등의 금액", "rule:4의2": " 구매자가 수입물품과 관련하여 판매자가 아닌 자에게 권리사용료를 지급하는 경우 그 권리사용료가 영 제19조제2항에 따른 해당 물품의 거래조건에 해당하는지를 판단할 때에는 다음 각 호를 고려해야 한다.\n    1. 물품판매계약 또는 물품판매계약 관련 자료에 권리사용료에 대해 기술한 내용이 있는지 여부\n    2. 권리사용계약 또는 권리사용계약 관련 자료에 물품 판매에 대해 기술한 내용이 있는지 여부\n    3. 물품판매계약·권리사용계약 또는 각각의 계약 관련 자료에 권리사용료를 지급하지 않는 경우 물품판매계약이 종료될 수 있다는 조건이 있는지 여부\n    4. 권리사용료가 지급되지 않는 경우 해당 권리가 결합된 물품을 제조·판매하는 것이 금지된다는 조건이 권리사용계약에 있는지 여부\n    5. 상표권 등 권리의 사용을 허락한 자가 품질관리 수준을 초과하여 우리나라에 수출하기 위해 판매되는 물품의 생산 또는 판매 등을 관리할 수 있는 조건이 권리사용계약에 포함되어 있는지 여부\n    6. 그 밖에 실질적으로 권리사용료에 해당하는 지급의무가 있고, 거래조건으로 지급된다고 인정할 만한 거래사실이 존재하는지 여부", "rule:4의3": "① 영 제20조제2항에 따른 운임은 다음 각 호에 따른다.\n    1. 법 제241조제2항제3호의2가목에 따른 운송수단이 외국에서 우리나라로 운항하여 수입되는 경우: 해당 운송수단이 수출항으로부터 수입항에 도착할 때까지의 연료비, 승무원의 급식비, 급료, 수당, 선원 등의 송출비용 및 그 밖의 비용 등 운송에 실제로 소요되는 금액\n    2. 하나의 용선계약으로 여러가지 화물을 여러 차례에 걸쳐 왕복운송하거나 여러가지 화물을 하나의 운송계약에 따라 일괄운임으로 지급하는 경우: 수입되는 물품의 중량을 기준으로 계산하여 배분한 운임. 다만, 수입되는 물품의 중량을 알 수 없거나 중량을 기준으로 계산하는 것이 현저히 불합리한 경우에는 가격을 기준으로 계산하여 배분한 운임으로 한다.\n    3. 운송계약상 선적항 및 수입항의 구분 없이 총 허용정박 시간만 정하여 체선료(滯船料) 또는 조출료(早出料)의 발생장소를 명확히 구분할 수 없는 경우: 총 허용정박 시간을 선적항과 수입항에서의 허용 정박시간으로 반분(半分)하여 계산된 선적항에서의 체선료를 포함한 운임. 이 경우 실제 공제받은 조출료는 운임에 포함하지 않는다.\n    4. 법 제254조의2제6항에 따라 통관하는 탁송품으로서 그 운임을 알 수 없는 경우: 관세청장이 정하는 탁송품 과세운임표에 따른 운임\n② 영 제20조제3항에서 “재정경제부령으로 정하는 물품”이란 다음 각 호의 어느 하나에 해당하는 물품을 말한다.\n    1. 무상으로 반입하는 상품의 견본, 광고용품 및 그 제조용 원료로서 운임 및 보험료를 제외한 총 과세가격이 20만원 이하인 물품\n    2. 수출물품의 제조·가공에 사용할 외화획득용 원재료로서 세관장이 수출계약의 이행에 필요하다고 인정하여 무상으로 반입하는 물품\n    3. 계약조건과 다르거나 하자보증기간 안에 고장이 생긴 수입물품을 대체·수리 또는 보수하기 위해 무상으로 반입하는 물품\n    4. 계약조건과 다르거나 하자보증 기간 안에 고장이 생긴 수입물품을 외국으로 반출한 후 이를 수리하여 무상으로 반입하는 물품으로서 운임 및 보험료를 제외한 총 과세가격이 20만원 이하인 물품\n    5. 계약조건과 다르거나 하자보증 기간 안에 고장이 생긴 수출물품을 수리 또는 대체하기 위해 무상으로 반입하는 물품\n    6. 신문사, 방송국 또는 통신사에서 반입하는 뉴스를 취재한 사진필름, 녹음테이프 및 이와 유사한 취재물품\n    7. 우리나라의 거주자가 받는 물품으로서 자가 사용할 것으로 인정되는 것 중 운임 및 보험료를 제외한 총 과세가격이 20만원 이하인 물품\n    8. 제48조의2제1항에 따른 우리나라 국민, 외국인 또는 재외영주권자가 입국할 때 반입하는 이사화물로서 운임 및 보험료를 제외한 총 과세가격이 50만원 이하인 물품\n    9. 여행자가 휴대하여 반입하는 물품\n    10. 항공사가 자기 소유인 운송수단으로 운송하여 반입하는 항공기용품과 외국의 본사 또는 지사로부터 무상으로 송부받은 해당 운송사업에 사용할 소모품 및 사무용품\n    11. 항공기 외의 일반적인 운송방법으로 운송하기로 계약된 물품으로서 해당 물품의 제작지연, 그 밖에 수입자의 귀책사유가 아닌 사유로 수출자가 그 운송방법의 변경에 따른 비용을 부담하고 항공기로 운송한 물품\n    12. 항공기 외의 일반적인 운송방법으로 운송하기로 계약된 물품으로서 천재지변이나 영 제2조제1항 각 호에 해당하는 사유로 운송수단을 변경하거나 해외 거래처를 변경하여 항공기로 긴급하게 운송하는 물품\n③ 제2항 각 호의 물품은 다음 각 호의 구분에 따라 운임을 산출한다. 이 경우 다음 각 호의 적용 운임이 실제 발생한 항공운임을 초과하는 경우에는 해당 항공운임을 적용한다.\n    1. 제2항제1호부터 제9호까지의 물품: 우리나라에서 적용하고 있는 선편소포우편물요금표에 따른 요금. 이 경우 물품의 중량이 선편소포우편물요금표에 표시된 최대중량을 초과하는 경우에는 최대중량의 요금에 최대중량을 초과하는 중량에 해당하는 요금을 가산하여 계산한다.\n    2. 제2항제10호부터 제12호까지의 물품: 법 제225조제1항에 따른 선박회사(그 업무를 대행하는 자를 포함한다)가 해당 물품에 대해 통상적으로 적용하는 운임\n④ 영 제20조제3항에 따른 제2항 각 호의 물품에 대한 보험료는 보험사업자가 통상적으로 적용하는 항공기 외의 일반적인 운송방법에 대한 보험료로 계산할 수 있다.", "rule:5": "① 영 제23조제2항제3호 각 목 외의 부분에서 “재정경제부령이 정하는 가격”이란 수입가격과 영 제23조제2항제3호 각 목의 가격(이하 “비교가격”이라 한다)과의 차이가 비교가격을 기준으로 하여 비교할 때 100분의 10 이하인 경우를 말한다. 다만, 세관장은 해당 물품의 특성·거래내용·거래관행 등으로 보아 그 수입가격이 합리적이라고 인정되는 때에는 비교가격의 100분의 110을 초과하더라도 비교가격에 근접한 것으로 볼 수 있으며, 수입가격이 불합리한 가격이라고 인정되는 때에는 비교가격의 100분의 110 이하인 경우라도 비교가격에 근접한 것으로 보지 아니할 수 있다.\n② 비교가격은 비교의 목적으로만 사용되어야 하며, 비교가격을 과세가격으로 결정하여서는 아니된다.\n③ 영 제23조제2항제3호 후단에 따른 비교가격 산출의 기준시점은 다음 각 호와 같다.\n    1. 특수관계가 없는 우리나라의 구매자에게 수출되는 동종·동질물품 또는 유사물품의 거래가격: 선적 시점\n    2. 법 제33조에 따라 결정되는 동종·동질물품 또는 유사물품의 과세가격: 국내판매 시점\n    3. 법 제34조에 따라 결정되는 동종·동질물품 또는 유사물품의 과세가격: 수입신고 시점", "rule:5의2": " 영 제24조제2항에 따른 “재정경제부령으로 정하는 기간”은 자료제출 요구일로부터 15일로 한다. 다만, 부득이한 사유로 납세의무자가 자료제출 기간 연장을 요청하는 경우에는 세관장이 해당 사유를 고려하여 타당하다고 인정하는 기간으로 한다.", "rule:7": "① 영 제29조제1항제1호에서 “법 제31조제1항제1호의 요건을 신축적으로 해석·적용하는 방법”이라 함은 다음 각호의 방법을 말한다.\n    1. 당해 물품의 생산국에서 생산된 것이라는 장소적 요건을 다른 생산국에서 생산된 것으로 확대하여 해석·적용하는 방법\n    2. 당해 물품의 선적일 또는 선적일 전후라는 시간적 요건을 선적일 전후 90일로 확대하여 해석·적용하는 방법. 다만, 가격에 영향을 미치는 시장조건이나 상관행(商慣行)이 유사한 경우에는 90일을 초과하는 기간으로 확대하여 해석·적용할 수 있다.\n② 영 제29조제1항제2호에서 “수입된 것과 동일한 상태로 판매하여야 한다는 요건을 신축적으로 해석·적용하는 방법”이라 함은 납세의무자의 요청이 없는 경우에도 법 제33조제3항에 따라 과세가격을 결정하는 방법을 말한다.\n③ 영 제29조제1항제4호에서 “제27조제3항 단서를 적용하지 않는 방법”이란 수입신고일부터 180일까지 판매되는 가격을 적용하는 방법을 말한다.", "rule:7의2": " 영 제29조제3항제1호에 해당하는 물품의 과세가격은 다음 각 호의 가격을 기초로 하여 결정할 수 있다.\n    1. 변질 또는 손상으로 인해 구매자와 판매자간에 다시 결정된 가격\n    2. 변질 또는 손상되지 않은 물품의 가격에서 다음 각 목 중 어느 하나의 금액을 공제한 가격\n      가. 관련 법령에 따른 감정기관의 손해평가액\n      나. 수리 또는 개체(改替)비용\n      다. 보험회사의 손해보상액", "rule:7의3": "① 영 제29조제3항제2호에 따른 여행자 또는 승무원의 휴대품·우편물·탁송품 및 별송품(이하 “여행자 휴대품·우편물등”이라 한다)의 과세가격을 결정하는 때에는 다음 각 호의 가격을 기초로 하여 결정할 수 있다.\n    1. 신고인의 제출 서류에 명시된 신고인의 결제금액(명칭 및 형식에 관계없이 모든 성격의 지급수단으로 결제한 금액을 말한다)\n    2. 외국에서 통상적으로 거래되는 가격으로서 객관적으로 조사된 가격\n    3. 해당 물품과 동종·동질물품 또는 유사물품의 국내도매가격에 관세청장이 정하는 시가역산율을 적용하여 산출한 가격\n    4. 관련 법령에 따른 감정기관의 감정가격\n    5. 중고 승용차(화물자동차를 포함한다) 및 이륜자동차에 대해 제1호 또는 제2호를 적용하는 경우 최초 등록일 또는 사용일부터 수입신고일까지의 사용으로 인한 가치감소에 대해 관세청장이 정하는 기준을 적용하여 산출한 가격\n    6. 그 밖에 신고인이 제시하는 가격으로서 세관장이 타당하다고 인정하는 가격\n② 제1항제3호의 국내도매가격을 산출하려는 경우에는 다음 각 호의 방법에 따른다.\n    1. 해당 물품과 동종·동질물품 또는 유사물품을 취급하는 2곳 이상의 수입물품 거래처(인터넷을 통한 전자상거래처를 포함한다)의 국내도매가격을 조사해야 한다. 다만, 다음 각 목의 경우에는 1곳의 수입물품 거래처만 조사하는 등 국내도매가격 조사방법을 신축적으로 적용할 수 있다.\n      가. 국내도매가격이 200만원 이하인 물품으로 신속한 통관이 필요한 경우\n      나. 물품 특성상 2곳 이상의 거래처를 조사할 수 없는 경우\n      다. 과세가격 결정에 지장이 없다고 세관장이 인정하는 경우\n    2. 제1호에 따라 조사된 가격이 둘 이상인 경우에는 다음 각 목에 따라 국내도매가격을 결정한다.\n      가. 조사된 가격 중 가장 낮은 가격을 기준으로 최고가격과 최저가격의 차이가 10%를 초과하는 경우에는 조사된 가격의 평균가격\n      나. 조사된 가격 중 가장 낮은 가격을 기준으로 최고가격과 최저가격의 차이가 10% 이하인 경우에는 조사된 가격 중 최저가격\n③ 제1항제3호의 시가역산율은 국내도매가격에서 법 제33조제1항제2호부터 제4호까지의 금액을 공제하여 과세가격을 산정하기 위한 비율을 말하며, 산출방법은 관세청장이 정하는 바에 따른다.", "rule:7의4": "① 영 제29조제3항제3호에 따른 임차수입물품의 과세가격은 다음 각 호를 순차적으로 적용한 가격을 기초로 하여 결정할 수 있다.\n    1. 임차료의 산출 기초가 되는 해당 임차수입물품의 가격\n    2. 해당 임차수입물품, 동종·동질물품 또는 유사물품을 우리나라에 수출할 때 공개된 가격자료에 기재된 가격(중고물품의 경우에는 제7조의5에 따라 결정된 가격을 말한다)\n    3. 해당 임차수입물품의 경제적 내구연한 동안 지급될 총 예상임차료를 기초로 하여 계산한 가격. 다만, 세관장이 일률적인 내구연한의 적용이 불합리하다고 판단하는 경우는 제외한다.\n    4. 임차하여 수입하는 물품에 대해 수입자가 구매선택권을 가지는 경우에는 임차계약상 구매선택권을 행사할 수 있을 때까지 지급할 총 예상임차료와 구매선택권을 행사하는 때에 지급해야 할 금액의 현재가격(제2항제2호 및 제3호를 적용하여 산정한 가격을 말한다)의 합계액을 기초로 하여 결정한 가격\n    5. 그 밖에 세관장이 타당하다고 인정하는 합리적인 가격\n② 제1항제3호에 따라 과세가격을 결정할 때에는 다음 각 호에 따른다.\n    1. 해당 수입물품의 경제적 내구연한 동안에 지급될 총 예상임차료(해당 물품을 수입한 후 이를 정상으로 유지 사용하기 위해 소요되는 비용이 임차료에 포함되어 있을 때에는 그에 상당하는 실비를 공제한 총 예상임차료)를 현재가격으로 환산한 가격을 기초로 한다.\n    2. 수입자가 임차료 외의 명목으로 정기적 또는 비정기적으로 지급하는 특허권 등의 사용료 또는 해당 물품의 거래조건으로 별도로 지급하는 비용이 있는 경우에는 이를 임차료에 포함한다.\n    3. 현재가격을 계산하는 때에 적용할 이자율은 임차계약서에 따르되, 해당 계약서에 이자율이 정해져 있지 않거나 규정된 이자율이 제9조의3에서 정한 이자율 이상인 때에는 제9조의3에서 정한 이자율을 적용한다.", "rule:7의5": "① 영 제29조제3항제4호에 따른 중고물품의 과세가격은 다음 각 호의 가격을 기초로 하여 결정할 수 있다.\n    1. 관련 법령에 따른 감정기관의 감정가격\n    2. 국내도매가격에 제7조의3제1항제3호의 시가역산율을 적용하여 산출한 가격\n    3. 해외로부터 수입되어 국내에서 거래되는 신품 또는 중고물품의 수입당시의 과세가격을 기초로 하여 가치감소분을 공제한 가격. 다만, 내용연수가 경과된 물품의 경우는 제외한다.\n    4. 그 밖에 세관장이 타당하다고 인정하는 합리적인 가격\n② 제1항제3호의 가치감소 산정기준은 관세청장이 정할 수 있다.", "rule:7의6": "① 영 제29조제3항제5호에 따라 내국물품과 외국물품의 혼용에 관한 승인을 받아 제조된 물품의 과세가격은 다음의 산식에 따른다.\n    제품가격 × [외국물품가격/ (외국물품가격 + 내국물품가격)]\n② 제1항을 적용할 때 제품가격, 외국물품가격 및 내국물품 가격은 다음 각 호의 방법으로 결정한다.\n    1. 제품가격은 보세공장에서 외국물품과 내국물품을 혼용하여 제조된 물품의 가격으로 하며, 법 제30조부터 제35조까지에서 정하는 방법에 따른다.\n    2. 제조에 사용된 외국물품의 가격은 법 제30조부터 제35조까지에서 정하는 방법에 따른다.\n    3. 제조에 사용된 내국물품의 가격은 해당 보세공장에서 구매한 가격으로 한다.\n    4. 제3호에도 불구하고 다음 각 목의 어느 하나에 해당하는 경우에는 해당 물품과 동일하거나 유사한 물품의 국내판매가격을 구매가격으로 한다. 이 경우 거래 단계 등이 같아야 하며, 두 물품 간 거래 단계 등에 차이가 있는 경우에는 그에 따른 가격 차이를 조정해야 한다.\n      가. 구매자와 판매자가 영 제23조제1항 각 호에서 정하는 특수관계가 있는 경우\n      나. 영 제18조 각 호에서 정하는 물품 및 용역을 무료 또는 인하된 가격으로 직접 또는 간접으로 공급한 사실이 있는 경우\n    5. 제2호부터 제4호까지의 가격은 법 제186조제1항에 따라 사용신고를 하는 때에 이를 확인해야 하며, 각각 사용신고 하는 때의 원화가격으로 결정한다.", "rule:7의7": " 영 제29조제3항제6호에 따른 범칙물품의 과세가격은 제7조의2부터 제7조의6까지 및 제7조의8에 따라 결정한다.", "rule:7의8": "① 영 제29조제3항제7호에 따른 국제거래시세를 조정한 가격으로 보세구역에서 거래되는 석유의 과세가격은 보세구역에서 거래되어 판매된 가격을 알 수 있는 송품장, 계약서 등의 자료를 기초로 하여 결정할 수 있다.\n② 국내에서 발생한 하역비, 보관료 등의 비용이 제1항의 보세구역에서 거래되어 판매된 가격에 포함되어 있고, 이를 입증자료를 통해 구분할 수 있는 경우 그 비용을 해당 가격에서 공제할 수 있다.", "gosi:13": " 수입물품의 과세가격은 법 제30조에 따른 과세가격 결정방법(이하 \"제1방법\"이라 한다)을 우선 적용하고 제1방법을 적용할 수 없는 경우에는 법 제31조부터 제35조까지에 따른 과세가격 결정방법(이하 각각 \"제2방법\", \"제3방법\", \"제4방법\", \"제5방법\", \"제6방법\"이라 한다)을 순차적으로 적용하여 결정한다. 다만, 법 제33조제1항 단서에 따라 납세의무자가 요청하면 제5방법을 우선 적용하되 제5방법을 적용할 수 없는 경우에는 제4방법, 제6방법의 순서에 따라 적용한다.", "gosi:14": " 제13조 본문에 따라 제1방법을 적용할 수 없는 경우는 다음 각 호의 어느 하나를 포함한다.\n    1. 영 제17조 각 호의 어느 하나에 해당하는 경우를 포함하여 제15조제1항에 따른 판매의 결과로 우리나라에 도착한 물품이 아닌 경우\n    2. 제15조제2항 및 법 제30조제1항 각 호 외의 부분 본문에 따른 우리나라에 수출하기 위한 판매(이하 \"수출판매\"라 한다)를 확인할 수 없는 경우\n    3. 제16조제1항 각 호 및 법 제30조제1항 각 호 외의 부분 본문의 수입물품에 대하여 구매자가 실제로 지급하였거나 지급하여야 할 가격을 확인할 수 없는 경우\n    4. 법 제30조제1항 각 호 외의 부분 단서에 해당하는 경우\n    5. 법 제30조제3항 각 호의 어느 하나에 해당하는 경우\n    6. 법 제30조제5항 각 호의 어느 하나에 해당하는 경우", "gosi:15": "① 법 제30조제1항 각 호 외의 부분 본문에서 판매는 각각 자기 책임과 계산으로 해당 수입물품에 대한 대가를 지급하고 소유권 이전을 목적으로 하는 구매자와 판매자 간의 거래를 말한다.\n② 법 제30조제1항 각 호 외의 부분 본문에서 우리나라에 수출하기 위하여 판매되는 물품에 대한 가격은 해당 물품의 실제적인 국제 간 이동을 수반하는 거래로서 우리나라에 도착하기 직전에 이루어진 판매에서의 가격을 말한다.", "gosi:16": "① 법 제30조제1항 각 호 외의 부분 본문에서 \"구매자가 실제로 지급하였거나 지급하여야 할 가격\"(이하 \"실제지급가격\"이라 한다)은 다음 각 호의 금액을 포함한다.\n    1. 해당 수입물품에 대하여 구매자가 판매자에게 또는 판매자의 이익을 위하여 제3자에게 실제 지급하였거나 지급하여야 할 모든 금액\n    2. 해당 수입물품의 판매조건으로 구매자가 판매자에게 또는 판매자의 의무를 이행하기 위하여 제3자에게 실제 지급하였거나 지급하여야 할 모든 금액\n② 해당 수입물품이 우리나라에 도착한 이후에 구매자와 판매자 간에 이루어지는 가격에 대한 환불, 감액 등은 실제지급가격을 결정할 때 고려되지 않는다. 다만, 해당 수입물품이 우리나라에 도착하기 이전에 규칙 제3조제3항제3호 각 목의 요건을 모두 충족하는 가격조정약관이 유효하게 존재하고해당 수입물품의 가격이 해당 가격조정약관에 따른 경우에는 그렇지 않다.", "gosi:17": " 법 제30조제1항제1호에서 \"수수료와 중개료\"란 다음 각 호를 말한다.\n    1. 수수료는 해당 수입물품을 구매 또는 판매함에 있어서 구매자 또는 판매자를 대리하여 행하는 용역의 대가로 구매자 또는 판매자가 지급하는 비용을 말한다.\n    2. 중개료는 판매자와 구매자를 위하여 거래알선 및 중개역할의 대가로 판매자 및 구매자가 지급하는 비용을 말한다.", "gosi:18": " 법 제30조제1항제2호에서 \"해당 수입물품과 동일체로 취급되는 용기\"란 관세율표의 해석에 관한 통칙 제5호에 따라 그 내용물과 함께 분류되는 케이스, 용기 및 포장용기 등을 말한다.", "gosi:19": "① 법 제30조제1항제3호에서 \"해당 수입물품의 생산\"이란 재배, 제조, 채광, 채취, 가공, 조립 등 해당 물품을 만들어 내거나 가치를 창출해내는 행위를 말한다.\n② 구매자가 영 제18조의 생산지원 물품 및 용역의 생산에 필요한 요소를 제공한 경우에는 해당요소의 비용까지 과세가격에 포함한다.\n③ 영 제18조제1호부터 제3호까지의 생산지원 물품에 영 제18조제4호의 생산지원 용역이 반영되어 있는 경우에는 해당 용역의 국내 수행 여부와 관계없이 생산지원 가격에 포함한다.\n④ 영 제18조제2호의 \"공구·금형·다이스\"에는 수입물품의 생산에 직접 사용되는 종이로 만든 형태의 표본도 포함한다.", "gosi:20": " 영 제18조의2에 따라 생산지원 물품 및 용역의 가격(인하차액을 포함한다)을 배분할 때에는 다음 각 호의 방법에 따른다.\n    1. 납세의무자는 영 제18조의2제2항에 따라 생산지원의 가격 전액을 최초로 수입되는 물품의 가격에 가산하는 때에는 법 제27조에 따라 최초로 수입되는 물품의 가격신고를 하는 때에 일시에 납부하고자 하는 생산지원의 가격 전액에 대한 산출기준 및 상세 계산내역을 세관장에게 제출하여야 한다.\n    2. 생산지원 용역이 생산지원 용역에 의해 생산된 수입물품과 국내생산물품에 함께 관련된 때에는 생산지원 용역의 가격에 생산지원 용역에 의해 생산된 전체물품의 가격 중에서 해당 수입물품의 가격이 차지하는 비율을 곱하여 산출한 금액(이하 \"조정액\"이라 한다)을 해당 수입물품의 가격에 가산한다.\n    3. 생산지원 용역이 생산지원 용역에 의해 생산된 수입물품과 국내생산물품에 함께 관련되고 또한 해당 수입물품이 여러 종류의 물품에 함께 관련되어 분할 수입되는 때에는 생산지원 용역의 가격을 해당 수입물품별로 가격에 따라 조정액을 안분하여 가산하며, 그 안분방법은 먼저 가산율을 산출 하고 그 가산율을 해당 수입물품별 가격에 곱한다.\n    4. 제3호의 가산율 산정은 생산지원 용역에 의해 생산된 수입물품의 총가격에서 조정액이 차지하는 구성비로 계산한다.\n    5. 조정액 산출시에 적용하는 물품가격은 수입물품에 대하여는 실제지급가격으로 하고 국내생산물품에 대하여는 부가가치세가 포함되지 아니한 가격으로 한다.", "gosi:21": "① 영 제19조제2항에 따라 권리사용료의 가산여부를 판단하는 경우 권리사용료가 지급되는 장소 또는 권리허락자의 소재지는 고려하지 않는다.\n② 규칙 제4조의2제6호의 그 밖에 실질적으로 권리사용료에 해당하는 지급의무가 있고, 거래조건으로 지급된다고 인정할 만한 거래사실은 다음 각호의 어느 하나를 포함한다.\n    1. 수입물품의 판매자와 권리사용료를 지급받는 자 또는 권리권자가 영 제23조제1항의 특수관계에 해당하는 경우\n    2. 특허권 등의 권리권자가 수입물품의 판매자를 선정 또는 지정하는 등 구매자에게 수입물품의 구매에 대한 실질적인 선택권이 없다고 인정되는 경우\n    3. 구매자가 특허권 등(상표권은 제외한다)의 권리권자로부터 수입물품과 관련된 특허권 등에 대한 전용실시권을 허락받아 판매자에게 그 특허권 등에 대한 통상실시권을 허락하고 구매자가 해당 권리권자에게 해당 특허권 등에 대한 권리사용료를 지급하는 경우\n③ 권리사용료를 실제지급가격에 가산하는 경우 다음 각 호의 요건을 모두 충족하는 경우에 한하여 제20조의 가산방법을 준용할 수 있다.\n    1. 납세의무자 등이 다음 각 목의 어느 하나에 해당되는 경우\n      가. 납세의무자가 AEO승인(수입분야)업체인 경우\n      나. 수입신고 1건당 가산할 권리사용료에 해당하는 세액이 5만원 미만인 경우\n      다. 수입물품이 법 제37조제1항제3호에 따라 사전심사를 신청하여 심사결과 결정된 과세가격 결정방법을 적용하는 물품인 경우\n    2. 납세의무자가 권리사용료 산출을 사유로 제6조에 따라 해당 모든 수입신고 건별로 잠정가격신고를 하고 제8조에 따라 확정가격신고를 하는 경우\n    3. 납세의무자가 권리사용료에 대한 관세 등을 일시에 납부하고자 별지 제15호서식의 확정가격 일괄신고 신청서를 제출하는 경우", "gosi:22": "① 영 제19조제6항의 \"계산식\"이란 다음 각 호를 말한다.\n    1. 수입물품이 완제품(수입후 경미한 조립, 혼합, 희석, 분류, 가공 또는 재포장 등의 작업이 이루어지는 경우를 포함한다)인 경우에는 이와 관련하여총지급 권리사용료 전액을 가산한다.\n    2. 수입물품이 국내에서 생산될 물품의 부분품, 원재료, 구성요소 등(이하 \"수입부분품 등\"이라 한다)이라도 해당 권리가 수입물품에만 관련되는 경우에는 이와 관련하여 총지급 권리사용료 전액을 가산한다. 다만, 총지급 권리사용료가 수입부분품 등 뿐만 아니라 국내에서 생산될 완제품 전체와 관련된 경우에는 총지급 권리사용료에 완제품의 가격(제조원가에서 세금 및 권리사용료를 제외한 금액을 말한다) 중 수입부분품 등의 가격이 차지하는 비율을 곱하여 산출된 권리사용료 금액을 가산한다.\n    3. 수입물품이 방법에 관한 특허를 실시하기에 적합하게 고안된 설비, 기계 및 장치(그 주요특성을 갖춘 부분품 등을 포함한다)인 경우에는 이와 관련하여 총지급 권리사용료 전액을 가산한다. 다만, 총지급 권리사용료는 특정한 완제품을 생산하는 전체방법이나 제조공정에 관한 대가이고, 수입하는 물품은 그 중 일부공정을 실시하기 위한 설비 등인 경우에는 총지급 권리사용료에 권리사용료와 관련이 있는 전체 설비 등의 가격 중 권리사용료와 관련이 있는 수입설비 등의 가격이 차지하는 비율을 곱하여 산출된 금액을 가산한다.\n    4. 권리사용료의 지급원인이 되는 물품이 장기간 반복하여 수입되는 경우에는 권리사용료의 안분을 위한 조정액과 가산율은 다음 각 목이 정하는 바에 따라 산출한다.\n      가. 수입물품이 제2호 단서에 해당하는 물품인 경우\n      나. 수입물품이 제3호 단서에 해당하는 물품인 경우\n② 제1항에 따라 총지급 권리사용료를 계산하려는 경우에는 다음 각 호에 따른다.\n    1. 제1항의 총지급 권리사용료는 구매자가 지급하는 권리사용료에 수입물품과 관련이 없는 그 밖의 사업 등에 대한 활동 대가가 포함되어 있을 때에는 그 대가를 뺀 금액을 말한다. 이 경우 해당 금액은 납세의무자가 제출한 일반적으로 인정된 회계원칙에 따라 작성된 자료 등 객관적이고 수량화할 수 있는 자료에 근거하여 적절하게 조정하여 계산할 수 있다.\n    2. 권리사용 계약에 따라 지급하여야 할 권리사용료에 대한 원천징수세액을 포함한다.\n    3. 권리사용료가 수입물품을 사용하여 생산된 제품의 생산량 또는 판매량에 따라 장기간에 걸쳐 지급되는 경우에는 해당 수입물품의 사용연수, 생산능력 및 생산되는 제품의 수요 상황 등을 고려하여 객관적이고 수량화할 수 있는 자료를 근거로 합리적으로 산출할 수 있다.\n③ 제1항에 따라 권리사용료를 계산할 때 수입물품의 가격은 다음 각 호에 따른다.\n    1. 수입물품의 가격은 가산하려는 권리사용료를 제외하고 법 제30조제1항 각 호의 금액을 더한 거래가격을 말한다.\n    2. 제1항제4호가목의 수입부분품 등의 가격은 일반적으로 인정된 회계원칙에 따라 작성된 회계보고서 등에 따라 일정기간 동안 완제품의 가격에 포함된 수입원재료의 가격을 말한다.\n④ 제1항에 따라 권리사용료를 계산할 때 제1항제2호 및 제4호가목에 따른 완제품의 가격은 다음 각 호에 따른다.\n    1. 완제품가격에서 제조원가는 직접재료비(수입원재료와 국내원재료를 포함한다)에 직접노무비 및 제조간접비를 더한 금액으로 판매비와 관리비, 이윤 등은 포함되지 않는다.\n    2. 완제품가격에서 제외되는 세금에는 관세, 부가가치세 등을 포함한다. 다만, 완제품의 제조원가에 세금이 포함되어 있는 경우에만 해당한다.\n    3. 제1항제4호가목에 따른 조정액을 계산할 때 완제품가격에서 제외되는 권리사용료는 일반적으로 인정된 회계원칙에 따라 제조원가에 반영된 권리사용료를 말한다.", "gosi:23": " 법 제30조제1항제5호에 따른 해당 수입물품을 수입한 후 전매·처분 또는 사용하여 생긴 수익금액은 해당 수입물품과의 거래조건 해당 여부와 관계없이 과세가격에 가산한다.", "gosi:24": "① 법 제30조제1항제6호, 법 제30조제2항제2호, 법 제33조제1항제3호 및 법 제34조제1항제3호에서 \"수입항\"이란 해당 수입물품이 외국에서 우리나라에 도착한 운송수단으로부터 양륙(일시 양륙은 제외한다)이 이루어지는 항구 또는 공항을 말한다.\n② 영 제20조제5항에서 \"수입항에 도착하여 본선하역준비가 완료될 때\"란 수입물품의 양륙을 할 수 있는 상태가 된 때를 말한다. 이 경우 항해용선계약에서는 상법 제838조제1항에 따른 통지를 발송한 때를 말한다.\n③ 법 제30조제1항제6호에 따른 금액은 해당 수입물품을 수입항까지 운송하기 위하여 발생하는 비용으로서, 다음 각 호의 금액을 말한다.\n    1. 수입물품을 운송계약에 따라 운송하는 때에는 해당 운송계약에 의하여 해당 운송의 대가로서 운송인 또는 운송주선인 등에게 실제로 지급되는 금액\n    2. 수입물품을 용선계약에 따라 운송하는 때에는 해당 용선계약에 의하여 실제로 지급되는 모든 금액(공선회조료를 포함한다)\n④ 제3항에 따른 금액은 다음 각 호의 어느 하나에 따른 방법으로 결정한다.\n    1. 수입물품을 운송하기 위한 선적자재비(資材費           改裝費) 및 선박개장비(   )를 지급한 경우에는 동 비용을 포함한다.\n    2. 수입물품의 운임에 수입항에서의 하역비가 포함되어 있고 그 금액이 구분 표시되어 있는 경우에는 동 하역비는 과세가격에 포함하지 아니한다.\n    3. 구매자(수입자 포함)가 부담하는 선적항에서의 체선료는 과세가격에 포함하며, 선적항에서의 조출료를 공제받은 경우에는 이를 과세가격에 포함하지 아니한다. 다만, 조출료는 수입통관시에 그 금액을 확인할 수 있는 경우에 한하되, 잠정가격신고의 경우 확정가격 신고일까지 그 금액을 확인할 수 있는 서류제출에 의하여 과세가격에 포함하지 아니한다.\n    4. 항해용선계약에서 수입물품의 운임과 구분되는 수입항에서의 체선료는 과세가격에 포함하지 아니하고 수입항에서의 조출료는 과세가격에서 공제하지 아니한다.\n    5. 컨테이너에 의한 문전배달형태(Door to Door)의 운송계약의 경우에 그 운송료가 구분되는 때에는 수입항 도착 이후의 운송료는 과세가격에 포함하지 아니한다.\n    6. 컨테이너 임차료가 운임과 별도로 지급되는 경우에는 컨테이너의 임차에 소요되는 비용은 과세가격에 포함한다.\n    7. 수입항에서의 도선료, 예선료, 강취료가 수입물품의 운임과 구분되는 경우에는 이를 과세가격에 포함하지 아니한다.\n    8. 규칙 제4조의3제1항제4호의 탁송품 과세운임표에 따른 운임은 별표 제1호와 같다. 이 경우 규칙 제4조의3제1항제4호에서 \"운임을 알 수 없는 경우\"란 수입신고를 할 때 운임명세서 또는 이에 갈음할 수 있는 서류에서 수입항까지의 운임을 구분할 수 없는 경우를 말한다.\n⑤ 제3항에 따른 운임 등은 실제지급가격에 포함되어 있지 않은 범위 내에서 해당 실제지급가격에 가산한다. 이 경우 해당 운임 등이 실제지급가격에 포함되어 있는지 여부에 대한 판단은 다음 각 호에 따른다.\n    1. 수출판매 계약에 따라 수입항까지의 운임 등을 판매자가 지급하기로 한 경우에는 실제지급가격에 포함되어 있는 것으로 취급하여, 실제로 지급되는 운임 등을 고려하지 않는다. 다만, 구매자가 실제지급가격과 별도로 지급하는 수입항까지의 운임 등은 실제지급가격에 가산한다.\n    2. 수출판매 계약에 따라 수입항까지의 운임 등을 구매자가 지급하기로 한 경우에는 실제지급가격에 포함되어 있지 않는 것으로 취급하여, 해당 수입항까지의 운임 등을 실제지급가격에 가산한다.\n    3. 수출판매 계약에 따라 선박으로 운송하기로 한 수입물품이 항공으로 운송된 경우(규칙 제4조의3제2항의 적용을 받는 경우는 제외한다)에는 다음 각 목에 따른다.\n      가. 해당 계약에 따라 판매자가 수입항까지의 운임 등을 지급하기로 한 경우: 해당 운송방법의 변경에 따른 비용을 구매자가 지급하는 때에는 실제지급가격에 가산하며, 판매자가 지급하는 때에는 실제지급가격에 포함된 것으로 취급한다.\n      나. 해당 계약에 따라 구매자가 수입항까지의 운임 등을 지급하기로 한 경우: 해당 운송방법의 변경에 따른 비용은 실제지급가격에 가산한다.\n      다. 나목에도 불구하고 해당 운송방법의 변경에 따른 비용을 당초 계약의 약정에 따라 판매자가 지급한 사실이 객관적인 자료로 확인되는 경우에는 실제지급가격에 포함되어 있는 것으로 취급한다.", "gosi:25": "① 영 제20조제4항의 \"선박회사등이 통상적으로 적용하는 운임\"(이하 \"통상운임\"이라 한다)이란 해당 물품의 종류, 수량 및 운송조건(운송수단의 종류와 운송경로 등을 말한다)을 고려하여 통상 필요하다고 인정되는 수입항까지의 운송을 위한 운임 등을 말한다.\n② 제24조제3항에 따른 운임 등이 무료인 경우에는 제1항에 따른 통상운임을 적용한다.", "gosi:26": "① 보험료는 수입물품에 대하여 실제로 보험에 가입된 경우에만 실제지급가격에 가산한다.\n② 보험료는 영 제20조제1항에 따라 해당 사업자가 발급한 보험료명세서 또는 이에 갈음할 수 있는 서류에 근거하여 계산한다. 다만, 포괄예정보험에따른 경우에는 다음 각 호의 어느 하나의 방법으로 계산한다.\n    1. 수입신고시에 보험사업자가 발행한 보험료명세서를 제출하는 경우에는 이를 보험료로 계산한다.\n    2. 보험료명세서로 보험료를 계산할 수 없는 경우에는 보험사업자가 발급한 보험예정서류에 근거해 잠정계산하고 보험료가 확정되면 즉시 실제지급한 보험료명세서에 따라 확정 신고한다.\n    3. 제1호 및 제2호에도 불구하고 수입자는 포괄예정보험이 적용되는 최초 수입물품의 수입신고시에 포괄예정보험료 전액을 가산하여 잠정신고할 수 있으며, 보험료가 확정된 경우에는 최초 수입물품에 가산하여 확정 신고할 수 있다.", "gosi:27": " 수입물품의 생산 또는 마케팅과 관련한 조건 또는 사정은 법 제30조제3항제2호의 거래가격을 과세가격으로 하지 아니하게 하는 조건 또는 사정으로보지 않는다.", "gosi:28": "① 세관장은 특수관계가 해당 물품의 가격에 영향을 미쳤는지 여부를 판단하기 위해 구매자와 판매자가 그들의 상업적 관계를 조직하는 방법과 해당 가격이 결정된 방법 등 거래와 관련된 여러 사실관계를 종합적으로 검토하여야 한다.\n② 다음 각 호의 어느 하나에 해당하는 경우에는 영 제23조제2항제1호의 \"통상적으로 이루어지는 가격결정방법\" 또는 제2호의 \"당해 산업부문의 정상적인 가격결정 관행에 부합하는 방법\"으로 볼 수 있다. 다만, 제1호부터 제3호까지 및 제7호를 적용하는 경우로서 가격차이가 있을 때에는 해당 호 단서의 \"조정\"이 가능한 경우에 한정한다.\n    1. 판매자가 국내의 특수관계가 없는 구매자에게 동등한 가격 수준으로 판매하는 경우. 다만, 거래수량, 거래단계 등이 상이한 경우에는 이를 조정하여야 한다.\n    2. 판매자가 수출국 또는 제3국의 특수관계가 없는 구매자에게 동등한 가격 수준으로 판매하는 경우. 다만, 거래수량, 거래단계, 국가별 시장의 발전수준 및 판매자의 글로벌 마케팅 전략 등이 상이한 경우에는 이를 조정하여야 한다.\n    3. 구매자가 동종동질 또는 유사물품을 특수관계가 없는 다른 판매자로부터 동등한 가격 수준으로 구매하는 경우. 다만, 거래수량, 거래단계 등이 상이한 경우에는 이를 조정하여야 한다.\n    4. 판매된 물품의 가격이 신문, 잡지 등에 공표된 가격으로서 다른 특수관계가 없는 구매자도 동등한 가격 수준으로 구입할 수 있음이 증명되는 경우\n    5. 해당물품의 가격이 그 물품의 생산 및 판매에 관한 모든 비용과 대표적인 기간동안에 동종 또는 동류의 물품 판매에서 실현된 기업의 전반적인 이윤을 충분하게 포함하고 있는 경우\n    6. 판매자가 특수관계가 없는 제조자 등으로부터 구입한 물품을 구매자에게 판매하는 경우에 해당물품의 가격이 제조자 등으로부터의 구입가격에 더하여 판매자의 판매와 관련된 통상의 이윤 및 일반경비를 충분하게 포함하고 있는 경우\n    7. 판매자가 구매자에 대한 판매에서 실현한 매출총이익률과 특수관계가 없는 구매자에 대한 판매에서 실현한 매출총이익률이 동등한 수준인 경우. 다만, 거래수량, 거래단계, 국가별 시장의 발전수준 및 판매자의 글로벌 마케팅 전략 등이 상이한 경우에는 이를 조정하여야 한다.\n    8. 구매자가 특수관계자로부터 구매한 물품과 특수관계가 없는 자로부터 구매한 동종동질 또는 유사물품을 국내 판매할 때 실현한 매출총이익률이 동등한 수준인 경우. 다만, 동등한 수준의 거래조건과 시장조건에서 실현된 것을 전제로 하며, 구매자의 총이익률은 해당 산업의 총이익률과 동등한 수준이어야 한다.\n    9. 구매자가 해당 수입물품 또는 이를 대체할 수 있는 물품을 특수관계가 없는 자로부터 자유롭게 구매하며, 구매자가 판매자를 선택하는 주요 요인이가격에 의한 것임이 제출 자료 및 실제 거래내역에 의해 확인되는 경우\n    10. 판매자가 가격을 결정하기 위한 특정한 공식을 사용하며, 특수관계가 있는 구매자와 특수관계가 없는 구매자에게 물품을 판매할 때 해당 공식을 동일하게 적용하는 경우", "gosi:29": "① 수입자가 수입물품의 거래가격이 영 제23조제2항제3호 각 목의 가격(이하 \"비교가격\"이라 한다.)에 근접함을 증명하는 경우에는 제28조에 따른 검토 없이 거래가격을 수용한다.\n② 비교가격은 법 제38조제2항의 심사, 법 제110조제2항제2호의 관세조사 등을 통하여 세관장이 과세가격으로 인정한 사실이 있는 가격이어야 하며, 영 제23조제2항제3호나목의 가격을 적용할 때에 해당 수입물품에 기초한 과세가격은 비교가격으로 사용할 수 없다.\n③ 제1항에 따라 수입물품의 거래가격이 비교가격에 근접한지 여부를 결정하는 경우에는 물품의 특성, 산업의 특징, 물품이 수입되는 계절 및 가격차이의 상업적 중요성 등을 고려하여야 한다.", "gosi:30": " 영 제25조제4항에 따른 가격차이의 조정은 가격이 증가 또는 감소되는지 여부와 상관없이 조정의 합리성과 정확성을 보장할 수 있는 입증 자료에 근거하여야 한다.", "gosi:31": " 제4방법으로 과세가격을 결정할 수 없는 경우에는 다음 각 호의 어느 하나에 해당하는 경우를 포함한다.\n    1. 법 제33조제2항의 경우\n    2. 영 제27조제3항 단서에 따른 수입신고일부터 90일 이내 판매되는 가격을 확인할 수 없는 경우\n    3. 제34조에 따른 방법으로 비교대상업체가 2개 이상 선정되지 않는 경우\n    4. 제36조에 따라 영 제27조제5항제1호의 \"납세의무자가 제출한 회계보고서를 근거로 계산한 이윤 및 일반경비의 비율\"(이하 \"납세의무자 비율\"이라한다)을 계산할 수 없는 경우", "gosi:32": "① 관세법 제33조제1항제1호의 금액을 산정하는 경우에는 일반적으로 인정된 회계원칙에 따라 매출액에서 차감되는 금액(매출에누리, 매출할인등)을 공제하고, 매출환입된 판매수량은 단위가격을 산정할 때 판매되지 않은 것으로 본다. 다만, 차감되는 금액 중 판매비와 관리비 성격의 금액이 포함되어 있는 경우에는 그 금액을 제외하고 공제한다.\n② 법 제33조제1항제4호에 따른 \"조세와 그 밖의 공과금\"은 세관장이 제4방법을 적용하여 산출한 과세가격을 기초로 계산한 금액을 의미한다.\n③ 제4방법으로 과세가격을 결정하는 물품이 장기간 반복하여 수입되고 납세의무자의 요청이 있는 경우 세관장은 매 신고건별로 법 제33조제1항제2호부터 제4호까지 및 법 제33조제3항 각 호의 금액(이하 \"공제금액\"이라 한다)을 계산하는 대신에 영 제30조에 따라 일정기간 동안의 국내판매가격에 대한 공제금액의 비율(이하 \"공제율\"이라 한다)을 산정하여 적용할 수 있다.\n④ 제3항에 따른 공제율 산정의 신청 및 산정방법은 규칙 제7조의9에서 정하는 바에 따른다.", "gosi:33": "① 세관장이 영 제27조제6항에 따른 동종·동류비율을 산출할 때에는 다음 각 호의 사항을 고려하여 연도별로 결정한 납세의무자의 제4방법 적용대상 수입물품(이하 \"산출대상 품목군\"이라 한다)별로 산출하여야 한다.\n    1. 해당 수입물품의 관세·통계통합품목분류표 품목번호(이하 \"품목번호\"라 한다)\n    2. 해당 수입물품 및 관련 산업의 특성\n    3. 납세의무자의 취급품목, 국내판매형태, 사업부문 및 회계자료의 구분 여부 등 사업의 내용\n② 세관장은 다음 각 호의 사항을 고려하여 산출대상 품목군과 동종·동류 물품의 품목번호의 범위(이하 \"동종·동류 품목번호\"라 한다)를 연도별로 결정하여야 한다.\n    1. 산출대상 품목군의 10단위부터 2단위까지의 품목번호 중 대표성이 있는 품목번호. 다만, 품목이 다양한 경우 여러 품목번호 단위로 결정할 수 있다.\n    2. 산출대상 품목군의 전체 수입액에서 차지하는 수입비중이 80% 이상인 품목번호. 다만, 제34조에 따라 비교대상업체를 선정할 때 다른 산업부문의 업체가 선정될 우려가 있는 품목번호 등은 제외할 수 있다.", "gosi:34": "① 세관장은 제33조제1항에 따른 산출대상 품목군별로 다음 각 호의 요건을 모두 충족하는 업체들을 비교대상업체 후보군으로 선정한다. 이 경우 산업의 특성과 연도별 수입실적을 고려하여 비교대상업체 후보군의 규모를 조정할 수 있다.\n    1. 납세의무자와 동일한 연도에 동종·동류 품목번호에 해당하는 물품을 수입한 실적이 있는 업체\n    2. 수입시점과 동시 또는 유사한 시점에 다음 각 목의 어느 하나에 해당하는 업종에 속하는 업체\n      가. 부가가치세법 , 법인세법 및 소득세법 에 따른 사업자등록 정보로서 납세의무자의 업종\n      나. 가목의 업종, 주요 경쟁업체의 업종, 동종·동류 품목번호에 해당하는 물품을 주로 취급하는 업종 등을 고려하여 선정한 부가가치세법 , 법인세법 및 소득세법 에 따른 사업자등록 정보의 업종\n② 세관장은 제1항에 따라 선정된 비교대상업체 후보군 중 다음 각 호의 요건을 모두 충족하는 업체를 비교대상업체로 선정한다.\n    1. 동종·동류 품목번호에 해당하는 물품에 대한 연도별 수입금액이 납세의무자의 해당 수입금액의 100분의 50 이상이고 100분의 150 이하인 업체\n    2.   「                    」주식회사 등의 외부감사에 관한 법률 에서 정하는 외부감사대상법인으로서 산출대상 연도의 외부감사 의견이 \"적정\"인 업체. 다만, 그 밖에 외부감사 결과가 적정함을 확인할 수 있는 객관적인 자료가 있는 업체는 비교대상업체에 포함할 수 있다.\n    3. 산출대상 품목군과 동종·동류 물품의 국내판매형태(상품 판매, 제조가공 후 판매)가 동일하거나 유사한 업체. 다만, 손익계산서에 판매형태별로 매출액 및 매출원가가 구분되어 있는 경우에는 여러 판매형태를 병행하고 있는 업체도 비교대상업체로 선정할 수 있다.\n    4. 제3호에 따른 국내판매형태에 대한 매출액이 매출원가보다 많은 업체\n③ 제2항에 따라 선정된 비교대상업체 중 다음 각 호의 어느 하나에 해당하는 업체를 제외한다.\n    1. 매출원가 대비 동종·동류 품목번호에 해당하는 물품을 수입한 금액의 비율이 다음 각 목의 구분에 해당하는 업체\n      가. 산출대상 품목군의 국내판매형태가 상품 판매인 경우: 상품 매출원가 대비 동종·동류 품목번호에 해당하는 물품을 수입한 금액의 비율이 100의30 미만\n      나. 산출대상 품목군의 국내판매형태가 제조가공 후 판매인 경우: 제품 매출원가 대비 동종·동류 품목번호에 해당하는 물품을 수입한 금액의 비율이100의 10 미만\n    2. 제2항에 따라 선정된 각 비교대상업체의 매출총이익률이 비교대상업체 전체의 매출액 합계액에서 매출총이익 합계액이 차지하는 비율의 100분의 50 미만이거나 100분의 150 초과인 업체\n    3. 동종·동류 품목번호에 해당하는 수입물품의 거래가격이 영 제23조제1항의 특수관계로부터 영향을 받았다고 세관장이 인정한 업체", "gosi:35": "① 영 제27조제6항에 따른 동종·동류비율은 세관장이 제34조에 따라 선정한 비교대상업체들의 매출액 총합계액에서 매출총이익 총합계액이 차지하는 비율을 기초로 산출한다.\n② 세관장은 필요하다고 인정되는 경우에는 납세의무자, 관련 업계 또는 단체 등에게 제34조에 따른 비교대상업체 선정 및 이 조에 따른 동종·동류비율 산출을 위해 필요한 자료를 요청할 수 있다.\n③ 세관장은 제33조, 제34조 및 제36조의 규정을 적용함에 있어 납세의무자에게 다음 각 호의 사항에 대해 의견을 제시할 기회를 주어야 한다.\n    1. 제33조에 따른 산출대상 품목군 및 동종·동류 품목번호\n    2. 제34조제1항제2호에 따른 업종\n    3. 제34조제2항제3호에 따른 국내판매형태\n    4. 제36조에 따른 납세의무자 비율\n④ 세관장은 제1항에 따라 동종·동류비율을 산출한 후 다음 각 호의 사항을 별지 제1호서식의 이윤 및 일반경비율 산출내역서에 작성하여 납세의무자와 관세평가분류원장에게 통보하여야 한다.\n    1. 제1항에 따른 동종·동류비율\n    2. 제36조에 따른 납세의무자 비율", "gosi:36": "① 납세의무자 비율은 제33조제1항에 따라 결정된 산출대상 품목군과 동종·동류의 물품에 대해 구분 계산한 납세의무자의 매출액, 매출원가를 기초로 다음 산식에 따라 계산한다.\n② 세관장은 제4방법으로 과세가격을 결정하려는 수입물품의 수입신고일이 속하는 회계연도의 회계보고서가 작성되지 않은 경우에는 직전 회계연도 에 해당 수입물품을 수입하였다면 직전 회계연도의 회계보고서를 기초로 납세의무자 비율을 계산할 수 있다.", "gosi:37": "① 영 제27조제8항에 따라 동종·동류비율에 대해 이의를 제기하려는 납세의무자는 이의제기방법 등 세부적인 내용에 대하여 관세평가분류원장에게 사전상담을 신청할 수 있다.\n② 영 제27조제8항에 따라 동종·동류비율에 대해 이의를 제기하려는 납세의무자는 별지 제2호서식의 동종·동류비율 이의제기서(이하 \"이의제기서\"라 한다)에 다음 각 호의 자료를 첨부하여 이를 제35조제4항에 따라 동종·동류비율을 통보한 세관장을 거쳐 관세평가분류원장에게 제출하여야 한다.\n    1. 제33조에 따른 산출대상 품목군, 동종·동류 품목번호 또는 제34조제1항제2호에 따른 업종 등 세관장이 산출한 동종·동류비율이 불합리하다고 판단하는 사유와 그 근거자료\n    2. 납세의무자가 재산출한 납세의무자 비율 및 이를 확인할 수 있는 회계 자료(제36조에 따라 세관장이 산출한 납세의무자 비율이 불합리하다고 판단하는 경우에 한정한다)\n③ 이의제기서를 접수한 세관장은 접수일로부터 7일 이내에 법 제33조에 따라 과세가격을 결정하는 사유 및 이의제기에 대한 세관장 의견서를 첨부하여 이의제기서를 관세평가분류원장에게 이관해야 한다.\n④ 관세평가분류원장은 제2항에 따라 제출된 서류가 동종·동류비율의 재검토를 위하여 충분하지 않은 경우에는 15일 이내의 기간을 정하여 보완자료의 제출을 요구할 수 있으며, 이의제기한 납세의무자가 기간 내에 자료를 보완하지 아니하는 경우에는 이의제기를 반려할 수 있다.\n⑤ 관세평가분류원장은 이의제기 내용 및 제3항에 따른 세관장 의견서에 대한 검토를 마치고 그 결과를 세관장 및 이의제기한 납세의무자에게 통보하여야 한다. 이 경우 관세평가분류원장은 제33조에 따른 산출대상 품목군과 동종·동류 품목번호의 범위 및 제34조에 따른 비교대상업체의 선정 등이 곤란한 경우 등 부득이한 경우를 제외하고 이의제기서를 접수한 날로부터 30일(자료 보완기간 제외) 이내에 통보하여야 한다.\n⑥ 세관장은 이의제기를 반영하여 산출된 동종·동류비율을 적용한 과세가격이 제35조에 따라 통보한 동종·동류비율을 적용한 과세가격보다 높은 경우에는 제35조에 따라 통보한 동종·동류비율을 적용한다.", "gosi:38": " 납세의무자가 영 제28조제1항에 따라 제출하는 자료만으로 법 제34조제1항제1호에 해당하는 금액을 확인할 수 없는 경우에는 제5방법에 따라 과세가격을 결정할 수 없다.", "gosi:39": "① 법 제30조에 따른 제1방법부터 법 제34조에 따른 제5방법까지에 따라 과세가격을 결정할 수 없을 때에는 영 제29조제2항에서 사용을 금지하고있는 가격에 해당하지 않는 범위 내에서 1994년도 관세 및 무역에 관한 일반협정 제7조의 이행에 관한 협정 에 부합하는 합리적인 방법과 국내에서 이용 가능한 자료를 근거로 하여 과세가격을 결정한다.\n② 영 제29조제1항에 따라 과세가격을 결정할 때에는 법 제30조에 따른 제1방법부터 법 제34조에 따른 제5방법까지를 적용순서에 따라 신축적으로 적용하여야 하며, 이전에 결정된 과세가격이 있는 경우 이를 최대한 활용하여야 한다.\n③ 제2항에 따라 제4방법을 신축적으로 적용하는 때에는 다음 각 호의 사항을 거래의 실질 및 관행에 비추어 합리적으로 인정되는 방법에 따라 조정할 수 있다.\n    1. 규칙 제7조제2항의 경우\n    2. 규칙 제7조제3항의 경우\n    3. 제33조에 따른 산출대상 품목군 및 동종·동류 품목번호\n    4. 제34조제1항제2호에 따른 업종\n    5. 제34조제2항제1호에 따른 수입금액\n    6. 제34조제3항제1호에 따른 매출원가 대비 동종·동류 품목번호에 해당하는 물품을 수입한 금액의 비율\n    7. 제34조제3항제2호에 따른 매출총이익률\n    8. 제36조에 따른 납세의무자 비율", "gosi:40": "① 규칙 제7조의3제1항제5호에 따라 최초 등록일(또는 사용일)로부터 수입신고일까지의 사용에 따른 가치감소에 대하여는 별표 제2호를 적용하여 계산한다.\n② 규칙 제7조의3제3항에 따른 시가역산율은 다음 각 목의 계산방법에 따른다.\n      가. 수입물품의 가격이 과세표준으로 되는 물품으로서 국내도매가격에 부가가치세가 포함되어 있는 경우(종가세) (1) 개별소비세의 기준가격이 없는 경우 (2) 개별소비세의 기준가격이 있는 경우\n      나. 수입물품의 가격이 과세표준으로 되는 물품으로서 국내도매가격에 부가가치세가 포함되어 있지 않은 경우(종가세) (1) 개별소비세의 기준가격이 없는 경우 (2) 개별소비세의 기준가격이 있는 경우\n      다. 수입물품의 수량이 과세표준으로 되는 물품으로서 국내 도매가격에 부가가치세가 포함되어 있는 경우(종량세) (1) 개별소비세의 기준가격이 없는 경우 (2) 개별소비세의 기준가격이 있는 경우\n      라. 수입물품의 수량이 과세표준으로 되는 물품으로서 국내 도매가격에 부가가치세가 포함되어 있지 않은 경우(종량세) (1) 개별소비세의 기준가격이 없는 경우 (2) 개별소비세의 기준가격이 있는 경우\n③ 제2항에 따라 산출한 시가역산율(수입물품의 가격이 과세표준으로 되는 물품으로 개별소비세의 부과대상으로서 기준가격이 없는 경우 및 농어촌특별세, 교통·에너지·환경세가 부과되지 않는 경우)의 예시는 별표 제3호, 별표 제4호와 같다.", "gosi:41": "① 규칙 제7조의5제2항의 가치감소 산정기준은 다음 각 호의 물품별 기준에 따른다.\n    1. 기초설비품 및 기계류는 법인세법 시행규칙 상의 업종별 자산의 기준내용연수 및 내용연수범위표상에 기재된 기준내용연수와 감가상각자산의상각률표 중 정률법에 의한 상각률에 의한다.\n    2. 승용차(화물자동차 포함) 및 이륜자동차는 별표 제2호의 기준에 의하고, 건설장비류는 별표 제5호의 기준에 의한다.\n② 사용으로 인하여 가치가 감소된 물품의 과세가격을 산출할 때에 적용하는 체감잔존율은 1월단위로 적용하되, 1월을 계산할 때에는 15일 이하는 버림하고, 16일 이상은 1월로 본다.\n③ 규칙 제7조의5제1항제3호에 따른 수입 승용자동차 및 화물자동차의 사용으로 인한 가치감소분 공제시에는 자동차의 최초 등록일(또는 사용일)부터 수입신고일까지의 경과일수를 적용한다."}};

/* 선택: 위·아래로 이어진 규정만 진하게 */
let cur = null;
function reach(id) {

  const dn = (x) => kids[x].forEach(([k, c, i]) => { eon.add(i); if (!on.has(k)) { on.add(k); dn(k); } });

const KN = { d: '대통령령 위임', r: '재정경제부령 위임', g: '고시 연결', c: '근거 인용', a: '소속' };
function select(id) {

}
function clearSel() { cur = null; stage.classList.remove('focus'); document.getElementById('panel').hidden = true; D.nodes.forEach(n => el[n.id].classList.remove('on', 'me')); pathEl.forEach(p => p && p.classList.remove('on')); }

  const ups = pars[id].map(([p, c]) => `${['법', '영', '규칙', '고시'][N[p].col]} ${N[p].lab.replace(/\(.*\)/, '')} (${KN[c]})`);
  const dns = kids[id].map(([k, c]) => `${['법', '영', '규칙', '고시'][N[k].col]} ${N[k].lab.replace(/\(.*\)/, '')} (${KN[c]})`);
  const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  /* 법: 항을 누르면 그 항만, 호를 누르면 그 항에서 해당 호를 강조 */
  let body;
  if (!n.col && n.h) body = D.lawtext[key].filter(x => x[0] === n.h).map(x => n.ho && x[1] === n.ho ? `<mark>${esc(x[2])}</mark>` : esc(x[2])).join('\n');
  else body = esc(D.texts[key] || '');
  pn.innerHTML = `<h3><span>${nm} ${esc(n.lab)}</span><button aria-label="닫기">×</button></h3>` +
    (ups.length ? `<p class="links">위: ${ups.join(' · ')}</p>` : '') + (dns.length ? `<p class="links">아래: ${dns.join(' · ')}</p>` : '') +
    `<pre>${body}</pre>`;

view.addEventListener('click', clearSel);
document.querySelectorAll('.legend input').forEach(cb => cb.onchange = () => stage.classList.toggle('hide-' + cb.dataset.k, !cb.checked));
/* 확대·축소: 두 손가락 / 버튼 (CSS zoom, 손가락 가운데 고정) */
let Z = 1;
function zoomNow() { return Z; }
function setZ(nz, px, py) {

layout(); fit();

</script></body></html>
