0", "D262-0", "p"], ["L260-0", "D263-0", "p"], ["L229-0", "R74-0", "o"], ["L229-0", "R76-0", "o"], ["L232-2", "R76-2", "o"], ["L232-2", "R77-0", "o"], ["L233-0", "R77-2", "o"], ["D236-8", "R77-3", "o"], ["D245-2", "R77-4", "o"], ["D246-0", "R77-5", "o"], ["D246-0", "R77-6", "o"], ["L251-0", "R79-0", "o"], ["L254-2", "R79-2", "o"], ["D259-6", "R79-3", "o"]], "texts": {"L260-0": "제260조(우편물의 납세절차) ① 제259조제2항에 따른 통지를 받은 자는 대통령령으로 정하는 바에 따라 해당 관세를 수입인지 또는 금전으로 납부하여야 한다.\n  ② 체신관서는 관세를 징수하여야 하는 우편물은 관세를 징수하기 전에 수취인에게 내줄 수 없다.\n  [전문개정 2010. 12. 30.]", "D244-0": "제244조(통관의 보류) 법 제237조제1항제6호에서 “대통령령으로 정하는 경우”란 다음 각 호의 어느 하나에 해당하는 경우를 말한다.\n    1. 관세 관계 법령을 위반한 혐의로 고발되거나 조사를 받는 경우\n    2. 수출입 관계 법령에 따른 일시적 통관 제한ㆍ금지 또는 이에 따른 중앙행정기관의 장의 일시적 통관 제한ㆍ금지 요청이 있어 세관장이 그 해당 여부를 확인할 필요가 있는 경우\n  [전문개정 2024. 2. 29.]", "R74-0": "제74조(일반물품의 원산지결정기준) ①법 제229조제1항제1호의 규정에 의하여 원산지를 인정하는 물품은 다음 각호와 같다.\n    1. 당해 국가의 영역에서 생산된 광산물과 식물성 생산물\n    2. 당해 국가의 영역에서 번식 또는 사육된 산 동물과 이들로부터 채취한 물품\n    3. 당해 국가의 영역에서의 수렵 또는 어로로 채집 또는 포획한 물품\n    4. 당해 국가의 선박에 의하여 채집 또는 포획한 어획물 기타의 물품\n    5. 당해 국가에서의 제조ㆍ가공의 공정 중에 발생한 부스러기\n    6. 당해 국가 또는 그 선박에서 제1호 내지 제5호의 물품을 원재료로 하여 제조ㆍ가공한 물품\n  ②법 제229조제1항제2호의 규정에 의하여 2개국 이상에 걸쳐 생산ㆍ가공 또는 제조(이하 이 조에서 “생산”이라 한다)된 물품의 원산지는 당해 물품의 생산과정에 사용되는 물품의 품목분류표상 6단위 품목번호와 다른 6단위 품목번호의 물품을 최종적으로 생산한 국가로 한다. <개정 2016. 3. 9.>\n  ③관세청장은 제2항의 규정에 의하여 6단위 품목번호의 변경만으로 법 제229조제1항제2호의 규정에 의한 본질적 특성을 부여하기에 충분한 정도의 실질적인 생산과정을 거친 것으로 인정하기 곤란한 품목에 대하여는 주요공정ㆍ부가가치 등을 고려하여 품목별로 원산지기준을 따로 정할 수 있다.\n  ④다음 각호의 1에 해당하는 작업이 수행된 국가는 제2항의 규정에 의한 원산지로 인정하지 아니한다.\n    1. 운송 또는 보세구역장치중에 있는 물품의 보존을 위하여 필요한 작업\n    2. 판매를 위한 물품의 포장개선 또는 상표표시 등 상품성 향상을 위한 개수작업\n    3. 단순한 선별ㆍ구분ㆍ절단 또는 세척작업\n    4. 재포장 또는 단순한 조립작업\n    5. 물품의 특성이 변하지 아니하는 범위안에서의 원산지가 다른 물품과의 혼합작업\n    6. 가축의 도축작업\n  ⑤관세청장은 제3항에 따른 품목별 원산지기준을 정하는 때에는 재정경제부장관 및 해당 물품의 관계부처의 장과 협의하여야 한다. <개정 2008. 12. 31., 2026. 1. 2.>\n  ⑥ 제1항부터 제5항까지의 규정에도 불구하고 수출물품에 대한 원산지 결정기준이 수입국의 원산지 결정기준과 다른 경우에는 수입국의 원산지 결정기준을 따를 수 있다. <신설 2019. 3. 20.>", "L254-2": "제254조의2(탁송품의 특별통관) ① 제241조제2항제1호의 탁송품으로서 재정경제부령으로 정하는 물품은 운송업자(제 222조제1항제6호에 따라 관세청장 또는 세관장에게 등록한 자를 말한다. 이하 “탁송품 운송업자”라 한다)가 다음 각 호에 해당하는 사항이 적힌 목록(이하 “통관목록”이라 한다)을 세관장에게 제출함으로써 제241조제1항에 따른 수입신고를 생략할 수 있다. <개정 2013. 1. 1., 2017. 12. 19., 2020. 12. 22., 2025. 10. 1.>\n    1. 물품의 발송인 및 수신인의 성명, 주소, 국가\n    2. 물품의 품명, 수량, 중량 및 가격\n    3. 탁송품의 통관목록에 관한 것으로 재정경제부령으로 정하는 사항\n  ② 탁송품 운송업자는 통관목록을 사실과 다르게 제출하여서는 아니 된다.\n  ③ 탁송품 운송업자는 제1항에 따라 제출한 통관목록에 적힌 물품수신인의 주소지(제241조제1항에 따른 수입신고를 한 탁송품의 경우에는 수입신고서에 적힌 납세의무자의 주소지)가 아닌 곳에 탁송품을 배송하거나 배송하게 한 경우에는 배송한 날이 속하는 달의 다음달 15일까지 실제 배송한 주소지를 세관장에게 제출하여야 한다. 다만, 탁송품 운송업자와 실제 배송한 자가 다른 경우 탁송품 운송업자는 실제 배송한 자로 하여금 세관장에게 실제 배송한 주소지를 제출하게 할 수 있다.<신설 2014. 1. 1., 2017. 12. 19., 2020. 12. 22., 2025. 12. 23.>\n  ④ 세관장은 탁송품 운송업자가 제2항 또는 제3항을 위반하거나 이 법에 따라 통관이 제한되는 물품을 국내에 반입하는 경우에는 제1항에 따른 통관절차의 적용을 배제할 수 있다.<개정 2014. 1. 1.>\n  ⑤ 관세청장 또는 세관장은 탁송품에 대하여 세관공무원으로 하여금 검사하게 하여야 하며, 탁송품의 통관목록의 제출시한, 실제 배송지의 제출, 물품의 검사 등에 필요한 사항은 관세청장이 정하여 고시한다.<개정 2011. 12. 31., 2014. 1. 1.>\n  ⑥ 세관장은 관세청장이 정하는 절차에 따라 별도로 정한 지정장치장에서 탁송품을 통관하여야 한다. 다만, 세관장은 탁송품에 대한 감시ㆍ단속에 지장이 없다고 인정하는 경우 탁송품을 해당 탁송품 운송업자가 운영하는 보세창고 또는 시설(「자유무역지역의 지정 및 운영에 관한 법률」 제11조에 따라 입주계약을 체결하여 입주한 업체가 해당 자유무역지역에서 운영하는 시설에 한정한다)에서 통관할 수 있다.<신설 2013. 1. 1., 2014. 1. 1., 2016. 1. 27.>\n  ⑦ 세관장은 제1항에 따른 통관절차가 적용되지 아니하는 탁송품으로서 제5항에 따른 검사를 마치고 탁송품에 대한 감시ㆍ단속에 지장이 없다고 인정하는 경우에는 제6항에도 불구하고 관세청장이 정하는 보세구역 등에서 탁송품을 통관하게 할 수 있다.<신설 2020. 12. 22.>\n  ⑧ 제6항 단서에 따라 탁송품 운송업자가 운영하는 보세창고 또는 시설에서 통관하는 경우 그에 필요한 탁송품 검사설비 기준, 설비이용 절차, 설비이용 유효기간 등에 관하여 필요한 사항은 대통령령으로 정한다.<신설 2013. 1. 1., 2014. 1. 1., 2020. 12. 22.>\n  ⑨ 관세청장은 탁송품의 신속한 통관과 탁송품에 대한 효율적인 감시ㆍ단속 등을 위하여 필요한 세관장과 탁송품 운송업자간 협력에 관한 사항 등 대통령령으로 정하는 사항에 대하여 고시할 수 있다.<신설 2020. 12. 22.>\n  [전문개정 2010. 12. 30.] 제255조 삭제 <2014. 12. 23.>", "L248-0": "제248조(신고의 수리) ① 세관장은 제241조 또는 제244조에 따른 신고가 이 법에 따라 적합하게 이루어졌을 때에는 이를 지체 없이 수리하고 신고인에게 신고필증을 발급하여야 한다. 다만, 제327조제2항에 따라 국가관세종합정보시스템의 전산처리설비를 이용하여 신고를 수리하는 경우에는 관세청장이 정하는 바에 따라 신고인(신고 명의인이 화주가 아닌 경우에는 화주를 포함한다)이 직접 전산처리설비를 이용하여 신고필증을 발급받을 수 있다. <개정 2023. 12. 31., 2024. 12. 31.>\n  ② 세관장은 관세를 납부하여야 하는 물품에 대하여는 제241조 또는 제244조에 따른 신고를 수리할 때에 다음 각 호의 어느 하나에 해당하는 자에게 관세에 상당하는 담보의 제공을 요구할 수 있다.\n    1. 이 법 또는 「수출용원재료에 대한 관세 등 환급에 관한 특례법」 제23조를 위반하여 징역형의 실형을 선고받고 그 집행이 끝나거나(집행이 끝난 것으로 보는 경우를 포함한다) 면제된 후 2년이 지나지 아니한 자\n    2. 이 법 또는 「수출용원재료에 대한 관세 등 환급에 관한 특례법」 제23조를 위반하여 징역형의 집행유예를 선고받고 그 유예기간 중에 있는 자\n    3. 제269조부터 제271조까지, 제274조, 제275조의2, 제275조의3 또는 「수출용원재료에 대한 관세 등 환급에 관한 특례법」 제23조에 따라 벌금형 또는 통고처분을 받은 자로서 그 벌금형을 선고받거나 통고처분을 이행한 후 2년 이 지나지 아니한 자\n    4. 제241조 또는 제244조에 따른 수입신고일을 기준으로 최근 2년간 관세 등 조세를 체납한 사실이 있는 자\n    5. 수입실적, 수입물품의 관세율 등을 고려하여 대통령령으로 정하는 관세채권의 확보가 곤란한 경우에 해당하는 자\n  ③ 제1항에 따른 신고수리 전에는 운송수단, 관세통로, 하역통로 또는 이 법에 따른 장치 장소로부터 신고된 물품을 반출하여서는 아니 된다.\n  [전문개정 2010. 12. 30.]", "L232-2": "제232조의2(원산지증명서의 발급 등) ① 이 법, 조약, 협정 등에 따라 관세를 양허받을 수 있는 물품의 수출자가 원산지증명서의 발급을 요청하는 경우에는 세관장이나 그 밖에 원산지증명서를 발급할 권한이 있는 기관은 그 수출자에게 원산지증명서를 발급하여야 한다.\n  ② 세관장은 제1항에 따라 발급된 원산지증명서의 내용을 확인하기 위하여 필요하다고 인정되는 경우에는 다음 각 호의 자로 하여금 원산지증명서확인자료(대통령령으로 정하는 자료로 한정한다)를 제출하게 할 수 있다. 이 경우 자료의 제출기간은 20일 이상으로서 재정경제부령으로 정하는 기간 이내로 한다.<개정 2025. 10. 1.>\n    1. 원산지증명서를 발급받은 자\n    2. 원산지증명서를 발급한 자\n    3. 그 밖에 대통령령으로 정하는 자\n  ③ 원산지증명서의 발급 요청 기한 및 발급 기관 등 원산지증명서의 발급에 필요한 사항은 재정경제부령으로 정한다.<신설 2024. 12. 31., 2025. 10. 1.>\n  [본조신설 2010. 12. 30.] 제232조의3 삭제 <2021. 12. 21.>", "D241-0": "제241조(담보제공 등) ① 법 제235조제3항 및 제4항에 따라 통관 보류나 유치를 요청하려는 자와 법 제235조제5항 각 호 외의 부분 단서에 따라 통관 또는 유치 해제를 요청하려는 자는 세관장에게 해당 물품의 과세가격의 100분의 120에 상당하는 금액의 담보를 법 제24조제1항제1호부터 제3호까지 및 제7호에 따른 금전 등으로 제공하여야 한다. <개정 2013. 2. 15.>\n  ② 제1항에 따른 담보 금액은 담보를 제공해야 하는 자가 「조세특례제한법」 제6조제1항에 따른 중소기업인 경우에는 해당 물품의 과세가격의 100분의 40에 상당하는 금액으로 한다. <개정 2013. 2. 15., 2015. 2. 6., 2021. 2. 17.>\n  ③제1항 또는 제2항에 따라 담보를 제공하는 자는 제공된 담보를 법원의 판결에 따라 수출입신고등을 한 자 또는 통관보류등을 요청한 자가 입은 손해의 배상에 사용하여도 좋다는 뜻을 세관장에게 문서로 제출하여야 한다. <개정 2011. 4. 1.>\n  ④ 세관장은 법 제235조제3항 및 제4항에 따라 통관보류등이 된 물품의 통관을 허용하거나 유치를 해제하였을 때 또는 법 제235조제5항 단서에 따른 통관 또는 유치 해제 요청에도 불구하고 통관보류등을 계속할 때에는 제1항 또는 제2항에 따라 제공된 담보를 담보제공자에게 반환하여야 한다. <개정 2011. 4. 1.>\n  ⑤제1항 및 제2항의 규정에 의하여 제공된 담보의 해제신청 및 포괄담보에 관하여는 제11조 및 제13조의 규정을 준용한다.", "D245-2": "제245조의2(무역원활화위원회의 구성) ① 법 제240조의4에 따른 통관 등 수출입 절차의 원활화 및 이와 관련된 국제협력의 원활화(이하 “무역원활화”라 한다)의 촉진에 관한 다음 각 호의 사항을 심의하기 위하여 재정경제부장관 소속으로 무역원활화위원회(이하 이 조 및 제245조의3에서 “위원회”라 한다)를 둔다. <개정 2025. 12. 30.>\n    1. 무역원활화 기본계획에 관한 사항\n    2. 무역원활화 추진 관련 행정기관 간의 업무 협조에 관한 사항\n    3. 무역원활화 관련 법령ㆍ제도의 정비ㆍ개선에 관한 사항\n    4. 그 밖에 무역원활화 추진에 관한 주요 사항\n  ② 위원회는 위원장 1명을 포함하여 20명 이내의 위원으로 구성한다.\n  ③ 위원회의 위원장은 재정경제부차관이 되고, 위원은 다음 각 호의 사람이 된다. <개정 2025. 12. 30.>\n    1. 무역원활화 관련 행정기관의 고위공무원단에 속하는 공무원 중에서 재정경제부장관이 임명하는 사람\n    2. 다음 각 목의 어느 하나에 해당하는 사람 중에서 재정경제부장관이 위촉하는 사람\n      가. 무역원활화 관계 기관 및 단체의 임직원\n      나. 무역원활화에 관한 학식과 경험이 풍부한 사람으로서 해당 업무에 2년 이상 종사한 사람\n  ④ 제3항제2호에 따른 위원의 임기는 2년으로 하되, 한번만 연임할 수 있다. 다만, 보궐위원의 임기는 전임위원 임기의 남은 기간으로 한다. <개정 2017. 3. 27., 2018. 2. 13.>\n  ⑤ 재정경제부장관은 위원회의 위원이 다음 각 호의 어느 하나에 해당하는 경우에는 해당 위원을 해임 또는 해촉할 수 있다. <신설 2017. 3. 27., 2025. 12. 30.>\n    1. 심신장애로 인하여 직무를 수행할 수 없게 된 경우\n    2. 직무와 관련된 비위사실이 있는 경우\n    3. 직무태만, 품위손상이나 그 밖의 사유로 인하여 위원으로 적합하지 아니하다고 인정되는 경우\n    4. 위원 스스로 직무를 수행하는 것이 곤란하다고 의사를 밝히는 경우\n  ⑥ 위원회의 사무를 처리하기 위하여 간사 1명을 두며, 간사는 재정경제부의 고위공무원단에 속하는 공무원 중에서 재정경제부장관이 지명한다. <개정 2017. 3. 27., 2025. 12. 30.>\n  ⑦ 제1항부터 제6항까지에서 규정한 사항 외에 위원회의 구성에 필요한 사항은 재정경제부령으로 정한다. <개정 2017. 3. 27., 2025. 12. 30.>\n  [본조신설 2015. 2. 6.]", "L232-0": "제232조(원산지증명서 등) ① 이 법, 조약, 협정 등에 따라 원산지 확인이 필요한 물품을 수입하는 자는 해당 물품의 원산지를 증명하는 서류(이하 “원산지증명서”라 한다)를 제출하여야 한다. 다만, 대통령령으로 정하는 물품의 경우에는 그러하지 아니하다.\n  ② 세관장은 제1항에 따라 원산지 확인이 필요한 물품을 수입하는 자가 원산지증명서를 제출하지 아니하는 경우에는 이 법, 조약, 협정 등에 따른 관세율을 적용할 때 일반특혜관세ㆍ국제협력관세 또는 편익관세를 배제하는 등 관세의 편익을 적용하지 아니할 수 있다.\n  ③ 세관장은 원산지 확인이 필요한 물품을 수입한 자로 하여금 제1항에 따라 제출받은 원산지증명서의 내용을 확인하기 위하여 필요한 자료(이하 “원산지증명서확인자료”라 한다)를 제출하게 할 수 있다. 이 경우 원산지 확인이 필요한 물품을 수입한 자가 정당한 사유 없이 원산지증명서확인자료를 제출하지 아니할 때에는 세관장은 수입신고 시 제출받은 원산지증명서의 내용을 인정하지 아니할 수 있다.\n  ④ 세관장은 제3항에 따라 원산지증명서확인자료를 제출한 자가 정당한 사유를 제시하여 그 자료를 공개하지 아니할 것을 요청한 경우에는 그 제출인의 명시적 동의 없이는 해당 자료를 공개하여서는 아니 된다.\n  ⑤ 제1항부터 제4항까지의 규정에도 불구하고 조약ㆍ협정 등의 시행을 위하여 원산지증명서 제출 등에 관한 사항을 따로 정할 필요가 있을 때에는 재정경제부령으로 정한다.<신설 2011. 12. 31., 2025. 10. 1.>\n  [전문개정 2010. 12. 30.]", "L246-2": "제246조의2(물품의 검사에 따른 손실보상) ① 관세청장 또는 세관장은 이 법에 따른 세관공무원의 적법한 물품검사로 인하여 물품 등에 손실이 발생한 경우 그 손실을 입은 자에게 보상(이하 “손실보상”이라 한다)하여야 한다. <개정 2019. 12. 31., 2023. 12. 31.>\n  ② 제1항에 따른 손실보상의 기준, 대상 및 보상금액에 관한 사항은 대통령령으로 정한다.<개정 2023. 12. 31.>\n  ③ 제1항에 따른 손실보상의 지급절차 및 방법, 그 밖에 필요한 사항은 관세청장이 정한다.\n  [본조신설 2015. 12. 15.]", "R77-6": "제77조의6(수출ㆍ수입 또는 반송의 신고) ① 영 제246조제1항제7호에서 “재정경제부령으로 정하는 참고사항”이란 다음 각 호를 말한다. <개정 2024. 3. 22., 2026. 1. 2.>\n    1. 물품의 모델 및 중량\n    2. 품목분류표의 품목 번호\n    3. 법 제226조에 따른 허가ㆍ승인ㆍ표시 또는 그 밖의 조건을 갖춘 것임을 증명하기 위하여 발급된 서류의 명칭\n    4. 수출입 법령에 따라 통관이 일시적으로 제한ㆍ금지되는 물품인지 여부를 확인할 수 있는 정보로서 관세청장이 관계 중앙행정기관의 장과 협의하여 관보에 공고하는 정보\n  ② 영 제246조제2항에 따른 수출 또는 반송의 신고서는 별지 제1호의2서식과 같다.\n  ③ 영 제246조제2항에 따른 수입의 신고서는 별지 제1호의3서식과 같다.\n  ④ 법 제327조제2항에 따른 전자신고의 작성에 필요한 구체적인 사항은 관세청장이 정하여 고시한다.\n  [본조신설 2016. 3. 9.]\n  제78조 삭제 <2024. 3. 22.>", "L233-3": "제233조의3(원산지표시위반단속기관협의회) ① 이 법, 「농수산물의 원산지 표시 등에 관한 법률」 및 「대외무역법」에 따른 원산지표시 위반 단속업무에 필요한 정보교류 등 대통령령으로 정하는 사항을 협의하기 위하여 관세청에 원산지표시위반단속기관협의회를 둔다. <개정 2021. 11. 30.>\n  ② 제1항에 따른 원산지표시위반단속기관협의회의 구성ㆍ운영과 그 밖에 필요한 사항은 대통령령으로 정한다.\n  [본조신설 2014. 1. 1.]", "D256-0": "제256조(신고수리전 반출) ①법 제252조의 규정에 의한 승인을 얻고자 하는 자는 다음 각호의 사항을 기재한 신청서를 세관장에게 제출하여야 한다.\n    1. 제175조 각호의 사항\n    2. 신고의 종류\n    3. 신고연월일 및 신고번호\n    4. 신청사유\n  ②세관장이 제1항의 규정에 의한 신청을 받아 법 제252조의 규정에 의한 승인을 하는 때에는 관세청장이 정하는 절차에 따라야 한다.\n  ③ 다음 각 호의 어느 하나에 해당하는 물품에 대해서는 법 제252조 단서에 따라 담보의 제공을 생략할 수 있다. 다만, 제2호 및 제3호의 물품을 수입하는 자 중 관세 등의 체납, 불성실신고 등의 사유로 담보 제공을 생략하는 것이 타당하지 아니하다고 관세청장이 인정하는 자가 수입하는 물품에 대해서는 담보를 제공하게 할 수 있다. <신설 2011. 4. 1.>\n    1. 국가, 지방자치단체, 「공공기관의 운영에 관한 법률」 제4조에 따른 공공기관, 「지방공기업법」 제49조에 따라 설립된 지방공사 및 같은 법 제79조에 따라 설립된 지방공단이 수입하는 물품\n    2. 법 제90조제1항제1호 및 제2호에 따른 기관이 수입하는 물품\n    3. 최근 2년간 법 위반(관세청장이 법 제270조ㆍ제276조 및 제277조에 따른 처벌을 받은 자로서 재범의 우려가 없다고 인정하는 경우를 제외한다) 사실이 없는 수출입자 또는 신용평가기관으로부터 신용도가 높은 것으로 평가를 받은 자로서 관세청장이 정하는 자가 수입하는 물품\n    4. 수출용원재료 등 수입물품의 성질, 반입사유 등을 고려할 때 관세채권의 확보에 지장이 없다고 관세청장이 인정하는 물품\n    5. 거주 이전(移轉)의 사유, 납부할 세액 등을 고려할 때 관세채권의 확보에 지장이 없다고 관세청장이 정하여 고시하는 기준에 해당하는 자의 이사물품", "D252-0": "제252조(담보의 제공) 법 제248조제2항제5호에서 “대통령령으로 정하는 관세채권의 확보가 곤란한 경우에 해당하는 자”란 다음 각 호의 어느 하나에 해당하는 자를 말한다.\n    1. 최근 2년간 계속해서 수입실적이 없는 자\n    2. 파산, 청산 또는 개인회생절차가 진행 중인 자\n    3. 수입실적, 자산, 영업이익, 수입물품의 관세율 등을 고려할 때 관세채권 확보가 곤란한 경우로서 관세청장이 정하는 요건에 해당하는 자\n  [전문개정 2010. 3. 26.]", "L252-0": "제252조(수입신고수리전 반출) 수입신고를 한 물품을 제248조에 따른 세관장의 수리 전에 해당 물품이 장치된 장소로부터 반출하려는 자는 납부하여야 할 관세에 상당하는 담보를 제공하고 세관장의 승인을 받아야 한다. 다만, 정부 또는 지방자치단체가 수입하거나 담보를 제공하지 아니하여도 관세의 납부에 지장이 없다고 인정하여 대통령령으로 정하는 물품에 대하여는 담보의 제공을 생략할 수 있다.\n  [전문개정 2010. 12. 30.]", "R77-0": "제77조(원산지증명서확인자료의 제출기간) 법 제232조의2제2항 각 호 외의 부분 후단에서 “재정경제부령으로 정하는 기간”이란 세관장으로부터 원산지증명서확인자료의 제출을 요구받은 날부터 30일을 말한다. 다만, 제출을 요구받은 자가 부득이한 사유로 그 기간에 원산지증명서확인자료를 제출하기 곤란할 때에는 그 기간을 30일의 범위에서 한 차례만 연장할 수 있다. <개정 2026. 1. 2.>\n  [본조신설 2011. 4. 1.]", "L251-0": "제251조(수출신고수리물품의 적재 등) ① 수출신고가 수리된 물품은 수출신고가 수리된 날부터 30일 이내에 운송수단에 적재하여야 한다. 다만, 재정경제부령으로 정하는 바에 따라 1년의 범위에서 적재기간의 연장승인을 받은 것은 그러하지 아니하다. <개정 2025. 10. 1.>\n  ② 세관장은 제1항에 따른 기간 내에 적재되지 아니한 물품에 대하여는 대통령령으로 정하는 바에 따라 수출신고의 수리를 취소할 수 있다.\n  [전문개정 2010. 12. 30.]", "D245-5": "제245조의5(다른 국가와의 수출입신고자료 등의 교환) ① 법 제240조의6제3항에서 “수출입신고자료 등 대통령령으로 정하는 사항”이란 다음 각 호의 어느 하나에 해당하는 사항을 말한다.\n    1. 수출ㆍ수입 또는 반송의 신고와 관련된 다음 각 목의 자료\n      가. 신고서\n      나. 송품장, 포장명세서, 원산지증명서 및 선하증권 등 신고 시 제출한 자료\n      다. 가목 및 나목의 서류 또는 자료의 진위 확인에 필요한 자료\n    2. 해당 물품에 대한 법 제30조부터 제35조까지의 규정에 따른 과세가격의 결정 및 관세율표상의 품목분류의 정확성 확인에 필요한 자료\n    3. 법 제234조 및 제235조에 따라 수출하거나 수입할 수 없는 물품의 반출입과 관련된 자료\n    4. 법 제283조부터 제318조까지의 규정에 따른 관세범의 조사 및 처분과 관련된 자료\n  ② 관세청장은 제1항제1호에 따른 자료를 다른 국가와 교환한 경우에는 법 제240조의6제5항에 따라 그 교환한 날부터 10일 이내에 자료의 교환 사실 및 내용 등을 해당 신고인 또는 그 대리인에게 통지하여야 한다.\n  ③ 관세청장은 제2항에도 불구하고 해당 통지가 다음 각 호의 어느 하나에 해당하는 경우에는 6개월의 범위에서 통지를 유예할 수 있다. 다만, 제1호에 해당하는 경우에는 6개월을 초과하여 유예할 수 있다.\n    1. 사람의 생명이나 신체의 안전을 위협할 우려가 있는 경우\n    2. 증거인멸 등 공정한 사법절차의 진행을 방해할 우려가 있는 경우\n    3. 질문ㆍ조사 등의 행정절차 진행을 방해하거나 지나치게 지연시킬 우려가 있는 경우\n    4. 다른 국가로부터 해당 통지의 유예를 서면으로 요청받은 경우\n  [본조신설 2015. 2. 6.]", "D250-0": "제250조(신고서류) ①법 제245조제1항에서 “대통령령으로 정하는 서류”란 다음 각 호의 서류를 말한다. <개정 2011. 4. 1.>\n    1. 선하증권 사본 또는 항공화물운송장 사본\n    2. 원산지증명서(제236조제1항이 적용되는 경우로 한정한다)\n    3. 기타 참고서류\n  ②수출입신고를 하는 물품이 법 제226조의 규정에 의한 증명을 필요로 하는 것인 때에는 관련증명서류를 첨부하여 수출입신고를 하여야 한다. 다만, 세관장은 필요없다고 인정되는 때에는 이를 생략하게 할 수 있다.", "R76-0": "제76조(직접운송원칙) 법 제229조에 따라 원산지를 결정할 때 해당 물품이 원산지가 아닌 국가를 경유하지 아니하고 직접 우리나라에 운송ㆍ반입된 물품인 경우에만 그 원산지로 인정한다. 다만, 다음 각 호의 어느 하나에 해당하는 물품인 경우에는 우리나라에 직접 반입한 것으로 본다.\n    1. 다음 각 목의 요건을 모두 충족하는 물품일 것\n      가. 지리적 또는 운송상의 이유로 단순 경유한 것\n      나. 원산지가 아닌 국가에서 관세당국의 통제하에 보세구역에 장치된 것\n      다. 원산지가 아닌 국가에서 하역, 재선적 또는 그 밖에 정상 상태를 유지하기 위하여 요구되는 작업 외의 추가적인 작업을 하지 아니한 것\n    2. 박람회ㆍ전시회 및 그 밖에 이에 준하는 행사에 전시하기 위하여 원산지가 아닌 국가로 수출되어 해당 국가 관세당국의 통제하에 전시목적에 사용된 후 우리나라로 수출된 물품일 것\n  [전문개정 2012. 2. 28.]", "R79-0": "제79조(적재기간 등 연장승인) 법 제251조제1항 단서의 규정에 의하여 적재기간의 연장승인을 얻고자 하는 자는 다음 각호의 사항을 기재한 신청서를 세관장에게 제출하여야 한다.\n    1. 수출신고번호ㆍ품명ㆍ규격 및 수량\n    2. 수출자ㆍ신고자 및 제조자\n    3. 연장승인신청의 사유\n    4. 기타 참고사항", "L240-6": "제240조의6(국가 간 세관정보의 상호 교환 등) ① 관세청장은 물품의 신속한 통관과 이 법을 위반한 물품의 반입을 방지하기 위하여 세계관세기구에서 정하는 수출입 신고항목 및 화물식별번호를 발급하거나 사용하게 할 수 있다.\n  ② 관세청장은 세계관세기구에서 정하는 수출입 신고항목 및 화물식별번호 정보를 다른 국가와 상호 조건에 따라 교환할 수 있다.\n  ③ 관세청장은 관세의 부과와 징수, 과세 불복에 대한 심리, 형사소추 및 수출입신고의 검증을 위하여 수출입신고자료 등 대통령령으로 정하는 사항을 대한민국 정부가 다른 국가와 관세행정에 관한 협력 및 상호지원에 관하여 체결한 협정과 국제기구와 체결한 국제협약에 따라 다른 법률에 저촉되지 아니하는 범위에서 다른 국가와 교환할 수 있다.<개정 2019. 12. 31.>\n  ④ 제3항에도 불구하고 관세청장은 상호주의 원칙에 따라 상대국에 수출입신고자료 등을 제공하는 것을 제한할 수 있다.\n  ⑤ 관세청장은 제3항에 따라 다른 국가와 수출입신고자료 등을 교환하는 경우 대통령령으로 정하는 바에 따라 이를 신고인 또는 그 대리인에게 통지하여야 한다.\n  [본조신설 2014. 12. 23.]", "L233-0": "제233조(원산지증명서 등의 확인요청 및 조사) ① 세관장은 원산지증명서를 발급한 국가의 세관이나 그 밖에 발급권한이 있는 기관(이하 이 조에서 “외국세관등” 이라 한다)에 제232조제1항 및 제3항에 따라 제출된 원산지증명서 및 원산지증명서확인자료의 진위 여부, 정확성 등의 확인을 요청할 수 있다. 이 경우 세관장의 확인요청은 해당 물품의 수입신고가 수리된 이후에 하여야 하며, 세관장은 확인을 요청한 사실 및 회신 내용과 그에 따른 결정 내용을 수입자에게 통보하여야 한다. <개정 2013. 1. 1., 2014. 1. 1.>\n  ② 제1항에 따라 세관장이 확인을 요청한 사항에 대하여 조약 또는 협정에서 다르게 규정한 경우를 제외하고 다음 각 호의 어느 하나에 해당하는 경우에는 일반특혜관세ㆍ국제협력관세 또는 편익관세를 적용하지 아니할 수 있다. 이 경우 세관장은 제38조의3제6항 및 제39조제2항에 따라 납부하여야 할 세액 또는 납부하여야 할 세액과 납부한 세액의 차액을 부과ㆍ징수하여야 한다.<신설 2014. 1. 1., 2016. 12. 20., 2025. 10. 1.>\n    1. 외국세관등이 재정경제부령으로 정한 기간 이내에 그 결과를 회신하지 아니한 경우\n    2. 세관장에게 신고한 원산지가 실제 원산지와 다른 것으로 확인된 경우\n    3. 외국세관등의 회신내용에 제229조에 따른 원산지증명서 및 원산지증명서확인자료를 확인하는 데 필요한 정보가 포함되지 아니한 경우\n  ③ 세관장은 원산지증명서가 발급된 물품을 수입하는 국가의 권한 있는 기관으로부터 원산지증명서 및 원산지증명서확인자료의 진위 여부, 정확성 등의 확인을 요청받은 경우 등 필요하다고 인정되는 경우에는 다음 각 호의 어느 하나에 해당하는 자를 대상으로 서면조사 또는 현지조사를 할 수 있다.<개정 2014. 1. 1., 2018. 12. 31.>\n    1. 원산지증명서를 발급받은 자\n    2. 원산지증명서를 발급한 자\n    3. 수출물품의 생산자 또는 수출자\n  ④ 제1항에 따른 확인요청 및 제3항에 따른 조사에 필요한 사항은 대통령령으로 정한다.<개정 2014. 1. 1.>\n  ⑤ 제1항부터 제4항까지의 규정에도 불구하고 조약ㆍ협정 등의 시행을 위하여 원산지증명서 확인요청 및 조사 등에 관한 사항을 따로 정할 필요가 있을 때에는 재정경제부령으로 정한다.<신설 2011. 12. 31., 2014. 1. 1., 2025. 10. 1.>\n  [전문개정 2010. 12. 30.]", "D257-0": "제257조(수입신고전 물품반출) ①법 제253조제1항의 규정에 의하여 수입하고자 하는 물품을 수입신고전에 즉시반출하고자 하는 자는 당해 물품의 품명ㆍ규격ㆍ수량 및 가격을 기재한 신고서를 제출하여야 한다.\n  ②법 제253조제1항의 규정에 의한 즉시반출을 할 수 있는 자 및 물품은 다음 각호의 1에 해당하는 것중 법 제226조제2항의 규정에 의한 구비조건의 확인에 지장이 없는 경우로서 세관장이 지정하는 것에 한한다.\n    1. 관세 등의 체납이 없고 최근 3년동안 수출입실적이 있는 제조업자 또는 외국인투자자가 수입하는 시설재 또는 원부자재\n    2. 삭제 <2010. 3. 26.>\n    3. 기타 관세 등의 체납우려가 없는 경우로서 관세청장이 정하는 물품", "L244-0": "제244조(입항전수입신고) ① 수입하려는 물품의 신속한 통관이 필요할 때에는 제243조제2항에도 불구하고 대통령령으로 정하는 바에 따라 해당 물품을 적재한 선박이나 항공기가 입항하기 전에 수입신고를 할 수 있다. 이 경우 입항전수입신고가 된 물품은 우리나라에 도착한 것으로 본다.\n  ② 세관장은 입항전수입신고를 한 물품에 대하여 제246조에 따른 물품검사의 실시를 결정하였을 때에는 수입신고를 한 자에게 이를 통보하여야 한다.\n  ③ 제2항에 따라 검사대상으로 결정된 물품은 수입신고를 한 세관의 관할 보세구역(보세구역이 아닌 장소에 장치하는 경우 그 장소를 포함한다)에 반입되어야 한다. 다만, 세관장이 적재상태에서 검사가 가능하다고 인정하는 물품은 해당 물품을 적재한 선박이나 항공기에서 검사할 수 있다.\n  ④ 제2항에 따라 검사대상으로 결정되지 아니한 물품은 입항 전에 그 수입신고를 수리할 수 있다.\n  ⑤ 입항전수입신고가 수리되고 보세구역 등으로부터 반출되지 아니한 물품에 대하여는 해당 물품이 지정보세구역에 장치되었는지 여부와 관계없이 제106조제4항을 준용한다.<개정 2020. 6. 9.>\n  ⑥ 입항전수입신고된 물품의 통관절차 등에 관하여 필요한 사항은 관세청장이 정한다.\n  [전문개정 2010. 12. 30.]", "R79-3": "제79조의3(준수도 측정ㆍ평가 결과 활용) 영 제259조의6제2항제3호에서 “재정경제부령으로 정하는 사항”이란 다음 각 호의 사항을 말한다. <개정 2018. 3. 21., 2022. 3. 18., 2026. 1. 2.>\n    1. 보세구역의 지정 또는 특허\n    2. 보세구역의 관리ㆍ감독\n    3. 법 제222조제1항에 따른 보세운송업자등의 관리ㆍ감독\n    4. 「자유무역지역의 지정 및 운영에 관한 법률」에 따른 자유무역지역 입주기업체의 지원ㆍ관리\n    5. 과태료ㆍ과징금의 산정\n    6. 행정제재 처분의 감경\n  [본조신설 2016. 3. 9.]\n  [종전 제79조의3은 제79조의4로 이동 <2016. 3. 9.>]", "L255-3": "제255조의3(수출입 안전관리 우수업체에 대한 혜택 등) ① 관세청장은 제255조의2에 따라 수출입 안전관리 우수업체로 공인된 업체(이하 “수출입안전관리우수업체”라 한다)에 통관절차 및 관세행정상의 혜택으로서 대통령령으로 정하는 사항을 제공할 수 있다.\n  ② 관세청장은 다른 국가의 수출입 안전관리 우수업체에 상호 조건에 따라 제1항에 따른 혜택을 제공할 수 있다.\n  ③ 관세청장은 수출입안전관리우수업체가 제255조의4제2항에 따른 자율 평가 결과를 보고하지 아니하는 등 대통령령으로 정하는 사유에 해당하는 경우 6개월의 범위에서 제1항에 따른 혜택의 전부 또는 일부를 정지할 수 있다.\n  ④ 관세청장은 제3항에 따른 사유에 해당하는 업체에 그 사유의 시정을 명할 수 있다.\n  [본조신설 2021. 12. 21.]", "D236-6": "제236조의6(원산지증명서확인자료 등) ① 법 제232조의2제2항 전단에서 “대통령령으로 정하는 자료”란 다음 각 호의 구분에 따른 자료로서 수출신고 수리일부터 3년 이내의 자료를 말한다.\n    1. 수출물품의 생산자가 제출하는 다음 각 목의 자료\n      가. 수출자에게 해당 물품의 원산지를 증명하기 위하여 제공한 서류\n      나. 수출자와의 물품공급계약서\n      다. 해당 물품의 생산에 사용된 원재료의 수입신고필증(생산자 명의로 수입신고한 경우만 해당한다)\n      라. 해당 물품 및 원재료의 생산 또는 구입 관련 증명 서류\n      마. 원가계산서ㆍ원재료내역서 및 공정명세서\n      바. 해당 물품 및 원재료의 출납ㆍ재고관리대장\n      사. 해당 물품의 생산에 사용된 재료를 공급하거나 생산한 자가 그 재료의 원산지를 증명하기 위하여 작성하여 생산자에게 제공한 서류\n      아. 원산지증명서 발급 신청서류(전자문서를 포함하며, 생산자가 원산지증명서를 발급받은 경우만 해당한다)\n    2. 수출자가 제출하는 다음 각 목의 자료\n      가. 원산지증명서가 발급된 물품을 수입하는 국가의 수입자에게 제공한 원산지증명서(전자문서를 포함한다)\n      나. 수출신고필증\n      다. 수출거래 관련 계약서\n      라. 원산지증명서 발급 신청서류(전자문서를 포함하며, 수출자가 원산지증명서를 발급받은 경우만 해당한다)\n      마. 제1호라목부터 바목까지의 서류(수출자가 원산지증명서를 발급받은 경우만 해당한다)\n    3. 원산지증명서를 발급한 자가 제출하는 다음 각 목의 자료\n      가. 발급한 원산지증명서(전자문서를 포함한다)\n      나. 원산지증명서 발급신청 서류(전자문서를 포함한다)\n      다. 그 밖에 발급기관이 보관 중인 자료로서 원산지 확인에 필요하다고 판단하는 자료\n  ② 법 제232조의2제2항제3호에서 “대통령령으로 정하는 자”란 해당 수출물품의 생산자 또는 수출자를 말한다.\n  [본조신설 2011. 4. 1.]", "L227-0": "제227조(의무 이행의 요구 및 조사) ① 세관장은 다른 법령에 따라 수입 후 특정한 용도로 사용하여야 하는 등의 의무가 부가되어 있는 물품에 대하여는 문서로써 해당 의무를 이행할 것을 요구할 수 있다.\n  ② 제1항에 따라 의무의 이행을 요구받은 자는 대통령령으로 정하는 특별한 사유가 없으면 해당 물품에 대하여 부가된 의무를 이행하여야 한다.\n  ③ 세관장은 제1항에 따라 의무의 이행을 요구받은 자의 이행 여부를 확인하기 위하여 필요한 경우 세관공무원으로 하여금 조사하게 할 수 있다. 이 경우 제240조의3을 준용한다.<신설 2021. 12. 21.>\n  [전문개정 2010. 12. 30.]\n  [제목개정 2021. 12. 21.]", "L245-0": "제245조(신고 시의 제출서류) ① 제241조 또는 제244조에 따른 수출ㆍ수입 또는 반송의 신고를 하는 자는 과세가격결정자료 외에 대통령령으로 정하는 서류를 제출하여야 한다. <개정 2013. 8. 13.>\n  ② 제1항에 따라 서류를 제출하여야 하는 자가 해당 서류를 관세사등에게 제출하고, 관세사등이 해당 서류를 확인한 후 제241조 또는 제244조에 따른 수출ㆍ수입 또는 반송에 관한 신고를 할 때에는 해당 서류의 제출을 생략하게 하거나 해당 서류를 수입신고 수리 후에 제출하게 할 수 있다.\n  ③ 제2항에 따라 서류의 제출을 생략하게 하거나 수입신고 수리 후에 서류를 제출하게 하는 경우 세관장이 필요하다고 인정하여 신고인에게 관세청장이 정하는 장부나 그 밖의 관계 자료의 제시 또는 제출을 요청하면 신고인은 이에 따라야 한다.\n  [전문개정 2010. 12. 30.]", "D245-4": "제245조의4(간이한 통관절차 적용대상 국가) ① 법 제240조의5에 따른 간이한 통관절차(이하 “통관절차의 특례”라 한다)를 적용받을 수 있는 국가는 다음 각 호의 국가로 한다.\n    1. 우리나라와 통관절차의 편익에 관한 협정을 체결한 국가\n    2. 우리나라와 무역협정 등을 체결한 국가\n  ② 통관절차의 특례 부여의 절차 및 특례 부여 중지, 그 밖에 필요한 사항은 관세청장이 정하여 고시한다.\n  [본조신설 2015. 2. 6.]", "D259-4": "제259조의4(수출입안전관리우수업체에 대한 혜택 등) ① 법 제255조의3제1항에서 “대통령령으로 정하는 사항”이란 수출입물품에 대한 검사 완화나 수출입신고 및 관세납부 절차 간소화 등의 사항을 말한다.\n  ② 제1항에 따른 통관절차 및 관세행정상의 혜택의 세부내용은 관세청장이 정하여 고시한다.\n  ③ 법 제255조의3제3항에서 “법 제255조의4제2항에 따른 자율 평가 결과를 보고하지 아니하는 등 대통령령으로 정하는 사유”란 다음 각 호의 어느 하나에 해당하는 경우를 말한다.\n    1. 수출입안전관리우수업체가 법 제255조의4제2항에 따라 자율평가 결과를 보고하지 않은 경우\n    2. 수출입안전관리우수업체가 법 제255조의4제3항에 따라 변동사항 보고를 하지 않은 경우\n    3. 수출입안전관리우수업체(대표자 및 제259조의5제1항에 따라 지정된 관리책임자를 포함한다)가 법 또는 「자유무역협정의 이행을 위한 관세법의 특례에 관한 법률」, 「대외무역법」, 「외국환거래법」, 「수출용 원재료에 대한 관세 등 환급에 관한 특례법」 등 수출입과 관련된 법령을 위반한 경우\n    4. 수출입안전관리우수업체가 소속 직원에게 안전관리기준에 관한 교육을 실시하지 않는 등 관세청장이 수출입안전관리우수업체에 제공하는 혜택을 정지할 필요가 있다고 인정하여 고시하는 경우\n  [본조신설 2022. 2. 15.]\n  [종전 제259조의4는 제259조의6으로 이동 <2022. 2. 15.>]", "D249-0": "제249조(입항전 수입신고) ①법 제244조제1항의 규정에 의한 수입신고는 당해 물품을 적재한 선박 또는 항공기가 그 물품을 적재한 항구 또는 공항에서 출항하여 우리나라에 입항하기 5일전(항공기의 경우 1일전)부터 할 수 있다.\n  ②출항부터 입항까지의 기간이 단기간인 경우 등 당해 선박 등이 출항한 후에 신고하는 것이 곤란하다고 인정되어 출항하기 전에 신고하게 할 필요가 있는 때에는 관세청장이 정하는 바에 따라 그 신고시기를 조정할 수 있다.\n  ③제1항에도 불구하고 다음 각 호의 어느 하나에 해당하는 물품은 해당 물품을 적재한 선박 등이 우리나라에 도착된 후에 수입신고하여야 한다. <개정 2008. 2. 22.>\n    1. 세율이 인상되거나 새로운 수입요건을 갖추도록 요구하는 법령이 적용되거나 적용될 예정인 물품\n    2. 수입신고하는 때와 우리나라에 도착하는 때의 물품의 성질과 수량이 달라지는 물품으로서 관세청장이 정하는 물품", "D259-2": "제259조의2(수출입 안전관리 기준 등) ① 법 제255조의2제1항에 따른 안전관리 기준(이하 “안전관리기준”이라 한다)은 다음 각 호와 같다. <개정 2015. 2. 6.>\n    1. 「관세법」, 「자유무역협정의 이행을 위한 관세법의 특례에 관한 법률」, 「대외무역법」 등 수출입에 관련된 법령을 성실하게 준수하였을 것\n    2. 관세 등 영업활동과 관련한 세금을 체납하지 않는 등 재무 건전성을 갖출 것\n    3. 수출입물품의 안전한 관리를 확보할 수 있는 운영시스템, 거래업체, 운송수단 및 직원교육체계 등을 갖출 것\n    4. 그 밖에 세계관세기구에서 정한 수출입 안전관리에 관한 표준 등을 반영하여 관세청장이 정하는 기준을 갖출 것\n  ② 관세청장은 법 제255조의2제2항에 따른 심사를 할 때 「국제항해선박 및 항만시설의 보안에 관한 법률」 제12조에 따른 국제선박보안증서를 교부받은 국제항해선박소유자 또는 같은 법 제27조에 따른 항만시설적합확인서를 교부받은 항만시설소유자에 대하여는 제1항 각 호의 안전관리 기준 중 일부에 대하여 심사를 생략할 수 있다.\n  ③ 삭제 <2022. 2. 15.>\n  ④ 삭제 <2022. 2. 15.>\n  ⑤ 삭제 <2022. 2. 15.>\n  [본조신설 2009. 2. 4.]", "D259-8": "제259조의8(우편물의 사전전자정보 제출) ① 법 제256조의2제1항에서 “대통령령으로 정하는 전자정보”란 다음 각 호의 정보를 말한다.\n    1. 사전 통관정보: 우편물에 관한 전자적 통관정보로서 다음 각 목의 정보\n      가. 우편물번호, 발송인 및 수취인의 성명과 주소, 총수량 및 총중량\n      나. 개별 우편물의 품명ㆍ수량ㆍ중량 및 가격\n      다. 그 밖에 수입하려는 우편물에 관한 통관정보로서 관세청장이 정하여 고시하는 정보\n    2. 사전 발송정보: 개별 우편물이 들어있는 우편 용기에 관한 전자적 발송정보로서 다음 각 목의 정보\n      가. 우편물 자루번호 및 우편물번호\n      나. 발송ㆍ도착 예정 일시, 발송국ㆍ도착국 공항 또는 항만의 명칭, 운송수단\n      다. 그 밖에 수입하려는 우편물에 관한 발송정보로서 관세청장이 정하여 고시하는 정보\n  ② 통관우체국의 장은 법 제256조의2제1항에 따라 제1항 각 호의 전자정보(이하 “사전전자정보”라 한다)를 정보통신망을 이용하여 세관장에게 제출해야 한다.\n  ③ 세관장은 법 제256조의2제2항에 따라 사전전자정보가 제출되지 않은 우편물을 통관우체국의 장으로 하여금 반송하도록 하기로 결정한 경우에는 그 결정사항을 통관우체국의 장에게 통지해야 한다.\n  ④ 제3항에 따른 통지를 받은 통관우체국의 장은 우편물의 수취인이나 발송인에게 그 결정사항을 통지하고 반송해야 한다.\n  ⑤ 법 제256조의2제3항 단서에서 “대통령령으로 정하는 사유”란 다음 각 호의 사유를 말한다.\n    1. 세관장이 법 제39조에 따라 관세를 부과ㆍ징수하려는 경우\n    2. 세관장이 법 제235조 또는 제237조에 따라 우편물의 통관을 보류하거나 유치할 필요가 있는 경우\n    3. 법 제256조의2제1항에 따라 제출된 사전전자정보가 불충분하거나 불분명한 경우\n    4. 법 제258조제2항에 따라 법 제241조제1항에 따른 수입신고를 해야 하는 경우\n    5. 세관장이 관세 관계 법령 위반 혐의가 있는 우편물을 조사하려는 경우\n  [본조신설 2022. 2. 15.]", "L240-5": "제240조의5(상호주의에 따른 통관절차 간소화) 국제무역 및 교류를 증진하고 국가 간의 협력을 촉진하기 위하여 우리나라에 대하여 통관절차의 편익을 제공하는 국가에서 수입되는 물품에 대하여는 상호 조건에 따라 대통령령으로 정하는 바에 따라 간이한 통관절차를 적용할 수 있다.\n  [본조신설 2014. 12. 23.]", "D258-0": "제258조(전자상거래물품의 특별통관 등) ① 법 제254조제1항에서 “대통령령으로 정하는 물품”이란 개인의 자가사용물품을 말한다. <신설 2025. 2. 28.>\n  ② 관세청장은 법 제254조제1항에 따라 다음 각 호의 사항을 관세청장이 정하여 고시하는 바에 따라 생략하거나 간소한 방법으로 적용할 수 있다. <개정 2025. 2. 28.>\n    1. 삭제 <2025. 2. 28.>\n    2. 수출입신고 방법 및 절차\n    3. 관세 등에 대한 납부방법\n    4. 물품검사방법\n    5. 그 밖에 관세청장이 필요하다고 인정하는 사항\n  ③ 법 제254조제2항에 따라 통관에 필요한 사항을 생략하거나 간소한 방법으로 적용받기 위해 등록하려는 자는 다음 각 호의 사항을 포함하여 관세청장이 정하는 등록신청서를 관세청장 또는 세관장에게 제출해야 한다. <신설 2025. 2. 28.>\n    1. 신청인의 성명ㆍ주소 및 상호\n    2. 영업의 종류, 영업장소 및 번호(해당 영업 관련 신고번호나 사업자등록번호 등 관련 법령에 따라 신고나 등록을 한 번호가 있는 경우로 한정한다)\n  ④ 관세청장 또는 세관장은 제3항에 따라 등록신청을 한 자가 다음 각 호의 요건을 모두 갖춘 경우에는 관세청장이 정하는 바에 따라 등록부에 필요한 사항을 적고 등록증을 발급한다. <신설 2025. 2. 28., 2026. 2. 27.>\n    1. 관세 및 국세의 체납이 없을 것\n    2. 법 제283조제1항에 따른 관세범으로 조사받고 있거나 기소되어 있지 않을 것\n    3. 법 제175조제4호, 제5호 및 제7호의 어느 하나에 해당하지 않을 것\n  ⑤ 법 제254조제3항에서 “대통령령으로 정하는 정보”란 다음 각 호의 정보를 말한다. <개정 2025. 2. 28.>\n    1. 주문번호 및 구매 일자\n    2. 물품수신인의 성명 및 통관고유부호\n    3. 물품의 품명 및 수량\n    4. 물품의 결제금액\n    5. 그 밖에 관세청장이 전자상거래물품의 통관을 위하여 수입신고 전에 제공받을 필요가 있다고 인정하여 고시하는 정보\n  ⑥ 법 제254조제3항에 따라 요청받은 정보의 제공은 관세청장이 정하는 전자적 매체를 통해 제공하는 방법으로 한다. <개정 2025. 2. 28.>\n  ⑦ 제6항에 따라 정보를 제공하는 경우 그 제공 기간은 주문 또는 배송의 결제가 완료되는 시점부터 수입 전까지로 한다. <개정 2025. 2. 28.>\n  ⑧ 법 제254조제5항에서 “대통령령으로 정하는 사항”이란 다음 각 호의 사항을 말한다. <개정 2025. 2. 28.>\n    1. 물품의 품명\n    2. 납부세액\n    3. 선하증권 또는 화물운송장 번호\n    4. 그 밖에 관세청장이 전자상거래물품의 화주에게 안내할 필요가 있다고 인정하여 고시하는 정보\n  ⑨ 법 제254조제7항에 따라 등록의 유효기간을 갱신하려는 자는 관세청장이 정하는 등록갱신신청서를 유효기간 만료일부터 역산하여 1개월 이내에 관세청장 또는 세관장에게 제출해야 한다. <신설 2025. 2. 28.>\n  [전문개정 2023. 2. 28.]", "D251-3": "제251조의3(수출입물품안전관리기관협의회의 구성 및 운영 등) ① 법 제246조의3제7항에서 “안전성 검사에 필요한 정보교류, 제264조의10에 따른 불법ㆍ불량ㆍ유해물품에 대한 정보 등의 제공 요청 등 대통령령으로 정하는 사항”이란 다음 각 호의 사항을 말한다. <개정 2018. 2. 13., 2021. 2. 17.>\n    1. 법 제246조의3제1항에 따른 안전성 검사(이하 “안전성 검사”라 한다)에 필요한 정보교류\n    2. 법 제264조의10에 따른 불법ㆍ불량ㆍ유해물품에 대한 정보 등의 제공에 관한 사항\n    3. 안전성 검사 대상 물품의 선정에 관한 사항\n    4. 그 밖에 관세청장이 안전성 검사, 불법ㆍ불량ㆍ유해물품에 대한 정보 등의 제공과 관련하여 협의가 필요하다고 인정하는 사항\n  ② 법 제246조의3제7항에 따른 수출입물품안전관리기관협의회(이하 이 조에서 “협의회”라 한다)는 위원장 1명을 포함하여 25명 이내의 위원으로 구성한다. <개정 2018. 2. 13.>\n  ③ 협의회의 위원장은 관세청 소속 고위공무원단에 속하는 공무원 중에서 관세청장이 지명하는 사람으로 하고, 위원은 다음 각 호의 사람으로 한다.\n    1. 관세청의 4급 이상 공무원 중에서 관세청장이 지명하는 사람 1명\n    2. 관계 중앙행정기관의 4급 이상 공무원 중에서 해당 기관의 장이 지명하는 사람 각 1명\n  ④ 제2항에 따라 협의회의 위원을 지명한 자는 해당 위원이 다음 각 호의 어느 하나에 해당하는 경우에는 그 지명을 철회할 수 있다.\n    1. 심신장애로 인하여 직무를 수행할 수 없게 된 경우\n    2. 직무와 관련된 비위사실이 있는 경우\n    3. 직무태만, 품위손상이나 그 밖의 사유로 인하여 위원으로 적합하지 아니하다고 인정되는 경우\n    4. 위원 스스로 직무를 수행하는 것이 곤란하다고 의사를 밝히는 경우\n  ⑤ 협의회의 회의는 위원의 과반수 출석으로 개의하고, 출석위원 3분의 2 이상의 찬성으로 의결한다.\n  ⑥ 제1항부터 제5항까지에서 규정한 사항 외에 협의회의 운영에 필요한 사항은 협의회의 의결을 거쳐 위원장이 정한다.\n  [본조신설 2016. 2. 5.]", "L255-5": "제255조의5(수출입안전관리우수업체의 공인 취소 등) ① 관세청장은 수출입안전관리우수업체가 다음 각 호의 어느 하나에 해당하는 경우에는 공인을 취소할 수 있다. 다만, 제1호에 해당하는 경우에는 공인을 취소하여야 한다. <개정 2026. 8. 11.>\n    1. 거짓이나 그 밖의 부정한 방법으로 공인을 받거나 공인을 갱신받은 경우\n    2. 수출입안전관리우수업체가 양도, 양수, 분할 또는 합병 등으로 공인 당시의 업체와 동일하지 아니하다고 관세청장이 판단하는 경우\n    3. 제255조의2제1항에 따른 안전관리 기준을 충족하지 못하는 경우\n    4. 제255조의3제3항에 따른 정지 처분을 공인의 유효기간 동안 5회 이상 받은 경우\n    5. 제255조의3제4항에 따른 시정명령을 정당한 사유 없이 이행하지 아니한 경우\n    6. 그 밖에 수출입 관련 법령을 위반한 경우로서 대통령령으로 정하는 경우\n  ② 제1항제1호 및 제6호(수출입 관련 법령에 따라 벌금형 이상의 형을 선고받거나 통고처분을 받은 경우만 해당한다)에 따라 공인이 취소된 자는 공인이 취소된 날부터 2년 이내에는 다시 공인받을 수 없다.<신설 2026. 8. 11.>\n  [본조신설 2021. 12. 21.]\n  [제목개정 2026. 8. 11.]", "D259-5": "제259조의5(수출입안전관리우수업체에 대한 사후관리 등) ① 수출입안전관리우수업체는 법 제255조의4제2항에 따라 안전관리기준의 충족 여부를 평가ㆍ보고하는 관리책임자를 지정해야 한다.\n  ② 수출입안전관리우수업체는 법 제255조의4제2항에 따라 안전관리기준의 충족 여부를 매년 자율적으로 평가하여 그 결과를 해당 업체가 수출입안전관리우수업체로 공인된 날이 속하는 달의 다음 달 15일까지 관세청장에게 보고해야 한다. 다만, 제259조의3제2항에 따라 공인의 갱신을 신청한 경우로서 공인의 유효기간이 끝나는 날이 속한 연도에 실시해야 하는 경우의 평가는 생략할 수 있다.\n  ③ 법 제255조의5제6호에서 “대통령령으로 정하는 경우”란 수출입안전관리우수업체(대표자 및 제1항에 따라 지정된 관리책임자를 포함한다)가 다음 각 호의 어느 하나에 해당하는 경우를 말한다. 다만, 법 제279조 또는 제3호ㆍ제4호에서 정한 법률의 양벌규정에 따라 처벌받은 경우는 제외한다. <개정 2023. 2. 28.>\n    1. 법 제268조의2, 제269조, 제270조, 제270조의2, 제271조, 제274조 및 제275조의2부터 제275조의4까지의 규정에 따라 벌금형 이상의 형을 선고받거나 통고처분을 받은 경우\n    2. 법 제276조에 따라 벌금형의 선고를 받은 경우\n    3. 「자유무역협정의 이행을 위한 관세법의 특례에 관한 법률」, 「대외무역법」, 「외국환거래법」, 「수출용 원재료에 대한 관세 등 환급에 관한 특례법」 등 수출입과 관련된 법령을 위반하여 벌금형 이상의 형을 선고받은 경우\n    4. 「관세사법」 제29조에 따라 벌금형 이상의 형을 선고받거나 통고처분[같은 조 제4항 및 같은 법 제32조(같은 법 제29조제4항과 관련된 부분으로 한정한다)에 따라 적용되는 이 법 제311조에 따른 통고처분은 제외한다]을 받은 경우\n  [본조신설 2022. 2. 15.]", "D262-0": "제262조(세관장 등의 통지) ①법 제258조제2항에 해당하는 우편물에 있어서 법 제259조제1항의 규정에 의한 통지는 법 제248조의 규정에 의한 신고의 수리 또는 법 제252조의 규정에 의한 승인을 받은 서류를 당해 신고인이 통관우체국에 제출하는 것으로써 이에 갈음한다.\n  ②제1항의 경우에 법 제259조제2항에 따른 통지는 세관이 발행하는 납부고지서로 갈음한다. <개정 2021. 2. 17.>", "D236-2": "제236조의2(원산지 등에 대한 사전확인) ①법 제232조의 규정에 의하여 원산지확인이 필요한 물품을 수입하는 자는 관세청장에게 다음 각호의 1에 해당하는 사항에 대하여 당해 물품의 수입신고를 하기 전에 미리 확인 또는 심사(이하 “사전확인”이라 한다)하여 줄 것을 신청할 수 있다.\n    1. 법 제229조의 규정에 따른 원산지 확인기준의 충족여부\n    2. 조약 또는 협정 등의 체결로 인하여 관련법령에서 특정물품에 대한 원산지 확인기준을 달리 정하고 있는 경우에 당해 법령에 따른 원산지 확인기준의 충족여부\n    3. 제1호 및 제2호의 원산지 확인기준의 충족여부를 결정하기 위한 기초가 되는 사항으로서 관세청장이 정하는 사항\n    4. 그 밖에 관세청장이 원산지에 따른 관세의 적용과 관련하여 필요하다고 정하는 사항\n  ②사전확인의 신청을 받은 경우 관세청장은 60일 이내에 이를 확인하여 그 결과를 기재한 서류(이하 “사전확인서”라 한다)를 신청인에게 교부하여야 한다. 다만, 제출자료의 미비 등으로 인하여 사전확인이 곤란한 경우에는 그 사유를 신청인에게 통지하여야 한다.\n  ③세관장은 수입신고된 물품 및 원산지증명서의 내용이 사전확인서상의 내용과 동일하다고 인정되는 때에는 특별한 사유가 없는 한 사전확인서의 내용에 따라 관세의 경감 등을 적용하여야 한다.\n  ④ 제2항에 따른 사전확인의 결과를 통지받은 자(제236조의3제1항에 따른 사전확인서의 내용변경 통지를 받은 자를 포함한다)는 그 통지내용에 이의를 제기하려는 경우 그 결과를 통지받은 날부터 30일 이내에 다음 각 호의 사항이 기재된 신청서에 이의제기 내용을 확인할 수 있는 자료를 첨부하여 관세청장에게 제출하여야 한다. <신설 2012. 2. 2.>\n    1. 이의를 제기하는 자의 성명과 주소 또는 거소\n    2. 해당 물품의 품명ㆍ규격ㆍ용도ㆍ수출자ㆍ생산자 및 수입자\n    3. 이의제기의 요지와 내용\n  ⑤ 관세청장은 제4항에 따라 이의제기를 받은 때에는 이를 심사하여 30일 이내에 그 결정 내용을 신청인에게 알려야 한다. <신설 2012. 2. 2.>\n  ⑥ 관세청장은 이의제기의 내용이나 절차가 적합하지 아니하거나 보정할 수 있다고 인정되는 때에는 20일 이내의 기간을 정하여 다음 각 호의 사항을 적은 문서로써 보정하여 줄 것을 요구할 수 있다. 이 경우 보정기간은 제5항에 따른 심사결정기간에 산입하지 아니한다. <신설 2012. 2. 2.>\n    1. 보정할 사항\n    2. 보정을 요구하는 이유\n    3. 보정할 기간\n    4. 그 밖의 필요한 사항\n  [본조신설 2004. 3. 29.]", "D239-0": "제239조(통관보류등) ① 세관장은 법 제235조제3항 및 제4항에 따라 통관보류등이 요청된 같은 조 제3항 각 호의 어느 하나에 해당하는 물품이 지식재산권등을 침해한 물품이라고 인정되면 해당 물품의 통관보류등을 하여야 한다. 다만, 지식재산권등의 권리자가 해당 물품의 통관 또는 유치 해제에 동의하는 때에는 관세청장이 정하는 바에 따라 통관을 허용하거나 유치를 해제할 수 있다. <개정 2011. 4. 1., 2025. 2. 28.>\n  ② 세관장은 법 제235조제5항 및 제7항에 따라 통관보류등을 한 경우 그 사실을 해당 물품의 수출입, 환적 또는 복합환적, 보세구역 반입, 보세운송, 법 제141조제1호에 따른 일시양륙의 신고(이하 “수출입신고등”이라 한다)를 한 자 또는 법 제235조제3항제6호에 해당하는 물품의 화주(이하 “우편물의 화주”라 한다)에게 통보해야 하며, 지식재산권등의 권리자에게는 통관보류등의 사실 및 다음 각 호의 사항을 통보해야 한다. <개정 2008. 2. 22., 2011. 4. 1., 2021. 2. 17., 2023. 2. 28., 2025. 2. 28., 2026. 2. 27.>\n    1. 다음 각 목에 해당하는 자의 성명과 주소\n      가. 수출입신고등을 한 자 또는 우편물의 화주\n      나. 물품발송인\n      다. 물품수신인\n    2. 통관보류등을 한 물품의 성질ㆍ상태 및 수량\n    3. 원산지 등 그 밖의 필요한 사항\n  ③세관장은 통관보류등을 요청한 자가 제2항에 따라 해당 물품에 대한 통관보류등의 사실을 통보받은 후 10일(법 제8조제3항 각 호에 해당하는 날은 제외한다. 이하 이 항에서 같다) 이내에 법원에의 제소사실 또는 무역위원회에의 조사신청사실을 입증하였을 때에는 해당 통관보류등을 계속할 수 있다. 이 경우 통관보류등을 요청한 자가 부득이한 사유로 인하여 10일 이내에 법원에 제소하지 못하거나 무역위원회에 조사신청을 하지 못하는 때에는 상기 입증기간은 10일간 연장될 수 있다. <개정 2011. 4. 1., 2017. 3. 27., 2023. 2. 28.>\n  ④제3항에도 불구하고 해당 통관보류등이 법원의 임시보호조치에 따라 시행되는 상태이거나 계속되는 경우 통관보류등의 기간은 다음 각 호의 구분에 따른다. <개정 2011. 4. 1., 2021. 2. 17.>\n    1. 법원에서 임시보호조치 기간을 명시한 경우: 그 마지막 날\n    2. 법원에서 임시보호조치 기간을 명시하지 않은 경우: 임시보호조치 개시일부터 31일\n  ⑤법 제235조제7항에 따른 통관보류등은 위반사실 및 통관보류등을 한 해당 물품의 신고번호ㆍ품명ㆍ수량 등을 명시한 문서로써 하여야 한다. <신설 2007. 4. 5., 2011. 4. 1.>\n  ⑥법 제235조제5항 및 제7항에 따라 통관보류등이 된 물품은 통관이 허용되거나 유치가 해제될 때까지 세관장이 지정한 장소에 보관하여야 한다. <개정 2007. 4. 5., 2011. 4. 1.>\n  [제목개정 2011. 4. 1.]", "L258-0": "제258조(우편물통관에 대한 결정) ① 통관우체국의 장은 세관장이 우편물에 대하여 수출ㆍ수입 또는 반송을 할 수 없다고 결정하였을 때에는 그 우편물을 발송하거나 수취인에게 내줄 수 없다.\n  ② 우편물이 「대외무역법」 제11조에 따른 수출입의 승인을 받은 것이거나 그 밖에 대통령령으로 정하는 기준에 해당하는 것일 때에는 해당 우편물의 수취인이나 발송인은 제241조제1항에 따른 신고를 하여야 한다.<개정 2021. 12. 21.>\n  [전문개정 2010. 12. 30.]", "D234-0": "제234조(의무의 면제) 법 제227조제1항의 규정에 의하여 수입신고수리시에 부과된 의무를 면제받고자 하는 자는 다음 각호의 1에 해당하는 경우에 한하여 당해 의무이행을 요구한 세관장의 승인을 얻어야 한다.\n    1. 법령이 정하는 허가ㆍ승인ㆍ추천 기타 조건을 구비하여 의무이행이 필요하지 아니하게 된 경우\n    2. 법령의 개정 등으로 인하여 의무이행이 해제된 경우\n    3. 관계행정기관의 장의 요청 등으로 부과된 의무를 이행할 수 없는 사유가 있다고 인정된 경우", "R77-4": "제77조의4(무역원활화 위원회의 구성) ① 영 제245조의2제3항제1호에 따라 재정경제부장관이 임명하는 위원은 다음 각 호와 같다. <개정 2017. 3. 31., 2021. 3. 16., 2023. 3. 20., 2025. 10. 31., 2026. 1. 2.>\n    1. 재정경제부 관세정책관\n    2. 과학기술정보통신부, 농림축산식품부, 산업통상부, 기후에너지환경부, 국토교통부, 해양수산부, 식품의약품안전처 및 관세청 소속 고위공무원단에 속하는 일반직공무원 중에서 그 소속기관의 장이 추천하는 사람\n  ② 영 제245조의2제3항제2호가목에 따라 재정경제부장관이 위촉하는 위원은 「관세사법」에 따른 관세사회, 「대한무역투자진흥공사법」에 따른 대한무역투자진흥공사, 「민법」 제32조에 따라 산업통상부장관의 허가를 받아 설립된 한국무역협회 및 「상공회의소법」에 따른 대한상공회의소의 임원 중에서 그 소속기관의 장이 추천하는 사람으로 한다. <개정 2025. 10. 31., 2026. 1. 2.>\n  ③ 삭제 <2023. 3. 20.>\n  [본조신설 2015. 7. 16.]\n  [종전 제77조의4는 제77조의5로 이동 <2015. 7. 16.>]", "D259-6": "제259조의6(준수도측정ㆍ평가의 절차 및 활용 등) ① 관세청장은 법 제255조의7제1항에 따라 연 4회의 범위에서 다음 각 호의 어느 하나에 해당하는 자를 대상으로 안전관리기준의 준수 정도에 대한 측정ㆍ평가(이하 이 조에서 “준수도측정ㆍ평가”라 한다)를 할 수 있다. <개정 2022. 2. 15., 2025. 2. 28.>\n    1. 운영인\n    2. 법 제19조에 따른 납세의무자\n    3. 법 제172조제2항에 따른 화물관리인\n    4. 법 제225조제1항에 따른 선박회사 또는 항공사\n    5. 법 제242조에 따른 수출ㆍ수입ㆍ반송 등의 신고인(화주를 포함한다)\n    6. 법 제254조제2항에 따라 등록한 전자상거래업체등\n    7. 보세운송업자등\n    8. 「자유무역지역의 지정 및 운영에 관한 법률」 제2조제2호에 따른 입주기업체\n  ② 관세청장은 법 제255조의7제2항에 따라 준수도측정ㆍ평가의 결과를 다음 각 호의 사항에 활용할 수 있다. <개정 2022. 2. 15., 2025. 12. 30.>\n    1. 간이한 신고 방식의 적용 등 통관 절차의 간소화\n    2. 검사 대상 수출입물품의 선별\n    3. 그 밖에 업체 및 화물 관리의 효율화를 위하여 재정경제부령으로 정하는 사항\n  ③ 준수도측정ㆍ평가에 대한 평가 항목, 배점 및 등급 등 세부 사항은 관세청장이 정하여 고시한다. <개정 2022. 2. 15.>\n  [본조신설 2015. 2. 6.]\n  [제목개정 2022. 2. 15.]\n  [제259조의4에서 이동 <2022. 2. 15.>]", "L235-0": "제235조(지식재산권 등의 보호) ① 다음 각 호의 어느 하나에 해당하는 지식재산권 등을 침해하는 물품은 수출하거나 수입할 수 없다. <개정 2012. 6. 1., 2020. 12. 22., 2024. 12. 31.>\n    1. 「상표법」에 따라 설정등록된 상표권\n    2. 「저작권법」에 따른 저작권과 저작인접권(이하 “저작권등”이라 한다)\n    3. 「식물신품종 보호법」에 따라 설정등록된 품종보호권\n    4. 「농수산물 품질관리법」에 따라 등록되거나 조약ㆍ협정 등에 따라 보호대상으로 지정된 지리적표시권 또는 지리적표시(이하 “지리적표시권등”이라 한다)\n    5. 「특허법」에 따라 설정등록된 특허권\n    6. 「디자인보호법」에 따라 설정등록된 디자인권\n    7. 「방위산업기술 보호법」에 따른 방위산업기술(이하 “방위산업기술”이라 한다)\n  ② 관세청장은 제1항 각 호에 따른 지식재산권 등을 침해하는 물품을 효율적으로 단속하기 위하여 필요한 경우에는 해당 지식재산권 등을 관계 법령에 따라 등록 또는 설정등록한 자 등으로 하여금 해당 지식재산권 등에 관한 사항을 신고하게 할 수 있다.<개정 2024. 12. 31.>\n  ③ 세관장은 다음 각 호의 어느 하나에 해당하는 물품이 제2항에 따라 신고된 지식재산권 등을 침해하였다고 인정될 때에는 그 지식재산권 등을 신고한 자에게 해당 물품의 수출입, 환적, 복합환적, 보세구역 반입, 보세운송, 제141조제1호에 따른 일시양륙의 신고(이하 이 조에서 “수출입신고등”이라 한다) 또는 통관우체국 도착 사실을 통보하여야 한다. 이 경우 통보를 받은 자는 세관장에게 담보를 제공하고 해당 물품의 통관 보류나 유치를 요청할 수 있다.<개정 2022. 12. 31., 2024. 12. 31.>\n    1. 수출입신고된 물품\n    2. 환적 또는 복합환적 신고된 물품\n    3. 보세구역에 반입신고된 물품\n    4. 보세운송신고된 물품\n    5. 제141조제1호에 따라 일시양륙이 신고된 물품\n    6. 통관우체국에 도착한 물품\n  ④ 제1항 각 호에 따른 지식재산권 등을 보호받으려는 자는 세관장에게 담보를 제공하고 해당 물품의 통관 보류나 유치를 요청할 수 있다.<개정 2024. 12. 31.>\n  ⑤ 제3항 또는 제4항에 따른 요청을 받은 세관장은 특별한 사유가 없으면 해당 물품의 통관을 보류하거나 유치하여야 한다. 다만, 수출입신고등을 한 자 또는 제3항제6호에 해당하는 물품의 화주가 담보를 제공하고 통관 또는 유치 해제를 요청하는 경우에는 다음 각 호의 물품을 제외하고는 해당 물품의 통관을 허용하거나 유치를 해제할 수 있다.\n  <개정 2020. 6. 9., 2022. 12. 31., 2024. 12. 31.>\n    1. 위조하거나 유사한 상표를 붙여 제1항제1호에 따른 상표권을 침해하는 물품\n    2. 불법복제된 물품으로서 저작권등을 침해하는 물품\n    3. 같거나 유사한 품종명칭을 사용하여 제1항제3호에 따른 품종보호권을 침해하는 물품\n    4. 위조하거나 유사한 지리적표시를 사용하여 지리적표시권등을 침해하는 물품\n    5. 특허로 설정등록된 발명을 사용하여 제1항제5호에 따른 특허권을 침해하는 물품\n    6. 같거나 유사한 디자인을 사용하여 제1항제6호에 따른 디자인권을 침해하는 물품\n    7. 다음 각 목의 어느 하나에 해당하는 방위산업기술이 사용된 물품\n      가. 부정한 방법으로 취득한 방위산업기술\n      나. 가목에 해당하는 방위산업기술임을 알고 취득한 방위산업기술\n  ⑥ 제2항부터 제5항까지의 규정에 따른 지식재산권 등에 관한 신고, 담보 제공, 통관의 보류ㆍ허용 및 유치ㆍ유치해제 등에 필요한 사항은 대통령령으로 정한다.<개정 2024. 12. 31.>\n  ⑦ 세관장은 제3항 각 호에 따른 물품이 제1항 각 호의 어느 하나에 해당하는 지식재산권 등을 침해하였음이 명백한 경우에는 대통령령으로 정하는 바에 따라 직권으로 해당 물품의 통관을 보류하거나 해당 물품을 유치할 수 있다. 이 경우 세관장은 해당 물품의 수출입신고등을 한 자 또는 제3항제6호에 해당하는 물품의 화주에게 그 사실을 즉시 통보하여야 한다.<개정 2022. 12. 31., 2024. 12. 31.>\n  [전문개정 2010. 12. 30.]\n  [제목개정 2024. 12. 31.]", "L243-0": "제243조(신고의 요건) ① 제206조제1항제1호가목의 물품 중 관세청장이 정하는 물품은 관세청장이 정하는 바에 따라 반송방법을 제한할 수 있다. <개정 2020. 12. 22.>\n  ② 제241조제1항에 따른 수입의 신고는 해당 물품을 적재한 선박이나 항공기가 입항된 후에만 할 수 있다.\n  ③ 제241조제1항에 따른 반송의 신고는 해당 물품이 이 법에 따른 장치 장소에 있는 경우에만 할 수 있다.\n  ④ 밀수출 등 불법행위가 발생할 우려가 높거나 감시단속을 위하여 필요하다고 인정하여 대통령령으로 정하는 물품은 관세청장이 정하는 장소에 반입한 후 제241조제1항에 따른 수출의 신고를 하게 할 수 있다.<신설 2015. 12. 15., 2020. 6. 9.>\n  [전문개정 2010. 12. 30.]", "D258-5": "제258조의5(세관장과 탁송품 운송업자간 협력 등) 법 제254조의2제9항에서 “세관장과 탁송품 운송업자간 협력에 관한 사항 등 대통령령으로 정하는 사항”이란 다음 각 호의 사항을 말한다. <개정 2022. 2. 15.>\n    1. 밀수출입 정보교환 및 법에 따른 정보제공 등 세관장과 탁송품 운송업자 간 협력에 관한 사항\n    2. 신속한 통관을 위한 절차 개선 협약 등 세관장과 탁송품 운송업자 간 업무협약 체결에 관한 사항\n    3. 세관장의 탁송품 운송업자에 대한 법 제255조의7제1항 및 제2항에 따른 평가 및 관리에 관한 세부사항\n    4. 그 밖에 관세청장이 필요하다고 인정하는 사항\n  [본조신설 2021. 2. 17.]\n  제259조 삭제 <2015. 2. 6.>", "D236-0": "제236조(원산지증명서의 제출 등) ①다음 각 호의 어느 하나에 해당하는 자는 해당 물품의 수입신고 시에 그 물품의 원산지를 증명하는 서류(이하 “원산지증명서”라 한다)를 세관장에게 제출하여야 한다. 다만, 제1호에 해당하는 자로서 수입신고 전에 원산지증명서를 발급받았으나 분실 등의 사유로 수입신고 시에 원산지증명서를 제출하지 못한 경우에는 제4항에 따른 원산지증명서 유효기간 내에 해당 원산지증명서 또는 그 부본을 제출할 수 있다. <개정 2015. 2. 6.>\n    1. 법ㆍ조약ㆍ협정 등에 의하여 다른 국가의 생산(가공을 포함한다)물품에 적용되는 세율보다 낮은 세율을 적용받고자 하는 자로서 원산지확인이 필요하다고 관세청장이 정하는 자\n    2. 관세율의 적용 기타의 사유로 인하여 원산지확인이 필요하다고 관세청장이 지정한 물품을 수입하는 자\n  ②법 제232조제1항 단서의 규정에 의하여 다음 각호의 물품에 대하여는 제1항의 규정을 적용하지 아니한다. <개정 2004. 3. 29.>\n    1. 세관장이 물품의 종류ㆍ성질ㆍ형상 또는 그 상표ㆍ생산국명ㆍ제조자 등에 의하여 원산지를 확인할 수 있는 물품\n    2. 우편물(법 제258조제2항의 규정에 해당하는 것을 제외한다)\n    3. 과세가격(종량세의 경우에는 이를 법 제15조의 규정에 준하여 산출한 가격을 말한다)이 15만원 이하인 물품\n    4. 개인에게 무상으로 송부된 탁송품ㆍ별송품 또는 여행자의 휴대품\n    5. 기타 관세청장이 관계행정기관의 장과 협의하여 정하는 물품\n  ③제1항의 규정에 의하여 세관장에게 제출하는 원산지증명서는 다음 각호의 1에 해당하는 것이어야 한다.\n    1. 원산지국가의 세관 기타 발급권한이 있는 기관 또는 상공회의소가 당해 물품에 대하여 원산지국가(지역을 포함한다)를 확인 또는 발행한 것\n    2. 원산지국가에서 바로 수입되지 아니하고 제3국을 경유하여 수입된 물품에 대하여 그 제3국의 세관 기타 발급권한이 있는 기관 또는 상공회의소가 확인 또는 발행한 경우에는 원산지국가에서 당해 물품에 대하여 발행된 원산지증명서를 기초로 하여 원산지국가(지역을 포함한다)를 확인 또는 발행한 것\n    3. 관세청장이 정한 물품의 경우에는 당해 물품의 상업송장 또는 관련서류에 생산자ㆍ공급자ㆍ수출자 또는 권한있는 자가 원산지국가를 기재한 것\n  ④제3항에 따른 원산지증명서에는 해당 수입물품의 품명, 수량, 생산지, 수출자 등 관세청장이 정하는 사항이 적혀 있어야 하며, 제출일부터 소급하여 1년(다음 각 호의 구분에 따른 기간은 제외한다) 이내에 발행된 것이어야 한다. <개정 2011. 4. 1., 2015. 2. 6.>\n    1. 원산지증명서 발행 후 1년 이내에 해당 물품이 수입항에 도착하였으나 수입신고는 1년을 경과하는 경우: 물품이 수입항에 도착한 날의 다음 날부터 해당 물품의 수입신고를 한 날까지의 기간\n    2. 천재지변, 그 밖에 이에 준하는 사유로 원산지증명서 발행 후 1년이 경과한 이후에 수입항에 도착한 경우: 해당 사유가 발생한 날의 다음 날부터 소멸된 날까지의 기간\n  ⑤ 제1항 각 호 외의 부분 단서에 따라 원산지증명서 또는 그 부본을 제출하는 경우에는 제34조제1항에 따른 경정청구서를 함께 제출하여야 한다. <신설 2015. 2. 6.>", "L246-3": "제246조의3(물품에 대한 안전성 검사) ① 관세청장은 중앙행정기관의 장의 요청을 받아 세관장으로 하여금 제226조에 따른 세관장의 확인이 필요한 수출입물품 등 다른 법령에서 정한 물품의 성분ㆍ품질 등에 대한 안전성 검사(이하 “안전성 검사”라 한다)를 하게 할 수 있다. 다만, 관세청장은 제226조에 따른 세관장의 확인이 필요한 수출입물품에 대하여는 필요한 경우 해당 중앙행정기관의 장에게 세관장과 공동으로 안전성 검사를 할 것을 요청할 수 있다. <개정 2017. 12. 19., 2019. 12. 31.>\n  ② 중앙행정기관의 장은 제1항에 따라 안전성 검사를 요청하는 경우 관세청장에게 해당 물품에 대한 안전성 검사방법 등 관련 정보를 제공하여야 하고, 필요한 인력을 제공할 수 있다.<신설 2017. 12. 19., 2019. 12. 31.>\n  ③ 관세청장은 제1항에 따라 중앙행정기관의 장의 안전성 검사 요청을 받거나 중앙행정기관의 장에게 안전성 검사를 요청한 경우 해당 안전성 검사를 위하여 필요한 인력 및 설비 등을 고려하여 안전성 검사 대상 물품을 지정하여야 하고, 그 결과를 해당 중앙행정기관의 장에게 통보하여야 한다.<신설 2017. 12. 19., 2019. 12. 31.>\n  ④ 관세청장은 안전성 검사를 위하여 협업검사센터를 주요 공항ㆍ항만에 설치할 수 있고, 세관장에게 제3항에 따라 지정된 안전성 검사 대상 물품의 안전성 검사에 필요한 자체 검사 설비를 지원하는 등 원활한 안전성 검사를 위한 조치를 취하여야 한다.<신설 2017. 12. 19., 2019. 12. 31.>\n  ⑤ 세관장은 제3항에 따라 안전성 검사 대상 물품으로 지정된 물품에 대하여 중앙행정기관의 장과 협력하여 안전성 검사를 실시하여야 한다.<신설 2017. 12. 19.>\n  ⑥ 관세청장은 안전성 검사 결과 불법ㆍ불량ㆍ유해 물품으로 확인된 물품의 정보를 관세청 인터넷 홈페이지를 통하여 공개할 수 있다.<신설 2017. 12. 19.>\n  ⑦ 안전성 검사에 필요한 정보교류, 제264조의10에 따른 불법ㆍ불량ㆍ유해물품에 대한 정보 등의 제공 요청 등 대통령령으로 정하는 사항을 협의하기 위하여 관세청에 수출입물품안전관리기관협의회를 둔다.<개정 2017. 12. 19., 2020. 12. 22.>\n  ⑧ 제7항에 따른 수출입물품안전관리기관협의회의 구성ㆍ운영과 그 밖에 필요한 사항은 대통령령으로 정한다.<개정 2017. 12. 19.>\n  ⑨ 제1항부터 제8항까지에서 규정한 사항 외에 안전성 검사의 방법ㆍ절차 등에 관하여 필요한 사항은 관세청장이 정한다.<개정 2017. 12. 19.>\n  [본조신설 2015. 12. 15.]", "D263-0": "제263조(우편물에 관한 납세절차) 법 제260조제1항의 규정에 의하여 관세를 납부하고자 하는 자는 제262조제2항의 경우에는 세관장에게, 기타의 경우에는 체신관서에 각각 금전으로 이를 납부하여야 한다.", "R79-2": "제79조의2(탁송품의 특별통관) ① 법 제254조의2제1항 각 호 외의 부분에서 “재정경제부령으로 정하는 물품”이란 자가사용물품 또는 면세되는 상업용 견본품 중 물품가격(법 제30조부터 제35조까지의 규정에 따른 방법으로 결정된 과세가격에서 법 제30조제1항제6호 본문에 따른 금액을 뺀 가격. 다만, 법 제30조제1항제6호 본문에 따른 금액을 명백히 구분할 수 없는 경우에는 이를 포함한 가격으로 한다)이 미화 150달러 이하인 물품을 말한다. <개정 2015. 12. 1., 2018. 3. 21., 2021. 3. 16., 2022. 3. 18., 2026. 1. 2.>\n  ② 법 제254조의2제1항제3호에서 “재정경제부령으로 정하는 사항”이란 다음 각 호의 사항을 말한다. <개정 2020. 3. 13., 2021. 3. 16., 2023. 3. 20., 2026. 1. 2.>\n    1. 운송업자명\n    2. 선박편명 또는 항공편명\n    3. 선하증권 번호\n    4. 물품수신인의 통관고유부호\n    5. 그 밖에 관세청장이 정하는 사항\n  [본조신설 2009. 3. 26.]", "L255-2": "제255조의2(수출입 안전관리 우수업체의 공인) ① 관세청장은 수출입물품의 제조ㆍ운송ㆍ보관 또는 통관 등 무역과 관련된 자가 시설, 서류 관리, 직원 교육 등에서 이 법 또는 「자유무역협정의 이행을 위한 관세법의 특례에 관한 법률」 등 수출입에 관련된 법령의 준수 여부, 재무 건전성 등 대통령령으로 정하는 안전관리 기준을 충족하는 경우 수출입안전관리 우수업체로 공인할 수 있다.\n  ② 관세청장은 제1항에 따른 공인을 받기 위하여 심사를 요청한 자에 대하여 대통령령으로 정하는 바에 따라 심사하여야 한다.\n  ③ 제2항에 따른 심사를 요청하려는 자는 제출서류의 적정성, 개별 안전관리 기준의 충족 여부 등 관세청장이 정하여 고시하는 사항에 대하여 미리 관세청장에게 예비심사를 요청할 수 있다.\n  ④ 관세청장은 제3항에 따른 예비심사를 요청한 자에게 예비심사 결과를 통보하여야 하고, 제2항에 따른 심사를 하는 경우 예비심사 결과를 고려하여야 한다.\n  ⑤ 제1항에 따른 공인의 유효기간은 5년으로 하며, 대통령령으로 정하는 바에 따라 공인을 갱신할 수 있다.\n  ⑥ 제1항부터 제5항까지에서 규정한 사항 외에 수출입 안전관리 우수업체의 공인에 필요한 사항은 대통령령으로 정한다.\n  [전문개정 2021. 12. 21.]", "L256-2": "제256조의2(우편물의 사전전자정보 제출) ① 통관우체국의 장은 수입하려는 우편물의 발송국으로부터 해당 우편물이 발송되기 전에 세관신고정보를 포함하여 대통령령으로 정하는 전자정보(이하 “사전전자정보”라 한다)를 제공받은 경우에는 그 제공받은 정보를 해당 우편물이 발송국에서 출항하는 운송수단에 적재되기 전까지 세관장에게 제출하여야 한다.\n  ② 세관장은 관세청장이 우정사업본부장과 협의하여 사전전자정보 제출대상으로 정한 국가에서 발송한 우편물 중 사전전자정보가 제출되지 아니한 우편물에 대해서는 통관우체국의 장으로 하여금 반송하도록 할 수 있다.\n  ③ 통관우체국의 장은 사전전자정보가 제출된 우편물에 대해서는 제257조 본문에 따른 우편물목록의 제출을 생략하고 세관장에게 검사를 받을 수 있다. 다만, 통관우체국의 장은 세관장이 통관절차의 이행과 효율적인 감시ㆍ단속을 위하여 대통령령으로 정하는 사유에 해당하여 우편물목록의 제출을 요구하는 경우에는 이를 제출하여야 한다.\n  ④ 제1항부터 제3항까지에서 규정한 사항 외에 사전전자정보의 제출 절차 및 반송 등에 필요한 세부사항은 대통령령으로 정한다.\n  [본조신설 2021. 12. 21.]", "L237-0": "제237조(통관의 보류) ① 세관장은 다음 각 호의 어느 하나에 해당하는 경우에는 해당 물품의 통관을 보류할 수 있다.\n  <개정 2015. 12. 15., 2016. 12. 20., 2020. 12. 22., 2021. 12. 21.>\n    1. 제241조 또는 제244조에 따른 수출ㆍ수입 또는 반송에 관한 신고서의 기재사항에 보완이 필요한 경우\n    2. 제245조에 따른 제출서류 등이 갖추어지지 아니하여 보완이 필요한 경우\n    3. 이 법에 따른 의무사항(대한민국이 체결한 조약 및 일반적으로 승인된 국제법규에 따른 의무를 포함한다)을 위반하거나 국민보건 등을 해칠 우려가 있는 경우\n    4. 제246조의3제1항에 따른 안전성 검사가 필요한 경우\n    4의2. 제246조의3제1항에 따른 안전성 검사 결과 불법ㆍ불량ㆍ유해 물품으로 확인된 경우\n    5. 「국세징수법」 제30조 및 「지방세징수법」 제39조의2에 따라 세관장에게 강제징수 또는 체납처분이 위탁된 해당 체납자가 수입하는 경우\n    6. 그 밖에 이 법에 따라 필요한 사항을 확인할 필요가 있다고 인정하여 대통령령으로 정하는 경우\n  ② 세관장은 제1항에 따라 통관을 보류할 때에는 즉시 그 사실을 화주(화주의 위임을 받은 자를 포함한다) 또는 수출입 신고인에게 통지하여야 한다.<신설 2020. 12. 22.>\n  ③ 세관장은 제2항에 따라 통지할 때에는 이행기간을 정하여 통관의 보류 해제에 필요한 조치를 요구할 수 있다.\n  <신설 2020. 12. 22.>\n  ④ 제2항에 따라 통관의 보류 사실을 통지받은 자는 세관장에게 제1항 각 호의 통관 보류사유에 해당하지 아니함을 소명하는 자료 또는 제3항에 따른 세관장의 통관 보류 해제에 필요한 조치를 이행한 사실을 증명하는 자료를 제출하고 해당 물품의 통관을 요청할 수 있다. 이 경우 세관장은 해당 물품의 통관 허용 여부(허용하지 아니하는 경우에는 그 사유를 포함한다)를 요청받은 날부터 30일 이내에 통지하여야 한다.<신설 2020. 12. 22.>\n  [전문개정 2010. 12. 30.]", "R77-2": "제77조의2(원산지증명서 등의 확인 요청에 대한 회신기간) 법 제233조제2항제1호에서 “재정경제부령으로 정한 기간”이란 다음 각 호의 구분에 따른 기간을 말한다. <개정 2026. 1. 2.>\n    1. 법 제73조에 따른 국제협력관세로서 「아시아ㆍ태평양 무역협정」에 따른 국제협정관세를 적용하기 위하여 원산지증명서를 발급한 국가의 세관이나 그 밖에 발급권한이 있는 기관(이하 이 조에서 “외국세관등”이라 한다)에 원산지증명서 등의 확인을 요청한 경우: 확인을 요청한 날부터 4개월\n    2. 법 제76조제3항에 따른 최빈 개발도상국에 대한 일반특혜관세를 적용하기 위하여 외국세관등에 원산지증명서 등의 확인을 요청한 경우: 확인을 요청한 날부터 6개월\n  [본조신설 2014. 3. 14.]\n  [종전 제77조의2는 제77조의3으로 이동 <2014. 3. 14.>]", "D236-9": "제236조의9(원산지표시위반단속기관협의회) ① 법 제233조의3제1항에서 “원산지표시 위반 단속업무에 필요한 정보교류 등 대통령령으로 정하는 사항”이란 다음 각 호의 사항을 말한다.\n    1. 원산지표시 위반 단속업무에 필요한 정보교류에 관한 사항\n    2. 원산지표시 위반 단속업무와 관련된 인력교류에 관한 사항\n    3. 그 밖에 원산지표시 위반 단속업무와 관련되어 위원장이 회의에 부치는 사항\n  ② 법 제233조의3제1항에 따른 원산지표시위반단속기관협의회(이하 이 조에서 “협의회”라 한다)는 위원장 1명을 포함하여 25명 이내의 위원으로 구성한다.\n  ③ 협의회의 위원장은 원산지표시 위반 단속업무를 관장하는 관세청의 고위공무원단에 속하는 공무원 중에서 관세청장이 지정하는 사람이 되고, 위원은 다음 각 호의 사람이 된다.\n    1. 관세청장이 지정하는 과장급 공무원 1명\n    2. 농림축산식품부장관이 지정하는 국립농산물품질관리원 소속 과장급 공무원 1명\n    3. 해양수산부장관이 지정하는 국립수산물품질관리원 소속 과장급 공무원 1명\n    4. 특별시, 광역시, 특별자치시, 도, 특별자치도의 장이 지정하는 과장급 공무원 각 1명\n  ④ 위원장은 협의회를 대표하고 사무를 총괄한다. 다만, 부득이한 사유로 위원장이 그 직무를 수행하지 못하는 경우에는 위원장이 미리 지명한 사람이 그 직무를 대행한다. <개정 2020. 12. 29.>\n  ⑤ 협의회의 회의는 정기회의와 임시회의로 구분하되, 정기회의는 반기마다 소집하며, 임시회의는 위원장이 필요하다고 인정하는 경우에 소집한다.\n  ⑥ 협의회의 회의는 위원장이 소집하며 그 의장은 위원장이 된다.\n  ⑦ 협의회의 회의는 재적위원 과반수의 출석으로 개의하고, 출석위원 3분의 2 이상의 찬성으로 의결한다.\n  ⑧ 협의회의 사무를 처리하게 하기 위하여 관세청 소속 5급 공무원 1명을 간사로 둔다.\n  ⑨ 제1항부터 제8항까지에서 규정한 사항 외에 협의회의 운영에 필요한 사항은 협의회의 의결을 거쳐 위원장이 정한다.\n  [본조신설 2014. 3. 5.]", "D261-0": "제261조(수출입신고대상 우편물) 법 제258조제2항에서 “대통령령으로 정하는 기준에 해당하는 것”이란 다음 각 호의 어느 하나에 해당하는 우편물을 말한다. <개정 2002. 12. 30., 2011. 4. 1., 2023. 2. 28., 2025. 2. 28.>\n    1. 법령에 따라 수출입이 제한되거나 금지되는 물품\n    2. 법 제226조에 따라 세관장의 확인이 필요한 물품\n    3. 판매를 목적으로 반입하는 물품 또는 대가를 지급하였거나 지급하여야 할 물품(통관허용여부 및 과세대상여부에 관하여 관세청장이 정한 기준에 해당하는 것으로 한정한다)\n    4. 가공무역을 위하여 우리나라와 외국간에 무상으로 수출입하는 물품 및 그 물품의 원ㆍ부자재\n    4의2. 다음 각 목의 어느 하나에 해당하는 수입물품\n      가. 「건강기능식품에 관한 법률」 제3조제1호에 따른 건강기능식품\n      나. 「약사법」 제2조제4호에 따른 의약품\n      다. 그 밖에 가목 및 나목의 물품과 유사한 물품으로서 관세청장이 국민보건을 위하여 수입신고가 필요하다고 인정하여 고시하는 물품\n    5. 그 밖에 수출입신고가 필요하다고 인정되는 물품으로서 관세청장이 정하는 금액을 초과하는 물품", "D259-3": "제259조의3(수출입 안전관리 우수업체의 공인절차 등) ① 법 제255조의2제1항에 따라 수출입 안전관리 우수업체(이하 “수출입안전관리우수업체”라 한다)로 공인받으려는 자는 신청서에 다음 각 호의 서류를 첨부하여 관세청장에게 제출하여야 한다. <개정 2022. 2. 15.>\n    1. 자체 안전관리 평가서\n    2. 안전관리 현황 설명서\n    3. 그 밖에 업체의 안전관리 현황과 관련하여 관세청장이 정하는 서류\n  ② 법 제255조의2제5항에 따라 공인을 갱신하려는 자는 공인의 유효기간이 끝나는 날의 6개월 전까지 신청서에 제1항 각 호에 따른 서류를 첨부하여 관세청장에게 제출해야 한다. <개정 2016. 2. 5., 2022. 2. 15.>\n  ③ 관세청장은 공인을 받은 자에게 공인을 갱신하려면 공인의 유효기간이 끝나는 날의 6개월 전까지 갱신을 신청하여야 한다는 사실을 해당 공인의 유효기간이 끝나는 날의 7개월 전까지 휴대폰에 의한 문자전송, 전자메일, 팩스, 전화, 문서 등으로 미리 알려야 한다. <신설 2016. 2. 5.>\n  ④ 관세청장은 제1항 또는 제2항에 따른 신청을 받은 경우 안전관리기준을 충족하는 업체에 대하여 공인증서를 교부하여야 한다. <신설 2016. 2. 5.>\n  ⑤ 수출입안전관리우수업체에 대한 공인의 등급, 안전관리 공인심사에 관한 세부절차, 그 밖에 필요한 사항은 관세청장이 정한다. 다만, 「국제항해선박 및 항만시설의 보안에 관한 법률」 등 안전관리에 관한 다른 법령과 관련된 사항에 대해서는 관계기관의 장과 미리 협의해야 한다. <개정 2016. 2. 5., 2022. 2. 15.>\n  [본조신설 2009. 2. 4.]", "D246-0": "제246조(수출ㆍ수입 또는 반송의 신고) ①법 제241조제1항에서 “대통령령으로 정하는 사항”이란 다음 각 호의 사항을 말한다. <개정 2002. 12. 30., 2011. 4. 1., 2015. 2. 6., 2016. 2. 5., 2025. 12. 30.>\n    1. 포장의 종류ㆍ번호 및 개수\n    2. 목적지ㆍ원산지 및 선적지\n    3. 원산지표시 대상물품인 경우에는 표시유무ㆍ방법 및 형태\n    4. 상표\n    5. 납세의무자 또는 화주의 상호(개인의 경우 성명을 말한다)ㆍ사업자등록번호ㆍ통관고유부호와 해외공급자부호 또는 해외구매자부호\n    6. 물품의 장치장소\n    7. 그 밖에 재정경제부령으로 정하는 참고사항\n  ②법 제241조제1항의 규정에 의하여 수출ㆍ수입 또는 반송의 신고를 하고자 하는 자는 재정경제부령으로 정하는 수출ㆍ수입 또는 반송의 신고서를 세관장에게 제출하여야 한다. <개정 2016. 2. 5., 2025. 12. 30.>\n    1. 삭제 <2016. 2. 5.>\n    2. 삭제 <2016. 2. 5.>\n  ③ 법 제241조제1항에 따른 가격은 다음 각 호의 구분에 따른다. <개정 2019. 2. 12.>\n    1. 수출ㆍ반송신고가격: 해당 물품을 본선에 인도하는 조건으로 실제로 지급받았거나 지급받아야 할 가격으로서 최종 선적항 또는 선적지까지의 운임ㆍ보험료를 포함한 가격\n    2. 수입신고가격: 법 제30조부터 제35조까지의 규정에 따른 방법으로 결정된 과세가격\n  ④법 제241조제2항의 규정에 의하여 신고를 생략하게 하는 물품은 다음 각호의 1과 같다. 다만, 법 제226조의 규정에 해당하는 물품을 제외한다. <개정 2015. 2. 6., 2018. 2. 13.>\n    1. 법 제96조제1항제1호에 따른 여행자휴대품\n    2. 법 제96조제1항제3호에 따른 승무원휴대품\n    3. 우편물(법 제258조제2항에 해당하는 것을 제외한다)\n    4. 국제운송을 위한 컨테이너(법 별표 관세율표중 기본세율이 무세인 것에 한한다)\n    5. 기타 서류ㆍ소액면세물품 등 신속한 통관을 위하여 필요하다고 인정하여 관세청장이 정하는 탁송품 또는 별송품\n  ⑤법 제241조제2항의 규정에 의한 수입물품중 관세가 면제되거나 무세인 물품에 있어서는 그 검사를 마친 때에 당해 물품에 대한 수입신고가 수리된 것으로 본다. <개정 2015. 2. 6.>\n  ⑥법 제241조의 규정에 의하여 수출신고를 함에 있어 수출신고가격을 산정하기 위하여 외국통화로 표시된 가격을 내국통화로 환산하는 때에는 수출신고일이 속하는 주의 전주의 기준환율 또는 재정환율을 평균하여 관세청장이 정한 율로 하여야 한다. <개정 2015. 2. 6., 2022. 9. 15.>\n  ⑦법 제241조제6항 전단에서 “대통령령으로 정하는 물품”이란 다음 각 호의 어느 하나에 해당하는 것을 말한다. <신설 2007. 4. 5., 2011. 4. 1., 2015. 2. 6.>\n    1. 전기\n    2. 가스\n    3. 유류\n    4. 용수(用水)\n  ⑧법 제241조제6항 전단에서 “전선이나 배관 등 대통령령으로 정하는 시설 또는 장치 등”이란 전선로, 배관 등 제7항 각 호의 어느 하나에 해당하는 물품을 공급하기에 적합하도록 설계ㆍ제작된 일체의 시설을 말한다. <신설 2007. 4. 5., 2011. 4. 1., 2015. 2. 6., 2023. 2. 28.>\n  ⑨제1항 및 제2항은 법 제241조제6항에 따라 수출ㆍ수입 또는 반송하는 경우에 준용한다. <신설 2007. 4. 5., 2015. 2. 6.>", "L254-0": "제254조(전자상거래물품의 특별통관 등) ① 전자상거래물품 중 대통령령으로 정하는 물품에 대하여는 대통령령으로 정하는 바에 따라 수출입신고ㆍ물품검사 등 통관에 필요한 사항을 생략하거나 간소한 방법으로 적용할 수 있다.\n  ② 다음 각 호의 자(국내에 주소 또는 영업소가 없는 자를 포함하며, 이하 “전자상거래업자등”이라 한다)는 제1항에 따라 통관에 필요한 사항을 생략하거나 간소한 방법으로 적용받으려는 경우에는 대통령령으로 정하는 바에 따라 관세청장 또는 세관장에게 등록하여야 한다.\n    1. 「전자상거래 등에서의 소비자보호에 관한 법률」에 따른 통신판매업자\n    2. 「전자상거래 등에서의 소비자보호에 관한 법률」에 따른 통신판매중개를 하는 자\n    3. 화주의 위임을 받아 국외에서 전자상거래물품을 수령하여 배송을 대행하는 자\n  ③ 관세청장은 관세의 부과ㆍ징수 및 통관을 위하여 필요한 경우 제2항에 따라 등록한 전자상거래업자등에게 전자상거래물품의 주문ㆍ결제 등과 관련된 거래정보로서 대통령령으로 정하는 정보를 수입 전에 제공하여 줄 것을 요청할 수 있다.\n  ④ 제3항에 따라 요청받은 정보의 제공 방법ㆍ절차 등 정보의 제공에 필요한 사항은 대통령령으로 정한다.\n  ⑤ 관세청장은 납세자의 권리 보호를 위하여 화주에게 전자상거래물품의 통관 및 납세와 관련된 사항으로서 대통령령으로 정하는 사항을 안내할 수 있다.\n  ⑥ 제1항은 다음 각 호의 구분에 따른 규정에 우선하여 적용한다.\n    1. 수출입신고에 관한 사항의 경우: 제254조의2제1항 및 제258조제2항\n    2. 물품검사에 관한 사항의 경우: 제254조의2제5항, 제256조의2제3항 및 제257조\n  ⑦ 제2항에 따른 등록의 유효기간은 3년으로 하며, 대통령령으로 정하는 바에 따라 갱신할 수 있다.\n  ⑧ 다음 각 호의 어느 하나에 해당하면 제2항에 따른 등록은 그 효력을 상실한다.\n    1. 전자상거래업자등이 폐업한 경우\n    2. 전자상거래업자등이 사망한 경우(법인인 경우에는 해산된 경우)\n    3. 제7항에 따른 등록의 유효기간이 만료된 경우\n  [전문개정 2024. 12. 31.]", "D243-2": "제243조의2(탁송품 등의 상표권 보호 절차 간소화) ① 법 제235조제3항 각 호의 물품이 법 제235조의2 각 호의 사유에 모두 해당하는 경우 세관장은 법 제235조제1항제1호에 따른 상표권(이하 “상표권”이라 한다)의 권리자(이하 “상표권자”라 한다)와 수출입신고등을 한 자 또는 우편물의 화주에게 해당 물품의 상표권 침해 인정 사항을 통보할 수 있다.\n  ② 제1항에 따른 통보를 받은 상표권자는 세관장에게 해당 물품의 통관보류등을 요청할 수 있다. 이 경우 상표권자는 해당 물품의 상표권 침해사실을 입증하는 자료를 관세청장이 정하여 고시하는 기간 내에 제출해야 한다.\n  ③ 제1항에 따른 통보를 받은 수출입신고등을 한 자 또는 우편물의 화주는 해당 물품이 상표권을 침해하지 않았음을 입증하는 자료를 관세청장이 정하여 고시하는 기간 내에 세관장에게 제출할 수 있다.\n  ④ 세관장은 제2항 후단 및 제3항에 따라 제출된 자료를 근거로 관세청장이 정하여 고시하는 기간 내에 해당 물품에 대한 통관보류등의 여부를 결정한다.\n  ⑤ 제4항에도 불구하고 상표권자가 제2항 후단에 따른 자료를 제출하지 않은 경우에는 세관장은 해당 물품의 통관을 허용할 수 있고, 수출입신고등을 한 자 또는 우편물의 화주가 제3항에 따른 자료를 제출하지 않은 경우에는 제2항 후단에 따라 제출된 자료에 근거하여 해당 물품에 대한 통관보류등의 여부를 결정할 수 있다.\n  ⑥ 세관장은 제4항 및 제5항에 따라 통관보류등의 여부를 결정하거나 통관을 허용한 때에는 즉시 상표권자와 수출입신고등을 한 자 또는 우편물의 화주에게 각각 그 사실을 통보해야 한다.\n  ⑦ 제1항부터 제6항까지에서 규정한 사항 외에 법 제235조의2에 따른 탁송품 등의 상표권 보호에 필요한 사항은 관세청장이 정하여 고시한다.\n  [본조신설 2026. 2. 27.]", "L229-0": "제229조(원산지 확인 기준) ① 이 법, 조약, 협정 등에 따른 관세의 부과ㆍ징수, 수출입물품의 통관, 제233조제3항의 확인요청에 따른 조사 등을 위하여 원산지를 확인할 때에는 다음 각 호의 어느 하나에 해당하는 나라를 원산지로 한다.\n  <개정 2014. 1. 1.>\n    1. 해당 물품의 전부를 생산ㆍ가공ㆍ제조한 나라\n    2. 해당 물품이 2개국 이상에 걸쳐 생산ㆍ가공 또는 제조된 경우에는 그 물품의 본질적 특성을 부여하기에 충분한 정도의 실질적인 생산ㆍ가공ㆍ제조 과정이 최종적으로 수행된 나라\n  ② 제1항 각 호를 적용할 물품의 범위, 구체적 확인 기준 등에 관하여 필요한 사항은 재정경제부령으로 정한다.<개정 2025. 10. 1.>\n  ③ 제1항과 제2항에도 불구하고 조약ㆍ협정 등의 시행을 위하여 원산지 확인 기준 등을 따로 정할 필요가 있을 때에는 재정경제부령으로 원산지 확인 기준 등을 따로 정한다.<개정 2025. 10. 1.>\n  [전문개정 2010. 12. 30.]", "D251-2": "제251조의2(물품 등의 검사에 대한 손실보상의 금액) ① 법 제246조의2제1항에 따른 손실보상의 대상은 세관공무원의 적법한 물품검사로 손실이 발생한 다음 각 호의 어느 하나에 해당하는 것으로 한다. <신설 2024. 2. 29.>\n    1. 검사 대상 물품\n    2. 제1호의 물품을 포장한 용기 또는 운반ㆍ운송하는 수단\n  ② 법 제246조의2제1항에 따른 손실보상의 금액은 다음 각 호의 구분에 따른 금액으로 한다. <개정 2024. 2. 29.>\n    1. 해당 물품 등을 수리할 수 없는 경우: 다음 각 목의 구분에 따른 금액\n      가. 제1항제1호에 해당하는 경우: 법 제30조부터 제35조까지의 규정에 따른 해당 물품의 과세가격에 상당하는 금액. 다만, 과세가격에 상당하는 금액을 산정할 수 없는 경우에는 구매가격 및 손실을 입은 자가 청구하는 금액을 고려하여 관세청장이 합리적인 범위에서 인정하는 금액으로 한다.\n      나. 제1항제2호에 해당하는 경우: 구매가격 및 손실을 입은 자가 청구하는 금액을 고려하여 관세청장이 합리적인 범위에서 인정하는 금액\n    2. 해당 물품 등을 수리할 수 있는 경우: 수리비에 상당하는 금액. 다만, 제1호에 따른 금액을 한도로 한다.\n  [본조신설 2016. 2. 5.]\n  [제목개정 2024. 2. 29.]", "R77-3": "제77조의3(조사 전 통지) 영 제236조의8제2항에서 “재정경제부령으로 정하는 사항”이란 다음 각 호의 구분에 따른 사항을 말한다. <개정 2026. 1. 2.>\n    1. 서면조사의 경우\n      가. 조사대상자 및 조사기간\n      나. 조사대상 수출입물품\n      다. 조사이유\n      라. 조사할 내용\n      마. 조사의 법적 근거\n      바. 제출서류 및 제출기간\n      사. 조사기관, 조사자의 직위 및 성명\n      아. 그 밖에 세관장이 필요하다고 인정하는 사항\n    2. 현지조사의 경우\n      가. 조사대상자 및 조사예정기간\n      나. 조사대상 수출입물품\n      다. 조사방법 및 조사이유\n      라. 조사할 내용\n      마. 조사의 법적 근거\n      바. 조사에 대한 동의 여부 및 조사동의서 제출기간(조사에 동의하지 아니하거나 조사동의서 제출기간에 그 동의 여부를 통보하지 아니하는 경우의 조치사항을 포함한다)\n      사. 조사기관, 조사자의 직위 및 성명\n      아. 그 밖에 세관장이 필요하다고 인정하는 사항\n  [본조신설 2011. 4. 1.]\n  [제77조의2에서 이동 , 종전 제77조의3은 제77조의4로 이동 <2014. 3. 14.>]", "D238-0": "제238조(통관보류등의 요청) 법 제235조제3항 및 제4항에 따라 통관의 보류나 유치(이하 “통관보류등”이라 한다)를 요청하려는 자는 다음 각 호의 사항을 적은 신청서와 해당 법령에 따른 정당한 권리자임을 증명하는 서류를 세관장에게 제출하여야 한다. <개정 2008. 2. 22., 2011. 4. 1., 2025. 2. 28.>\n    1. 품명ㆍ수출입자 및 수출입국\n    2. 지식재산권등의 내용 및 범위\n    3. 요청사유\n    4. 침해사실을 입증하기 위하여 필요한 사항\n  [제목개정 2011. 4. 1.]", "D248-0": "제248조(가산세 대상물품) 법 제241조제4항에 따른 가산세를 징수해야 하는 물품은 다음 각 호의 물품으로 한다. <개정 2020. 12. 29., 2026. 4. 3.>\n    1. 물품의 신속한 유통이 긴요하다고 인정하여 보세구역의 종류와 물품의 특성을 고려하여 관세청장이 정하는 물품\n    2. 제92조제1항제4호에 따른 집중관리품목", "D258-2": "제258조의2(탁송품의 검사설비) ① 법 제254조의2제6항 단서에 따라 세관장이 탁송품 운송업자가 운영하는 보세창고 또는 시설(이하 이 조부터 제258조의4까지에서 “자체시설”이라 한다)에서 탁송품을 통관하는 경우 탁송품 운송업자가 갖추어야 할 검사설비는 다음 각 호와 같다. <개정 2015. 2. 6.>\n    1. X-Ray 검색기\n    2. 자동분류기\n    3. 세관직원전용 검사장소\n  ② 제1항에 따른 검사설비의 세부기준은 관세청장이 고시로 정한다.\n  [본조신설 2013. 2. 15.]", "D248-2": "제248조의2(보세구역 반입 후 수출신고의 대상 등) ① 법 제243조제4항에서 “대통령령으로 정하는 물품”이란 다음 각 호의 어느 하나에 해당하는 물품으로서 관세청장이 정하여 고시하는 물품을 말한다. <개정 2019. 9. 24.>\n    1. 도난우려가 높은 물품 등 국민의 재산권 보호를 위하여 수출관리가 필요한 물품\n    2. 고세율 원재료를 제조ㆍ가공하여 수출하는 물품 등 부정환급 우려가 높은 물품\n    3. 국민보건이나 사회안전 또는 국제무역질서 준수 등을 위해 수출관리가 필요한 물품\n  ② 제1항에도 불구하고 법 제255조의2제1항에 따라 수출입 안전관리 우수업체로 공인된 업체가 수출하는 물품은 법 제243조제4항에 따라 관세청장이 정하는 장소에 반입한 후 수출의 신고를 하는 물품(이하 이 조에서 “반입 후 신고물품”이라 한다)에서 제외할 수 있다. <개정 2022. 2. 15.>\n  ③ 반입 후 신고물품의 반입절차 및 그 밖에 필요한 사항은 관세청장이 정하여 고시한다.\n  [본조신설 2017. 3. 27.]", "L240-4": "제240조의4(무역원활화 기본계획의 수립 및 시행) ① 재정경제부장관은 「세계무역기구 설립을 위한 마라케쉬협정」에 따라 이 법 및 관련법에서 정한 통관 등 수출입 절차의 원활화 및 이와 관련된 국제협력의 원활화(이하 “무역원활화”라 한다)를 촉진하기 위하여 다음 각 호의 사항이 포함된 무역원활화 기본계획(이하 “기본계획”이라 한다)을 수립ㆍ 시행하여야 한다. <개정 2025. 10. 1.>\n    1. 무역원활화 정책의 기본 방향에 관한 사항\n    2. 무역원활화 기반 시설의 구축과 운영에 관한 사항\n    3. 무역원활화의 환경조성에 관한 사항\n    4. 무역원활화와 관련된 국제협력에 관한 사항\n    5. 무역원활화와 관련된 통계자료의 수집ㆍ분석 및 활용방안에 관한 사항\n    6. 무역원활화 촉진을 위한 재원 확보 및 배분에 관한 사항\n    7. 그 밖에 무역원활화를 촉진하기 위하여 필요한 사항\n  ② 재정경제부장관은 기본계획을 시행하기 위하여 대통령령으로 정하는 바에 따라 무역원활화에 관한 업무를 수행하는 기관 또는 단체에 필요한 지원을 할 수 있다.<개정 2025. 10. 1.>\n  [본조신설 2014. 12. 23.]", "D236-8": "제236조의8(수출물품의 원산지증명서 등에 관한 조사 절차 등) ① 법 제233조제3항에 따른 현지조사는 서면조사만으로 원산지증명서 및 원산지증명서확인자료의 진위 여부, 정확성 등을 확인하기 곤란하거나 추가로 확인할 필요가 있는 경우에 할 수 있다. <개정 2018. 2. 13.>\n  ② 세관장은 서면조사 또는 현지조사를 하는 경우에는 재정경제부령으로 정하는 사항을 조사대상자에게 조사 시작 7일 전까지 서면으로 통지하여야 한다. <개정 2025. 12. 30.>\n  ③ 조사의 연기신청, 조사결과의 통지에 관하여는 법 제114조제2항 및 제115조를 준용한다.\n  ④ 조사결과에 대하여 이의가 있는 조사대상자는 조사결과를 통지받은 날부터 30일 이내에 다음 각 호의 사항이 적힌 신청서에 이의제기 내용을 확인할 수 있는 자료를 첨부하여 세관장에게 제출할 수 있다.\n    1. 이의를 제기하는 자의 성명과 주소 또는 거소\n    2. 제3항에 따른 조사결과통지서를 받은 날짜 및 조사결정의 내용\n    3. 해당 물품의 품명ㆍ규격ㆍ용도ㆍ수출자ㆍ생산자 및 수입자\n    4. 이의제기의 요지와 내용\n  ⑤ 세관장은 제4항에 따라 이의제기를 받은 날부터 30일 이내에 심사를 완료하고 그 결정내용을 통지하여야 한다.\n  ⑥ 세관장은 제4항에 따른 이의제기의 내용이나 절차에 결함이 있는 경우에는 20일 이내의 기간을 정하여 다음 각 호의 사항을 적은 문서로서 보정할 것을 요구할 수 있다. 다만, 보정할 사항이 경미한 경우에는 직권으로 보정할 수 있다.\n    1. 보정할 사항\n    2. 보정을 요구하는 이유\n    3. 보정할 기간\n    4. 그 밖의 필요한 사항\n  ⑦ 제6항 본문에 따른 보정기간은 제5항에 따른 결정기간에 산입하지 아니한다.\n  [본조신설 2011. 4. 1.]", "D233-0": "제233조(구비조건의 확인) 법 제226조제2항의 규정에 의한 허가ㆍ승인ㆍ표시 기타 조건(이하 이 조에서 “구비조건”이라 한다)의 구비를 요하는 물품에 대하여 관세청장은 주무부장관의 요청을 받아 세관공무원에 의하여 확인이 가능한 사항인지 여부, 물품의 특성 기타 수출입물품의 통관여건 등을 고려하여 세관장의 확인대상물품, 확인방법, 확인절차(관세청장이 지정ㆍ고시하는 정보통신망을 이용한 확인신청 등의 절차를 포함한다), 그 밖에 확인에 필요한 사항을 공고하여야 한다. <개정 2006. 5. 22.>", "L241-0": "제241조(수출ㆍ수입 또는 반송의 신고) ① 물품을 수출ㆍ수입 또는 반송하려면 해당 물품의 품명ㆍ규격ㆍ수량 및 가격과 그 밖에 대통령령으로 정하는 사항을 세관장에게 신고하여야 한다.\n  ② 다음 각 호의 어느 하나에 해당하는 물품은 대통령령으로 정하는 바에 따라 제1항에 따른 신고를 생략하게 하거나 관세청장이 정하는 간소한 방법으로 신고하게 할 수 있다.<개정 2014. 12. 23., 2018. 12. 31.>\n    1. 휴대품ㆍ탁송품 또는 별송품\n    2. 우편물\n    3. 제91조부터 제94조까지, 제96조제1항 및 제97조제1항에 따라 관세가 면제되는 물품\n    3의2. 제135조, 제136조, 제149조 및 제150조에 따른 보고 또는 허가의 대상이 되는 운송수단. 다만, 다음 각 목의 어느 하나에 해당하는 운송수단은 제외한다.\n      가. 우리나라에 수입할 목적으로 최초로 반입되는 운송수단\n      나. 해외에서 수리하거나 부품 등을 교체한 우리나라의 운송수단\n      다. 해외로 수출 또는 반송하는 운송수단\n    4. 국제운송을 위한 컨테이너(별표 관세율표 중 기본세율이 무세인 것으로 한정한다)\n  ③ 수입하거나 반송하려는 물품을 지정장치장 또는 보세창고에 반입하거나 보세구역이 아닌 장소에 장치한 자는 그 반입일 또는 장치일부터 30일 이내(제243조제1항에 해당하는 물품은 관세청장이 정하는 바에 따라 반송신고를 할 수 있는 날부터 30일 이내)에 제1항에 따른 신고를 하여야 한다.\n  ④ 세관장은 대통령령으로 정하는 물품을 수입하거나 반송하는 자가 제3항에 따른 기간 내에 수입 또는 반송의 신고를 하지 아니한 경우에는 해당 물품 과세가격의 100분의 2에 상당하는 금액의 범위에서 대통령령으로 정하는 금액을 가산세로 징수한다.\n  ⑤ 세관장은 다음 각 호의 어느 하나에 해당하는 경우에는 해당 물품에 대하여 납부할 세액(관세 및 내국세를 포함한다)의 100분의 20(제1호의 경우에는 100분의 40으로 하되, 반복적으로 자진신고를 하지 아니하는 경우 등 대통령령으로 정하는 사유에 해당하는 경우에는 100분의 60)에 상당하는 금액을 가산세로 징수한다.<개정 2014. 12. 23.>\n    1. 여행자나 승무원이 제2항제1호에 해당하는 휴대품(제96조제1항제1호 및 제3호에 해당하는 물품은 제외한다)을 신고하지 아니하여 과세하는 경우\n    2. 우리나라로 거주를 이전하기 위하여 입국하는 자가 입국할 때에 수입하는 이사물품(제96조제1항제2호에 해당하는 물품은 제외한다)을 신고하지 아니하여 과세하는 경우\n  ⑥ 제3항에도 불구하고 전기ㆍ유류 등 대통령령으로 정하는 물품을 그 물품의 특성으로 인하여 전선이나 배관 등 대통령령으로 정하는 시설 또는 장치 등을 이용하여 수출ㆍ수입 또는 반송하는 자는 1개월을 단위로 하여 해당 물품에 대한 제1항의 사항을 대통령령으로 정하는 바에 따라 다음 달 10일까지 신고하여야 한다. 이 경우 기간 내에 수출ㆍ수입 또는 반송의 신고를 하지 아니하는 경우의 가산세 징수에 관하여는 제4항을 준용한다.\n  [전문개정 2010. 12. 30.]", "L226-0": "제226조(허가ㆍ승인 등의 증명 및 확인) ① 수출입을 할 때 법령에서 정하는 바에 따라 허가ㆍ승인ㆍ표시 또는 그 밖의 조건을 갖출 필요가 있는 물품은 세관장에게 그 허가ㆍ승인ㆍ표시 또는 그 밖의 조건을 갖춘 것임을 증명하여야 한다.\n  ② 통관을 할 때 제1항의 구비조건에 대한 세관장의 확인이 필요한 수출입물품에 대하여는 다른 법령에도 불구하고 그 물품과 확인방법, 확인절차, 그 밖에 필요한 사항을 대통령령으로 정하는 바에 따라 미리 공고하여야 한다.\n  ③ 제1항에 따른 증명에 관하여는 제245조제2항을 준용한다.\n  [전문개정 2010. 12. 30.]", "L253-0": "제253조(수입신고전의 물품 반출) ① 수입하려는 물품을 수입신고 전에 운송수단, 관세통로, 하역통로 또는 이 법에 따른 장치 장소로부터 즉시 반출하려는 자는 대통령령으로 정하는 바에 따라 세관장에게 즉시반출신고를 하여야 한다. 이 경우 세관장은 납부하여야 하는 관세에 상당하는 담보를 제공하게 할 수 있다.\n  ② 제1항에 따른 즉시반출을 할 수 있는 자 또는 물품은 대통령령으로 정하는 바에 따라 세관장이 지정한다.\n  ③ 제1항에 따른 즉시반출신고를 하고 반출을 하는 자는 즉시반출신고를 한 날부터 10일 이내에 제241조에 따른 수입신고를 하여야 한다.\n  ④ 세관장은 제1항에 따라 반출을 한 자가 제3항에 따른 기간 내에 수입신고를 하지 아니하는 경우에는 관세를 부과ㆍ징수한다. 이 경우 해당 물품에 대한 관세의 100분의 20에 상당하는 금액을 가산세로 징수하고, 제2항에 따른 지정을 취소할 수 있다.\n  [전문개정 2010. 12. 30.]", "D247-0": "제247조(가산세율) ①법 제241조제4항의 규정에 의한 가산세액은 다음 각호의 율에 의하여 산출한다.\n    1. 법 제241조제3항의 규정에 의한 기한(이하 이 조에서 “신고기한”이라 한다)이 경과한 날부터 20일내에 신고를 한 때에는 당해 물품의 과세가격의 1천분의 5\n    2. 신고기한이 경과한 날부터 50일내에 신고를 한 때에는 당해 물품의 과세가격의 1천분의 10\n    3. 신고기한이 경과한 날부터 80일내에 신고를 한 때에는 당해 물품의 과세가격의 1천분의 15\n    4. 제1호 내지 제3호외의 경우에는 당해 물품의 과세가격의 1천분의 20\n  ②제1항에 따른 가산세액은 500만원을 초과할 수 없다. <개정 2012. 2. 2.>\n  ③신고기한이 경과한 후 보세운송된 물품에 대하여는 보세운송신고를 한 때를 기준으로 제1항의 규정에 의한 가산세율을 적용하며 그 세액은 수입 또는 반송신고를 하는 때에 징수한다.\n  ④ 법 제241조제5항 각 호 외의 부분에서 “반복적으로 자진신고를 하지 아니하는 경우 등 대통령령으로 정하는 사유에 해당하는 경우”란 같은 여행자나 승무원에 대하여 그 여행자나 승무원의 입국일을 기준으로 소급하여 2년 이내에 2회 이상 법 제241조제5항제1호의 경우에 해당하는 사유로 가산세를 징수한 경우를 말한다. <신설 2015. 2. 6.>", "R77-5": "제77조의5(통관고유부호 등의 신청) ① 영 제246조제1항제5호에 따른 통관고유부호, 해외공급자부호 또는 해외구매자부호를 발급받거나 변경하려는 자는 주소, 성명, 사업종류 등을 적은 신청서에 다음 각 호의 서류를 첨부하여 세관장에게 제출하여야 한다. 다만, 세관장이 필요 없다고 인정하는 경우에는 첨부서류의 제출을 생략할 수 있다.\n    1. 사업자등록증\n    2. 해외공급자 또는 해외구매자의 국가ㆍ상호ㆍ주소가 표기된 송품장\n    3. 그 밖에 관세청장이 정하여 고시하는 서류\n  ② 제1항에 따른 통관고유부호, 해외공급자부호 또는 해외구매자부호의 발급절차 및 관리 등에 관하여 필요한 사항은 관세청장이 정한다.\n  [본조신설 2011. 4. 1.]\n  [제77조의4에서 이동 <2015. 7. 16.>]", "R76-2": "제76조의2(원산지증명서 발급 기관 등) ① 법 제232조의2제1항에서 원산지증명서를 발급할 권한이 있는 기관이란 다음 각 호의 자를 말한다.\n    1. 「대외무역법 시행령」 제91조제4항 단서에 따라 원산지증명서 발급 권한을 위임받은 자\n    2. 「대외무역법 시행령」 제91조제10항에 따라 원산지증명서 발급 업무를 위탁받은 자\n  ② 법 제232조의2제1항에 따른 원산지증명서의 발급 요청은 수출물품 선적이 완료되기 전까지 해야 한다. 다만, 과실ㆍ착오 또는 그 밖의 부득이한 사유로 수출물품 선적이 완료되기 전까지 원산지증명서의 발급을 요청하지 못한 경우에는 수출물품 선적일부터 1년의 범위에서 관세청장이 정하여 고시하는 기간 내에 원산지증명서의 발급을 요청할 수 있다.\n  ③ 제1항 및 제2항에서 규정한 사항 외에 원산지증명서의 발급에 필요한 사항은 관세청장이 정하여 고시한다.\n  [본조신설 2025. 3. 21.]"}};
G.edges = G.edges.filter((e) => e[2] !== "k");
{ const used = new Set(); G.edges.forEach(([a, b]) => { used.add(a); used.add(b); }); G.nodes = G.nodes.filter((n) => used.has(n.id)); }
const NS = "http://www.w3.org/2000/svg";
const N = {}; G.nodes.forEach((n) => (N[n.id] = n));
const adj = {}; G.nodes.forEach((n) => (adj[n.id] = []));
G.edges.forEach(([a, b, c], i) => { adj[a].push([b, c, i]); adj[b].push([a, c, i]); });
const ord = (n) => n.no[0] * 1000 + n.no[1];
const LAWN = { L: "법", D: "영", R: "규칙" };

// ---- layout: one circle split into three arcs (법 · 영 · 규칙); chapters in order inside each arc ----
const STEP = 19, CHGAP = 0, LAWGAP = 10, LABW = 270;
const seq = [], segs = [];
for (const law of ["L", "D", "R"]) {
  for (const [ch] of G.chapters) {
    const ns = G.nodes.filter((n) => n.ch === ch && n.law === law).sort((a, b) => ord(a) - ord(b));
    if (!ns.length) continue;
    segs.push({ law, ch, i0: seq.length, i1: seq.length + ns.length - 1 });
    ns.forEach((n) => seq.push(n));
    for (let i = 0; i < CHGAP; i++) seq.push(null);
  }
  for (let i = 0; i < LAWGAP; i++) seq.push(null);
}
const SLOTS = seq.length, RAD = (SLOTS * STEP) / (2 * Math.PI), C = RAD + LABW + 80, SIZE = 2 * C;
const ang = (i) => (i / SLOTS) * 2 * Math.PI - Math.PI / 2 + (LAWGAP / 2 / SLOTS) * 2 * Math.PI;
seq.forEach((n, i) => { if (n) { n.a = ang(i); n.x = C + RAD * Math.cos(n.a); n.y = C + RAD * Math.sin(n.a); } });
const TOTALW = SIZE, TOTALH = SIZE;

// ---- draw ----
const svg = document.getElementById("map");
svg.setAttribute("viewBox", `0 0 ${SIZE} ${SIZE}`);
const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent && parent.appendChild(e); return e; };
const gB = el("g", {}, svg), gE = el("g", {}, svg), gN = el("g", {}, svg);
const arcPath = (r, a0, a1) => { const large = a1 - a0 > Math.PI ? 1 : 0; return `M${C + r * Math.cos(a0)},${C + r * Math.sin(a0)} A${r},${r} 0 ${large} 1 ${C + r * Math.cos(a1)},${C + r * Math.sin(a1)}`; };
const half = Math.PI / SLOTS;
const radLabel = (txt, cls, r, am) => {
  const x = C + r * Math.cos(am), y = C + r * Math.sin(am);
  const t = el("text", { class: cls, x, y, "text-anchor": "middle", "dominant-baseline": "middle" }, gB); t.textContent = txt;
  const deg = (am * 180) / Math.PI + 90; const flip = ((deg % 360) + 360) % 360 > 90 && ((deg % 360) + 360) % 360 < 270;
  t.setAttribute("transform", `rotate(${flip ? deg + 180 : deg} ${x} ${y})`);
};
const bands = [];
segs.forEach((sg, k) => {
  const a0 = ang(sg.i0) - half * 0.8, a1 = ang(sg.i1) + half * 0.8, am = (a0 + a1) / 2;
  el("path", { class: `lawarc ${sg.law}${k % 2 ? " alt" : ""}`, d: arcPath(RAD, a0, a1) }, gB);
  const name = G.chapters.find((c) => c[0] === sg.ch)[1];
  if (sg.i1 - sg.i0 >= 3) radLabel(G.short[sg.ch] || `${sg.ch}`, "chlab", RAD + LABW + 30, am);
  if (sg.law === "L") bands.push({ ch: sg.ch, name, am, a0, a1 });
});
// 법: one wall between neighbouring chapters
{
  const ls = segs.filter((s) => s.law === "L");
  for (let i = 1; i < ls.length; i++) {
    const a = (ang(ls[i - 1].i1) + ang(ls[i].i0)) / 2;
    el("line", { class: "wall", x1: C + (RAD - 22) * Math.cos(a), y1: C + (RAD - 22) * Math.sin(a), x2: C + (RAD + LABW + 10) * Math.cos(a), y2: C + (RAD + LABW + 10) * Math.sin(a) }, gB);
  }
}
for (const law of ["L", "D", "R"]) {
  const ss = segs.filter((s) => s.law === law); const am = (ang(ss[0].i0) + ang(ss[ss.length - 1].i1)) / 2;
  radLabel({ L: "법", D: "시행령", R: "시행규칙" }[law], "lawlab " + law, RAD - 90, am);
}
const lines = G.edges.map(([a, b, c]) => { const A = N[a], B = N[b]; return el("line", { class: c, x1: A.x, y1: A.y, x2: B.x, y2: B.y }, gE); });
const fit = (s, px) => { let w = 0, out = ""; for (const ch of s) { w += /[\x00-\x7f]/.test(ch) ? 6.2 : 11; if (w > px) return out + "…"; out += ch; } return out; };
const nodeEl = {};
for (const n of G.nodes) {
  const deg = (n.a * 180) / Math.PI; const flip = deg > 90 && deg < 270;
  const g = el("g", { class: `node ${n.law}${adj[n.id].length ? "" : " iso"}`, transform: `translate(${n.x},${n.y}) rotate(${flip ? deg + 180 : deg})`, tabindex: 0, role: "button" }, gN);
  el("rect", { class: "hitbox", x: flip ? -LABW : -4, y: -STEP / 2, width: LABW + 4, height: STEP }, g);
  el("circle", { r: 3.2 }, g);
  const t = el("text", { x: flip ? -8 : 8, y: 4, "text-anchor": flip ? "end" : "start" }, g);
  const no = el("tspan", { class: "no" }, t); no.textContent = LAWN[n.law] + n.lab.replace("제", "").replace("조의", "-").replace("조", "") + " ";
  const ti = el("tspan", {}, t); ti.textContent = fit(n.t, LABW - 70);
  el("title", {}, g).textContent = `${LAWN[n.law]} ${n.lab}(${n.t})`;
  g.addEventListener("click", (e) => { e.stopPropagation(); select(n.id); });
  g.addEventListener("keydown", (e) => { if (e.key === "Enter") select(n.id); });
  nodeEl[n.id] = g;
}

// ---- zoom ----
const view = document.getElementById("view");
let z = Math.min((view.clientWidth - 8) / SIZE, (view.clientHeight - 8) / SIZE);
let zMin = z;
/* 크기가 늦게 잡히는 기기 대비: 화면 크기가 정해지면 다시 맞춤 */

// ---- fullscreen toggle ----
{
  const fs = document.getElementById("fs");
  const root = document.documentElement;
  const req = root.requestFullscreen || root.webkitRequestFullscreen;
  const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
  if (!req || document.fullscreenEnabled === false) fs.hidden = true;
  fs.onclick = async () => {
    try {
      if (fsEl()) await (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      else await req.call(root);
    } catch (e) { fs.textContent = "전체화면 불가"; fs.disabled = true; }
  };
  const onChange = () => {
    const on = !!fsEl();
    fs.textContent = on ? "전체화면 끄기" : "전체화면"; fs.setAttribute("aria-pressed", String(on));
    setTimeout(() => {
      const atMin = Math.abs(z - zMin) < 1e-6;

      if (atMin || z < zMin) { z = zMin; applyZoom(false); }

  document.addEventListener("webkitfullscreenchange", onChange);
}
const LOD_Z = 0;
function applyZoom(keepCenter) {

  svg.setAttribute("width", SIZE * z); svg.setAttribute("height", SIZE * z);
  /* 멀리서 볼 때(글자가 6px 미만)는 조문 이름을 숨겨 그리는 양을 줄임 — 저사양 기기 대비 */
  svg.classList.toggle("lod", z < LOD_Z);
  if (keepCenter) { view.scrollLeft = cx * SIZE * z - view.clientWidth / 2; view.scrollTop = cy * SIZE * z - view.clientHeight / 2; }
}
applyZoom(false);
document.getElementById("zi").onclick = () => { z = Math.min(3, z * 1.3); applyZoom(true); };
document.getElementById("zo").onclick = () => { z = Math.max(zMin, z / 1.3); applyZoom(true); };
// svg position inside the scroll area (nonzero only while the svg is smaller than the view and centered)
const offL = () => svg.getBoundingClientRect().left - view.getBoundingClientRect().left + view.scrollLeft;
const offT = () => svg.getBoundingClientRect().top - view.getBoundingClientRect().top + view.scrollTop;
// ---- pinch zoom (two fingers) + ctrl/trackpad wheel zoom ----
const zMax = 3;
const clampZ = (v) => Math.max(zMin, Math.min(zMax, v));
let pinch = null;
const tdist = (t) => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
const tmid = (t) => { const r = view.getBoundingClientRect(); return { x: (t[0].clientX + t[1].clientX) / 2 - r.left, y: (t[0].clientY + t[1].clientY) / 2 - r.top }; };
view.addEventListener("touchstart", (e) => {
  if (e.touches.length !== 2) return;

  svg.style.willChange = "transform"; /* 손가락 확대 중에는 그림을 한 장의 이미지처럼 움직여 부드럽게 */
}, { passive: false });
view.addEventListener("touchmove", (e) => {

  /* 한 화면 그리기(프레임)마다 한 번만 반영 */
  if (!pinch.raf) pinch.raf = requestAnimationFrame(() => { if (!pinch) return; pinch.raf = 0; const q = pinch;
    svg.style.transform = `translate(${ox - ox * q.s + (q.m.x - q.m0.x)}px, ${oy - oy * q.s + (q.m.y - q.m0.y)}px) scale(${q.s})`; });

function endPinch() {

view.addEventListener("touchend", (e) => { if (e.touches.length < 2) endPinch(); });
view.addEventListener("touchcancel", endPinch);
view.addEventListener("wheel", (e) => {

// move from the current view to (cx, cy) at zoom z1: animate with a transform, then commit the real zoom once
let flyAnim = 0;
function flyTo(cx, cy, z1, ms = 450) {
  cancelAnimationFrame(flyAnim);
  svg.style.transform = ""; svg.style.willChange = "transform";
  const W = view.clientWidth, H = view.clientHeight;
  const z0 = z, sl0 = view.scrollLeft, st0 = view.scrollTop, oL = offL(), oT = offT();
  const cx0 = (sl0 + W / 2 - oL) / z0, cy0 = (st0 + H / 2 - oT) / z0;
  const t0 = performance.now();
  const step = (now) => {
    const u = Math.min(1, (now - t0) / ms), e = u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
    const zt = Math.exp(Math.log(z0) + (Math.log(z1) - Math.log(z0)) * e);
    const cxt = cx0 + (cx - cx0) * e, cyt = cy0 + (cy - cy0) * e;
    const s = zt / z0;
    svg.style.transform = `translate(${W / 2 - oL + sl0 - zt * cxt}px, ${H / 2 - oT + st0 - zt * cyt}px) scale(${s})`;
    if (u < 1) { flyAnim = requestAnimationFrame(step); return; }
    svg.style.transform = ""; svg.style.willChange = "";
    z = z1; applyZoom(false);
    view.scrollLeft = cx * z + offL() - W / 2; view.scrollTop = cy * z + offT() - H / 2;
  };
  flyAnim = requestAnimationFrame(step);
}
function goTo(x, y, minZ) { flyTo(x, y, Math.max(z, minZ || 0)); }
const goNode = (n) => { const r = RAD + LABW / 2; goTo(C + r * Math.cos(n.a), C + r * Math.sin(n.a), 0.8); };

// ---- chapter focus: zoom so the chapter's 법 arc and its titles fill the screen ----
function focusChapter(b) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (let i = 0; i <= 24; i++) {
    const a = b.a0 + ((b.a1 - b.a0) * i) / 24;
    for (const r of [RAD - 10, RAD + LABW + 40]) {
      const x = C + r * Math.cos(a), y = C + r * Math.sin(a);
      x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y);
    }
  }
  const z1 = Math.max(zMin, Math.min(zMax, 0.92 * Math.min(view.clientWidth / (x1 - x0), view.clientHeight / (y1 - y0))));
  flyTo((x0 + x1) / 2, (y0 + y1) / 2, z1);
}

// ---- chapter chips ----
const chips = document.getElementById("chips");
for (const b of bands) { const bt = document.createElement("button"); bt.textContent = b.name; bt.onclick = () => focusChapter(b); chips.appendChild(bt); }

// ---- legend toggles ----
for (const [id, c] of [["sp", "p"], ["so", "o"]]) document.getElementById(id).onchange = (e) => svg.classList.toggle("hide-" + c, !e.target.checked);

// ---- selection ----
const panel = document.getElementById("panel"), pc = document.getElementById("pc");
const COLORN = { p: "대통령령 위임", o: "재정경제부령 위임", k: "그 밖의 인용" };
// ---- 원문 비교 ----
const LV = { L: 0, D: 1, R: 2 };
const PFX = { L: "법", D: "영" };
const DELEG = { p: /대통령령(?:으로 정(?:하는|한다|하며|하되|하여|하고|할|한)(?: 바에 따라)?(?: [가-힣ㆍ]+)?)?/g, o: /(?:재정경제부령|기획재정부령)(?:으로 정(?:하는|한다|하며|하되|하여|하고|할|한)(?: 바에 따라)?(?: [가-힣ㆍ]+)?)?/g };
const REFY = /제(\d+)조(?:의(\d+))?/y;
const SEPY = /(?:제\d+항|제\d+호|의\d+|[가-하]목|\([^)]*\)|ㆍ|, |,| 및 | 또는 |부터 |까지| 각 호 외의 부분| 각 호| 단서| 본문| 후단| 전단|·)*/y;
// spans in text t citing article `no` of law prefix P
function citeSpans(t, P, no) {
  const out = []; const re = new RegExp("(?<![가-힣」\\w])" + P + " 제", "g"); let m;
  while ((m = re.exec(t))) {
    if (t.slice(Math.max(0, m.index - 3), m.index).endsWith("같은 ")) continue;
    let pos = m.index + P.length + 1, prev = null, rng = false, hit = false, end = pos;
    for (;;) {
      REFY.lastIndex = pos; const r = REFY.exec(t); if (!r) break;
      const a = +r[1], b = +(r[2] || 0);
      if ((a === no[0] && b === no[1]) || (rng && prev && no[1] === 0 && no[0] > prev && no[0] < a)) hit = true;
      prev = a; pos = REFY.lastIndex; end = pos;
      SEPY.lastIndex = pos; const sp = SEPY.exec(t); const seg = sp ? sp[0] : "";
      rng = seg.includes("부터"); pos += seg.length;
      if (seg.length) { const tail = seg.replace(/[\s,ㆍ·]+$|(?:및|또는)\s*$/g, ""); end = pos - (seg.length - tail.length); }
      if (seg.includes("까지")) { REFY.lastIndex = pos; if (!REFY.exec(t)) break; }
    }
    if (hit) {
      const tail = /^(?:에서|에 따른|에 따라|에 의한|의 규정에 의하여|의 규정에 의한|의 규정에 따라|의 규정에 따른)/.exec(t.slice(end));
      out.push([m.index, end + (tail ? tail[0].length : 0)]);
    }
    re.lastIndex = Math.max(re.lastIndex, end);
  }
  return out;
}
function delegSpans(t, c) { const out = []; const re = new RegExp(DELEG[c].source, "g"); let m; while ((m = re.exec(t))) out.push([m.index, m.index + m[0].length]); return out; }
// render article text with marks: spans = [[s,e,cls]]
function renderArt(t, spans) {
  spans.sort((a, b) => a[0] - b[0]);
  const merged = []; for (const sp of spans) { const l = merged[merged.length - 1]; if (l && sp[0] < l[1]) { l[1] = Math.max(l[1], sp[1]); } else merged.push([...sp]); }
  let html = "", i = 0;
  for (const [a, b, c] of merged) { html += esc(t.slice(i, a)) + `<mark class="${c}">` + esc(t.slice(a, b)) + "</mark>"; i = b; }
  html += esc(t.slice(i));
  return html.split("\n").map((ln, k) => {
    let cls = "";
    if (/^ {6}/.test(ln)) cls = "mok"; else if (/^ {4}/.test(ln)) cls = "ho";
    let x = ln.trim();
    if (k === 0) x = x.replace(/^제\d+조(?:의\d+)?\([^)]*\)\s*/, "");
    if (/^\[/.test(x)) cls = "nt";
    x = x.replace(/(&lt;(?:개정|신설|본조신설|전문개정|타법개정)[^&]*?&gt;)/g, '<span class="am">$1</span>');
    return `<p class="${cls}">${x}</p>`;
  }).join("");
}
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// marks for article X with respect to linked article Y (edge color c)
function marksFor(X, Y, c) {
  const t = G.texts[X.id] || "";
  if (LV[X.law] < LV[Y.law]) return delegSpans(t, c).map((s) => [...s, c]);           // X 위임하는 쪽: 대통령령/재경부령 문구
  return citeSpans(t, PFX[Y.law], Y.no).map((s) => [...s, c]);                        // X 위임받는 쪽: 상위 조문 인용 문구
}
const LAWFULL = { L: "관세법", D: "관세법 시행령", R: "관세법 시행규칙" };
function artCard(X, spans, edgeC) {
  const tag = edgeC ? `<span class="tag ${edgeC}">${edgeC === "p" ? "대통령령" : "재정경제부령"}</span>` : "";
  return `<div class="art ${X.law}"><h3>${tag}<span>${LAWFULL[X.law]} ${X.lab}(${esc(X.t)})</span></h3><div class="tx">${renderArt(G.texts[X.id] || "", spans)}</div></div>`;
}
function openCompare(id) {
  const n = N[id];
  const links = adj[id].map(([m, c]) => [N[m], c]).sort((a, b) => LV[a[0].law] - LV[b[0].law] || ord(a[0]) - ord(b[0]));
  const leftSpans = []; links.forEach(([m, c]) => leftSpans.push(...marksFor(n, m, c)));
  document.getElementById("cl").innerHTML = `<div class="colt">선택한 조문</div>` + artCard(n, leftSpans);
  document.getElementById("cr").innerHTML = `<div class="colt">연결된 조문 ${links.length}개</div>` + links.map(([m, c]) => artCard(m, marksFor(m, n, c), c)).join("");
  document.getElementById("cmpt").textContent = `원문 비교 · ${LAWN[n.law]} ${n.lab}(${n.t})`;
  const cmp = document.getElementById("cmp"); cmp.hidden = false;
  document.getElementById("cl").scrollTop = 0; document.getElementById("cr").scrollTop = 0; cmp.querySelector(".cols").scrollTop = 0;
  document.getElementById("cmpx").focus();
}
document.getElementById("cmpx").onclick = () => (document.getElementById("cmp").hidden = true);
document.addEventListener("keydown", (e) => { if (e.key === "Escape") document.getElementById("cmp").hidden = true; });

function select(id) {
  svg.classList.add("focus");
  document.querySelectorAll(".on,.me").forEach((e) => e.classList.remove("on", "me"));
  const n = N[id]; nodeEl[id].classList.add("on", "me");
  for (const [m, c, i] of adj[id]) { nodeEl[m].classList.add("on"); lines[i].classList.add("on"); }
  const groups = { L: [], D: [], R: [] };
  adj[id].forEach(([m, c]) => groups[N[m].law].push([N[m], c]));
  let h = `<h2>${LAWN[n.law]} ${n.lab}(${n.t})</h2><div class="note">제${n.ch}장 · 연결 ${adj[id].length}개</div>`;
  for (const k of ["L", "D", "R"]) {
    if (!groups[k].length) continue;
    groups[k].sort((a, b) => ord(a[0]) - ord(b[0]));
    h += `<h3>${{ L: "법", D: "시행령", R: "시행규칙" }[k]}</h3><ul>` + groups[k].map(([m, c]) => `<li data-id="${m.id}" title="${COLORN[c]}"><i style="background:var(--${c})"></i>${m.lab}(${m.t})</li>`).join("") + "</ul>";
  }
  if (!adj[id].length) h += `<p class="note">위임으로 이어진 다른 단계 조문이 없습니다.</p>`;
  if (adj[id].length) h += `<button class="cmpbtn" id="cmpgo">원문 비교</button>`;
  pc.innerHTML = h; panel.hidden = false;
  const cg = document.getElementById("cmpgo"); if (cg) cg.onclick = () => openCompare(id);
  pc.querySelectorAll("li").forEach((li) => (li.onclick = () => { const m = N[li.dataset.id]; select(m.id); goNode(m); }));
}
function clearSel() { svg.classList.remove("focus"); document.querySelectorAll(".on,.me").forEach((e) => e.classList.remove("on", "me")); showIntro(); }
function showIntro() {
  pc.innerHTML = `<h2>사용법</h2><p class="note" style="margin:0">조문을 누르면 이어진 조문만 진하게 보이고, 목록에서 다시 누르면 그 조문으로 이동합니다. 빈 곳을 누르면 선택이 풀립니다. 위임으로 이어진 조문만 담았습니다.<br>법 ${G.nodes.filter(n=>n.law==="L").length} · 영 ${G.nodes.filter(n=>n.law==="D").length} · 규칙 ${G.nodes.filter(n=>n.law==="R").length}개 조문, 선 ${G.edges.length}개</p>`;
}
svg.addEventListener("click", clearSel);
document.getElementById("px").onclick = () => (panel.hidden = true);
showIntro();

// ---- search: "법 30", "영 17의2", "규칙 4", or title words ----
document.getElementById("q").addEventListener("keydown", (e) => {
  if (e.key !== "Enter") return;
  const v = e.target.value.trim(); if (!v) return;
  document.querySelectorAll(".hit").forEach((x) => x.classList.remove("hit"));
  const m = v.replace(/\s+/g, "").match(/^(법|영|시행령|규칙|시행규칙)?제?(\d+)(?:조)?(?:의(\d+))?$/);
  let hits;
  if (m) {
    const law = { 법: "L", 영: "D", 시행령: "D", 규칙: "R", 시행규칙: "R" }[m[1]] || "L";
    hits = G.nodes.filter((n) => n.law === law && n.no[0] === +m[2] && n.no[1] === +(m[3] || 0));
  } else hits = G.nodes.filter((n) => n.t.includes(v));
  hits.forEach((n) => nodeEl[n.id].classList.add("hit"));
  if (hits.length) { select(hits[0].id); goNode(hits[0]); }
});
